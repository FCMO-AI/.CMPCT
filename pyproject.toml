[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpct"
version = "0.29.0"
description = "Compact archive format prototype with adaptive codecs, deduplication, streaming access, and recovery metadata"
authors = [{ name = "FCMO AI" }]
requires-python = ">=3.10"
dependencies = ["zstandard>=0.22", "msgpack>=1.0"]

# Footnote: stewardship is expressed through standard package metadata and durable project URLs rather
# than promotional text inside runtime code. This keeps provenance discoverable without turning imports,
# CLI output, or algorithm modules into advertising surfaces.
[project.urls]
Homepage = "https://fcmo-ai.github.io/.CMPCT/"
Repository = "https://github.com/FCMO-AI/.CMPCT"
"FCMO AI" = "https://github.com/FCMO-AI"

[project.optional-dependencies]
audio = ["numpy>=1.26", "soundfile>=0.12"]
# The regression suite executes the deterministic neutral/hostile corpus producer directly.  Keep its
# import-time document/image dependencies in the test environment so `pip install -e '.[test]'` is a
# complete test contract rather than relying on workflow-specific packages to make one test importable.
test = [
  "pytest>=8",
  "numpy>=1.26",
  "pillow>=12.3.0",
  "reportlab>=5.0.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
]

[project.scripts]
cmpct = "cmpct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
