[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpct"
version = "0.27.1"
description = "Experimental general-purpose content-aware archive format and engine"
requires-python = ">=3.11"
dependencies = ["msgpack>=1.0"]

[project.optional-dependencies]
audio = ["numpy>=1.26", "soundfile>=0.12"]
test = ["pytest>=8"]

[project.scripts]
cmpct = "cmpct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
