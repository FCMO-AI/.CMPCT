# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: CMPCT J24G51 signed hardlink inode-xattr contradiction court
on:
  push:
    branches:
      - agent/phased2-v031-j24g51-hardlink-fsmeta-inode-court-20261029
  pull_request:
    branches:
      - agent/phased2-v031-j24g50-zstd-fsmeta-integrity-compose-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24g51-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hardlink-inode-contradiction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G51_EVIDENCE_DIR: evidence/physical
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock exact source and prospective preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor 82f41251d6f17f8399b65993ff7e8b94e120a543 HEAD
          git merge-base --is-ancestor 47c9a4d61cd764aa4252cad741f4b22537106c60 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 84f1c0602c7a9679cd79a0a5de984b169a467903
          test "$(git rev-parse HEAD:src/cmpct/transactions.py)" = 3eef7fdc3f6deca5ddd6d9edf1292c7e2c864f11
          test "$(git rev-parse HEAD:src/cmpct/native_codec.py)" = 1dd853c111410726e051adc48ee59392a4cbd5fb
          mkdir -p evidence/physical
          git rev-parse HEAD > evidence/head.txt
          git rev-parse HEAD:src/cmpct/reader.py > evidence/reader-blob.txt
          git rev-parse HEAD:src/cmpct/validation.py > evidence/validator-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CMPCT native package and independent referee dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'pytest>=8' 'zstandard>=0.22'
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import cmpct.reader as rd, cmpct.validation as val, cmpct.builder as bu
          for path, module in [('src/cmpct/reader.py',rd),
                               ('src/cmpct/validation.py',val),
                               ('src/cmpct/builder.py',bu)]:
              source=Path(path).read_bytes().replace(b'\r\n',b'\n')
              installed=Path(module.__file__).read_bytes().replace(b'\r\n',b'\n')
              assert source == installed, (path,module.__file__)
              print('SOURCE_EQ',path,hashlib.sha256(source).hexdigest())
          PY
      - name: Physical paired positive and signed contradictory inode metadata extraction
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -s --junitxml=evidence/test.xml             tests/test_v031_j24g51_hardlink_fsmeta_inode.py 2>&1 | tee evidence/test.log
      - name: Independent physical r24 wire referee
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/physical/compatible.cmpct
          test -s evidence/physical/contradictory.cmpct
          test -s evidence/physical/result.json
          python research/j24g51/audit_wire.py evidence/physical 2>&1 | tee evidence/referee.log
          test -s evidence/physical/independent-referee.json
      - name: Retain raw physical specimens and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g51-hardlink-fsmeta-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
