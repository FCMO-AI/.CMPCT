# ci-lane: deep
name: CMPCT v0.30 logs inverse-edge high-level oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_logs_inverse_edge_high_level_oracle.py'
      - 'benchmarks/v030_logs_inverse_edge_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - '.github/workflows/v030-logs-inverse-edge-high-level-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-inverse-high-level-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  logs-inverse-high-level:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile high-level continuation
        run: |
          python -m py_compile \
            benchmarks/v030_logs_inverse_edge_oracle.py \
            benchmarks/v030_logs_inverse_edge_high_level_oracle.py
      - name: Run exact-tree high-level inverse-edge sweep
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_inverse_edge_high_level_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-inverse-high-level-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-inverse-high-level.json"
      - name: Enforce unchanged release-floor, timing, restoration and locality contract
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-logs-inverse-high-level.json')
          assert p.is_file(), 'logs inverse high-level evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-logs-inverse-edge-high-level-oracle-v1'
          assert d['claim_boundary'].startswith('research-only')
          assert d['target']=='neutral_hostile_v1/05_logs_and_telemetry'
          assert d['accepted_v029_bytes']==3550609
          assert d['levels']==[9,12,15,17,19]
          assert d['max_member_read_amplification'] <= 8.0
          assert d['max_decode_unit_bytes'] <= 8*1024*1024
          s=d['summary']
          assert s['all_tree_verified'] is True
          assert s['all_locality_green'] is True
          assert len(d['candidates'])==5
          for c in d['candidates']:
              assert c['tree_verified'] is True
              assert c['locality_green'] is True
              assert c['max_member_read_amplification'] <= 8.0
              assert c['max_decode_unit_bytes'] <= 8*1024*1024
              assert abs(c['create_s']-(c['source_plan_s']+c['candidate_encode_s'])) < 1e-9
              strict=all(c[k] for k in ('beats_zip_size','beats_zstd19_size','beats_zip_create','beats_zstd19_create'))
              expected=strict and c['no_regression_vs_v029'] and c['locality_green']
              assert c['viable'] is expected
          if s['release_floor_four_way_win']:
              b=s['best']
              assert b is not None and b['viable'] is True
              assert b['archive_bytes'] <= d['accepted_v029_bytes']
              assert b['archive_bytes'] < d['zip']['archive_bytes']
              assert b['archive_bytes'] < d['tar_zstd19']['archive_bytes']
              assert b['create_s'] < d['zip']['create_s']
              assert b['create_s'] < d['tar_zstd19']['create_s']
          PY
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-logs-inverse-high-level-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-inverse-high-level.json
          if-no-files-found: error
          retention-days: 90
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-inverse-edge-high-level-oracle.yml

# Research only. The existing inverse-edge grammar and all frozen floors remain unchanged; a red result is kept as
# negative evidence instead of relaxing v0.29, ZIP/Zstd, locality or integrity requirements.
