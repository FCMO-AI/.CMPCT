# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 G0-G4 ML operation record-cache A/B

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/patches/v030_g04_operation_record_cache.patch'
      - 'benchmarks/v030_g04_ml_operation_record_cache_ab_oracle.py'
      - 'benchmarks/v030_g04_ml_native_reader_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'native/cmpct-portable/src/**.rs'
      - 'native/cmpct-portable/Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'experiments/entropygraph_v030_native_reader_bridge.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - '.github/workflows/v030-g04-ml-operation-record-cache-ab.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/patches/v030_g04_operation_record_cache.patch'
      - 'benchmarks/v030_g04_ml_operation_record_cache_ab_oracle.py'
      - 'benchmarks/v030_g04_ml_native_reader_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'native/cmpct-portable/src/**.rs'
      - 'native/cmpct-portable/Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'experiments/entropygraph_v030_native_reader_bridge.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - '.github/workflows/v030-g04-ml-operation-record-cache-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-g04-ml-operation-record-cache-ab-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/patches/v030_g04_operation_record_cache\.patch|benchmarks/v030_g04_ml_(operation_record_cache_ab_oracle|native_reader_oracle)\.py|benchmarks/v030_release_performance\.py|native/cmpct-portable/(src/.*\.rs|Cargo\.toml)|Cargo\.lock|pyproject\.toml|experiments/entropygraph_v030_(native_reader_bridge|release_product|release_reader)\.py|\.github/workflows/v030-g04-ml-operation-record-cache-ab\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect the ML operation-cache A/B.'
          fi

  native-ab:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: cmpct-v030-g04-ml-operation-record-cache-ab-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deterministic ML-corpus dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle and build exact baseline CLI
        run: |
          python -m py_compile benchmarks/v030_g04_ml_operation_record_cache_ab_oracle.py
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo build --manifest-path native/cmpct-portable/Cargo.toml --release --bin cmpct-portable
          cp "$RUNNER_TEMP/baseline-target/release/cmpct-portable" "$RUNNER_TEMP/cmpct-portable-baseline"
      - name: Apply locality-neutral candidate and prove it compiles
        run: |
          git apply --check --recount benchmarks/patches/v030_g04_operation_record_cache.patch
          git apply --recount benchmarks/patches/v030_g04_operation_record_cache.patch
          cargo fmt --manifest-path native/cmpct-portable/Cargo.toml -- --check
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo build --manifest-path native/cmpct-portable/Cargo.toml --release --bin cmpct-portable
          cp "$RUNNER_TEMP/candidate-target/release/cmpct-portable" "$RUNNER_TEMP/cmpct-portable-candidate"
      - name: Preserve native G0-G4 correctness after candidate patch
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo test --manifest-path native/cmpct-portable/Cargo.toml g04 --release
      - name: Run exact baseline-vs-candidate ML A/B with interruption-safe checkpoints
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_g04_ml_operation_record_cache_ab_oracle.py \
            --baseline-cli "$RUNNER_TEMP/cmpct-portable-baseline" \
            --candidate-cli "$RUNNER_TEMP/cmpct-portable-candidate" \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-operation-record-cache-work" \
            --checkpoint "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-operation-record-cache-checkpoint.json" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-operation-record-cache.json"
      - name: Enforce binary binding, identity, hostile rejection and honest terminal decision
        if: always()
        run: |
          test -f benchmark-artifacts/v030-g04-ml-operation-record-cache.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-g04-ml-operation-record-cache.json').read_text())
          assert d['schema']=='cmpct-v030-g04-ml-operation-record-cache-ab-v5'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='neutral_hostile_v1/09_ml_artifacts'
          assert d['diagnosis']=='D2' and d['radicality']=='R2' and int(d['rps'])>=80
          assert int(d['rounds'])==7
          b=d['binary_sha256']; c=d['contract']; g=d['gate']
          assert len(b['baseline'])==64 and len(b['candidate'])==64 and b['baseline'] != b['candidate']
          assert g['distinct_measured_binaries'] is True
          assert c['record_cache_limit_bytes']==64*1024*1024
          assert c['node_cache_scope']=='fresh per member'
          assert c['member_locality_charged_on_shared_record_hit'] is True
          assert c['selective_member_cache_scope']=='fresh per member'
          assert c['complete_verify_cache_scope']=='one bounded cache per verify operation'
          assert c['complete_extract_cache_scope']=='one bounded cache per extract operation'
          assert c['archive_bytes_changed'] is False and c['grammar_changed'] is False
          assert c['terminal_decision_requires_all_rounds'] is True
          assert g['same_archive_bytes'] is True and g['same_public_info'] is True and g['same_extracted_tree'] is True
          assert g['baseline_corruption_rejected'] is True and g['candidate_corruption_rejected'] is True
          assert d['release_credit'] is False
          expected=(float(d['verify_improvement_fraction'])>=float(c['minimum_verify_improvement_fraction']) and float(d['extract_improvement_fraction'])>=float(c['minimum_extract_improvement_fraction']))
          assert d['promotion_signal'] is expected and g['passed'] is expected
          assert d['terminal_decision']==('PROMOTE_NEXT_PREREQUISITE' if expected else 'RETIRE_FAMILY')
          PY
      - name: Validate any interruption-safe checkpoint without granting it terminal authority
        if: always()
        run: |
          if [ -f benchmark-artifacts/v030-g04-ml-operation-record-cache-checkpoint.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-g04-ml-operation-record-cache-checkpoint.json').read_text())
          assert d['schema']=='cmpct-v030-g04-ml-operation-record-cache-checkpoint-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert 0 <= int(d['completed_rounds']) <= int(d['planned_rounds']) == 7
          assert d['terminal_decision'] is None
          assert d['promotion_signal'] is False
          assert d['release_credit'] is False
          PY
          fi
      - name: Restore exact repository tree before policy checks
        if: always()
        run: git reset --hard "$EVIDENCE_HEAD"
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-g04-ml-operation-record-cache-ab.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact A/B and diagnostic checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-g04-ml-operation-record-cache-ab-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-g04-ml-operation-record-cache.json
            benchmark-artifacts/v030-g04-ml-operation-record-cache-checkpoint.json
          if-no-files-found: error
          retention-days: 90

# Research-only exact receipt. A pass can authorize productizing bounded operation-scoped decoded-record ownership;
# it cannot itself earn release credit or alter selector/locality/grammar policy. Seven complete rounds still own the
# terminal decision. Per-round checkpoints are diagnostic custody only and explicitly cannot promote the candidate.
# Exact-head admission touch: execute the frozen seven-round A/B on this production-equivalent fingerprint; no experiment contract or threshold changes.
# Re-admission after the prior classifier was superseded before job admission; preserve this exact receipt before any later branch write.
