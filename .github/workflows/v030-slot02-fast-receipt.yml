# ci-lane: fast
name: CMPCT v0.30 slot-02 fast receipt

on:
  push:
    branches:
      - agent/v030-coop-evidence-performance
    paths:
      - '.github/workflows/v030-slot02-fast-receipt.yml'

permissions:
  contents: write

concurrency:
  group: cmpct-v030-slot02-fast-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install fast-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run slot-02 compile and contract tests
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          {
            echo '$ python -m py_compile benchmarks/v030_release_ablation_canonical.py benchmarks/v030_perf_worker_canonical.py benchmarks/v030_release_selective_read_canonical.py'
            python -m py_compile \
              benchmarks/v030_release_ablation_canonical.py \
              benchmarks/v030_perf_worker_canonical.py \
              benchmarks/v030_release_selective_read_canonical.py
            echo
            echo '$ python -m pytest -q tests/test_v030_release_ablation_contract.py tests/test_v030_release_selective_read_contract.py'
            python -m pytest -q \
              tests/test_v030_release_ablation_contract.py \
              tests/test_v030_release_selective_read_contract.py
            echo
            echo '$ python tools/check_public_surface.py'
            python tools/check_public_surface.py
          } 2>&1 | tee benchmark-artifacts/t02-fast.txt
      - name: Run exact coordinator topology command
        run: |
          set -o pipefail
          {
            echo '$ python tools/check_ci_topology.py <17 coordinator-listed v0.30 workflows>'
            python tools/check_ci_topology.py \
              .github/workflows/geometry-v030-breakthrough.yml \
              .github/workflows/v030-authoritative-pr-gates.yml \
              .github/workflows/v030-authoritative-v2-pr.yml \
              .github/workflows/v030-canonical-authority.yml \
              .github/workflows/v030-external-competitors.yml \
              .github/workflows/v030-g04-overlay-oracle.yml \
              .github/workflows/v030-geometry-overlay-oracle.yml \
              .github/workflows/v030-gir-build-rehab.yml \
              .github/workflows/v030-gir-focused-complete.yml \
              .github/workflows/v030-gir-hardening.yml \
              .github/workflows/v030-hierarchical-geometry.yml \
              .github/workflows/v030-prefixgraph-oracle.yml \
              .github/workflows/v030-release-fuzz.yml \
              .github/workflows/v030-release-generalization.yml \
              .github/workflows/v030-release-performance.yml \
              .github/workflows/v030-release-reader.yml \
              .github/workflows/v030-shared-portfolio-rehab.yml
            echo
            echo '$ python tools/check_ci_topology.py .github/workflows/v030-coop-evidence-performance.yml'
            python tools/check_ci_topology.py .github/workflows/v030-coop-evidence-performance.yml
          } 2>&1 | tee benchmark-artifacts/t02-topology.txt
      - name: Commit immutable fast/topology receipt and remove helper
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, platform, sys

          fast = Path('benchmark-artifacts/t02-fast.txt').read_text(encoding='utf-8')
          topology = Path('benchmark-artifacts/t02-topology.txt').read_text(encoding='utf-8')
          out = Path('docs/v030-coordination/handoffs/20260818T0645Z-T02-fast-topology-receipt.md')
          out.write_text(
              '# T02 fast / topology receipt\n\n'
              f'- Source SHA: `{os.environ["SOURCE_SHA"]}`\n'
              f'- GitHub Actions run: `{os.environ["RUN_ID"]}` attempt `{os.environ["RUN_ATTEMPT"]}`\n'
              f'- Python: `{sys.version.split()[0]}`\n'
              f'- Platform: `{platform.platform()}`\n'
              f'- Runner: `{os.environ.get("RUNNER_OS")}/{os.environ.get("RUNNER_ARCH")}`\n'
              '- Result: **PASS** — this file is committed only after every command below exits zero.\n\n'
              '## Fast contract output\n\n```text\n' + fast + '\n```\n\n'
              '## Exact topology checker output\n\n```text\n' + topology + '\n```\n\n'
              'Footnote: this receipt proves the slot-02 harness contracts and CI topology on the source SHA above. '
              'It does not claim final product/compression/runtime/competitor authority; those remain bound to the '
              'exact T00 reconciled candidate after corrected T01/T03 import.\n',
              encoding='utf-8',
          )
          PY
          git rm .github/workflows/v030-slot02-fast-receipt.yml
          git add docs/v030-coordination/handoffs/20260818T0645Z-T02-fast-topology-receipt.md
          git config user.name 'cmpct-slot02-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'evidence: record slot-02 fast topology receipt'
          git push origin HEAD:agent/v030-coop-evidence-performance

# Footnote: this workflow is intentionally one-shot and self-removing. A durable receipt exists only after its
# compile/tests/public-surface/topology commands all return zero; a queued, cancelled or failed run leaves no
# passing receipt to mis-credit.
