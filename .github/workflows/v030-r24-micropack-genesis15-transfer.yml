# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Genesis15 micropack transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r24_micropack_genesis15_transfer.py'
      - 'docs/V030_R24_MICROPACK_GENESIS15_TRANSFER_2026-09-12.md'
      - '.github/workflows/v030-r24-micropack-genesis15-transfer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_micropack_genesis15_transfer.py'
      - 'docs/V030_R24_MICROPACK_GENESIS15_TRANSFER_2026-09-12.md'
      - '.github/workflows/v030-r24-micropack-genesis15-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-genesis15-micropack-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r24_micropack_genesis15_transfer\.py|docs/V030_R24_MICROPACK_GENESIS15_TRANSFER_2026-09-12\.md|\.github/workflows/v030-r24-micropack-genesis15-transfer\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  genesis15-transfer:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r24_micropack_genesis15_transfer.py
      - name: Execute exact Genesis15 transfer referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_micropack_genesis15_transfer.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-genesis15-micropack-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-genesis15-micropack.json"
      - name: Enforce receipt integrity, never manufacture product evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-genesis15-micropack.json').read_text())
          assert d['schema']=='cmpct-v030-r24-micropack-genesis15-transfer-v1'
          assert d['release_credit'] is False
          assert d['verdict'] in {
              'GENESIS15_MICROPACK_GENERALIZES',
              'GENESIS15_MICROPACK_NEEDS_ECONOMIC_ADMISSION',
              'RETIRE_GENESIS15_MICROPACK_TRANSFER',
              'INVALID_GENESIS15_INPUT_SEAL',
          }
          if d['verdict'] != 'INVALID_GENESIS15_INPUT_SEAL':
              assert d['experiment_valid'] is True and d['corpus_seal_pass'] is True
              assert len(d['rows']) == 15
              assert d['expected_logical_bytes'] == 265969714
          else:
              assert d['experiment_valid'] is False and d['corpus_seal_pass'] is False
          PY
      - name: Expose decisive Genesis15 summary
        id: receipt
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-genesis15-micropack.json').read_text())
          if d['verdict']=='INVALID_GENESIS15_INPUT_SEAL':
              mismatches=sum(1 for row in d['seal'] if not row['match'])
              print(f'artifact_name=v030-genesis15-invalid-seal-mismatches{mismatches}')
          else:
              a=d['aggregate']
              short={
                  'GENESIS15_MICROPACK_GENERALIZES':'generalizes',
                  'GENESIS15_MICROPACK_NEEDS_ECONOMIC_ADMISSION':'needs-admission',
                  'RETIRE_GENESIS15_MICROPACK_TRANSFER':'retire',
              }[d['verdict']]
              print(f"artifact_name=v030-genesis15-{short}-delta{a['delta_bytes']}-wins{a['grouped_wins']}-ties{a['zero_group_ties']}-fails{len(d['economic_failures'])}")
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r24-micropack-genesis15-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ steps.receipt.outputs.artifact_name || 'v030-genesis15-no-summary' }}-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-genesis15-micropack.json
          if-no-files-found: error
          retention-days: 90

# Research-only. Green means receipt integrity, not scientific victory.
