name: CMPCT1 ONE-G0.2 compact observer handoff

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - experiments/one/native_observe.py
      - experiments/one/native_observe_kernel.c
      - experiments/one/native_observe_view.py
      - benchmarks/one/one_g02_compact_observer_handoff_writer.py
      - tests/one/test_native_observe_view.py
      - tests/one/test_compact_observer_handoff_writer.py
      - docs/one/evidence/ONE_G02_COMPACT_OBSERVER_HANDOFF_WRITER_PREREG_2026-09-08.md
      - .github/workflows/cmpct1-one-g02-compact-observer-handoff.yml
  workflow_dispatch:

jobs:
  compact-observer-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind evidence to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f experiments/one/native_observe_view.py
          test -f benchmarks/one/one_g02_compact_observer_handoff_writer.py
          test -f tests/one/test_native_observe_view.py
          test -f tests/one/test_compact_observer_handoff_writer.py
          grep -q '1 << 20' benchmarks/one/one_g02_compact_observer_handoff_writer.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Prove compact-view and whole-writer semantics
        run: >-
          python -m pytest -q
          tests/one/test_native_observe_view.py
          tests/one/test_compact_observer_handoff_writer.py

      - name: Run frozen whole-writer falsifier
        shell: bash
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_compact_observer_handoff_writer \
            | tee one_g02_compact_observer_handoff_writer.json

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-compact-observer-handoff-${{ env.EVIDENCE_HEAD }}
          path: one_g02_compact_observer_handoff_writer.json
          if-no-files-found: warn
