# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 J24H01 signed forward-hardlink extraction court
on:
  pull_request:
    paths:
      - 'tests/test_j24h01_forward_hardlink_court.py'
      - 'docs/v031-research/2026-10-27-j24h01-*'
      - '.github/workflows/v031-j24h01-forward-hardlink-court.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24h01-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-r24:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Pin source and test identity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          git hash-object src/cmpct/reader.py > evidence/reader-blob.txt
          git hash-object src/cmpct/validation.py > evidence/validation-blob.txt
          git hash-object tests/test_j24h01_forward_hardlink_court.py > evidence/court-blob.txt
          python -V > evidence/python-version.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentic CMPCT package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Fully signed forward-hardlink control and counterexample
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -s --noconftest tests/test_j24h01_forward_hardlink_court.py 2>&1 | tee evidence/j24h01-court.txt
      - name: Preserve observations, including environmental failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24h01-${{ matrix.os }}-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
