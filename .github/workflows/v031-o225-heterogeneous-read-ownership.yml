# ci-lane: fast
# O225: source-exact research-only heterogeneous read ownership; no product mutation.
name: CMPCT O225 heterogeneous read ownership court
on:
  push:
    branches:
      - agent/phased3-v031-o225-heterogeneous-read-ownership-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o225-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heterogeneous-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact scientific source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify source identity and immutable prereg before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD
          git merge-base --is-ancestor 294c9a460a49f8829dd50fe7996c78709ad61b11 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = dbd4ac576a05a47eae97e1e40de89cf1de440516
          test "$(git rev-parse HEAD:tests/test_o215_fixed_chunk_admission.py)" = a8efaebd9fff8b3203cfd55304d365c309ff394b
          test "$(git rev-parse HEAD:tests/test_o214_cdc_admission.py)" = ce5bb0c6da2f6d38dcf2b32956b6dfc08e05eaec
          mkdir -p o225-evidence
          git rev-parse HEAD > o225-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > o225-evidence/reader.blob
          git rev-parse HEAD:research/o225_heterogeneous_read_ownership_court.py > o225-evidence/instrument.blob
          git rev-parse HEAD:research/o225_independent_read_ownership_audit.py > o225-evidence/auditor.blob
          git diff --stat c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD > o225-evidence/diff-stat.txt
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scientific scripts and install unchanged Reader
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/o225_heterogeneous_read_ownership_court.py research/o225_independent_read_ownership_audit.py
          python -m pip install .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import cmpct.reader,hashlib,inspect,os
          from pathlib import Path
          installed=Path(inspect.getfile(cmpct.reader)).resolve()
          original=Path(os.environ["GITHUB_WORKSPACE"])/"src/cmpct/reader.py"
          norm=lambda p:p.read_bytes().replace(b"\r\n",b"\n")
          assert installed!=original.resolve()
          assert norm(installed)==norm(original)
          print("INSTALLED_READER_SHA256="+hashlib.sha256(norm(installed)).hexdigest())
          PY
      - name: Execute fresh-process authentic multi-codec experiment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o225_heterogeneous_read_ownership_court.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/o225-evidence/results.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/o225-evidence/run.log"
      - name: Independently audit immutable raw observations and outcome
        shell: bash
        run: |
          set -euo pipefail
          python research/o225_independent_read_ownership_audit.py o225-evidence/results.json \
            | tee o225-evidence/audit.json
      - name: Preserve original evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o225-authenticated-reader-heterogeneous-${{ github.sha }}
          path: o225-evidence/
          if-no-files-found: warn
