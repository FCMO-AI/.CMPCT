# ci-lane: fast
# Run on every head, including documentation-only heads; no historical gate weakening.
name: CMPCT J24G41 native Darwin xattr physical fidelity

on:
  push:
    branches:
      - agent/phased2-v031-j24g41-darwin-xattr-provider-20261029
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24g41-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-locked-physical:
    name: installed xattr custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real candidate package and test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Assert exact checkout and installed source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # Windows checkout may materialize CRLF while Git blobs store LF.
          # Git diff enforces HEAD content; compare wheel to actual checkout bytes.
          git diff --exit-code -- src/cmpct/builder.py src/cmpct/reader.py src/cmpct/_xattrs.py
          python - <<'PY'
          import hashlib, pathlib
          import cmpct.builder as builder
          import cmpct.reader as reader
          import cmpct._xattrs as native
          for path, mod in (
              ("src/cmpct/builder.py", builder),
              ("src/cmpct/reader.py", reader),
              ("src/cmpct/_xattrs.py", native),
          ):
              observed = pathlib.Path(mod.__file__).read_bytes()
              expected = pathlib.Path(path).read_bytes()
              assert observed == expected, f"installed wheel != verified checkout for {path}"
              print(path, hashlib.sha256(observed).hexdigest())
          PY
      - name: Run original O65/O72 tests plus required physical native court
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/court
          cp tests/test_v031_j24g41_darwin_xattrs.py evidence/court/
          cp tests/test_v031_o72_xattr_closed_loop.py evidence/court/
          cp tests/test_v031_o65_xattr_capture.py evidence/court/
          python -m pytest -q evidence/court --junitxml=evidence/results.xml 2>&1 | tee evidence/test-log.txt
      - name: Admit physical positives with independent JUnit parser
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f evidence/results.xml; then
            python research/j24g41/audit_junit.py evidence/results.xml evidence/audit.json
          else
            echo "No JUnit; physical fidelity proof absent" >&2
            exit 1
          fi
      - name: Preserve raw physical results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g41-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
