# ci-lane: narrow
name: CMPCT1 ONE-G0.2 authenticated complete archive envelope

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/authenticated_archive_envelope.py
      - experiments/one/archive_envelope.py
      - experiments/one/auth_tree.py
      - experiments/one/authenticated_native_selective_cone.py
      - experiments/one/native_law_range_plan.py
      - experiments/one/validated_program.py
      - tests/one/test_authenticated_archive_envelope.py
      - tests/one/test_archive_envelope.py
      - docs/one/evidence/ONE_G02_AUTHENTICATED_ARCHIVE_ENVELOPE_PREREG_2026-09-09.md
      - .github/workflows/cmpct1-one-g02-authenticated-archive-envelope.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-authenticated-archive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install repository test surface
        run: python -m pip install -e '.[test]'
      - name: Run authenticated archive composition plus inherited semantics
        run: >-
          python -m pytest -q
          tests/one/test_authenticated_archive_envelope.py
          tests/one/test_archive_envelope.py
          tests/one/test_selective_auth.py
          tests/one/test_native_law_range_plan.py
          tests/one/test_validated_program.py
