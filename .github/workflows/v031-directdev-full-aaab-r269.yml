# ci-lane: release
# ci-cancel-policy: preserve-running-exact-receipt
# Standalone preregistered O2; whole-harness same-source sham A/A and true A/B. Never a release waiver.
# Adapted from .github/workflows/zip-parity.yml at inherited PR #328 source.
# Control: development SHA vs itself; candidate: the same development SHA vs #328 product SHA.
name: CMPCT v0.31 direct development A/A + A/B O2

on:
  pull_request:
    branches: [agent/phased3-v031-parity-admission-metric-truth-union-r267-20261024]
    paths:
      - ".github/workflows/v031-directdev-full-aaab-r269.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v031-full-aaab-r269-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  direct-development-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Each engine is run twice in ABBA order. Seven repetitions/run yields fourteen timed
      # observations per metric per engine. The deeper sample is deliberate: the exact-head tiny
      # diagnostic has shown that a six-observation aggregate can falsely report a >10% regression
      # while a 28-observation focused ABBA on the same candidate/base pair is neutral-to-faster.
      # Thresholds are unchanged; only the evidence resolution is increased.
      CMPCT_PARITY_REPS: "7"
      CMPCT_RELEASE_CORPUS: /tmp/cmpct-release-corpus
    steps:
      - name: Check out candidate repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PR workflows normally check out a synthetic merge commit. Performance evidence should
          # identify and execute the actual candidate head while still comparing against the PR base.
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind checkout to exact evidence head
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EVIDENCE_HEAD"
          echo "Exact evidence head: $ACTUAL_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          if ! sudo apt-get update; then
            echo "Initial apt update failed; retrying without runner-provided Microsoft feeds" >&2
            shopt -s nullglob
            microsoft_lists=(
              /etc/apt/sources.list.d/microsoft*.list
              /etc/apt/sources.list.d/azure-cli*.list
            )
            if ((${#microsoft_lists[@]} == 0)); then
              echo "apt update failed and no known irrelevant Microsoft feed was present" >&2
              exit 1
            fi
            printf 'Disabling runner-provided feed: %s\n' "${microsoft_lists[@]}"
            sudo rm -f "${microsoft_lists[@]}"
            sudo apt-get update
          fi
          sudo apt-get install -y zstd xz-utils libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'

      - name: Correctness gate
        run: python -m pytest -q

      - name: Bind direct canonical development baseline
        id: base
        run: |
          set -euo pipefail
          BASE_SHA="4545d7d5b2a0b712b4b00f5a9c291d4a3a9e169b"
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANONICAL_DEVELOPMENT_BASE=$BASE_SHA"

      - name: Materialize base engine worktree
        run: git worktree add --detach /tmp/cmpct-performance-base "${{ steps.base.outputs.sha }}"

      - name: Materialize historical base native payload
        run: |
          mkdir -p benchmark-artifacts
          python tools/materialize_performance_base_native.py /tmp/cmpct-performance-base \
            --receipt benchmark-artifacts/base-native.json | tee benchmark-artifacts/native-ownership.txt

      - name: Generate one immutable release corpus
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import hashlib, json, os, shutil, sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'benchmarks'))
          import universal_bench as universal

          corpus = Path(os.environ['CMPCT_RELEASE_CORPUS'])
          shutil.rmtree(corpus, ignore_errors=True)
          corpus.mkdir(parents=True)
          universal.CORP = corpus
          universal.reset_rng()
          universal.make_corpora()

          # CMPCT preserves richer metadata than ZIP. Identical payload bytes alone therefore do not
          # define identical archive input; freeze controllable timestamps before either engine runs.
          fixed_ns = 1767225600 * 1_000_000_000  # 2026-01-01T00:00:00Z
          paths = sorted(corpus.rglob('*'), key=lambda p: (len(p.parts), p.as_posix()), reverse=True)
          for path in paths:
              try:
                  os.utime(path, ns=(fixed_ns, fixed_ns), follow_symlinks=False)
              except (NotImplementedError, OSError):
                  if not path.is_symlink():
                      raise
          os.utime(corpus, ns=(fixed_ns, fixed_ns))

          h = hashlib.sha256(); files = 0; logical = 0
          for path in sorted(corpus.rglob('*')):
              rel = path.relative_to(corpus).as_posix().encode(); st = path.lstat()
              h.update(len(rel).to_bytes(4, 'little')); h.update(rel)
              h.update((st.st_mode & 0o177777).to_bytes(4, 'little'))
              h.update(st.st_mtime_ns.to_bytes(8, 'little', signed=True))
              if path.is_symlink():
                  target = os.readlink(path).encode(); h.update(b'L')
                  h.update(len(target).to_bytes(4, 'little')); h.update(target)
              elif path.is_file():
                  data = path.read_bytes(); files += 1; logical += len(data); h.update(b'F')
                  h.update(len(data).to_bytes(8, 'little')); h.update(data)
              elif path.is_dir():
                  h.update(b'D')
          manifest = {'tree_sha256': h.hexdigest(), 'files': files, 'logical_bytes': logical,
                      'fixed_mtime_ns': fixed_ns}
          Path('benchmark-artifacts/corpus.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Capture shared-runner provenance
        run: |
          CANDIDATE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          {
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "evidence_head=$EVIDENCE_HEAD"
            echo "base_commit=${{ steps.base.outputs.sha }}"
            echo "candidate_version=$CANDIDATE_VERSION"
            echo "format_revision=$(PYTHONPATH=src python -c 'from cmpct.codec import VERSION; print(VERSION)')"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "filesystem=$(df -T . | tail -1)"
            echo "cpu_count=$(nproc)"
            echo "cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            echo "mem=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "zstd=$(zstd --version | head -1)"
          } | tee benchmark-artifacts/environment.txt

      - name: Execute immutable whole-harness A/A sham and real A/B
        run: |
          set -euo pipefail
          python benchmarks/v031_directdev_full_aaab_r269.py \
            --base-root /tmp/cmpct-performance-base \
            --candidate-root "$GITHUB_WORKSPACE" \
            --corpus-root /tmp/cmpct-release-corpus \
            --evidence-dir "$GITHUB_WORKSPACE/benchmark-artifacts" \
            2>&1 | tee benchmark-artifacts/full-aaab-court.log
      - name: Upload complete scientific evidence even if comparator is red
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v031-full-aaab-r269-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/
          if-no-files-found: warn
          retention-days: 90
