# ci-lane: fast
name: CMPCT1 ONE-G0.2 rolling-min codegen discriminator

on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_rollmin_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_rollmin_codegen.py"
      - ".github/workflows/cmpct1-one-g02-offset-rollmin-codegen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct1-one-g02-offset-rollmin-codegen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run static generated-code discriminator
        run: |
          mkdir -p one-rollmin-codegen-artifacts
          python -m benchmarks.one.one_g02_minimizer_offset_rollmin_codegen | tee one-rollmin-codegen-artifacts/one-g02-offset-rollmin-codegen.json
      - name: Retain exact-head generated-code evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-offset-rollmin-codegen-${{ env.EVIDENCE_HEAD }}
          path: one-rollmin-codegen-artifacts/
          if-no-files-found: error

# Static causal discriminator only. Dynamic A/B evidence remains authoritative for elapsed claims.
