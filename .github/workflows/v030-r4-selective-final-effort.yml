# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 selective final effort oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_selective_final_effort_oracle.py'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-selective-final-effort.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_selective_final_effort_oracle.py'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-selective-final-effort.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r4-selective-final-effort-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_selective_final_effort_oracle\.py|benchmarks/v030_v025_canonical_fs_level1_oracle\.py|benchmarks/v030_external_competitors\.py|benchmarks/v030_release_generalization\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|experiments/entropygraph_v025\.py|experiments/entropygraph_v030_product_fs\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r4-selective-final-effort\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  selective-final-effort:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus and comparator dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact R4 oracle
        run: python -m py_compile benchmarks/v030_r4_selective_final_effort_oracle.py
      - name: Measure sparse high-effort opportunity under frozen level-1 representation
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_selective_final_effort_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-selective-effort-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-selective-effort.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-selective-effort.json').read_text())
          assert d['schema']=='cmpct-v030-r4-selective-final-effort-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['targets']==['02_office_workspace','04_analytics_and_database','01_developer_repository']
          assert d['low_level']==1 and d['high_level']==19 and d['representation_probe_level']==1
          assert len(d['rows'])==3
          c=d['contract']
          assert c['diagnostic_only'] and c['release_credit'] is False
          assert c['production_selector_changed'] is False
          assert c['workload_identity_in_production_policy'] is False
          assert c['level1_representation_decisions_frozen']
          assert c['mandatory_strong_verify'] and c['canonical_filesystem_semantics_preserved']
          for r in d['rows']:
              assert r['baseline_level1_fixed_representation']['canonical_user_tree_sha256']==r['canonical_user_tree_sha256']
              assert r['all_positive_high_effort']['canonical_user_tree_sha256']==r['canonical_user_tree_sha256']
              if r['selective_oracle'] is not None:
                  assert r['selective_oracle']['canonical_user_tree_sha256']==r['canonical_user_tree_sha256']
              assert 0.0 <= r['scan']['top_quarter_fraction_of_possible_saving'] <= 1.0
          # Scientific red is valid evidence. Only contract/integrity failures make the lane red.
          assert isinstance(d['hypothesis']['supported'], bool)
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-selective-final-effort.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-selective-final-effort-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-selective-effort.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic-only R4 falsifier. The workload-local oracle may establish that sparse promotion exists,
# but it cannot receive shipping credit. A positive result must be followed by a workload-blind cheap
# predictor and the normal same-semantics generalization/hardening gates; a negative result retires this
# selective-final-effort path instead of adding more effort thresholds.
