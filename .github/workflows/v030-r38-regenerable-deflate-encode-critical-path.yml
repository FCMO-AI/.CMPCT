name: CMPCT v0.30 R38 regenerable-Deflate encode critical-path attribution
# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
# Diagnostic only. R38 attributes residual encode-task excess; it grants no release credit.

on:
  pull_request:
    paths:
      - 'benchmarks/v030_r38_regenerable_deflate_encode_critical_path.py'
      - 'docs/v030-rnd/R37_REGENERABLE_DEFLATE_WAIT_ONCE_BUILDER_RESULT.md'
      - 'docs/v030-rnd/R38_REGENERABLE_DEFLATE_ENCODE_CRITICAL_PATH_PREREG.md'
      - '.github/workflows/v030-r38-regenerable-deflate-encode-critical-path.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify-latest-head:
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-r38-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_receipt: ${{ steps.scope.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Classify exact latest-head commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(benchmarks/v030_r38_regenerable_deflate_encode_critical_path\.py|docs/v030-rnd/R37_REGENERABLE_DEFLATE_WAIT_ONCE_BUILDER_RESULT\.md|docs/v030-rnd/R38_REGENERABLE_DEFLATE_ENCODE_CRITICAL_PATH_PREREG\.md|\.github/workflows/v030-r38-regenerable-deflate-encode-critical-path\.yml)$'; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_receipt=false' >> "$GITHUB_OUTPUT"
          fi

  r38-attribution:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: cmpct-v030-r38-attribution-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 128

      - name: Bind frozen R32-R38 substrate and grammar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 0d0173f01bb48b12c96c2b20db5acc5636162e1c HEAD
          for path in \
            src/cmpct/builder.py \
            src/cmpct/codec.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/neutral_hostile_corpus_v1.py \
            benchmarks/neutral_hostile_determinism_repair_v1.py \
            benchmarks/v030_release_ablation_canonical.py \
            benchmarks/v030_r32_regenerable_deflate_output_dead_zstd_elision.py \
            benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution.py \
            docs/v030-rnd/R37_REGENERABLE_DEFLATE_WAIT_ONCE_BUILDER_RESULT.md \
            docs/v030-rnd/R38_REGENERABLE_DEFLATE_ENCODE_CRITICAL_PATH_PREREG.md; do
            test "$(git rev-parse 0d0173f01bb48b12c96c2b20db5acc5636162e1c:$path)" = "$(git rev-parse HEAD:$path)" || { echo "R38 frozen-substrate drift: $path" >&2; exit 1; }
          done
          test "$(git rev-parse eaff591ceb43f9a81d39d275a54cc3c9485cf10c:benchmarks/v030_r38_regenerable_deflate_encode_critical_path.py)" = "$(git rev-parse HEAD:benchmarks/v030_r38_regenerable_deflate_encode_critical_path.py)"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile frozen R38 instrument
        run: python -m py_compile benchmarks/v030_r38_regenerable_deflate_encode_critical_path.py

      - name: Run frozen R38 encode attribution
        env:
          CMPCT_EVIDENCE_HEAD: ${{ env.EVIDENCE_HEAD }}
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r38_regenerable_deflate_encode_critical_path.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/r38-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/r38-encode-critical-path.json"

      - name: Enforce frozen R38 completeness and decision law
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path('benchmark-artifacts/r38-encode-critical-path.json').read_text())
          assert d['schema']=='cmpct-v030-r38-regenerable-deflate-encode-critical-path-v1'
          assert d['evidence_head']==os.environ['EVIDENCE_HEAD']
          assert d['repetitions']==3
          assert set(d['targets'])=={'full-backups','nested-only'}
          allowed={'CRITICAL_ENCODE_OWNER_LOCALIZED','ENCODE_FAMILY_DISTRIBUTED','NO_ENCODE_WORK_EXCESS','SUBSTRATE_OR_INSTRUMENT_FAILURE'}
          assert d['decision'] in allowed

          for target in d['targets'].values():
              assert set(target['arms'])=={'release-all-exact','no-ordinary-zstd'}
              for arm in target['arms'].values():
                  assert len(arm['repetitions'])==3
                  assert all(row['strong_verify_ok'] for row in arm['repetitions'])
              if d['decision']!='SUBSTRATE_OR_INSTRUMENT_FAILURE':
                  assert target['identity_and_instrument_ok']
                  rel=target['arms']['release-all-exact']['median']
                  cand=target['arms']['no-ordinary-zstd']['median']
                  assert rel['instrumented_map_calls']==[1,1,1]
                  assert cand['instrumented_map_calls']==[1,1,1]
                  assert cand['archive_bytes'] < rel['archive_bytes']
                  assert rel['locality_within_8x'] and cand['locality_within_8x']

          full=d['targets']['full-backups']
          nested=d['targets']['nested-only']
          if d['decision']=='CRITICAL_ENCODE_OWNER_LOCALIZED':
              f=full['dominant_positive_excess']; n=nested['dominant_positive_excess']
              assert f and n and f['candidate_key']==n['candidate_key']
              assert f['positive_delta_s'] > 0
              assert n['positive_delta_s'] >= 0.010
              assert n['share_of_summed_positive_excess'] >= 0.50
          elif d['decision']=='ENCODE_FAMILY_DISTRIBUTED':
              assert full['summed_positive_excess_s'] > 0 and nested['summed_positive_excess_s'] > 0
              f=full['dominant_positive_excess']; n=nested['dominant_positive_excess']
              localized=bool(f and n and f['candidate_key']==n['candidate_key'] and f['positive_delta_s']>0 and n['positive_delta_s']>=0.010 and n['share_of_summed_positive_excess']>=0.50)
              assert not localized
          elif d['decision']=='NO_ENCODE_WORK_EXCESS':
              assert full['summed_positive_excess_s'] <= 0 or nested['summed_positive_excess_s'] <= 0
          else:
              assert not (full['identity_and_instrument_ok'] and nested['identity_and_instrument_ok'])
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r38-regenerable-deflate-encode-critical-path.yml

      - name: Upload immutable R38 evidence
        uses: actions/upload-artifact@v6
        with:
          name: v030-r38-encode-critical-path-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/r38-encode-critical-path.json
          if-no-files-found: error
          retention-days: 90
