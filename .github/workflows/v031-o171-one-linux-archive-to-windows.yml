# ci-lane: fast
name: v031 O171 one Linux r24 archive on Windows physical fidelity

on:
  pull_request:
    branches:
      - agent/phased3-v031-o168-macos-linux-one-archive-transfer-20261026
    paths:
      - 'research/o171_linux_to_windows_same_archive_court.py'
      - 'docs/v031-research/2026-10-26-o171-linux-windows-one-archive-*.md'
      - '.github/workflows/v031-o171-one-linux-archive-to-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-source-exact-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CMPCT package
        run: python -m pip install .
      - name: Bind genuine Linux r24 archive to source-exact O165 controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          mkdir -p "$RUNNER_TEMP/o171"
          python research/o165_one_archive_cross_host_court.py \
            --role producer \
            --archive "$RUNNER_TEMP/o171/origin.cmpct" \
            --receipt "$RUNNER_TEMP/o171/producer.json" \
            --output "$RUNNER_TEMP/o171/producer-result.json"
      - name: Preserve original archive and receipts, even if producer fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o171-original-linux-r24
          path: ${{ runner.temp }}/o171/
          if-no-files-found: warn

  windows-source-exact-reader:
    needs: linux-source-exact-origin
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAME source as a Windows package
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: o171-original-linux-r24
          path: ${{ runner.temp }}/o171/
      - name: Verify one unchanged Linux archive then check actual Windows physical topology
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EVIDENCE_HEAD) { throw 'checkout mismatch' }
          python research/o171_linux_to_windows_same_archive_court.py --archive "$env:RUNNER_TEMP\o171\origin.cmpct" --receipt "$env:RUNNER_TEMP\o171\producer.json" --output "$env:RUNNER_TEMP\o171\windows-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows raw receipt even when failure is observed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o171-win32-physical-result
          path: ${{ runner.temp }}/o171/windows-result.json
          if-no-files-found: warn
