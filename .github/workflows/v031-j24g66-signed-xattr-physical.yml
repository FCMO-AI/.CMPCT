# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# Research-only physical xattr-fidelity falsifier; no product mutation.
name: CMPCT J24G66 physical signed-xattr journal court

on:
  push:
    branches:
      - agent/phased1-v031-j24g66-physical-signed-fsmeta-20261030
    paths:
      - 'research/j24g66_signed_fsmeta_physical_court.py'
      - 'docs/v031-research/*j24g66*'
      - '.github/workflows/v031-j24g66-signed-xattr-physical.yml'
  pull_request:
    branches:
      - agent/phased1-v031-j24g64-mixed-fsmeta-crossgen-oracle-20261030
    paths:
      - 'research/j24g66_signed_fsmeta_physical_court.py'
      - 'docs/v031-research/*j24g66*'
      - '.github/workflows/v031-j24g66-signed-xattr-physical.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g66-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-sparse-xattrs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G66_RESULT: evidence/j24g66-result.json
      J24G66_PHYSICAL: evidence/j24g66-signed-physical.cmpct
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove source, research parent and prospective prediction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 41cd7f88d9fede55a495f36e78126b26eff85880 HEAD
          git merge-base --is-ancestor 2fbb61281d203e28a7bcc44ecaf2e7dfa6f3ddaf HEAD
          test "$(git rev-parse HEAD:src/cmpct/journal_replay.py)" = 03743ca2a06c022c2ec64243a90fe373cf91e899
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact package and compile witness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g66_signed_fsmeta_physical_court.py
      - name: Demand authentic sparse xattr capture and identity through public Writer
        shell: bash
        run: |
          set -o pipefail
          python research/j24g66_signed_fsmeta_physical_court.py 2>&1 | tee evidence/j24g66.log
          test -s evidence/j24g66-result.json
          test -s evidence/j24g66-signed-physical.cmpct
      - name: Preserve exact outcome, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g66-signed-physical-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
