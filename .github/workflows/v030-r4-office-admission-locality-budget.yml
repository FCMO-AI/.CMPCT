# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office admission locality budget

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_admission_locality_budget.py'
      - '.github/workflows/v030-r4-office-admission-locality-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-office-admission-locality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env: {EVENT_NAME: '${{ github.event_name }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo run_deep=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r4_office_admission_locality_budget\.py|\.github/workflows/v030-r4-office-admission-locality-budget\.yml)$' /tmp/files; then echo run_deep=true >> "$GITHUB_OUTPUT"; else echo run_deep=false >> "$GITHUB_OUTPUT"; fi

  locality-budget-referee:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_office_admission_locality_budget.py
      - name: Run admitted-only locality budget referee
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_admission_locality_budget.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-admission-locality-budget-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-admission-locality-budget.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-admission-locality-budget.json'))
          assert d['schema']=='cmpct-v030-r4-office-admission-locality-budget-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['hypothesis']['exact_tree'] and d['hypothesis']['all_eight_derived_views_preserved']
          k=d['contract']; assert k['diagnostic_only'] and not k['release_credit'] and not k['locality_credit']
          assert k['same_sparse_metadata_builder_as_prior_cold_reader'] and k['no_parameter_or_codec_sweep']
          print(json.dumps({'admission':d['admission'],'locality_metadata':{x:y for x,y in d['locality_metadata'].items() if x!='rows'},'economics':d['economics'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-admission-locality-budget.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-admission-locality-budget-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-admission-locality-budget.json
          if-no-files-found: error
          retention-days: 90

# Green means the economic referee completed. It grants no locality or release credit.
