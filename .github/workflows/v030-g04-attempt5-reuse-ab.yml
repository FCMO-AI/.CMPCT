# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 G04 attempt5 reuse A/B

on:
  pull_request:
  push:
    branches: [agent/v030-g04-attempt5-reuse]
    paths:
      - 'benchmarks/v030_g04_attempt5_reuse_ab.py'
      - '.github/workflows/v030-g04-attempt5-reuse-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify-latest-head:
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-g04-reuse-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_receipt: ${{ steps.scope.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo 'run_receipt=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(benchmarks/v030_g04_attempt5_reuse_ab\.py|\.github/workflows/v030-g04-attempt5-reuse-ab\.yml)$'; then echo 'run_receipt=true' >> "$GITHUB_OUTPUT"; else echo 'run_receipt=false' >> "$GITHUB_OUTPUT"; fi

  reuse-ab:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: cmpct-v030-g04-reuse-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_g04_attempt5_reuse_ab.py
      - name: Run balanced ML retained-intermediate A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_g04_attempt5_reuse_ab.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/g04-reuse-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/g04-reuse.json"
      - name: Validate non-credit receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/g04-reuse.json').read_text())
          assert d['schema']=='cmpct-v030-g04-attempt5-reuse-ab-v1' and d['release_credit'] is False and len(d['pairs'])==4
          for p in d['pairs']:
              c,r=p['control'],p['reuse']
              assert c['archive_sha256']==r['archive_sha256'] and c['tree_sha256']==r['tree_sha256']
              assert c['attempt5_second_build']['sha256']==r['retained_attempt5']['sha256']
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-g04-attempt5-reuse-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/g04-reuse.json
          if-no-files-found: error
          retention-days: 90

# Research-only exact-intermediate reuse oracle; green never grants release credit.
