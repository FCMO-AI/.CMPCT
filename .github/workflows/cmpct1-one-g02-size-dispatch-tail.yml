# ci-lane: fast
name: CMPCT1 ONE-G0.2 tail 8KiB selector dispatch

on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_minimizer_segmented_counter_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_tail_kernel.c"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_tail_ab.py"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_tail_asm.py"
      - ".github/workflows/cmpct1-one-g02-size-dispatch-tail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Verify tail-return generated shape
        id: codegen
        run: |
          mkdir -p one-tail-dispatch-artifacts
          python -m benchmarks.one.one_g02_minimizer_size_dispatch_tail_asm | tee one-tail-dispatch-artifacts/one-g02-tail-dispatch-asm.json
      - name: Run superseding frozen tail-dispatch A/B
        id: dispatch
        run: python -m benchmarks.one.one_g02_minimizer_size_dispatch_tail_ab | tee one-tail-dispatch-artifacts/one-g02-tail-dispatch-ab.json
      - name: Tail 8KiB dispatch promoted by unchanged gate
        if: steps.dispatch.outputs.decision == 'promote_tail_8k_size_dispatch'
        run: echo "tail-return rehabilitation pays wrapper debt under the unchanged gate"
      - name: Tail 8KiB dispatch rejected for elapsed debt
        if: steps.dispatch.outputs.decision == 'reject_tail_8k_dispatch_for_elapsed_debt'
        run: echo "tail-return rehabilitation still exports unacceptable elapsed debt"
      - name: Tail 8KiB dispatch remains inconclusive
        if: steps.dispatch.outputs.decision == 'tail_size_dispatch_inconclusive'
        run: echo "tail-return rehabilitation remains below promotion/rejection confidence"
      - name: Retain exact-head tail-dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-size-dispatch-tail-${{ env.EVIDENCE_HEAD }}
          path: one-tail-dispatch-artifacts/
          if-no-files-found: error

# Superseding integration rehabilitation only; frozen 8KiB threshold and timing law are unchanged.
