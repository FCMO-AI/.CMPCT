# ci-lane: fast
name: CMPCT1 ONE-G0.2 integrated authenticated range A/B
on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_authenticated_range_integrated_ab.py"
      - ".github/workflows/cmpct1-one-g02-authenticated-range-integrated.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-authenticated-range-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integrated-range:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run frozen integrated authenticated-range A/B
        run: |
          mkdir -p one-authenticated-range-integrated-artifacts
          python -m benchmarks.one.one_g02_authenticated_range_integrated_ab | tee one-authenticated-range-integrated-artifacts/one-g02-authenticated-range-integrated.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-authenticated-range-integrated-${{ env.EVIDENCE_HEAD }}
          path: one-authenticated-range-integrated-artifacts/
          if-no-files-found: error
