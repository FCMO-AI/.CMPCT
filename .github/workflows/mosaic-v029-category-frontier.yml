name: CMPCT v0.29 Zstd category frontier

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-category-${{ github.ref }}
  cancel-in-progress: true

jobs:
  category-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow reportlab python-docx openpyxl python-pptx numpy

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Run exact-tree category frontier
        run: |
          mkdir -p benchmark-artifacts
          # Footnote: CMPCT, ZIP/Deflate-9 and solid tar+Zstd-19 are measured before each workload
          # tree is destroyed. A later regeneration may contain different producer metadata.
          set -o pipefail
          python benchmarks/mosaic_v029_generalization_bench.py \
            --category-baselines \
            --work-root benchmark-artifacts/work \
            --output benchmark-artifacts/mosaic-v029-category-raw.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-category.stdout.txt

      - name: Derive category summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('benchmark-artifacts/mosaic-v029-category-raw.json').read_text())
          rows=[]
          for source in raw['rows']:
              b=source.get('category_baselines') or {}
              z=b.get('tar_zstd19_solid') or {}; zp=b.get('zip_deflate9') or {}
              if not z.get('available') or not zp.get('available'):
                  raise SystemExit(f"missing category baseline for {source['suite']}/{source['name']}")
              c=int(source['candidate_bytes']); zb=int(z['bytes']); zipb=int(zp['bytes'])
              rows.append({'suite':source['suite'],'name':source['name'],'baseline_identity':source['baseline_identity'],
                           'files':int(source['files']),'logical_bytes':int(source['logical_bytes']),
                           'tree_sha256':source['tree_sha256'],'cmpct_bytes':c,
                           'tar_zstd19_solid_bytes':zb,'zip_deflate9_bytes':zipb,
                           'cmpct_vs_tar_zstd19_pct':(zb-c)/zb*100.0,
                           'cmpct_vs_zip_deflate9_pct':(zipb-c)/zipb*100.0,
                           'zstd_create_s':z.get('create_s'),'zip_create_s':zp.get('create_s')})
          ct=sum(r['cmpct_bytes'] for r in rows); zt=sum(r['tar_zstd19_solid_bytes'] for r in rows); zipt=sum(r['zip_deflate9_bytes'] for r in rows)
          summary={'schema':'cmpct-v029-category-frontier-ci-v1','head_sha':'${{ github.event.pull_request.head.sha || github.sha }}',
                   'benchmark_contract':raw.get('category_baseline_contract'),'rows':rows,
                   'totals':{'workloads':len(rows),'candidate_bytes':ct,'tar_zstd19_solid_bytes':zt,'zip_deflate9_bytes':zipt,
                             'cmpct_smaller_than_tar_zstd19_pct':(zt-ct)/zt*100.0,'cmpct_smaller_than_zip_deflate9_pct':(zipt-ct)/zipt*100.0,
                             'wins_vs_tar_zstd19':sum(r['cmpct_bytes']<r['tar_zstd19_solid_bytes'] for r in rows),
                             'losses_vs_tar_zstd19':sum(r['cmpct_bytes']>r['tar_zstd19_solid_bytes'] for r in rows),
                             'ties_vs_tar_zstd19':sum(r['cmpct_bytes']==r['tar_zstd19_solid_bytes'] for r in rows)}}
          assert summary['benchmark_contract']['same_lifetime_measurement'] is True
          assert len(rows)==15
          Path('benchmark-artifacts/mosaic-v029-category-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary['totals'],indent=2))
          PY

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Upload category evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v029-zstd-category-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-category-raw.json
            benchmark-artifacts/mosaic-v029-category-summary.json
            benchmark-artifacts/mosaic-v029-category.stdout.txt
          if-no-files-found: warn

# Footnote: this workflow generates evidence only; it does not alter accepted v0.29 archive bytes.
# Category claims are current exact-tree size comparisons and retain every Zstd loss.
