# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics reusable Zstd CCtx referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_reusable_zstd_cctx_referee.py'
      - '.github/workflows/v030-analytics-reusable-zstd-cctx-referee.yml'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v025.py'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_reusable_zstd_cctx_referee.py'
      - '.github/workflows/v030-analytics-reusable-zstd-cctx-referee.yml'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v025.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-reusable-cctx-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          cat /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_reusable_zstd_cctx_referee\.py|\.github/workflows/v030-analytics-reusable-zstd-cctx-referee\.yml|benchmarks/v030_v025_canonical_fs_level1_oracle\.py|benchmarks/v030_external_competitors\.py|benchmarks/v030_release_generalization\.py|experiments/entropygraph_v025\.py)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-reusable-cctx:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_analytics_reusable_zstd_cctx_referee.py
      - name: Execute reusable-context referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_reusable_zstd_cctx_referee.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-reusable-cctx-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-reusable-cctx.json"
      - name: Validate frozen contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-reusable-cctx.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-reusable-zstd-cctx-v1'
          assert d['release_credit'] is False and d['rounds']==5
          assert d['frozen_gate']=={
            'advance_zc_cpu_reduction_fraction':0.20,
            'retire_at_or_below_fraction':0.05,
            'exact_payload_identity_required':True,
          }
          assert d['decision'] in {'ADVANCE_REUSABLE_CCTX','RETIRE_REUSABLE_CCTX','AMBIGUOUS_REUSABLE_CCTX'}
          PY
      - name: Check workflow topology
        run: python tools/check_ci_topology.py .github/workflows/v030-analytics-reusable-zstd-cctx-referee.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-reusable-cctx-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-reusable-cctx.json
          if-no-files-found: error
          retention-days: 90

# Research-only execution-architecture referee. Green means receipt integrity, not product or release credit.