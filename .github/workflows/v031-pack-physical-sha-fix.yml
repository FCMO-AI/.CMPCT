# ci-lane: fast
name: CMPCT v031 PACK physical SHA product regression
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_pack_sha_integrity.py'
      - 'benchmarks/v031_pack_physical_sha_court.py'
      - '.github/workflows/v031-pack-physical-sha-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pack-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real CMPCT package with native core
        run: python -m pip install -e '.[test]'
      - name: Authenticate exact commit and product-path tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p benchmark-artifacts
          python -m pytest -q tests/test_v031_pack_sha_integrity.py | tee benchmark-artifacts/focused-pack-test.log
          python benchmarks/v031_pack_physical_sha_court.py --expected-pack reject | tee benchmark-artifacts/pack-candidate.json
      - name: Verify CI topology
        run: python tools/check_ci_topology.py .github/workflows/v031-pack-physical-sha-fix.yml
      - name: Preserve exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-strong-verify-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
