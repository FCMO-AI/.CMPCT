# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24G73: research-only installed Reader A/B using original physical Writer archives.
name: CMPCT J24G73 installed Reader physical A-B court

on:
  push:
    branches:
      - agent/phased2-v031-j24g73-installed-reader-mixed-physical-ab-20261030
    paths:
      - 'research/j24g73_*'
      - 'docs/v031-research/*j24g73*'
      - '.github/workflows/v031-j24g73-reader-physical-ab.yml'
  pull_request:
    branches:
      - agent/phased1-v031-j24g64-mixed-fsmeta-crossgen-oracle-20261030
    paths:
      - 'research/j24g73_*'
      - 'docs/v031-research/*j24g73*'
      - '.github/workflows/v031-j24g73-reader-physical-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g73-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-reader:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G73_EVIDENCE_DIR: evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and immutable prediction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 41cd7f88d9fede55a495f36e78126b26eff85880 HEAD
          git merge-base --is-ancestor 47098cb201bf2424a436d197d7bd09162d872b78 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git rev-parse HEAD:src/cmpct/journal_replay.py)" = 03743ca2a06c022c2ec64243a90fe373cf91e899
          test "$(git rev-parse HEAD:research/j24g64_mixed_fsmeta_oracle.py)" = 7657a41d11f2b3c8136c0b69cfe62401f9b19ccb
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install identical Reader and verify scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22' 'psutil>=5.9'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g73_reader_open.py research/j24g73_detached_referee.py
      - name: Physical Builder Writer Reader baseline and subclass test
        shell: bash
        run: |
          set -o pipefail
          python research/j24g73_reader_open.py 2>&1 | tee evidence/j24g73-raw.log
          test -s evidence/j24g73-result.json
      - name: Independent receipt referee and hostile tamper
        shell: bash
        run: |
          set -o pipefail
          python research/j24g73_detached_referee.py evidence/j24g73-result.json evidence "$EXPECTED_HEAD" 2>&1 | tee evidence/j24g73-referee.log
          test -s evidence/j24g73-referee.json
      - name: Preserve original raw data even on red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g73-reader-physical-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
