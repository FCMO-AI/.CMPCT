# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 r25 implicit manifest canonical candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_canonical_manifest_candidate.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/v030_r25_manifest_canonical_candidate_gate.py'
      - 'benchmarks/v030_r25_manifest_derived_identity_oracle.py'
      - '.github/workflows/v030-r25-manifest-canonical-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r25-manifest-canonical-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_canonical_manifest_candidate\.py|experiments/entropygraph_v030_r25_manifest_admission\.py|experiments/entropygraph_v030_fs_implicit_v4\.py|experiments/entropygraph_v030_canonical_final(_impl)?\.py|experiments/entropygraph_v030_product_fs\.py|benchmarks/v030_r25_manifest_canonical_candidate_gate\.py|benchmarks/v030_r25_manifest_derived_identity_oracle\.py|\.github/workflows/v030-r25-manifest-canonical-candidate\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect the canonical manifest candidate.'
          fi

  canonical-manifest-candidate:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Static and semantic ratchet
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/entropygraph_v030_canonical_manifest_candidate.py \
            benchmarks/v030_r25_manifest_canonical_candidate_gate.py
          python -m pytest -q \
            tests/test_v030_r25_manifest_admission.py \
            tests/test_v030_fs_implicit_v4.py
      - name: Run exact canonical candidate gate
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r25_manifest_canonical_candidate_gate \
            --work-root "$RUNNER_TEMP/v030-r25-manifest-canonical-candidate" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r25-manifest-canonical-candidate.json"
      - name: Enforce evidence and promotion boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r25-manifest-canonical-candidate.json').read_text())
          assert d['schema']=='cmpct-v030-r25-manifest-canonical-candidate-gate-v4'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='01_developer_repository'
          assert d['release_credit'] is False
          assert d['shipping_module_changed'] is False
          assert d['candidate_uses_process_global_mutation'] is False
          assert d['canonical_candidate_set']=='canonical-r25-only-g04-prefixgraph-v1'
          assert d['strictly_smaller_than_legacy_r25'] is True
          assert d['complete_artifact_saving_bytes']==d['baseline_archive_bytes']-d['candidate_archive_bytes']
          assert d['complete_artifact_saving_bytes'] >= d['minimum_useful_archive_saving_bytes'] >= 16*1024
          assert d['promotion_signal'] is True
          assert len(d['baseline_archive_sha256'])==64
          assert len(d['candidate_archive_sha256'])==64
          assert d['baseline_archive_sha256'] != d['candidate_archive_sha256']
          assert d['baseline_shipping_strong_verify']['ok'] is True
          assert d['baseline_shipping_strong_verify']['tree_sha256']==d['expected_tree_sha256']
          assert d['candidate_strong_verify']['ok'] is True
          assert d['candidate_extract_tree_sha256']==d['expected_tree_sha256']
          assert d['manifest_encoding']=='implicit-v4'
          assert d['locality_le_8x'] is True
          assert d['shipping_facade_fail_closed_unchanged'] is True
          a=d['domination_audit']
          assert a['strict_target']=='15/15 strictly smaller and faster than ZIP/Deflate and solid Zstd-19'
          assert a['diagnosis']=='D5'
          assert a['radicality']=='R2'
          assert 'S6' in a['saturation_triggers']
          assert a['research_priority_score'] >= 80
          assert a['terminal_decision']=='PROMOTE_NEXT_PREREQUISITE'
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-manifest-canonical-candidate.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact candidate receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-manifest-canonical-candidate-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-manifest-canonical-candidate.json
          if-no-files-found: error
          retention-days: 90

# S6/D5 convergence lane. The gate compares filesystem-v1 and implicit-v4 on the same
# canonical-r25-only G04/PrefixGraph candidate set; accepted-v0.29 CMPNX fallback is
# intentionally excluded because it is product-floor evidence, not a canonical-r25 reader
# representation. A green result proves the already-strict implicit-v4 mechanism survives
# direct canonical writer/reader primitives without process-global mutation while shipping
# semantics remain unchanged. It is still not release credit: recovery, native, Android,
# all-15 no-regression and exact external authority remain mandatory after promotion.
