name: CMPCT research - Windows sparse interoperability
on:
  pull_request:
    paths: [".github/workflows/windows-sparse-interoperability-oracle.yml"]
permissions:
  contents: read
jobs:
  build-linux-sparse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e .
      - name: Build an archive that physically uses S_SPARSE
        run: |
          python - <<'PY'
          import hashlib,json,os,tempfile
          from pathlib import Path
          from cmpct.builder import Builder
          from cmpct.reader import CMPCT
          from cmpct.codec import S_SPARSE
          root=Path('/tmp/sparse-src'); root.mkdir(); p=root/'sparse.bin'
          with open(p,'wb') as f:
              f.write(b'prefix\n'*4096); f.seek(16*1024*1024); f.write(b'suffix\n'*4096)
          expected=p.read_bytes(); Builder(root,workers=1,reproducible=True,reproducible_epoch_ns=0).build(Path('/tmp/sparse.cmpct'))
          with CMPCT(Path('/tmp/sparse.cmpct')) as r:
              row=r.by['sparse.bin']; assert row[6][0]==S_SPARSE,row[6][0]; assert r.read('sparse.bin')==expected
          Path('/tmp/expected.json').write_text(json.dumps({'size':len(expected),'sha256':hashlib.sha256(expected).hexdigest()}))
          print(Path('/tmp/expected.json').read_text())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: sparse-cross-platform
          path: |
            /tmp/sparse.cmpct
            /tmp/expected.json
  extract-windows:
    needs: build-linux-sparse
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v6
        with:
          name: sparse-cross-platform
          path: D:/sparse-oracle
      - name: Extract Linux-authored S_SPARSE archive on Windows
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          from cmpct.reader import CMPCT
          root=Path('D:/sparse-oracle'); expected=json.loads((root/'expected.json').read_text()); dst=root/'out'
          with CMPCT(root/'sparse.cmpct') as r:
              assert r.verify()==1
              r.extractall(dst,metadata=False)
          data=(dst/'sparse.bin').read_bytes(); assert len(data)==expected['size']; assert hashlib.sha256(data).hexdigest()==expected['sha256']
          print('windows sparse interoperability exact',expected)
