# ci-lane: fast
name: CMPCT v0.30 PR152 comment restore
on:
  push:
    branches: [agent/v030-ml-bulk-varint-table-product]
    paths: ['.github/workflows/v030-pr152-comment-restore.yml']
permissions:
  contents: write
concurrency:
  group: v030-pr152-comment-restore
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/entropygraph_v030_verified_restore.py')
          s=p.read_text()
          a='''    for row in entries:\n        rel, kind = row[0], row[1]\n        if kind != "f":\n'''
          ar='''    # Preserve a cheap structural guard after authenticated streaming. The generic FS entry point continues to\n    # perform its independent digest pass for callers without verified-stream provenance.\n    for row in entries:\n        rel, kind = row[0], row[1]\n        if kind != "f":\n'''
          b='''    for row in entries:\n        rel, kind = row[0], row[1]\n        target = staging.joinpath(*PurePosixPath(rel).parts)\n'''
          br='''    # Restore children before directory metadata so child creation cannot perturb directory mtimes. These are\n    # the exact operations owned by product_fs.restore_manifest_tree; only its redundant regular-file hash pass is\n    # intentionally absent here.\n    for row in entries:\n        rel, kind = row[0], row[1]\n        target = staging.joinpath(*PurePosixPath(rel).parts)\n'''
          assert s.count(a)==1, s.count(a)
          assert s.count(b)==1, s.count(b)
          p.write_text(s.replace(a,ar,1).replace(b,br,1))
          PY
          rm .github/workflows/v030-pr152-comment-restore.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/entropygraph_v030_verified_restore.py .github/workflows/v030-pr152-comment-restore.yml
          git diff --cached --check
          git commit -m 'docs: restore verified-restore invariant comments'
          git push origin HEAD:agent/v030-ml-bulk-varint-table-product