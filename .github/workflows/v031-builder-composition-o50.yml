# O50: independent O47 × O48 composition. Draft evidence, not a release gate.
name: CMPCT v0.31 O50 Builder composition court
on:
  push:
    branches:
      - 'agent/phased2-v031-o47-o48-composition-court-o50-20261025'
  pull_request:
    paths:
      - 'src/cmpct/builder.py'
      - 'tests/test_v031_builder_composition_o50.py'
      - 'tests/test_v031_builder_parent_parity_o50.py'
      - 'tests/test_v031_special_entries_o48.py'
      - 'tests/test_v031_win32_builder_hardlink_o47.py'
      - '.github/workflows/v031-builder-composition-o50.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o50-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-installed-composition:
    name: O50 installed Builder composition ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the exact source under examination
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bind original evidence, install authentic CMPCT, run both unmodified courts plus interaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 29d9688ae6bff6d1eccc27f019893866abe5b5c3 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "21a9ec696df13961c25301654feb607a7e161a4c"
          test "$(git hash-object tests/test_v031_win32_builder_hardlink_o47.py)" = "6c00ae49eea075957453d6d7238d988add6eedee"
          test "$(git hash-object tests/test_v031_special_entries_o48.py)" = "d4a22da7d634a5dd6a1e1fb132ed1ceae2249ab6"
          test "$(git hash-object tests/test_v031_builder_composition_o50.py)" = "44f66dcf220231c1271d56bbff26da290d32d20c"
          test "$(git hash-object tests/test_v031_builder_parent_parity_o50.py)" = "bd826ff2b7551811bc11763138cc51f3bd89ac73"
          git diff --exit-code 29d9688ae6bff6d1eccc27f019893866abe5b5c3 HEAD -- src/cmpct/reader.py src/cmpct/transactions.py native benchmarks/zip_parity_bench.py tools/check_performance_regression.py
          echo "O50_HEAD=$(git rev-parse HEAD)"
          echo "O50_COMPOSED_BUILDER_BLOB=$(git hash-object src/cmpct/builder.py)"
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder, cmpct.reader
          repo=Path(subprocess.check_output(["git", "rev-parse", "--show-toplevel"],text=True).strip())
          for module in (cmpct.builder, cmpct.reader):
              path=Path(module.__file__).resolve()
              assert not path.is_relative_to(repo), f"not clean-installed: {path}"
              print("O50_INSTALLED="+str(path))
          PY
          mkdir -p o50-isolated
          cp tests/test_v031_win32_builder_hardlink_o47.py o50-isolated/
          cp tests/test_v031_special_entries_o48.py o50-isolated/
          cp tests/test_v031_builder_composition_o50.py o50-isolated/
          cp tests/test_v031_builder_parent_parity_o50.py o50-isolated/
          python -m pytest -vv o50-isolated/ --junitxml=o50-results.xml 2>&1 | tee o50-results.log
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root=ET.parse('o50-results.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('./testsuite')
          assert suites, ('unrecognized-junit-root', root.tag)
          counts={key:sum(int(x.attrib.get(key,0)) for x in suites)
                  for key in ('tests','failures','errors','skipped')}
          for key,value in counts.items():
              print('O50_'+key.upper()+'='+str(value))
          # Pytest/JUnit emits a <testsuites> wrapper; never mistake its
          # absent counters for an actual product assertion failure.
          assert counts['tests']==10, counts
          assert counts['skipped']==(4 if os.name=='nt' else 0), counts
          assert counts['errors']==0, counts
          assert counts['failures']==0, counts
          PY
      - name: Preserve original result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o50-composition-${{ matrix.os }}
          path: |
            o50-results.log
            o50-results.xml
          if-no-files-found: warn
          retention-days: 30
