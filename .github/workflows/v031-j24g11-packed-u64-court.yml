# ci-lane: fast
name: CMPCT J24G11 packed-u64 footer proof installed court
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'research/j24g11_packed_footer_proof_court.py'
      - 'research/j24g11_independent_receipt_audit.py'
      - 'docs/v031-research/2026-10-28-j24g11-*'
      - '.github/workflows/v031-j24g11-packed-u64-court.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installed-three-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      J24G11_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G11_ARTIFACTS: j24g11-artifacts
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.J24G11_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Source/prereg/Git ownership preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p j24g11-artifacts
          test "$(git rev-parse HEAD)" = "$J24G11_HEAD"
          git merge-base --is-ancestor 70a54adeae8c77fe8693f84be6fbd0ab15b5b4f6 HEAD
          git merge-base --is-ancestor da5552d4f74113de1887fdad9683b433bb6e6cf2 HEAD
          test "$(git rev-parse da5552d4f74113de1887fdad9683b433bb6e6cf2:src/cmpct/reader.py)" = 0a8a7afa036cb4988b80836bcbe550c3b5d0bb40
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 4bcedb059316171963d258fc93caaa49fec56f12
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          paths=['src/cmpct/reader.py','research/j24g11_packed_footer_proof_court.py',
                 'research/j24g11_independent_receipt_audit.py']
          files={}
          for p in paths:
              b=subprocess.check_output(['git','show','HEAD:'+p])
              assert pathlib.Path(p).read_bytes()==b,p
              files[p]={'blob':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip(),
                        'sha256':hashlib.sha256(b).hexdigest()}
          pathlib.Path('j24g11-artifacts/source.json').write_text(
              json.dumps({'head':os.environ['J24G11_HEAD'],'files':files},sort_keys=True,indent=2)+'\n')
          PY
      - name: Install authentic candidate, execute matched three-Reader court
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python research/j24g11_packed_footer_proof_court.py 2>&1 | tee j24g11-artifacts/court.log
          python research/j24g11_independent_receipt_audit.py j24g11-artifacts/court.json | tee j24g11-artifacts/audit.log
      - name: Retain raw source-bound scientific evidence (including negatives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g11-packed-u64-${{ github.sha }}
          path: j24g11-artifacts/
          retention-days: 30
          if-no-files-found: warn
