# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT installed native package

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "native/cmpct-core/**"
      - "tests/installed_native_package_smoke.py"
      - "tests/test_installed_cmpct_wheel.py"
      - "tools/attest_installed_cmpct_wheel.py"
      - "tools/validate_cmpct_wheel_profile.py"
      - "tools/validate_macos_wheel_abi.py"
      - ".github/workflows/installed-native-package.yml"
  workflow_dispatch:

permissions:
  contents: read

# Retain each independently dispatched exact-source portability receipt across PR updates.
concurrency:
  group: cmpct-installed-native-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CMPCT_WHEEL_PYTHON_TAG: cp310.cp311.cp312.cp313.cp314

jobs:
  latest-head-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_package: ${{ steps.scope.outputs.run_package }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Classify only latest exact commit's installed package impact
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_package=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > "$RUNNER_TEMP/latest-head-files.txt"
          cat "$RUNNER_TEMP/latest-head-files.txt"
          if grep -Eq '^(pyproject\.toml|MANIFEST\.in|native/cmpct-core/|tests/installed_native_package_smoke\.py|tests/test_installed_cmpct_wheel\.py|tools/(attest_installed_cmpct_wheel|validate_cmpct_wheel_profile|validate_macos_wheel_abi)\.py|\.github/workflows/installed-native-package\.yml)' "$RUNNER_TEMP/latest-head-files.txt"; then
            echo 'run_package=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_package=false' >> "$GITHUB_OUTPUT"
            echo 'Only accumulated PR paths matched; latest exact commit is unrelated to installed package.'
          fi
  installed-package:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_package == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 runner brownout 2026-10-30; GitHub retires it 2026-11-02.
        # Preserve ARM+Intel universal2 checks on the supported macOS 15 host.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify detached installed-package attestor controls
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_installed_cmpct_wheel.py -v
      - name: Build source distribution only
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Build wheel strictly from sdist and retag to supported CPython minors
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cmpct-installed"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/cmpct-installed/Scripts/python.exe"; else PY="$RUNNER_TEMP/cmpct-installed/bin/python"; fi
          "$PY" -m pip install --upgrade pip wheel
          mkdir -p "$RUNNER_TEMP/wheels-original" "$RUNNER_TEMP/wheels"
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            export ARCHFLAGS="-arch arm64 -arch x86_64"
          fi
          "$PY" -m pip wheel --no-deps dist/*.tar.gz -w "$RUNNER_TEMP/wheels-original"
          cp "$RUNNER_TEMP"/wheels-original/cmpct-*.whl "$RUNNER_TEMP/wheels/"
          cd "$RUNNER_TEMP/wheels"
          ORIGINAL=$(echo cmpct-*.whl)
          "$PY" -m wheel tags --python-tag="$CMPCT_WHEEL_PYTHON_TAG" --abi-tag=none --remove "$ORIGINAL"
          test "$(find . -maxdepth 1 -name 'cmpct-*.whl' | wc -l)" -eq 1
      # Never install or execute unverified final wheel bytes. The portable profile
      # refuses .data scheme relocation (J24P07 false admission); the macOS
      # physical gate binds universal2, minOS and RECORD to this exact wheel.
      - name: Validate final retagged wheel before pip install
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(find "$RUNNER_TEMP/wheels" -maxdepth 1 -name 'cmpct-*.whl' -type f -print -quit)
          test -n "$WHEEL"
          test "$(find "$RUNNER_TEMP/wheels" -maxdepth 1 -name 'cmpct-*.whl' -type f | wc -l)" -eq 1
          python "$GITHUB_WORKSPACE/tools/validate_cmpct_wheel_profile.py" "$WHEEL" | tee preinstall-wheel-profile.json
          if [ "$RUNNER_OS" = "macOS" ]; then
            python "$GITHUB_WORKSPACE/tools/validate_macos_wheel_abi.py" "$WHEEL" --output preinstall-macos-abi.json
          fi
      - name: Install guarded wheel and attest complete CMPCT package bytes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/cmpct-installed/Scripts/python.exe"; else PY="$RUNNER_TEMP/cmpct-installed/bin/python"; fi
          WHEEL=$(find "$RUNNER_TEMP/wheels" -maxdepth 1 -name 'cmpct-*.whl' -type f -print -quit)
          test -n "$WHEEL"
          "$PY" -m pip install --no-compile "$WHEEL"
          (cd "$RUNNER_TEMP" && "$PY" "$GITHUB_WORKSPACE/tools/attest_installed_cmpct_wheel.py" "$WHEEL" --source-sha "$EVIDENCE_HEAD" --output "$GITHUB_WORKSPACE/installed-package-identity.json")
      - name: Smoke exact attested installed cdylib
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/cmpct-installed/Scripts/python.exe"; else PY="$RUNNER_TEMP/cmpct-installed/bin/python"; fi
          (cd "$RUNNER_TEMP" && "$PY" "$GITHUB_WORKSPACE/tests/installed_native_package_smoke.py") | tee installed-native-smoke.json
      - name: Inspect installed dependency closure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/cmpct-installed/Scripts/python.exe"; else PY="$RUNNER_TEMP/cmpct-installed/bin/python"; fi
          LIB=$(cd "$RUNNER_TEMP" && "$PY" -c 'import importlib.util,pathlib; p=pathlib.Path(next(iter(importlib.util.find_spec("cmpct").submodule_search_locations))); print(next(x for x in p.glob("cmpct_core*") if x.is_file()))')
          echo "library=$LIB" | tee installed-native-deps.txt
          if [ "$RUNNER_OS" = "Linux" ]; then ldd "$LIB" | tee -a installed-native-deps.txt; ! ldd "$LIB" | grep -i 'libzstd'; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$LIB" | tee -a installed-native-deps.txt
            ! otool -L "$LIB" | grep -i 'libzstd'
            lipo -info "$LIB" | tee -a installed-native-deps.txt
            lipo -info "$LIB" | grep -q 'arm64'
            lipo -info "$LIB" | grep -q 'x86_64'
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then objdump -p "$LIB" | grep 'DLL Name:' | tee -a installed-native-deps.txt; ! objdump -p "$LIB" | grep -i 'libzstd'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installed-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            installed-native-smoke.json
            installed-native-deps.txt
            preinstall-wheel-profile.json
            preinstall-macos-abi.json
            installed-package-identity.json
            ${{ runner.temp }}/wheels/cmpct-*.whl
          if-no-files-found: error
          retention-days: 14

  python-compatibility:
    needs: installed-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.10','3.11','3.12','3.13','3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: installed-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: installed-artifact
      - name: Install identical per-OS wheel and exercise shipping product
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(find installed-artifact -name 'cmpct-*.whl' -type f -print -quit)
          test -n "$WHEEL"
          python -m pip install --upgrade pip
          python -m pip install --no-compile "$WHEEL"
          (cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/tools/attest_installed_cmpct_wheel.py" "$GITHUB_WORKSPACE/$WHEEL" --source-sha "$EVIDENCE_HEAD" --output "$GITHUB_WORKSPACE/python-compat-identity.json")
          (cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/tests/installed_native_package_smoke.py") | tee python-compat-smoke.json
          python - <<'PY'
          import json
          s=json.load(open('python-compat-smoke.json'))
          assert s['representative_archive_create_read_extract'] is True
          assert s['shipping_python_no_ambient_zstd'] is True
          assert s['python_zstandard_absent'] is True
          assert s['dict_vector_bytes']==104
          PY

  desktop-package-evidence:
    needs: [installed-package, python-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          pattern: installed-native-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: installed-evidence
      - name: Aggregate fingerprint-bound desktop package evidence
        shell: bash
        run: |
          set -euo pipefail
          # Rolling v0.30 already released with required_receipts=[]: the strict pre-release
          # front door deliberately rejects this state. Reuse the same CORE.fingerprint
          # algorithm through its post-release-aware reader; do not alter release gates.
          python -m tools.check_v030_release_lock --print-fingerprint > "$RUNNER_TEMP/desktop-package-fingerprint.json"
          FP="$(python - <<'PYFP'
          import json, os, pathlib
          data=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'desktop-package-fingerprint.json').read_text())
          value=data.get('candidate_fingerprint')
          assert isinstance(value,str) and len(value)==64,value
          print(value)
          PYFP
          )"
          export FP
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('installed-evidence')
          expected={'ubuntu-24.04','macos-15','windows-2025'}
          found={}
          for os_name in expected:
              matches=[p for p in root.iterdir() if p.is_dir() and p.name.startswith('installed-native-'+os_name+'-')]
              assert len(matches)==1,(os_name,matches)
              found[os_name]=matches[0]
          platform={}
          for os_name,p in found.items():
              smoke_files=list(p.rglob('installed-native-smoke.json'))
              dep_files=list(p.rglob('installed-native-deps.txt'))
              wheels=list(p.rglob('cmpct-*.whl'))
              assert len(smoke_files)==1,(os_name,smoke_files)
              assert len(dep_files)==1,(os_name,dep_files)
              assert len(wheels)==1,(os_name,wheels)
              s=json.loads(smoke_files[0].read_text())
              assert s['representative_archive_create_read_extract'] is True
              assert s['shipping_python_no_ambient_zstd'] is True
              assert s['python_zstandard_absent'] is True
              assert s['dict_vector_bytes']==104
              assert dep_files[0].read_text().strip()
              wheel=wheels[0]
              assert '-cp310.cp311.cp312.cp313.cp314-none-' in wheel.name,wheel.name
              profiles=list(p.rglob('preinstall-wheel-profile.json'))
              installs=list(p.rglob('installed-package-identity.json'))
              assert len(profiles)==len(installs)==1,(os_name,profiles,installs)
              profile=json.loads(profiles[0].read_text())
              installed=json.loads(installs[0].read_text())
              assert profile.get('result')=='PASS',(os_name,profile)
              assert installed.get('result')=='PASS',(os_name,installed)
              source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              assert installed.get('source_sha')==source,(os_name,'source custody mismatch')
              wheel_sha=hashlib.sha256(wheel.read_bytes()).hexdigest()
              assert installed.get('wheel_sha256')==wheel_sha,(os_name,'wheel identity mismatch')
              paths=[row['path'] for row in installed['files']]
              assert len(paths)==installed['file_count']==len(set(paths)) and len(paths)>=2
              assert 'native_codec.py' in paths
              assert any(name.startswith('cmpct_core') and name.endswith(('.so','.pyd','.dylib')) for name in paths)
              if os_name=='macos-15':
                  mac_receipts=list(p.rglob('preinstall-macos-abi.json'))
                  assert len(mac_receipts)==1,(os_name,mac_receipts)
                  mac=json.loads(mac_receipts[0].read_text())
                  assert mac.get('pass') is True and mac.get('wheel_sha256')==wheel_sha
                  assert set(mac.get('required',[]))=={'arm64','x86_64'}
              platform[os_name]={
                  'archive_sha256':s['representative_archive_sha256'],
                  'dict_vector_sha256':s['dict_vector_sha256'],
                  'wheel_name':wheel.name,
                  'wheel_sha256':hashlib.sha256(wheel.read_bytes()).hexdigest(),
              }
          evidence={
              'schema':'cmpct-v030-desktop-package-evidence-v1',
              'candidate_fingerprint':os.environ['FP'].strip(),
              'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'facts':{
                  'sdist_first_wheel_build':True,
                  'linux_clean_install_green':True,
                  'macos_clean_install_green':True,
                  'windows_clean_install_green':True,
                  'representative_archive_create_read_extract':True,
                  'canonical_codec_vectors_green':True,
                  'no_ambient_zstd_dependency':True,
                  'platform_dependency_inspection_recorded':True,
                  'same_artifact_cpython_310_through_314_green':True,
                  'wheel_python_tag':'cp310.cp311.cp312.cp313.cp314',
                  'wheel_abi_tag':'none',
              },
              'platform':platform,
          }
          Path('desktop-package-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop-package-evidence.json
          if-no-files-found: error
          retention-days: 14
