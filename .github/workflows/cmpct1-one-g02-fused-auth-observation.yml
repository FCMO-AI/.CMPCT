# ci-lane: narrow
# evidence rearm: selective-stat clocks excluded from deterministic parity
name: CMPCT1 ONE-G0.2 fused authentication observation

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/fused_authenticated_archive.py
      - experiments/one/authenticated_archive_envelope.py
      - experiments/one/archive_envelope.py
      - experiments/one/auth_tree.py
      - experiments/one/authenticated_native_selective_cone.py
      - experiments/one/native_law_range_plan.py
      - experiments/one/validated_program.py
      - benchmarks/one/one_g02_fused_auth_observation.py
      - tests/one/test_fused_authenticated_archive.py
      - tests/one/test_authenticated_archive_envelope.py
      - docs/one/evidence/ONE_G02_FUSED_AUTH_OBSERVATION_PREREG_2026-09-09.md
      - .github/workflows/cmpct1-one-g02-fused-auth-observation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-fused-auth-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EVIDENCE_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Install repository test surface
        run: python -m pip install -e '.[test]'
      - name: Run fused-auth parity plus inherited authenticated semantics
        run: >-
          python -m pytest -q
          tests/one/test_fused_authenticated_archive.py
          tests/one/test_authenticated_archive_envelope.py
          tests/one/test_archive_envelope.py
          tests/one/test_selective_auth.py
          tests/one/test_native_law_range_plan.py
          tests/one/test_validated_program.py
      - name: Run frozen fused-auth falsifier
        run: PYTHONPATH=. python benchmarks/one/one_g02_fused_auth_observation.py --output fused-auth-observation.json --evidence-head "$EVIDENCE_HEAD"
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fused-auth-observation-${{ github.sha }}
          path: fused-auth-observation.json
          if-no-files-found: error
          retention-days: 30
