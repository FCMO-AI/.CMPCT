# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 pack-cache canonical ML A/B
on:
  push:
    branches: [agent/v030-pack-plan-size-cache-product]
    paths:
      - 'experiments/entropygraph_v030_discovery_neutral_worker.py'
      - 'experiments/entropygraph_v030_pack_plan_cache.py'
      - 'benchmarks/v030_pack_cache_canonical_ab.py'
      - '.github/workflows/v030-pack-cache-canonical-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-pack-cache-canonical-${{ github.sha }}
  cancel-in-progress: false
jobs:
  canonical-ml-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Bind candidate and exact current parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git fetch origin agent/v030-authoritative-integration
          git worktree add /tmp/cmpct-control origin/agent/v030-authoritative-integration
          git -C /tmp/cmpct-control rev-parse HEAD | tee control-sha.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile candidate surfaces
        run: python -m py_compile experiments/entropygraph_v030_discovery_neutral_worker.py benchmarks/v030_pack_cache_canonical_ab.py
      - name: Run direct exact-parent ML pack A/B
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_pack_cache_canonical_ab.py --pairs 3 --control-root /tmp/cmpct-control \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pack-cache-canonical-ml-ab.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-pack-cache-canonical-ml-ab-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-pack-cache-canonical-ml-ab.json
            control-sha.txt
          if-no-files-found: error
          retention-days: 90
# Direct product A/B only; unchanged full runtime/RSS/release gates remain authoritative.
# Dispatch marker after workflow creation.
