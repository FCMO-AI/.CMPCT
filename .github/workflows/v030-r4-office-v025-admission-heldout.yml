# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 v0.25 admission hostile transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_v025_admission_heldout.py'
      - '.github/workflows/v030-r4-office-v025-admission-heldout.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-v025-admission-heldout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env: {EVENT_NAME: '${{ github.event_name }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo run_deep=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r4_office_v025_admission_heldout\.py|\.github/workflows/v030-r4-office-v025-admission-heldout\.yml)$' /tmp/files; then echo run_deep=true >> "$GITHUB_OUTPUT"; else echo run_deep=false >> "$GITHUB_OUTPUT"; fi

  heldout-referee:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_office_v025_admission_heldout.py
      - name: Run generator-distinct hostile transfer
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_v025_admission_heldout.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-v025-admission-heldout-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-v025-admission-heldout.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-v025-admission-heldout.json'))
          assert d['schema']=='cmpct-v030-r4-office-v025-admission-heldout-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          k=d['contract']
          assert k['diagnostic_only'] and not k['release_credit'] and not k['locality_credit']
          assert k['generator_distinct_from_neutral_office'] and k['positive_prediction_frozen_before_execution'] and k['negative_prediction_frozen_before_execution']
          assert k['no_workload_path_hash_dispatch'] and k['near_equal_control_is_existing_resemblance_hostile_generator']
          assert d['hypothesis']['positive_exact_tree']
          print(json.dumps({
            'positive':{x:y for x,y in d['positive_exact_shared'].items() if x!='admission_rows'},
            'negative':{x:y for x,y in d['negative_near_equal'].items() if x!='admission_rows'},
            'hypothesis':d['hypothesis'],
          },sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-v025-admission-heldout.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-v025-admission-heldout-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-v025-admission-heldout.json
          if-no-files-found: error
          retention-days: 90

# Green means the frozen hostile transfer completed. It grants no locality or release credit.
