# ci-lane: fast
name: CMPCT v0.31 Signed Generation Reader Limits O10R
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'src/cmpct/validation.py'
      - 'tests/test_v031_reader_generation_limits_o10r.py'
      - 'docs/v031-research/2026-10-24-reader-generation-limit-o10r-prereg.md'
      - '.github/workflows/v031-reader-generation-limits-o10r.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-generation-limits-o10r-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  signed-generation-limits:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git rev-parse HEAD
          git hash-object src/cmpct/reader.py
          git hash-object src/cmpct/validation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CMPCT package
        run: python -m pip install -e ".[test]"
      - name: Original negative / candidate positive authenticated archive court
        shell: bash
        run: |
          mkdir -p o10r-evidence
          python -m pytest --noconftest -q -rs tests/test_v031_reader_generation_limits_o10r.py 2>&1 | tee o10r-evidence/pytest.log
          exit "${PIPESTATUS[0]}"
      - name: Persist full failure and success logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-generation-limits-o10r-${{ matrix.os }}-${{ github.sha }}
          path: o10r-evidence/
          if-no-files-found: warn
          retention-days: 30
