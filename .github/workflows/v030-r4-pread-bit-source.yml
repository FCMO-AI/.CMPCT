# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 direct pread BitReader referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_pread_bit_source_referee.py'
      - '.github/workflows/v030-r4-pread-bit-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-pread-bit-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pread-bit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install zstandard
      - run: python -m py_compile benchmarks/v030_r4_pread_bit_source_referee.py
      - name: Run direct-source referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_pread_bit_source_referee.py --output benchmark-artifacts/v030-r4-pread-bit-source.json
      - name: Assert receipt integrity, not verdict
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-pread-bit-source.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['coldreader_code_unchanged']
          assert d['contract']['builder_runtime_separated']
          assert d['contract']['no_refill_sweep']
          print(json.dumps({'input':d['input'],'summary':d['summary'],'failures':d['failures'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - name: Persist scientific receipt on integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/receipt.md
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-pread-bit-source.json'));s=d['summary']
          print('### v0.30 direct pread BitReader source — exact-head receipt')
          print()
          print(f"- head: `{os.environ['EVIDENCE_HEAD']}`")
          print(f"- hypothesis: **{'SUPPORTED' if d['hypothesis']['unchanged_bitreader_consumes_direct_pread_source_exactly'] else 'FALSE'}**")
          print(f"- deterministic raw/compressed/probes: `{d['input']['raw_bytes']}` / `{d['input']['compressed_bytes']}` / `{d['input']['probes']}`")
          print(f"- failures: `{d['failures']}`; max physical payload `{s['max_physical_payload_bytes']} B`; max pread calls `{s['max_pread_calls']}`; max call `{s['max_call_bytes']} B`")
          print('- existing ColdReader/BitReader code unchanged; 8 B exact-start source only; diagnostic, no product/release credit.')
          PY
          gh pr comment 56 --repo FCMO-AI/.CMPCT --body-file /tmp/receipt.md
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-pread-bit-source.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-pread-bit-source-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-pread-bit-source.json
          if-no-files-found: error
          retention-days: 90
# Green means receipt integrity; JSON owns scientific verdict.
