# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 streaming-finalize RSS v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-streaming-finalize-rss-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    outputs:
      run_receipt: ${{ steps.classify.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if grep -Eq '^(src/cmpct/(builder|__init__|v030_worker_policy_capture)\.py|experiments/entropygraph_v030_r24_streaming_finalize\.py|experiments/entropygraph_v030_release_product(_base)?\.py|benchmarks/v030_r24_streaming_finalize_rss(_v2)?_oracle\.py|benchmarks/v030_release_(performance|generalization)\.py|benchmarks/(neutral|resemblance)_hostile_corpus_v1\.py|docs/v030-rnd/R25_R24_STREAMING_FINALIZE_RSS_V2_PREREG\.md|\.github/workflows/v030-r24-streaming-finalize-rss-v2\.yml)$' <<<"$changed"; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_receipt=false' >> "$GITHUB_OUTPUT"
          fi

  semantic-owner-rss-v2:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile and ratchet exact reusable streaming owner
        run: |
          python -m py_compile benchmarks/v030_r24_streaming_finalize_rss_v2_oracle.py experiments/entropygraph_v030_r24_streaming_finalize.py
          python -m pytest -q tests/test_v030_r24_streaming_finalize.py
          python - <<'PY'
          from experiments import entropygraph_v030_r24_streaming_finalize as s
          assert s.StreamingFinalizeBuilder.__module__ == 'experiments.entropygraph_v030_r24_streaming_finalize'
          assert s.SPOOL_MEMORY_BYTES == 1024 * 1024
          assert s.MAX_IN_FLIGHT_FACTOR == 1
          PY
      - name: Run superseding exact-semantic-owner RSS A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_streaming_finalize_rss_v2_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-v2.json"
      - name: Enforce frozen v2 contract
        if: always()
        run: |
          test -f benchmark-artifacts/v030-r24-streaming-rss-v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-streaming-rss-v2.json').read_text())
          assert d['schema']=='cmpct-v030-r24-streaming-finalize-rss-v2'
          assert d['supersedes_interpretation_of']=='cmpct-v030-r24-streaming-finalize-rss-v1'
          assert d['experiment_valid'] is True and d['selector_change'] is False and d['release_credit'] is False
          owner=d['semantic_owner']
          assert owner['class_module']=='experiments.entropygraph_v030_r24_streaming_finalize'
          assert owner['class_name']=='StreamingFinalizeBuilder'
          assert owner['spool_memory_bytes']==1048576 and owner['max_in_flight_factor']==1
          c=d['contract']
          assert c['archive_bytes_changed'] is False and c['r24_policy_changed'] is False and c['selector_changed'] is False
          assert c['grammar_changed'] is False and c['integrity_changed'] is False and c['rss_release_threshold_changed'] is False
          assert c['promotion_shifted_full_rss_max_ratio']==0.75 and c['promotion_shifted_r24_rss_max_ratio']==0.50
          assert c['maximum_full_wall_regression_ratio']==1.05 and c['max_in_flight_factor']==1
          assert {r['target'] for r in d['rows']} == {'resemblance_hostile_v1/01_shifted_versions','neutral_hostile_v1/09_ml_artifacts'}
          for row in d['rows']:
              assert len(row['repetitions'])==2
              for rep in row['repetitions']:
                  for op in ('r24','full'):
                      a=rep['shipping'][op]; b=rep['streaming'][op]
                      assert a['archive_bytes']==b['archive_bytes']
                      assert a['archive_sha256']==b['archive_sha256']
                      assert a['tree_sha256']==b['tree_sha256']
                      assert b['semantic_owner']['class_module']=='experiments.entropygraph_v030_r24_streaming_finalize'
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-streaming-finalize-rss-v2.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-streaming-finalize-rss-v2-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-streaming-rss-v2.json
          if-no-files-found: error
          retention-days: 90
