# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 r24 streaming-finalize RSS oracle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-streaming-finalize-rss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      combined: ${{ steps.filter.outputs.combined }}
      streaming: ${{ steps.filter.outputs.streaming }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'combined=true' >> "$GITHUB_OUTPUT"
            echo 'streaming=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          combined=false
          streaming=false
          if grep -Eq '^(experiments/entropygraph_v030_r24_streaming_finalize\.py|experiments/entropygraph_v030_prefixgraph_parallel\.py|experiments/entropygraph_v030_release_product(_base)?\.py|benchmarks/v030_shifted_streaming_prefix_workers_oracle\.py|benchmarks/v030_release_(performance|generalization)\.py|benchmarks/(neutral|resemblance)_hostile_corpus_v1\.py|\.github/workflows/v030-r24-streaming-finalize-rss\.yml)$' <<<"$changed"; then combined=true; fi
          if grep -Eq '^(src/cmpct/builder\.py|experiments/entropygraph_v030_r24_streaming_finalize\.py|experiments/entropygraph_v030_release_product(_base)?\.py|benchmarks/v030_r24_streaming_finalize_rss_oracle\.py|benchmarks/v030_release_(performance|generalization)\.py|benchmarks/(neutral|resemblance)_hostile_corpus_v1\.py|tests/test_v030_r24_streaming_finalize\.py|\.github/workflows/v030-r24-streaming-finalize-rss\.yml)$' <<<"$changed"; then streaming=true; fi
          echo "combined=$combined" >> "$GITHUB_OUTPUT"
          echo "streaming=$streaming" >> "$GITHUB_OUTPUT"

  shifted-combined-rss-frontier:
    needs: changes
    if: needs.changes.outputs.combined == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run exact-byte combined streaming and PrefixGraph-worker frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_streaming_prefix_workers_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-streaming-prefix-workers-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-streaming-prefix-workers.json"
      - name: Enforce unchanged release law and exact identity
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-streaming-prefix-workers.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-streaming-prefix-workers.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-streaming-prefix-workers-v2'
          assert d['exact_archive_identity_all_arms'] is True and d['experiment_valid'] is True and d['release_credit'] is False
          c=d['contract']
          for key in ('archive_bytes_changed','candidate_set_changed','selector_changed','tie_law_changed','grammar_changed','integrity_changed','locality_limit_changed','recovery_changed','rss_threshold_changed'):
              assert c[key] is False
          assert float(c['promotion_full_rss_max_ratio'])==0.75
          assert float(c['maximum_full_wall_regression_ratio'])==1.05
          if d['promotion_signal']:
              s=d['summary'][d['promotion_arm']]
              assert float(s['rss_ratio_vs_shipping'])<=0.75 and float(s['wall_ratio_vs_shipping'])<=1.05
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-shifted-combined-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-streaming-prefix-workers.json
          if-no-files-found: warn
          retention-days: 90

  r24-streaming-finalize-rss:
    needs: changes
    if: needs.changes.outputs.streaming == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile and ratchet reusable streaming finalizer
        run: |
          python -m py_compile experiments/entropygraph_v030_r24_streaming_finalize.py benchmarks/v030_r24_streaming_finalize_rss_oracle.py experiments/entropygraph_v030_release_product.py experiments/entropygraph_v030_release_product_base.py
          python -m pytest -q tests/test_v030_r24_streaming_finalize.py
      - name: Measure byte-identical streaming r24 floor inside promoted product
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_streaming_finalize_rss_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss.json"
      - name: Enforce exact experimental boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-streaming-rss.json').read_text())
          assert d['schema']=='cmpct-v030-r24-streaming-finalize-rss-v1' and d['rounds']==2
          assert d['experiment_valid'] is True and d['selector_change'] is False and d['release_credit'] is False
          c=d['contract']
          assert c['archive_bytes_changed'] is False and c['r24_policy_changed'] is False and c['selector_changed'] is False
          assert c['grammar_changed'] is False and c['integrity_changed'] is False and c['rss_release_threshold_changed'] is False
          assert c['bounded_encode_in_flight'] is True and c['spool_memory_bytes']==1048576
          assert c['promotion_shifted_full_rss_max_ratio']==0.75 and c['promotion_shifted_r24_rss_max_ratio']==0.50
          assert c['maximum_full_wall_regression_ratio']==1.05
          assert {r['target'] for r in d['rows']} == {'resemblance_hostile_v1/01_shifted_versions','neutral_hostile_v1/09_ml_artifacts'}
          for row in d['rows']:
              assert len(row['repetitions'])==2
              for rep in row['repetitions']:
                  for op in ('r24','full'):
                      a=rep['shipping'][op]; b=rep['streaming'][op]
                      assert a['archive_bytes']==b['archive_bytes'] and a['archive_sha256']==b['archive_sha256'] and a['tree_sha256']==b['tree_sha256']
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-streaming-finalize-rss.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-streaming-finalize-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-streaming-rss.json
          if-no-files-found: error
          retention-days: 90

# The PR may synchronize on every integration commit, but the 120-minute jobs run only when the newest exact head
# commit changes their lane. Unrelated later commits preserve any already-running exact receipt.
