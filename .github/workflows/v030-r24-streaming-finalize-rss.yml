# ci-lane: deep
name: CMPCT v0.30 r24 streaming-finalize RSS oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cmpct/builder.py'
      - 'experiments/entropygraph_v030_r24_streaming_finalize.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'experiments/entropygraph_v030_prefixgraph_parallel.py'
      - 'benchmarks/v030_r24_streaming_finalize_rss_oracle.py'
      - 'benchmarks/v030_shifted_streaming_prefix_workers_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'tests/test_v030_r24_streaming_finalize.py'
      - '.github/workflows/v030-r24-streaming-finalize-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-streaming-finalize-rss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  shifted-combined-rss-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run exact-byte combined streaming and PrefixGraph-worker frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_streaming_prefix_workers_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-streaming-prefix-workers-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-streaming-prefix-workers.json"
      - name: Enforce unchanged release law and exact identity
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-streaming-prefix-workers.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-streaming-prefix-workers.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-streaming-prefix-workers-v2'
          assert d['exact_archive_identity_all_arms'] is True
          assert d['experiment_valid'] is True
          assert d['release_credit'] is False
          c=d['contract']
          assert c['archive_bytes_changed'] is False
          assert c['candidate_set_changed'] is False
          assert c['selector_changed'] is False
          assert c['tie_law_changed'] is False
          assert c['grammar_changed'] is False
          assert c['integrity_changed'] is False
          assert c['locality_limit_changed'] is False
          assert c['recovery_changed'] is False
          assert c['rss_threshold_changed'] is False
          assert float(c['promotion_full_rss_max_ratio'])==0.75
          assert float(c['maximum_full_wall_regression_ratio'])==1.05
          if d['promotion_signal']:
              arm=d['promotion_arm']
              assert arm and arm!='shipping'
              s=d['summary'][arm]
              assert float(s['rss_ratio_vs_shipping'])<=0.75
              assert float(s['wall_ratio_vs_shipping'])<=1.05
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-shifted-combined-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-streaming-prefix-workers.json
          if-no-files-found: warn
          retention-days: 90

  r24-streaming-finalize-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile and ratchet reusable streaming finalizer
        run: |
          python -m py_compile experiments/entropygraph_v030_r24_streaming_finalize.py
          python -m py_compile benchmarks/v030_r24_streaming_finalize_rss_oracle.py
          python -m py_compile experiments/entropygraph_v030_release_product.py
          python -m py_compile experiments/entropygraph_v030_release_product_base.py
          python -m pytest -q tests/test_v030_r24_streaming_finalize.py
      - name: Measure byte-identical streaming r24 floor inside promoted product
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_streaming_finalize_rss_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss.json"
      - name: Enforce exact experimental boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r24-streaming-rss.json')
          if not p.is_file():
              raise SystemExit('streaming-finalize RSS evidence missing')
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r24-streaming-finalize-rss-v1'
          assert d['rounds']==2
          assert d['experiment_valid'] is True
          assert d['selector_change'] is False
          assert d['release_credit'] is False
          c=d['contract']
          assert c['archive_bytes_changed'] is False
          assert c['r24_policy_changed'] is False
          assert c['selector_changed'] is False
          assert c['grammar_changed'] is False
          assert c['integrity_changed'] is False
          assert c['rss_release_threshold_changed'] is False
          assert c['bounded_encode_in_flight'] is True
          assert c['spool_memory_bytes']==1048576
          assert c['promotion_shifted_full_rss_max_ratio']==0.75
          assert c['promotion_shifted_r24_rss_max_ratio']==0.50
          assert c['maximum_full_wall_regression_ratio']==1.05
          assert {r['target'] for r in d['rows']} == {
              'resemblance_hostile_v1/01_shifted_versions',
              'neutral_hostile_v1/09_ml_artifacts',
          }
          for row in d['rows']:
              assert len(row['repetitions'])==2
              for rep in row['repetitions']:
                  for op in ('r24','full'):
                      a=rep['shipping'][op]
                      b=rep['streaming'][op]
                      assert a['archive_bytes']==b['archive_bytes']
                      assert a['archive_sha256']==b['archive_sha256']
                      assert a['tree_sha256']==b['tree_sha256']
              assert row['full_wall_ratio_streaming_to_shipping'] is not None
              assert row['full_rss_ratio_streaming_to_shipping'] is not None
              assert row['r24_rss_ratio_streaming_to_shipping'] is not None
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-streaming-finalize-rss.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-streaming-finalize-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-streaming-rss.json
          if-no-files-found: error
          retention-days: 90

# Research-only causality tests. Neither job can change shipping, RSS limits or archive semantics. Positive results
# authorize focused productization followed by exact-head runtime/external/native/Android/final release authority.
