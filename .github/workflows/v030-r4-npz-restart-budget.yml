# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 NPZ restart budget

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_npz_restart_budget_oracle.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - '.github/workflows/v030-r4-npz-restart-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-npz-restart-budget-${{ github.sha }}
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile restart-budget falsifier
        run: python -m py_compile benchmarks/v030_r4_npz_restart_budget_oracle.py
      - name: Run restart-budget falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_npz_restart_budget_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-npz-restart-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-npz-restart-budget.json"
      - name: Enforce receipt integrity only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-npz-restart-budget.json').read_text())
          assert d['schema']=='cmpct-v030-r4-npz-restart-budget-v1'
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit']
          assert c['not_an_impossibility_proof'] and c['global_checkpoint_compression_is_favorable_to_candidate']
          assert c['bit_alignment_and_other_inflate_state_not_charged'] and c['no_threshold_sweep']
          assert d['checkpoint_count_required_by_spacing'] > 0
          print(json.dumps({'checkpoint_count':d['checkpoint_count_required_by_spacing'],'raw_state_bytes':d['raw_full_window_state_bytes'],'global_zlib9_bytes':d['whole_family_zlib9_bytes'],'margin_vs_v029_bytes':d['analytics_margin_vs_v029_bytes'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-npz-restart-budget-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-npz-restart-budget.json
          if-no-files-found: error
          retention-days: 90

# Green means measurement integrity only; a red hypothesis is a valid negative research result.
