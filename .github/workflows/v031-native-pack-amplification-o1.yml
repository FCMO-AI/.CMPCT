# ci-lane: fast
name: CMPCT v0.31 native S_PACK amplification O1

on:
  pull_request:
    paths:
      - 'research/native_pack_amplification_o1.py'
      - 'research/native_pack_source_mutation_o2.py'
      - 'docs/v031-research/NATIVE_PACK_SOURCE_MUTATION_O2_PREREG.md'
      - 'docs/v031-research/NATIVE_PACK_RUNTIME_AMPLIFICATION_O1_PREREG.md'
      - '.github/workflows/v031-native-pack-amplification-o1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-native-pack-o1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-pack-o1:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind source and frozen physical-format court
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch \
            native/cmpct-core/Cargo.lock \
            tests/conformance/v24-pack.json \
            tests/native_pack_golden_abi.py \
            research/native_pack_amplification_o1.py \
            docs/v031-research/NATIVE_PACK_RUNTIME_AMPLIFICATION_O1_PREREG.md
          sha256sum native/cmpct-core/Cargo.lock tests/conformance/v24-pack.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build immutable installed Python/Rust execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
      - name: Independent fixed-byte S_PACK positive conformance
        shell: bash
        run: |
          set -euo pipefail
          python tests/native_pack_golden_abi.py
      - name: Same-open native PACK physical-source freshness O2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-pack-o1"
          python research/native_pack_source_mutation_o2.py \
            "$RUNNER_TEMP/cmpct-native-pack-o1/physical-source-mutation-o2.json" \
            | tee "$RUNNER_TEMP/cmpct-native-pack-o1/freshness-o2.log"
          sha256sum "$RUNNER_TEMP/cmpct-native-pack-o1/physical-source-mutation-o2.json" \
            > "$RUNNER_TEMP/cmpct-native-pack-o1/freshness-o2.sha256"
      - name: Execute prospective ABBA real native-runtime experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-pack-o1"
          python research/native_pack_amplification_o1.py \
            "$RUNNER_TEMP/cmpct-native-pack-o1/pack-amplification-o1.json" \
            | tee "$RUNNER_TEMP/cmpct-native-pack-o1/run.log"
          sha256sum "$RUNNER_TEMP/cmpct-native-pack-o1/pack-amplification-o1.json" \
            > "$RUNNER_TEMP/cmpct-native-pack-o1/receipt.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pack-runtime-o1-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-pack-o1/
          if-no-files-found: warn
          retention-days: 30
