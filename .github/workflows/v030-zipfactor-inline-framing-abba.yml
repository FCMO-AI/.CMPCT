# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 ZIP-factor inline framing A/B

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_zipfactor_eocd_parser.py'
      - 'experiments/entropygraph_v030_zipfactor_fused.py'
      - 'benchmarks/v030_zipfactor_inline_framing_abba.py'
      - 'tests/test_v030_zipfactor_inline_framing.py'
      - '.github/workflows/v030-zipfactor-inline-framing-abba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zf-inline-framing-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  inline-framing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile and ratchet parser semantics
        run: |
          python -m py_compile experiments/entropygraph_v030_zipfactor_eocd_parser.py
          python -m py_compile benchmarks/v030_zipfactor_inline_framing_abba.py
          python -m pytest -q \
            tests/test_v030_zipfactor_eocd_parser_equivalence.py \
            tests/test_v030_zipfactor_path_neutral.py \
            tests/test_v030_zipfactor_inline_framing.py
      - name: Run exact alternating full-scan A/B
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_zipfactor_inline_framing_abba \
            --work-root "$RUNNER_TEMP/v030-zf-inline-framing" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-inline-framing.json"
      - name: Ratchet exact evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('benchmark-artifacts/v030-zf-inline-framing.json').read_text())
          assert e['schema']=='cmpct-v030-zipfactor-inline-framing-abba-v1'
          c=e['contract']
          assert c['rounds']==41 and c['same_runner_alternating'] is True
          assert c['minimum_absolute_saving_s']==0.0002
          assert c['minimum_relative_saving']==0.05
          assert c['selector_change'] is False and c['release_credit'] is False
          assert e['identity']['scan_result_identity'] is True
          assert e['identity']['final_archive_identity'] is True
          assert e['candidate']['archive_bytes']==14033
          assert e['candidate']['archive_sha256']=='75bdc866b4b7b63c8f83f7d9a88c9ff3d712c51b93700033984433819b014e31'
          assert e['experiment_valid'] is True
          expected=(e['delta']['saving_s'] >= c['minimum_absolute_saving_s'] and e['delta']['saving_ratio'] >= c['minimum_relative_saving'])
          assert e['promotion_signal'] is expected
          assert e['release_credit'] is False
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/v030-zf-inline-framing-candidate.txt
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-inline-framing-abba.yml
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zf-inline-framing-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-zf-inline-framing.json
            benchmark-artifacts/v030-zf-inline-framing-candidate.txt
          if-no-files-found: error
          retention-days: 90

# Research-only. A positive signal means only that the second static framing traversal can be removed materially;
# product/native/recovery/Android/external authority must still be re-earned on one exact candidate.
