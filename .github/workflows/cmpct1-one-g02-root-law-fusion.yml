name: CMPCT1 ONE-G0.2 root Law fusion
on:
  pull_request:
    paths:
      - 'experiments/one/fused_root_law_plan.py'
      - 'experiments/one/fused_root_law_plan_kernel.c'
      - 'benchmarks/one/one_g02_root_law_fusion.py'
      - 'tests/one/test_fused_root_law_plan.py'
      - 'docs/one/prereg/ONE_G02_ROOT_LAW_FUSION_PREREG_2026-09-08.md'
      - '.github/workflows/cmpct1-one-g02-root-law-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-law-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Exact source and frozen-law binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import benchmarks.one.one_g02_root_law_fusion as b
          assert b.SIZES == (64*1024, 256*1024, 1024*1024)
          assert b.BLOCKS == (512, 4096)
          assert b.OPS == ('add8', 'xor')
          assert b.REPETITIONS == 21
          assert b.MAX_WIRE_RATIO == 0.55
          assert b.MAX_FUSED_VS_GENERIC == 0.50
          assert b.MAX_FUSED_VS_LITERAL == 1.25
          assert b.MAX_TRAFFIC_RATIO == 1.05
          PY
      - name: Run semantics and fail-closed tests
        run: python -m pytest -q tests/one/test_fused_root_law_plan.py
      - name: Run frozen 12-cell falsifier
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_root_law_fusion | tee one_g02_root_law_fusion.json
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-root-law-fusion-${{ env.EVIDENCE_HEAD }}
          path: one_g02_root_law_fusion.json
          if-no-files-found: warn
