# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.31 rename-target independent scientific court
on:
  push:
    branches:
      - agent/phased1-v031-rename-destination-oracle-20261023
    paths:
      - tests/test_v031_rename_target_independent_court.py
      - .github/workflows/v031-rename-target-independent-court.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v031-rename-target-oracle-${{ github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.sha }}
jobs:
  rename-target-scientific:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install actual CMPCT Builder and Reader
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Exact-head experimental custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          from pathlib import Path
          from cmpct.transactions import append_rename
          from cmpct.path_policy import canonical_logical_path
          import inspect, hashlib
          s=inspect.getsource(append_rename)
          assert 'if new in ar.by:' in s
          assert 'canonical_logical_path(new)' not in s
          assert canonical_logical_path('dir\\child.txt')[0]=='dir/child.txt'
          assert canonical_logical_path('dir/child.txt')[0]=='dir/child.txt'
          print('SOURCE_BOUND_TESTABLE_HYPOTHESIS',hashlib.sha256(s.encode()).hexdigest())
          print('RUN_HEAD',Path('.git/HEAD').read_text().strip())
          PY
      - name: Run seven authentic scientific cases
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python -m pytest -v tests/test_v031_rename_target_independent_court.py \
            2>&1 | tee benchmark-artifacts/rename-target-exact-head.log
      - name: Preserve receipt even on unexpected outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-rename-target-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
