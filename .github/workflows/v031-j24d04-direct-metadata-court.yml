# ci-lane: fast
# Research-only source-exact mode/umask compatibility court; no release credit.
name: CMPCT J24D04 direct-stage metadata-false umask court
on:
  push:
    branches:
      - agent/phased2-v031-j24d04-direct-metadata-umask-court-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24d04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mode-court:
    name: Original versus staged direct extractor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and prereg custody
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 1778085a1ff5278fadf5f3a12b5f950008a8d939 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = "1273708b42d2164ac806eea9297ac6fc098104b4"
          test -z "$(git diff --name-only 1778085a1ff5278fadf5f3a12b5f950008a8d939 HEAD -- src/)"
          test -f docs/v031-research/2026-10-27-j24d04-direct-umask-prereg.md
          git diff --check 1778085a1ff5278fadf5f3a12b5f950008a8d939 HEAD
          python -m py_compile research/j24d04_direct_metadata_court.py research/j24d04_independent_receipt_referee.py
      - name: Install two exact historical and candidate Python packages
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/j24d04-original" 80c358f8824ec1b20d349c92ed94c898090969b0
          test "$(git -C "$RUNNER_TEMP/j24d04-original" rev-parse HEAD)" = "80c358f8824ec1b20d349c92ed94c898090969b0"
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP/j24d04-original" --target "$RUNNER_TEMP/j24d04-original-site"
          python -m pip install . --target "$RUNNER_TEMP/j24d04-candidate-site"
      - name: Execute independent real archive permission and hardlink controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/j24d04_direct_metadata_court.py" \
            --repo "$GITHUB_WORKSPACE" \
            --original-tree "$RUNNER_TEMP/j24d04-original" \
            --candidate-tree "$GITHUB_WORKSPACE" \
            --original-site "$RUNNER_TEMP/j24d04-original-site" \
            --candidate-site "$RUNNER_TEMP/j24d04-candidate-site" \
            --out "$GITHUB_WORKSPACE/artifacts/j24d04-raw.json"
          python "$GITHUB_WORKSPACE/research/j24d04_independent_receipt_referee.py" \
            "$GITHUB_WORKSPACE/artifacts/j24d04-raw.json" \
            "$GITHUB_WORKSPACE/artifacts/j24d04-audit.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ["GITHUB_WORKSPACE"])/"artifacts"
          records={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.glob("*.json")}
          (p/"j24d04-manifest.sha256.json").write_text(json.dumps(records,indent=2,sort_keys=True)+"\n")
          PY
      - name: Preserve raw receipts on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24d04-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
