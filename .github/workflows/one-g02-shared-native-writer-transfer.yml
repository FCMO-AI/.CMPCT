name: ONE-G0.2 shared native writer transfer

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_g02_shared_native_writer_transfer.py'
      - 'benchmarks/one/native/one_g02_shared_native_writer.c'
      - 'docs/one/evidence/ONE_G02_SHARED_NATIVE_WRITER_TRANSFER_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-shared-native-writer-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-native-writer-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Run shared native writer transfer falsifier
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_shared_native_writer_transfer | tee one-g02-shared-native-writer-transfer.json
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-shared-native-writer-transfer-${{ github.sha }}
          path: one-g02-shared-native-writer-transfer.json
          if-no-files-found: error
