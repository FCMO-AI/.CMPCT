# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office v0.25 stream-policy attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_v025_stream_policy_attribution.py'
      - '.github/workflows/v030-r4-office-v025-stream-policy-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-office-v025-policy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        env: {EVENT_NAME: '${{ github.event_name }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo run_deep=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r4_office_v025_stream_policy_attribution\.py|\.github/workflows/v030-r4-office-v025-stream-policy-attribution\.yml)$' /tmp/files; then echo run_deep=true >> "$GITHUB_OUTPUT"; else echo run_deep=false >> "$GITHUB_OUTPUT"; fi

  attribution-referee:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_office_v025_stream_policy_attribution.py
      - name: Run v0.25 stream-policy attribution
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_v025_stream_policy_attribution.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-v025-policy-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-v025-policy.json"
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-office-v025-policy.json'))
          assert d['schema']=='cmpct-v030-r4-office-v025-stream-policy-attribution-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          k=d['contract']; assert k['diagnostic_only'] and not k['release_credit'] and not k['locality_credit']
          assert k['v025_512k_locality_not_credited'] and k['rejected_container_storage_not_waived'] and k['root_fractional_attribution_is_diagnostic_not_archive_byte_count']
          print(json.dumps({'sfv4':d['sfv4'],'v025_stream_policy':d['v025_stream_policy'],'common_root_attribution':d['common_root_attribution'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-v025-stream-policy-attribution.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-v025-policy-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-v025-policy.json
          if-no-files-found: error
          retention-days: 90

# Green means attribution completed; it does not grant the historical 512 KiB plan locality credit.
