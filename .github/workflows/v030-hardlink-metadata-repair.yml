name: v030 hardlink metadata parity repair

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - '.github/workflows/v030-hardlink-metadata-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v030-authoritative-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python fixture dependency
        run: python -m pip install --disable-pip-version-check msgpack
      - name: Apply the frozen shared-manifest repair only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('native/cmpct-portable/src/manifest.rs')
          text = path.read_text()
          old_derive = '#[derive(Debug, Clone)]\npub(crate) struct FsMetadata {'
          new_derive = '#[derive(Debug, Clone, PartialEq, Eq)]\npub(crate) struct FsMetadata {'
          if text.count(old_derive) != 1:
              raise SystemExit('FsMetadata derive anchor drifted; refuse repair')
          text = text.replace(old_derive, new_derive, 1)
          old_block = (
              '                if !matches!(&owner.kind, FsKind::File { .. }) {\n'
              '                    return Err(PortableError::Format(\n'
              '                        "r25 hardlink owner is not a regular file".into(),\n'
              '                    ));\n'
              '                }\n'
          )
          addition = (
              '                if entry.metadata != owner.metadata {\n'
              '                    return Err(PortableError::Format(\n'
              '                        "r25 hardlink metadata must match regular-file owner".into(),\n'
              '                    ));\n'
              '                }\n'
          )
          if text.count(old_block) != 1:
              raise SystemExit('hardlink owner validation anchor drifted; refuse repair')
          text = text.replace(old_block, old_block + addition, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "native/cmpct-portable/src/manifest.rs"
      - name: Wire the frozen parity vector in the CI workspace only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('native/cmpct-portable/src/lib.rs')
          text = path.read_text()
          module = '#[cfg(test)]\nmod implicit_v4_vector_tests;\n'
          anchor = '#[cfg(test)]\nmod logs_preparity_tests;'
          if module not in text:
              if anchor not in text:
                  raise SystemExit('portable test-module anchor missing; court invalid')
              text = text.replace(anchor, module + anchor, 1)
              path.write_text(text)
          PY
      - name: Compile and run the complete portable reader test surface
        run: |
          cargo test --manifest-path native/cmpct-portable/Cargo.toml --release --no-run
          cargo test --manifest-path native/cmpct-portable/Cargo.toml --release -- --nocapture
      - name: Persist only the proven shared-manifest repair
        run: |
          git checkout -- native/cmpct-portable/src/lib.rs
          git diff --check
          test "$(git diff --name-only)" = "native/cmpct-portable/src/manifest.rs"
          git config user.name "cmpct-domination-agent"
          git config user.email "actions@users.noreply.github.com"
          git add native/cmpct-portable/src/manifest.rs
          git commit -m "fix(native): enforce hardlink inode metadata parity"
          git push origin HEAD:agent/v030-authoritative-integration
