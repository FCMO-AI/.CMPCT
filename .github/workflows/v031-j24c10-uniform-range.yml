# ci-lane: fast
# J24C10: no mutation to r24 format, no release claim.
name: CMPCT v031 J24C10 lazy uniform stride installed Reader
on:
  push:
    branches:
      - agent/phased3-v031-j24c10-lazy-uniform-range-proof-20261028
  pull_request:
    paths:
      - 'src/cmpct/_fastscan_abi3.c'
      - 'src/cmpct/_chunk_admission.py'
      - 'src/cmpct/reader.py'
      - 'tests/test_j24c10_lazy_uniform_stride.py'
      - 'research/j24c10_*'
      - '.github/workflows/v031-j24c10-uniform-range.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24c10-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-three-host:
    name: Actual installed witness + exact read-range - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      CMPCT_J24C10_EXPECT_NATIVE: '1'
      CMPCT_J24C08_EXPECT_NATIVE: '1'
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Pure independent geometry oracle
        shell: bash
        run: python research/j24c10_independent_geometry_oracle.py
      - name: Build an actual noneditable wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel pytest
          python -m pip wheel --no-deps . -w dist
          python -m pip install dist/*.whl
          mkdir -p receipts
          python - <<'PY'
          import cmpct.reader as r, cmpct._chunk_admission as a,hashlib,json
          from pathlib import Path
          p=Path(r.__file__).resolve()
          assert "site-packages" in p.parts or "dist-packages" in p.parts,p
          assert callable(a._scan_refs) and callable(a._uniform_stride)
          print(json.dumps({"installed_reader":str(p),
                            "reader_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                            "native_admission":True,"native_range_witness":True}))
          PY
      - name: Original and new signed semantic/hostile tests
        shell: bash
        run: |
          python -m pytest --noconftest -q tests/test_j24c10_lazy_uniform_stride.py tests/test_j24c08_optional_abi3.py tests/test_o215_fixed_chunk_admission.py tests/test_reader_unsupported_blob_bits.py tests/test_reader_deflate_export_custody.py 2>&1 | tee receipts/pytest.txt
      - name: Charged one-owner/many-owner/ragged complete installed Reader ranges
        shell: bash
        env:
          PYTHONPATH: tests
        run: |
          python research/j24c10_installed_range_court.py --output receipts/j24c10-court.json
          python research/j24c10_range_referee.py --input receipts/j24c10-court.json --output receipts/j24c10-decision.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('receipts/j24c10-court.json')
          d=json.loads(p.read_text())
          print("EXACT_HEAD",d["source_head"])
          print("RECEIPT_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          print("J24C10_SCIENTIFIC_WALL_GATE",d["late_four_profile_wall_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c10-uniform-range-${{ matrix.os }}-${{ env.EVIDENCE_SHA }}
          path: receipts/
          if-no-files-found: warn

  python310-fallback:
    name: Python 3.10 unchanged strict selective range
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CMPCT_J24C10_EXPECT_NATIVE: '0'
      CMPCT_J24C08_EXPECT_NATIVE: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build/install strict fallback and run signed tests
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel pytest
          python -m pip wheel --no-deps . -w dist
          python -m pip install dist/*.whl
          mkdir -p receipts
          python -m pytest --noconftest -q tests/test_j24c10_lazy_uniform_stride.py tests/test_o215_fixed_chunk_admission.py 2>&1 | tee receipts/fallback.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c10-python310-fallback-${{ github.sha }}
          path: receipts/
          if-no-files-found: warn
