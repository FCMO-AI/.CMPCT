name: Format native core once

on:
  push:
    branches:
      - native/read-only-index-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rustfmt and remove one-shot workflow
        run: |
          cd native/cmpct-core
          cargo fmt
          cd ../..
          git rm .github/workflows/native-core-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/cmpct-core/src
          git commit -m 'Apply canonical Rust formatting to native core'
          git push origin HEAD:native/read-only-index-core
