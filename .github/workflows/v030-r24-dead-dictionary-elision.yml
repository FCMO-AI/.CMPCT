# ci-lane: deep
name: CMPCT v0.30 r24 dead dictionary elision

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cmpct/builder.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'experiments/entropygraph_v030_r24_dead_dictionary.py'
      - 'benchmarks/v030_r24_dead_dictionary_elision_oracle.py'
      - 'benchmarks/v030_r24_dead_dictionary_elision_oracle_v2.py'
      - 'benchmarks/v030_r24_dead_dictionary_elision_oracle_v3.py'
      - 'benchmarks/v030_r24_binary_dictionary_isolation_oracle.py'
      - 'benchmarks/v030_r24_compact_control_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - '.github/workflows/v030-r24-dead-dictionary-elision.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-dead-dict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  dead-dictionary-elision:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus/compressor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile proof and shipping helper
        run: |
          python -m py_compile benchmarks/v030_r24_dead_dictionary_elision_oracle.py
          python -m py_compile benchmarks/v030_r24_dead_dictionary_elision_oracle_v2.py
          python -m py_compile benchmarks/v030_r24_dead_dictionary_elision_oracle_v3.py
          python -m py_compile benchmarks/v030_r24_binary_dictionary_isolation_oracle.py
          python -m py_compile experiments/entropygraph_v030_r24_dead_dictionary.py
          python -m py_compile experiments/entropygraph_v030_release_product.py
          python -m py_compile experiments/entropygraph_v030_release_product_base.py
      - name: Run exact shipping regression proof
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_dead_dictionary_elision_oracle_v3.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dead-dict-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dead-dict.json"
      - name: Enforce promoted zero-regression ratchet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-dead-dict.json').read_text())
          assert d['schema']=='cmpct-v030-r24-dead-dictionary-elision-v3-shipping-ratchet'
          r=d['ratchet']
          assert r['promotion_already_applied'] is True
          assert r['training_changed'] is False
          assert r['codec_competition_changed'] is False
          assert r['threshold_changed'] is False
          repair=d['identity_domain_repair']
          assert repair['historical_source_digest_role']=='frozen corpus provenance only'
          assert repair['canonical_product_digest_role']=='shipping-vs-candidate semantic tree equivalence'
          assert repair['threshold_changed'] is False
          c=d['contract']
          assert c['format_revision']==24
          assert c['training_changed'] is False
          assert c['codec_competition_changed'] is False
          assert c['logical_semantics_changed'] is False
          assert c['live_dictionary_archives_must_remain_byte_identical'] is True
          t=d['target']
          assert t['rounds']==5
          assert t['deterministic'] is True
          assert t['same_verified_tree'] is True
          assert t['shipping_dead_dictionary_elided'] is True
          assert t['saving_bytes_vs_pre_elision'] > 0
          a=d['all15']
          assert len(a['rows'])==15
          assert a['gate']['exact_workload_count'] is True
          assert a['gate']['canonical_shipping_candidate_tree_identity'] is True
          assert a['gate']['historical_source_digest_not_misused_as_product_digest'] is True
          assert a['gate']['zero_byte_regressions'] is True
          assert a['gate']['at_least_one_strict_improvement'] is True
          assert a['gate']['live_dictionaries_unchanged'] is True
          assert a['gate']['shipping_regression_green'] is True
          assert a['shipping_total_bytes'] < a['pre_elision_total_bytes']
          improved=[row for row in a['rows'] if row['saving_bytes_vs_pre_elision'] > 0]
          # Exact causal receipt from the current shipping proof. This is not a release threshold:
          # the real invariant remains exactly three dead dictionaries removed, live dictionaries byte-identical,
          # canonical trees equal, and zero byte regressions across all fifteen workloads.
          assert len(improved) == 3
          exact_by_label={row['label']: row['saving_bytes_vs_pre_elision'] for row in improved}
          assert exact_by_label == {
              'neutral_hostile_v1/06_incremental_backups': 24664,
              'neutral_hostile_v1/07_incompressible_and_encrypted_like': 24662,
              'resemblance_hostile_v1/01_shifted_versions': 24682,
          }
          assert sum(exact_by_label.values()) == 74008
          assert a['shipping_total_bytes'] == 181501708
          assert a['pre_elision_total_bytes'] == 181575716
          assert a['pre_elision_total_bytes'] - a['shipping_total_bytes'] == 74008
          live=[row for row in a['rows'] if row['transform']['reason']=='dictionary-live']
          assert all(row['shipping_bytes']==row['pre_elision_bytes'] for row in live)
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-dead-dict-${{ github.sha }}
          path: benchmark-artifacts/v030-r24-dead-dict.json
          if-no-files-found: error
          retention-days: 90

# Shipping regression ratchet. Ordinary exact-head external/generalization/final authorities remain decisive.