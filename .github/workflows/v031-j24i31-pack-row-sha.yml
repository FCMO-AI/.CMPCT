# ci-lane: fast
# A specialized fast science court, not a release or benchmark receipt.
name: J24I31 fixed PACK present-row SHA scientific court

on:
  push:
    branches:
      - agent/phased1-v031-j24i31-pack-row-sha-custody-20261029
  pull_request:
    paths:
      - research/j24i31/**
      - docs/v031-research/*j24i31*
      - .github/workflows/v031-j24i31-pack-row-sha.yml
  workflow_dispatch:

concurrency:
  group: j24i31-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  installed-three-host:
    name: scientific-fixed-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Restore byte-identical repository blobs on Windows
        shell: bash
        run: |
          # Windows checkout can apply autocrlf before wheel installation.
          # Re-materialize from the Git INDEX with LF so installed Python and
          # source Git object identity remain exactly equal. No test weakening.
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout-index --all --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual source and independent decoder
        shell: bash
        run: |
          python -m pip install . zstandard
      - name: Bind original and installed source exact Git blobs
        shell: bash
        run: |
          mkdir -p j24i31-evidence
          python - <<'PY' | tee j24i31-evidence/source-custody.json
          import hashlib, json, subprocess
          from pathlib import Path
          import cmpct.reader, cmpct.codec
          expect = {
              'src/cmpct/reader.py': 'e716233403dabd0966863c45635e18fa5ac6afb8',
              'src/cmpct/codec.py': '29526db4203723d83523fc95d074c346b63d7587',
              'tests/conformance/v24-pack.json': 'ad081a46c6737eb9085ea69745cea09fb474e52a',
          }
          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          receipts = {}
          for path, want in expect.items():
              actual = git_blob(Path(path).read_bytes())
              assert actual == want, (path, actual, want)
              receipts[path] = actual
          for path, mod in [('src/cmpct/reader.py', cmpct.reader), ('src/cmpct/codec.py', cmpct.codec)]:
              installed = git_blob(Path(mod.__file__).read_bytes())
              assert installed == expect[path], (path, installed)
              receipts[path + ':installed'] = installed
          sha = subprocess.check_output(['git', 'rev-parse','HEAD'], text=True).strip()
          import os
          assert sha == os.environ['EVIDENCE_HEAD'], (sha, os.environ['EVIDENCE_HEAD'])
          print(json.dumps({'head':sha, 'blobs': receipts, 'scientific_scope':'frozen S_PACK row-SHA contradiction, not product success'},sort_keys=True))
          PY
      - name: Run authentic scientific negative and record full stdout
        shell: bash
        env:
          J24I31_RESULTS: ${{ github.workspace }}/j24i31-evidence/results.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/j24i31/test_pack_present_row_sha.py" 2>&1 | tee "$GITHUB_WORKSPACE/j24i31-evidence/court.log"
      - name: Check complete scientific receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("j24i31-evidence/results.json").read_text())
          rows=result['cases']
          assert len(rows)==8
          assert {r['physical_codec'] for r in rows}=={0,1}
          assert all(r['verify_count']==4 for r in rows)
          assert sum(r['present_contradiction_accepted'] for r in rows)==2
          assert {r['case'] for r in rows}=={'none','empty','matching','contradictory'}
          print('J24I31 eight authentic wire verdicts, including two NEGATIVE product acceptances')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24i31-fixed-pack-${{ matrix.os }}-${{ github.run_id }}
          path: j24i31-evidence/
          if-no-files-found: warn
          retention-days: 30
