name: CMPCT v0.30 R42 native G04 extraction oracle
# ci-lane: deep
on:
  push:
    branches: [agent/v030-r42-native-oracle-authority]
    paths:
      - .github/workflows/v030-r42-native-g04-oracle.yml
      - benchmarks/v030_g04_ml_native_reader_oracle.py
permissions: {contents: read}
env: {PYTHONPATH: .}
jobs:
  native-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install product dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Build shared portable reader
        run: cargo build --manifest-path native/cmpct-portable/Cargo.toml --release --bin cmpct-portable
      - name: Run existing fail-closed native-reader A/B on exact frozen ML input
        run: |
          python -m benchmarks.v030_g04_ml_native_reader_oracle \
            --native-cli native/cmpct-portable/target/release/cmpct-portable \
            --work-root benchmark-artifacts/r42-native-authority-work \
            --output benchmark-artifacts/r42-native-authority.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-r42-native-g04-oracle-${{ github.sha }}
          path: benchmark-artifacts/r42-native-authority.json
          if-no-files-found: error
