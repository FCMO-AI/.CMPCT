# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office sparse cold-reader transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_sparse_anchor_cold_reader_transfer.py'
      - '.github/workflows/v030-r4-office-sparse-anchor-cold-reader-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-office-sparsecold-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_office_sparse_anchor_cold_reader_transfer\.py|\.github/workflows/v030-r4-office-sparse-anchor-cold-reader-transfer\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  office-sparsecold-transfer:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile transfer falsifier
        run: python -m py_compile benchmarks/v030_r4_office_sparse_anchor_cold_reader_transfer.py
      - name: Run Office sparse cold-reader transfer
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_sparse_anchor_cold_reader_transfer.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-sparsecold-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-sparsecold.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-sparsecold.json'))
          assert d['schema']=='cmpct-v030-r4-office-sparse-anchor-cold-reader-transfer-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit']
          assert not c['runtime_parent_graph_used'] and not c['runtime_token_list_used'] and not c['runtime_decoded_owner_used']
          assert c['aligned_and_fixed_boundary_crossing_requests']
          assert c['no_page_size_sweep'] and c['no_anchor_spacing_sweep'] and c['no_codec_sweep'] and c['no_threshold_sweep'] and c['no_request_size_sweep']
          print(json.dumps({'summary':d['summary'],'economics':d['economics'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-sparse-anchor-cold-reader-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-sparsecold-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-sparsecold.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity only; the JSON hypothesis owns scientific support/falsification.
