# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 parent-phase RSS attribution

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - 'docs/v030-rnd/R25_PARENT_PHASE_RSS_PREREG.md'
      - 'benchmarks/v030_r25_parent_phase_rss_worker.py'
      - 'benchmarks/v030_r25_parent_phase_rss_oracle.py'
      - '.github/workflows/v030-r25-parent-phase-rss.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r25-parent-phase-rss-${{ github.sha }}
  cancel-in-progress: false

jobs:
  parent-phase-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Compile frozen phase instrument
        run: |
          python -m py_compile \
            benchmarks/v030_r25_parent_phase_rss_worker.py \
            benchmarks/v030_r25_parent_phase_rss_oracle.py
      - name: Run whole-process-tree parent-phase attribution
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_parent_phase_rss_oracle.py \
            --work-root benchmark-artifacts/v030-r25-parent-phase-rss-work \
            --output benchmark-artifacts/v030-r25-parent-phase-rss.json
      - name: Ratchet frozen identity and attribution surface
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/v030-r25-parent-phase-rss.json').read_text())
          assert data['source_commit'] == os.environ['EVIDENCE_HEAD']
          assert data['schema'] == 'cmpct-v030-r25-parent-phase-rss-v1'
          assert data['experiment_valid'] is True
          assert data['release_credit'] is False
          assert data['worker_failures'] == []
          assert data['repetitions'] == 3
          assert len(data['rows']) == 3
          c=data['contract']
          assert c['whole_process_tree_rss_decisive'] is True
          assert c['phase_labels_observational_only'] is True
          assert c['preserve_concurrency'] is True
          assert c['prefixgraph_process_boundary_preserved'] is True
          assert c['g04_parent_execution_required'] is True
          assert c['exact_product_identity_required'] is True
          assert c['production_source_changed'] is False
          assert c['candidate_semantics_changed'] is False
          assert c['release_thresholds_changed'] is False
          assert data['decision'] in {
              'RESIDUAL_PEAK_LOCALIZED_G04',
              'RESIDUAL_PEAK_LOCALIZED_FINAL_VERIFY',
              'RESIDUAL_PEAK_LOCALIZED_PUBLICATION',
              'RESIDUAL_PEAK_LOCALIZED_PROFILE_PREPARE',
              'RESIDUAL_PEAK_LOCALIZED_R24_OR_OUTER_OVERLAP',
              'RESIDUAL_PEAK_NOT_NARROWLY_LOCALIZED',
          }
          for row in data['rows']:
              assert row['tree_samples'] >= 100
              assert row['tree_sampler_errors'] == []
              assert row['tree_sampler_interval_s'] <= 0.01
              assert row['prefixgraph_children'] == 1
              assert row['g04_children'] == 0
              assert row['all_wrappers_restored'] is True
              assert row['semantic_owners']['identity_exact'] is True
          PY
      - name: CI topology custody self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-parent-phase-rss.yml
      - uses: actions/upload-artifact@v6
        with:
          name: v030-r25-parent-phase-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-parent-phase-rss.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. Production scheduling, representations, thresholds and release state are unchanged.
