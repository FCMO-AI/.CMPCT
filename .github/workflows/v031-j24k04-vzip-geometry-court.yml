# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 J24K04 signed VZIP geometry scientific court
on:
  pull_request:
    paths:
      - 'tests/test_j24k04_vzip_signed_geometry.py'
      - 'docs/v031-research/2026-10-27-j24k04-*'
      - '.github/workflows/v031-j24k04-vzip-geometry-court.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24k04-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-geometry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact source and independent golden provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          git hash-object src/cmpct/reader.py > evidence/reader-blob.txt
          git hash-object src/cmpct/validation.py > evidence/validation-blob.txt
          git hash-object src/cmpct/codec.py > evidence/codec-blob.txt
          git hash-object tests/test_j24k04_vzip_signed_geometry.py > evidence/court-blob.txt
          git hash-object tests/conformance/v24-virtual-zip.json > evidence/golden-stored-blob.txt
          git hash-object tests/conformance/v24-virtual-zip-deflate-mode1.json > evidence/golden-deflate-blob.txt
          python -V > evidence/python-version.txt
      - name: Install actual Python CMPCT product and focused test engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Fixed-byte positive and signed-invalid S_VZIP observations
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -s tests/test_j24k04_vzip_signed_geometry.py 2>&1 | tee evidence/j24k04-court.txt
      - name: Preserve observational receipt even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24k04-${{ matrix.os }}-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
