# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 C25CC01 distributed file-table frontier

# Exact-head evidence on 2026-08-29 preserved reconstruction/locality but projected
# 10,249,998 B versus 10,199,302 B Zstd-19: +50,696 B, and +20,581 B versus the
# current wrapped representation. The separately framed-table question is therefore
# answered. Preserve this receipt for manual replay; automatic work continues in the
# stricter co-located semantic floor, which gives framing/descriptors zero-byte cost.
on:
  workflow_dispatch:

concurrency:
  group: v030-c25cc01-distributed-file-table-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  distributed-file-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_c25cc01_distributed_file_table_oracle.py
      - name: Price distributed file-semantic ownership
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_c25cc01_distributed_file_table_oracle \
            --work-root benchmark-artifacts/v030-c25cc01-distributed-file-table-work \
            --output benchmark-artifacts/v030-c25cc01-distributed-file-table.json
      - name: Enforce diagnostic boundary and exact receipt custody
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-c25cc01-distributed-file-table.json').read_text())
          assert d['schema']=='cmpct-v030-c25cc01-distributed-file-table-oracle-v1'
          assert d['candidate_head']==os.environ['EVIDENCE_HEAD']
          assert d['gate']['exact_baseline_accounting'] is True
          assert d['gate']['exact_file_semantic_reconstruction'] is True
          assert d['gate']['current_locality_within_8x'] is True
          assert d['gate']['experiment_valid'] is True
          assert d['gate']['release_credit'] is False
          assert d['distributed']['moved_pack_rows'] > 0
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-c25cc01-distributed-file-table.yml
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-c25cc01-distributed-file-table-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-c25cc01-distributed-file-table.json
          if-no-files-found: error
          retention-days: 90
