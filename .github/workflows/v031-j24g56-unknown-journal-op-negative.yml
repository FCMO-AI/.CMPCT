# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# Negative research: green means authentic unknown-op mismatch was reproduced.
# Green is not a product acceptance or promotion signal.
name: CMPCT J24G56 unknown signed journal operation negative court
on:
  push:
    branches:
      - agent/phased2-v031-j24g56-authenticated-unknown-journal-op-20261029
  pull_request:
    branches:
      - agent/phased2-v031-j24g55-shared-journal-preflight-replay-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24g56-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-unknown-op-negative:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G56_EVIDENCE_DIR: evidence/physical
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head and original frozen question
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/physical
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 9c1cc45f6fde408540d807354bf78d925d6d4e18 HEAD
          git merge-base --is-ancestor 83e9f2eb277f023186b646f667cd443b7108f268 HEAD
          printf '%s\n' "$EXPECTED_HEAD" > evidence/head.txt
          for path in src/cmpct/reader.py src/cmpct/validation.py src/cmpct/journal_replay.py src/cmpct/transactions.py; do
            git rev-parse "HEAD:$path" >> evidence/source-blobs.txt
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual source and independent format decoder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'pytest>=8' 'zstandard>=0.22'
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          from pathlib import Path
          import cmpct.reader as reader
          import cmpct.validation as validation
          import cmpct.journal_replay as replay
          import cmpct.transactions as transactions
          for p,mod in (
              ('src/cmpct/reader.py',reader),
              ('src/cmpct/validation.py',validation),
              ('src/cmpct/journal_replay.py',replay),
              ('src/cmpct/transactions.py',transactions),
          ):
              assert Path(p).read_bytes().replace(b'\r\n',b'\n') == Path(mod.__file__).read_bytes().replace(b'\r\n',b'\n'), p
              print('SOURCE_EXACT',p)
          assert reader._apply_journal_ops is replay._apply_journal_ops
          assert validation._apply_journal_ops is replay._apply_journal_ops
          PY
      - name: Installed physical signed-op Reader-versus-preflight controls
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -s --junitxml=evidence/pytest.xml \
            tests/test_v031_j24g56_authenticated_unknown_op_research.py \
            2>&1 | tee evidence/pytest.log
      - name: Independent SHA-authenticated journal wire and tamper referee
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g56/independent_wire_referee.py evidence/physical \
            2>&1 | tee evidence/referee.log
          test -s evidence/physical/independent_wire_referee.json
      - name: Preserve original signed archives, source and outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g56-negative-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
