# ci-lane: fast
name: v0.31 J24B10 signed sparse extent quota scientific court

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/j24b10_sparse_quota_court.py'
      - 'research/j24b10_sparse_quota_referee.py'
      - '.github/workflows/v031-j24b10-sparse-quota.yml'
      - 'docs/v031-research/2026-10-28-j24b10-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-sparse-quota-falsifier:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      J24B10_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact scientific source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity before experiment
        shell: bash
        run: |
          git rev-parse HEAD | tee j24b10-head.txt
          test "$(git rev-parse HEAD)" = "$J24B10_EXPECTED_HEAD"
          git status --short
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CMPCT candidate wheel plus independent referee dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel
          python -m pip install . zstandard
          python -m pip show cmpct zstandard
      - name: Exercise genuine installed Reader and signed physical extent controls
        shell: bash
        run: |
          python research/j24b10_sparse_quota_court.py --out j24b10-artifacts
      - name: Independently reconstruct and challenge preserved wire evidence
        shell: bash
        run: |
          python research/j24b10_sparse_quota_referee.py --in-dir j24b10-artifacts
      - name: Preserve originals, outputs and negative evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b10-sparse-quota-${{ matrix.os }}-${{ github.run_id }}
          path: |
            j24b10-head.txt
            j24b10-artifacts/**
          if-no-files-found: warn
          retention-days: 30
