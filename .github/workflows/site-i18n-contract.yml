name: CMPCT curated localization contract
# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate

on:
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "docs/readme/**"
      - "docs/SITE_I18N.md"
      - "benchmarks/history/**"
      - "SURFACE_REVISION"
      - ".github/workflows/site-i18n-contract.yml"
  push:
    branches: [main, agent/site-curated-i18n]
    paths:
      - "site/**"
      - "README.md"
      - "docs/readme/**"
      - "docs/SITE_I18N.md"
      - "benchmarks/history/**"
      - "SURFACE_REVISION"
      - ".github/workflows/site-i18n-contract.yml"

permissions:
  contents: read

concurrency:
  group: site-i18n-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Classify only the newest exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(site/|README\.md$|docs/readme/|docs/SITE_I18N\.md$|benchmarks/history/|SURFACE_REVISION$|\.github/workflows/site-i18n-contract\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  curated-locales:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind localization evidence to exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build canonical public surface
        run: |
          python tools/check_public_surface.py
          python site/build_site.py --out _site
          python site/enhance_site.py _site

      - name: Validate curated language catalogue and READMEs
        run: |
          # Footnote: catalogue validation runs before Chromium so cheap semantic/API failures do not spend
          # browser minutes. It proves completeness, source alignment, placeholders, protected terms and
          # translated README authority markers; literary taste remains a human-review concern.
          node --check site/src/assets/i18n/catalog.js
          node --check site/src/assets/i18n/extended-meta.js
          node --check site/src/assets/i18n/extended-packs.js
          node --check site/src/assets/i18n/locale-pack.js
          node --check site/src/assets/i18n.js
          for f in site/src/assets/i18n/locales/*.js; do node --check "$f"; done
          node --check site/tests/i18n-contract.mjs
          node --check site/tests/i18n-viewport.mjs
          node site/tests/i18n-contract.mjs

      - name: Install pinned Chromium render harness
        run: |
          # Footnote: Playwright is CI-only and never ships with the static site. Keep the same pinned browser
          # family as the base public-proof workflow so locale failures are comparable to ordinary viewport proof.
          # Ubuntu runner images do not guarantee CJK glyph coverage; install Noto CJK so Japanese, Korean and
          # both Chinese scripts are rendered as actual language rather than tofu boxes during visual proof.
          # Hosted runners also inject unrelated third-party apt feeds. A transient packages.microsoft.com 403
          # must not block an Ubuntu-native font dependency, so update/install against the runner's canonical
          # Ubuntu source only and then prove the expected font family is actually present.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            update
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            install -y fonts-noto-cjk
          fc-list | grep -qi 'Noto Sans CJK'
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Render all localized stress cases
        run: |
          python -m http.server 4173 --directory _site >/tmp/cmpct-i18n-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node site/tests/i18n-viewport.mjs http://127.0.0.1:4173/ i18n-viewport-artifacts

      - name: Preserve localized render evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-i18n-matrix-${{ env.EVIDENCE_HEAD }}
          path: i18n-viewport-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/site-i18n-contract.yml

# Footnote: curated localization is part of the fingerprinted public release surface. PR proof therefore executes
# the exact candidate head, never GitHub's synthetic merge commit, so its render/catalogue receipt can be joined to
# the same v0.30 source fingerprint as the public-proof, version, native and final release authorities. The cheap
# scope job additionally prevents an old site change in a long-lived integration PR from replaying Chromium work on
# every unrelated head commit; only the newest exact commit can admit the expensive proof.
