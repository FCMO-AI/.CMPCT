# ci-lane: fast
# J24C22 signed fixed-owner physical working-set transfer court; science only.
name: CMPCT v031 J24C22 full-owner sweep
on:
  push:
    branches:
      - agent/phased3-v031-j24c22-full-owner-sweep-20261028
  pull_request:
    paths:
      - 'research/j24c22_*'
      - 'docs/v031-research/*j24c22*'
      - '.github/workflows/v031-j24c22-full-owner-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24c22-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installed-triplet:
    name: Three installed historical Readers on full 16MiB unique-owner reads
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Published v0.30.0 exact immutable source
        uses: actions/checkout@v6
        with:
          path: published
          ref: 80c358f8824ec1b20d349c92ed94c898090969b0
          persist-credentials: false
      - name: Unsafe fused #662 timing control only
        uses: actions/checkout@v6
        with:
          path: fused
          ref: a66fd593a83cc4c71556d3d86d835c51abd20a96
          persist-credentials: false
      - name: Sealed #676 candidate exact immutable source
        uses: actions/checkout@v6
        with:
          path: sealed
          ref: 3b6a73f9205f40f11124cd9ff332407e52cebb93
          persist-credentials: false
      - name: J24C22 independent scientific instrument HEAD
        uses: actions/checkout@v6
        with:
          path: court
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate exact Git/source identity and Python instrument syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C published rev-parse HEAD)" = 80c358f8824ec1b20d349c92ed94c898090969b0
          test "$(git -C fused rev-parse HEAD)" = a66fd593a83cc4c71556d3d86d835c51abd20a96
          test "$(git -C sealed rev-parse HEAD)" = 3b6a73f9205f40f11124cd9ff332407e52cebb93
          test "$(git -C court rev-parse HEAD)" = "$EVIDENCE_SHA"
          python -m py_compile court/research/j24c22_full_owner_sweep.py court/research/j24c22_independent_referee.py
      - name: Build three independently installed exact-source wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          mkdir -p receipts
          for arm in published fused sealed; do
            python -m pip wheel --no-deps "./$arm" -w "./$arm/dist"
            python -m venv "$arm-env"
            "./$arm-env/bin/python" -m pip install "./$arm/dist/"*.whl
            ARM="$arm" "./$arm-env/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import cmpct.reader
          p = Path(cmpct.reader.__file__).resolve()
          assert 'site-packages' in p.parts or 'dist-packages' in p.parts, p
          print('J24C22_INSTALLED', os.environ['ARM'], p)
          PY
          done
      - name: Generate unchanged prior J24C21 signed archive once
        shell: bash
        run: |
          set -euo pipefail
          ./sealed-env/bin/python court/research/j24c21_large_owner_court.py --generate --output receipts/fixtures | tee receipts/j24c21-generation.json
      - name: Independently precompute full-owner held-out queries
        shell: bash
        run: |
          set -euo pipefail
          ./sealed-env/bin/python court/research/j24c22_full_owner_sweep.py --derive --manifest receipts/fixtures/manifest.json --output receipts/j24c22-workset.json | tee receipts/j24c22-derived.json
      - name: Run balanced source-locked three-Reader complete sessions
        shell: bash
        run: |
          set -euo pipefail
          ./sealed-env/bin/python court/research/j24c22_full_owner_sweep.py --court --manifest receipts/fixtures/manifest.json --workset receipts/j24c22-workset.json --python-published "$PWD/published-env/bin/python" --python-fused "$PWD/fused-env/bin/python" --python-sealed "$PWD/sealed-env/bin/python" --repetitions 6 --output receipts/j24c22-raw.json | tee receipts/j24c22-court-summary.json
      - name: Independent exact physical work and eight corrupted-receipt referee
        shell: bash
        run: |
          set -euo pipefail
          ./sealed-env/bin/python court/research/j24c22_independent_referee.py --input receipts/j24c22-raw.json --workset receipts/j24c22-workset.json --fixtures receipts/fixtures --output receipts/j24c22-decision.json | tee receipts/j24c22-decision-summary.json
      - name: Preserve original wheels, signed archive and raw evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c22-full-owner-triplet-${{ env.EVIDENCE_SHA }}
          path: |
            receipts/
            published/dist/
            fused/dist/
            sealed/dist/
          if-no-files-found: warn
