# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 raw DEFLATE segment oracle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_raw_deflate_segment_oracle.py
      - name: Run raw-DEFLATE segmented experiment
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_raw_deflate_segment_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-raw-deflate-segment-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-raw-deflate-segment.json"
      - name: Independently enforce evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-raw-deflate-segment.json').read_text())
          assert d['schema']=='cmpct-v030-raw-deflate-segment-oracle-v1'
          assert d['workload']=='resemblance_hostile_v1/04_deflate_family'
          assert d['claim_boundary'].startswith('research-only')
          assert d['gate']['source_admitted'] is True
          assert d['gate']['all_candidates_exact_tree'] is True
          assert d['gate']['all_candidates_locality_green'] is True
          assert d['gate']['passed'] is True
          assert len(d['candidates']) == 12
          assert all(c['max_member_read_amplification'] <= 8.0 for c in d['candidates'])
          assert all(c['max_decode_unit_bytes'] <= 8*1024*1024 for c in d['candidates'])
          if d['viable_candidate'] is not None:
              c=d['viable_candidate']
              assert c['tree_verified'] is True and c['locality_green'] is True
              assert c['archive_bytes'] < d['zip']['archive_bytes']
              assert c['archive_bytes'] < d['tar_zstd19']['archive_bytes']
              assert c['create_s'] < d['zip']['create_s']
              assert c['create_s'] < d['tar_zstd19']['create_s']
          Path('benchmark-artifacts/v030-raw-deflate-segment-candidate.txt').write_text('${{ steps.candidate.outputs.sha }}\n')
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-raw-deflate-segment-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-raw-deflate-segment-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-raw-deflate-segment.json
            benchmark-artifacts/v030-raw-deflate-segment-candidate.txt
          if-no-files-found: error
          retention-days: 90

# Exact evidence at head 3fbb37eec6bb15f4259d41f845b098b85d62d5df admitted the frozen Deflate-family
# workload and proved all 12 segmented raw-DEFLATE candidates tree-exact and locality-green, but found no candidate
# simultaneously smaller and faster than both ZIP/Deflate and solid Zstd-19. The research family is therefore
# terminal negative evidence for v0.30 and remains manually reproducible without consuming automatic PR capacity.
