name: CMPCT v0.30 pathdict fused phase attribution v7

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_pathdict_fused_encode_referee.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v2.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v3.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v4.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v5.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v6.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v7.py
      - benchmarks/v030_r24_pathblind_dictionary_referee.py
      - benchmarks/v030_r24_micropack_same_grammar_attribution.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-pathdict-fused-encode-v7.yml

permissions:
  contents: read

jobs:
  fused-phase-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: |
          python -m py_compile \
            benchmarks/v030_r24_pathdict_fused_encode_referee.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v2.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v3.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v4.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v5.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v6.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v7.py
      - name: Execute phase attribution
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_pathdict_fused_encode_referee_v7 \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused-v7-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused-v7.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-pathdict-fused-v7.json').read_text())
          assert d['schema']=='cmpct-v030-r24-pathdict-fused-encode-v1'
          assert d['release_credit'] is False and d['canonical_builder_changed'] is False and d['genesis_rescore'] is False
          bad=d['identity_failures']; assert not bad, bad
          phases={k:v['phase_attribution'] for k,v in d['rows'].items()}
          print(json.dumps({'verdict':d['verdict'],'aggregate':d['aggregate'],'phases':phases},sort_keys=True))
          cpu_encode=sum(v['dictionary_encode_cpu_s'] for v in phases.values())
          cpu_resid=sum(v['dictionary_residual_cpu_s'] for v in phases.values())
          cpu_train=sum(v['dictionary_train_cpu_s'] for v in phases.values())
          wall_encode=sum(v['dictionary_encode_wall_s'] for v in phases.values())
          wall_resid=sum(v['dictionary_residual_wall_s'] for v in phases.values())
          wall_train=sum(v['dictionary_train_wall_s'] for v in phases.values())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
            for k,v in {
              'ce':f'{cpu_encode:.3f}','cr':f'{cpu_resid:.3f}','ct':f'{cpu_train:.3f}',
              'we':f'{wall_encode:.3f}','wr':f'{wall_resid:.3f}','wt':f'{wall_train:.3f}',
              'fp':d['corpus_fingerprint'][:10],
            }.items(): fh.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-pathdict-fused-v7-ce${{ steps.receipt.outputs.ce }}-cr${{ steps.receipt.outputs.cr }}-ct${{ steps.receipt.outputs.ct }}-we${{ steps.receipt.outputs.we }}-wr${{ steps.receipt.outputs.wr }}-wt${{ steps.receipt.outputs.wt }}-fp${{ steps.receipt.outputs.fp }}-${{ github.sha }}
          path: benchmark-artifacts/v030-pathdict-fused-v7.json
          if-no-files-found: error
          retention-days: 90

# Trigger-only edit after first registration of this workflow on the research branch.
