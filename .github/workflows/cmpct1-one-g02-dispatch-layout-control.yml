# ci-lane: fast
name: CMPCT1 ONE-G0.2 dispatch layout control

on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_minimizer_segmented_counter_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_tail_kernel.c"
      - "benchmarks/one/one_g02_minimizer_dispatch_layout_control.py"
      - ".github/workflows/cmpct1-one-g02-dispatch-layout-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run preregistered same-process binary-layout control
        id: layout
        run: |
          mkdir -p one-layout-control-artifacts
          python -m benchmarks.one.one_g02_minimizer_dispatch_layout_control | tee one-layout-control-artifacts/one-g02-dispatch-layout-control.json
      - name: Retain exact-head layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-dispatch-layout-control-${{ env.EVIDENCE_HEAD }}
          path: one-layout-control-artifacts/
          if-no-files-found: error

# Causal integration/layout diagnostic only; it cannot promote a selector or move a threshold.
