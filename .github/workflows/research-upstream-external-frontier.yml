name: Research upstream external comparator frontier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/research-upstream-external-frontier.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  upstream-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Bind exact research head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Install CMPCT and non-target benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o APT::Get::List-Cleanup='0'
          sudo apt-get install -y -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' zpaq gcc make ffmpeg libsndfile1 xz-utils
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Materialize checksum-pinned upstream 7-Zip 26.03 and Zstd 1.5.7
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream/bin /tmp/upstream/src
          curl -fL --retry 3 -o /tmp/upstream/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz
          echo 'dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695  /tmp/upstream/7z.tar.xz' | sha256sum -c -
          tar -xJf /tmp/upstream/7z.tar.xz -C /tmp/upstream/src
          SEVEN="$(find /tmp/upstream/src -type f -name 7zz -perm -u+x | head -1)"
          test -n "$SEVEN"
          install -m 0755 "$SEVEN" /tmp/upstream/bin/7z
          curl -fL --retry 3 -o /tmp/upstream/zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo 'eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  /tmp/upstream/zstd.tar.gz' | sha256sum -c -
          tar -xzf /tmp/upstream/zstd.tar.gz -C /tmp/upstream/src
          make -C /tmp/upstream/src/zstd-1.5.7 -j"$(nproc)" zstd
          install -m 0755 /tmp/upstream/src/zstd-1.5.7/programs/zstd /tmp/upstream/bin/zstd
          /tmp/upstream/bin/7z i | head -n 4
          /tmp/upstream/bin/zstd --version
          {
            echo '7zip_asset=7z2603-linux-x64.tar.xz'
            echo '7zip_sha256=dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695'
            echo 'zstd_asset=zstd-1.5.7.tar.gz'
            echo 'zstd_sha256=eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3'
            /tmp/upstream/bin/7z i | head -n 4
            /tmp/upstream/bin/zstd --version
          } > /tmp/upstream/provenance.txt
          echo '/tmp/upstream/bin' >> "$GITHUB_PATH"
      - name: Preflight unchanged strict scoreboard
        run: |
          set -euo pipefail
          test "$(command -v 7z)" = /tmp/upstream/bin/7z
          test "$(command -v zstd)" = /tmp/upstream/bin/zstd
          python -m pytest -q tests/test_v030_external_competitor_scoreboard.py
      - name: Run unchanged 15-workload matrix with upstream comparators
        run: |
          mkdir -p benchmark-artifacts
          cp /tmp/upstream/provenance.txt benchmark-artifacts/upstream-provenance.txt
          python benchmarks/v030_external_competitors_canonical.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-external-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-external-competitors.json"
      - name: Enforce unchanged strict external frontier contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-external-competitors.json')
          assert p.is_file(), 'matrix did not publish evidence'
          d=json.loads(p.read_text()); g=d['gate']; s=d['strict_per_workload_dominance']
          assert g['exact_workload_count'] is True
          assert g['all_cmpct_trees_verified'] is True
          assert g['all_zip_trees_verified'] is True
          assert s['workload_count']==15 and s['complete_comparator_rows']==15
          assert s['strict_joint_target']==15 and s['strict_joint_wins']==15
          assert all(r['comparators_complete'] and r['strict_joint_win'] for r in s['rows'])
          for k in ('all_workloads_strictly_beat_zip_size','all_workloads_strictly_beat_zstd19_size','all_workloads_strictly_beat_zip_create','all_workloads_strictly_beat_zstd19_create','strict_no_ties_size_or_create'):
              assert g[k] is True
          assert g['passed'] is True
          PY
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: research-upstream-external-frontier-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/
          if-no-files-found: warn
          retention-days: 90
