# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24I67 independent two-field predecessor ambiguity court; research only.
name: J24I67 Two-Parent Footer Camouflage Court

on:
  pull_request:
    branches:
      - agent/phased1-v031-j24g92-footer-parent-link-court-20261030
    paths:
      - 'research/j24i67_*'
      - 'docs/v031-research/*j24i67*'
      - '.github/workflows/j24i67-double-parent-court.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24i67-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  installed-three-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24I67_EVIDENCE: evidence/j24i67
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact scientific source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact Git source and preregistered ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor f29561c5e2d36a8f47aa35f61191911c0611be6b HEAD
          git merge-base --is-ancestor 36b3a7747018d2a1ee7313a5f4e17d10f8e1c300 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = e716233403dabd0966863c45635e18fa5ac6afb8
          mkdir -p "$J24I67_EVIDENCE"
          git rev-parse HEAD > "$J24I67_EVIDENCE/source-head.txt"
          git rev-parse HEAD:research/j24i67_double_parent_court.py > "$J24I67_EVIDENCE/instrument-blob.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged CMPCT source and independent wire codecs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22'
          python -m pip freeze > "$J24I67_EVIDENCE/pip-freeze.txt"
          python -m py_compile research/j24g92_footer_link_court.py research/j24i67_double_parent_court.py
      - name: Run installed Reader/preflight counterexample with original controls
        shell: bash
        run: |
          set -euo pipefail
          python research/j24i67_double_parent_court.py 2>&1 | tee "$J24I67_EVIDENCE/raw.log"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/j24i67/receipt.json').read_text())
          assert r['status']=='PASS' and set(r['cases'])=={'16','128'}
          for c in r['cases'].values():
              assert c['rooted_heuristic']['original']['accepted']
              assert not c['rooted_heuristic']['single']['accepted']
              assert c['rooted_heuristic']['double']['accepted']
              assert c['variants']['double']['reader']['accepted']
              assert c['variants']['double']['preflight']['accepted']
          print('HOSTED_TWO_FIELD_SCIENCE',r['decision'])
          PY
      - name: Preserve raw physical archives and actual installed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-j24i67-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/j24i67/
          if-no-files-found: warn
          retention-days: 30
