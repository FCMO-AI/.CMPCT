name: ONE-G0.2 bounded hierarchical concat

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_bounded_hierarchical_concat.py'
      - 'docs/one/evidence/ONE_G02_BOUNDED_HIERARCHICAL_CONCAT_PREREG_2026-09-05.md'
      - 'experiments/one/ir.py'
      - 'experiments/one/vm.py'
      - 'experiments/one/wire.py'
      - '.github/workflows/one-g02-bounded-hierarchical-concat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-hierarchical-concat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen bounded hierarchical concat gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_bounded_hierarchical_concat | tee one-g02-bounded-hierarchical-concat.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-bounded-hierarchical-concat-${{ github.sha }}
          path: one-g02-bounded-hierarchical-concat.json
          if-no-files-found: error
