# ci-lane: narrow
name: CMPCT1 ONE-G0.2 complete Surprise archive envelope

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/archive_envelope.py
      - experiments/one/ir.py
      - experiments/one/wire.py
      - experiments/one/range_vm.py
      - experiments/one/validated_program.py
      - tests/one/test_archive_envelope.py
      - docs/one/evidence/ONE_G02_SURPRISE_ARCHIVE_ENVELOPE_PREREG_2026-09-09.md
      - .github/workflows/cmpct1-one-g02-surprise-archive-envelope.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-surprise-archive-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install repository test surface
        run: python -m pip install -e '.[test]'
      - name: Run archive seam plus inherited ONE wire/range/validation semantics
        run: >-
          python -m pytest -q
          tests/one/test_archive_envelope.py
          tests/one/test_wire.py
          tests/one/test_range_vm.py
          tests/one/test_validated_program.py
