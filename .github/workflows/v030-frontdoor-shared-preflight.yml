# ci-lane: deep
name: CMPCT v0.30 shared front-door preflight oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_frontdoor_shared_preflight_oracle.py'
      - 'benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_logs_candidate.py'
      - '.github/workflows/v030-frontdoor-shared-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-frontdoor-shared-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  shared-frontdoor-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile shared preflight oracle
        run: |
          python -m py_compile benchmarks/v030_frontdoor_shared_preflight_oracle.py
          python -m py_compile benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py

      - name: Run exact shared-preflight A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py > benchmark-artifacts/v030-frontdoor-shared-preflight.json
          cat benchmark-artifacts/v030-frontdoor-shared-preflight.json

      - name: Ratchet exactness and earned performance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-frontdoor-shared-preflight.json').read_text())
          assert d['experiment']=='v030-frontdoor-shared-preflight-v1'
          assert d['research_only'] is True
          assert d['selector_change'] is False
          assert d['release_credit'] is False
          assert d['experiment_valid'] is True
          c=d['correctness']
          assert all(c.values())
          if d['promotion_signal']:
              n=d['nonlogs_performance']; l=d['logs_performance']; r=d['requirements']
              assert n['speedup_fraction']>=r['minimum_nonlogs_speedup_fraction']
              assert n['absolute_saving_s']>=r['minimum_nonlogs_absolute_saving_s']
              assert l['slowdown_fraction']<=r['maximum_logs_slowdown_fraction']
              assert l['shared_median_s']-l['current_median_s']<=r['maximum_logs_absolute_slowdown_s']
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-frontdoor-shared-preflight.yml

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Upload shared-preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-frontdoor-shared-preflight-${{ github.sha }}
          path: benchmark-artifacts/v030-frontdoor-shared-preflight.json
          if-no-files-found: warn
          retention-days: 90

# Research-only: no selector or release credit without an exact, material A/B win.
