# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 shared front-door preflight oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_frontdoor_shared_preflight_oracle.py'
      - 'benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_logs_candidate.py'
      - '.github/workflows/v030-frontdoor-shared-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-frontdoor-shared-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_frontdoor_shared_preflight_oracle(_v2)?\.py|experiments/entropygraph_v030_release_product(_logs_candidate)?\.py|\.github/workflows/v030-frontdoor-shared-preflight\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect the shared front-door proof.'
          fi

  shared-frontdoor-preflight:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile shared preflight oracle and shipping product
        run: |
          python -m py_compile benchmarks/v030_frontdoor_shared_preflight_oracle.py
          python -m py_compile benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py
          python -m py_compile experiments/entropygraph_v030_release_product.py

      - name: Ratchet promoted shipping wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmarks import v030_frontdoor_shared_preflight_oracle as oracle
          from experiments import entropygraph_v030_release_product as product
          assert product.PROMOTED_SHARED_FRONTDOOR_PREFLIGHT is True
          assert callable(product._shared_frontdoor_preflight)
          import tempfile
          with tempfile.TemporaryDirectory(prefix='cmpct-shared-shipping-') as td:
              base=Path(td)
              nonlogs=base/'nonlogs'; logs=base/'logs'
              oracle._make_nonlogs(nonlogs, files=1050, size=4096)
              oracle._make_logs(logs, ordinary=256)
              for root in (nonlogs, logs):
                  expected=oracle.shared_preflight(root)
                  actual=product._shared_frontdoor_preflight(root)
                  assert actual['logs_eligible'] == expected['logs_eligible']
                  assert actual['metadata_error'] == expected['metadata_error']
                  assert actual.get('short_circuited') == expected.get('short_circuited')
                  assert oracle._shape_equal(actual.get('shape'), expected.get('shape'))
          PY

      - name: Run exact shared-preflight A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_frontdoor_shared_preflight_oracle_v2.py > benchmark-artifacts/v030-frontdoor-shared-preflight.json
          cat benchmark-artifacts/v030-frontdoor-shared-preflight.json

      - name: Ratchet exactness and earned performance boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-frontdoor-shared-preflight.json')
          if not p.is_file():
              raise SystemExit('shared front-door preflight evidence missing')
          d=json.loads(p.read_text())
          assert d['experiment']=='v030-frontdoor-shared-preflight-v1'
          assert d['research_only'] is True
          assert d['selector_change'] is False
          assert d['release_credit'] is False
          assert d['experiment_valid'] is True
          assert all(d['correctness'].values())
          assert d['promotion_signal'] is True
          n=d['nonlogs_performance']; l=d['logs_performance']; r=d['requirements']
          assert n['speedup_fraction']>=r['minimum_nonlogs_speedup_fraction']
          assert n['absolute_saving_s']>=r['minimum_nonlogs_absolute_saving_s']
          assert l['slowdown_fraction']<=r['maximum_logs_slowdown_fraction']
          assert l['shared_median_s']-l['current_median_s']<=r['maximum_logs_absolute_slowdown_s']
          PY

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-frontdoor-shared-preflight.yml

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload shared-preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-frontdoor-shared-preflight-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-frontdoor-shared-preflight.json
          if-no-files-found: error
          retention-days: 90

# Shipping integration is ratcheted above; the research A/B remains the unchanged proof boundary that earned
# promotion and carries no independent release credit. Exact-head scoping prevents historical PR paths from
# replaying the 30-minute proof when the newest commit cannot affect its semantics.
