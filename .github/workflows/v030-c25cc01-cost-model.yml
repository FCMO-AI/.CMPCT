# ci-lane: deep
name: CMPCT v0.30 C25CC01 selector cost model

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_r24_compact_control_profile.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'benchmarks/v030_r24_compact_control_terminal_admission.py'
      - 'benchmarks/v030_r24_compact_control_terminal_generalization.py'
      - 'benchmarks/v030_r24_compact_control_cost_model_oracle.py'
      - 'benchmarks/v030_r24_compact_control_cost_model_oracle_v2.py'
      - 'benchmarks/v030_r24_compact_control_composition_oracle_v2.py'
      - 'benchmarks/v030_external_competitors.py'
      - '.github/workflows/v030-c25cc01-cost-model.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-c25cc01-cost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  selector-cost-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus and comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile structural cost oracle
        run: |
          python -m py_compile benchmarks/v030_r24_compact_control_cost_model_oracle.py
          python -m py_compile benchmarks/v030_r24_compact_control_cost_model_oracle_v2.py
      - name: Run exact structural cost decomposition
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_compact_control_cost_model_oracle_v2.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-c25cc01-cost-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-c25cc01-cost.json"
      - name: Require valid causal diagnostic without selector credit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-c25cc01-cost.json').read_text())
          assert d['schema']=='cmpct-v030-c25cc01-structural-cost-model-v1'
          c=d['contract']; g=d['gate']
          assert c['selector_change'] is False
          assert c['release_credit'] is False
          assert c['benchmark_identity_as_policy_input'] is False
          assert c['actual_archive_strong_verification_timed'] is True
          assert c['diagnostic_structure_scan_excluded_from_product_time'] is True
          assert g['all_four_cases_complete'] is True
          assert g['frozen_target_admitted'] is True
          assert g['structural_fields_deterministic'] is True
          assert g['integrity_preserved'] is True
          assert g['diagnostic_valid'] is True
          rows=d['rows']
          assert set(rows)=={'frozen_encrypted_like','entropy_mosaic_640','entropy_mosaic_1150','entropy_mosaic_1750'}
          for row in rows.values():
              assert row['candidate_bytes'] < row['r24_bytes']
              assert row['physical_blob_records'] >= 1
              assert row['compact_control_raw_bytes'] >= row['compact_control_comp_bytes_per_copy']
              assert row['payload_unchanged'] is True
              assert row['two_control_copies'] is True
              assert len(row['phase_samples']) == 5
              assert row['admitted_by_current_predicate'] is True
              assert 'strict_four_way_win' in row['competitors']
              # Diagnostic signals added after physical fragmentation failed to generalize.
              assert row['candidate_to_logical'] == row['candidate_bytes'] / max(1,row['logical_bytes'])
              assert row['candidate_over_logical_bytes'] == row['candidate_bytes'] - row['logical_bytes']
              assert row['r24_over_logical_bytes'] == row['r24_bytes'] - row['logical_bytes']
              assert isinstance(row['candidate_overhead_per_regular_file'], (int,float))
              assert isinstance(row['control_bytes_per_regular_file'], (int,float))
          derived={
              name for name,row in rows.items()
              if row['admitted_by_current_predicate'] and not row['competitors']['strict_four_way_win']
          }
          assert set(d['current_predicate_counterexamples']) == derived
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-c25cc01-cost-${{ github.sha }}
          path: benchmark-artifacts/v030-c25cc01-cost.json
          if-no-files-found: error
          retention-days: 90

# Research-only causal cost decomposition. The ordinary terminal-admission/generalization/external gates remain decisive.
# A measured counterexample remains negative evidence; the new logical-overhead fields are diagnostics, not selector inputs.
