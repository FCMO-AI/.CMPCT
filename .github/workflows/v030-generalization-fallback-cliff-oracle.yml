name: CMPCT v0.30 six-row fallback cliff oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - experiments/v030_generalization_fallback_cliff_oracle.py
      - .github/workflows/v030-generalization-fallback-cliff-oracle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-cliff:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Bind exact oracle head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile experiments/v030_generalization_fallback_cliff_oracle.py
      - name: Run direct current-substrate cliff measurement
        run: |
          mkdir -p benchmark-artifacts
          python experiments/v030_generalization_fallback_cliff_oracle.py \
            --work-root "$RUNNER_TEMP/v030-fallback-cliff" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-fallback-cliff.json"
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-fallback-cliff.json').read_text())
          assert d['status']=='PASS', d.get('error')
          assert d['product_release_credit'] is False
          assert d['contract']['target_rows']==6
          assert d['contract']['frozen_source_identity_required'] is True
          assert d['contract']['product_dispatch_changed'] is False
          assert d['contract']['release_thresholds_changed'] is False
          assert len(d['rows'])==6
          for r in d['rows']:
              assert r['inner_selected']=='v029-fallback'
              assert r['raw_g04_overlay_bytes'] >= r['staged_v029_base_bytes']
              assert r['strict_inner_win_bridge_bytes'] == r['raw_g04_overlay_bytes'] - r['staged_v029_base_bytes'] + 1
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-generalization-fallback-cliff-${{ github.sha }}
          path: benchmark-artifacts/v030-fallback-cliff.json
          if-no-files-found: error
          retention-days: 90
