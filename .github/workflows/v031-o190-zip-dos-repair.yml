# ci-lane: fast
name: v031 O190 signed DOS-date ZIP export positive court
on:
  pull_request:
    branches:
      - agent/v031-development
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_o190_zip_dos_time.py'
      - 'research/o190_zip_dos_repair_court.py'
      - 'docs/v031-research/2026-10-26-o190-*.md'
      - '.github/workflows/v031-o190-zip-dos-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-date-controls:
    name: DOS-date controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual CMPCT wheel and pytest
        run: |
          python -m pip install .
          python -m pip install pytest
      - name: Exact-source signed DOS-date bounds, local calendar, and legacy control
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python - <<'PY'
          import hashlib, inspect, os, pathlib, subprocess
          from cmpct.reader import CMPCT
          expect = subprocess.check_output(['git','show','HEAD:src/cmpct/reader.py']).replace(b'\r\n',b'\n')
          actual = pathlib.Path(inspect.getfile(CMPCT)).read_bytes().replace(b'\r\n',b'\n')
          assert actual == expect, 'installed source mismatch'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['EVIDENCE_HEAD']
          print('installed-Reader-sha256',hashlib.sha256(actual).hexdigest())
          PY
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_v031_o190_zip_dos_time.py" -q --junitxml="$RUNNER_TEMP/o190-unit-junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o190-date-unit-${{ matrix.os }}
          path: ${{ runner.temp }}/o190-unit-junit.xml
          if-no-files-found: warn

  linux-producer:
    name: Genuine Linux r24 signed-mtime archive producer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Build and fingerprint authentic pre1970, ordinary, future r24 inputs
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o190"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o190_zip_dos_repair_court.py" --role producer --directory "$RUNNER_TEMP/o190" --out "$RUNNER_TEMP/o190/producer-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o190-authentic-signed-r24-source
          path: ${{ runner.temp }}/o190/
          if-no-files-found: warn

  cross-host:
    name: Same r24 input ZIP export (${{ matrix.os }})
    needs: linux-producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: o190-authentic-signed-r24-source
          path: ${{ runner.temp }}/o190
      - name: Exact Git source, unchanged archive SHA, full ZIP CRC and DOS date
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o190_zip_dos_repair_court.py" --role consumer --directory "$RUNNER_TEMP/o190" --out "$RUNNER_TEMP/o190/consumer-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o190-crosshost-${{ matrix.os }}
          path: ${{ runner.temp }}/o190/
          if-no-files-found: warn
