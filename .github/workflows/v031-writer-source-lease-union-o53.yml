# ci-lane: fast
# O53: independent O51 descriptor source admission x serialized Writer/salvage.
# A narrowly scoped composition court; never release/benchmark promotion by itself.
name: CMPCT v0.31 O53 Writer descriptor x lease composition
on:
  push:
    branches: ['agent/phased2-v031-o51-salvage-writer-union-o53-20261025']
  pull_request:
    paths:
      - 'src/cmpct/transactions.py'
      - 'tests/test_v031_writer_fd_source_o51.py'
      - 'tests/test_v031_writer_source_lease_union_o53.py'
      - 'tests/test_v031_salvage_writer_union_r265.py'
      - '.github/workflows/v031-writer-source-lease-union-o53.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o53-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-installed-composition:
    name: O53 installed Writer source x salvage ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target source and immutable parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact product, original owner tests and prior source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor c1e75370281ca6b721ef10edf1ed15e6c5ef48f7 HEAD
          test "$(git hash-object src/cmpct/transactions.py)" = "79ea9e423d155b106f40cd0811075c69ff04f105"
          test "$(git hash-object tests/test_v031_writer_fd_source_o51.py)" = "b6e7a75f900171b85647a6d7ef06bd765101e041"
          test "$(git hash-object tests/test_v031_salvage_writer_union_r265.py)" = "15d536c08bd5d428e6ef2f77871ba5f7e465215f"
          test "$(git hash-object tests/test_v031_writer_source_lease_union_o53.py)" = "9b9742da0771abb2dedd2b5b9ad41b8192fa6fe3"
          test "$(git hash-object src/cmpct/reader.py)" = "c548a2ae4d650e928eb46ed1c2431423e49765b5"
          test "$(git hash-object src/cmpct/cli.py)" = "94bcd91af4ec8fa8282e3b1900d3c1d07a7a3235"
          git diff --exit-code c1e75370281ca6b721ef10edf1ed15e6c5ef48f7 HEAD -- src/cmpct/reader.py src/cmpct/builder.py src/cmpct/cli.py native benchmarks/zip_parity_bench.py tools/check_performance_regression.py
          printf 'O53_HEAD=%s\nO53_TRANSACTIONS_BLOB=%s\n' "$EVIDENCE_HEAD" "$(git hash-object src/cmpct/transactions.py)"
      - name: Install real distributable package, not checkout source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.transactions, cmpct.reader
          repo=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip())
          for module in (cmpct.transactions,cmpct.reader):
              path=Path(module.__file__).resolve()
              assert not path.is_relative_to(repo), "not true-installed: "+str(path)
              print("O53_INSTALLED="+str(path))
          PY
      - name: Execute original O51, original Writer-salvage and O53 interaction/A-B courts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o53-isolated
          cp tests/test_v031_writer_fd_source_o51.py o53-isolated/
          cp tests/test_v031_salvage_writer_union_r265.py o53-isolated/
          cp tests/test_v031_writer_source_lease_union_o53.py o53-isolated/
          python -m pytest -vv --noconftest o53-isolated/ --junitxml=o53-result.xml 2>&1 | tee o53-results.log
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root=ET.parse("o53-result.xml").getroot()
          suites=[root] if root.tag=="testsuite" else root.findall("./testsuite")
          assert suites, ("unexpected JUnit root",root.tag)
          counts={k:sum(int(s.attrib.get(k,0)) for s in suites)
                  for k in ("tests","failures","errors","skipped")}
          print("O53_RECEIPT="+repr(counts))
          assert counts["tests"] == 15, counts
          assert counts["failures"] == counts["errors"] == 0, counts
          assert counts["skipped"] == (8 if os.name=="nt" else 0), counts
          assert counts["tests"]-counts["skipped"] >= (7 if os.name=="nt" else 15), counts
          PY
      - name: Preserve source-bound proof and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o53-source-lease-${{ matrix.os }}-${{ github.sha }}
          path: |
            o53-result.xml
            o53-results.log
          if-no-files-found: warn
          retention-days: 30
