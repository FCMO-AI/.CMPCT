# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.31 rename destination fail-closed integration
on:
  push:
    branches:
      - agent/phased1-v031-rename-target-failclosed-on-update-20261023
    paths:
      - src/cmpct/transactions.py
      - tests/test_v031_rename_target_failclosed.py
      - .github/workflows/v031-rename-target-failclosed.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v031-rename-destination-${{ github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.sha }}
jobs:
  rename-destination:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real package
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Verify exact HEAD and inherited guard identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import pathlib, subprocess
          actual=subprocess.check_output(['git','hash-object','src/cmpct/transactions.py'],text=True).strip()
          assert actual=='f031e144f954b3f50305ef228c705a587619bdd1', actual
          src=pathlib.Path('src/cmpct/transactions.py').read_text()
          for marker in ('_require_valid_update_member(ar.index, member)',
                         '_reject_hardlink_owner_mutation(ar.index,old,',
                         '_reject_nonempty_directory_mutation(ar.index,old,',
                         '_require_valid_rename_destination(ar.index, old, new)'):
              assert marker in src, marker
          print('EXACT_SOURCE_ALL_OWNER_GUARDS_PASS', actual)
          PY
      - name: Run independent product regressions plus inherited guards
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python -m pytest -q \
            tests/test_v031_rename_target_failclosed.py \
            tests/test_v031_update_member_namespace_failclosed.py \
            tests/test_directory_subtree_failclosed.py \
            tests/test_v031_hardlink_owner_mutation_guard.py \
            2>&1 | tee benchmark-artifacts/rename-destination-integrated.log
      - name: Keep evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-rename-destination-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
