name: ONE-G0.2 cold rescue native cascade

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/one_g02_cold_rescue_native_cascade_ab.py'
      - 'benchmarks/one/one_g02_cold_rescue_native_cascade_kernel.c'
      - 'benchmarks/one/one_g02_shift_relation_sparse_gate_kernel.c'
      - 'benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_direct_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_restrict_kernel.c'
      - 'benchmarks/one/one_g02_bounded_shift_phase_certificate_validation.py'
      - 'benchmarks/one/one_g02_relation_shared_observer_validation.py'
      - 'docs/one/evidence/ONE_G02_COLD_RESCUE_NATIVE_CASCADE_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-cold-rescue-native-cascade.yml'

permissions:
  contents: read

jobs:
  native-cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen native cold-rescue A/B
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_cold_rescue_native_cascade_ab | tee artifacts/one/cold_rescue_native_cascade.json
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-cold-rescue-native-cascade-${{ github.sha }}
          path: artifacts/one/cold_rescue_native_cascade.json
          if-no-files-found: error
