name: CMPCT v0.30 Attractor Substrate child oracle

on:
  push:
    branches:
      - agent/v030-attractor-substrate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-attractor-substrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attractor-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out substrate research head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow reportlab python-docx openpyxl python-pptx numpy

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Run substrate integrity/recovery/resource tests
        run: |
          pytest -q \
            tests/test_v030_attractor_substrate.py \
            tests/test_v030_attractor_substrate_safe.py

      - name: Run exact complete-artifact substrate oracle
        run: |
          mkdir -p benchmark-artifacts
          # Footnote: accepted v0.29, CMPNX15 and solid tar+Zstd-19 all consume each same live repaired tree.
          # The hardened entrypoint preflights logical materialization bounds before strong verification.
          # Read amplification may remain explicit breakthrough debt; the <=8 MiB decode unit is never relaxed.
          set -o pipefail
          python benchmarks/attractor_substrate_v030_safe_entrypoint.py \
            --work-root benchmark-artifacts/substrate-work \
            --output benchmark-artifacts/attractor-substrate-v030.json \
            2>&1 | tee benchmark-artifacts/attractor-substrate-v030.stdout.txt

      - name: Enforce frozen complete-artifact breakthrough contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmark-artifacts/attractor-substrate-v030.json').read_text())
          totals = data['totals']
          contract = data['contract']
          assert data['schema'] == 'cmpct-v030-attractor-substrate-focused-v1'
          assert len(data['rows']) == 3
          assert all(row['portfolio_bytes'] <= row['v029_bytes'] for row in data['rows'])
          assert totals['portfolio_saving_vs_v029_bytes'] >= contract['minimum_portfolio_aggregate_saving_vs_v029_bytes']
          assert totals['max_single_raw_saving_vs_v029_bytes'] >= contract['minimum_single_raw_saving_vs_v029_bytes']
          assert totals['max_single_saving_vs_solid_zstd_bytes'] >= contract['minimum_single_saving_vs_solid_zstd_bytes']
          assert totals['substrate_raw_wins_vs_v029'] > 0
          assert totals['shared_phrase_ids'] > 0
          assert totals['max_decode_unit'] <= contract['max_decode_unit_bytes']
          assert totals['mechanism_gate'] is True
          print(json.dumps(totals, indent=2, sort_keys=True))
          PY

      - name: Upload substrate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-attractor-substrate-child
          path: benchmark-artifacts/
          if-no-files-found: warn
