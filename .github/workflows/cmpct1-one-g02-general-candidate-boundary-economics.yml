name: CMPCT1 ONE-G0.2 general candidate-boundary economics

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - "benchmarks/one/one_g02_general_candidate_boundary_hostile_economics.py"
      - "tests/one/test_general_candidate_boundary_hostile_economics.py"
      - "docs/one/prereg/ONE_G02_GENERAL_CANDIDATE_BOUNDARY_HOSTILE_ECONOMICS_PREREG_2026-09-10.md"
      - "docs/one/prereg/ONE_G02_GENERAL_CANDIDATE_BOUNDARY_HOSTILE_ECONOMICS_ANTI_VACUITY_AMENDMENT_2026-09-10.md"
      - ".github/workflows/cmpct1-one-g02-general-candidate-boundary-economics.yml"
  pull_request:
    paths:
      - "benchmarks/one/one_g02_general_candidate_boundary_hostile_economics.py"
      - "tests/one/test_general_candidate_boundary_hostile_economics.py"
      - "docs/one/prereg/ONE_G02_GENERAL_CANDIDATE_BOUNDARY_HOSTILE_ECONOMICS_PREREG_2026-09-10.md"
      - "docs/one/prereg/ONE_G02_GENERAL_CANDIDATE_BOUNDARY_HOSTILE_ECONOMICS_ANTI_VACUITY_AMENDMENT_2026-09-10.md"
      - ".github/workflows/cmpct1-one-g02-general-candidate-boundary-economics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-general-candidate-boundary-economics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run hostile economics tests
        run: python -m pytest -q tests/one/test_general_candidate_boundary_hostile_economics.py
      - name: Run transfer-only economics falsifier
        run: python -m benchmarks.one.one_g02_general_candidate_boundary_hostile_economics
      - name: Validate completed scientific outcome and Genesis darkness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("one-g02-general-candidate-boundary-hostile-economics.json").read_text())
          assert payload["decision"] in {
              "ADVANCE_GENERAL_CANDIDATE_BOUNDARY_ECONOMICS_PREFLIGHT",
              "HOLD_GENERAL_CANDIDATE_BOUNDARY_ECONOMICS",
          }
          for flag in ("genesis_inputs_executed", "genesis_comparison_executed", "genesis_scoring_executed", "genesis_winner_selected"):
              assert payload[flag] is False
          assert len(payload["rows"]) == 7
          any_hold = False
          for row in payload["rows"]:
              structure_ok = row["reader_structure_evidence"]["ok"] is True
              assert row["gates"]["expected_structure_exercised"] is structure_ok
              expected = "PASS" if all(row["gates"].values()) else "HOLD"
              assert row["decision"] == expected
              any_hold |= expected == "HOLD"
          assert payload["decision"] == (
              "HOLD_GENERAL_CANDIDATE_BOUNDARY_ECONOMICS" if any_hold
              else "ADVANCE_GENERAL_CANDIDATE_BOUNDARY_ECONOMICS_PREFLIGHT"
          )
          print(payload["decision"])
          for row in payload["rows"]:
              print(row["name"], row["law_wire_bytes"], row["surprise_wire_bytes"], row["law_minus_surprise_bytes"], row["decision"], row["reader_structure_evidence"])
          PY
      - name: Preserve exact-source receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          result_path = Path("one-g02-general-candidate-boundary-hostile-economics.json")
          if result_path.exists():
              result = json.loads(result_path.read_text())
              receipt = {
                  "schema": "cmpct-one-g02-general-candidate-boundary-economics-hosted-receipt-v3",
                  "source_sha": os.environ["GITHUB_SHA"],
                  "experimental_version": result["experimental_version"],
                  "decision": result["decision"],
                  "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
                  "claim_boundary": result["claim_boundary"],
                  "anti_vacuity_gate": True,
                  "reader_side_structure_proof": True,
                  "scientific_hold_is_successful_completion": True,
                  "genesis_inputs_executed": result["genesis_inputs_executed"],
                  "genesis_comparison_executed": result["genesis_comparison_executed"],
                  "genesis_scoring_executed": result["genesis_scoring_executed"],
                  "genesis_winner_selected": result["genesis_winner_selected"],
              }
              Path("one-g02-general-candidate-boundary-hosted-receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
      - name: Retain exact-source economics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-general-candidate-boundary-economics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            one-g02-general-candidate-boundary-hostile-economics.json
            one-g02-general-candidate-boundary-hosted-receipt.json
