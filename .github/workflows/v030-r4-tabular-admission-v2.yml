# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 sparse tabular admission

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-r4-tabular-admission-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-r4-tabular-admission-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-tabular-admission-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_tabular_(admission_oracle_v2|owner_oracle)\.py|benchmarks/(neutral_hostile_corpus_v1|resemblance_hostile_corpus_v1|neutral_hostile_determinism_repair_v[^/]*)\.py|\.github/workflows/v030-r4-tabular-admission-v2\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  sparse-admission:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r4_tabular_admission_oracle_v2.py benchmarks/v030_r4_tabular_owner_oracle.py
      - name: Run exact 15-workload sparse gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_tabular_admission_oracle_v2.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-admission-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-admission-v2.json"
      - name: Enforce receipt contract, not promotion
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-tabular-admission-v2.json').read_text())
          assert d['schema']=='cmpct-v030-r4-tabular-admission-oracle-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit']
          assert not c['filename_extension_used_for_admission'] and not c['workload_identity_used_for_admission']
          assert c['incremental_observation'] and c['full_proof_only_after_schema_and_sample_match']
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-tabular-admission-v2.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-tabular-admission-v2-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-tabular-admission-v2.json
          if-no-files-found: error
          retention-days: 90

# Research-only sparse opportunity gate; green proves receipt integrity, not shipping promotion.
