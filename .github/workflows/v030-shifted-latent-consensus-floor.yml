# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted latent consensus floor

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_latent_consensus_floor.py'
      - '.github/workflows/v030-shifted-latent-consensus-floor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_shifted_latent_consensus_floor.py'
      - '.github/workflows/v030-shifted-latent-consensus-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shifted-latent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_shifted_latent_consensus_floor\.py|\.github/workflows/v030-shifted-latent-consensus-floor\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  latent-consensus:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Validate decisive instrument
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/v030_shifted_latent_consensus_floor.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-latent-consensus-floor.yml
          python tools/check_public_surface.py
      - name: Run exact latent-consensus R4 floor
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_latent_consensus_floor.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-latent-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-latent-consensus.json"
      - name: Enforce exact decision boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-latent-consensus.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-latent-consensus.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-latent-consensus-floor-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['diagnosis']=='D4' and d['radicality']=='R4' and int(d['rps'])>=80
          assert set(['S1','S3']).issubset(d['saturation_inherited'])
          c=d['contract']
          assert c['benchmark_identity_used_in_representation'] is False
          assert c['pivot_selection']=='minimum logical-content SHA-256'
          assert c['max_chain_depth']==1
          assert c['creation_prices_consensus_derivation_and_second_pass_patches'] is True
          assert c['release_credit'] is False
          x=d['candidate']
          assert x['tree_verified'] is True
          assert x['max_chain_depth']==1
          assert int(x['max_decode_unit_bytes'])<=8*1024*1024
          assert float(x['max_member_read_amplification'])<=8.0
          assert int(x['payload_floor_bytes'])<=int(x['archive_bytes'])
          assert len(x['artifact_sha256'])==64
          z=int(d['comparators']['tar_zstd19_solid']['bytes'])
          assert d['decision']['payload_floor_zstd_gap_bytes']==int(x['payload_floor_bytes'])-z
          assert d['decision']['release_credit'] is False
          PY
      - name: Upload exact R4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-latent-consensus-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-latent-consensus.json
          if-no-files-found: error
          retention-days: 90

# Research only. A win advances generic productization; it never changes release authority directly.
