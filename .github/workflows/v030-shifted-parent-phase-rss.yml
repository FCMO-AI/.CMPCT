# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: v0.30 Shifted parent phase RSS attribution

on:
  workflow_call:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_shifted_parent_phase_rss.py
      - experiments/v030_hierarchical_bounded_screen_probe.py
      - .github/workflows/v030-shifted-parent-phase-rss.yml
      - experiments/entropygraph_v030_r24_process_prebuild.py
      - experiments/entropygraph_v030_r24_process_shipping.py
      - experiments/entropygraph_v030_release_product.py
      - src/cmpct/**
  workflow_dispatch:

permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Admit only latest-head Shifted attribution changes
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(benchmarks/v030_shifted_parent_phase_rss\.py|experiments/v030_hierarchical_bounded_screen_probe\.py|\.github/workflows/v030-shifted-parent-phase-rss\.yml|experiments/entropygraph_v030_(r24_process_prebuild|r24_process_shipping|release_product)\.py|src/cmpct/)'; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  attribute:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical frozen-corpus environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
      - name: Build native core
        run: cargo build --manifest-path native/cmpct-core/Cargo.toml --release --locked
      - name: Materialize one shared frozen Shifted source
        shell: bash
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import shutil
          from pathlib import Path
          from benchmarks import v030_release_performance as P
          root=Path('benchmark-artifacts/source-generator')
          corpora=P._build_corpora(root)
          source=corpora[('resemblance_hostile_v1','01_shifted_versions')]
          target=Path('benchmark-artifacts/shared-shifted-source')
          shutil.copytree(source,target,copy_function=shutil.copy2)
          print(target)
          PY
      - name: Incumbent Shifted attribution
        run: |
          python -m benchmarks.v030_shifted_parent_phase_rss \
            --source-root benchmark-artifacts/shared-shifted-source \
            --work-root benchmark-artifacts/incumbent-work \
            --output benchmark-artifacts/incumbent.json \
            2>&1 | tee benchmark-artifacts/incumbent.log
      - name: Bounded-screen Shifted A/B
        run: |
          python -m benchmarks.v030_shifted_parent_phase_rss \
            --bounded-screen \
            --source-root benchmark-artifacts/shared-shifted-source \
            --work-root benchmark-artifacts/bounded-work \
            --output benchmark-artifacts/bounded.json \
            2>&1 | tee benchmark-artifacts/bounded.log
      - name: Require exact product identity between arms
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('benchmark-artifacts/incumbent.json').read_text())
          b=json.loads(Path('benchmark-artifacts/bounded.json').read_text())
          for key in ('selected','format_revision','archive_bytes','archive_sha256'):
              assert a[key]==b[key], (key,a[key],b[key])
          print(json.dumps({'incumbent_peak':a['peak'],'bounded_peak':b['peak'],'archive_bytes':a['archive_bytes'],'archive_sha256':a['archive_sha256'],'selected':a['selected']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-shifted-parent-phase-rss-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/incumbent.json
            benchmark-artifacts/incumbent.log
            benchmark-artifacts/bounded.json
            benchmark-artifacts/bounded.log
          if-no-files-found: error
