# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: v0.30 creator memory attribution

on:
  workflow_call:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_shifted_parent_phase_rss.py
      - benchmarks/v030_logs_candidate_scheduling_ab.py
      - experiments/v030_hierarchical_bounded_screen_probe.py
      - experiments/entropygraph_v030_hierarchical_geometry.py
      - experiments/entropygraph_v030_release_product_logs_candidate.py
      - .github/workflows/v030-shifted-parent-phase-rss.yml
      - experiments/entropygraph_v030_r24_process_prebuild.py
      - experiments/entropygraph_v030_r24_process_shipping.py
      - experiments/entropygraph_v030_release_product.py
      - src/cmpct/**
  workflow_dispatch:

permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_shifted: ${{ steps.scope.outputs.run_shifted }}
      run_logs: ${{ steps.scope.outputs.run_logs }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", fetch-depth: 2}
      - id: scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(benchmarks/v030_shifted_parent_phase_rss\.py|experiments/v030_hierarchical_bounded_screen_probe\.py|experiments/entropygraph_v030_hierarchical_geometry\.py|experiments/entropygraph_v030_(r24_process_prebuild|r24_process_shipping|release_product)\.py|src/cmpct/)'; then echo 'run_shifted=true' >> "$GITHUB_OUTPUT"; else echo 'run_shifted=false' >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$files" | grep -Eq '^(benchmarks/v030_logs_candidate_scheduling_ab\.py|experiments/entropygraph_v030_release_product_logs_candidate\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-shifted-parent-phase-rss\.yml)'; then echo 'run_logs=true' >> "$GITHUB_OUTPUT"; else echo 'run_logs=false' >> "$GITHUB_OUTPUT"; fi

  shifted:
    needs: classify
    if: needs.classify.outputs.run_shifted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-shifted-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}"}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install canonical frozen-corpus environment
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
      - run: cargo build --manifest-path native/cmpct-core/Cargo.toml --release --locked
      - name: Materialize Shifted
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import shutil
          from pathlib import Path
          from benchmarks import v030_release_performance as P
          source=P._build_corpora(Path('benchmark-artifacts/source-generator'))[('resemblance_hostile_v1','01_shifted_versions')]
          shutil.copytree(source,Path('benchmark-artifacts/shared-shifted-source'),copy_function=shutil.copy2)
          PY
      - name: Shipping/oracle identity
        run: |
          python -m benchmarks.v030_shifted_parent_phase_rss --source-root benchmark-artifacts/shared-shifted-source --work-root benchmark-artifacts/incumbent-work --output benchmark-artifacts/incumbent.json
          python -m benchmarks.v030_shifted_parent_phase_rss --bounded-screen --source-root benchmark-artifacts/shared-shifted-source --work-root benchmark-artifacts/bounded-work --output benchmark-artifacts/bounded.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('benchmark-artifacts/incumbent.json').read_text()); b=json.loads(Path('benchmark-artifacts/bounded.json').read_text())
          for k in ('selected','format_revision','archive_bytes','archive_sha256'): assert a[k]==b[k],(k,a[k],b[k])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-shifted-parent-phase-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/*.json
          if-no-files-found: error

  logs-scheduling:
    needs: classify
    if: needs.classify.outputs.run_logs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-logs-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}"}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install canonical frozen-corpus environment
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
      - run: cargo build --manifest-path native/cmpct-core/Cargo.toml --release --locked
      - name: Materialize Logs
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import shutil
          from pathlib import Path
          from benchmarks import v030_release_performance as P
          source=P._build_corpora(Path('benchmark-artifacts/source-generator'))[('neutral_hostile_v1','05_logs_and_telemetry')]
          shutil.copytree(source,Path('benchmark-artifacts/shared-logs-source'),copy_function=shutil.copy2)
          PY
      - name: Run A-B-C
        run: |
          for arm in threaded sequential r24-child; do
            python -m benchmarks.v030_logs_candidate_scheduling_ab --arm "$arm" --source-root benchmark-artifacts/shared-logs-source --work-root "benchmark-artifacts/$arm-work" --output "benchmark-artifacts/$arm.json" 2>&1 | tee "benchmark-artifacts/$arm.log"
          done
      - name: Require exact identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows={a:json.loads(Path(f'benchmark-artifacts/{a}.json').read_text()) for a in ('threaded','sequential','r24-child')}; base=rows['threaded']
          for arm,row in rows.items():
            for k in ('selected','format_revision','archive_bytes','archive_sha256','admission'): assert row[k]==base[k],(arm,k,row[k],base[k])
          summary={a:{k:r[k] for k in ('parent_peak_rss_kib','tree_peak_rss_kib','wall_s','cpu_s','archive_bytes','archive_sha256')} for a,r in rows.items()}
          Path('benchmark-artifacts/summary.json').write_text(json.dumps(summary,indent=2)+'\n'); print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-logs-candidate-scheduling-ab-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/threaded.json
            benchmark-artifacts/threaded.log
            benchmark-artifacts/sequential.json
            benchmark-artifacts/sequential.log
            benchmark-artifacts/r24-child.json
            benchmark-artifacts/r24-child.log
            benchmark-artifacts/summary.json
          if-no-files-found: error
