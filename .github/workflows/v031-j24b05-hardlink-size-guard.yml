# ci-lane: fast
name: CMPCT v0.31 J24B05 signed hardlink alias-size guard
on:
  pull_request:
    paths:
      - 'src/cmpct/validation.py'
      - 'tests/test_v031_j24b05_hardlink_size_guard.py'
      - '.github/workflows/v031-j24b05-hardlink-size-guard.yml'
      - 'docs/v031-research/2026-10-27-j24b05-hardlink-alias-size-prereg.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24b05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  authentic-signed-wire:
    name: signed-wire (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
          fetch-depth: 0  # retain exact #342 historical object for same-source ABBA
      - name: Assert tested commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git rev-parse HEAD | tee j24b05-head.txt
          git hash-object src/cmpct/validation.py | tee j24b05-validator-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentic CMPCT package
        run: python -m pip install -e ".[test]"
      - name: Run prospectively frozen alias geometry and inherited topology
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -rs tests/test_v031_j24b05_hardlink_size_guard.py tests/test_v031_hardlink_graph_budget.py tests/test_v031_signed_tree_preflight.py 2>&1 | tee j24b05-court.log
      - name: Same-archive ABBA vs exact parent #342, plus allocation discriminator
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -o pipefail
          python -u experiments/v031_j24b05_alias_size_abba.py 2>&1 | tee j24b05-abba.log
      - name: Retain source and test verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b05-${{ matrix.os }}-${{ github.sha }}
          path: |
            j24b05-head.txt
            j24b05-validator-blob.txt
            j24b05-court.log
            j24b05-abba.log
            j24b05-abba.json
          if-no-files-found: warn
          retention-days: 30
