# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 G04 bounded record-audition parallelism

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/.v030-research-trigger'
      - 'benchmarks/v030_g04_record_audition_parallel_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - 'experiments/entropygraph_v030_hierarchical_geometry.py'
      - '.github/workflows/v030-g04-record-audition-parallel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/.v030-research-trigger'
      - 'benchmarks/v030_g04_record_audition_parallel_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - 'experiments/entropygraph_v030_hierarchical_geometry.py'
      - '.github/workflows/v030-g04-record-audition-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-g04-record-audition-parallel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/\.v030-research-trigger|benchmarks/v030_g04_record_audition_parallel_oracle\.py|benchmarks/v030_release_performance\.py|experiments/entropygraph_v030_geometry_overlay_g04\.py|experiments/entropygraph_v030_hierarchical_geometry\.py|\.github/workflows/v030-g04-record-audition-parallel\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect the G04 parallel-audition frontier.'
          fi

  bounded-parallel-audition:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact ML corpus dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile bounded-parallel oracle and exact mechanism
        run: |
          python -m py_compile \
            benchmarks/v030_g04_record_audition_parallel_oracle.py \
            experiments/entropygraph_v030_geometry_overlay_g04.py \
            experiments/entropygraph_v030_hierarchical_geometry.py
      - name: Run fresh-process 1/2/4-worker ML audition frontier
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_g04_record_audition_parallel_oracle \
            --work-root "$RUNNER_TEMP/v030-g04-record-audition-parallel" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-record-audition-parallel.json"
      - name: Ratchet exact-result and research boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-g04-record-audition-parallel.json')
          e=json.loads(p.read_text())
          assert e['schema']=='cmpct-v030-g04-record-audition-parallel-v1'
          assert e['source_commit']==os.environ['EVIDENCE_HEAD']
          assert e['target']==['neutral_hostile_v1','09_ml_artifacts']
          assert e['experiment_valid'] is True
          assert e['exact_candidate_identity_all_arms'] is True
          assert e['release_credit'] is False
          assert set(e['summary'])=={'1','2','4'}
          c=e['contract']
          assert c['fresh_process_per_arm'] is True
          assert c['graph_construction_timed'] is False and c['research_mechanism_only'] is True
          assert c['record_audition_function_changed'] is False
          assert c['candidate_set_changed'] is False and c['tie_law_changed'] is False
          assert c['result_order_preserved'] is True
          assert c['complete_product_authority_required_before_promotion'] is True
          if e['promotion_signal']:
              best=str(e['best_bounded_parallel_arm'])
              row=e['summary'][best]
              assert row['speedup_fraction_vs_w1'] >= c['minimum_audition_wall_speedup_fraction']
              assert row['rss_ratio_vs_w1'] <= c['maximum_incremental_rss_ratio_vs_serial']
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-g04-record-audition-parallel-candidate.txt
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-g04-record-audition-parallel.yml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-g04-record-audition-parallel-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-g04-record-audition-parallel.json
            benchmark-artifacts/v030-g04-record-audition-parallel-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Research-only mechanism frontier. Graph construction is intentionally excluded from the isolated audition timer,
# but no such exclusion is allowed in complete-product release authority. Positive evidence merely nominates a
# byte-identical bounded-parallel product candidate for full v0.29/runtime/external/recovery/native/Android proof.
