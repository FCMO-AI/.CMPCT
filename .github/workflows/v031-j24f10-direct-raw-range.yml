# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 J24F10 direct RAW range source-lifetime court
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'research/j24f10_direct_raw_range_pread_court.py'
      - '.github/workflows/v031-j24f10-direct-raw-range.yml'
      - 'docs/v031-research/2026-10-27-j24f10-direct-raw-range-prereg.md'
      - 'docs/v031-research/2026-10-27-j24f10-direct-raw-range-result.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: j24f10-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  genuine-direct-raw-range:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 20d752c8c19d700512a38bcc7026d3d9b3b72b16 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = "9f3172cd850e17202feac71651780d0cc989541c"
          test "$(git rev-parse 20d752c8c19d700512a38bcc7026d3d9b3b72b16:src/cmpct/reader.py)" = "a6a74068b34d726fc38bc151e5f191ce2dd45993"
          git show 20d752c8c19d700512a38bcc7026d3d9b3b72b16:src/cmpct/reader.py > "${{ runner.temp }}/j24f10_historical_reader.py"
          test "$(git hash-object "${{ runner.temp }}/j24f10_historical_reader.py")" = "a6a74068b34d726fc38bc151e5f191ce2dd45993"
      - name: Install exact candidate package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Execute SIGBUS negative and descriptor positive controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-artifacts
          python research/j24f10_direct_raw_range_pread_court.py \
            --parent "${{ runner.temp }}/j24f10_historical_reader.py" \
            --output "${{ github.workspace }}/evidence-artifacts/j24f10.json" \
            | tee evidence-artifacts/stdout.txt
          test -s evidence-artifacts/j24f10.json
      - name: Preserve raw receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24f10-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence-artifacts/
          if-no-files-found: warn
          retention-days: 30
