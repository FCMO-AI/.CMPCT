# ci-lane: research
name: CMPCT native-core lock repair once

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths: ['.github/workflows/v030-core-lock-repair-once.yml']

permissions:
  contents: read

concurrency:
  group: cmpct-native-core-lock-repair-once
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Bind triggering head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Regenerate and validate native-core lock from committed manifest
        working-directory: native/cmpct-core
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo check --locked
          grep -A4 '^name = "claxon"$' Cargo.lock
          sha256sum Cargo.lock | tee "$RUNNER_TEMP/native-core-Cargo.lock.sha256"
      - name: Export exact generated lock
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-native-core-lock-${{ github.sha }}
          path: |
            native/cmpct-core/Cargo.lock
            ${{ runner.temp }}/native-core-Cargo.lock.sha256
          if-no-files-found: error
          retention-days: 7
