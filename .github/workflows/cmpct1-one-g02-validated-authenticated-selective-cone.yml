# ci-lane: deep
name: CMPCT1 ONE-G0.2 validated authenticated selective cone

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/validated_program.py
      - experiments/one/range_vm.py
      - experiments/one/native_law_range_plan.py
      - experiments/one/selective_auth.py
      - experiments/one/authenticated_native_selective_cone.py
      - experiments/one/auth_tree.py
      - tests/one/test_validated_program.py
      - tests/one/test_validated_authenticated_selective.py
      - benchmarks/one/one_g02_validated_authenticated_selective_cone.py
      - .github/workflows/cmpct1-one-g02-validated-authenticated-selective-cone.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-validated-auth-selective-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EVIDENCE_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Run shared-open semantic and hostile tests
        run: >-
          python -m pytest -q
          tests/one/test_validated_program.py
          tests/one/test_validated_authenticated_selective.py
          tests/one/test_selective_auth.py
          tests/one/test_native_law_range_plan.py
      - name: Run frozen shared-open authenticated selective-cone falsifier
        run: |
          set +e
          python -m benchmarks.one.one_g02_validated_authenticated_selective_cone > validated-authenticated-selective-cone.json
          status=$?
          cat validated-authenticated-selective-cone.json
          exit $status
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-authenticated-selective-cone-${{ github.sha }}
          path: validated-authenticated-selective-cone.json
          if-no-files-found: error
          retention-days: 30
