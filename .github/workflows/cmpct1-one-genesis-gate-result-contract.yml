# ci-lane: fast
name: CMPCT1 ONE Genesis gate result contract

on:
  push:
    branches: [research/cmpct1]
    paths:
      - benchmarks/one/genesis_gate_workload_identity_v1.json
      - benchmarks/one/genesis_one_candidate_boundary_v1.json
      - benchmarks/one/one_genesis_gate_readiness.py
      - benchmarks/one/one_genesis_gate_result_validator.py
      - benchmarks/one/one_genesis_gate_executor_preflight.py
      - benchmarks/one/one_genesis_gate_measurement_executor.py
      - benchmarks/one/one_genesis_gate_measurement_executor_v2.py
      - benchmarks/one/one_genesis_physical_seal_identity.py
      - benchmarks/one/one_genesis_cmpct1_product_worker.py
      - benchmarks/one/one_g02_genesis_candidate_adapter_probe.py
      - tests/one/test_genesis_gate_result_validator.py
      - tests/one/test_genesis_gate_executor_preflight.py
      - tests/one/test_genesis_gate_measurement_executor.py
      - tests/one/test_genesis_gate_measurement_executor_v2.py
      - tests/one/test_genesis_cmpct1_product_worker.py
      - docs/one/prereg/ONE_GENESIS_GATE_EXECUTION_CONTRACT_2026-09-10.md
      - docs/one/prereg/ONE_G02_GENESIS_CANDIDATE_ADAPTER_PROBE_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_GENESIS_CANDIDATE_BOUNDARY_ENFORCEMENT_2026-09-10.md
      - docs/one/prereg/ONE_GENESIS_CANDIDATE_RUNTIME_TREE_BINDING_2026-09-10.md
      - docs/one/evidence/ONE_GENESIS_FROZEN_COMPARATOR_LEDGER_2026-09-09.md
      - .github/workflows/cmpct1-one-genesis-gate-result-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-genesis-gate-result-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EVIDENCE_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Install test and deterministic-corpus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -e '.[test]'
      - name: Check CI topology for this workflow
        run: python tools/check_ci_topology.py .github/workflows/cmpct1-one-genesis-gate-result-contract.yml
      - name: Falsify gate-result, preflight, raw-measurement, and candidate-certification contracts
        run: |
          python -m pytest -q \
            tests/one/test_genesis_gate_result_validator.py \
            tests/one/test_genesis_gate_executor_preflight.py \
            tests/one/test_genesis_gate_measurement_executor.py \
            tests/one/test_genesis_gate_measurement_executor_v2.py \
            tests/one/test_genesis_cmpct1_product_worker.py \
            | tee genesis-gate-result-contract.txt
      - name: Falsify transfer-only ONE candidate product boundary
        run: |
          python -m benchmarks.one.one_g02_genesis_candidate_adapter_probe \
            | tee one-g02-genesis-candidate-adapter-probe.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('one-g02-genesis-candidate-adapter-probe.json').read_text())
          assert p['schema'] == 'cmpct-one-g02-genesis-candidate-adapter-probe-v1'
          assert p['experimental_version'] == 'ONE-G0.2'
          assert p['decision'] == 'ADVANCE_ONE_ADAPTER_BOUNDARY'
          assert p['deterministic_wire'] is True
          assert p['whole_reconstruction_exact'] is True
          assert p['authenticated_selective_exact'] is True
          assert p['generic_reader_ontology_only'] is True
          assert p['genesis_workload_modules_imported'] is False
          assert p['genesis_inputs_executed'] is False
          assert p['comparison_executed'] is False
          assert p['scoring_executed'] is False
          assert p['winner_selected'] is False
          assert p['reader_burden'] == {'reader_discovery': False, 'hidden_codec': False}
          assert p['complete_stored_bytes'] == p['stats']['wire_bytes']
          PY
      - name: Exercise pre-gate fixture plumbing only
        run: |
          python -m benchmarks.one.one_genesis_gate_measurement_executor_v2 \
            --candidate-sha "$GITHUB_SHA" \
            --now '2026-09-10T12:00:00-06:00' \
            --fixture \
            --raw-dir genesis-fixture-raw \
            --output genesis-fixture-joined.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('genesis-fixture-joined.json').read_text())
          assert result['synthetic'] is True
          assert result['production_eligible'] is False
          assert result['evidence_contract'] == 'portable-physical-input-identity-v2'
          assert result['physical_input_seal'] == {'status': 'not-executed-in-fixture'}
          assert len(result['workloads']) == 15
          state = result['execution_state']
          assert state['physical_input_seal_executed'] is False
          assert state['scientific_input_identity_executed'] is False
          assert state['contender_measurement_executed'] is False
          assert state['comparisons_executed'] is False
          assert state['scoring_executed'] is False
          assert state['winner_selected'] is False
          assert len(list(Path('genesis-fixture-raw').glob('*-raw.json'))) == 3
          PY
      - name: Exercise physical-input seal and portable scientific identity without contenders
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.one.one_genesis_gate_measurement_executor import _seal_physical_inputs
          from benchmarks.one.one_genesis_physical_seal_identity import scientific_identity_receipt
          seal = _seal_physical_inputs(Path('genesis-physical-work'))
          assert seal['schema'] == 'cmpct-one-genesis-physical-input-seal-v1'
          assert seal['all_15_identities_exact'] is True
          assert len(seal['rows']) == 15
          portable = scientific_identity_receipt(seal)
          assert portable['schema'] == 'cmpct-one-genesis-physical-input-identity-receipt-v1'
          assert portable['work_root_in_scientific_digest'] is False
          assert len(portable['scientific_identity']['rows']) == 15
          Path('genesis-physical-input-seal.json').write_text(json.dumps(seal, indent=2, sort_keys=True) + '\n')
          Path('genesis-physical-input-scientific-identity.json').write_text(json.dumps(portable, indent=2, sort_keys=True) + '\n')
          PY
      - name: Retain exact-source contract receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          log = Path('genesis-gate-result-contract.txt')
          fixture = Path('genesis-fixture-joined.json')
          physical = Path('genesis-physical-input-seal.json')
          portable = Path('genesis-physical-input-scientific-identity.json')
          adapter = Path('one-g02-genesis-candidate-adapter-probe.json')
          fixture_payload = json.loads(fixture.read_text()) if fixture.exists() else None
          physical_payload = json.loads(physical.read_text()) if physical.exists() else None
          portable_payload = json.loads(portable.read_text()) if portable.exists() else None
          adapter_payload = json.loads(adapter.read_text()) if adapter.exists() else None
          physical_digest = ('sha256:' + hashlib.sha256(physical.read_bytes()).hexdigest()) if physical.exists() else 'unavailable'
          payload = {
              'schema': 'cmpct-one-genesis-gate-result-contract-receipt-v8',
              'source_sha': os.environ['EVIDENCE_HEAD'],
              'frozen_v029': '02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d',
              'frozen_v030': 'f4b158a55a08b9b18b50e4e4abe4b9251048c772',
              'readiness_source': '070d4f803c7b4441f517fc5c0b90f19214f5b05f',
              'readiness_artifact_digest': 'sha256:a1b009dfed8deeed3a9d46ab0cc4cdaf224141c903b2c8bdcdeae32434074abd',
              'pytest_output': log.read_text() if log.exists() else 'unavailable',
              'candidate_boundary_enforcement': 'executor seals exact candidate HEAD independently; production ONE worker also requires CERTIFIED_FOR_GENESIS plus exact creator/reader blobs and experiments/one runtime-tree identity before importing the candidate surface',
              'candidate_adapter_transfer_probe': ({
                  'schema': adapter_payload.get('schema'),
                  'decision': adapter_payload.get('decision'),
                  'complete_stored_bytes': adapter_payload.get('complete_stored_bytes'),
                  'wire_sha256': adapter_payload.get('wire_sha256'),
                  'deterministic_wire': adapter_payload.get('deterministic_wire'),
                  'whole_reconstruction_exact': adapter_payload.get('whole_reconstruction_exact'),
                  'authenticated_selective_exact': adapter_payload.get('authenticated_selective_exact'),
                  'reader_visible_ops': adapter_payload.get('reader_visible_ops'),
                  'reader_burden': adapter_payload.get('reader_burden'),
                  'genesis_inputs_executed': adapter_payload.get('genesis_inputs_executed'),
              } if adapter_payload else 'unavailable'),
              'fixture_plumbing': ({
                  'schema': fixture_payload.get('schema'),
                  'evidence_contract': fixture_payload.get('evidence_contract'),
                  'synthetic': fixture_payload.get('synthetic'),
                  'production_eligible': fixture_payload.get('production_eligible'),
                  'workloads': len(fixture_payload.get('workloads', [])),
                  'execution_state': fixture_payload.get('execution_state'),
              } if fixture_payload else 'unavailable'),
              'physical_input_seal': ({
                  'schema': physical_payload.get('schema'),
                  'all_15_identities_exact': physical_payload.get('all_15_identities_exact'),
                  'workloads': len(physical_payload.get('rows', [])),
                  'diagnostic_artifact_sha256': physical_digest,
                  'diagnostic_artifact_sha256_semantics': 'exact runner-local receipt; work_root included; not cross-run scientific identity',
              } if physical_payload else 'unavailable'),
              'physical_input_scientific_identity': ({
                  'schema': portable_payload.get('schema'),
                  'work_root_in_scientific_digest': portable_payload.get('work_root_in_scientific_digest'),
                  'workloads': len(portable_payload.get('scientific_identity', {}).get('rows', [])),
                  'scientific_identity_sha256': ('sha256:' + portable_payload.get('scientific_identity_sha256')) if portable_payload else 'unavailable',
                  'scientific_identity_sha256_semantics': 'authoritative cross-run identity of suite/name/files/logical_bytes/tree_sha256 for all 15 physical workloads',
              } if portable_payload else 'unavailable'),
              'claim_boundary': 'artifact-shape, exact workload-identity, executor-preflight, synthetic raw-measurement plumbing, physical 15-tree sealing, path-independent scientific input identity, transfer-only ONE candidate archive-boundary falsification, and non-circular fail-closed runtime certification; no Genesis contender encoding, comparison, scoring, or winner selection executed',
          }
          Path('genesis-gate-result-contract.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-gate-result-contract-${{ github.sha }}
          path: |
            genesis-gate-result-contract.json
            genesis-physical-input-seal.json
            genesis-physical-input-scientific-identity.json
            one-g02-genesis-candidate-adapter-probe.json
            one-g02-genesis-candidate-adapter-probe.txt
          if-no-files-found: error
          retention-days: 30
