# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 logs streaming prefilter oracle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  logs-streaming-prefilter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile oracle and promoted front door
        run: |
          python -m py_compile \
            benchmarks/v030_logs_streaming_prefilter_oracle.py \
            experiments/entropygraph_v030_release_product.py \
            tests/test_v030_logs_streaming_prefilter_promotion.py

      - name: Run exact streaming-prefilter A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_streaming_prefilter_oracle.py > benchmark-artifacts/v030-logs-streaming-prefilter.json
          cat benchmark-artifacts/v030-logs-streaming-prefilter.json

      - name: Independently ratchet semantics and falsification boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-logs-streaming-prefilter.json')
          if not p.is_file():
              raise SystemExit('logs streaming-prefilter evidence missing')
          d=json.loads(p.read_text())
          assert d['experiment']=='v030-logs-streaming-prefilter-v1'
          assert d['research_only'] is True
          assert d['selector_change'] is False
          assert d['release_credit'] is False
          assert d['experiment_valid'] is True
          assert len(d['correctness'])==4
          assert all(row['eligibility_equal'] for row in d['correctness'])
          early=next(row for row in d['correctness'] if row['name']=='early-positive')
          assert early['streaming_short_circuited'] is True
          assert early['streaming_proven_pairs']>=2
          if d['promotion_signal']:
              perf=d['performance']; req=d['requirements']
              assert perf['speedup_fraction']>=req['minimum_speedup_fraction']
              assert perf['absolute_saving_s']>=req['minimum_absolute_saving_s']
          PY

      - name: Prove compatibility binding and fail-closed negative semantics
        if: always()
        run: python -m pytest -q tests/test_v030_logs_streaming_prefilter_promotion.py

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-streaming-prefilter.yml

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload logs-prefilter evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-logs-streaming-prefilter-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-streaming-prefilter.json
          if-no-files-found: error
          retention-days: 90

# Terminal negative retained for reproducibility, not automatic replay. Exact-head evidence at d5e07cf showed
# semantic equivalence but a 25.3 us reference median versus 123.4 us streaming median, so this standalone helper
# does not meet its speed promotion bar. The shipping build uses the separate shared front-door preflight; this
# workflow remains manually replayable to guard compatibility semantics without consuming PR runner capacity.
