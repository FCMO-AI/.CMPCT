# ci-lane: fast
name: CMPCT1 ONE-G0.2 live suffix queue fusion
on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_minimizer_live_suffix_queue_kernel.c"
      - "benchmarks/one/one_g02_minimizer_live_suffix_queue_ab.py"
      - ".github/workflows/cmpct1-one-g02-live-suffix-queue.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-live-suffix-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fusion-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantics
        run: python -m pytest -q tests/one
      - name: Run frozen fusion falsifier
        run: |
          set -o pipefail
          mkdir -p one-live-suffix-queue-artifacts
          python -m benchmarks.one.one_g02_minimizer_live_suffix_queue_ab \
            | tee one-live-suffix-queue-artifacts/one-g02-live-suffix-queue.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-live-suffix-queue-${{ env.EVIDENCE_HEAD }}
          path: one-live-suffix-queue-artifacts/
          if-no-files-found: error
