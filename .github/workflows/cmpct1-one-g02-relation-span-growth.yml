name: CMPCT1 ONE-G0.2 relation span growth
on:
  push:
    branches: [research/cmpct1]
    paths: &paths
      - 'experiments/one/relation_span_growth.py'
      - 'benchmarks/one/one_g02_relation_span_growth.py'
      - 'tests/one/test_relation_span_growth.py'
      - 'docs/one/prereg/ONE_G02_RELATION_SPAN_GROWTH_PREREG_2026-09-08.md'
      - 'docs/one/evidence/ONE_G02_RELATION_SPAN_GROWTH_HOSTILE_REVIEW_2026-09-08.md'
      - '.github/workflows/cmpct1-one-g02-relation-span-growth.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions: {contents: read}
jobs:
  relation-span-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {EVIDENCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - name: Bind exact source and frozen law
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import benchmarks.one.one_g02_relation_span_growth as b
          assert b.SIZES==(64*1024,256*1024,1024*1024) and b.OPS==('add8','xor')
          assert b.FAMILIES==('long_exact','sparse_cracks','false_seed')
          assert b.SEED_BYTES==64 and b.EXTENSION_BYTES==4096 and b.FIXED_WINDOW==4096
          assert b.REPETITIONS==11 and b.MAX_NODE_RATIO==0.25 and b.MAX_WIRE_RATIO==1.01 and b.MAX_VERIFY_RATIO==1.10
          PY
      - run: python -m pytest -q tests/one/test_relation_span_growth.py
      - name: Run frozen 18-cell falsifier
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_relation_span_growth | tee one_g02_relation_span_growth.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "one-g02-relation-span-growth-${{ env.EVIDENCE_HEAD }}", path: one_g02_relation_span_growth.json, if-no-files-found: warn}
