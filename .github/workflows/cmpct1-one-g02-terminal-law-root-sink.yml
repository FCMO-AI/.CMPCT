name: CMPCT1 ONE-G0.2 terminal Law root sink

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - experiments/one/fused_terminal_reader.py
      - benchmarks/one/one_g02_terminal_law_root_sink.py
      - tests/one/test_fused_terminal_reader.py
      - docs/one/prereg/ONE_G02_TERMINAL_LAW_ROOT_SINK_PREREG_2026-09-08.md
      - docs/one/evidence/ONE_G02_TERMINAL_LAW_ROOT_SINK_HOSTILE_REVIEW_2026-09-08.md
      - .github/workflows/cmpct1-one-g02-terminal-law-root-sink.yml
  workflow_dispatch:

jobs:
  terminal-law-root-sink:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind evidence to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f experiments/one/fused_terminal_reader.py
          test -f benchmarks/one/one_g02_terminal_law_root_sink.py
          test -f tests/one/test_fused_terminal_reader.py
          test -f docs/one/prereg/ONE_G02_TERMINAL_LAW_ROOT_SINK_PREREG_2026-09-08.md
          test -f docs/one/evidence/ONE_G02_TERMINAL_LAW_ROOT_SINK_HOSTILE_REVIEW_2026-09-08.md
          grep -q 'REPETITIONS = 21' benchmarks/one/one_g02_terminal_law_root_sink.py
          grep -q 'FUSED_TRAFFIC_MAX = 1.05' benchmarks/one/one_g02_terminal_law_root_sink.py
          grep -q 'FUSED_TEMP_MAX = 1.05' benchmarks/one/one_g02_terminal_law_root_sink.py
          grep -q 'FUSED_TIME_MAX = 1.05' benchmarks/one/one_g02_terminal_law_root_sink.py
          grep -q 'LONG_RUNS_1M_WIRE_MAX = 0.55' benchmarks/one/one_g02_terminal_law_root_sink.py
          grep -q 'STRUCTURED_1M_WIRE_MAX = 0.90' benchmarks/one/one_g02_terminal_law_root_sink.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Prove fused terminal semantics and decision law
        run: python -m pytest -q tests/one/test_fused_terminal_reader.py tests/one/test_run_fill_law.py

      - name: Run frozen terminal Law root-sink falsifier
        shell: bash
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_terminal_law_root_sink \
            | tee one_g02_terminal_law_root_sink.json

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-terminal-law-root-sink-${{ env.EVIDENCE_HEAD }}
          path: one_g02_terminal_law_root_sink.json
          if-no-files-found: warn
