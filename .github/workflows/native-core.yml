name: CMPCT native core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reference implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Rust format, lint and tests
        working-directory: native/cmpct-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
      - name: Cross-check native index against Python oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('/tmp/cmpct-native-src');root.mkdir()
          (root/'dir').mkdir();(root/'dir'/'hello.txt').write_text('hello native CMPCT\n')
          (root/'payload.bin').write_bytes((b'abc123' * 100000))
          # Incompressible direct content exercises the zero-copy RAW range path. The compressible
          # payload above stays below the large-file chunking threshold and exercises direct Zstd.
          (root/'raw.bin').write_bytes(os.urandom(1024*1024))
          os.symlink('dir/hello.txt', root/'hello-link')
          PY
          python -m cmpct create /tmp/cmpct-native-src /tmp/native.cmpct >/tmp/python-build.json
          native/cmpct-core/target/release/cmpct-native-inspect /tmp/native.cmpct >/tmp/native.json
          python - <<'PY'
          import json
          from pathlib import Path
          from cmpct.reader import CMPCT
          got=json.loads(Path('/tmp/native.json').read_text())
          with CMPCT(Path('/tmp/native.cmpct')) as ar:
              want=[(x[0],x[1],x[2],x[4]) for x in ar.files]
              payload=ar.by['payload.bin']
              assert payload[6][0] == 0
              assert ar.blobs[payload[6][1]][3] == 1, ar.blobs[payload[6][1]]
              # Make a corruption fixture that keeps authenticated index metadata intact but changes
              # the direct blob's declared content hash. Native Zstd reads must not return bytes after
              # this mismatch even though the compressed stream itself still decodes successfully.
              blob_index=payload[6][1]
              blob_pos=ar.record_base+ar.blobs[blob_index][0]
          corrupt=bytearray(Path('/tmp/native.cmpct').read_bytes())
          corrupt[blob_pos+32] ^= 1
          Path('/tmp/native-corrupt-hash.cmpct').write_bytes(corrupt)
          have=[(x['path'],x['kind'],x['mode'],x['size']) for x in got['entries']]
          assert got['revision']==24
          assert have==want,(have,want)
          PY
      - name: Exercise C ABI from a non-Rust caller
        run: |
          python - <<'PY'
          import ctypes
          from pathlib import Path
          from cmpct.reader import CMPCT

          lib=ctypes.CDLL('native/cmpct-core/target/release/libcmpct_core.so')
          lib.cmpct_open.argtypes=[ctypes.c_char_p,ctypes.POINTER(ctypes.c_void_p)]
          lib.cmpct_open.restype=ctypes.c_int32
          lib.cmpct_entry_count.argtypes=[ctypes.c_void_p]
          lib.cmpct_entry_count.restype=ctypes.c_size_t
          lib.cmpct_entry_path.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_void_p,ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)]
          lib.cmpct_entry_path.restype=ctypes.c_int32
          lib.cmpct_entry_read_range.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_uint64,ctypes.c_void_p,ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)]
          lib.cmpct_entry_read_range.restype=ctypes.c_int32
          lib.cmpct_close.argtypes=[ctypes.c_void_p]

          def open_archive(path):
              handle=ctypes.c_void_p()
              assert lib.cmpct_open(path,ctypes.byref(handle))==0
              return handle

          def paths_for(handle):
              paths=[]
              for i in range(lib.cmpct_entry_count(handle)):
                  n=ctypes.c_size_t()
                  assert lib.cmpct_entry_path(handle,i,None,0,ctypes.byref(n))==0
                  buf=ctypes.create_string_buffer(n.value+1)
                  assert lib.cmpct_entry_path(handle,i,buf,len(buf),ctypes.byref(n))==0
                  paths.append(buf.value.decode())
              return paths

          handle=open_archive(b'/tmp/native.cmpct')
          try:
              paths=paths_for(handle)
              assert len(paths)==5
              out=ctypes.create_string_buffer(8192)
              got_n=ctypes.c_size_t()
              with CMPCT(Path('/tmp/native.cmpct')) as ar:
                  raw_index=paths.index('raw.bin')
                  offset=333333
                  assert lib.cmpct_entry_read_range(handle,raw_index,offset,out,8192,ctypes.byref(got_n))==0
                  assert got_n.value==8192
                  assert out.raw[:got_n.value]==ar.read_range('raw.bin',offset,8192)

                  zstd_index=paths.index('payload.bin')
                  zstd_offset=12345
                  assert lib.cmpct_entry_read_range(handle,zstd_index,zstd_offset,out,8192,ctypes.byref(got_n))==0
                  assert got_n.value==8192
                  assert out.raw[:got_n.value]==ar.read_range('payload.bin',zstd_offset,8192)

              # Bounds are typed rather than becoming short reads.
              assert lib.cmpct_entry_read_range(handle,raw_index,1024*1024-4,out,8,ctypes.byref(got_n))==-6
          finally:
              lib.cmpct_close(handle)

          corrupt=open_archive(b'/tmp/native-corrupt-hash.cmpct')
          try:
              paths=paths_for(corrupt)
              zstd_index=paths.index('payload.bin')
              out=ctypes.create_string_buffer(32)
              got_n=ctypes.c_size_t()
              # The index still opens, but the first Zstd member read detects the physical SHA mismatch
              # and returns a format/integrity failure rather than unauthenticated content.
              assert lib.cmpct_entry_read_range(corrupt,zstd_index,0,out,32,ctypes.byref(got_n))==-3
              assert got_n.value==0
          finally:
              lib.cmpct_close(corrupt)
          PY
      - name: Committed golden direct-codec ABI gate
        run: python tests/native_golden_abi.py
      - name: Committed golden chunk-map ABI gate
        run: python tests/native_chunk_golden_abi.py
      - name: Committed golden sparse ABI gate
        run: python tests/native_sparse_golden_abi.py
