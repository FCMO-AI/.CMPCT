name: Apply extraction hardening

on:
  workflow_dispatch:
  push:
    branches:
      - frontier/full-completion-20260815
    paths:
      - .github/workflows/apply-extraction-hardening.yml
      - tools/agent_patch_extraction.py
      - native/cmpct-core/src/lib.rs
      - native/cmpct-core/include/cmpct.h
      - tests/native_stream_extract_abi.py

permissions:
  contents: write

concurrency:
  group: cmpct-apply-extraction-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: frontier/full-completion-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply extraction safety patch
        run: python tools/agent_patch_extraction.py
      - name: Normalize native Rust formatting
        run: cargo fmt --manifest-path native/cmpct-core/Cargo.toml
      - name: Validate extraction behavior
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install -e '.[audio,test]'
            cargo test --manifest-path native/cmpct-core/Cargo.toml --all-targets
            cargo build --manifest-path native/cmpct-core/Cargo.toml --release
            python tests/native_stream_extract_abi.py
          } 2>&1 | tee extraction-hardening-validation.log
      - name: Upload behavioral diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-hardening-validation
          path: extraction-hardening-validation.log
          if-no-files-found: error
          retention-days: 7
      - name: Commit behavior-validated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/cmpct-core/src/lib.rs native/cmpct-core/src/recovery.rs native/cmpct-core/include/cmpct.h native/cmpct-core/tests/recovery_golden.rs tests/native_stream_extract_abi.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'native: bound extraction and defer directory modes'
          git push origin HEAD:frontier/full-completion-20260815
      - name: Enforce strict native lint after behavioral commit
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings 2>&1 | tee extraction-hardening-clippy.log
      - name: Upload strict-lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-hardening-clippy
          path: extraction-hardening-clippy.log
          if-no-files-found: error
          retention-days: 7
