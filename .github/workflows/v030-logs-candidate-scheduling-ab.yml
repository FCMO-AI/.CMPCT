# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: v0.30 Logs candidate scheduling A-B-C

on:
  push:
    branches: [agent/v030-r24-process-productization]
    paths:
      - benchmarks/v030_logs_candidate_scheduling_ab.py
      - experiments/entropygraph_v030_release_product_logs_candidate.py
      - experiments/entropygraph_v030_release_product.py
      - .github/workflows/v030-logs-candidate-scheduling-ab.yml
  workflow_dispatch:

permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  falsify-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical frozen-corpus environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
      - name: Build native core
        run: cargo build --manifest-path native/cmpct-core/Cargo.toml --release --locked
      - name: Materialize one shared frozen Logs source
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import shutil
          from pathlib import Path
          from benchmarks import v030_release_performance as P
          corpora=P._build_corpora(Path('benchmark-artifacts/source-generator'))
          source=corpora[('neutral_hostile_v1','05_logs_and_telemetry')]
          target=Path('benchmark-artifacts/shared-logs-source')
          shutil.copytree(source,target,copy_function=shutil.copy2)
          print(target)
          PY
      - name: Run scheduling and ownership arms
        run: |
          for arm in threaded sequential r24-child; do
            python -m benchmarks.v030_logs_candidate_scheduling_ab \
              --arm "$arm" \
              --source-root benchmark-artifacts/shared-logs-source \
              --work-root "benchmark-artifacts/$arm-work" \
              --output "benchmark-artifacts/$arm.json" \
              2>&1 | tee "benchmark-artifacts/$arm.log"
          done
      - name: Require exact product identity and summarize charged costs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows={a:json.loads(Path(f'benchmark-artifacts/{a}.json').read_text()) for a in ('threaded','sequential','r24-child')}
          base=rows['threaded']
          for arm,row in rows.items():
              for key in ('selected','format_revision','archive_bytes','archive_sha256','admission'):
                  assert row[key]==base[key], (arm,key,row[key],base[key])
          summary={a:{k:r[k] for k in ('parent_peak_rss_kib','tree_peak_rss_kib','wall_s','cpu_s','archive_bytes','archive_sha256')} for a,r in rows.items()}
          Path('benchmark-artifacts/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-logs-candidate-scheduling-ab-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/threaded.json
            benchmark-artifacts/threaded.log
            benchmark-artifacts/sequential.json
            benchmark-artifacts/sequential.log
            benchmark-artifacts/r24-child.json
            benchmark-artifacts/r24-child.log
            benchmark-artifacts/summary.json
          if-no-files-found: error
