# ci-lane: fast
name: CMPCT v0.31 sparse logical SHA extraction
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'src/cmpct/sparse_extract.py'
      - 'tests/test_v031_sparse_verified_extract.py'
      - '.github/workflows/v031-sparse-logical-extract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sparse-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install product with test dependencies
        run: python -m pip install -e '.[test]'
      - name: Exact-head sparse conformance and hostile-mutation court
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pytest -q tests/test_v031_sparse_verified_extract.py
          python tools/check_ci_topology.py .github/workflows/v031-sparse-logical-extract.yml
