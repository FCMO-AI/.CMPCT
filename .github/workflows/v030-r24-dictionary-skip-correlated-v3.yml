# ci-lane: deep
name: CMPCT v0.30 r24 dictionary skip correlated disproof

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_dictionary_skip_correlated_adversarial_v3.py'
      - 'benchmarks/v030_r24_dictionary_skip_adversarial_v2.py'
      - 'benchmarks/v030_r24_dictionary_skip_adversarial_oracle.py'
      - 'benchmarks/v030_r24_dictionary_skip_admission_oracle.py'
      - 'benchmarks/v030_r24_dictionary_training_cost_oracle.py'
      - 'experiments/entropygraph_v030_r24_dead_dictionary.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v030-r24-dictionary-skip-correlated-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-dictionary-skip-correlated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  correlated-disproof:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile disabled skip and correlated disproof surface
        run: |
          python -m py_compile experiments/entropygraph_v030_r24_dead_dictionary.py
          python -m py_compile benchmarks/v030_r24_dictionary_skip_correlated_adversarial_v3.py
          python -m py_compile benchmarks/v030_r24_dictionary_skip_adversarial_v2.py
      - name: Ratchet release-only productization boundary
        run: |
          python - <<'PY'
          from experiments import entropygraph_v030_release_product as P
          from experiments import entropygraph_v030_r24_dead_dictionary as D

          # Preserve the exact disproven envelope as evidence, but fail closed in shipping.
          assert D.DICTIONARY_SKIP_MIN_REGULAR_FILES == 5
          assert D.DICTIONARY_SKIP_MIN_SAMPLE_COUNT == 32
          assert D.DICTIONARY_SKIP_ENABLED is False
          assert D.DICTIONARY_SKIP_DISABLED_REASON == 'correlated-positive-sample-counterexamples'
          assert D._dictionary_training_skip_admitted({
              'regular_files': 5,
              'dictionary_sample_count': 32,
              'dictionary_sample_bytes': 1,
          }) is False

          # Import order remains intentional: dead_dictionary wraps the mature r24 builder first; the
          # public product captures that release-only wrapper as _BASE_R24_BUILD, then installs its
          # dead-dictionary post-pass as the base module's public r24 materializer. These remain distinct
          # so post-selection dead-dictionary elision stays active while the disproven pre-training skip is off.
          assert getattr(P._BASE_IMPL, '_cmpct_v030_dictionary_skip_boundary_installed', False) is True
          original = P._BASE_IMPL._cmpct_v030_dictionary_skip_original_r24_build
          assert P._BASE_R24_BUILD is not original
          assert P._BASE_R24_BUILD is not P._BASE_IMPL._locality_bounded_r24_build
          assert P._BASE_IMPL._locality_bounded_r24_build is P._locality_bounded_r24_build
          PY
      - name: Run frozen plus correlated positive-sample campaign
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_dictionary_skip_correlated_adversarial_v3.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-correlated-v3-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-correlated-v3.json"
      - name: Preserve broad-rule disproof and require shipping disablement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments import entropygraph_v030_r24_dead_dictionary as D

          d = json.loads(Path('benchmark-artifacts/v030-r24-dictionary-skip-correlated-v3.json').read_text())
          assert d['schema'] == 'cmpct-v030-r24-dictionary-skip-correlated-adversarial-v3'
          c = d['contract']
          assert c['release_credit'] is False
          assert c['production_change'] is False
          assert c['additional_correlated_positive_sample_cases'] == 2
          assert c['correlated_nonexact_admission_blocks_broad_rule'] is True
          assert c['broad_v2_rule_under_test'] == {
              'regular_files_min': 5,
              'dictionary_sample_count_min': 32,
          }
          s = d['summary']
          assert s['frozen_complete'] is True
          assert s['correlated_surface_complete'] is True
          assert s['correlated_training_surface_exercised'] is True
          assert s['broad_v2_rule_admissions'] >= 2

          # Negative evidence is now the expected scientific outcome. It must remain visible and it must
          # disable the broad shipping rule rather than being averaged away or hidden by threshold changes.
          assert s['broad_v2_rule_counterexamples'] >= 1
          assert s['broad_v2_rule_survives'] is False
          assert len(s['broad_v2_rule_counterexample_labels']) == s['broad_v2_rule_counterexamples']
          assert D.DICTIONARY_SKIP_ENABLED is False
          assert d['release_credit'] is False
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-dictionary-skip-correlated-v3.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-dictionary-skip-correlated-v3-${{ github.sha }}
          path: benchmark-artifacts/v030-r24-dictionary-skip-correlated-v3.json
          if-no-files-found: warn
          retention-days: 90

# The broad pre-training skip is disproven and disabled. This lane preserves the counterexamples and fails if
# shipping silently re-enables the rule without a new independent promotion boundary.
