# ci-lane: fast
# O61-D research-only physical NTFS directory-stream falsifier; no product promotion.
name: CMPCT v0.31 O61-D source-exact directory ADS court
on:
  push:
    branches:
      - 'agent/phased1-v031-ntfs-directory-ads-falsifier-o61d-20261025'
    paths:
      - 'tests/test_v031_ntfs_directory_ads_o61d.py'
      - '.github/workflows/v031-o61d-ntfs-directory-ads.yml'
      - 'docs/v031-research/2026-10-25-o61d-ntfs-directory-ads-prereg.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o61d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-exact-windows-research:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact O57-derived independent science
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup CPython 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Execute native NTFS falsifier against installed unmodified O57 product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor d9f9fa724c139c6281f0e2a92c66601bee912618 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "7a13545c7dc22ea973f90930fae6cf053f13f1f2"
          test "$(git hash-object src/cmpct/ntfs_streams.py)" = "23207ac06797fb21322cf327e97928fdbb5241c2"
          test "$(git hash-object tests/test_v031_win32_ads_refusal_o57.py)" = "abd88c8c7394fac15d4d98a5f3cca0844bd8dff6"
          test "$(git hash-object tests/test_v031_ntfs_directory_ads_o61d.py)" = "644b20af1a1fde5d1ba8a6211149aa62307e4252"
          git diff --exit-code d9f9fa724c139c6281f0e2a92c66601bee912618 HEAD -- src/cmpct native benchmarks tools/check_performance_regression.py
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder, cmpct.reader, cmpct.ntfs_streams
          root=Path(subprocess.check_output(["git", "rev-parse", "--show-toplevel"], text=True).strip())
          for mod in (cmpct.builder, cmpct.reader, cmpct.ntfs_streams):
              modpath=Path(mod.__file__).resolve()
              assert not modpath.is_relative_to(root), ("uninstalled source", modpath)
              print("O61D_INSTALLED=" + str(modpath))
          PY
          mkdir -p o61d-isolated
          cp tests/test_v031_ntfs_directory_ads_o61d.py o61d-isolated/
          cp tests/test_v031_win32_ads_refusal_o57.py o61d-isolated/
          python -m pytest -vv -s o61d-isolated/ --junitxml=o61d-results.xml 2>&1 | tee o61d-results.log
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse("o61d-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 5, ("expected O57 3 + O61D 2 actual cases", len(cases))
          issues = [(c.get("name"), e.tag) for c in cases for e in list(c)
                    if e.tag in ("failure", "error", "skipped")]
          assert not issues, ("all five actual Win32 tests must run and pass", issues)
          assert "O61D_DEFECT_CONFIRMED" in Path("o61d-results.log").read_text(encoding="utf-8"), "falsifier did not report actual source loss"
          print("O61D_REAL_TESTS=5 FAILURES=0 ERRORS=0 SKIPS=0", flush=True)
          PY
      - name: Preserve native Windows evidence regardless of conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o61d-win32-source-exact-junit
          path: |
            o61d-results.xml
            o61d-results.log
          if-no-files-found: warn
