# ci-lane: deep
name: CMPCT1 ONE-G0.2 native selective Repeat lowering

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/native_law_range_plan.py
      - tests/one/test_native_repeat_range_plan.py
      - tests/one/test_native_law_range_plan.py
      - benchmarks/one/one_g02_native_selective_repeat_lowering.py
      - docs/one/evidence/ONE_G02_NATIVE_SELECTIVE_REPEAT_LOWERING_PREREG_2026-09-09.md
      - .github/workflows/cmpct1-one-g02-native-selective-repeat-lowering.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-native-selective-repeat-lowering-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EVIDENCE_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Install repository test dependency surface
        run: python -m pip install -e '.[test,audio]'
      - name: Run Repeat/native/authentication semantics
        run: >-
          python -m pytest -q
          tests/one/test_native_repeat_range_plan.py
          tests/one/test_native_law_range_plan.py
          tests/one/test_selective_auth.py
          tests/one/test_validated_program.py
      - name: Run frozen Repeat lowering falsifier
        run: |
          set +e
          python -m benchmarks.one.one_g02_native_selective_repeat_lowering > native-selective-repeat-lowering.json
          status=$?
          cat native-selective-repeat-lowering.json
          exit $status
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selective-repeat-lowering-${{ github.sha }}
          path: native-selective-repeat-lowering.json
          if-no-files-found: error
          retention-days: 30
