name: CMPCT v0.29 attempt7 cross-base structural (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-pointer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify preserved attempt-7 structural rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/history/2026-08-17-mosaic-v029-attempt7-crossbase-structural-reject.json')
          r=json.loads(p.read_text())
          assert r['schema'] == 'cmpct-v029-attempt7-crossbase-structural-reject-v1'
          assert r['decision']['research_gate'] == 'REJECT'
          assert r['candidate']['causal_crossbase_selection'] is True
          assert r['candidate']['saving_vs_attempt5_bytes'] == 1303
          assert r['comparison']['structural_gate_pass'] is False
          print(json.dumps(r, indent=2))
          PY

# Footnote: cross-base physical co-location was fully exercised (all 186 packed recipes participated) but
# bought only 1,303 exact artifact bytes.  Automatic execution is retired; durable evidence points future
# work toward recipe representation rather than further same-base/cross-base grouping tweaks.
