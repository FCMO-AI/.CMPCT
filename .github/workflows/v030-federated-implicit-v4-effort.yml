# ci-lane: deep
name: CMPCT v0.30 federated default-delta frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_federated_implicit_candidate_v4.py'
      - 'experiments/entropygraph_v030_federated_candidate.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v025.py'
      - 'benchmarks/v030_federated_implicit_v4_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle*.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - '.github/workflows/v030-federated-implicit-v4-effort.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-federated-implicit-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  default-delta-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact corpus and comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile C25EG04 profile and frontier
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_fs_implicit_v4.py \
            experiments/entropygraph_v030_federated_implicit_candidate_v4.py \
            benchmarks/v030_federated_implicit_v4_effort_oracle.py

      - name: Prove default/delta filesystem-control semantics
        run: python -m pytest -q tests/test_v030_fs_implicit_v4.py

      - name: Measure C25EG04 selective-effort frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_implicit_v4_effort_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg04-effort-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg04-effort.json"

      - name: Independently enforce measurement and immutable office floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg04-effort.json').read_text())
          assert d['schema']=='cmpct-v030-federated-eg04-default-delta-effort-v1'
          assert d['targets']==['02_office_workspace','04_analytics_and_database']
          assert d['levels']==[1,3,6,9,12,15,19,20,21,22]
          assert d['baseline_rounds']==3
          assert len(d['rows'])==2
          assert d['measurement_gate']['passed'] is True
          identity=d['candidate_identity']
          assert identity['magic_ascii']=='C25EG04'
          assert identity['profile']=='federated-eg04-default-delta-fs'
          assert identity['internal_manifest_path']=='.__cmpct_r25_internal__/f4'
          assert identity['patched_candidate_restored'] is True
          assert identity['patched_prepare_restored'] is True
          adapter=d['accepted_v029_schema_adapter']
          assert adapter['source_field']=='accepted_v029_bytes'
          assert adapter['values_unchanged'] is True
          assert adapter['workloads']==15
          assert adapter['accepted_v029_aggregate_bytes']==137499525
          assert adapter['authoritative_loader_restored'] is True
          office=d['office_decision']
          assert office['accepted_v029_bytes']==5954026
          assert office['predecessor_eg03_all_best_floor_bytes']==5954199
          assert office['eg04_all_best_floor_bytes'] == next(
              row['compression_effort_upper_bound']['all_best_archive_floor_bytes']
              for row in d['rows'] if row['label']=='neutral_hostile_v1/02_office_workspace'
          )
          for row in d['rows']:
              ub=row['compression_effort_upper_bound']
              assert ub['all_best_archive_floor_bytes'] == row['baseline_level1']['archive_bytes']-ub['maximum_possible_saving_bytes']
              measured=row['measured_zip_budget_policy']
              assert measured['locality']['max_member_read_amplification'] <= 8.0
              assert measured['locality']['max_decode_unit_bytes'] <= 8*1024*1024
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-federated-implicit-v4-effort.yml

      - name: Upload C25EG04 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-federated-implicit-v4-${{ github.sha }}
          path: benchmark-artifacts/v030-eg04-effort.json
          if-no-files-found: warn
          retention-days: 90
