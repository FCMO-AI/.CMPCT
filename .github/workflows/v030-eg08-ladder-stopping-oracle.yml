name: CMPCT v0.30 EG08 ladder stopping oracle

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_eg08_ladder_stopping_oracle.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - experiments/entropygraph_v030_federated_adaptive_effort_candidate_v8.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py
      - docs/V030_EG08_LADDER_STOPPING_ORACLE_LOCK_2026-09-13.md
      - .github/workflows/v030-eg08-ladder-stopping-oracle.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current15 system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Syntax check
        run: python -m py_compile benchmarks/v030_eg08_ladder_stopping_oracle.py
      - name: Run stopping oracle
        id: referee
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m benchmarks.v030_eg08_ladder_stopping_oracle --out evidence/eg08-ladder-stopping-oracle.json > >(tee evidence/stdout.txt) 2> >(tee evidence/stderr.txt >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Bind receipt
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path('evidence/eg08-ladder-stopping-oracle.json'); e=Path('evidence/stderr.txt'); code=int('${{ steps.referee.outputs.exit_code || 1 }}')
          if p.exists():
              d=json.loads(p.read_text()); d['candidate_sha']=os.environ['GITHUB_SHA']; d['candidate_ref']=os.environ['GITHUB_REF_NAME']; p.write_text(json.dumps(d,indent=2,sort_keys=True))
              parts=[]
              for k,v in sorted(d.get('aggregate_predicates',{}).items()): parts.append(f"{k[:2]}={v.get('status')}-{v.get('mismatches')}-skip{v.get('avoided_call_share',0):.3f}")
              label='oracle-'+'-'.join(parts)
          else:
              lines=[x.strip() for x in e.read_text(errors='replace').splitlines() if x.strip()] if e.exists() else []; label='HARNESS_FAIL-'+re.sub(r'[^A-Za-z0-9_.-]+','-',lines[-1] if lines else 'no-receipt')[:120]
          label=re.sub(r'[^A-Za-z0-9_.=-]+','-',label)[:180]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"label={label}\nexit_code={code}\n")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-eg08-ladder-stopping-${{ steps.classify.outputs.label }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Enforce harness exit
        if: always()
        run: test "${{ steps.classify.outputs.exit_code }}" = "0"
