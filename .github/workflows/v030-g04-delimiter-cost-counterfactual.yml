# ci-lane: deep
name: v0.30 G04 delimiter-cost counterfactual

on:
  # The long-lived integration PR has a very broad accumulated diff; PR path matching would duplicate this
  # one-shot research control on every later commit. The branch-local push is the narrow first-run route.
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_g04_delimiter_cost_counterfactual.py'
      - '.github/workflows/v030-g04-delimiter-cost-counterfactual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v030-g04-delimiter-cost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run exact-head counterfactual
        run: |
          set -euo pipefail
          mkdir -p artifacts/v030-g04-delimiter-cost/work
          python -m benchmarks.v030_g04_delimiter_cost_counterfactual \
            --work-root artifacts/v030-g04-delimiter-cost/work \
            --output artifacts/v030-g04-delimiter-cost/result.json
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('artifacts/v030-g04-delimiter-cost')
          benchmark = pathlib.Path('benchmarks/v030_g04_delimiter_cost_counterfactual.py')
          manifest = {
              'schema': 'cmpct-v030-g04-delimiter-cost-artifact-v1',
              'candidate_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'benchmark_sha256': hashlib.sha256(benchmark.read_bytes()).hexdigest(),
              'result_sha256': hashlib.sha256((root/'result.json').read_bytes()).hexdigest(),
              'release_credit': False,
          }
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Preserve decision evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-g04-delimiter-cost-${{ github.sha }}
          path: |
            artifacts/v030-g04-delimiter-cost/result.json
            artifacts/v030-g04-delimiter-cost/manifest.json
          if-no-files-found: error
          retention-days: 30
