name: CMPCT Zstd CLI startup attribution

on:
  pull_request:
    paths:
      - '.github/workflows/zstd-cli-startup-attribution.yml'

jobs:
  startup-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build optimized candidate editable package
        run: python -m pip install -e .
      - name: Materialize direct PR base
        run: git worktree add /tmp/cmpct-startup-base ${{ github.event.pull_request.base.sha }}
      - name: Measure startup and serial-create boundaries
        env:
          BASE_ROOT: /tmp/cmpct-startup-base
        run: |
          python - <<'PY'
          import json, os, statistics, subprocess, sys, tempfile, time
          from pathlib import Path

          root=Path.cwd(); base=Path(os.environ['BASE_ROOT']); work=Path(tempfile.mkdtemp()); src=work/'src'; src.mkdir()
          # Deterministic mixed binary: compressible + pseudorandom-like bytes, large enough to expose serial codec cost.
          src.joinpath('zeros.bin').write_bytes(bytes(8*1024*1024))
          src.joinpath('pattern.bin').write_bytes((bytes(range(256))*32768))
          reps=15
          env_c=os.environ.copy(); env_c['PYTHONPATH']=str(root/'src')
          env_b=os.environ.copy(); env_b['PYTHONPATH']=str(base/'src')

          def proc(cmd,env,n=31):
              xs=[]
              for _ in range(n):
                  t=time.perf_counter_ns(); subprocess.run(cmd,env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True); xs.append((time.perf_counter_ns()-t)/1e6)
              return {'median_ms':statistics.median(xs),'samples_ms':xs}

          def serial_script(out):
              return "from pathlib import Path; from cmpct.builder import Builder; Builder(Path(%r),workers=1).build(Path(%r))"%(str(src),str(out))

          cases={}
          for name,cmd in {
              'python_empty':[sys.executable,'-c','pass'],
              'import_cmpct_codec':[sys.executable,'-c','import cmpct.codec'],
              'cli_help':[sys.executable,'-m','cmpct','--help'],
          }.items():
              b=proc(cmd,env_b,31); c=proc(cmd,env_c,31); cases[name]={'base':b,'candidate':c,'delta_ms':c['median_ms']-b['median_ms'],'ratio':c['median_ms']/b['median_ms']}

          # Fresh-process Builder(workers=1) and CLI create use the same source; subtract import medians only diagnostically,
          # never as promotion evidence.
          b=proc([sys.executable,'-c',serial_script(work/'base.cmpct')],env_b,reps); c=proc([sys.executable,'-c',serial_script(work/'cand.cmpct')],env_c,reps)
          cases['serial_builder_process']={'base':b,'candidate':c,'delta_ms':c['median_ms']-b['median_ms'],'ratio':c['median_ms']/b['median_ms']}
          b=proc([sys.executable,'-m','cmpct','create',str(src),str(work/'base-cli.cmpct')],env_b,reps); c=proc([sys.executable,'-m','cmpct','create',str(src),str(work/'cand-cli.cmpct')],env_c,reps)
          cases['cli_create']={'base':b,'candidate':c,'delta_ms':c['median_ms']-b['median_ms'],'ratio':c['median_ms']/b['median_ms']}
          if (work/'base.cmpct').read_bytes() != (work/'cand.cmpct').read_bytes(): raise SystemExit('serial archive identity changed')
          if (work/'base-cli.cmpct').read_bytes() != (work/'cand-cli.cmpct').read_bytes(): raise SystemExit('CLI archive identity changed')
          out={'repetitions':reps,'base_sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=base,text=True).strip(),'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(),'cases':cases}
          Path('startup-attribution.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:{'base_ms':v['base']['median_ms'],'candidate_ms':v['candidate']['median_ms'],'delta_ms':v['delta_ms'],'ratio':v['ratio']} for k,v in cases.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: zstd-cli-startup-${{ github.sha }}
          path: startup-attribution.json
