# ci-lane: fast
# J24C11: independent negative-path causal instrument. Not a Q=1 gate replacement.
name: CMPCT v031 J24C11 no-op negative path and CPU resolution
on:
  push:
    branches:
      - agent/phased3-v031-j24c11-negative-control-path-falsifier-20261028
  pull_request:
    paths:
      - 'research/j24c11_*'
      - 'docs/v031-research/*j24c11*'
      - '.github/workflows/v031-j24c11-path-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24c11-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-path-court:
    name: Signed no-op path and aggregate CPU - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24C10_EXPECT_NATIVE: '1'
      CMPCT_J24C08_EXPECT_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install authentic noneditable CMPCT ABI3 Reader
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel pytest
          python -m pip wheel --no-deps . -w dist
          python -m pip install dist/*.whl
          python - <<'PY'
          from pathlib import Path
          import cmpct.reader as r, cmpct._chunk_admission as a
          p=Path(r.__file__).resolve()
          assert 'site-packages' in p.parts or 'dist-packages' in p.parts, p
          assert callable(a._scan_refs) and callable(a._uniform_stride)
          print("J24C11_INSTALLED_READER",p)
          PY
      - name: Inherited signed integrity and exact-size controls
        shell: bash
        run: |
          mkdir -p receipts
          python -m pytest --noconftest -q tests/test_j24c10_lazy_uniform_stride.py tests/test_j24c08_optional_abi3.py tests/test_o215_fixed_chunk_admission.py tests/test_reader_unsupported_blob_bits.py tests/test_reader_deflate_export_custody.py 2>&1 | tee receipts/inherited-tests.txt
      - name: Independent J24C11 path equivalence and aggregate CPU court
        shell: bash
        env:
          PYTHONPATH: tests
        run: |
          python research/j24c11_path_control_court.py --output receipts/j24c11-raw.json
          python research/j24c11_path_control_referee.py --input receipts/j24c11-raw.json --output receipts/j24c11-referee.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path("receipts/j24c11-raw.json").read_text())
          print("J24C11_SOURCE_HEAD",r["source_head"])
          print("J24C11_RAW_SHA256",hashlib.sha256(Path("receipts/j24c11-raw.json").read_bytes()).hexdigest())
          print("J24C11_LEGACY_Q1_DECISION",r["inherited_j24c10_q1_scientific_decision"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c11-noop-path-${{ matrix.os }}-${{ env.EVIDENCE_SHA }}
          path: receipts/
          if-no-files-found: warn
