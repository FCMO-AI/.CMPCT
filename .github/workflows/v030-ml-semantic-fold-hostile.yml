# ci-lane: deep
# Research-only hostile proof; no release credit.
name: CMPCT v0.30 ML semantic-fold hostile proof
on:
  push:
    branches: [agent/v030-ml-verification-fold-hostile]
    paths:
      - 'benchmarks/v030_ml_semantic_fold_hostile.py'
      - '.github/workflows/v030-ml-semantic-fold-hostile.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: v030-ml-semantic-fold-hostile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hostile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m py_compile benchmarks/v030_ml_semantic_fold_hostile.py
      - run: python benchmarks/v030_ml_semantic_fold_hostile.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-ml-semantic-fold-hostile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-ml-semantic-fold-hostile.json
          if-no-files-found: error
          retention-days: 30
