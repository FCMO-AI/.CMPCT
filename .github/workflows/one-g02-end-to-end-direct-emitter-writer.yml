name: ONE-G0.2 end-to-end direct emitter writer

on:
  push:
    branches:
      - research/cmpct1
  pull_request:
    paths:
      - 'experiments/one/**'
      - 'benchmarks/one/**'
      - 'tests/one/**'
      - 'docs/one/evidence/ONE_G02_END_TO_END_DIRECT_EMITTER_WRITER_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-end-to-end-direct-emitter-writer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end-direct-emitter-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen end-to-end direct emitter writer falsifier
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_end_to_end_direct_emitter_writer | tee one-g02-end-to-end-direct-emitter-writer.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-end-to-end-direct-emitter-writer-${{ github.sha }}
          path: one-g02-end-to-end-direct-emitter-writer.json
          if-no-files-found: error
