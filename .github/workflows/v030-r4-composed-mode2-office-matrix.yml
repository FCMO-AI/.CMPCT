# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 composed Mode2 Office matrix

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_composed_mode2_office_full_matrix.py'
      - 'benchmarks/v030_r4_dual_owner_full_matrix.py'
      - 'benchmarks/v030_r4_npz_mode2_owner_inversion.py'
      - 'benchmarks/v030_r4_office_exact_stream_federation_v2.py'
      - 'benchmarks/v030_r4_tabular_integrated_archive.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_binary_owner_fast_oracle.py'
      - 'benchmarks/mosaic_v029_generalization_bench.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product*.py'
      - 'src/cmpct/**'
      - '.github/workflows/v030-r4-composed-mode2-office-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_composed_mode2_office_full_matrix.py'
      - 'benchmarks/v030_r4_dual_owner_full_matrix.py'
      - 'benchmarks/v030_r4_npz_mode2_owner_inversion.py'
      - 'benchmarks/v030_r4_office_exact_stream_federation_v2.py'
      - 'benchmarks/v030_r4_tabular_integrated_archive.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_binary_owner_fast_oracle.py'
      - 'benchmarks/mosaic_v029_generalization_bench.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product*.py'
      - 'src/cmpct/**'
      - '.github/workflows/v030-r4-composed-mode2-office-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-composed-mode2-office-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_(composed_mode2_office_full_matrix|dual_owner_full_matrix|npz_mode2_owner_inversion|office_exact_stream_federation_v2|tabular_integrated_archive|analytics_dual_owner_oracle|tabular_admission_oracle_v2|tabular_owner_oracle|tabular_binary_owner_fast_oracle)\.py|benchmarks/mosaic_v029_generalization_bench\.py|benchmarks/(neutral_hostile_corpus_v1|resemblance_hostile_corpus_v1|neutral_hostile_determinism_repair_v[^/]*)\.py|experiments/entropygraph_v030_release_product[^/]*\.py|src/cmpct/.*|\.github/workflows/v030-r4-composed-mode2-office-matrix\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  composed-matrix:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile composed research path
        run: |
          python -m py_compile \
            benchmarks/v030_r4_composed_mode2_office_full_matrix.py \
            benchmarks/v030_r4_dual_owner_full_matrix.py \
            benchmarks/v030_r4_npz_mode2_owner_inversion.py \
            benchmarks/v030_r4_office_exact_stream_federation_v2.py \
            benchmarks/v030_r4_tabular_integrated_archive.py \
            benchmarks/v030_r4_analytics_dual_owner_oracle.py
      - name: Run exact 15-workload composed falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_composed_mode2_office_full_matrix.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-composed-matrix-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-composed-matrix.json"
      - name: Enforce evidence contract, not scientific promotion
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-composed-matrix.json').read_text())
          assert d['schema']=='cmpct-v030-r4-composed-mode2-office-full-matrix-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert len(d['rows'])==15
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit']
          assert c['full_15_workload_matrix'] and c['same_semantic_tree_verified']
          assert c['exact_fallback_required'] and c['structural_admission_no_workload_name_gate']
          assert c['no_posthoc_best_of_selection'] and c['existing_mode2_semantics_only']
          assert c['office_exact_compressed_stream_identity_only'] and c['mode2_npz_locality_debt_preserved']
          assert c['office_pool_touch_is_ideal_not_physical_io'] and c['no_threshold_sweep']
          # Green certifies exact-head receipt integrity. Scientific support remains inside the receipt.
          print(json.dumps({'aggregate':d['aggregate'],'office':d['office'],'analytics':d['analytics'],'admitted':d['admitted'],'regressions':d['regressions'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-composed-mode2-office-matrix.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-composed-mode2-office-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-composed-matrix.json
          if-no-files-found: error
          retention-days: 90

# Research-only composition falsifier. Green proves receipt integrity, not promotion readiness.
