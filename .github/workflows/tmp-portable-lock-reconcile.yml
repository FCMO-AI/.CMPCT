name: TEMP post-integration custody cleanup
on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths: ['.github/workflows/tmp-portable-lock-reconcile.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Make pre-merge Android custody and desktop evidence exact-head aware
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          android=Path('.github/workflows/android.yml')
          s=android.read_text()
          old='pull_request:\n    branches: [main]\n'
          new='pull_request:\n    branches: [main, agent/v030-authoritative-integration]\n'
          assert s.count(old)==1, s.count(old)
          android.write_text(s.replace(old,new,1))

          package=Path('.github/workflows/installed-native-package.yml')
          s=package.read_text()
          old="'candidate_sha':os.environ['GITHUB_SHA'],"
          new="'candidate_sha':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),"
          assert s.count(old)==1, s.count(old)
          package.write_text(s.replace(old,new,1))
          PY
          git rm docs/v030-coordination/requests/android-lock-repair.md
          git diff --check
          grep -n 'branches: \[main, agent/v030-authoritative-integration\]' .github/workflows/android.yml
          grep -n "candidate_sha.*rev-parse" .github/workflows/installed-native-package.yml
      - name: Commit permanent custody fixes only
        run: |
          set -euo pipefail
          git config user.name 'cmpct-ci'
          git config user.email 'cmpct-ci@users.noreply.github.com'
          git add .github/workflows/android.yml .github/workflows/installed-native-package.yml docs/v030-coordination/requests/android-lock-repair.md
          git commit -m 'ci: gate integration PRs on Android and bind package evidence head'
          git push origin HEAD:agent/v030-authoritative-integration
