name: TEMP post-integration custody cleanup
on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths: ['.github/workflows/tmp-portable-lock-reconcile.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Apply bounded permanent custody fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          android=Path('.github/workflows/android.yml')
          s=android.read_text()
          old='pull_request:\n    branches: [main]\n'
          new='pull_request:\n    branches: [main, agent/v030-authoritative-integration]\n'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          anchor='''      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n'''
          early='''      - name: Validate portable dependency lock before expensive Android setup\n        working-directory: native/cmpct-portable\n        run: cargo metadata --locked --format-version 1 > /dev/null\n\n'''
          assert s.count(anchor)==1, s.count(anchor)
          s=s.replace(anchor,early+anchor,1)
          android.write_text(s)

          package=Path('.github/workflows/installed-native-package.yml')
          s=package.read_text()
          old="'candidate_sha':os.environ['GITHUB_SHA'],"
          new="'candidate_sha':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old='''          FP="$(python -m experiments.entropygraph_v030_release_lock_strict --print-fingerprint)"\n          export FP\n'''
          new='''          python -m experiments.entropygraph_v030_release_lock_strict --print-fingerprint > "$RUNNER_TEMP/desktop-package-fingerprint.json"\n          FP="$(python - <<'PYFP'\n          import json, os, pathlib\n          data=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'desktop-package-fingerprint.json').read_text())\n          value=data.get('candidate_fingerprint')\n          assert isinstance(value,str) and len(value)==64,value\n          print(value)\n          PYFP\n          )"\n          export FP\n'''
          assert s.count(old)==1, s.count(old)
          package.write_text(s.replace(old,new,1))
          PY
          git rm docs/v030-coordination/requests/android-lock-repair.md
          git diff --check
          grep -n 'branches: \[main, agent/v030-authoritative-integration\]' .github/workflows/android.yml
          grep -n 'Validate portable dependency lock before expensive Android setup' .github/workflows/android.yml
          grep -n "candidate_sha.*rev-parse" .github/workflows/installed-native-package.yml
          grep -n 'desktop-package-fingerprint.json' .github/workflows/installed-native-package.yml
      - name: Commit permanent custody fixes only
        run: |
          set -euo pipefail
          git config user.name 'cmpct-ci'
          git config user.email 'cmpct-ci@users.noreply.github.com'
          git add -A .github/workflows/android.yml .github/workflows/installed-native-package.yml docs/v030-coordination/requests
          git commit -m 'ci: harden Android and desktop package custody'
          git push origin HEAD:agent/v030-authoritative-integration
