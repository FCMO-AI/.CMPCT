# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 tabular owner range oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_tabular_owner_range_oracle.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_colift_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-tabular-owner-range-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_tabular_owner_range_oracle.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_colift_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-tabular-owner-range-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r4-tabular-owner-range-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_tabular_owner_range_oracle\.py|benchmarks/v030_r4_tabular_owner_oracle\.py|benchmarks/v030_r4_tabular_colift_oracle\.py|benchmarks/v030_external_competitors\.py|benchmarks/v030_release_generalization\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r4-tabular-owner-range-oracle\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  tabular-owner-range-oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact range-locality oracle
        run: python -m py_compile benchmarks/v030_r4_tabular_owner_range_oracle.py
      - name: Measure exact reconstructed byte ranges
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_tabular_owner_range_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-owner-range-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-owner-range.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-tabular-owner-range.json').read_text())
          assert d['schema']=='cmpct-v030-r4-tabular-owner-range-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['workload']=='04_analytics_and_database' and d['request_bytes']==4096
          assert [v['row_group_rows'] for v in d['variants']]==[2048,4096,8192,16384]
          assert all(len(v['requests'])==6 for v in d['variants'])
          assert all(r['length']==4096 for v in d['variants'] for r in v['requests'])
          h=d['hypothesis']; assert h['exact_ranges_reconstructed']; assert h['authenticated_length_index_round_trips']; assert isinstance(h['at_least_one_warm_owner_meets_8x_and_8mib'], bool); assert isinstance(h['at_least_one_cold_owner_meets_8x_and_8mib'], bool)
          c=d['contract']; assert c['diagnostic_only'] and c['release_credit'] is False; assert c['production_format_changed'] is False and c['production_selector_changed'] is False; assert c['metadata_cost_reported_separately_for_cold_and_warm_reads']; assert c['reader_discovery'] is False
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-tabular-owner-range-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-tabular-owner-range-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-tabular-owner-range.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. A warm-only pass identifies metadata compaction as regression debt; it is not permission to
# exclude metadata from product locality accounting. Integrated product credit requires the same cold/open/read
# boundary used by the release gate plus actual archive ownership, recovery and native parity.
