name: ONE-G0.2 native nomination trace bridge

on:
  workflow_dispatch:
  push:
    branches:
      - research/cmpct1
    paths:
      - "benchmarks/one/one_g02_native_nomination_trace_bridge.py"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "benchmarks/one/one_g02_relation_shared_observer_validation.py"
      - "benchmarks/one/one_g02_gear_replacement_ab.py"
      - "docs/one/evidence/ONE_G02_INTEGRATED_DISCOVERY_SAFE_RELATION_DISPATCH_PREREG_2026-09-06.md"
      - "docs/one/evidence/ONE_G02_FRONTIER_RECONCILIATION_2026-09-06.md"
      - ".github/workflows/one-g02-native-nomination-trace-bridge.yml"

permissions:
  contents: read

jobs:
  native-nomination-trace-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Semantic and hostile ONE suite
        run: python -m pytest tests/one -q
      - name: Native nomination trace bridge semantic gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_native_nomination_trace_bridge | tee artifacts/one/native_nomination_trace_bridge.json
          rc=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/one/native_nomination_trace_bridge.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload exact-source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-nomination-trace-bridge-${{ github.sha }}
          path: artifacts/one/native_nomination_trace_bridge.json
          if-no-files-found: error
