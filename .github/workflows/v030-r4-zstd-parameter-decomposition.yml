# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Zstd parameter decomposition

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_zstd_parameter_decomposition.py'
      - 'benchmarks/v030_r4_zstd_parameter_floor.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-zstd-parameter-decomposition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_zstd_parameter_decomposition.py'
      - 'benchmarks/v030_r4_zstd_parameter_floor.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-zstd-parameter-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r4-zstd-parameter-decomposition-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_zstd_parameter_decomposition\.py|benchmarks/v030_r4_zstd_parameter_floor\.py|benchmarks/v030_external_competitors\.py|benchmarks/v030_release_generalization\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|experiments/entropygraph_v025\.py|experiments/entropygraph_v030_product_fs\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r4-zstd-parameter-decomposition\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  zstd-parameter-decomposition:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus and comparator dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_r4_zstd_parameter_decomposition.py benchmarks/v030_r4_zstd_parameter_floor.py
      - name: Decompose Zstd level-15 to level-19 speed-density frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_zstd_parameter_decomposition.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-param-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-parameter-decomposition.json"
      - name: Solve exact optimistic parameter-family floor
        run: |
          python benchmarks/v030_r4_zstd_parameter_floor.py \
            --input "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-parameter-decomposition.json" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-parameter-floor.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-zstd-parameter-decomposition.json').read_text())
          assert d['schema']=='cmpct-v030-r4-zstd-parameter-decomposition-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['low_level']==15 and d['high_level']==19 and d['probe_level']==3
          assert d['targets']==['02_office_workspace','04_analytics_and_database','01_developer_repository']
          assert len(d['rows'])==3
          c=d['contract']
          assert c['diagnostic_only'] and c['release_credit'] is False
          assert c['production_selector_changed'] is False
          assert c['same_structural_representation']
          assert c['ordinary_level_presets_reproduced_exactly']
          assert c['mandatory_strong_verify'] and c['canonical_filesystem_semantics_preserved']
          for row in d['rows']:
              assert 'level15' in row['aggregate'] and 'level19' in row['aggregate']
              assert row['aggregate']['level15']['predicted_archive_bytes']==row['fixed_level15_archive_bytes']
              assert row['aggregate']['level19']['predicted_archive_bytes'] <= row['aggregate']['level15']['predicted_archive_bytes']
              assert row['pareto_variants']
          assert isinstance(d['hypothesis_supported'], bool)

          f=json.loads(Path('benchmark-artifacts/v030-zstd-parameter-floor.json').read_text())
          assert f['schema']=='cmpct-v030-r4-zstd-parameter-floor-v1'
          assert f['source_commit']==os.environ['EVIDENCE_HEAD']
          assert len(f['rows'])==3
          assert f['contract']['diagnostic_only'] and f['contract']['release_credit'] is False
          assert f['contract']['oracle_has_per_payload_perfect_foresight']
          assert f['contract']['negative_timing_deltas_clamped_to_zero']
          assert f['contract']['no_production_policy_changed']
          assert isinstance(f['conclusions']['office_floor_unreachable_with_measured_parameter_family'], bool)
          assert isinstance(f['conclusions']['analytics_floor_reachable_with_oracle'], bool)
          assert isinstance(f['conclusions']['developer_floor_unreachable_with_measured_parameter_family'], bool)
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-zstd-parameter-decomposition.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-zstd-parameter-decomposition-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-zstd-parameter-decomposition.json
            benchmark-artifacts/v030-zstd-parameter-floor.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic-only parameter attribution. A positive call-level hybrid result is now paired with an
# optimistic per-payload oracle floor. If even perfect foresight cannot cross a required v0.29 floor,
# the measured parameter family is closed for that red rather than rescued with more thresholds.
