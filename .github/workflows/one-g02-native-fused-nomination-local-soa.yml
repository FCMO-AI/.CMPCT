name: ONE-G0.2 native fused nomination compact local SoA

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_native_fused_nomination_local_soa_ab.py"
      - "docs/one/evidence/ONE_G02_NATIVE_FUSED_NOMINATION_LOCAL_SOA_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-native-fused-nomination-local-soa.yml"
  pull_request:
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_native_fused_nomination_local_soa_ab.py"
      - "docs/one/evidence/ONE_G02_NATIVE_FUSED_NOMINATION_LOCAL_SOA_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-native-fused-nomination-local-soa.yml"

permissions:
  contents: read

jobs:
  fused-local-soa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Semantic and hostile ONE suite
        run: python -m pytest tests/one -q
      - name: Exact-source compact local SoA fused A-B
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_native_fused_nomination_local_soa_ab | tee artifacts/one/native_fused_nomination_local_soa.json
          rc=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/one/native_fused_nomination_local_soa.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload exact-source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-fused-nomination-local-soa-${{ github.sha }}
          path: artifacts/one/native_fused_nomination_local_soa.json
          if-no-files-found: error
