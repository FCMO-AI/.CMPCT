# ci-lane: fast
name: CMPCT v0.31 Reader Hardlink Graph O25
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_reader_hardlink_graph_o25.py'
      - 'docs/v031-research/2026-10-24-reader-hardlink-graph-o25-prereg.md'
      - '.github/workflows/v031-reader-hardlink-graph-o25.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-reader-hardlink-o25-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  reader-hardlink-graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
      - name: Bind exact source and test identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git rev-parse HEAD
          git hash-object src/cmpct/reader.py
          git hash-object tests/test_reader_hardlink_graph_o25.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CMPCT implementation
        run: python -m pip install -e ".[test]"
      - name: Authentic revision-24 hardlink-owner Reader court
        shell: bash
        run: |
          mkdir -p o25-evidence
          python -m pytest --noconftest -q -rs tests/test_reader_hardlink_graph_o25.py 2>&1 | tee o25-evidence/pytest.log
          exit "${PIPESTATUS[0]}"
      - name: Persist negative and positive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-hardlink-o25-${{ matrix.os }}-${{ github.sha }}
          path: o25-evidence/
          if-no-files-found: warn
          retention-days: 30
