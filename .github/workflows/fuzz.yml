# ci-lane: fast
name: CMPCT continuous fuzzing

on:
  pull_request:
    paths:
      - "src/**"
      - "native/**"
      - "fuzz/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: cmpct-fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fuzz runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install 'atheris>=2.3,<3'
      - name: Fuzz bounded delta decoder
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then BUDGET=120; else BUDGET=20; fi
          python fuzz/fuzz_delta.py -max_len=262144 -max_total_time="$BUDGET" -artifact_prefix=/tmp/delta-crash-
      - name: Fuzz revision-24 structural preflight
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then BUDGET=180; else BUDGET=20; fi
          python fuzz/fuzz_preflight.py -max_len=2097152 -max_total_time="$BUDGET" -artifact_prefix=/tmp/preflight-crash-
      - name: Fuzz EntropyGraph II parser
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then BUDGET=180; else BUDGET=20; fi
          python fuzz/fuzz_entropygraph_v028.py -max_len=2097152 -max_total_time="$BUDGET" -artifact_prefix=/tmp/eg2-crash-
      - name: Retain crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-fuzz-crashes-${{ github.sha }}
          path: |
            /tmp/delta-crash-*
            /tmp/preflight-crash-*
            /tmp/eg2-crash-*
          if-no-files-found: warn

# Footnote: PR fuzzing is deliberately short so parser regressions get fast feedback; the scheduled
# run increases the exploration budget continuously. Expected malformed-input rejection is handled in
# each target, while MemoryError/assertions/native crashes remain visible to libFuzzer and fail CI.
