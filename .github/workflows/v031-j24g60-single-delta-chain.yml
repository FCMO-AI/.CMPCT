# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24G60 science-only process-bound Reader open vs same-state checkpoint.
name: CMPCT J24G60 public single-delta Reader chain court

on:
  push:
    branches:
      - agent/phased1-v031-j24g60-public-chain-coldopen-20261030
    paths:
      - 'research/j24g60_single_delta_chain_court.py'
      - 'docs/v031-research/*j24g60*'
      - '.github/workflows/v031-j24g60-single-delta-chain.yml'
  pull_request:
    branches:
      - agent/phased2-v031-j24g57-failclosed-journal-footer-20261030
    paths:
      - 'research/j24g60_single_delta_chain_court.py'
      - 'docs/v031-research/*j24g60*'
      - '.github/workflows/v031-j24g60-single-delta-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g60-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-chain-physical-court:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G60_RESULT: evidence/j24g60-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact source, public Writer and prospective preregistration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 1935c14c76f1bb39fd218d73cdbee93d3c2b76a1 HEAD
          git merge-base --is-ancestor ad718f59f346e6ce21ec1b45d2e5747748389052 HEAD
          test "$(git rev-parse HEAD:src/cmpct/builder.py)" = a2160a2f6b1ca3ef8cd94897cb68bb2fcb74ebc2
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git rev-parse HEAD:src/cmpct/transactions.py)" = 3eef7fdc3f6deca5ddd6d9edf1292c7e2c864f11
          test "$(git rev-parse HEAD:src/cmpct/journal_replay.py)" = 03743ca2a06c022c2ec64243a90fe373cf91e899
          test "$(git rev-parse HEAD:src/cmpct/validation.py)" = 5ea3b8f26058b0983c9686295c73f15472bc3ffe
          git rev-parse HEAD > evidence/head.txt
          git rev-parse HEAD:src/cmpct/reader.py > evidence/reader-blob.txt
          git rev-parse HEAD:src/cmpct/transactions.py > evidence/writer-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source and independent r24 wire parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'zstandard>=0.22' 'msgpack>=1.0'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g60_single_delta_chain_court.py
      - name: Measure real public signed deltas vs same-state synthetic checkpoint
        shell: bash
        run: |
          set -o pipefail
          python research/j24g60_single_delta_chain_court.py 2>&1 | tee evidence/court.log
          test -s evidence/j24g60-result.json
      - name: Archive source-bound evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g60-single-delta-court-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
