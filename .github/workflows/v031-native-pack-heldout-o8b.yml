# ci-lane: fast
name: CMPCT v0.31 native linked suffix admission O8b

on:
  pull_request:
    paths:
      - 'tests/native_pack_heldout_o8b.py'
      - 'tests/native_pack_heldout_o8.py'
      - 'tests/native_pack_consumer_o7.c'
      - 'docs/v031-research/NATIVE_PACK_HELDOUT_O8B_PREREG.md'
      - 'native/cmpct-core/src/lib.rs'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v031-native-pack-heldout-o8b.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-native-pack-o8b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  extension-admission-o8b:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind source and frozen prospective experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch tests/native_pack_heldout_o8b.py tests/native_pack_heldout_o8.py tests/native_pack_consumer_o7.c docs/v031-research/NATIVE_PACK_HELDOUT_O8B_PREREG.md
          python -m py_compile tests/native_pack_heldout_o8b.py tests/native_pack_heldout_o8.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build unchanged public C11 native consumer on exact release Rust
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml -- --check
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
          cc -std=c11 -O2 -Wall -Wextra -Werror -I. tests/native_pack_consumer_o7.c -Lnative/cmpct-core/target/release -lcmpct_core -Wl,-rpath,"$PWD/native/cmpct-core/target/release" -o /tmp/cmpct-native-c-consumer-o8b
      - name: Strict .dat versus .txt controlled ABBA and independent exact-tree SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-pack-o8b"
          python tests/native_pack_heldout_o8b.py /tmp/cmpct-native-c-consumer-o8b "$RUNNER_TEMP/cmpct-native-pack-o8b/result.json" | tee "$RUNNER_TEMP/cmpct-native-pack-o8b/log.txt"
          sha256sum "$RUNNER_TEMP/cmpct-native-pack-o8b/result.json" > "$RUNNER_TEMP/cmpct-native-pack-o8b/result.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c-admission-o8b-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-pack-o8b/
          if-no-files-found: warn
          retention-days: 30
