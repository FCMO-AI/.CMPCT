# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 integrated tabular archive Genesis shim

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_tabular_integrated_archive.py'
      - 'benchmarks/v030_r4_tabular_integrated_archive_genesis_shim.py'
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_binary_owner_fast_oracle.py'
      - '.github/workflows/v030-r4-tabular-integrated-archive-genesis-shim.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-tabular-integrated-genesis-${{ github.sha }}
  cancel-in-progress: false

jobs:
  integrated-tabular-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile integrated research path and sealed-row shim
        run: |
          python -m py_compile \
            benchmarks/v030_r4_tabular_integrated_archive.py \
            benchmarks/v030_r4_tabular_integrated_archive_genesis_shim.py \
            benchmarks/v030_r4_tabular_admission_oracle_v2.py \
            benchmarks/v030_r4_tabular_owner_oracle.py \
            benchmarks/v030_r4_tabular_binary_owner_fast_oracle.py
      - name: Run exact 15-workload integrated falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_tabular_integrated_archive_genesis_shim.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-integrated-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-integrated.json"
      - name: Enforce receipt integrity only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-tabular-integrated.json').read_text())
          assert d['schema']=='cmpct-v030-r4-tabular-integrated-archive-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert len(d['rows'])==15
          assert sum(int(r['accepted_v029_bytes']) for r in d['rows'])==137_499_525
          analytics=next(r for r in d['rows'] if r['suite']=='neutral_hostile_v1' and r['name']=='04_analytics_and_database')
          assert analytics['accepted_v029_bytes']==6_135_172
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit']
          assert not c['production_format_changed'] and not c['production_selector_changed']
          assert c['nonaccepted_fallback_is_ordinary_v030_bytes']
          assert c['discovery_and_exact_proof_charged'] and c['fresh_process_builds'] and c['peak_rss_measured']
          assert c['authenticated_component_wrapper'] and c['full_reconstruction_verified'] and c['owner_corruption_rejected']
          print(json.dumps({'totals':d['totals'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-tabular-integrated-genesis-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-tabular-integrated.json
          if-no-files-found: error
          retention-days: 90

# Research-only recovery lane. Green certifies receipt integrity, not scientific promotion.
