# ci-lane: fast
# ci-cancel-policy: cancel-obsolete-fast-pr-check
name: J24I08 compaction Win32 owner composition three-host court

on:
  push:
    branches:
      - "agent/phased3-v031-j24i08-*"
    paths:
      - "tests/research/j24i07_compaction_three_host.py"
      - ".github/workflows/v031-j24i08-compaction-win32.yml"
      - "docs/v031-research/2026-10-29-j24i08-*.md"
  pull_request:
    paths:
      - "tests/research/j24i07_compaction_three_host.py"
      - ".github/workflows/v031-j24i08-compaction-win32.yml"
      - "docs/v031-research/2026-10-29-j24i08-*.md"
      - "src/cmpct/builder.py"
      - "src/cmpct/transactions.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24i08-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-portability:
    name: Installed exact-source compaction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24I07_CHECKOUT: ${{ github.workspace }}
      CMPCT_J24I07_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24I07_ARTIFACT_DIR: ${{ github.workspace }}/j24i08-evidence/archives
      CMPCT_J24I07_RECEIPT: ${{ github.workspace }}/j24i08-evidence/court.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source, preregistration and product isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor 52d51b9446dc8876319f7bd1e6ca2b7f54681de8 HEAD
          git merge-base --is-ancestor e625b83eb3be9b1eb298de2aa1962d1641185555 HEAD
          # J24I11 changes exactly one additional Builder donor; every J24I08
          # mtime/transaction invariant below remains source-exact and tested.
          git diff --exit-code 94acd76dafc7463cc98b3a566041a7334ea966e9 HEAD -- native/ docs/FORMAT.md docs/PERFORMANCE_RELEASE_GATE.md benchmarks/
          test "$(git rev-parse HEAD:src/cmpct/_win32_times.py)" = "70308f454c74fad7b247db6ee36aa8cc7d38c99c"
          test "$(git rev-parse HEAD:src/cmpct/builder.py)" = "b3c8cbfbefb9d47ffa849bd939257215ee4b0a09"
          python -c "import subprocess; changed=set(subprocess.check_output(['git','diff','--name-only','94acd76dafc7463cc98b3a566041a7334ea966e9','HEAD','--','src/']).decode().splitlines()); assert changed=={'src/cmpct/_win32_times.py','src/cmpct/reader.py','src/cmpct/transactions.py','src/cmpct/builder.py'}, changed"
          python -c "from pathlib import Path; s=Path('src/cmpct/reader.py').read_text(); assert s.count('self._restore_regular_mtime(')==2 and 'except (OSError, NotImplementedError):pass' in s and 'restore_win32_leaf_mtime' in s"
          python -c "import pathlib,subprocess; original=subprocess.check_output(['git','show','94acd76dafc7463cc98b3a566041a7334ea966e9:src/cmpct/transactions.py']).decode(); current=pathlib.Path('src/cmpct/transactions.py').read_text(); assert current==original.replace(\"with open(stage,'rb') as stream:os.fsync(stream.fileno())\",\"with open(stage,'rb+') as stream:os.fsync(stream.fileno())\")"
          python -c "import os,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent; p.mkdir(parents=True,exist_ok=True)"
          git rev-parse HEAD > j24i08-head.txt
          python -c "import os,shutil,pathlib; shutil.copy('j24i08-head.txt',pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent/'head.txt')"
          git rev-parse 'HEAD:src/cmpct/builder.py' > j24i08-builder-blob.txt
          git rev-parse 'HEAD:src/cmpct/transactions.py' > j24i08-transactions-blob.txt
          python -c "import os,shutil,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent; shutil.copy('j24i08-builder-blob.txt',p/'builder-blob.txt'); shutil.copy('j24i08-transactions-blob.txt',p/'transactions-blob.txt')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install candidate as wheel and compile independent test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m py_compile tests/research/j24i07_compaction_three_host.py
      - name: Execute real portable filesystem and archive court
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/research/j24i07_compaction_three_host.py"
      - name: Validate receipt and preserve decisive host result
        if: always()
        shell: bash
        run: |
          python -c "import os,json,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']); print('RECEIPT_EXISTS',p.exists()); x=json.loads(p.read_text()) if p.exists() else {}; print('DECISION',x.get('decision')); print('CASES',len(x.get('cases',[]))); print('HOST',x.get('host'))"
      - name: Upload physical source/output archive witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24i07-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: j24i08-evidence/
          if-no-files-found: warn
          retention-days: 90
