name: CMPCT v0.30 content-ZIP fused plan/cache
# ci-lane: deep
on:
  workflow_dispatch:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_content_zip_fused_plan_cache.py'
      - '.github/workflows/v030-content-zip-fused-plan-cache.yml'
concurrency:
  group: v030-content-zip-fused-plan-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.c.outputs.run }}
      sha: ${{ steps.c.outputs.sha }}
    steps:
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
  evidence:
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run final-form fused-plan falsifier
        env:
          EVIDENCE_HEAD: ${{ needs.classify.outputs.sha }}
          PYTHONHASHSEED: '0'
        run: python benchmarks/v030_content_zip_fused_plan_cache.py --output benchmark-artifacts/fused-plan-cache.json
      - name: Enforce preregistered contract
        run: |
          python - <<'PY'
          import json
          p='benchmark-artifacts/fused-plan-cache.json'; d=json.load(open(p)); s=d['summary']
          assert d['source_commit'] == '${{ needs.classify.outputs.sha }}'
          assert d['hypothesis']['supported_for_full_matrix_next_rung'], (s,d['hostiles'])
          assert s['archive_delta_bytes'] <= 0
          assert s['rss_ratio'] <= 1.10
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-content-zip-fused-plan-cache-${{ needs.classify.outputs.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
