# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 r24 compact-control oracle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus and compressor dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile compact-control oracle
        run: python -m py_compile benchmarks/v030_r24_compact_control_oracle.py benchmarks/v030_r24_compact_control_oracle_v2.py benchmarks/v030_r24_compact_control_oracle_v3.py
      - name: Run exact compact-control frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_compact_control_oracle_v3.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-compact-control-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-compact-control.json"
      - name: Independently enforce evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-compact-control.json').read_text())
          assert d['schema']=='cmpct-v030-r24-compact-control-oracle-v3'
          assert d['contract']['control_copies']==2
          assert d['contract']['payload_records']=='exact shipping r24 physical records, unchanged'
          assert d['contract']['levels']==[1,3,6,9,12,19]
          g=d['gate']
          assert g['target_semantic_roundtrip_exact'] is True
          assert g['target_two_recovery_copies_retained'] is True
          assert g['target_payload_records_unchanged'] is True
          assert g['target_measurement_deterministic'] is True
          assert g['experiment_valid'] is True
          assert g['promotion_earned'] == g['target_strict_four_way_potential']
          t=d['target']
          assert t['rounds']==5
          assert t['semantic_index_roundtrip_exact'] is True
          assert t['two_authenticated_control_copies_retained'] is True
          assert t['physical_payload_records_unchanged'] is True
          assert t['projected_size_deterministic'] is True
          assert len(t['samples'])==5
          diag=d['diagnosis']
          assert diag['compact_control_total_saving_bytes'] == 2*t['saving_per_control_copy_bytes']
          assert diag['remaining_zstd_size_deficit_bytes'] == t['projected_two_copy_archive_bytes']-t['zstd19_bytes']
          if g['promotion_earned']:
              assert t['projected_two_copy_archive_bytes'] < t['zip_bytes']
              assert t['projected_two_copy_archive_bytes'] < t['zstd19_bytes']
              assert t['median_conservative_projected_create_s'] < t['median_zip_create_s']
              assert t['median_conservative_projected_create_s'] < t['median_zstd19_create_s']
          else:
              assert g['target_strict_four_way_potential'] is False
          tiny=d['diagnostic']
          assert tiny['semantic_index_roundtrip_exact'] is True
          assert tiny['two_authenticated_control_copies_retained'] is True
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-compact-control-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-compact-control-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-compact-control.json
          if-no-files-found: warn
          retention-days: 90

# Terminal compact-control research retained for manual reproduction. Shipping authority later found zero valid
# frozen or unseen admissions for this family and explicitly disabled its terminal selector. Replaying this seed
# oracle automatically cannot move v0.30 release authority and only consumes constrained runner capacity.
