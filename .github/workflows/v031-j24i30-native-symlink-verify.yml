# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: J24I30 Native r24 Symlink Strong-Verification Falsifier

on:
  pull_request:
    paths:
      - 'research/j24i30/**'
      - 'native/cmpct-core/tests/j24i30_symlink_verify.rs'
      - 'docs/v031-research/*j24i30*'
      - '.github/workflows/v031-j24i30-native-symlink-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: j24i30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-native-symlink:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
          persist-credentials: false
      - name: Source identity and owner fixture commitments
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object native/cmpct-core/src/vzip_dispatch.rs)" = "60e53b1e85c30d413e379052bb288ed3b51ec30d"
          test "$(git hash-object native/cmpct-core/src/lib.rs)" = "463c50633be74423e92a074b7d7577db6a4b0cf9"
          test "$(git hash-object research/j24i27/test_present_row_sha.py)" = "c024b6e05926c6968301e32dcba8b2502a7125ca"
          git rev-parse HEAD | tee j24i30-head.txt
          git hash-object native/cmpct-core/tests/j24i30_symlink_verify.rs | tee j24i30-rust-test-blob.txt
          git hash-object research/j24i30/generate_symlink_wire.py | tee j24i30-python-test-blob.txt
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(research/j24i30/|native/cmpct-core/tests/j24i30_symlink_verify\\.rs|docs/v031-research/.*j24i30|\\.github/workflows/v031-j24i30-native-symlink-verify\\.yml)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
      - name: Install actual CMPCT source and generate physically authenticated r24 cases
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . zstandard
          python research/j24i30/generate_symlink_wire.py --output j24i30-observations 2>&1 | tee j24i30-python.log
          test -s j24i30-observations/python-observations.json
          python research/j24i30/audit_symlink_wire.py --case-dir j24i30-observations 2>&1 | tee j24i30-referee.log
          test -s j24i30-observations/independent-physical-audit.json
      - name: Run real native core full-verification court
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          J24I30_CASE_DIR: ${{ github.workspace }}/j24i30-observations
        run: |
          set -euo pipefail
          cargo test --manifest-path native/cmpct-core/Cargo.toml --test j24i30_symlink_verify -- --nocapture 2>&1 | tee j24i30-rust.log
          grep -q 'J24I30_NEGATIVE_present-foreign:native_verify_ok=true' j24i30-rust.log
          grep -q 'J24I30_NEGATIVE_physical-wrong:native_verify_ok=true' j24i30-rust.log
          grep -q 'J24I30B_NEGATIVE_present-empty:native_admission_refused=true' j24i30-rust.log
      - name: Preserve original positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24i30-native-symlink-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            j24i30-head.txt
            j24i30-python-test-blob.txt
            j24i30-rust-test-blob.txt
            j24i30-python.log
            j24i30-rust.log
            j24i30-referee.log
            j24i30-observations/
