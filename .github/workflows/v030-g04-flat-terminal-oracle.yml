# ci-lane: focused
name: CMPCT v0.30 G04 flat-only terminal oracle

on:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - 'benchmarks/v030_g04_flat_terminal_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_geometry_overlay.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - '.github/workflows/v030-g04-flat-terminal-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-g04-flat-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  exact-complete-artifact-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow reportlab python-docx openpyxl python-pptx numpy
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_g04_flat_terminal_oracle.py
      - name: Run complete-artifact flat-only A/B
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_g04_flat_terminal_oracle.py \
            --work-root benchmark-artifacts/v030-g04-flat-work \
            --output benchmark-artifacts/v030-g04-flat.json \
            2>&1 | tee benchmark-artifacts/v030-g04-flat.stdout.txt
      - name: Enforce research boundary and immutable gates
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-g04-flat.json')
          assert p.is_file(), 'flat-only oracle did not emit evidence'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-g04-flat-terminal-oracle-v1'
          assert d['research_only'] is True
          assert d['target']==['neutral_hostile_v1','09_ml_artifacts']
          g=d['gates']
          assert g['accepted_v029_floor_preserved'] is True
          assert g['semantic_tree_identity'] is True
          assert g['strong_verification'] is True
          assert g['deterministic_complete_bytes'] is True
          assert g['complete_create_speedup_at_least_20pct'] is True
          assert g['passed'] is True
          receipt={
            'schema':'cmpct-v030-g04-flat-terminal-receipt-v1',
            'candidate_sha':os.environ['EVIDENCE_HEAD'],
            'evidence_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'archive_bytes':d['flat_only']['archive_bytes'],
            'byte_margin_vs_v029':d['flat_only']['byte_margin_vs_v029'],
            'candidate_to_shipping_create_ratio':d['flat_only']['candidate_to_shipping_create_ratio'],
            'passed':True,
            'release_credit':False,
          }
          Path('benchmark-artifacts/v030-g04-flat-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-g04-flat-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-g04-flat.json
            benchmark-artifacts/v030-g04-flat-receipt.json
            benchmark-artifacts/v030-g04-flat.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# Research-only. Green means a generic content-agnostic hierarchy terminal deserves productization work; it does not
# itself alter shipping selection, external score, native/Android authority, or the final release lock.
