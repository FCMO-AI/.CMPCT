name: CMPCT v031 POSIX byte namespace oracle
on:
  pull_request:
    paths:
      - 'benchmarks/v031_posix_byte_namespace_oracle.py'
      - '.github/workflows/v031-posix-byte-name-oracle.yml'
      - 'benchmarks/history/2026-10-23-v031-posix-byte-namespace-oracle.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact source and execute UTF-8 physical court
        run: |
          git rev-parse HEAD
          python -m pip install msgpack==1.1.2
          python benchmarks/v031_posix_byte_namespace_oracle.py | tee /tmp/posix-byte-utf8.json
          python -c 'import json; r=json.load(open("/tmp/posix-byte-utf8.json")); assert r["status"]=="PASS" and r["noncanonical_rejected"]==18 and r["near_limit_escaped_wire_bytes"]>r["near_limit_raw_path_bytes"]'
      - name: Execute ASCII-filesystem-encoding adversarial court
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
        run: |
          python -c 'import sys; assert sys.getfilesystemencoding()=="ascii", sys.getfilesystemencoding()'
          python benchmarks/v031_posix_byte_namespace_oracle.py | tee /tmp/posix-byte-ascii.json
          python -c 'import json; a=json.load(open("/tmp/posix-byte-ascii.json")); assert a["status"]=="PASS" and a["host"]["status"]=="PASS"'
      - name: Save exact-head detached evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-byte-namespace-scientific-only
          path: /tmp/posix-byte-*.json
          if-no-files-found: warn
