# Source-exact O76 research court: distinct from O70 S_PACK and O73 owner splitting.
name: CMPCT v0.31 O76 VZIP selective Deflate retention
on:
  push:
    branches:
      - 'agent/phased3-v031-vzip-range-retention-o76-20261025'
  pull_request:
    paths:
      - 'benchmarks/v031_o76_vzip_retention_oracle.py'
      - '.github/workflows/v031-o76-vzip-range-retention.yml'
      - 'docs/v031-research/2026-10-25-o76-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o76-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-bound-retention-oracle:
    name: O76 installed exact-source VZIP range court
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bind source, install real product, run independent archive evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object src/cmpct/builder.py)" = "663ef0922992b1fbb8f19e6eea88d55c10a56044"
          test "$(git hash-object src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test "$(git hash-object src/cmpct/codec.py)" = "29526db4203723d83523fc95d074c346b63d7587"
          python -m pip install .
          python - <<'PY'
          from pathlib import Path
          import cmpct.builder as builder, cmpct.reader as reader
          import subprocess
          repo=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip())
          for module in (builder, reader):
              path=Path(module.__file__).resolve()
              assert not path.is_relative_to(repo), f"editable source is not installed evidence: {path}"
              print("O76_INSTALLED_MODULE="+str(path))
          PY
          python benchmarks/v031_o76_vzip_retention_oracle.py 2>&1 | tee o76-run.log
          python benchmarks/v031_o76b_range_integrity_falsifier.py 2>&1 | tee o76b-run.log
      - name: Preserve exact observed evidence and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o76-vzip-range-${{ env.EVIDENCE_HEAD }}
          path: |
            o76-run.log
            o76-evidence.json
            o76b-run.log
            o76b-evidence.json
          retention-days: 30
          if-no-files-found: warn
