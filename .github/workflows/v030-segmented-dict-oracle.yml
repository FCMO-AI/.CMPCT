# ci-lane: deep
name: CMPCT v0.30 segmented shared-dictionary oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_segmented_dict_oracle.py'
      - 'benchmarks/v030_segmented_solid_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - '.github/workflows/v030-segmented-dict-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-segmented-dict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  segmented-dict-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_segmented_dict_oracle.py
      - name: Run exact-tree shared-dictionary segmented sweep
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_segmented_dict_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-segmented-dict-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-segmented-dict.json"
      - name: Enforce evidence honesty and locality invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-segmented-dict.json').read_text())
          assert d['schema']=='cmpct-v030-segmented-dict-oracle-v1'
          assert d['claim_boundary'].startswith('research-only')
          assert d['max_member_read_amplification']==8.0
          assert d['max_decode_unit_bytes']==8*1024*1024
          assert d['summary']['workloads']==15 and len(d['rows'])==15
          assert d['summary']['all_measured_candidates_locality_green'] is True
          for row in d['rows']:
              assert row['timing_boundary']=='source-scan+segment-plan+dictionary-train+zstd-segments+manifest+sha256+archive-write'
              for c in row['candidates']:
                  if not c.get('available'):
                      continue
                  assert c['tree_verified'] is True
                  assert c['max_member_read_amplification'] <= 8.0
                  assert c['max_decode_unit_bytes'] <= 8*1024*1024
                  assert c['locality_green'] is True
                  expected=c['pack_source_s']+c['dictionary_train_s']+c['compress_manifest_hash_write_s']
                  assert abs(c['create_s']-expected) < 1e-9
                  strict=all(c[k] for k in ('beats_zip_size','beats_zstd19_size','beats_zip_create','beats_zstd19_create'))
                  assert c['viable'] is strict
          PY
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-segmented-dict-${{ github.sha }}
          path: benchmark-artifacts/v030-segmented-dict.json
          if-no-files-found: error
          retention-days: 90

# Research only. Shared dictionaries may recover cross-segment redundancy, but any promoted form must still be
# expressed in canonical r25 and pass reader/native/Android/integrity/product authority before receiving credit.
