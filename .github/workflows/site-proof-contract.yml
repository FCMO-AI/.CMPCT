# ci-lane: fast
name: CMPCT public proof contract

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/SITE_PUBLIC_PROOF_STANDARD.md"
      - "docs/GH_PAGES_DEPLOYMENT.md"
      - "docs/PUBLIC_SURFACE.md"
      - "tools/check_public_surface.py"
      - "COPYRIGHT.md"
      - "LICENSING.md"
      - "benchmarks/history/**"
      - "SURFACE_REVISION"
      - "pyproject.toml"
      - ".github/workflows/site-proof-contract.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/SITE_PUBLIC_PROOF_STANDARD.md"
      - "docs/GH_PAGES_DEPLOYMENT.md"
      - "docs/PUBLIC_SURFACE.md"
      - "tools/check_public_surface.py"
      - "COPYRIGHT.md"
      - "LICENSING.md"
      - "benchmarks/history/**"
      - "SURFACE_REVISION"
      - "pyproject.toml"
      - ".github/workflows/site-proof-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-public-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  proof-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact candidate repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install canonical CMPCT package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build public site
        run: |
          python tools/check_public_surface.py
          python site/build_site.py --out _site
          python site/enhance_site.py _site

      - name: Validate stable public evidence and required proof surfaces
        run: python site/tests/proof_surface_contract.py _site

      - name: Preserve release-level evidence invariants
        run: python site/tests/release_evidence_contract.py

      - name: Check browser code
        run: |
          node --check site/src/assets/app.js
          node --check site/src/assets/experience.js
          node --check site/src/assets/motion.js
          node --check site/src/assets/cinematic.js
          node --check site/src/assets/cmpct-browser-writer.js
          node --check site/tests/viewport-matrix.mjs

      - name: Preserve Browser Lab canonical compatibility
        run: |
          node site/tests/browser-writer-smoke.mjs /tmp/browser-writer-smoke.cmpct
          python - <<'PY'
          from pathlib import Path
          from cmpct.reader import CMPCT

          path = Path('/tmp/browser-writer-smoke.cmpct')
          with CMPCT(path) as archive:
              assert archive.index['v'] == 24
              assert [row[0] for row in archive.files] == ['copy/repeated.txt', 'docs/repeated.txt', 'unique.txt']
              assert archive.read('copy/repeated.txt') == archive.read('docs/repeated.txt')
              assert archive.read('unique.txt') == b'small independent file\n'
          PY

      - name: Install Chromium render harness
        run: |
          # Footnote: Playwright is CI-only and never ships with the public site. GitHub's Ubuntu runner
          # already carries Chromium's ordinary system libraries; downloading only the pinned browser keeps
          # this fast-lane gate deterministic and avoids mutating the runner with an apt transaction on every PR.
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Render responsive viewport matrix
        run: |
          python -m http.server 4173 --directory _site >/tmp/cmpct-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node site/tests/viewport-matrix.mjs http://127.0.0.1:4173/ viewport-artifacts

      - name: Preserve responsive render evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-responsive-matrix-${{ env.EVIDENCE_HEAD }}
          path: viewport-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Stamp validated main publication receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SOURCE_COMMIT: ${{ env.EVIDENCE_HEAD }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          printf '%s\n' "$SOURCE_COMMIT" > benchmark-artifacts/site-proof-source-commit.txt

      - name: Upload validated main publication receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-site-proof-source-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/site-proof-source-commit.txt
          if-no-files-found: error
          retention-days: 90

# Footnote: public proof is release evidence, not merely presentation CI. PR validation therefore binds to the
# exact candidate head; a synthetic merge commit cannot supply a receipt for v0.30 release authority. The guard,
# its normative policy, and the exact canonical legal-attribution files are evidence-critical inputs: changes to
# any of them must regenerate the public-proof receipt rather than inheriting a stale green result.
