# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 verification cache ownership oracle
on:
  push:
    branches: [agent/v030-verify-cache-ownership]
    paths: ['benchmarks/v030_verify_cache_ownership_ab.py','.github/workflows/v030-verify-cache-ownership.yml']
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: cmpct-v030-verify-cache-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_verify_cache_ownership_ab.py
      - name: Run ML verification-cache A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_verify_cache_ownership_ab.py --work-root "$RUNNER_TEMP/verify-cache" --output benchmark-artifacts/verify-cache.json | tee benchmark-artifacts/verify-cache.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verify-cache-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90
