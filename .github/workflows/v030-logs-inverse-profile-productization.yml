# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 logs inverse profile productization

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_logs_inverse_profile.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile_v2.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile_v3.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/v030_logs_inverse_profile_productization.py'
      - 'benchmarks/v030_logs_inverse_profile_productization_v2.py'
      - 'benchmarks/v030_logs_inverse_profile_productization_v3.py'
      - 'benchmarks/v030_logs_inverse_edge_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'tests/test_v030_logs_inverse_profile_v3.py'
      - '.github/workflows/v030-logs-inverse-profile-productization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_logs_inverse_profile.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile_v2.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile_v3.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/v030_logs_inverse_profile_productization.py'
      - 'benchmarks/v030_logs_inverse_profile_productization_v2.py'
      - 'benchmarks/v030_logs_inverse_profile_productization_v3.py'
      - 'benchmarks/v030_logs_inverse_edge_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'tests/test_v030_logs_inverse_profile_v3.py'
      - '.github/workflows/v030-logs-inverse-profile-productization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-inverse-profile-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_(logs_inverse_profile(_v[23])?|product_fs)\.py|benchmarks/v030_(logs_inverse_profile_productization(_v[23])?|logs_inverse_edge_oracle|external_competitors|release_generalization)\.py|tests/test_v030_logs_inverse_profile_v3\.py|\.github/workflows/v030-logs-inverse-profile-productization\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect logs inverse productization.'
          fi

  logs-inverse-profile-product:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus and competitor dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile profiles and proofs
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_logs_inverse_profile.py \
            experiments/entropygraph_v030_logs_inverse_profile_v2.py \
            experiments/entropygraph_v030_logs_inverse_profile_v3.py \
            experiments/entropygraph_v030_product_fs.py \
            benchmarks/v030_logs_inverse_profile_productization.py \
            benchmarks/v030_logs_inverse_profile_productization_v2.py \
            benchmarks/v030_logs_inverse_profile_productization_v3.py
      - name: Exercise non-benchmark filesystem semantics and unsafe-link rejection
        run: python -m pytest -q tests/test_v030_logs_inverse_profile_v3.py
      - name: Run recoverable physical-locality content boundary
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_inverse_profile_productization_v2.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-profile-product-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-profile-product-v2.json"
      - name: Run canonical-filesystem product boundary
        run: |
          python benchmarks/v030_logs_inverse_profile_productization_v3.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-profile-product-v3-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-profile-product-v3.json"
      - name: Independently enforce recovery, filesystem, locality and competitor contract
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p2=Path('benchmark-artifacts/v030-logs-profile-product-v2.json')
          p3=Path('benchmark-artifacts/v030-logs-profile-product-v3.json')
          assert p2.is_file(), 'logs profile v2 evidence missing'
          assert p3.is_file(), 'logs profile v3 evidence missing'
          v2=json.loads(p2.read_text())
          d=json.loads(p3.read_text())
          assert v2['schema']=='cmpct-v030-logs-inverse-profile-productization-v2'
          assert v2['gate']['passed'] is True
          assert d['schema']=='cmpct-v030-logs-inverse-profile-productization-v3'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['canonical_filesystem_manifest'] is True
          assert d['accepted_v029_bytes']==3550609
          c=d['candidate']; g=d['gate']
          assert c['profile']=='cmpct-r25-logs-inverse-v1'
          assert c['profile_writer_revision']==3
          assert c['level']==12
          assert c['canonical_filesystem_manifest'] is True
          assert c['filesystem_manifest_bytes'] > 0
          assert c['filesystem_manifest_entries'] >= c['filesystem_regular_members']
          assert c['payload_copies']==1
          assert c['recovery_control_copies']==2
          assert c['strong_verify']['ok'] is True
          assert c['strong_verify']['canonical_filesystem_manifest'] is True
          assert c['strong_verify']['filesystem_regular_members']==c['filesystem_regular_members']
          assert c['strong_verify']['max_member_read_amplification'] <= 8.0
          assert c['strong_verify']['max_decode_unit_bytes'] <= 8*1024*1024
          assert c['recovery']['primary_damage']['recovery_route']=='tail'
          assert c['recovery']['tail_damage']['recovery_route']=='primary'
          assert c['recovery']['both_failed_closed'] is True
          for key in (
              'no_regression_vs_v029',
              'strictly_smaller_than_zip','strictly_smaller_than_zstd19',
              'strictly_faster_than_zip','strictly_faster_than_zstd19',
              'strong_verify_green','tree_verified','locality_green',
              'primary_recovers_from_tail','tail_recovers_from_primary',
              'both_metadata_copies_fail_closed','single_payload_copy','two_control_copies',
              'canonical_filesystem_manifest',
          ):
              assert g[key] is True
          assert g['passed'] is True
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload recoverable profile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-logs-inverse-profile-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-logs-profile-product-v2.json
            benchmark-artifacts/v030-logs-profile-product-v3.json
          if-no-files-found: error
          retention-days: 90
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-inverse-profile-productization.yml

# This gate may establish a productizable Python profile with canonical filesystem semantics, but it cannot
# authorize selector/native/Android dispatch. Those remain separate release obligations and the strict global
# release lock remains authoritative.
