# ci-lane: fast
name: CMPCT v0.31 J24G02 independent journal indexed Reader
on:
  pull_request:
    paths:
      - 'tests/test_v24_committed_journal_golden.py'
      - 'tests/conformance/v24-committed-journal.json'
      - 'docs/v031-research/2026-10-26-j24g02-journal-indexed-conformance-prereg.md'
      - '.github/workflows/v031-j24g02-independent-journal.yml'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/validation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  independent-signed-journal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact Git source and independently frozen byte oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p j24g02-evidence
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = '6de2edcf5b804e224a1c651ca77361af5667dc2e'
          test "$(git rev-parse HEAD:src/cmpct/validation.py)" = '2bb3f53c918ae93efb105364e2b93ea46aeca034'
          test "$(git rev-parse HEAD:tests/test_v24_committed_journal_golden.py)" = '63024d52c0d7a97d63adaabf13f9a0cff6499de8'
          test "$(git rev-parse HEAD:tests/conformance/v24-committed-journal.json)" = '74a39263954a84debd7ce6992cfa71fc1ed4dd91'
          {
            echo "head=$EVIDENCE_HEAD"
            echo 'reader_blob=6de2edcf5b804e224a1c651ca77361af5667dc2e'
            echo 'validator_blob=2bb3f53c918ae93efb105364e2b93ea46aeca034'
            echo 'test_blob=63024d52c0d7a97d63adaabf13f9a0cff6499de8'
            echo 'fixture_blob=74a39263954a84debd7ce6992cfa71fc1ed4dd91'
            echo "runner=$RUNNER_OS"
          } | tee j24g02-evidence/source.txt
      - name: Install genuine product and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run unchanged independent J24G01 seven-case oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -rs tests/test_v24_committed_journal_golden.py 2>&1 | tee j24g02-evidence/pytest.txt
      - name: Preserve result or negative with source custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g02-${{ matrix.os }}-${{ github.sha }}
          path: j24g02-evidence/
          if-no-files-found: warn
          retention-days: 30
