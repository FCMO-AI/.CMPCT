# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office SFV4 reproducibility referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_sfv4_reproducibility_referee.py'
      - '.github/workflows/v030-r4-office-sfv4-reproducibility-referee.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-office-sfv4-repro-${{ github.sha }}
  cancel-in-progress: false
jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        env: {EVENT_NAME: '${{ github.event_name }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r4_office_sfv4_reproducibility_referee\.py|\.github/workflows/v030-r4-office-sfv4-reproducibility-referee\.yml)$' /tmp/files; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi
  repro:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack
      - run: python -m py_compile benchmarks/v030_r4_office_sfv4_reproducibility_referee.py
      - name: Run two-build referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_sfv4_reproducibility_referee.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-sfv4-repro-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-sfv4-repro.json"
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-office-sfv4-repro.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit'] and not c['format_changed'] and not c['selector_changed']
          print(json.dumps({'a':d['build_a_bytes'],'b':d['build_b_bytes'],'mismatch':d['component_mismatches'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-sfv4-reproducibility-referee.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-sfv4-repro-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-sfv4-repro.json
          if-no-files-found: error
          retention-days: 90
# Green means the determinism referee ran. JSON decides whether H-REPRO passed.
