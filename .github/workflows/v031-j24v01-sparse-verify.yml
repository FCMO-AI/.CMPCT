# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 J24V01 streaming sparse verify
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_j24v01_sparse_verify_streamed.py'
      - 'docs/v031-research/2026-10-27-j24v01-*'
      - '.github/workflows/v031-j24v01-sparse-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24v01-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          git hash-object src/cmpct/reader.py > evidence/reader-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentic Python Reader and native codec
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run frozen vector, hostile mutations and real sparse RSS
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --noconftest tests/test_j24v01_sparse_verify_streamed.py 2>&1 | tee evidence/scientific-court.txt
      - name: Keep exact-head receipt on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24v01-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
