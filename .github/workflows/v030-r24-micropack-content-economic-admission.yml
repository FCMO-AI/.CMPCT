# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 content-economic micropack admission

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r24_micropack_content_economic_admission.py'
      - 'benchmarks/v030_r24_locality_derived_micropack_referee.py'
      - 'benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py'
      - 'benchmarks/v030_r24_micropack_same_grammar_attribution.py'
      - 'benchmarks/v030_r25_membership_complete_artifact_referee.py'
      - '.github/workflows/v030-r24-micropack-content-economic-admission.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_micropack_content_economic_admission.py'
      - 'benchmarks/v030_r24_locality_derived_micropack_referee.py'
      - 'benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py'
      - 'benchmarks/v030_r24_micropack_same_grammar_attribution.py'
      - 'benchmarks/v030_r25_membership_complete_artifact_referee.py'
      - '.github/workflows/v030-r24-micropack-content-economic-admission.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-content-economic-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r24_micropack_content_economic_admission\.py|benchmarks/v030_r24_locality_derived_micropack_referee\.py|benchmarks/v030_r24_locality_derived_micropack_hostile_transfer\.py|benchmarks/v030_r24_micropack_same_grammar_attribution\.py|benchmarks/v030_r25_membership_complete_artifact_referee\.py|\.github/workflows/v030-r24-micropack-content-economic-admission\.yml)$' /tmp/files; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  content-economic-admission:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r24_micropack_content_economic_admission.py benchmarks/v030_r24_locality_derived_micropack_referee.py benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py benchmarks/v030_r24_micropack_same_grammar_attribution.py benchmarks/v030_r25_membership_complete_artifact_referee.py
      - name: Execute path-blind content-economic referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_micropack_content_economic_admission.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-economic-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-economic.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-content-economic.json').read_text())
          assert d['schema']=='cmpct-v030-r24-micropack-content-economic-admission-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['canonical_builder_changed'] is False and d['path_signal_used'] is False
          assert d['locality_budget']==8.0 and len(d['sources'])==7
          assert d['verdict'] in {'RETIRE_CONTENT_ECONOMIC_ADMISSION','CONTENT_ECONOMIC_SAFE_BUT_NOT_EXTENSION_PARITY','CONTENT_ECONOMIC_ADMISSION_EARNS_PATH_BLIND_TRANSFER'}
          PY
      - name: Expose summary
        id: receipt
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-content-economic.json').read_text())
          short={'RETIRE_CONTENT_ECONOMIC_ADMISSION':'retire','CONTENT_ECONOMIC_SAFE_BUT_NOT_EXTENSION_PARITY':'safe-not-parity','CONTENT_ECONOMIC_ADMISSION_EARNS_PATH_BLIND_TRANSFER':'earns-transfer'}[d['verdict']]
          print(f"artifact_name=v030-content-economic-{short}-di{d['aggregate_delta_vs_independent_bytes']}-de{d['aggregate_delta_vs_extension_bytes']}-li{len(d['losses_vs_independent'])}-le{len(d['losses_vs_extension'])}")
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r24-micropack-content-economic-admission.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ steps.receipt.outputs.artifact_name || 'v030-content-economic-no-summary' }}-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-content-economic.json
          if-no-files-found: error
          retention-days: 90

# Research-only. Green means a valid receipt, never automatic promotion.
