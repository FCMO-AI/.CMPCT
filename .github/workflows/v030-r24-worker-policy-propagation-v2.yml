# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 worker-policy propagation causal v2

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'docs/v030-rnd/R25_R24_WORKER_POLICY_PROPAGATION_V2_PREREG.md'
      - 'benchmarks/v030_r24_worker_policy_propagation_v2.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v030-r24-worker-policy-propagation-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/v030-rnd/R25_R24_WORKER_POLICY_PROPAGATION_V2_PREREG.md'
      - 'benchmarks/v030_r24_worker_policy_propagation_v2.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v030-r24-worker-policy-propagation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r24-worker-policy-v2-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Bind exact head and classify only its changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(docs/v030-rnd/R25_R24_WORKER_POLICY_PROPAGATION_V2_PREREG\.md|benchmarks/v030_r24_worker_policy_propagation_v2\.py|experiments/entropygraph_v030_release_product(_base)?\.py|src/cmpct/builder\.py|\.github/workflows/v030-r24-worker-policy-propagation-v2\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  worker-policy-v2:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: cmpct-v030-r24-worker-policy-v2-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - id: candidate
        name: Bind exact candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; test "$actual" = "$EVIDENCE_HEAD"; echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile frozen causal A/B
        run: python -m py_compile benchmarks/v030_r24_worker_policy_propagation_v2.py
      - name: Run exact r24 worker-policy propagation causal A/B
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_worker_policy_propagation_v2 \
            --work-root "$RUNNER_TEMP/v030-r24-worker-policy-propagation-v2" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-worker-policy-propagation-v2.json"
      - name: Ratchet frozen identity and terminal decision
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('benchmark-artifacts/v030-r24-worker-policy-propagation-v2.json').read_text())
          assert e['schema']=='cmpct-v030-r24-worker-policy-propagation-v2'
          assert e['source_commit']==os.environ['EVIDENCE_HEAD']
          assert e['target']==['resemblance_hostile_v1','01_shifted_versions']
          assert e['release_credit'] is False and e['production_change'] is False
          i=e['identity']; d=e['summary']['decision']
          assert i['all_strong_verified'] is True and i['single_logical_tree'] is True
          assert i['repeatable_per_mode'] is True and i['propagated_parallel'] is True
          assert d in {'THREAD_LOCAL_POLICY_LEAK_CAUSAL','NO_WORKER_POLICY_DRIFT','UNRESOLVED_POLICY_DRIFT'}
          if d=='THREAD_LOCAL_POLICY_LEAK_CAUSAL':
              assert i['single_propagated_exact'] is True
              assert i['inherited_differs'] is True
              assert i['predicted_dictionary_flip'] is True
              assert min(i['worker_counts']['propagated']) > 1
          elif d=='NO_WORKER_POLICY_DRIFT':
              assert i['inherited_differs'] is False
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-worker-policy-propagation-v2.yml
      - name: Record exact candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-r24-worker-policy-propagation-v2-candidate.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r24-worker-policy-propagation-v2-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-r24-worker-policy-propagation-v2.json
            benchmark-artifacts/v030-r24-worker-policy-propagation-v2-candidate.txt
          if-no-files-found: warn
          retention-days: 90
