# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 federated selective effort frontier

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_federated_selective_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v2.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v3.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v4.py'
      - 'experiments/entropygraph_v030_federated_candidate.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-federated-selective-effort.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_federated_selective_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v2.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v3.py'
      - 'benchmarks/v030_federated_selective_effort_oracle_v4.py'
      - 'experiments/entropygraph_v030_federated_candidate.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-federated-selective-effort.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-federated-selective-effort-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/(v030_federated_selective_effort_oracle(_v[234])?\.py|neutral_hostile_corpus_v1\.py|neutral_hostile_determinism_repair_v[^/]*\.py)|experiments/entropygraph_(v030_federated_candidate|v025|v030_product_fs)\.py|\.github/workflows/v030-federated-selective-effort\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  selective-effort:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus and comparator dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile schema-correct extended selective-effort oracle
        run: |
          python -m py_compile \
            benchmarks/v030_federated_selective_effort_oracle.py \
            benchmarks/v030_federated_selective_effort_oracle_v2.py \
            benchmarks/v030_federated_selective_effort_oracle_v3.py \
            benchmarks/v030_federated_selective_effort_oracle_v4.py \
            experiments/entropygraph_v030_federated_candidate.py \
            experiments/entropygraph_v025.py
      - name: Measure per-pack compression-effort frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_selective_effort_oracle_v4.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg01-selective-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg01-selective.json"
      - name: Independently enforce evidence integrity
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()==os.environ['EVIDENCE_HEAD']
          d=json.loads(Path('benchmark-artifacts/v030-eg01-selective.json').read_text())
          assert d['schema']=='cmpct-v030-federated-selective-effort-v4'
          assert d['targets']==['02_office_workspace','04_analytics_and_database']
          assert d['levels']==[1,3,6,9,12,15,19,20,21,22]
          assert d['baseline_rounds']==3
          assert len(d['rows'])==2
          assert d['measurement_gate']['passed'] is True
          adapter=d['accepted_v029_schema_adapter']
          assert adapter['source_field']=='accepted_v029_bytes'
          assert adapter['compatibility_alias']=='archive_bytes'
          assert adapter['values_unchanged'] is True
          assert adapter['workloads']==15
          assert adapter['accepted_v029_aggregate_bytes']==137499525
          assert adapter['authoritative_loader_restored'] is True
          for row in d['rows']:
              assert row['accepted_v029_bytes'] > 0
              assert row['baseline_level1']['archive_bytes'] > row['accepted_v029_bytes']
              assert row['baseline_level1']['physical_pack_count'] > 0
              ub=row['compression_effort_upper_bound']
              assert ub['maximum_possible_saving_bytes'] >= 0
              assert ub['all_best_archive_floor_bytes'] == row['baseline_level1']['archive_bytes']-ub['maximum_possible_saving_bytes']
              assert len(row['comparators']['zip']['raw_create_s'])==3
              assert len(row['comparators']['zstd19']['raw_create_s'])==3
              measured=row['measured_zip_budget_policy']
              assert len(measured['raw_verified_create_s'])==3
              assert measured['locality']['max_member_read_amplification'] <= 8.0
              assert measured['locality']['max_decode_unit_bytes'] <= 8*1024*1024
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-federated-selective-effort.yml
      - name: Upload selective-effort evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-federated-selective-effort-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-eg01-selective.json
          if-no-files-found: warn
          retention-days: 90

# R4 measurement lane. Exact-SHA concurrency lets a valid multi-hour receipt finish even
# while unrelated branch heads move; newer heads classify cheaply rather than destroying it.
