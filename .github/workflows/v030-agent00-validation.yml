name: CMPCT v0.30 Agent-00 candidate validator
# ci-lane: deep

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: cmpct-v030-agent00-validation
  cancel-in-progress: true

jobs:
  validate-and-repair:
    if: github.event.pull_request.number == 56
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Apply bounded native hygiene patch
        run: python tools/v030_agent00_native_hygiene_patch.py
      - name: Prove repaired portable crate
        working-directory: native/cmpct-portable
        run: |
          cargo fmt --all
          cargo clippy --all-targets --message-format=short -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Persist verified source and remove executor
        shell: bash
        run: |
          rm tools/v030_agent00_native_hygiene_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/cmpct-portable/src/lib.rs native/cmpct-portable/src/format.rs native/cmpct-portable/src/canonical.rs native/cmpct-portable/src/g04.rs native/cmpct-portable/src/prefix.rs tools/v030_agent00_native_hygiene_patch.py
          git commit -m 'fix(v0.30): harden portable Rust API and lint contracts'
          git push origin HEAD:agent/v030-authoritative-integration

# Footnote: this is the already-established Agent-00 diagnostic lane, temporarily narrowed to one exact repair.
# It operates only on the sole authoritative integration branch and cannot persist a source change unless rustfmt,
# Clippy with warnings denied, all Rust target tests, and the release build all succeed. The patch executor deletes
# itself before commit so neither maintenance code nor this temporary main-side lane enters the release fingerprint.
