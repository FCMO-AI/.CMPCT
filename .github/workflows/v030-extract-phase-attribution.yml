# ci-lane: research-oracle
name: CMPCT v0.30 extraction phase attribution

on:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - 'experiments/v030_extract_phase_attribution.py'
      - '.github/workflows/v030-extract-phase-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  extract-phase-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: cmpct-v030-extract-phase-attribution-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Bind exact experiment head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus and codec dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile experiments/v030_extract_phase_attribution.py
      - name: Run extraction phase attribution
        run: |
          mkdir -p benchmark-artifacts
          python experiments/v030_extract_phase_attribution.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/extract-phase-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/extract-phase-attribution.json"
      - name: Validate evidence contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/extract-phase-attribution.json')
          assert p.is_file(), 'oracle did not publish evidence'
          d=json.loads(p.read_text())
          assert d['engine']=='v030-extract-phase-attribution-v1'
          assert d['evidence_class']=='research-oracle'
          assert d['product_release_credit'] is False
          if d.get('status') == 'PASS':
              assert d['contract']['fresh_process_per_extract_sample'] is True
              assert d['contract']['same_product_front_doors_as_runtime_gate'] is True
              assert d['contract']['same_treehash_inside_combined_boundary'] is True
              assert d['contract']['product_code_changed'] is False
              assert d['contract']['release_thresholds_changed'] is False
              assert len(d['rows']) == 2
              assert all(len(row['samples']['v029']) == 3 for row in d['rows'])
              assert all(len(row['samples']['v030']) == 3 for row in d['rows'])
          else:
              raise AssertionError(f"oracle status is {d.get('status')}: {d.get('error')}")
          PY
      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-extract-phase-attribution-${{ github.sha }}
          path: benchmark-artifacts/extract-phase-attribution.json
          if-no-files-found: error
          retention-days: 90
