# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted content-defined shared store

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/native/v030_cdc_boundaries.c'
      - 'benchmarks/v030_shifted_cdc_store_oracle.py'
      - '.github/workflows/v030-shifted-cdc-store-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/native/v030_cdc_boundaries.c'
      - 'benchmarks/v030_shifted_cdc_store_oracle.py'
      - '.github/workflows/v030-shifted-cdc-store-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shifted-cdc-store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/native/v030_cdc_boundaries\.c|benchmarks/v030_shifted_cdc_store_oracle\.py|\.github/workflows/v030-shifted-cdc-store-oracle\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  cdc-frontier:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile bounded native CDC helper and oracle
        run: |
          set -euo pipefail
          gcc -O3 -std=c11 -Wall -Wextra -Werror benchmarks/native/v030_cdc_boundaries.c -o "$RUNNER_TEMP/cmpct-v030-cdc-boundaries"
          python -m py_compile benchmarks/v030_shifted_cdc_store_oracle.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-cdc-store-oracle.yml
          python tools/check_public_surface.py
      - name: Run exact complete-artifact CDC frontier
        env:
          CMPCT_CDC_HELPER: ${{ runner.temp }}/cmpct-v030-cdc-boundaries
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_cdc_store_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-cdc-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-cdc.json"
      - name: Enforce research honesty and R4 decision boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-cdc.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-cdc.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-cdc-store-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['diagnosis']=='D4' and d['radicality']=='R4'
          assert 'S1' in d['saturation'] and d['rps']>=80
          c=d['contract']
          assert c['benchmark_identity_used_in_representation'] is False
          assert c['content_defined_chunk_ownership'] is True
          assert c['creation_prices_helper_execution_and_all_candidate_work'] is True
          assert c['max_decode_unit_bytes'] <= 8*1024*1024
          assert c['release_credit'] is False
          assert len(d['arms'])==3
          for a in d['arms']:
              assert a['tree_verified'] is True
              assert a['max_decode_unit_bytes'] <= 8*1024*1024
              assert a['max_member_read_amplification'] <= 8.0
              assert a['total_chunk_refs'] >= a['unique_chunks']
              assert len(a['artifact_sha256'])==64
          assert d['summary']['release_credit'] is False
          PY
      - name: Upload exact R4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-cdc-store-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-cdc.json
          if-no-files-found: error
          retention-days: 90

# Research-only R4 frontier. A strict win authorizes productization work only; it never changes release authority.
