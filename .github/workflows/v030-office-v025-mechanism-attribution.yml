name: CMPCT v0.30 Office v0.25 mechanism attribution

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_office_v025_mechanism_attribution.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v6.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-office-v025-mechanism-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  office-v025-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned corpus dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            msgpack pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 \
            openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libzstd1
      - name: Run exact Office mechanism attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_office_v025_mechanism_attribution.py | tee benchmark-artifacts/v030-office-v025-mechanism-attribution.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-office-v025-mechanism-attribution.json')
          data=json.loads(p.read_text())
          if data.get('schema') != 'cmpct-v030-office-v025-mechanism-attribution-v1':
              raise SystemExit('unexpected attribution schema')
          if data.get('decision') != 'ATTRIBUTION_COMPLETE_ABLATION_REQUIRED_FOR_CAUSAL_SAVINGS':
              raise SystemExit('attribution did not reach terminal decision')
          if not data.get('strong_verify',{}).get('ok'):
              raise SystemExit('exact verification did not pass')
          PY
      - name: Upload oracle result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-office-v025-mechanism-attribution-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-office-v025-mechanism-attribution.json
          if-no-files-found: error
