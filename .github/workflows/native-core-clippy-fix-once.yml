name: Fix native core clippy blocker once

on:
  push:
    branches:
      - native/read-only-index-core

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clippy fix and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('native/cmpct-core/src/lib.rs')
          s=p.read_text()
          old="raw.as_bytes().len() > MAX_PATH_BYTES"
          new="raw.len() > MAX_PATH_BYTES"
          if old not in s:
              raise SystemExit('expected clippy target not found')
          p.write_text(s.replace(old,new,1))
          PY
          cd native/cmpct-core
          cargo fmt
          cd ../..
          git rm .github/workflows/native-core-clippy-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/cmpct-core/src/lib.rs
          git commit -m 'Fix native core clippy blocker'
          git push origin HEAD:native/read-only-index-core
