# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24G76: held-out large-N scaling falsifier on exact J24G74 research algorithms.
name: CMPCT J24G76 owned large-N Reader court

on:
  push:
    branches:
      - agent/phased2-v031-j24g76-owned-replay-large-n-court-20261030
    paths:
      - 'research/j24g76_*'
      - 'docs/v031-research/*j24g76*'
      - '.github/workflows/v031-j24g76-owned-large-n.yml'
  pull_request:
    branches:
      - agent/phased2-v031-j24g74-owned-decoder-replay-court-20261030
    paths:
      - 'research/j24g76_*'
      - 'docs/v031-research/*j24g76*'
      - '.github/workflows/v031-j24g76-owned-large-n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g76-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-large-n:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G76_EVIDENCE_DIR: evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-head and immutable experiment base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor c15459f70001800f3781925efc7356409eb03ffe HEAD
          git merge-base --is-ancestor 0de1e97d7a6482c1dd08c643174385e78a5602f6 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git rev-parse HEAD:research/j24g74_owned_decoder_court.py)" = 9af74e26e7585f6d88b1d59ead86514f41b0e373
          test "$(git rev-parse HEAD:research/j24g64_mixed_fsmeta_oracle.py)" = 7657a41d11f2b3c8136c0b69cfe62401f9b19ccb
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-exact CMPCT candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22' 'psutil>=5.9'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g76_owned_large_n.py research/j24g76_detached_audit.py
      - name: Real large-N Builder Writer and Reader court
        shell: bash
        run: |
          set -o pipefail
          python research/j24g76_owned_large_n.py 2>&1 | tee evidence/j24g76-run.log
          test -s evidence/j24g76-result.json
      - name: No-CMPCT detached physical and receipt referee
        shell: bash
        run: |
          set -o pipefail
          python research/j24g76_detached_audit.py evidence/j24g76-result.json evidence 2>&1 | tee evidence/j24g76-audit.log
          test -s evidence/j24g76-detached-audit.json
      - name: Preserve artifacts regardless of experiment outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g76-large-n-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
