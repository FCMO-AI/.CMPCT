# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24G64 research-only mixed signed-metadata replay; no product source changes.
name: CMPCT J24G64 mixed sparse-fsmeta replay oracle

on:
  push:
    branches:
      - agent/phased1-v031-j24g64-mixed-fsmeta-crossgen-oracle-20261030
    paths:
      - 'research/j24g64_mixed_fsmeta_oracle.py'
      - 'research/j24g64_detached_receipt_audit.py'
      - 'docs/v031-research/*j24g64*'
      - '.github/workflows/v031-j24g64-mixed-fsmeta-oracle.yml'
  pull_request:
    branches:
      - agent/phased1-v031-j24g62-crossgen-rename-replay-oracle-20261030
    paths:
      - 'research/j24g64_mixed_fsmeta_oracle.py'
      - 'docs/v031-research/*j24g64*'
      - '.github/workflows/v031-j24g64-mixed-fsmeta-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-sparse-metadata:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G64_RESULT: evidence/j24g64-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact source parent and preregistration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 9dc765a902c0f5c424639caf9cdfd571cca2d6e6 HEAD
          git merge-base --is-ancestor 624eec80b90ec25bf22501f66b92b7a32e6b928b HEAD
          test "$(git rev-parse HEAD:src/cmpct/journal_replay.py)" = 03743ca2a06c022c2ec64243a90fe373cf91e899
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact package and compile research oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g64_mixed_fsmeta_oracle.py research/j24g64_detached_receipt_audit.py
      - name: Compare source-exact mixed and metadata replay
        shell: bash
        run: |
          set -o pipefail
          python research/j24g64_mixed_fsmeta_oracle.py 2>&1 | tee evidence/j24g64.log
          test -s evidence/j24g64-result.json
      - name: Audit raw receipts and reject hostile manipulations
        shell: bash
        run: |
          set -o pipefail
          python research/j24g64_detached_receipt_audit.py evidence/j24g64-result.json "$EXPECTED_HEAD" evidence/j24g64-detached-review.json 2>&1 | tee evidence/j24g64-detached.log
          test -s evidence/j24g64-detached-review.json
      - name: Preserve provider outcome on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g64-mixed-fsmeta-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
