# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted discovery audition survival v1

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_g04_discovery_audition_survival_v1.py'
      - 'docs/v030-rnd/R25_SHIFTED_G04_DISCOVERY_AUDITION_SURVIVAL_V1_PREREG.md'
      - '.github/workflows/v030-shifted-g04-discovery-audition-survival-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-shifted-g04-discovery-survival-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_shifted_g04_discovery_audition_survival_v1\.py|docs/v030-rnd/R25_SHIFTED_G04_DISCOVERY_AUDITION_SURVIVAL_V1_PREREG\.md|\.github/workflows/v030-shifted-g04-discovery-audition-survival-v1\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  survival-ab:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact scientific head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen instrument
        run: python -m py_compile benchmarks/v030_shifted_g04_discovery_audition_survival_v1.py
      - name: Run three-repetition inherited-candidate survival A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_g04_discovery_audition_survival_v1.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-g04-discovery-survival-v1-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-g04-discovery-survival-v1.json"
      - name: Enforce frozen decision grammar and exact binding
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-g04-discovery-survival-v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-g04-discovery-survival-v1.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-g04-discovery-audition-survival-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['repetitions']==3
          assert d['contract']['single_ablation']=='accepted.BASE.P._position_independent_candidates -> []'
          assert d['contract']['instrumentation_only'] is True
          assert d['contract']['product_changed'] is False
          assert d['release_credit'] is False
          allowed={'SHIFTED_DISCOVERY_AUDITIONS_BYTE_DEAD','SHIFTED_DISCOVERY_AUDITIONS_SIZE_CONTRIBUTING','SHIFTED_DISCOVERY_AUDITIONS_ALTERNATE_SMALLER','INVALID'}
          assert d['decision'] in allowed
          if d['decision']!='INVALID': assert not d['invalid_reasons']
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-shifted-g04-discovery-audition-survival-v1.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-g04-discovery-survival-v1-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-g04-discovery-survival-v1.json
          if-no-files-found: error
          retention-days: 90

# R0 causal A/B only. The inherited-only arm ablates one candidate source and receives zero release credit.
