# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 PrefixGraph fresh-CCtx-per-member RSS A/B

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'docs/v030-rnd/R25_PREFIXGRAPH_FRESH_CCTX_PER_MEMBER_RSS_AB_PREREG.md'
      - 'benchmarks/v030_prefixgraph_fresh_cctx_per_member_rss_ab.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - '.github/workflows/v030-prefixgraph-fresh-cctx-per-member-rss-ab.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/v030-rnd/R25_PREFIXGRAPH_FRESH_CCTX_PER_MEMBER_RSS_AB_PREREG.md'
      - 'benchmarks/v030_prefixgraph_fresh_cctx_per_member_rss_ab.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - '.github/workflows/v030-prefixgraph-fresh-cctx-per-member-rss-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-prefixgraph-fresh-cctx-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(docs/v030-rnd/R25_PREFIXGRAPH_FRESH_CCTX_PER_MEMBER_RSS_AB_PREREG\.md|benchmarks/v030_prefixgraph_fresh_cctx_per_member_rss_ab\.py|benchmarks/v030_release_performance\.py|experiments/entropygraph_v030_profile_isolation\.py|experiments/entropygraph_v030_prefixgraph\.py|\.github/workflows/v030-prefixgraph-fresh-cctx-per-member-rss-ab\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  fresh-cctx-ab:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: cmpct-v030-prefixgraph-fresh-cctx-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile frozen A/B
        run: python -m py_compile benchmarks/v030_prefixgraph_fresh_cctx_per_member_rss_ab.py
      - name: Run exact-owner persistent-vs-fresh CCtx A/B
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_prefixgraph_fresh_cctx_per_member_rss_ab \
            --work-root "$RUNNER_TEMP/v030-prefixgraph-fresh-cctx-rss-ab" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-prefixgraph-fresh-cctx-rss-ab.json"
      - name: Ratchet frozen identity and decision bands
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('benchmark-artifacts/v030-prefixgraph-fresh-cctx-rss-ab.json').read_text())
          assert e['schema']=='cmpct-v030-prefixgraph-fresh-cctx-per-member-rss-ab-v1'
          assert e['source_commit']==os.environ['EVIDENCE_HEAD']
          assert e['target']==['resemblance_hostile_v1','01_shifted_versions']
          assert e['release_credit'] is False and e['gate']['experiment_valid'] is True
          assert e['identity']['full_candidate_set_byte_identical'] is True
          assert e['identity']['build_identity'] is True
          c=e['contract']; s=e['summary']
          assert c['support_threshold']==0.20 and c['retire_threshold']==0.10
          assert c['max_supported_wall_ratio']==1.25
          assert c['compressor_level_changed'] is False and c['dictionary_bytes_changed'] is False
          assert c['candidate_set_changed'] is False and c['production_change'] is False and c['release_credit'] is False
          r=float(s['rss_reduction']); w=float(s['wall_ratio']); d=s['decision']
          if r >= 0.20 and w <= 1.25:
              assert d=='FRESH_CCTX_LIFETIME_REHAB_SUPPORTED'
          elif r < 0.10:
              assert d=='FRESH_CCTX_LIFETIME_RETIRED_AS_PRIMARY_OWNER'
          else:
              assert d=='FRESH_CCTX_LIFETIME_AMBIGUOUS'
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-prefixgraph-fresh-cctx-per-member-rss-ab.yml
      - name: Record exact candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-prefixgraph-fresh-cctx-rss-ab-candidate.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-prefixgraph-fresh-cctx-rss-ab-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-prefixgraph-fresh-cctx-rss-ab.json
            benchmark-artifacts/v030-prefixgraph-fresh-cctx-rss-ab-candidate.txt
          if-no-files-found: warn
          retention-days: 90
