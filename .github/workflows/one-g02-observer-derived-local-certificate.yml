# ci-lane: deep
name: ONE-G0.2 observer-derived local certificate

on:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/native/one_g02_observer_derived_local_certificate.c'
      - 'benchmarks/one/one_g02_observer_derived_local_certificate.py'
      - 'benchmarks/one/one_g02_gear_replacement_ab.py'
      - 'docs/one/prereg/ONE_G02_OBSERVER_DERIVED_LOCAL_CERTIFICATE_PREREG_2026-09-07.md'
      - '.github/workflows/one-g02-observer-derived-local-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-g02-observer-derived-cert-${{ github.sha }}
  cancel-in-progress: true

jobs:
  observer-derived-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Strict native compile smoke
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            benchmarks/one/native/one_g02_observer_derived_local_certificate.c \
            -o /tmp/one-g02-observer-derived-cert.so
      - name: Frozen observer-derived certificate falsifier
        id: falsifier
        shell: bash
        run: |
          set +e
          python -m benchmarks.one.one_g02_observer_derived_local_certificate \
            | tee one-g02-observer-derived-local-certificate.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > one-g02-observer-derived-local-certificate.rc
          exit 0
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-observer-derived-local-certificate-${{ github.sha }}
          path: |
            one-g02-observer-derived-local-certificate.json
            one-g02-observer-derived-local-certificate.rc
          if-no-files-found: error
      - name: Enforce preregistered decision
        shell: bash
        run: |
          rc=$(cat one-g02-observer-derived-local-certificate.rc)
          if [ "$rc" -ne 0 ]; then
            echo 'Preregistered observer-derived certificate gate rejected the present shape.' >&2
            exit "$rc"
          fi
