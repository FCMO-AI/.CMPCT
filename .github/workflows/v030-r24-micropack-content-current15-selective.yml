name: CMPCT v0.30 content current15 selective

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_micropack_content_current15_selective_read.py
      - benchmarks/v030_r24_micropack_content_selective_read_referee.py
      - benchmarks/v030_r24_micropack_content_economic_admission.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-micropack-content-current15-selective.yml

permissions:
  contents: read

jobs:
  current15-selective:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_r24_micropack_content_current15_selective_read.py
      - name: Execute current15 selective transfer
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_micropack_content_current15_selective_read \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-current15-selective-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-current15-selective.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-content-current15-selective.json').read_text())
          assert d['schema']=='cmpct-v030-r24-content-current15-selective-v1'
          assert d['release_credit'] is False
          assert d['canonical_builder_changed'] is False
          assert d['genesis_rescore'] is False
          assert d['path_signal_used'] is False
          assert len(d['identities'])==15
          assert d['completed_workloads']+len(d['execution_errors'])==15
          assert d['verdict'] in {
              'CONTENT_CURRENT15_SELECTIVE_SURVIVES',
              'CONTENT_CURRENT15_SELECTIVE_REHABILITATION_REQUIRED',
              'RETIRE_CONTENT_CURRENT15_SELECTIVE',
              'CONTENT_CURRENT15_SELECTIVE_EXECUTION_BLOCKED',
          }
          short={
              'CONTENT_CURRENT15_SELECTIVE_SURVIVES':'survive',
              'CONTENT_CURRENT15_SELECTIVE_REHABILITATION_REQUIRED':'rehab',
              'RETIRE_CONTENT_CURRENT15_SELECTIVE':'retire',
              'CONTENT_CURRENT15_SELECTIVE_EXECUTION_BLOCKED':'blocked',
          }[d['verdict']]
          def slug(s): return re.sub(r'[^A-Za-z0-9_-]+','-',s.replace('/','_'))[:46]
          maxk=d['max_decode_workload'] or 'none'
          debt=[]
          for key in d['timing_debt'][:2]:
              row=d['rows'][key]
              debt.append({
                  'key': key,
                  'ind_ms': row['timings']['independent']['median_read_wall_ms_per_probe'],
                  'content_ms': row['timings']['content_economic']['median_read_wall_ms_per_probe'],
                  'max_decode': row['variants']['content_economic']['max_decode_unit_bytes'],
                  'content_bytes': row['variants']['content_economic']['final_membership_bytes'],
                  'ind_bytes': row['variants']['independent']['final_membership_bytes'],
              })
          while len(debt)<2: debt.append({'key':'none','ind_ms':0,'content_ms':0,'max_decode':0,'content_bytes':0,'ind_bytes':0})
          outs={
              'short':short,
              'done':str(d['completed_workloads']),
              'grouped':str(len(d['grouped_workloads'])),
              'debt':str(len(d['timing_debt'])),
              'inv':str(len(d['invariant_failures'])),
              'maxdecode':str(d['max_decode_unit_bytes']),
              'maxwork':slug(maxk),
              'fp':d['corpus_fingerprint'][:12],
          }
          for idx, item in enumerate(debt,1):
              outs[f'd{idx}w']=slug(item['key'])
              outs[f'd{idx}i']=f"{item['ind_ms']:.3f}"
              outs[f'd{idx}c']=f"{item['content_ms']:.3f}"
              outs[f'd{idx}d']=str(item['max_decode'])
              outs[f'd{idx}s']=str(item['content_bytes']-item['ind_bytes'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              for k,v in outs.items(): fh.write(f'{k}={v}\n')
          print(json.dumps({'verdict':d['verdict'],'grouped':d['grouped_workloads'],'timing_debt':d['timing_debt'],'debt_detail':debt,'max_decode_workload':d['max_decode_workload'],'max_decode_unit_bytes':d['max_decode_unit_bytes']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-sel15-${{ steps.receipt.outputs.short || 'nosummary' }}-g${{ steps.receipt.outputs.grouped }}-debt${{ steps.receipt.outputs.debt }}-d1-${{ steps.receipt.outputs.d1w }}-${{ steps.receipt.outputs.d1i }}-${{ steps.receipt.outputs.d1c }}-u${{ steps.receipt.outputs.d1d }}-s${{ steps.receipt.outputs.d1s }}-d2-${{ steps.receipt.outputs.d2w }}-${{ steps.receipt.outputs.d2i }}-${{ steps.receipt.outputs.d2c }}-u${{ steps.receipt.outputs.d2d }}-s${{ steps.receipt.outputs.d2s }}-max${{ steps.receipt.outputs.maxdecode }}-${{ steps.receipt.outputs.maxwork }}-${{ github.sha }}
          path: benchmark-artifacts/v030-content-current15-selective.json
          if-no-files-found: error
          retention-days: 90

# Research-only. This current fingerprint transfer never rewrites Genesis.
