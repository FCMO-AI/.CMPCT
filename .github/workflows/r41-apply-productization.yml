name: R41 apply staged Builder productization

on:
  push:
    branches:
      - agent/v030-r41-builder-dynamic-pull
    paths:
      - .github/workflows/r41-apply-productization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v030-r41-builder-dynamic-pull
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply the already-reviewed staged patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check experiments/r41_builder_productization.patch
          git apply experiments/r41_builder_productization.patch
          git diff --check
      - name: Validate Builder integration before publication
        run: |
          python -m pytest -q tests/test_ordered_pull.py
          python -m compileall -q src/cmpct
      - name: Publish only the validated productization and self-remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r41-apply-productization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cmpct/builder.py
          git commit -m 'perf(builder): productize bounded ordered worker-pull'
          git push origin HEAD:agent/v030-r41-builder-dynamic-pull
