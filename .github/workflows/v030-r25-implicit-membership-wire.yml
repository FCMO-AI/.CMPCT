# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 r25 implicit-membership wire referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r25_implicit_membership_wire_referee.py'
      - 'docs/V030_R25_IMPLICIT_MEMBERSHIP_MISSION_2026-09-12.md'
      - '.github/workflows/v030-r25-implicit-membership-wire.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r25_implicit_membership_wire_referee.py'
      - 'docs/V030_R25_IMPLICIT_MEMBERSHIP_MISSION_2026-09-12.md'
      - '.github/workflows/v030-r25-implicit-membership-wire.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-r25-membership-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r25_implicit_membership_wire_referee\.py|docs/V030_R25_IMPLICIT_MEMBERSHIP_MISSION_2026-09-12\.md|\.github/workflows/v030-r25-implicit-membership-wire\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  implicit-membership-wire:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r25_implicit_membership_wire_referee.py
      - name: Execute bounded membership wire referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_implicit_membership_wire_referee.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r25-implicit-membership-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r25-implicit-membership.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r25-implicit-membership.json').read_text())
          assert d['schema']=='cmpct-v030-r25-implicit-membership-wire-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert set(d['workloads'])=={'01_developer_repository','08_many_tiny_files'}
          assert d['contract']['direct_lookup_built_during_authenticated_control_decode'] is True
          assert d['contract']['canonical_format_changed'] is False
          assert d['gate']['semantic_reconstruction_exact'] is True
          assert d['gate']['payload_packs_unchanged'] is True
          assert d['verdict'] in {'R25_IMPLICIT_MEMBERSHIP_WIRE_EARNED','RETIRE_R25_IMPLICIT_MEMBERSHIP_WIRE'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r25-implicit-membership-wire.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r25-implicit-membership-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-implicit-membership.json
          if-no-files-found: error
          retention-days: 90

# Research-only wire referee. Green means receipt integrity, not a positive hypothesis.
