name: CMPCT v0.30 exact pathdict portfolio referee

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_pathblind_dictionary_portfolio_referee.py
      - benchmarks/v030_r24_pathblind_dictionary_referee.py
      - benchmarks/v030_r24_micropack_content_selective_read_referee.py
      - benchmarks/v030_r24_micropack_content_economic_admission.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-pathdict-portfolio.yml

permissions:
  contents: read

jobs:
  pathdict-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_r24_pathblind_dictionary_portfolio_referee.py
      - name: Execute exact portfolio referee
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_pathblind_dictionary_portfolio_referee \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-portfolio-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-portfolio.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-pathdict-portfolio.json').read_text())
          assert d['schema']=='cmpct-v030-r24-pathdict-portfolio-v1'
          assert d['release_credit'] is False and d['canonical_builder_changed'] is False
          assert d['genesis_rescore'] is False and d['path_signal_used'] is False
          assert d['verdict'] in {'RETIRE_PATHDICT_PORTFOLIO','PATHDICT_PORTFOLIO_EARNS_SHARED_BUILD_REHAB','PATHDICT_PORTFOLIO_EARNS_CURRENT15_TRANSFER'}
          short={'RETIRE_PATHDICT_PORTFOLIO':'retire','PATHDICT_PORTFOLIO_EARNS_SHARED_BUILD_REHAB':'rehab','PATHDICT_PORTFOLIO_EARNS_CURRENT15_TRANSFER':'earn'}[d['verdict']]
          a=d['aggregate']
          outs={'short':short,'win':str(len(d['strict_wins_vs_independent'])),'loss':str(len(d['byte_losses_vs_independent'])),'read':str(len(d['read_debts'])),'cpu':str(len(d['creation_cpu_debts'])),'wall':str(len(d['creation_wall_debts'])),'delta':str(a['selected_delta_vs_independent_bytes']),'regret':str(a['selected_regret_vs_content_bytes']),'fp':d['corpus_fingerprint'][:10]}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              for k,v in outs.items():fh.write(f'{k}={v}\n')
          print(json.dumps({'verdict':d['verdict'],'aggregate':a,'wins':d['strict_wins_vs_independent'],'losses':d['byte_losses_vs_independent'],'read_debts':d['read_debts'],'cpu_debts':d['creation_cpu_debts'],'wall_debts':d['creation_wall_debts'],'rows':{k:{'selected':v['selected'],'di':v['selected_delta_vs_independent_bytes'],'dc':v['selected_delta_vs_content_bytes'],'dict_di':v['dictionary_delta_vs_independent_bytes'],'ind_cpu':v['build_timings']['independent']['cpu_s'],'portfolio_cpu':v['build_timings']['sequential_portfolio']['cpu_s'],'ind_wall':v['build_timings']['independent']['wall_s'],'portfolio_wall':v['build_timings']['sequential_portfolio']['wall_s']} for k,v in d['rows'].items()}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-pathdict-portfolio-${{ steps.receipt.outputs.short || 'nosummary' }}-win${{ steps.receipt.outputs.win }}-loss${{ steps.receipt.outputs.loss }}-read${{ steps.receipt.outputs.read }}-cpu${{ steps.receipt.outputs.cpu }}-wall${{ steps.receipt.outputs.wall }}-d${{ steps.receipt.outputs.delta }}-r${{ steps.receipt.outputs.regret }}-fp${{ steps.receipt.outputs.fp }}-${{ github.sha }}
          path: benchmark-artifacts/v030-pathdict-portfolio.json
          if-no-files-found: error
          retention-days: 90

# Research-only; exact fallback cannot rewrite frozen Genesis or canonical release state.
