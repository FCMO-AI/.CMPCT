# ci-lane: research
# ci-cancel-policy: latest-head
# ci-pr-scope: latest-head-commit-gate
# discriminator: separate Python buffer allocation/copy cost from package-owned Zstd call cost
name: CMPCT Zstd writer-overhead oracle

on:
  pull_request:
    paths:
      - ".github/workflows/zstd-residual-byte-oracle.yml"
      - "src/cmpct/native_codec.py"
      - "native/cmpct-core/src/codec_abi.rs"
      - "native/cmpct-core/Cargo.toml"
      - "native/cmpct-core/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zstd-writer-overhead-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build package-owned core
        run: |
          python -m pip install msgpack
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
          cp native/cmpct-core/target/release/libcmpct_core.so src/cmpct/cmpct_core.so
      - name: Charge writer boundary overhead
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/writer-overhead-oracle.txt
          import ctypes, ctypes.util, hashlib, os, statistics, time
          from cmpct import native_codec as nc

          system = ctypes.CDLL(ctypes.util.find_library("zstd") or "libzstd.so.1")
          sz = ctypes.c_size_t
          system.ZSTD_versionString.restype = ctypes.c_char_p
          system.ZSTD_compressBound.argtypes=[sz]; system.ZSTD_compressBound.restype=sz
          system.ZSTD_compress.argtypes=[ctypes.c_void_p,sz,ctypes.c_void_p,sz,ctypes.c_int]; system.ZSTD_compress.restype=sz
          system.ZSTD_isError.argtypes=[sz]; system.ZSTD_isError.restype=ctypes.c_uint
          version=system.ZSTD_versionString().decode()
          print("inherited_zstd_version",version,flush=True)
          assert version=="1.5.5", version

          def inherited(data, level):
              src=ctypes.create_string_buffer(data); cap=int(system.ZSTD_compressBound(len(data))); dst=ctypes.create_string_buffer(cap)
              n=int(system.ZSTD_compress(dst,cap,src,len(data),level)); assert not system.ZSTD_isError(n)
              return dst.raw[:n]

          # This arm keeps source/destination buffers alive across calls. It therefore removes Python
          # allocation/copy cost while preserving the exact Python->Rust ABI and bundled Zstd primitive.
          def owned_preallocated(data, level):
              src=ctypes.create_string_buffer(data); cap=int(nc._core.cmpct_codec_zstd_compress_bound(len(data))); dst=ctypes.create_string_buffer(cap); out=sz()
              def call():
                  out.value=0
                  status=int(nc._core.cmpct_codec_zstd_compress(src,len(data),level,dst,cap,ctypes.byref(out)))
                  assert status==0
                  return dst.raw[:out.value]
              return call

          payloads={
              "tiny-1k": (b"abc123\n"*147)[:1024],
              "source-16k": (b"def f(x): return (x * 2654435761) & 0xffffffff\n"*400)[:16384],
              "mixed-256k": (b"CMPCT-zstd-boundary\0"*8192 + bytes(range(256))*512)[:262144],
              "binary-1m": hashlib.shake_256(b"cmpct-writer-overhead-v1").digest(1048576),
          }
          levels={"tiny-1k":9,"source-16k":9,"mixed-256k":12,"binary-1m":9}

          for name,data in payloads.items():
              level=levels[name]
              ref=inherited(data,level); owned=nc.compress(data,level); pre=owned_preallocated(data,level)
              assert owned==ref==pre, (name,len(ref),len(owned),len(pre))
              loops=max(8,min(2000,8_000_000//len(data)))
              pre_call=owned_preallocated(data,level)
              arms={"inherited":lambda: inherited(data,level),"owned_python":lambda: nc.compress(data,level),"owned_prealloc":pre_call}
              for fn in arms.values():
                  for _ in range(3): fn()
              samples={k:[] for k in arms}
              # Interleave arm order across rounds so runner drift cannot systematically favor one owner.
              orders=[("inherited","owned_python","owned_prealloc"),("owned_prealloc","owned_python","inherited"),("owned_python","inherited","owned_prealloc")]
              for r in range(9):
                  for key in orders[r%len(orders)]:
                      fn=arms[key]; t0=time.perf_counter_ns()
                      for _ in range(loops): fn()
                      samples[key].append((time.perf_counter_ns()-t0)/loops)
              med={k:statistics.median(v) for k,v in samples.items()}
              print(name,"bytes",len(data),"compressed",len(ref),"loops",loops,
                    "inherited_ns",round(med["inherited"]),"owned_python_ns",round(med["owned_python"]),
                    "owned_prealloc_ns",round(med["owned_prealloc"]),
                    "owned_vs_inherited",round(med["owned_python"]/med["inherited"],4),
                    "prealloc_vs_inherited",round(med["owned_prealloc"]/med["inherited"],4),
                    "python_alloc_fraction",round(max(0.0,1-med["owned_prealloc"]/med["owned_python"]),4),flush=True)
          PY
      - name: Upload writer-overhead diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zstd-writer-overhead-oracle-${{ github.sha }}
          path: /tmp/writer-overhead-oracle.txt
          if-no-files-found: error
