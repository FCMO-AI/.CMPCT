# ci-lane: deep
name: CMPCT v0.30 r24 binary dictionary isolation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cmpct/builder.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - 'benchmarks/v030_r24_binary_dictionary_isolation_oracle.py'
      - 'benchmarks/v030_r24_medium_binary_pack_generalization.py'
      - 'benchmarks/v030_r24_compact_control_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - '.github/workflows/v030-r24-binary-dictionary-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-binary-dict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  binary-dictionary-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus/compressor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile evidence path
        run: |
          python -m py_compile benchmarks/v030_r24_binary_dictionary_isolation_oracle.py
          python -m py_compile benchmarks/v030_r24_medium_binary_pack_generalization.py
          python -m py_compile experiments/entropygraph_v030_release_product_base.py
      - name: Run exact target and all-15 A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_binary_dictionary_isolation_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-binary-dict-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-binary-dict.json"
      - name: Enforce evidence validity and promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-binary-dict.json').read_text())
          assert d['schema']=='cmpct-v030-r24-binary-dictionary-isolation-v1'
          assert d['contract']['format_revision']==24
          assert d['contract']['archive_grammar_changed'] is False
          assert d['contract']['micro_pack_binary_admission_changed'] is False
          assert d['contract']['strong_verification_required'] is True
          t=d['target']
          assert t['rounds']==5
          assert t['same_verified_tree'] is True
          assert t['shipping']['archive_bytes'] >= t['candidate']['archive_bytes']
          assert t['saving_bytes']==t['shipping']['archive_bytes']-t['candidate']['archive_bytes']
          a=d['all15']
          assert len(a['rows'])==15
          assert a['gate']['exact_workload_count'] is True
          assert a['gate']['all_source_and_candidate_trees_match'] is True
          # A regression is valid negative evidence, not permission to promote.  CI remains useful for
          # measuring the hypothesis while the explicit promotion_candidate fact stays fail-closed.
          if a['gate']['promotion_candidate']:
              assert a['gate']['zero_byte_regressions'] is True
              assert a['gate']['at_least_one_strict_improvement'] is True
              assert a['candidate_total_bytes'] < a['shipping_total_bytes']
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-binary-dict-${{ github.sha }}
          path: benchmark-artifacts/v030-r24-binary-dict.json
          if-no-files-found: error
          retention-days: 90

# Research/promotion evidence only.  This lane cannot alter the shipping selector, accepted v0.29 bytes,
# ZIP/Zstd contract, locality/recovery law, native/Android requirements, or final release authority.
