# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.29 locality-bounded pair fusion

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v029_local_pair_fusion_oracle.py'
      - 'experiments/entropygraph_v029_residual_program_packing.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'tests/test_v029_local_pair_fusion_oracle.py'
      - 'native/preflate-bridge/**'
      - '.github/workflows/v029-local-pair-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-local-pair-fusion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - id: scope
        name: Classify only the newest exact HEAD commit
        shell: bash
        run: |
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              experiments/entropygraph_v029_local_pair_fusion_oracle.py|\
              experiments/entropygraph_v029_residual_program_packing.py|\
              benchmarks/resemblance_hostile_corpus_v1.py|\
              tests/test_v029_local_pair_fusion_oracle.py|\
              native/preflate-bridge/*|\
              .github/workflows/v029-local-pair-fusion.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "latest exact-head pair-fusion substrate change: $relevant"

  pair-fusion-oracle:
    needs: latest-head-scope
    if: github.event_name == 'workflow_dispatch' || needs.latest-head-scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_pair_fusion_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Measure locality-bounded pair fusion
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_local_pair_fusion_oracle.py \
            benchmark-artifacts/resemblance-hostile \
            --work-root benchmark-artifacts/CMPCT_V029_Local_Pair_Fusion \
            --output benchmark-artifacts/mosaic-v029-local-pair-fusion.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-local-pair-fusion.stdout.txt

      - name: Enforce frozen pair-fusion contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-local-pair-fusion.json').read_text())
          assert r['schema'] == 'cmpct-v029-local-pair-fusion-oracle-v1'
          p=r['policy']; b=r['best']
          assert p['lookahead_records'] == 8
          assert p['max_fused_raw_bytes'] == 2 << 20
          assert p['max_member_materialization_amplification'] == 8.0
          assert p['min_net_saving_bytes'] == 128 * 1024
          assert p['min_profitable_pairs'] == 4
          assert p['records_used_at_most_once'] is True
          assert p['roundtrip_verified_per_pair'] is True
          assert b['max_member_amplification'] <= 8.0
          print(json.dumps({'candidate_records': r['candidate_records'], 'best': b, 'research_gate_pass': r['research_gate_pass']}, indent=2))
          PY

      - name: Focused pair-fusion tests
        run: python -m pytest -q tests/test_v029_local_pair_fusion_oracle.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v029-local-pair-fusion.yml

      - name: Summarize pair-fusion ceiling
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-local-pair-fusion.json').read_text())
          b=r['best']
          print('## CMPCT v0.29 — locality-bounded pair fusion')
          print(f"- attempt-5 source archive: **{r['source_archive']['bytes']:,} B**")
          print(f"- eligible direct/root records: **{r['candidate_records']}**")
          print(f"- admissible nearby pairs: **{b['candidate_pairs']}**")
          print(f"- profitable candidate pairs: **{b['profitable_candidate_pairs']}**")
          print(f"- selected disjoint pairs: **{b['selected_disjoint_pairs']}**")
          print(f"- exact net saving: **{b['net_saving_bytes']:,} B**")
          print(f"- max selected member materialization: **{b['max_member_amplification']:.3f}x**")
          print(f"- frozen >=128 KiB / >=4-pair / <=8x gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          PY

      - name: Upload pair-fusion evidence
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v029-local-pair-fusion-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-local-pair-fusion.json
            benchmark-artifacts/mosaic-v029-local-pair-fusion.stdout.txt
          if-no-files-found: warn
          retention-days: 30

# Footnote: this historical/deep mechanism remains mandatory when its implementation/corpus changes. GitHub's
# PR paths are cumulative across the long-lived v0.30 integration diff, so a cheap exact-HEAD classifier now
# prevents unrelated release work from spending the 35-minute evidence runner while preserving the frozen gate.
