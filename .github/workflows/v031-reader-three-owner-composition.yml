# ci-lane: fast
name: CMPCT v031 three-owner Reader safety composition
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_hardlink_owner_order.py'
      - 'tests/test_v031_pack_sha_integrity.py'
      - 'tests/test_reader_close_worker_lifetime.py'
      - 'tests/test_v031_reader_composed_interactions.py'
      - 'benchmarks/v031_pack_physical_sha_court.py'
      - '.github/workflows/v031-reader-three-owner-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reader-three-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install authentic CMPCT package and native bindings
        run: python -m pip install -e '.[test]'
      - name: Exact-head independent and product courts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p benchmark-artifacts
          python -m pytest -q tests/test_v031_hardlink_owner_order.py tests/test_v031_pack_sha_integrity.py tests/test_reader_close_worker_lifetime.py tests/test_v031_reader_composed_interactions.py | tee benchmark-artifacts/composed-tests.log
          python benchmarks/v031_pack_physical_sha_court.py --expected-pack reject | tee benchmark-artifacts/pack-physical-oracle.json
          python benchmarks/v031_hardlink_owner_order_court.py --expect-fixed | tee benchmark-artifacts/hardlink-scientific-oracle.json
      - name: Verify unchanged CI topology rules
        run: python tools/check_ci_topology.py .github/workflows/v031-reader-three-owner-composition.yml
      - name: Preserve result-bearing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-three-owner-court-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
