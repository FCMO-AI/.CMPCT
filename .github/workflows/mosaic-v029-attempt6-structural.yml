name: CMPCT v0.29 attempt6 structural crossing (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-pointer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify preserved attempt-6 structural rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/history/2026-08-17-mosaic-v029-attempt6-structural-reject.json')
          r=json.loads(p.read_text())
          assert r['schema'] == 'cmpct-v029-attempt6-structural-reject-v1'
          assert r['decision']['research_gate'] == 'REJECT'
          assert r['candidate']['saving_vs_attempt5_bytes'] == 0
          assert r['comparison']['structural_crossing_pass'] is False
          print(json.dumps(r, indent=2))
          PY

# Footnote: this exact same-run structural hypothesis is closed. Re-running it on every PR would spend
# CI without changing the decision; the durable record retains tool/result provenance and the original
# executable workflow remains recoverable from Git history.
