# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 exact PrefixGraph CCtx attribution v2

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'docs/v030-rnd/R25_PREFIXGRAPH_EXACT_OWNER_CCTX_MEMORY_V2_PREREG.md'
      - 'benchmarks/v030_prefixgraph_exact_owner_cctx_memory_v2.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - '.github/workflows/v030-prefixgraph-exact-owner-cctx-memory-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/v030-rnd/R25_PREFIXGRAPH_EXACT_OWNER_CCTX_MEMORY_V2_PREREG.md'
      - 'benchmarks/v030_prefixgraph_exact_owner_cctx_memory_v2.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - '.github/workflows/v030-prefixgraph-exact-owner-cctx-memory-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-prefixgraph-exact-owner-cctx-v2-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(docs/v030-rnd/R25_PREFIXGRAPH_EXACT_OWNER_CCTX_MEMORY_V2_PREREG\.md|benchmarks/v030_prefixgraph_exact_owner_cctx_memory_v2\.py|benchmarks/v030_release_performance\.py|experiments/entropygraph_v030_(profile_isolation|prefixgraph|release_candidate)\.py|\.github/workflows/v030-prefixgraph-exact-owner-cctx-memory-v2\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  exact-owner-cctx-v2:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile exact-owner attribution
        run: python -m py_compile benchmarks/v030_prefixgraph_exact_owner_cctx_memory_v2.py
      - name: Run exact-owner Shifted CCtx attribution
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_prefixgraph_exact_owner_cctx_memory_v2 \
            --work-root "$RUNNER_TEMP/v030-prefixgraph-exact-owner-cctx-v2" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-prefixgraph-exact-owner-cctx-v2.json"
      - name: Ratchet frozen identity and decision bands
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('benchmark-artifacts/v030-prefixgraph-exact-owner-cctx-v2.json').read_text())
          assert e['schema']=='cmpct-v030-prefixgraph-exact-owner-cctx-memory-v2'
          assert e['source_commit']==os.environ['EVIDENCE_HEAD']
          assert e['target']==['resemblance_hostile_v1','01_shifted_versions']
          assert e['release_credit'] is False
          assert e['gate']['experiment_valid'] is True
          assert e['gate']['exact_owner_identity'] is True
          assert e['gate']['exact_tree_identity'] is True
          c=e['contract']; s=e['summary']
          assert c['support_threshold']==0.50 and c['retire_threshold']==0.20
          assert c['production_change'] is False and c['compressor_parameters_changed'] is False
          assert c['candidate_set_changed'] is False and c['release_credit'] is False
          share=float(s['max_cctx_share_of_exact_owner_incremental_rss'])
          decision=s['decision']
          if share >= 0.50:
              assert decision=='CCTX_MATERIAL_OWNER_SUPPORTED'
          elif share < 0.20:
              assert decision=='CCTX_RETIRED_AS_PRIMARY_EXACT_OWNER_ALLOCATION'
          else:
              assert decision=='CCTX_ATTRIBUTION_AMBIGUOUS'
          assert s['median_max_reported_single_cctx_bytes'] > 0
          assert s['median_exact_owner_peak_rss_kib'] > 0
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-prefixgraph-exact-owner-cctx-v2-candidate.txt
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-prefixgraph-exact-owner-cctx-memory-v2.yml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-prefixgraph-exact-owner-cctx-v2-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-prefixgraph-exact-owner-cctx-v2.json
            benchmark-artifacts/v030-prefixgraph-exact-owner-cctx-v2-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Diagnostic only. This supersedes the historical CCtx attribution comparator for canonical r25 because that
# lane measured the parallel research wrapper rather than the exact private PrefixGraph semantic owner.
