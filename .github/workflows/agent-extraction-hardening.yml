name: Agent extraction hardening

on:
  workflow_dispatch:
  push:
    branches:
      - frontier/full-completion-20260815
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - tests/native_stream_extract_abi.py
      - tools/agent_patch_extraction.py
      - .github/workflows/agent-extraction-hardening.yml

permissions:
  contents: write

concurrency:
  group: cmpct-extraction-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: frontier/full-completion-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply extraction hardening
        run: python tools/agent_patch_extraction.py
      - name: Normalize native Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml
      - name: Prove mutation scope is native-only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(native/cmpct-core/(src|tests)/.*\.rs|native/cmpct-core/include/cmpct\.h|tests/native_stream_extract_abi\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Extraction hardening or rustfmt touched files outside the declared native safety surface:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Validate extraction behavior
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install -e '.[audio,test]'
            cargo test --manifest-path native/cmpct-core/Cargo.toml --all-targets
            cargo build --manifest-path native/cmpct-core/Cargo.toml --release
            python tests/native_stream_extract_abi.py
          } 2>&1 | tee extraction-hardening-validation.log
      - name: Enforce strict native lint before commit
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings 2>&1 | tee -a extraction-hardening-validation.log
      - name: Commit validated hardening
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-extraction-hardening.yml tools/agent_patch_extraction.py
          git config user.name 'CMPCT automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Harden native extraction resource and mode handling'
          git push origin HEAD:frontier/full-completion-20260815
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-hardening-validation
          path: extraction-hardening-validation.log
          if-no-files-found: ignore
          retention-days: 7
