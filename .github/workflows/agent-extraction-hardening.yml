name: Agent extraction hardening

on:
  push:
    branches:
      - frontier/full-completion-20260815
    paths:
      - .github/workflows/agent-extraction-hardening.yml
      - tools/agent_patch_extraction.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: frontier/full-completion-20260815
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply extraction hardening
        run: python tools/agent_patch_extraction.py
      - name: Fix pinned rmpv mutable-array compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("native/cmpct-core/src/recovery.rs")
          text = path.read_text()
          old = "let candidate = candidate.as_array_mut().ok_or(RecoveryError::Malformed)?;"
          new = "let candidate = array_mut(candidate).ok_or(RecoveryError::Malformed)?;"
          if old not in text:
              raise SystemExit("recovery rename mutable-array anchor missing")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Clear strict native lint debt exposed by recovery fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = Path("native/cmpct-core/src/recovery.rs")
          r = recovery.read_text()
          r = r.replace("    pub footer_pos: u64,\n    pub delta_depth: usize,\n", "", 1)
          r = r.replace("                footer_pos,\n                delta_depth: depth,\n", "", 1)
          r = r.replace("    for depth in 0..=max_generations {", "    for _depth in 0..=max_generations {", 1)
          recovery.write_text(r)

          regen = Path("native/cmpct-core/src/deflate_regen.rs")
          d = regen.read_text()
          unavailable = '    #[error("stock zlib regeneration backend is unavailable on this target")]\n    Unavailable,'
          replacement = '    #[cfg_attr(unix, allow(dead_code))]\n    #[error("stock zlib regeneration backend is unavailable on this target")]\n    Unavailable,'
          if unavailable not in d:
              raise SystemExit("Deflate Unavailable anchor missing")
          regen.write_text(d.replace(unavailable, replacement, 1))

          vzip = Path("native/cmpct-core/src/vzip.rs")
          v = vzip.read_text()
          wrapper = '''/// Compatibility name retained for older focused tests. All currently frozen revision-24 stream
          /// modes are parsed by the same implementation; the wrapper no longer means "stored-only".
          pub fn parse_stored_recipe(
              value: &Value,
              blob_sizes: &[u64],
              entry_logical_size: u64,
          ) -> Result<VirtualZipRecipe, VirtualZipError> {
              parse_recipe(value, blob_sizes, entry_logical_size)
          }

          '''
          if wrapper not in v:
              raise SystemExit("unused vzip compatibility wrapper anchor missing")
          vzip.write_text(v.replace(wrapper, "", 1))

          dispatch = Path("native/cmpct-core/src/vzip_dispatch.rs")
          x = dispatch.read_text()
          nested = (
              "    if start == 0 && end == recipe.logical_size {\n"
              "        if Sha256::digest(&*out).as_slice() != recipe.logical_sha256 {\n"
              "            return Err(VirtualZipDispatchError::LogicalHash);\n"
              "        }\n"
              "    }\n"
          )
          collapsed = (
              "    if start == 0\n"
              "        && end == recipe.logical_size\n"
              "        && Sha256::digest(&*out).as_slice() != recipe.logical_sha256\n"
              "    {\n"
              "        return Err(VirtualZipDispatchError::LogicalHash);\n"
              "    }\n"
          )
          if nested not in x:
              raise SystemExit("vzip collapsible-if anchor missing")
          dispatch.write_text(x.replace(nested, collapsed, 1))

          lib = Path("native/cmpct-core/src/lib.rs")
          s = lib.read_text()
          replacements = {
              "/// Copy an entry path as UTF-8. Passing a null buffer with capacity zero is a size query.\n":
                  "/// Copy an entry path as UTF-8. Passing a null buffer with capacity zero is a size query.\n///\n/// # Safety\n/// `archive` must be live, `out_len` must be writable, and a non-null `buffer` must be valid for `capacity` bytes.\n",
              "/// Run complete native structural preflight without extracting payloads.\n":
                  "/// Run complete native structural preflight without extracting payloads.\n///\n/// # Safety\n/// `archive` must be null or a live pointer returned by `cmpct_open`.\n",
              "/// Read one bounded logical range. `out_read` is zero on every failure.\n":
                  "/// Read one bounded logical range. `out_read` is zero on every failure.\n///\n/// # Safety\n/// `archive` must be live, `out_read` writable, and a non-null `buffer` valid for `length` bytes.\n",
              "/// Open a sequential logical stream. The archive handle must outlive the stream.\n":
                  "/// Open a sequential logical stream. The archive handle must outlive the stream.\n///\n/// # Safety\n/// `archive` must be live and `out` must be writable for one stream pointer.\n",
              "/// Read the next sequential stream bytes; EOF is `CMPCT_OK` with `out_read == 0`.\n":
                  "/// Read the next sequential stream bytes; EOF is `CMPCT_OK` with `out_read == 0`.\n///\n/// # Safety\n/// `stream` must be live, `out_read` writable, and a non-null `buffer` valid for `capacity` bytes.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn cmpct_stream_close(stream: *mut CmpctStream) {":
                  "/// Close a sequential stream handle.\n///\n/// # Safety\n/// `stream` must be null or a live pointer returned by `cmpct_entry_stream_open`, and must not be closed twice.\n#[no_mangle]\npub unsafe extern \"C\" fn cmpct_stream_close(stream: *mut CmpctStream) {",
              "/// Extract with an explicit archive-wide payload-materialization ceiling.\n":
                  "/// Extract with an explicit archive-wide payload-materialization ceiling.\n///\n/// # Safety\n/// `archive` must be live and `destination` must point to a valid NUL-terminated UTF-8 string.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn cmpct_extract_all(\n":
                  "/// Extract the complete archive using the native default materialization ceiling.\n///\n/// # Safety\n/// `archive` must be live and `destination` must point to a valid NUL-terminated UTF-8 string.\n#[no_mangle]\npub unsafe extern \"C\" fn cmpct_extract_all(\n",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"native safety-doc anchor missing: {old!r}")
              s = s.replace(old, new, 1)
          lib.write_text(s)
          PY
      - name: Format and validate focused frontier
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --manifest-path native/cmpct-core/Cargo.toml
            python -m pip install --upgrade pip
            python -m pip install -e '.[audio,test]'
            cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings
            cargo test --manifest-path native/cmpct-core/Cargo.toml
            cargo build --manifest-path native/cmpct-core/Cargo.toml --release
            python tests/native_stream_extract_abi.py
          } 2>&1 | tee extraction-hardening-validation.log
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-hardening-validation
          path: extraction-hardening-validation.log
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated hardening
        run: |
          rm .github/workflows/agent-extraction-hardening.yml tools/agent_patch_extraction.py
          git config user.name 'CMPCT automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden native extraction resource and mode handling'
          git push origin HEAD:frontier/full-completion-20260815
