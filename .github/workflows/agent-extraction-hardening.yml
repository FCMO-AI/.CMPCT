name: Agent extraction hardening

on:
  push:
    branches:
      - frontier/full-completion-20260815
    paths:
      - .github/workflows/agent-extraction-hardening.yml
      - tools/agent_patch_extraction.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: frontier/full-completion-20260815
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply extraction hardening
        run: python tools/agent_patch_extraction.py
      - name: Format and validate focused frontier
        run: |
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/cmpct-core/Cargo.toml
          cargo build --manifest-path native/cmpct-core/Cargo.toml --release
          python tests/native_stream_extract_abi.py
      - name: Commit validated hardening
        run: |
          rm .github/workflows/agent-extraction-hardening.yml tools/agent_patch_extraction.py
          git config user.name 'CMPCT automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden native extraction resource and mode handling'
          git push origin HEAD:frontier/full-completion-20260815
