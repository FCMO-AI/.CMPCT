name: Agent extraction hardening

on:
  workflow_dispatch:
  push:
    branches:
      - frontier/full-completion-20260815
    paths:
      - .github/workflows/agent-extraction-hardening.yml
      - tools/agent_patch_extraction.py

permissions:
  contents: write

concurrency:
  group: cmpct-extraction-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: frontier/full-completion-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply extraction hardening
        run: python tools/agent_patch_extraction.py
      - name: Format only extraction-touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          # rustfmt follows child modules when invoked on lib.rs unless skip_children is set.
          # This gate is intentionally surgical: formatting unrelated frontier modules would
          # create collateral diffs and hide whether the extraction patch itself is clean.
          rustfmt --edition 2021 --config skip_children=true native/cmpct-core/src/lib.rs
          rustfmt --edition 2021 --config skip_children=true native/cmpct-core/src/recovery.rs
          rustfmt --edition 2021 --config skip_children=true native/cmpct-core/tests/recovery_golden.rs
      - name: Prove mutation scope is limited
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(native/cmpct-core/src/lib\.rs|native/cmpct-core/src/recovery\.rs|native/cmpct-core/include/cmpct\.h|native/cmpct-core/tests/recovery_golden\.rs|tests/native_stream_extract_abi\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Extraction patch touched files outside its declared safety surface:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Validate focused frontier
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install -e '.[audio,test]'
            cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings
            cargo test --manifest-path native/cmpct-core/Cargo.toml --all-targets
            cargo build --manifest-path native/cmpct-core/Cargo.toml --release
            python tests/native_stream_extract_abi.py
          } 2>&1 | tee extraction-hardening-validation.log
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-hardening-validation
          path: extraction-hardening-validation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-extraction-hardening.yml tools/agent_patch_extraction.py
          git config user.name 'CMPCT automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Harden native extraction resource and mode handling'
          git push origin HEAD:frontier/full-completion-20260815