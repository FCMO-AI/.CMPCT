# ci-lane: deep
name: CMPCT v0.29 bounded LZMA2 backend ceiling

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-lzma2-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lzma2-backend-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_lzma2_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Measure bounded LZMA2 physical-record backend
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_lzma2_backend_oracle.py \
            benchmark-artifacts/resemblance-hostile \
            --work-root benchmark-artifacts/CMPCT_V029_LZMA2_Backend_Oracle \
            --output benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.stdout.txt

      - name: Enforce frozen backend contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.json').read_text())
          assert r['schema'] == 'cmpct-v029-lzma2-backend-oracle-v1'
          p=r['policy']; b=r['best']
          assert p['dictionary_sizes_bytes'] == [1 << 20, 4 << 20, 8 << 20], r
          assert p['max_decoder_dictionary_bytes'] == 8 << 20, r
          assert p['min_net_saving_bytes'] == 128 * 1024, r
          assert p['min_improved_records'] == 4, r
          assert p['record_boundaries_unchanged'] is True, r
          assert p['dependency_depth_unchanged'] is True, r
          assert p['roundtrip_verified_per_candidate'] is True, r
          assert b['dictionary_bytes'] <= 8 << 20, r
          # PASS and REJECT are both valid. Thresholds are evidence boundaries, not targets to tune after seeing bytes.
          print(json.dumps({'best': b, 'research_gate_pass': r['research_gate_pass']}, indent=2))
          PY

      - name: Focused backend tests
        run: python -m pytest -q tests/test_v029_lzma2_backend_oracle.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize bounded LZMA2 ceiling
        if: always()
        run: |
          if [ -f benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.json').read_text())
          b=r['best']
          print('## CMPCT v0.29 — bounded LZMA2 physical-record backend')
          print(f"- attempt-5 source archive: **{r['source_archive']['bytes']:,} B**")
          print(f"- candidate direct/root payload: **{r['source_archive']['candidate_payload_bytes']:,} B**")
          print(f"- best dictionary bound: **{b['dictionary_bytes'] // (1<<20)} MiB**")
          print(f"- profitable records: **{b['profitable_records']}**")
          print(f"- exact net saving after transition charges: **{b['net_saving_bytes']:,} B**")
          print(f"- frozen >=128 KiB / >=4-record gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          print('- Record boundaries and dependency depth remain unchanged in this oracle; no LZMA2 CMPCT grammar is emitted.')
          PY
          fi

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v029-lzma2-backend-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.json
            benchmark-artifacts/mosaic-v029-lzma2-backend-oracle.stdout.txt
          if-no-files-found: warn

# Footnote: the simpler shared-dictionary and one-hop Zstd context families both failed their frozen gates.
# This oracle therefore changes the physical codec while keeping decode-unit boundaries and logical dependency
# depth unchanged. If bounded LZMA2 cannot buy >=128 KiB, the next search should leave this backend class too.
