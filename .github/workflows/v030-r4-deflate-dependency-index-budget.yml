# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 dependency-index budget

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_deflate_dependency_index_budget.py'
      - '.github/workflows/v030-r4-deflate-dependency-index-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-depidx-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dependency-index-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile falsifier
        run: python -m py_compile benchmarks/v030_r4_deflate_dependency_index_budget.py
      - name: Measure charged dependency information
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_deflate_dependency_index_budget.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-depidx-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-depidx.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-depidx.json'))
          assert d['schema']=='cmpct-v030-r4-deflate-dependency-index-budget-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit'] and c['lower_bound_only']
          assert c['no_threshold_sweep'] and c['no_page_size_sweep'] and c['no_codec_sweep']
          assert c['auth_digest_charged']==32
          print(json.dumps({'index':d['index'],'economics':d['economics'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-deflate-dependency-index-budget.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-dependency-index-budget-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-depidx.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity only; scientific support/falsification lives in the JSON hypothesis.
