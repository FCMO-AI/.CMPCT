name: CMPCT v0.30 EG07 transfer eligibility

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - benchmarks/v030_eg07_transfer_eligibility.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py
      - docs/V030_EG07_TRANSFER_ELIGIBILITY_LOCK_2026-09-13.md
      - .github/workflows/v030-eg07-transfer-eligibility.yml

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run eligibility map
        shell: bash
        run: |
          mkdir -p evidence
          python -m benchmarks.v030_eg07_transfer_eligibility \
            --out evidence/eg07-transfer-eligibility.json \
            > >(tee evidence/stdout.txt) \
            2> >(tee evidence/stderr.txt >&2)
      - name: Bind receipt
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('evidence/eg07-transfer-eligibility.json'); d=json.loads(p.read_text()); d['candidate_sha']=os.environ['GITHUB_SHA']; d['candidate_ref']=os.environ['GITHUB_REF_NAME']; p.write_text(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v030-eg07-transfer-eligibility-${{ github.sha }}
          path: |
            evidence/eg07-transfer-eligibility.json
            evidence/stdout.txt
            evidence/stderr.txt
          if-no-files-found: error
