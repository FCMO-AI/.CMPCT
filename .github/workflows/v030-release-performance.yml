# ci-lane: release
name: CMPCT v0.30 runtime promotion gate

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-release-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_authority: ${{ steps.delta.outputs.run_authority }}
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2

      - name: Bind exact candidate and classify latest-head delta
        id: delta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo 'run_authority=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(src/cmpct/|experiments/|benchmarks/v030_(perf_worker|release_performance)|tests/test_v030_(perf_worker|release_reader|member_reader|release_candidate|shared_portfolio|prefixgraph_process_executor_paths)|pyproject\.toml$|\.github/workflows/v030-release-performance\.yml$)' /tmp/latest-head-files.txt; then
            echo 'run_authority=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_authority=false' >> "$GITHUB_OUTPUT"
            echo 'Shipping/runtime fingerprint inputs unchanged; preserving prior exact product-fingerprint authority instead of restarting it.'
          fi

  release-performance:
    needs: impact
    if: needs.impact.outputs.run_authority == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0

      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact corpus and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile performance workers and promoted release product
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_shared_portfolio.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release.py \
            experiments/entropygraph_v030_release_product.py \
            experiments/entropygraph_v030_prefixgraph_process_executor.py \
            benchmarks/v030_perf_worker.py \
            benchmarks/v030_perf_worker_canonical.py \
            benchmarks/v030_release_performance.py \
            benchmarks/v030_release_performance_product.py

      - name: Ratchet runtime workers to the shipping v0.30 front door
        run: python -m pytest -q tests/test_v030_perf_worker_product_binding.py

      - name: Run fast byte/resource prerequisite tests
        run: |
          python -m pytest -q \
            tests/test_v030_shared_portfolio.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_release_candidate.py \
            tests/test_v030_prefixgraph_process_executor_paths.py

      - name: Run fresh-process paired promoted-product runtime gate
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_release_performance_product.py \
            --work-root benchmark-artifacts/v030-release-performance-work \
            --output benchmark-artifacts/v030-release-performance.json \
            2>&1 | tee benchmark-artifacts/v030-release-performance.stdout.txt

      - name: Independently enforce frozen performance policy
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-release-performance.json')
          assert p.is_file(), 'runtime evidence missing after promoted-product gate'
          data=json.loads(p.read_text())
          contract=data['contract']; totals=data['totals']; gate=data['gate']
          assert data['schema']=='cmpct-v030-release-performance-product-v1'
          assert data['engine']=='experiments/entropygraph_v030_release_product.py'
          assert data['release_facade']=='cmpct-v030-release-product-v1'
          assert contract['maximum_median_create_ratio']==1.10
          assert contract['maximum_workload_create_ratio']==1.25
          assert contract['maximum_median_extract_ratio']==1.10
          assert contract['maximum_workload_extract_ratio']==1.25
          assert contract['maximum_peak_rss_ratio']==1.25
          assert totals['median_create_ratio']<=1.10
          assert totals['max_workload_create_ratio']<=1.25
          assert totals['median_extract_ratio']<=1.10
          assert totals['max_workload_extract_ratio']<=1.25
          assert totals['max_peak_rss_ratio']<=1.25
          assert gate['passed'] is True
          print(json.dumps({'totals': totals, 'gate': gate}, indent=2))
          PY

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload paired runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-release-performance-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-release-performance.json
            benchmark-artifacts/v030-release-performance.stdout.txt
          if-no-files-found: warn
          retention-days: 90

  whole-tree-rss-companion:
    needs: impact
    if: needs.impact.outputs.run_authority == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0

      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact corpus and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile whole-process-tree measurement surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_product.py \
            experiments/entropygraph_v030_prefixgraph_process_executor.py \
            benchmarks/v030_release_performance.py \
            benchmarks/v030_release_performance_tree_rss.py \
            benchmarks/v030_perf_worker_tree_rss.py

      - name: Prove caller-relative PrefixGraph child path transport
        run: python -m pytest -q tests/test_v030_prefixgraph_process_executor_paths.py

      - name: Run zero-credit whole-process-tree RSS companion
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_release_performance_tree_rss.py \
            --work-root benchmark-artifacts/v030-release-performance-tree-rss-work \
            --output benchmark-artifacts/v030-release-performance-tree-rss.json \
            2>&1 | tee benchmark-artifacts/v030-release-performance-tree-rss.stdout.txt

      - name: Enforce whole-tree accounting custody
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-release-performance-tree-rss.json')
          assert p.is_file(), 'whole-tree RSS evidence missing'
          data=json.loads(p.read_text())
          assert data['schema']=='cmpct-v030-release-performance-tree-rss-v1'
          assert data['engine']=='experiments/entropygraph_v030_release_product.py'
          assert data['release_facade']=='cmpct-v030-release-product-v1'
          assert data['rss_accounting']=='whole-process-tree-vmrss-10ms-with-parent-rumaxrss-floor'
          contract=data['contract']
          assert contract['maximum_median_create_ratio']==1.10
          assert contract['maximum_workload_create_ratio']==1.25
          assert contract['maximum_median_extract_ratio']==1.10
          assert contract['maximum_workload_extract_ratio']==1.25
          assert contract['maximum_peak_rss_ratio']==1.25
          tree=data['tree_rss_contract']
          assert tree['child_memory_gifted'] is False
          assert tree['timing_boundary_changed'] is False
          assert tree['peak_rss_threshold_changed'] is False
          assert tree['release_credit'] is False
          for receipt in data['tree_rss_receipts']:
              assert receipt['decisive_peak_rss_kib'] >= receipt['parent_peak_rss_kib']
              assert receipt['decisive_peak_rss_kib'] >= receipt['sampled_tree_peak_rss_kib']
              assert receipt['tree_rss_samples'] >= 1
          print(json.dumps({'totals': data['totals'], 'gate': data['gate'], 'release_credit': tree['release_credit']}, indent=2))
          PY

      - name: Upload whole-tree RSS evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-release-performance-tree-rss-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-release-performance-tree-rss.json
            benchmark-artifacts/v030-release-performance-tree-rss.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# Product-neutral pushes cannot cancel a result-bearing run already in progress. Each material run remains bound to
# its own immutable EVIDENCE_HEAD; no older result is promoted as exact-head truth. The historical promoted-product
# job is unchanged in scientific policy. The companion separately executes the repository's pre-existing stronger
# whole-process-tree RSS instrument because RUSAGE_SELF gifts descendant memory once PrefixGraph uses a bounded child.
# That companion inherits the same target matrix and thresholds, explicitly grants zero release credit, and exists
# only to establish D5 product memory truth before further rehabilitation. A miss is debt, never a policy edit.
