# ci-lane: release
name: CMPCT v0.30 runtime promotion gate

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-release-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact corpus and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile performance worker and promoted release product
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_shared_portfolio.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/v030_perf_worker.py \
            benchmarks/v030_release_performance.py

      - name: Ratchet runtime worker to the shipping v0.30 front door
        run: |
          python -m pytest -q tests/test_v030_perf_worker_product_binding.py

      - name: Run fast byte/resource prerequisite tests
        run: |
          python -m pytest -q \
            tests/test_v030_shared_portfolio.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_release_candidate.py

      - name: Run fresh-process paired runtime gate
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_release_performance.py \
            --work-root benchmark-artifacts/v030-release-performance-work \
            --output benchmark-artifacts/v030-release-performance.json \
            2>&1 | tee benchmark-artifacts/v030-release-performance.stdout.txt

      - name: Independently enforce frozen performance policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/v030-release-performance.json').read_text())
          contract=data['contract']; totals=data['totals']; gate=data['gate']
          assert data['schema']=='cmpct-v030-release-performance-v1'
          assert contract['maximum_median_create_ratio']==1.10
          assert contract['maximum_workload_create_ratio']==1.25
          assert contract['maximum_median_extract_ratio']==1.10
          assert contract['maximum_workload_extract_ratio']==1.25
          assert contract['maximum_peak_rss_ratio']==1.25
          assert contract['size_regression_tolerance_bytes']==0
          assert totals['median_create_ratio']<=1.10
          assert totals['max_workload_create_ratio']<=1.25
          assert totals['median_extract_ratio']<=1.10
          assert totals['max_workload_extract_ratio']<=1.25
          assert totals['max_peak_rss_ratio']<=1.25
          assert gate['passed'] is True
          print(json.dumps({'totals': totals, 'gate': gate}, indent=2))
          PY

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload paired runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-release-performance-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-release-performance.json
            benchmark-artifacts/v030-release-performance.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# Footnote: `ffmpeg` is required to construct the frozen neutral-hostile media workload before runtime is measured.
# Installing it repairs the benchmark environment only; it does not participate in CMPCT compression or relax any
# create/extract/RSS threshold. The v0.30 worker is explicitly bound to entropygraph_v030_release_product so the
# authority measures the same promoted structural terminals that would ship; the historical v0.29 worker remains
# unchanged. Hosted timing remains same-run paired promotion evidence, while absolute public throughput claims still
# require controlled benchmark hardware. A miss is implementation debt, not a policy edit.