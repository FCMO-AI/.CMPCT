# ci-lane: deep
# Research-only causal court; no release gate or comparator mutation.
name: J24I52 native Zstd codec intrinsic-cost court

on:
  push:
    branches:
      - agent/phased3-v031-j24i52-native-codec-drift-court-20261030
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24i52-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  codec-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Assert exact head and pre-result preregistration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor b9d31f2b003f2046ec67829c74ec5f10808eaf78 HEAD
          git merge-base --is-ancestor 0b80ecb9b1742a6c20756f4c9e8e097103881cb4 HEAD
          git merge-base --is-ancestor f456370e75b71a619104f9e9bb6c622929ba8db8 HEAD
          git ls-files --error-unmatch research/j24i52_native_codec_court.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native codec packaging dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Build independent historical base native wheel
        run: |
          set -euo pipefail
          mkdir -p evidence
          git worktree add --detach /tmp/j24i52-native-base f456370e75b71a619104f9e9bb6c622929ba8db8
          python tools/materialize_performance_base_native.py /tmp/j24i52-native-base --receipt evidence/base-native.json \
            | tee evidence/base-native-build.txt
      - name: Execute balanced native codec A/A and A/B
        run: |
          set -euo pipefail
          BASE_NATIVE="$(python -c "import json;print(json.load(open('evidence/base-native.json'))['native_path'])")"
          CANDIDATE_NATIVE="$(python -c "from cmpct.native_codec import _library_path;print(_library_path().resolve())")"
          echo "Base source: f456370e75b71a619104f9e9bb6c622929ba8db8"
          echo "Candidate source: 0b80ecb9b1742a6c20756f4c9e8e097103881cb4"
          python research/j24i52_native_codec_court.py \
            --base-lib "$BASE_NATIVE" \
            --candidate-lib "$CANDIDATE_NATIVE" \
            --base-ref f456370e75b71a619104f9e9bb6c622929ba8db8 \
            --candidate-ref 0b80ecb9b1742a6c20756f4c9e8e097103881cb4 \
            --out evidence/j24i52-native-codec-result.json | tee evidence/j24i52-stdout.txt
          cp "$BASE_NATIVE" evidence/j24i52-base-native.so
          cp "$CANDIDATE_NATIVE" evidence/j24i52-candidate-native.so
      - name: Independent structural receipt verification
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          x=json.loads(Path('evidence/j24i52-native-codec-result.json').read_text())
          assert x['schema']=='cmpct-j24i52-native-codec-v1'
          assert x['evidence_head']==os.environ['EVIDENCE_HEAD']
          for label in ('base','candidate'):
              raw=Path(f'evidence/j24i52-{label}-native.so').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==x[f'{label}_native_sha256']
          assert len(x['representative_samples'])==5
          for court in ('AA','AB'):
              observations=x[court]['observations']
              assert len(observations)==16
              assert len({o['output_sha256'] for o in observations})==1
              assert sum(len(o['wall_ms']) for o in observations)==112
              assert all(o['median_cpu_ms']>0 and o['median_wall_ms']>0 for o in observations)
          PY
          sha256sum evidence/j24i52-native-codec-result.json evidence/j24i52-base-native.so \
            evidence/j24i52-candidate-native.so research/j24i52_native_codec_court.py \
            > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cmpct-j24i52-native-codec-${{ env.EVIDENCE_HEAD }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
