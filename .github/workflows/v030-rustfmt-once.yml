name: CMPCT v0.30 one-shot native rustfmt repair

on:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - '.github/workflows/v030-rustfmt-once.yml'

permissions:
  contents: write

jobs:
  rustfmt-and-self-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
          fetch-depth: 2
      - name: Normalize inherited native formatting and remove this one-shot helper
        run: |
          set -euo pipefail
          cd native/cmpct-portable
          cargo fmt
          cd ../..
          git rm .github/workflows/v030-rustfmt-once.yml
          git config user.name 'cmpct-ci'
          git config user.email 'cmpct-ci@users.noreply.github.com'
          git add native/cmpct-portable/src
          git diff --cached --check
          git commit -m 'style(v030): normalize native portable Rust'
          git push origin HEAD:agent/v030-authoritative-integration

# One-shot trigger ratchet: this second revision exists solely so the workflow is present before its push event.
