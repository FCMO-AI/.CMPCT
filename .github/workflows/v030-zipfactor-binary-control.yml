# ci-lane: deep
name: CMPCT v0.30 ZIP-factor binary-control oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_zipfactor_*.py'
      - 'benchmarks/v030_zipfactor_binary_control_oracle.py'
      - 'tests/test_v030_zipfactor_compact_v3.py'
      - '.github/workflows/v030-zipfactor-binary-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-binary-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  binary-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile candidate and oracle
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_zipfactor_compact_v3.py \
            benchmarks/v030_zipfactor_binary_control_oracle.py
      - name: Run hostile/admission regression tests
        run: |
          python -m pytest -q \
            tests/test_v030_zipfactor_compact_v3.py \
            tests/test_v030_zip_framing_factor_admission.py
      - name: Run exact frozen product-boundary A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_zipfactor_binary_control_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-binary-control-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-binary-control.json"
      - name: Independently enforce candidate boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/v030-zf-binary-control.json')
          if not path.exists():
              raise SystemExit('binary-control evidence missing')
          d=json.loads(path.read_text())
          v=d['binary_control_v3']; g=d['gate']
          assert d['schema']=='cmpct-v030-zipfactor-binary-control-oracle-v1'
          assert g['v3_exact'] is True
          assert v['strong_verify_green'] is True
          assert v['semantic_tree_exact'] is True
          assert v['locality_green'] is True
          assert v['verified_max_member_read_amplification'] <= 8.0
          assert v['verified_max_decode_unit_bytes'] <= 8 * 1024 * 1024
          # Promotion credit is intentionally strict: all four external wins and a Pareto improvement over v2.
          assert g['v3_smaller_than_v2'] is True
          assert g['v3_faster_than_v2'] is True
          assert g['v3_strictly_beats_zip_size'] is True
          assert g['v3_strictly_beats_zstd19_size'] is True
          assert g['v3_strictly_beats_zip_create'] is True
          assert g['v3_strictly_beats_zstd19_create'] is True
          assert g['passed'] is True
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-binary-control.yml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zf-binary-control-${{ github.sha }}
          path: benchmark-artifacts/v030-zf-binary-control.json
          if-no-files-found: warn
          retention-days: 90

# Research-only: even a four-way win here cannot authorize canonical selector/native/Android/recovery promotion.
