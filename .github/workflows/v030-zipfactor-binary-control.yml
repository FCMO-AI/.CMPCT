# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 ZIP-factor binary-control oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_zipfactor_*.py'
      - 'benchmarks/v030_zipfactor_binary_control_oracle.py'
      - 'tests/test_v030_zipfactor_compact_v3.py'
      - 'tests/test_v030_zip_framing_factor_admission.py'
      - '.github/workflows/v030-zipfactor-binary-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-binary-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_zipfactor_.*\.py|benchmarks/v030_zipfactor_binary_control_oracle\.py|tests/test_v030_zipfactor_(compact_v3|zip_framing_factor_admission)\.py|\.github/workflows/v030-zipfactor-binary-control\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect ZIP-factor binary control.'
          fi

  binary-control:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile candidate and oracle
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_zipfactor_compact_v3.py \
            benchmarks/v030_zipfactor_binary_control_oracle.py
      - name: Run hostile/admission regression tests
        run: |
          python -m pytest -q \
            tests/test_v030_zipfactor_compact_v3.py \
            tests/test_v030_zip_framing_factor_admission.py
      - name: Run exact frozen product-boundary A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_zipfactor_binary_control_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-binary-control-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-binary-control.json"
      - name: Independently enforce candidate boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/v030-zf-binary-control.json')
          if not path.exists():
              raise SystemExit('binary-control evidence missing')
          d=json.loads(path.read_text())
          v=d['binary_control_v3']; g=d['gate']
          assert d['schema']=='cmpct-v030-zipfactor-binary-control-oracle-v2'
          assert g['experiment_valid'] is True
          assert g['v3_exact'] is True
          assert v['strong_verify_green'] is True
          assert v['semantic_tree_exact'] is True
          assert v['locality_green'] is True
          assert v['verified_max_member_read_amplification'] <= 8.0
          assert v['verified_max_decode_unit_bytes'] <= 8 * 1024 * 1024
          expected_promotion = all([
              g['v3_smaller_than_v2'],
              g['v3_faster_than_v2'],
              g['v3_strictly_beats_zip_size'],
              g['v3_strictly_beats_zstd19_size'],
              g['v3_strictly_beats_zip_create'],
              g['v3_strictly_beats_zstd19_create'],
          ])
          assert g['promotion_signal'] is expected_promotion
          assert g['release_credit'] is False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-binary-control.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zf-binary-control-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-zf-binary-control.json
          if-no-files-found: error
          retention-days: 90

# Research-only: even a four-way win here cannot authorize canonical selector/native/Android/recovery promotion.
