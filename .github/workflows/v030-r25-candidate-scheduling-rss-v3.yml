# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 candidate scheduling RSS A/B v3

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_v3_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_v3_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-v3-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_candidate_scheduling_rss_v3_.*\.py$|docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_PREREG\.md$|\.github/workflows/v030-r25-candidate-scheduling-rss-v3\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  candidate-scheduling-rss-v3:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-v3-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen A/B
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile benchmarks/v030_r25_candidate_scheduling_rss_v3_worker.py benchmarks/v030_r25_candidate_scheduling_rss_v3_oracle.py experiments/entropygraph_v030_canonical_final.py experiments/entropygraph_v030_release_product.py
      - name: Run candidate scheduling RSS A/B v3
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_candidate_scheduling_rss_v3_oracle.py --work-root benchmark-artifacts/v030-r25-candidate-scheduling-rss-v3-work --output benchmark-artifacts/v030-r25-candidate-scheduling-rss-v3.json
      - name: Ratchet frozen claim boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r25-candidate-scheduling-rss-v3.json')
          assert p.is_file(), 'v3 evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r25-candidate-scheduling-rss-v3'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['release_credit'] is False
          assert d['preregistration']=='docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_PREREG.md'
          assert d['research_identity_domain']=='research-content-tree-v1'
          assert d['verification_identity_domain']=='canonical-filesystem-user-tree-v1'
          assert d['research_tree_sha256'] != d['expected_verification_tree_sha256']
          c=d['contract']
          assert c['routing_only_prefixgraph_executor'] is True
          assert c['exact_product_identity_required'] is True
          assert c['dual_identity_domains_explicit'] is True
          assert c['fresh_process_per_measurement'] is True
          assert c['total_peak_rss_is_causal_metric'] is True
          assert c['decision_thresholds_changed'] is False
          assert c['production_source_changed'] is False
          if d['experiment_valid']:
            assert d['worker_failures']==[]
            for row in d['repetitions']:
              a,b=row['concurrent'],row['serialized']
              assert b['intercepted_prefixgraph_executor_constructions']==1
              assert b['intercepted_prefixgraph_submissions']==1
              assert a['intercepted_prefixgraph_executor_constructions']==0
              assert a['intercepted_prefixgraph_submissions']==0
              assert a['archive_bytes']==b['archive_bytes']
              assert a['archive_sha256']==b['archive_sha256']
              assert a['verified_tree_sha256']==b['verified_tree_sha256']==d['expected_verification_tree_sha256']
              assert a['selected']==b['selected']=='prefixgraph'
          else:
            assert d['worker_failures']
            raise SystemExit('candidate scheduling RSS v3 invalid')
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-candidate-scheduling-rss-v3.yml
      - name: Upload exact A/B v3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-candidate-scheduling-rss-v3-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-candidate-scheduling-rss-v3.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only; no release credit. V1/V2 remain immutable invalid evidence.
