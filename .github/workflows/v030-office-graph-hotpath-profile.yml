# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Office graph hotpath profile

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_office_graph_hotpath_profile.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v4.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v5.py'
      - 'benchmarks/v030_federated_embedded_fs_v7_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-office-graph-hotpath-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-office-graph-hotpath-profile-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind checkout to exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact frozen-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile profiler
        run: python -m py_compile benchmarks/v030_office_graph_hotpath_profile.py
      - name: Profile exact byte-producing graph boundary
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_office_graph_hotpath_profile \
            --work-root "$RUNNER_TEMP/v030-office-graph-profile-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-office-graph-profile.json"
      - name: Ratchet diagnostic-only evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-office-graph-profile.json').read_text())
          assert d['schema']=='cmpct-v030-office-graph-hotpath-profile-v1'
          assert d['archive_bytes'] > 0
          assert d['exact_raw_final_identity'] is True
          assert d['ordinary_graph_wall_s'] > 0
          assert d['profiled_graph_wall_s'] > 0
          assert d['profile_timing_release_credit'] is False
          assert d['top_functions_by_cumulative_s']
          c=d['contract']
          assert c['frozen_office_source'] is True
          assert c['historical_graph_semantics_changed'] is False
          assert c['raw_final_eg07_byte_identity_required'] is True
          assert c['profile_numbers_are_diagnostic_only'] is True
          assert c['release_credit'] is False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-office-graph-hotpath-profile.yml
      - name: Upload exact-head diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-office-graph-hotpath-profile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-office-graph-profile.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. The profile can prioritize a subsequent exact-byte optimization, but cannot
# change production selection or earn external/runtime/release credit by itself.
