# ci-lane: fast
# O84 source-exact installed cross-owner Builder correctness, no release credit.
name: CMPCT v0.31 O84 Builder source/output ownership composition
on:
  push:
    branches:
      - 'agent/phased2-v031-o84-builder-fidelity-output-alias-union-20261025'
  pull_request:
    paths:
      - 'src/cmpct/builder.py'
      - 'tests/test_v031_o81_builder_output_source_alias.py'
      - 'tests/test_v031_o84_builder_output_fidelity_interaction.py'
      - '.github/workflows/v031-o84-builder-source-output-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o84-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-cross-owner:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Authenticate source identities, original tests and installed product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 4d65f1bcbc68f1ad770e706197ece8355dd10637 HEAD
          git merge-base --is-ancestor 17c70e9067db8c14ec6a3b8c3af864bf1b462583 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "64b0cd21ad54ce7c8e8c6f5847b3c613fff6511c"
          test "$(git hash-object src/cmpct/ntfs_streams.py)" = "61d8cab1545c491da76b23ea89d4ca85d3030c5d"
          test "$(git hash-object tests/test_v031_o81_builder_output_source_alias.py)" = "f23cd936ace4019e654f5042f3cb476e3682f2a2"
          test "$(git hash-object tests/test_v031_o65_xattr_capture.py)" = "a1fea48b62b53f417afa19fbbba805fee090736e"
          test "$(git hash-object tests/test_v031_hardlinked_symlink_o67.py)" = "71f6013453b350b9c13e47138c57d0d977e16a25"
          test "$(git hash-object tests/test_v031_win32_builder_hardlink_o47.py)" = "6c00ae49eea075957453d6d7238d988add6eedee"
          test "$(git hash-object tests/test_v031_special_entries_o48.py)" = "d4a22da7d634a5dd6a1e1fb132ed1ceae2249ab6"
          test "$(git hash-object tests/test_v031_builder_composition_o50.py)" = "44f66dcf220231c1271d56bbff26da290d32d20c"
          test "$(git hash-object tests/test_v031_builder_parent_parity_o50.py)" = "5b7e2bc50971ca5801038b3598d2e2af36235074"
          test "$(git hash-object tests/test_v031_win32_ads_refusal_o57.py)" = "abd88c8c7394fac15d4d98a5f3cca0844bd8dff6"
          test "$(git hash-object tests/test_v031_ntfs_empty_dir_guard_o61d2.py)" = "abb81c6ab670d35b618c0759507594cc1303a463"
          test "$(git hash-object tests/test_v031_ntfs_directory_admission_o64.py)" = "31932cf79bed9930657fc0aba786eb7c0af59baa"
          git diff --exit-code 4d65f1bcbc68f1ad770e706197ece8355dd10637 HEAD -- src/cmpct/reader.py src/cmpct/transactions.py src/cmpct/codec.py src/cmpct/ntfs_streams.py native/ benchmarks/universal_bench.py benchmarks/history tools/check_performance_regression.py
          echo "O84_HEAD=$(git rev-parse HEAD)"
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder, cmpct.reader, cmpct.ntfs_streams
          root=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip()).resolve()
          for module in (cmpct.builder, cmpct.reader, cmpct.ntfs_streams):
              p=Path(module.__file__).resolve()
              assert not p.is_relative_to(root), ("not installed product",p)
              print("O84_INSTALLED="+str(p),flush=True)
          PY
          mkdir -p o84-isolated
          for name in \
            test_v031_win32_builder_hardlink_o47.py \
            test_v031_special_entries_o48.py \
            test_v031_builder_composition_o50.py \
            test_v031_builder_parent_parity_o50.py \
            test_v031_win32_ads_refusal_o57.py \
            test_v031_ntfs_empty_dir_guard_o61d2.py \
            test_v031_ntfs_directory_admission_o64.py \
            test_v031_o65_xattr_capture.py \
            test_v031_hardlinked_symlink_o67.py \
            test_v031_o80_builder_fidelity_composition.py \
            test_v031_o81_builder_output_source_alias.py \
            test_v031_o84_builder_output_fidelity_interaction.py; do
              cp "tests/$name" o84-isolated/
          done
          python -m pytest -vv -s o84-isolated/ --junitxml=o84-results.xml 2>&1 | tee o84-results.log
          python - <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          # O80 has 36 Linux or 37 macOS/Win32 collected cases due to errno aliases;
          # O81 adds eight unchanged cases and O84 two independent interactions.
          expected_total=46 if sys.platform.startswith("linux") else 47
          expected_skips=(7 if sys.platform.startswith("linux") else 8 if sys.platform=="darwin" else 11)
          cases=list(ET.parse("o84-results.xml").getroot().iter("testcase"))
          counts={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          counts["total"]=len(cases)
          counts["passed"]=counts["total"]-sum(counts[k] for k in ("failure","error","skipped"))
          print("O84_JUNIT="+json.dumps(counts,sort_keys=True),flush=True)
          assert counts["total"]==expected_total,counts
          assert counts["skipped"]==expected_skips,counts
          assert counts["failure"]==counts["error"]==0,counts
          assert counts["passed"]==expected_total-expected_skips,counts
          for tag in ("o64","o65","o67","o80","o81","o84"):
              assert any(tag in c.get("classname","").lower() or tag in c.get("name","").lower() for c in cases),tag
          print("O84_ACTUAL_PASSES="+str(counts["passed"]),flush=True)
          PY
      - name: Preserve raw logs and JUnit on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o84-installed-${{ matrix.os }}-${{ github.sha }}
          path: |
            o84-results.xml
            o84-results.log
          if-no-files-found: warn
          retention-days: 30
