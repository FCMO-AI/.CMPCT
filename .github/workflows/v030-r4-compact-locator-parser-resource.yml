# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 compact locator parser resources

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_compact_locator_parser_resource_referee.py'
      - '.github/workflows/v030-r4-compact-locator-parser-resource.yml'
  workflow_dispatch:

permissions: {contents: read}

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-locator-parser-resource-${{ github.sha }}
  cancel-in-progress: false

jobs:
  parser-resource-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_compact_locator_parser_resource_referee.py
      - name: Run fresh-process parser resource referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_compact_locator_parser_resource_referee.py \
            --output benchmark-artifacts/v030-r4-locator-parser-resource.json
      - name: Assert receipt integrity, not verdict
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-locator-parser-resource.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['same_raw_locator_bytes'] and d['contract']['fresh_process_per_contender']
          assert d['comparison']['same_input_and_cardinality']
          assert d['input']['raw_bytes'] <= 900000 and d['input']['records'] > 100000
          print(json.dumps(d,sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-compact-locator-parser-resource.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-compact-locator-parser-resource-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-locator-parser-resource.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity. The JSON owns the scientific verdict.
