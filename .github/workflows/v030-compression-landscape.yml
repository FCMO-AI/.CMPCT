# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 broad compression landscape

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_compression_landscape.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - '.github/workflows/v030-compression-landscape.yml'
  workflow_dispatch:

permissions:
  contents: read

# A completed landscape is reference evidence bound to the exact source SHA. A newer PR push cannot make an
# already-running exact receipt stale; cancelling it merely burns the expensive 15-workload measurement and leaves
# no result. Queue the newer run behind the existing receipt instead, then let its newest-head gate decide whether
# another landscape is actually required.
concurrency:
  group: cmpct-v030-compression-landscape-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/(v030_compression_landscape|v030_external_competitors|neutral_hostile_corpus_v1|resemblance_hostile_corpus_v1|v030_release_generalization)\.py|experiments/entropygraph_v030_release_product(_base)?\.py|\.github/workflows/v030-compression-landscape\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but the newest exact commit cannot affect the compression landscape; preserving the prior exact receipt instead of replaying it.'
          fi

  landscape:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Install compression landscape tools from canonical Ubuntu feed
        shell: bash
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y --no-install-recommends \
            zstd zip unzip p7zip-full zpaq brotli lz4 lzip ffmpeg gcc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Keep benchmark dependency authority in pyproject.toml instead of duplicating a hand-maintained list.
          python -m pip install -e '.[test]'

      - name: Record tool identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          {
            echo "candidate=${{ steps.candidate.outputs.sha }}"
            python --version
            zstd --version | head -1
            7z | head -3 | tail -1 || true
            zpaq 2>&1 | head -2 | tail -1 || true
            brotli --version || true
            lz4 --version || true
            lzip --version | head -1 || true
            xz --version | head -1
            gzip --version | head -1
            bzip2 --help 2>&1 | head -1 || true
          } > benchmark-artifacts/v030-compression-landscape-tools.txt

      - name: Run exact 15-workload landscape
        shell: bash
        run: |
          set -euo pipefail
          python -m benchmarks.v030_compression_landscape \
            --candidate-sha '${{ steps.candidate.outputs.sha }}' \
            --output benchmark-artifacts/v030-compression-landscape.json \
            --markdown benchmark-artifacts/v030-compression-landscape.md

      - name: Verify receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-compression-landscape.json')
          obj=json.loads(p.read_text())
          expected=os.environ['EXPECTED_SHA']
          assert obj['candidate_sha'] == expected, (obj['candidate_sha'], expected)
          assert len(obj['rows']) == 15
          assert obj['contract']['release_gate_impact'] == 'none-reference-only'
          for row in obj['rows']:
              for name, item in row['formats'].items():
                  if item.get('available'):
                      assert item.get('tree_verified') is True, (row['label'], name)
          PY
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-compression-landscape.yml

      - name: Upload reference landscape
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-compression-landscape-${{ steps.candidate.outputs.sha }}
          path: |
            benchmark-artifacts/v030-compression-landscape.json
            benchmark-artifacts/v030-compression-landscape.md
            benchmark-artifacts/v030-compression-landscape-tools.txt
          if-no-files-found: error
          retention-days: 90

# Reference landscape only. It may discover better competitors or falsify a representation family, but it grants
# no release credit by itself and never weakens the exact external-competitor authority.
