# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 exact FastCDC vector oracle

on:
  push:
    branches: [agent/v030-fastcdc-exact-vector-oracle]
    paths:
      - 'benchmarks/v030_fastcdc_exact_vector_oracle.py'
      - '.github/workflows/v030-fastcdc-exact-vector-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-fastcdc-vector-${{ github.sha }}
  cancel-in-progress: false

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact research head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_fastcdc_exact_vector_oracle.py
      - name: Run exact-boundary ML oracle
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_fastcdc_exact_vector_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-fastcdc-exact-vector-oracle.json" \
            --repeats 2
      - name: Enforce research claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-fastcdc-exact-vector-oracle.json').read_text())
          assert d['schema']=='cmpct-v030-fastcdc-exact-vector-oracle-v1'
          assert d['release_credit'] is False
          assert d['large_file_count'] > 0 and d['large_file_bytes'] > 0
          assert d['all_boundaries_identical'] is True
          assert d['baseline_total_s'] > 0 and d['vector_total_s'] > 0
          assert d['max_transient_scratch_bytes'] >= 0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-fastcdc-exact-vector-oracle-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-fastcdc-exact-vector-oracle.json
          if-no-files-found: error
          retention-days: 90

# Research-only micro evidence. Green does not alter product/release thresholds or earn release credit.
