# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 EG08 verifier I/O oracle

on:
  workflow_dispatch:

concurrency:
  group: v030-eg08-verifier-io-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  eg08-verifier-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact verifier-I/O oracle
        run: python -m py_compile benchmarks/v030_eg08_verifier_io_oracle.py
      - name: Run exact-semantics verifier-I/O A/B
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_eg08_verifier_io_oracle \
            --work-root benchmark-artifacts/v030-eg08-verifier-io-work \
            --output benchmark-artifacts/v030-eg08-verifier-io.json
      - name: Independently enforce verification identity and evidence boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-eg08-verifier-io.json')
          assert p.exists(), 'EG08 verifier-I/O evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-eg08-verifier-io-v2'
          g=d['gate']
          assert d['rounds']==15
          assert g['exact_verification_identity'] is True
          assert g['physical_corruption_rejected_by_both'] is True
          assert g['experiment_valid'] is True
          assert g['release_credit'] is False
          assert isinstance(g['material_speedup'], bool)
          assert isinstance(g['promotion_signal'], bool)
          assert g['promotion_signal'] is g['material_speedup']
          assert d['minimum_material_relative_improvement']==0.15
          assert d['minimum_material_absolute_saving_s']==0.005
          PY
      - name: Upload verifier-I/O evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-verifier-io-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-eg08-verifier-io.json
          if-no-files-found: warn
          retention-days: 90

# Exact 15-round evidence at a9ec256c4dd62e974bfac44563f239cc989c62d2 preserved verification identity
# and corruption rejection but measured tmpfs verification only 3.95% faster (88.412 ms -> 84.915 ms), saving
# 3.496 ms: below both the 15% relative and 5 ms absolute materiality thresholds. This proves filesystem I/O is not
# the dominant EG08 verifier bottleneck. Preserve the oracle manually; automatic PR replay would be time-filling.
