# ci-lane: fast
name: v0.31 J24B11 signed sparse quota fix transfer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/j24b11_sparse_quota_fix_transfer.py'
      - '.github/workflows/v031-j24b11-sparse-quota-transfer.yml'
      - 'docs/v031-research/2026-10-28-j24b11-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-existing-sparse-helper-court:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact J24B11 transfer source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin actual Git source HEAD
        shell: bash
        run: |
          git rev-parse HEAD | tee j24b11-head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git status --short
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual inherited product wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel
          python -m pip install .
      - name: Execute independent signed quota transfer and canary preservation
        shell: bash
        run: python research/j24b11_sparse_quota_fix_transfer.py --out j24b11-artifacts
      - name: Preserve source/negative evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b11-existing-sparse-helper-${{ matrix.os }}-${{ github.run_id }}
          path: |
            j24b11-head.txt
            j24b11-artifacts/**
          if-no-files-found: warn
          retention-days: 30
