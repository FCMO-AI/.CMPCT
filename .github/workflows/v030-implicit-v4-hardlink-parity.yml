name: v030 implicit-v4 hardlink metadata parity

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'native/cmpct-portable/src/manifest.rs'
      - 'native/cmpct-portable/src/implicit_v4_vector_tests.rs'
      - '.github/workflows/v030-implicit-v4-hardlink-parity.yml'

permissions:
  contents: read

jobs:
  hardlink-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frozen-vector Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Wire frozen unit-test module in the CI workspace only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('native/cmpct-portable/src/lib.rs')
          text = path.read_text()
          module = '#[cfg(test)]\nmod implicit_v4_vector_tests;\n'
          anchor = '#[cfg(test)]\nmod logs_preparity_tests;'
          if module not in text:
              if anchor not in text:
                  raise SystemExit('portable test-module anchor missing; court invalid')
              text = text.replace(anchor, module + anchor, 1)
              path.write_text(text)
          PY
      - name: Prove portable baseline compiles before adjudication
        run: cargo test --manifest-path native/cmpct-portable/Cargo.toml --release --no-run
      - name: Run independent implicit-v4 hardlink parity court
        run: |
          cargo test --manifest-path native/cmpct-portable/Cargo.toml \
            implicit_v4_vector_tests \
            --release -- --nocapture
