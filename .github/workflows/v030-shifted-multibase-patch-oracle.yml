# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted bounded multi-base patch oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_multibase_patch_oracle.py'
      - '.github/workflows/v030-shifted-multibase-patch-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_shifted_multibase_patch_oracle.py'
      - '.github/workflows/v030-shifted-multibase-patch-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shifted-multibase-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_shifted_multibase_patch_oracle\.py|\.github/workflows/v030-shifted-multibase-patch-oracle\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  decisive-oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Static compile and domination-contract guard
        run: |
          python -m py_compile benchmarks/v030_shifted_multibase_patch_oracle.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-multibase-patch-oracle.yml
          python tools/check_public_surface.py
      - name: Run exact complete-artifact multi-base R4 oracle
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_multibase_patch_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-multibase-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-multibase-patch.json"
      - name: Enforce exact receipt and terminal decision boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-multibase-patch.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-multibase-patch.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-multibase-patch-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['diagnosis']=='D4' and d['radicality']=='R4'
          assert 'S1' in d['saturation']
          assert d['contract']['benchmark_identity_used_in_representation'] is False
          assert d['contract']['single_complete_artifact'] is True
          assert d['contract']['direct_zstd19_fallback_per_member'] is True
          assert d['contract']['max_context_amplification']==8.0
          assert d['contract']['creation_prices_all_patch_attempts'] is True
          assert d['contract']['release_credit'] is False
          assert len(d['arms'])==3
          assert [a['base_count'] for a in d['arms']]==[2,3,4]
          for a in d['arms']:
              assert a['tree_verified'] is True
              assert a['max_context_amplification'] <= 8.0
              assert len(a['artifact_sha256'])==64
              assert a['patch_attempts'] > 0
          assert d['summary']['release_credit'] is False
          PY
      - name: Upload exact research evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-multibase-patch-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-multibase-patch.json
          if-no-files-found: error
          retention-days: 90

# Research-only R4 falsification. A strict candidate win authorizes only the next
# productization prerequisite; it cannot unlock v0.30 or weaken any release law.
