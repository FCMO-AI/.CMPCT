# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 O216 fixed-chunk strict validation fastpath oracle

on:
  push:
    branches:
      - agent/phased3-v031-o216-fixed-chunk-fast-validator-oracle-20261027
  pull_request:
    paths:
      - 'research/o216_fixed_chunk_validator_fastpath_oracle.py'
      - '.github/workflows/v031-o216-fixed-chunk-validator-oracle.yml'
      - 'docs/v031-research/2026-10-27-o216-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o216-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Source-exact r24 fixed-chunk validation A/B (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve source and original validator identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:src/cmpct/validation.py)" = 51c2849061f99a4afeddb7666956b24566ce7de0
          git merge-base --is-ancestor c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD
          python -m py_compile research/o216_fixed_chunk_validator_fastpath_oracle.py
          mkdir -p o216-evidence
          git rev-parse HEAD > o216-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > o216-evidence/reader.blob
          git rev-parse HEAD:src/cmpct/validation.py > o216-evidence/validation.blob
      - name: Independently install CMPCT reference reader
        shell: bash
        run: python -m pip install . pytest
      - name: Preserve existing O215 exact-court acceptance
        shell: bash
        run: |
          set -euo pipefail
          cp tests/test_o215_fixed_chunk_admission.py "$RUNNER_TEMP/test_o215_fixed_chunk_admission.py"
          cd "$RUNNER_TEMP"
          python -m pytest -q test_o215_fixed_chunk_admission.py > "$GITHUB_WORKSPACE/o216-evidence/o215-inherited-tests.txt" 2>&1
          cat "$GITHUB_WORKSPACE/o216-evidence/o215-inherited-tests.txt"
      - name: Run three-arm original-vs-exception-only-vs-unguarded oracle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA" python research/o216_fixed_chunk_validator_fastpath_oracle.py \
            --output o216-evidence/o216-raw.json 2>&1 | tee o216-evidence/o216-run.log
          test -s o216-evidence/o216-raw.json
          grep -q 'O216_DECISION=' o216-evidence/o216-run.log
      - name: Preserve raw evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o216-${{ github.event.pull_request.head.sha || github.sha }}
          path: o216-evidence/
          retention-days: 30
          if-no-files-found: warn
