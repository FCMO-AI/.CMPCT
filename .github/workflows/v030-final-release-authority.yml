name: CMPCT v0.30 final release authority
# ci-lane: release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'benchmarks/v030_release_generalization_canonical.py'
      - 'benchmarks/v030_release_ablation_product.py'
      - 'benchmarks/v030_release_ablation_canonical.py'
      - 'benchmarks/v030_release_performance_canonical.py'
      - 'benchmarks/v030_release_selective_read_canonical.py'
      - 'benchmarks/v030_perf_worker_canonical.py'
      - 'benchmarks/v030_external_competitors_canonical.py'
      - 'tests/test_v030_canonical_final.py'
      - '.github/workflows/v030-final-release-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-final-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile the promoted product/evidence surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_canonical_final.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/v030_perf_worker_canonical.py \
            benchmarks/v030_release_generalization_canonical.py \
            benchmarks/v030_release_ablation_product.py \
            benchmarks/v030_release_performance_canonical.py \
            benchmarks/v030_release_selective_read_canonical.py \
            benchmarks/v030_external_competitors_canonical.py
      - name: Run product boundary and benchmark-contract tests
        run: |
          python -m pytest -q \
            tests/test_v030_canonical_final.py \
            tests/test_v030_release_ablation_contract.py \
            tests/test_v030_release_selective_read_contract.py \
            tests/test_v030_release_generalization_contract.py
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-final-release-authority.yml

  compression-and-product-parity:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run exact release-product 15-workload compression gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_generalization_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/final-generalization-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/final-generalization.json"
      - name: Run historical-causality plus genuine r24-vs-r25 product parity
        run: |
          python benchmarks/v030_release_ablation_product.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/final-ablation-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/final-ablation.json"
      - name: Enforce immutable release thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('benchmark-artifacts/final-generalization.json').read_text())
          a=json.loads(Path('benchmark-artifacts/final-ablation.json').read_text())
          assert g['engine']=='experiments/entropygraph_v030_release_product.py'
          assert g['release_facade']=='cmpct-v030-release-product-v1'
          assert g['contract']['expected_v029_aggregate_bytes']==137501815
          assert g['contract']['minimum_release_saving_bytes']==687783
          assert g['totals']['workloads']==15
          assert g['totals']['workloads_regressed']==0
          assert g['totals']['workloads_improved']>=3
          assert g['totals']['saving_vs_v029_bytes']>=687783
          assert g['totals']['max_selected_member_read_amplification']<=8.0
          assert g['gate']['passed'] is True
          assert a['product_engine']=='experiments/entropygraph_v030_release_product.py'
          assert a['gate']['historical_causality_passed'] is True
          assert a['gate']['canonical_product_parity_passed'] is True
          assert a['canonical_product_parity']['gate']['zero_product_byte_regressions'] is True
          assert a['canonical_product_parity']['gate']['aggregate_product_no_regression'] is True
          PY
      - name: Upload release compression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-final-compression-${{ github.sha }}
          path: |
            benchmark-artifacts/final-generalization.json
            benchmark-artifacts/final-ablation.json
          if-no-files-found: warn
          retention-days: 90

  runtime-and-selective-read:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run fresh-process release-product runtime gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_performance_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/final-runtime-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/final-runtime.json"
      - name: Run operation-derived selective-read gate
        run: |
          python benchmarks/v030_release_selective_read_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/final-selective-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/final-selective.json"
      - name: Enforce runtime/locality policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/final-runtime.json').read_text())
          s=json.loads(Path('benchmark-artifacts/final-selective.json').read_text())
          assert r['engine']=='experiments/entropygraph_v030_release_product.py'
          assert r['release_facade']=='cmpct-v030-release-product-v1'
          assert r['totals']['median_create_ratio']<=1.10
          assert r['totals']['max_workload_create_ratio']<=1.25
          assert r['totals']['median_extract_ratio']<=1.10
          assert r['totals']['max_workload_extract_ratio']<=1.25
          assert r['totals']['max_peak_rss_ratio']<=1.25
          assert r['gate']['passed'] is True
          assert s['gate']['passed'] is True
          assert s['totals']['max_member_read_amplification']<=8.0
          PY
      - name: Upload release runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-final-runtime-${{ github.sha }}
          path: |
            benchmark-artifacts/final-runtime.json
            benchmark-artifacts/final-selective.json
          if-no-files-found: warn
          retention-days: 90

  external-frontier:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CMPCT and external compressors
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd p7zip-full zpaq gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run symmetric exact-tree external frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_external_competitors_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/final-external-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/final-external.json"
      - name: Enforce competitor extraction/size contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/final-external.json').read_text())
          assert d['engine']=='experiments/entropygraph_v030_release_product.py'
          assert d['release_facade']=='cmpct-v030-release-product-v1'
          assert d['gate']['passed'] is True
          PY
      - name: Upload external frontier evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-final-external-${{ github.sha }}
          path: benchmark-artifacts/final-external.json
          if-no-files-found: warn
          retention-days: 90

# Footnote: these jobs are the final Python/product benchmark authority. Native/shared-reader, recovery/fuzz,
# Android/portability, shared-build rehabilitation, version discipline and live-publication receipts remain
# separate mandatory release gates; no single green benchmark job can authorize publication by itself.
