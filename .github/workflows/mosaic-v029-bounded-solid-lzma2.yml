name: CMPCT v0.29 bounded solid LZMA2 ceiling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-bounded-solid-lzma2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-solid-lzma2-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_bounded_solid_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Measure bounded solid LZMA2 record clusters
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_bounded_solid_lzma2_oracle.py \
            benchmark-artifacts/resemblance-hostile \
            --work-root benchmark-artifacts/CMPCT_V029_Bounded_Solid_LZMA2 \
            --output benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.stdout.txt

      - name: Enforce frozen bounded-solid contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.json').read_text())
          assert r['schema'] == 'cmpct-v029-bounded-solid-lzma2-oracle-v1'
          p=r['policy']; b=r['best']
          assert p['cluster_limits_bytes'] == [512 << 10, 1 << 20, 2 << 20], r
          assert p['dictionary_sizes_bytes'] == [1 << 20, 4 << 20, 8 << 20], r
          assert p['max_member_materialization_amplification'] == 8.0, r
          assert p['min_net_saving_bytes'] == 128 * 1024, r
          assert p['min_profitable_groups'] == 4, r
          assert p['physical_order_frozen'] is True, r
          assert p['logical_dependency_depth_unchanged'] is True, r
          assert p['roundtrip_verified_per_group'] is True, r
          assert b['max_member_amplification'] <= 8.0, r
          print(json.dumps({'best': b, 'research_gate_pass': r['research_gate_pass']}, indent=2))
          PY

      - name: Focused bounded-solid tests
        run: python -m pytest -q tests/test_v029_bounded_solid_lzma2_oracle.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize bounded-solid ceiling
        if: always()
        run: |
          if [ -f benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.json').read_text())
          b=r['best']
          print('## CMPCT v0.29 — bounded solid LZMA2 record clusters')
          print(f"- attempt-5 source archive: **{r['source_archive']['bytes']:,} B**")
          print(f"- best cluster ceiling: **{b['cluster_limit_bytes'] // 1024} KiB**")
          print(f"- best dictionary bound: **{b['dictionary_bytes'] // (1<<20)} MiB**")
          print(f"- profitable groups: **{b['profitable_groups']}**")
          print(f"- exact net saving after framing charges: **{b['net_saving_bytes']:,} B**")
          print(f"- max selected member materialization: **{b['max_member_amplification']:.3f}x**")
          print(f"- frozen >=128 KiB / >=4-group / <=8x gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          print('- Logical dependency depth remains unchanged; attempt-5 bytes are not rewritten by this oracle.')
          PY
          fi

      - name: Upload bounded-solid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v029-bounded-solid-lzma2-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.json
            benchmark-artifacts/mosaic-v029-bounded-solid-lzma2.stdout.txt
          if-no-files-found: warn

# Footnote: independent LZMA2 saved only 152 B. This oracle tests bounded solidity rather than another
# per-record codec knob. If it also rejects, LZMA2 leaves the active v0.29 search rather than being tuned.
