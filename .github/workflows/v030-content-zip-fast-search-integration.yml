# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 content-ZIP fast-search integration
on:
  push:
    branches: [agent/v030-content-zip-fused-fast-search]
    paths:
      - 'benchmarks/v030_content_zip_fast_search_integration.py'
      - '.github/workflows/v030-content-zip-fast-search-integration.yml'
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_content_zip_fast_search_integration.py'
      - '.github/workflows/v030-content-zip-fast-search-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v030-content-zip-fast-search-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}
jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_content_zip_fast_search_integration\.py|\.github/workflows/v030-content-zip-fast-search-integration\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi
  integration:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile falsifier
        run: python -m py_compile benchmarks/v030_content_zip_fast_search_integration.py
      - name: Measure final-form admitted-path economics
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_content_zip_fast_search_integration.py --output benchmark-artifacts/fast-search.json 2>&1 | tee benchmark-artifacts/run.log
      - name: Enforce evidence contract
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/fast-search.json'))
          assert d['schema']=='cmpct-v030-content-zip-fast-search-integration-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['diagnostic_only'] and not d['contract']['shipping_code_changed']
          assert not d['contract']['admission_policy_changed'] and d['contract']['all_levels_exhausted_before_failure']
          assert d['contract']['full_tree_verified'] and d['contract']['range_reads_verified']
          assert len(d['rows'])==6 and d['repetitions_per_arm']==3
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-content-zip-fast-search-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30

# Research evidence only. Product code, format, admission and release gates are unchanged.
