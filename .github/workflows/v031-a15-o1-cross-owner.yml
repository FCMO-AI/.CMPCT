name: v0.31 A15-O1 Cross-Owner Scientific Court
on:
  push:
    branches:
      - agent/phased1-v031-a15-o1-cross-owner-falsifier-20261028
  pull_request:
    paths:
      - 'research/a15_o1_*'
      - '.github/workflows/v031-a15-o1-cross-owner.yml'
      - 'docs/v031-research/2026-10-28-a15-o1-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-cross-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install explicit Zstd CLI control
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          python3 --version
          zstd --version
      - name: Confirm exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          sha256sum research/a15_o1_cross_owner_oracle.py research/a15_o1_independent_referee.py
      - name: Execute source-locked six-case scientific oracle
        run: python3 research/a15_o1_cross_owner_oracle.py --out a15-o1-evidence
      - name: Execute independent byte-exact reparser and forged-receipt referee
        run: python3 research/a15_o1_independent_referee.py --root a15-o1-evidence
      - name: Execute source-locked in-process matched-decoder cost court
        run: python3 research/a15_o1b_inprocess_decode_court.py --root a15-o1-evidence
      - name: Independently audit in-process raw timing and byte identities
        run: python3 research/a15_o1b_independent_referee.py --root a15-o1-evidence
      - name: Preserve source identity
        if: always()
        run: |
          mkdir -p a15-o1-evidence
          git rev-parse HEAD > a15-o1-evidence/head.txt
          sha256sum research/a15_o1_cross_owner_oracle.py research/a15_o1_independent_referee.py research/a15_o1b_inprocess_decode_court.py research/a15_o1b_independent_referee.py > a15-o1-evidence/source-hashes.txt
      - name: Publish unmodified raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a15-o1-cross-owner-raw
          path: a15-o1-evidence/
          if-no-files-found: warn
          retention-days: 30
