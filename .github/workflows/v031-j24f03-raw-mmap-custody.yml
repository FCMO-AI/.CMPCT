# ci-lane: fast
name: v031 J24F03 RAW mmap hash-to-write custody court
on:
  pull_request:
    paths:
      - 'research/j24f03_raw_chunk_mmap_hashwrite.py'
      - '.github/workflows/v031-j24f03-raw-mmap-custody.yml'
      - 'docs/v031-research/2026-10-26-j24f03-raw-hashwrite-prereg.md'
      - 'docs/v031-research/2026-10-26-j24f03-raw-hashwrite-result.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: j24f03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j24f03-source-bound-court:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Reader source custody and exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          git show -s --format='%H %s' HEAD
      - name: Install exact source as ordinary Python package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Reproduce RAW mmap hash/write source mutation
        shell: bash
        run: |
          python research/j24f03_raw_chunk_mmap_hashwrite.py --output "${{ github.workspace }}/j24f03-${{ runner.os }}.json"
          test -s "${{ github.workspace }}/j24f03-${{ runner.os }}.json"
          mkdir -p evidence-artifacts
          cp "${{ github.workspace }}/j24f03-${{ runner.os }}.json" evidence-artifacts/j24f03.json
          test -s evidence-artifacts/j24f03.json
      - name: Preserve original structured observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24f03-${{ runner.os }}-${{ github.sha }}
          path: evidence-artifacts/j24f03.json
          if-no-files-found: error
          retention-days: 30
