# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted post-PrefixGraph G04 audition oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_post_prefixgraph_g04_audition_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization*.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v6.py'
      - 'experiments/entropygraph_v030_release_product*.py'
      - 'experiments/entropygraph_v030_canonical_final*.py'
      - 'experiments/entropygraph_v030_prefixgraph_process_executor.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'docs/v030-rnd/R25_SHIFTED_POST_PREFIXGRAPH_G04_AUDITION_ORACLE_PREREG.md'
      - '.github/workflows/v030-shifted-post-prefixgraph-g04-audition.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-shifted-post-pg-g04-classifier-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_shifted_post_prefixgraph_g04_audition_oracle\.py|benchmarks/v030_release_(performance|generalization.*)\.py|benchmarks/resemblance_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v6\.py|experiments/entropygraph_v030_(release_product.*|canonical_final.*|prefixgraph_process_executor|prefixgraph)\.py|docs/v030-rnd/R25_SHIFTED_POST_PREFIXGRAPH_G04_AUDITION_ORACLE_PREREG\.md|\.github/workflows/v030-shifted-post-prefixgraph-g04-audition\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  hostile-review:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: cmpct-v030-shifted-post-pg-g04-receipt-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic runtime dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen instrument and relevant product surfaces
        run: |
          python -m py_compile \
            benchmarks/v030_shifted_post_prefixgraph_g04_audition_oracle.py \
            experiments/entropygraph_v030_release_product.py \
            experiments/entropygraph_v030_canonical_final.py \
            experiments/entropygraph_v030_prefixgraph_process_executor.py
      - name: Run five-pair fresh-process control versus nomination-only O0
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_post_prefixgraph_g04_audition_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-post-pg-g04-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-post-pg-g04.json"
      - name: Enforce frozen decision grammar and zero release credit
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-post-pg-g04.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-post-pg-g04.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-post-prefixgraph-g04-audition-o0-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='resemblance_hostile_v1/01_shifted_versions'
          assert int(d['accepted_v029_bytes'])==1723056
          assert len(d['pairs'])==5
          c=d['contract']
          assert float(c['supported_max_ratio'])==0.80
          assert float(c['supported_min_saving_s'])==5.0
          assert float(c['ambiguous_max_ratio'])==0.90
          assert float(c['not_supported_below_saving_s'])==2.0
          assert float(c['locality_ceiling'])==8.0
          assert c['oracle_gift']=='exact-winning-r25-family-nomination-only'
          assert c['representation_bytes_gifted'] is False and c['r24_bytes_gifted'] is False
          assert d['release_credit'] is False and c['release_credit'] is False
          allowed={
              'SHIFTED_POST_PG_G04_AUDITION_HEADROOM_SUPPORTED',
              'SHIFTED_POST_PG_G04_AUDITION_HEADROOM_AMBIGUOUS',
              'SHIFTED_POST_PG_G04_AUDITION_HEADROOM_NOT_SUPPORTED',
              'INVALID',
          }
          assert d['decision'] in allowed
          for row in d['pairs']:
              assert row['control']['g04_executed'] is True
              assert row['oracle']['g04_executed'] is False
              assert row['oracle']['prefixgraph_child_exited_before_publication'] is True
              assert row['control']['release_credit'] is False and row['oracle']['release_credit'] is False
          if d['decision'] != 'INVALID':
              assert not d['invalid_reasons']
              assert all(all(row['checks'].values()) for row in d['pairs'])
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-shifted-post-prefixgraph-g04-audition.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact frozen evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-post-pg-g04-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-post-pg-g04.json
          if-no-files-found: error
          retention-days: 90

# O0 only: a positive result authorizes a sound deployable stopping-proof experiment, never a product skip.
