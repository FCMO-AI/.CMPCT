# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24G65 — DELETE only, research-phase attribution (no product source changes).
name: CMPCT J24G65 authentic DELETE journal phase attribution

on:
  push:
    branches:
      - agent/phased2-v031-j24g65-delete-phase-attribution-20261030
    paths:
      - 'research/j24g65_*'
      - 'docs/v031-research/*j24g65*'
      - '.github/workflows/v031-j24g65-delete-phase-attribution.yml'
  pull_request:
    branches:
      - agent/phased2-v031-j24g63-public-put-delete-chain-court-20261030
    paths:
      - 'research/j24g65_*'
      - 'docs/v031-research/*j24g65*'
      - '.github/workflows/v031-j24g65-delete-phase-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g65-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authentic-delete-attribution:
    runs-on: \${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
      J24G65_RESULT: evidence/j24g65-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attest prospective decision and unchanged inherited Writer/Reader source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 7f509d244325d4b6ea6d0e752ea365f79c33a742 HEAD
          git merge-base --is-ancestor 260951c6631910ed145aebc03b1868cb5770a46c HEAD
          git diff --exit-code 7f509d244325d4b6ea6d0e752ea365f79c33a742 HEAD -- src/cmpct/ tests/conformance/ benchmarks/history/
          test "$(git rev-parse HEAD:src/cmpct/builder.py)" = a2160a2f6b1ca3ef8cd94897cb68bb2fcb74ebc2
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git rev-parse HEAD:src/cmpct/transactions.py)" = 3eef7fdc3f6deca5ddd6d9edf1292c7e2c864f11
          test "$(git rev-parse HEAD:src/cmpct/journal_replay.py)" = 03743ca2a06c022c2ec64243a90fe373cf91e899
          test "$(git rev-parse HEAD:src/cmpct/validation.py)" = 5ea3b8f26058b0983c9686295c73f15472bc3ffe
          git rev-parse HEAD > evidence/head.txt
          git rev-parse HEAD:src/cmpct/reader.py > evidence/reader-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CMPCT source and independent physical parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'zstandard>=0.22' 'msgpack>=1.0'
          python -m pip freeze > evidence/pip-freeze.txt
          python -m py_compile research/j24g60_single_delta_chain_court.py research/j24g63_public_put_delete_chain_court.py research/j24g63_independent_receipt_audit.py research/j24g65_delete_phase_attribution.py research/j24g65_detached_receipt_audit.py
      - name: Run public Writer DELETE phase-attribution court
        shell: bash
        run: |
          set -o pipefail
          python research/j24g65_delete_phase_attribution.py 2>&1 | tee evidence/j24g65-court.log
          test -s evidence/j24g65-result.json
      - name: Independently audit raw metrics, physical wire and hostile receipt changes
        shell: bash
        run: |
          set -o pipefail
          python research/j24g65_detached_receipt_audit.py evidence/j24g65-result.json "$EXPECTED_HEAD" evidence/j24g65-independent-audit.json 2>&1 | tee evidence/j24g65-audit.log
          test -s evidence/j24g65-independent-audit.json
      - name: Persist raw artifacts even on failed or inconclusive research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g65-delete-phase-\${{ matrix.os }}-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
