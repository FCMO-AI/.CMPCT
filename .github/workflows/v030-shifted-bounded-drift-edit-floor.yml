# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Shifted bounded-drift edit R4 floor

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_bounded_drift_edit_floor.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - '.github/workflows/v030-shifted-bounded-drift-edit-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shifted-bounded-drift-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  bounded-drift-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Validate decisive instrument
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/v030_shifted_bounded_drift_edit_floor.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-bounded-drift-edit-floor.yml
          python tools/check_public_surface.py
      - name: Run exact bounded-drift representation floor
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_bounded_drift_edit_floor.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-bounded-drift-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-bounded-drift.json"
      - name: Enforce exact decision boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-bounded-drift.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-bounded-drift.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-bounded-drift-edit-floor-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['diagnosis']=='D4' and d['radicality']=='R4' and int(d['rps'])>=80
          assert set(['S1','S3','S4']).issubset(d['saturation_inherited'])
          c=d['contract']
          assert c['benchmark_identity_used_in_representation'] is False
          assert c['base_selection']=='minimum logical-content SHA-256'
          assert c['sequential_copy_edit_grammar'] is True
          assert c['single_shared_edit_context'] is True
          assert c['max_chain_depth']==1
          assert c['publication_and_sha256_inside_candidate_timing'] is True
          assert c['release_credit'] is False
          x=d['candidate']
          assert x['tree_verified'] is True
          assert int(x['max_decode_unit_bytes'])<=8*1024*1024
          assert float(x['max_member_read_amplification'])<=8.0
          assert int(x['payload_floor_bytes'])<=int(x['archive_bytes'])
          assert int(x['records'])>0 and int(x['copied_bytes'])>0
          assert len(x['artifact_sha256'])==64
          h=d['hostile_reviewer']
          assert h['all_edit_construction_is_inside_candidate_timing'] is True
          assert h['base_and_edit_compression_are_inside_candidate_timing'] is True
          assert h['publication_and_sha256_are_inside_candidate_timing'] is True
          assert h['bounded_fallback_is_counted'] is True
          z=int(d['comparators']['tar_zstd19_solid']['bytes'])
          assert d['decision']['payload_floor_zstd_gap_bytes']==int(x['payload_floor_bytes'])-z
          assert d['decision']['archive_zstd_gap_bytes']==int(x['archive_bytes'])-z
          strict_expected=(
              int(x['archive_bytes']) < int(d['comparators']['zip_deflate9']['bytes'])
              and int(x['archive_bytes']) < z
              and float(x['create_seconds']) < float(d['comparators']['zip_deflate9']['create_s'])
              and float(x['create_seconds']) < float(d['comparators']['tar_zstd19_solid']['create_s'])
          )
          assert d['decision']['strict_four_way_win'] is strict_expected
          assert d['decision']['terminal'] in (
              'PROMOTE_NEXT_PREREQUISITE','REHABILITATE_DEBT','ITERATE_SAME_FAMILY','RETIRE_FAMILY')
          assert d['decision']['release_credit'] is False
          PY
      - name: Upload exact R4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-bounded-drift-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-bounded-drift.json
          if-no-files-found: error
          retention-days: 90

# STRUCTURAL_RED R4 research only. This lane intentionally runs from the authoritative
# integration-branch push rather than the long-lived PR event: PR path filters accumulate
# historical changes and would otherwise spawn a classifier-only workflow on every unrelated
# commit. Exact-head binding and preserved receipts remain intact. The family survives only
# if its actual base+edit payload changes the measured Zstd floor; a speed/size crossing still
# receives zero release credit until generic admission, canonical semantics, recovery, native,
# Android, selector and exact common-fingerprint authority are complete. Candidate creation
# prices edit search, compression, durable publication and SHA-256 binding before comparison.
