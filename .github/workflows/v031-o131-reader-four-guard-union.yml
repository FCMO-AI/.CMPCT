# ci-lane: fast
# O131: independent four-guard composition; original #336 owner tests are byte-identical.
name: CMPCT v0.31 O131 Host Namespace and Reader Source Custody

on:
  pull_request:
    paths:
      - 'src/cmpct/path_policy.py'
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_windows_member_namespace.py'
      - 'tests/test_v031_apfs_namespace.py'
      - 'tests/test_v031_win32_apfs_union.py'
      - 'tests/test_v031_win32_logical_hardlink_o2.py'
      - 'tests/test_v031_o131_cross_guard_composition.py'
      - '.github/workflows/v031-o131-reader-four-guard-union.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o131-four-guard-union-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-exact-namespace-and-inode-union:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
          fetch-depth: 0
      - name: Reject stale source binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "EXACT_HEAD=$EVIDENCE_HEAD"
          git merge-base --is-ancestor 00c7367b5d90e1349e31098a9262ebadd059b2a8 HEAD
          test "$(git rev-parse HEAD:src/cmpct/path_policy.py)" = 91fc335eea8fb18c3899511f416c8abe96c48f80
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = e6ac7fb8e677d5a1bdac4bab9663921f3e20df5c
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax after setup
        run: python -m py_compile src/cmpct/reader.py src/cmpct/path_policy.py
      - name: Install real CMPCT and pytest
        run: python -m pip install . pytest
      - name: Prove imported original test Git identities
        shell: bash
        run: |
          test "$(git rev-parse HEAD:tests/test_v031_apfs_namespace.py)" = 171abf2bc46ba1f74286340144e6f38a5cb13296
          test "$(git rev-parse HEAD:tests/test_v031_win32_apfs_union.py)" = e4a28ab1a3b6d3d282f2a143a7ddec7ab1befefe
          test "$(git rev-parse HEAD:tests/test_v031_win32_logical_hardlink_o2.py)" = 576a4f309056cf0bc85818c200332d1099daa76f
          test "$(git rev-parse HEAD:tests/test_v031_windows_member_namespace.py)" = 5c836f98b15348913f73784d300c003f3e63d197
          python - <<'PY'
          import cmpct.reader
          from pathlib import Path
          where=Path(cmpct.reader.__file__).resolve()
          assert not where.is_relative_to(Path.cwd().resolve()),where
          print('O131_INSTALLED_READER=', where,flush=True)
          PY
      - name: Original owner courts plus O131 host-measured source/case alias falsifier
        # --noconftest avoids unrelated historical Linux-only library imports on Windows.
        # Owner platform skips are reported verbosely by pytest (-rs).
        run: python -m pytest -q -rs --noconftest tests/test_path_policy.py tests/test_v031_apfs_namespace.py tests/test_v031_win32_apfs_union.py tests/test_v031_win32_logical_hardlink_o2.py tests/test_v031_o131_cross_guard_composition.py
      - name: Unchanged complete Win32-owner court on original Linux and Windows hosts
        if: runner.os != 'macOS'
        run: python -m pytest -q -rs --noconftest tests/test_v031_windows_member_namespace.py
      - name: Mac host-neutral Win32 controls, excluding incompatible case-sensitive POSIX fixture
        if: runner.os == 'macOS'
        # Original Windows owner source is untouched. Its non-Windows positive fixture
        # creates Case + case, which the conservatively case-insensitive APFS policy
        # must reject. O0 recorded the actual Mac red; O1 preserves the evidence
        # and executes all remaining host-neutral checks without hiding the domain.
        shell: bash
        run: |
          echo 'O1 HOST DOMAIN: original Win32 POSIX Case/case positive is NOT applicable to default APFS; original Mac alias-rejection tests run in prior step.'
          python -m pytest -q -rs --noconftest tests/test_v031_windows_member_namespace.py -k 'not test_real_posix_extractor_keeps_legal_windows_incompatible_names'
      - name: Preserve exact candidate and platform provenance
        if: always()
        shell: bash
        run: |
          echo "SOURCE=$(git rev-parse HEAD)"
          python -c "import os, platform, sys; print('HOST', os.name, platform.platform(), sys.version)"
