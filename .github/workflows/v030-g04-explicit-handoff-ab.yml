# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 G04 explicit handoff A/B
on:
  pull_request:
  push:
    branches: [agent/v030-g04-explicit-artifact-handoff]
    paths:
      - 'benchmarks/v030_g04_explicit_handoff_ab.py'
      - 'experiments/entropygraph_v029_parallel_portfolio_handoff.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04_explicit_handoff.py'
      - '.github/workflows/v030-g04-explicit-handoff-ab.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  classify-latest-head:
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-g04-explicit-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_receipt: ${{ steps.scope.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo 'run_receipt=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(benchmarks/v030_g04_explicit_handoff_ab\.py|experiments/entropygraph_v029_parallel_portfolio_handoff\.py|experiments/entropygraph_v030_geometry_overlay_g04_explicit_handoff\.py|\.github/workflows/v030-g04-explicit-handoff-ab\.yml)$'; then echo 'run_receipt=true' >> "$GITHUB_OUTPUT"; else echo 'run_receipt=false' >> "$GITHUB_OUTPUT"; fi
  explicit-handoff-ab:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: cmpct-v030-g04-explicit-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Compile explicit ownership seam and receipt
        run: python -m py_compile experiments/entropygraph_v029_parallel_portfolio_handoff.py experiments/entropygraph_v030_geometry_overlay_g04_explicit_handoff.py benchmarks/v030_g04_explicit_handoff_ab.py
      - name: Run balanced ML explicit-handoff A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_g04_explicit_handoff_ab.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/explicit-handoff.json"
      - name: Validate non-credit receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/explicit-handoff.json').read_text())
          assert d['schema']=='cmpct-v030-g04-explicit-handoff-ab-v1' and d['release_credit'] is False and len(d['pairs'])==4
          for p in d['pairs']:
              c,e=p['control'],p['explicit']; r=e['stats']['attempt5_retention']
              assert c['archive_sha256']==e['archive_sha256'] and c['tree_sha256']==e['tree_sha256']
              assert e['stats']['global_monkeypatches']==0 and e['stats']['ownership']=='explicit-artifact-handoff'
              assert r['payload_write_bytes']==0 and r['mode']=='same-filesystem-hardlink'
              assert r['retained_disk_occupancy_bytes']==r['bytes'] and r['bytes'] > 0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-g04-explicit-handoff-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/explicit-handoff.json
          if-no-files-found: error
          retention-days: 90
# Research evidence only; green never grants release credit. Exact-head identity and zero-copy custody are mandatory.
