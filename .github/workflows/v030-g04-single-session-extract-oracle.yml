# ci-lane: deep
name: CMPCT v0.30 G04 single-session extraction oracle

on:
  push:
    branches: [agent/v030-extract-single-session-oracle]
    paths:
      - 'benchmarks/v030_g04_single_session_extract_oracle.py'
      - '.github/workflows/v030-g04-single-session-extract-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install -e .
      - name: Run frozen-ML single-session extraction oracle
        run: python benchmarks/v030_g04_single_session_extract_oracle.py --rounds 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-g04-single-session-extract-oracle-${{ github.sha }}
          path: benchmark-artifacts/v030-g04-single-session-oracle.json
          if-no-files-found: warn
