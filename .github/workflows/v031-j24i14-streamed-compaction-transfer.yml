# ci-lane: fast
# ci-cancel-policy: cancel-obsolete-fast-pr-check
name: J24I14 exact streamed verifier compaction transfer

on:
  pull_request:
    paths:
      - "tests/research/j24i14_exact_streaming_compaction_transfer.py"
      - "docs/v031-research/2026-10-29-j24i14-*.md"
      - ".github/workflows/v031-j24i14-streamed-compaction-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24i14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-physical-source-exact-court:
    name: J24I14 original compaction A/B exact #613 transfer (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      DONOR_SHA: "3b2bf3c2e033fa27d77b2355821dc0087aa46873"
      CMPCT_J24I14_DONOR_PATH: ${{ runner.temp }}/j24i14-donor-reader.py
      CMPCT_J24I14_ARTIFACT_DIR: ${{ github.workspace }}/j24i14-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable source, preregistration and exact existing donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor c8156ae9c5e0518382fb0be9c9dd1fda2c8f249b HEAD
          git merge-base --is-ancestor 7544b25bf455ff02c8a168b441afcf2edfe008a2 HEAD
          git diff --exit-code 52d51b9446dc8876319f7bd1e6ca2b7f54681de8 HEAD -- src/cmpct/reader.py src/cmpct/builder.py src/cmpct/transactions.py native/ tests/conformance/ benchmarks/
          git fetch --no-tags origin "$DONOR_SHA"
          test "$(git rev-parse "$DONOR_SHA:src/cmpct/reader.py")" = "b2b7774c13a5c8235ff89786d171b7ea3ff20710"
          git show "$DONOR_SHA:src/cmpct/reader.py" > "$CMPCT_J24I14_DONOR_PATH"
          test "$(git hash-object "$CMPCT_J24I14_DONOR_PATH")" = "b2b7774c13a5c8235ff89786d171b7ea3ff20710"
          mkdir -p "$CMPCT_J24I14_ARTIFACT_DIR"
          git rev-parse HEAD > "$CMPCT_J24I14_ARTIFACT_DIR/head.txt"
          git rev-parse "$DONOR_SHA:src/cmpct/reader.py" > "$CMPCT_J24I14_ARTIFACT_DIR/donor-reader-blob.txt"
          for f in src/cmpct/reader.py src/cmpct/builder.py src/cmpct/transactions.py tests/research/j24i14_exact_streaming_compaction_transfer.py; do
            printf '%s %s\n' "$(git rev-parse "HEAD:$f")" "$f" >> "$CMPCT_J24I14_ARTIFACT_DIR/git-blobs.txt"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax and exact installed package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/research/j24i14_exact_streaming_compaction_transfer.py
          python -m pip install .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib, pathlib, os, hashlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          norm = lambda b: b.replace(b"\r\n", b"\n")
          for name in ("reader", "builder", "transactions"):
              mod = importlib.import_module("cmpct." + name)
              path = pathlib.Path(mod.__file__).resolve()
              expected = root / "src" / "cmpct" / (name + ".py")
              assert not path.is_relative_to(root)
              assert norm(path.read_bytes()) == norm(expected.read_bytes()), name
              print("INSTALLED_SOURCE_EXACT", name, hashlib.sha256(norm(path.read_bytes())).hexdigest())
          PY

      - name: Execute exact-input A/B/B/A and fail-closed hostile controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/research/j24i14_exact_streaming_compaction_transfer.py" | tee "$CMPCT_J24I14_ARTIFACT_DIR/stdout.txt"
          python - <<'PY'
          import json, pathlib, os
          c = json.loads((pathlib.Path(os.environ["CMPCT_J24I14_ARTIFACT_DIR"]) / "court.json").read_text())
          assert c["release_credit"] is False and c["product_implementation_changed"] is False
          assert len(c["cases"]) == 2 and all(len(x["raw_repetitions"]) == 4 for x in c["cases"])
          assert c["decision"] in {"EXACT_DONOR_TRANSFER_SUPPORTED", "TRANSFER_NOT_SUPPORTED_OR_AMBIGUOUS"}
          assert all(len(x["corruption_controls"]) == 2 for x in c["cases"])
          print("J24I14_ACTUAL_RESULT", c["decision"])
          PY

      - name: Always preserve source, result and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24i14-exact-streamed-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: j24i14-evidence/
          if-no-files-found: warn
          retention-days: 90
