# ci-lane: fast
# Scientific classifier: workflow success does not imply Reader safety.
name: CMPCT O201 authentic cdc chunk-length range semantic court
on:
  push:
    branches:
      - agent/phased1-v031-o201-cdc-descriptor-range-falsifier-20261026
  pull_request:
    branches:
      - agent/v031-development
    paths:
      - 'research/o201_cdc_chunk_range_court.py'
      - '.github/workflows/v031-o201-cdc-chunk-contract.yml'
      - 'docs/v031-research/2026-10-26-o201-*.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: o201-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-r24-reader:
    name: Authenticated real-wire cdc consistency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Checkout exact source and full prereg history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify exact prospective history and unchanged product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor 3fb392abbdfa53f9ca9b960b8871f6d960476018 HEAD
          git merge-base --is-ancestor 4545d7d5b2a0b712b4b00f5a9c291d4a3a9e169b HEAD
          git diff --exit-code 4545d7d5b2a0b712b4b00f5a9c291d4a3a9e169b HEAD -- src/ native/ tests/ benchmarks/
          mkdir -p o201-evidence
          git rev-parse HEAD > o201-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > o201-evidence/reader.blob
          git rev-parse HEAD:research/o201_cdc_chunk_range_court.py > o201-evidence/court.blob
          git rev-parse HEAD:docs/v031-research/2026-10-26-o201-cdc-descriptor-range-prereg.md > o201-evidence/prereg.blob
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently install exact CMPCT package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
      - name: Produce and test four complete self-consistent revision-24 archives
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m py_compile research/o201_cdc_chunk_range_court.py
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o201_cdc_chunk_range_court.py" --out "$GITHUB_WORKSPACE/o201-evidence/decision.json" 2>&1 | tee "$GITHUB_WORKSPACE/o201-evidence/court.log"
      - name: Independently classify positive controls and genuine hosted result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('o201-evidence/decision.json').read_text())
          assert r['source']['git_head']==Path('o201-evidence/head.sha').read_text().strip()
          assert r['product_change'] is False
          assert len(r['cases'])==4
          assert [c['declared_chunk_length'] for c in r['cases']]==[4,1,2,5]
          assert r['positive_control_pass'] is True
          assert r['decision'] in (
              'REPRODUCED_AUTHENTIC_CDC_RANGE_SEMANTIC_GAP',
              'HOSTILE_CHUNK_REJECTED_OR_NO_MISMATCH')
          assert bool(r['hostile_mismatch_observed'])==(r['decision']=='REPRODUCED_AUTHENTIC_CDC_RANGE_SEMANTIC_GAP')
          for c in r['cases']:
              assert c['archive']['archive_bytes']>100
              assert len(c['archive']['archive_sha256'])==64
          print('O201_HOSTED_AUDIT=PASS RESULT='+r['decision']+' RESEARCH_ONLY')
          PY
      - name: Preserve positive, negative, or infrastructure-failed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o201-real-wire-${{ matrix.os }}-${{ github.sha }}
          path: o201-evidence/
          if-no-files-found: error
