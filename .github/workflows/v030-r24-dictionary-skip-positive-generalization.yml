# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 dictionary skip positive generalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_dictionary_skip_adversarial_v2.py'
      - 'benchmarks/v030_r24_dictionary_skip_adversarial_oracle.py'
      - 'benchmarks/v030_r24_dictionary_skip_admission_oracle.py'
      - 'benchmarks/v030_r24_dictionary_training_cost_oracle.py'
      - 'tests/test_v030_r24_dictionary_skip_admission.py'
      - 'src/cmpct/builder.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r24-dictionary-skip-positive-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-dictionary-skip-positive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r24_dictionary_(skip_adversarial_v2|skip_adversarial_oracle|skip_admission_oracle|training_cost_oracle)\.py|tests/test_v030_r24_dictionary_skip_admission\.py|src/cmpct/builder\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r24-dictionary-skip-positive-generalization\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect dictionary-skip generalization.'
          fi

  positive-generalization:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile positive-unseen evidence surface
        run: |
          python -m py_compile benchmarks/v030_r24_dictionary_skip_adversarial_v2.py
          python -m py_compile benchmarks/v030_r24_dictionary_skip_adversarial_oracle.py
          python -m py_compile benchmarks/v030_r24_dictionary_skip_admission_oracle.py
          python -m py_compile benchmarks/v030_r24_dictionary_training_cost_oracle.py
      - name: Preserve current shipping ownership
        run: python -m pytest -q tests/test_v030_r24_dictionary_skip_admission.py
      - name: Run frozen plus positive-unseen campaign
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_dictionary_skip_adversarial_v2.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-adversarial-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-adversarial-v2.json"
      - name: Enforce positive generalization contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('benchmark-artifacts/v030-r24-dictionary-skip-adversarial-v2.json').read_text())
          assert d['schema'] == 'cmpct-v030-r24-dictionary-skip-adversarial-v2'
          c = d['contract']
          assert c['production_change'] is False
          assert c['release_credit'] is False
          assert c['frozen_workloads'] == 15
          assert c['v1_adversarial_cases_preserved'] == 7
          assert c['additional_positive_unseen_cases'] == 2
          assert c['adversarial_cases'] == 9
          assert c['minimum_positive_training_sample_count'] == 32
          assert c['positive_training_surface_required_for_promotion_signal'] is True
          assert c['positive_unseen_saved_time_required_s'] == 0.005
          assert set(c['forbidden_policy_inputs']) == {
              'workload_name', 'benchmark_name', 'path', 'filename', 'content_hash', 'archive_hash'
          }
          s = d['summary']
          assert s['frozen_complete'] is True
          assert s['adversarial_complete'] is True
          assert s['positive_training_surface_exercised'] is True
          assert s['positive_training_surface_rows'] >= 1
          training = d['positive_unseen_training_rows']
          assert training
          assert all(row['dictionary_sample_count'] >= 32 for row in training)
          positive = [
              row for row in training
              if row['exact_archive_bytes_and_sha']
              and row['canonical_product_tree_equal']
              and row['saved_s'] >= 0.005
          ]
          for solution in d['generalized_training_solutions']:
              assert solution['adversarial_admissions']
              assert solution['frozen_material_admissions']
              assert solution['minimum_saved_s'] >= 0.005
              for rule in solution['rules']:
                  assert rule['feature'] in c['policy_inputs']
                  assert rule['feature'] not in c['forbidden_policy_inputs']
          expected_signal = bool(positive and d['generalized_training_solutions'])
          assert s['promotion_signal'] == expected_signal
          assert d['promotion_signal'] == expected_signal
          assert d['release_credit'] is False
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/v030-r24-dictionary-skip-positive-candidate.txt
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-dictionary-skip-positive-generalization.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-dictionary-skip-positive-generalization-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-r24-dictionary-skip-adversarial-v2.json
            benchmark-artifacts/v030-r24-dictionary-skip-positive-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Research-only positive generalization proof. Exact frozen+unseen evidence has produced content-agnostic rules with
# positive unseen speedups and no adversarial counterexample, but shipping admission remains unchanged until a
# separate product commit and full release authority. Latest-head scoping prevents unrelated PR replay.
