name: PR203 finalize cost-tier Deflate order
on:
  push:
    branches: [agent/v030-deflate-bounded-regret-productization]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-deflate-bounded-regret-productization
          fetch-depth: 0
      - name: Converge codec policy and self-delete
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/cmpct/codec.py'); s=p.read_text()
          desired='    for level in (0,1,2,6,3,4,5,7,8,9):\n'
          static='    for level in (0,6,1,2,3,4,5,7,8,9):\n'
          structural='    levels = range(10) if not target or ((target[0] >> 1) & 0b11) == 0 else (6,0,1,2,3,4,5,7,8,9)\n    for level in levels:\n'
          if desired in s:
              pass
          elif static in s:
              s=s.replace(static,desired,1)
          elif structural in s:
              s=s.replace(structural,desired,1)
          else:
              raise SystemExit('no recognized predecessor search policy; refusing mutation')
          p.write_text(s)
          PY
          rm -f .github/workflows/pr203-cost-tier-order.yml .github/workflows/pr203-finalize-cost-tier.yml .github/workflows/pr203-structural-cost-aware.yml
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cmpct/codec.py .github/workflows/pr203-cost-tier-order.yml .github/workflows/pr203-finalize-cost-tier.yml .github/workflows/pr203-structural-cost-aware.yml || true
          git commit -m 'perf: converge Deflate search on cost-tier order'
          git push origin HEAD:agent/v030-deflate-bounded-regret-productization
