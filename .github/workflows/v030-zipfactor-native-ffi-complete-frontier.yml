# ci-lane: deep
name: CMPCT v0.30 ZIP-factor native FFI complete frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_zipfactor_native_ffi_complete_frontier.py'
      - 'benchmarks/v030_zipfactor_native_complete_frontier.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'native/cmpct-zipfactor-v3-ffi/**'
      - 'native/cmpct-portable/src/bin/cmpct-zipfactor-v3-preparity.rs'
      - '.github/workflows/v030-zipfactor-native-ffi-complete-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-native-ffi-complete-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ffi-complete-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile exact in-process verifier and oracle
        run: |
          python -m py_compile benchmarks/v030_zipfactor_native_ffi_complete_frontier.py
          cargo build --release --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml
      - name: Preserve Rust correctness before timing
        run: |
          cargo fmt --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml -- --check
          cargo clippy --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml -- -D warnings
      - name: Run in-process complete rotated external frontier
        run: |
          python -m benchmarks.v030_zipfactor_native_ffi_complete_frontier \
            --work-root "$RUNNER_TEMP/v030-zipfactor-native-ffi-complete" \
            --native-library "$GITHUB_WORKSPACE/native/cmpct-zipfactor-v3-ffi/target/release/libcmpct_zipfactor_v3_ffi.so" \
            --output "$RUNNER_TEMP/v030-zipfactor-native-ffi-complete.json"
      - name: Ratchet exact in-process four-way boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads((Path(os.environ['RUNNER_TEMP'])/'v030-zipfactor-native-ffi-complete.json').read_text())
          assert e['schema']=='cmpct-v030-zipfactor-native-ffi-complete-frontier-v1'
          c=e['contract']
          assert c['rounds']==9 and c['ties_fail'] is True
          assert c['cmpct_timing']=='exact-v3-build-plus-inprocess-native-strong-verify'
          assert c['native_process_startup_inside_timing'] is False
          assert c['native_ffi_call_inside_timing'] is True
          assert c['archive_open_inside_timing'] is True
          assert c['native_compile_inside_timing'] is False
          assert c['native_library_load_inside_timing'] is False
          assert c['ffi_reuses_exact_preparity_verifier'] is True
          assert c['archive_bytes_changed'] is False and c['selector_change'] is False
          assert c['release_credit'] is False and e['release_credit'] is False
          assert e['experiment_valid'] is True and e['ffi_corruption_rejected'] is True
          assert len(e['samples_s']['cmpct'])==9 and len(e['samples_s']['zip'])==9 and len(e['samples_s']['zstd19'])==9
          assert e['candidate']['tree_sha256']==e['source_identity']['canonical_tree_sha256']
          assert e['candidate']['max_member_read_amplification'] <= 8.0
          assert e['candidate']['max_decode_unit_bytes'] <= 8*1024*1024
          assert e['sizes']['cmpct'] < e['sizes']['zip'] and e['sizes']['cmpct'] < e['sizes']['zstd19']
          expected=(
              e['sizes']['cmpct'] < e['sizes']['zip']
              and e['sizes']['cmpct'] < e['sizes']['zstd19']
              and e['medians_s']['cmpct'] < e['medians_s']['zip']
              and e['medians_s']['cmpct'] < e['medians_s']['zstd19']
          )
          assert e['strict_four_way_win'] is expected
          assert e['promotion_signal'] is expected
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-zipfactor-native-ffi-complete-frontier
          path: ${{ runner.temp }}/v030-zipfactor-native-ffi-complete.json
          if-no-files-found: warn
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-native-ffi-complete-frontier.yml

# Research-only: a positive result isolates process startup as the remaining Deflate-family cost and advances
# recovery/platform productization. It cannot itself alter dispatch, selector policy, archive bytes, or release lock.
