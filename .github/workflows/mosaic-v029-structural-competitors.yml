name: CMPCT v0.29 structural competitors (attempt-5 accepted evidence)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-pointer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify latest same-run attempt-5 structural evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/history/2026-08-17-mosaic-v029-attempt7-crossbase-structural-reject.json')
          r=json.loads(p.read_text())
          assert r['schema'] == 'cmpct-v029-attempt7-crossbase-structural-reject-v1'
          assert r['candidate']['attempt5_bytes'] == 47_147_764
          assert r['same_run_competitors']['tar_zstd19_solid_bytes'] == 47_065_652
          assert r['same_run_competitors']['zpaq_m5_bytes'] == 47_062_639
          assert r['same_run_competitors']['seven_zip_lzma2_bytes'] == 47_430_343
          assert r['decision']['research_gate'] == 'REJECT'
          print(json.dumps({
              'attempt5_bytes': r['candidate']['attempt5_bytes'],
              'tar_zstd19_solid_bytes': r['same_run_competitors']['tar_zstd19_solid_bytes'],
              'zpaq_m5_bytes': r['same_run_competitors']['zpaq_m5_bytes'],
              'seven_zip_lzma2_bytes': r['same_run_competitors']['seven_zip_lzma2_bytes'],
              'source_workflow_run': r['workflow_run'],
              'artifact': r['artifact'],
          }, indent=2))
          PY

# Footnote: the attempt-5 structural comparison is frozen and already has a same-run artifact containing
# CMPCT + tar/Zstd + 7z + ZPAQ + Borg. Oracle-only research emits exact attempt-5 bytes and therefore must
# not restart the high-ratio competitor sweep. A future implemented compressor gets a fresh structural
# workflow and same-run competitor evidence before it can claim revision-worthiness.
