name: CMPCT neutral-hostile determinism repair v5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-neutral-hostile-determinism-repair-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: prove-${{ matrix.round }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        round: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install \
            pillow==12.3.0 \
            reportlab==5.0.0 \
            python-docx==1.2.0 \
            openpyxl==3.1.5 \
            python-pptx==1.0.2 \
            numpy==2.4.6

      - name: Record media producer identity
        run: |
          mkdir -p benchmark-artifacts
          ffmpeg -version > benchmark-artifacts/ffmpeg-version-${{ matrix.round }}.txt
          ffmpeg -hide_banner -encoders 2>&1 | grep -E 'libx264|libmp3lame|flac|aac' >> benchmark-artifacts/ffmpeg-version-${{ matrix.round }}.txt || true
          lscpu >> benchmark-artifacts/ffmpeg-version-${{ matrix.round }}.txt || true

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Prove within-run v5 identity and measure exact v0.28 bytes
        run: |
          set -o pipefail
          python benchmarks/neutral_hostile_determinism_repair_v5_check.py \
            --work-root benchmark-artifacts/CMPCT_Neutral_Hostile_Determinism_Repair_v5_${{ matrix.round }} \
            --output benchmark-artifacts/neutral-hostile-v1-determinism-repair-v5.json \
            2>&1 | tee benchmark-artifacts/neutral-hostile-v1-determinism-repair-v5.stdout.txt

      - name: Enforce within-run candidate identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/neutral-hostile-v1-determinism-repair-v5.json').read_text())
          assert r['schema'] == 'cmpct-neutral-hostile-v1-determinism-repair-manifest-v5'
          assert r['within_run_pass'] is True, r
          assert r['requirements']['historical_record_rewritten'] is False
          assert r['requirements']['file_manifests_retained_for_cross_run_comparison'] is True
          assert len(r['rows']) == 4, r
          for row in r['rows']:
              assert row['deterministic'] is True, row
              assert row['tree_sha256'] == row['second_build_tree_sha256'], row
              assert row['file_manifest'] == row['second_build_file_manifest'], row
              assert not row['file_differences'], row
              assert row['v028_candidate_bytes'] and row['v028_candidate_bytes'] > 0, row
          print(json.dumps(r['media'], indent=2))
          PY

      - name: Focused CPU-canonical wrapper tests
        run: python -m pytest -q tests/test_neutral_media_determinism_repair_v5.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Upload independent runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-neutral-hostile-v5-${{ matrix.round }}
          path: |
            benchmark-artifacts/neutral-hostile-v1-determinism-repair-v5.json
            benchmark-artifacts/neutral-hostile-v1-determinism-repair-v5.stdout.txt
            benchmark-artifacts/ffmpeg-version-${{ matrix.round }}.txt
          if-no-files-found: warn

  cross-run:
    name: cross-run-identity
    needs: prove
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download runner A evidence
        uses: actions/download-artifact@v4
        with:
          name: cmpct-neutral-hostile-v5-a
          path: benchmark-artifacts/a

      - name: Download runner B evidence
        uses: actions/download-artifact@v4
        with:
          name: cmpct-neutral-hostile-v5-b
          path: benchmark-artifacts/b

      - name: Compare independent runner manifests and exact v0.28 bytes
        id: compare
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('benchmark-artifacts/a/neutral-hostile-v1-determinism-repair-v5.json').read_text())
          b=json.loads(Path('benchmark-artifacts/b/neutral-hostile-v1-determinism-repair-v5.json').read_text())
          rows_a={row['name']:row for row in a['rows']}
          rows_b={row['name']:row for row in b['rows']}
          differences=[]
          keys=('tree_sha256','files','logical_bytes','file_manifest','v028_candidate_bytes','v028_graph_bytes','v028_inherited_bytes','v028_selected')
          for name in sorted(set(rows_a)|set(rows_b)):
              ra=rows_a.get(name); rb=rows_b.get(name)
              if ra is None or rb is None:
                  differences.append({'name':name,'field':'row_presence','a':ra is not None,'b':rb is not None})
                  continue
              for key in keys:
                  if ra.get(key) != rb.get(key):
                      item={'name':name,'field':key,'a':ra.get(key),'b':rb.get(key)}
                      if key == 'file_manifest':
                          ma=ra.get(key,{}) or {}; mb=rb.get(key,{}) or {}
                          item['file_differences']=[
                              {'path':p,'a':ma.get(p),'b':mb.get(p)}
                              for p in sorted(set(ma)|set(mb)) if ma.get(p) != mb.get(p)
                          ]
                      differences.append(item)
          accepted=(
              a.get('within_run_pass') is True and b.get('within_run_pass') is True and not differences
          )
          media_a=rows_a.get('03_media_library',{})
          media_b=rows_b.get('03_media_library',{})
          record={
              'schema':'cmpct-neutral-hostile-v1-determinism-repair-v5-cross-run-v1',
              'claim_boundary':'candidate benchmark identity; no historical baseline rewrite',
              'accepted':accepted,
              'differences':differences,
              'media':{
                  'runner_a_tree_sha256':media_a.get('tree_sha256'),
                  'runner_b_tree_sha256':media_b.get('tree_sha256'),
                  'runner_a_logical_bytes':media_a.get('logical_bytes'),
                  'runner_b_logical_bytes':media_b.get('logical_bytes'),
                  'runner_a_v028_candidate_bytes':media_a.get('v028_candidate_bytes'),
                  'runner_b_v028_candidate_bytes':media_b.get('v028_candidate_bytes'),
              },
              'producer_policy':a.get('producer_policy'),
          }
          out=Path('benchmark-artifacts/repair-v5-cross-run.json')
          out.write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          if not accepted:
              raise SystemExit('repair-v5 failed independent-runner identity proof')
          PY

      - name: Summarize cross-run identity
        if: always()
        run: |
          if [ -f benchmark-artifacts/repair-v5-cross-run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/repair-v5-cross-run.json').read_text())
          m=r['media']
          print('## Neutral/hostile repair-v5 — independent runner proof')
          print(f"- accepted: **{r['accepted']}**")
          print(f"- media tree A/B: `{m['runner_a_tree_sha256']}` / `{m['runner_b_tree_sha256']}`")
          print(f"- media logical bytes A/B: **{m['runner_a_logical_bytes']} / {m['runner_b_logical_bytes']}**")
          print(f"- media v0.28 bytes A/B: **{m['runner_a_v028_candidate_bytes']} / {m['runner_b_v028_candidate_bytes']}**")
          print(f"- differing fields: **{len(r['differences'])}**")
          PY
          fi

      - name: Upload cross-run verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-neutral-hostile-v5-cross-run-${{ github.sha }}
          path: |
            benchmark-artifacts/repair-v5-cross-run.json
            benchmark-artifacts/a/ffmpeg-version-a.txt
            benchmark-artifacts/b/ffmpeg-version-b.txt
          if-no-files-found: warn

# Footnote: v5 is accepted only by equality across two independent hosted runners.  A within-run pass is
# insufficient by construction; this workflow exists because repair-v4 proved exactly that failure mode.
