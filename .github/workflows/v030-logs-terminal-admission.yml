# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 logs terminal admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_logs_terminal_admission_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile*.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_logs_candidate.py'
      - 'tests/test_v030_logs_profile_tree_identity.py'
      - '.github/workflows/v030-logs-terminal-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-terminal-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_(logs_terminal_admission_oracle|external_competitors|release_generalization)\.py|experiments/entropygraph_v030_(logs_inverse_profile[^/]*|release_product|release_product_logs_candidate)\.py|tests/test_v030_logs_profile_tree_identity\.py|\.github/workflows/v030-logs-terminal-admission\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect logs terminal admission.'
          fi

  logs-terminal-admission:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen-corpus and comparator dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile terminal ratchet
        run: python -m py_compile benchmarks/v030_logs_terminal_admission_oracle.py

      - name: Prove independent logs verifier owns canonical tree identity
        run: python -m pytest -q tests/test_v030_logs_profile_tree_identity.py

      - name: Run all-15 promoted logs terminal ratchet
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_terminal_admission_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-terminal-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-terminal-admission.json"

      - name: Independently enforce promoted shipping contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-logs-terminal-admission.json')
          assert p.is_file(), 'logs terminal admission evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-logs-terminal-ratchet-v2'
          assert d['gate']['exact_workload_count'] is True
          assert d['gate']['at_least_one_structural_admission'] is True
          assert d['gate']['all_admitted_shipping_strictly_safe'] is True
          assert d['gate']['logs_workload_admitted'] is True
          assert d['gate']['no_candidate_errors'] is True
          admitted=[r for r in d['rows'] if r['admitted']]
          assert admitted
          for r in admitted:
              s=r['strict']
              assert s['shipping_selects_logs_inverse'] is True
              assert s['shipping_matches_independent_logs_bytes'] is True
              assert s['shipping_matches_independent_logs_tree'] is True
              assert s['shipping_beats_accepted_v029_size'] is True
              assert s['shipping_beats_zip_size'] is True
              assert s['shipping_beats_zstd19_size'] is True
              assert s['shipping_beats_zip_create'] is True
              assert s['shipping_beats_zstd19_create'] is True
              assert s['shipping_locality_le_8x'] is True
              assert s['shipping_decode_unit_le_8mib'] is True
              assert s['passed'] is True
          assert d['gate']['passed'] is True
          PY

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-terminal-admission.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-logs-terminal-admission-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-terminal-admission.json
          if-no-files-found: error
          retention-days: 90

# Logs is already promoted behind a generic structural/measured selector. This lane therefore proves the shipping
# path rather than comparing a candidate with itself: the independent profile verifier must own the same canonical
# tree identity as the release facade, and every admitted row must strictly beat accepted v0.29, ZIP and Zstd in the
# relevant size/create dimensions while retaining immutable locality/decode ceilings. Ordinary all-15 release
# authority remains decisive.
