# ci-lane: deep
name: CMPCT v0.30 logs terminal admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_logs_terminal_admission_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile*.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_logs_candidate.py'
      - 'src/cmpct/**'
      - '.github/workflows/v030-logs-terminal-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-terminal-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  logs-terminal-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen-corpus and comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile terminal ratchet
        run: python -m py_compile benchmarks/v030_logs_terminal_admission_oracle.py

      - name: Run all-15 promoted logs terminal ratchet
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_terminal_admission_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-terminal-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-terminal-admission.json"

      - name: Independently enforce promoted shipping contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-logs-terminal-admission.json').read_text())
          assert d['schema']=='cmpct-v030-logs-terminal-ratchet-v2'
          assert d['gate']['exact_workload_count'] is True
          assert d['gate']['at_least_one_structural_admission'] is True
          assert d['gate']['all_admitted_shipping_strictly_safe'] is True
          assert d['gate']['logs_workload_admitted'] is True
          assert d['gate']['no_candidate_errors'] is True
          admitted=[r for r in d['rows'] if r['admitted']]
          assert admitted
          for r in admitted:
              s=r['strict']
              assert s['shipping_selects_logs_inverse'] is True
              assert s['shipping_matches_independent_logs_bytes'] is True
              assert s['shipping_matches_independent_logs_tree'] is True
              assert s['shipping_beats_accepted_v029_size'] is True
              assert s['shipping_beats_zip_size'] is True
              assert s['shipping_beats_zstd19_size'] is True
              assert s['shipping_beats_zip_create'] is True
              assert s['shipping_beats_zstd19_create'] is True
              assert s['shipping_locality_le_8x'] is True
              assert s['shipping_decode_unit_le_8mib'] is True
              assert s['passed'] is True
          assert d['gate']['passed'] is True
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-terminal-admission.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-logs-terminal-admission-${{ github.sha }}
          path: benchmark-artifacts/v030-logs-terminal-admission.json
          if-no-files-found: warn
          retention-days: 90

# Logs is already promoted behind a generic structural/measured selector. This lane therefore proves the shipping
# path rather than comparing a candidate with itself: an admitted row must select logs-inverse, match an independently
# built logs archive/tree, and strictly beat accepted v0.29, ZIP and Zstd in the relevant size/create dimensions while
# retaining the immutable locality/decode ceilings. Ordinary all-15 release authority remains decisive.
