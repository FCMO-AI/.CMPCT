# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Zstd hybrid whole-archive

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_zstd_hybrid_whole_archive.py'
      - 'benchmarks/v030_r4_zstd_parameter_decomposition.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-zstd-hybrid-whole-archive.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_zstd_hybrid_whole_archive.py'
      - 'benchmarks/v030_r4_zstd_parameter_decomposition.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-zstd-hybrid-whole-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r4-zstd-hybrid-whole-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_zstd_hybrid_whole_archive\.py|benchmarks/v030_r4_zstd_parameter_decomposition\.py|benchmarks/v030_external_competitors\.py|benchmarks/v030_release_generalization\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|experiments/entropygraph_v025\.py|experiments/entropygraph_v030_product_fs\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r4-zstd-hybrid-whole-archive\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  whole-archive-hybrid:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus and comparator dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact R4 whole-archive candidate
        run: python -m py_compile benchmarks/v030_r4_zstd_hybrid_whole_archive.py benchmarks/v030_r4_zstd_parameter_decomposition.py
      - name: Build and strong-verify complete hybrid archives
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_zstd_hybrid_whole_archive.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-hybrid-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zstd-hybrid-whole-archive.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-zstd-hybrid-whole-archive.json').read_text())
          assert d['schema']=='cmpct-v030-r4-zstd-hybrid-whole-archive-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['targets']==['02_office_workspace','04_analytics_and_database','01_developer_repository','08_many_tiny_files','07_incompressible_and_encrypted_like']
          assert d['policies']==['level15','l15_plus_strategy19','l15_plus_strategy19_searchLog19','level19']
          assert len(d['rows'])==5
          c=d['contract']
          assert c['diagnostic_only'] and c['release_credit'] is False
          assert c['production_selector_changed'] is False
          assert c['representation_discovery_changed'] is False
          assert c['sub19_probe_behavior_preserved']
          assert c['mandatory_strong_verify'] and c['canonical_filesystem_semantics_preserved'] and c['same_input_same_semantics']
          for r in d['rows']:
            assert all(p['repetitions']==2 for p in r['policies'].values())
            assert len({p['canonical_user_tree_sha256'] for p in r['policies'].values()})==1
          assert isinstance(d['hypothesis']['supported'], bool)
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-zstd-hybrid-whole-archive.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-zstd-hybrid-whole-archive-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-zstd-hybrid-whole-archive.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. A positive result authorizes a workload-blind admission experiment; it does not
# authorize production policy, release credit, format changes, or a weaker comparator contract.
