name: PR202 apply historical native ABBA wiring v2
on:
  push:
    branches: [agent/r24-native-abba-convergence]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r24-native-abba-convergence
          fetch-depth: 0
      - name: Apply exact wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/zip-parity.yml'); s=p.read_text()
          helper='      - "tools/materialize_performance_base_native.py"\n'
          anchor='      - "tools/aggregate_parity_runs.py"\n'
          if s.count(anchor)!=2: raise SystemExit(f'event anchors={s.count(anchor)}')
          s=s.replace(anchor,anchor+helper)
          old="tools/(check_performance_regression|aggregate_parity_runs)\\.py|pyproject\\.toml|\\.github/workflows/zip-parity\\.yml)"
          new="tools/(check_performance_regression|aggregate_parity_runs|materialize_performance_base_native)\\.py|pyproject\\.toml|\\.github/workflows/zip-parity\\.yml)"
          if s.count(old)!=1: raise SystemExit(f'classifier anchors={s.count(old)}')
          s=s.replace(old,new,1)
          corpus='      - name: Generate one immutable release corpus\n'
          insert='''      - name: Materialize historical package-owned native engine\n        run: |\n          mkdir -p benchmark-artifacts\n          python tools/materialize_performance_base_native.py /tmp/cmpct-performance-base --receipt benchmark-artifacts/base-native.json\n          python - <<'PY2'\n          import json\n          from pathlib import Path\n          from cmpct import native_codec\n          receipt=json.loads(Path('benchmark-artifacts/base-native.json').read_text())\n          base=Path(receipt['native_path']).resolve(); candidate=native_codec._library_path().resolve()\n          if base==candidate: raise SystemExit(f'base/candidate native ownership alias: {base}')\n          if Path('/tmp/cmpct-performance-base').resolve() not in base.parents: raise SystemExit(f'base native escaped historical worktree: {base}')\n          Path('benchmark-artifacts/native-ownership.txt').write_text(f'base_native={base}\\ncandidate_native={candidate}\\nphysical_distinct=true\\n')\n          PY2\n\n'''
          if s.count(corpus)!=1: raise SystemExit(f'corpus anchors={s.count(corpus)}')
          if s.index('      - name: Materialize base engine worktree\n')>=s.index(corpus): raise SystemExit('base/corpus order invalid')
          p.write_text(s.replace(corpus,insert+corpus,1))
          PY
          rm .github/workflows/pr202-apply-native-abba.yml .github/workflows/pr202-apply-native-abba-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zip-parity.yml .github/workflows/pr202-apply-native-abba.yml .github/workflows/pr202-apply-native-abba-v2.yml
          git commit -m 'ci: materialize historical native engine before ABBA corpus'
          git push origin HEAD:agent/r24-native-abba-convergence
