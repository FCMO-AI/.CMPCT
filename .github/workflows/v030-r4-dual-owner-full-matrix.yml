# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 dual-owner full matrix

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_dual_owner_full_matrix.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_integrated_archive.py'
      - 'benchmarks/v030_r4_tabular_admission_oracle_v2.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/v030_r4_tabular_binary_owner_fast_oracle.py'
      - '.github/workflows/v030-r4-dual-owner-full-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-dual-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  full-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile full-matrix falsifier
        run: |
          python -m py_compile \
            benchmarks/v030_r4_dual_owner_full_matrix.py \
            benchmarks/v030_r4_analytics_dual_owner_oracle.py \
            benchmarks/v030_r4_tabular_integrated_archive.py
      - name: Run exact 15-workload dual-owner falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_dual_owner_full_matrix.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-dual-matrix-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-dual-matrix.json"
      - name: Enforce receipt integrity only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-dual-matrix.json').read_text())
          assert d['schema']=='cmpct-v030-r4-dual-owner-full-matrix-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert len(d['rows'])==15
          assert d['contract']['diagnostic_only'] and not d['contract']['release_credit']
          assert d['contract']['full_15_workload_matrix'] and d['contract']['same_semantic_tree_verified']
          assert d['contract']['exact_fallback_required'] and d['contract']['no_threshold_sweep']
          print(json.dumps({'aggregate':d['aggregate'],'analytics':d['analytics'],'hypothesis':d['hypothesis'],'admitted':d['admitted'],'regressions':d['regressions']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-dual-owner-full-matrix-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-dual-matrix.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity only. Scientific support is read from the hypothesis object.
