# ci-lane: deep
name: CMPCT v0.30 EG08 ZIP plaintext prefilter oracle

on:
  pull_request:
    paths:
      - 'benchmarks/v030_eg08_zip_plain_prefilter_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-eg08-zip-plain-prefilter.yml'
  workflow_dispatch:

concurrency:
  group: v030-eg08-zip-prefilter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_eg08_zip_plain_prefilter_oracle.py
      - name: Run exact Office A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_eg08_zip_plain_prefilter_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-zip-prefilter-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-zip-prefilter.json"
      - name: Evidence-boundary check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-zip-prefilter.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-zip-plain-prefilter-oracle-v1'
          assert d['contract']['release_credit'] is False
          assert d['contract']['production_change'] is False
          assert d['contract']['required_byte_identity'] is True
          assert d['office']['rounds']==11
          assert d['office']['byte_identical_all_rounds'] is True
          assert d['gate']['experiment_valid'] is True
          assert d['gate']['passed'] is True
          PY
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-eg08-zip-plain-prefilter.yml
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-zip-prefilter-${{ github.sha }}
          path: benchmark-artifacts/v030-eg08-zip-prefilter.json
          if-no-files-found: warn
          retention-days: 90
