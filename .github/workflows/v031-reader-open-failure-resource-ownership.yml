# ci-lane: fast
name: v031 Reader open-failure resource ownership court

on:
  push:
    branches:
      - agent/phased2-v031-reader-open-failure-resource-cleanup-20261023

permissions:
  contents: read

concurrency:
  group: v031-reader-open-ownership-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reader-open-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git hash-object src/cmpct/reader.py
          git hash-object tests/conformance/v24-direct-codecs.json
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install genuine package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run real-reader open-failure ownership court
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/test_v031_reader_open_failure_resource_ownership.py 2>&1 | tee reader-open-ownership-pytest.txt
      - name: Persist diagnostic evidence whether red or green
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-open-ownership-${{ github.sha }}
          path: reader-open-ownership-pytest.txt
          if-no-files-found: warn
