# ci-lane: fast
name: CMPCT1 ONE-G0.2 auth commitment width boundary
on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_auth_commitment_width_boundary.py"
      - ".github/workflows/cmpct1-one-g02-auth-commitment-width.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-auth-commitment-width-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  commitment-width:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run frozen commitment-width boundary
        run: |
          mkdir -p one-auth-width-artifacts
          python -m benchmarks.one.one_g02_auth_commitment_width_boundary | tee one-auth-width-artifacts/one-g02-auth-commitment-width.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-auth-commitment-width-${{ env.EVIDENCE_HEAD }}
          path: one-auth-width-artifacts/
          if-no-files-found: error
