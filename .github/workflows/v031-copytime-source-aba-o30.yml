# ci-lane: fast
name: CMPCT v0.31 copy-time sealed-source ABA O30

on:
  pull_request:
    paths:
      - 'benchmarks/v031_copytime_source_aba_o30.py'
      - 'docs/v031-research/2026-10-24-copytime-source-aba-o30-prereg.md'
      - 'docs/v031-research/2026-10-24-copytime-source-aba-o30-result.md'
      - '.github/workflows/v031-copytime-source-aba-o30.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-aba-o30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authenticated-copy-aba-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Exact source custody and scientific baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 5994dca7d4d9255a2ed7c6edf1669acf2422e2f1 HEAD
          test "$(git hash-object src/cmpct/reader.py)" = 60f52328467ca509bb410abe6a34810c50917cb5
          test "$(git hash-object benchmarks/v031_pack_physical_sha_court.py)" = 2383bf9a8f7ce8a9a01028ccf1072169897df3f1
          test "$(git hash-object benchmarks/v031_verify_extract_source_lifetime_o23.py)" = 134085f99b92764a79899e4cbf5f6c5b3b7b01cf
          test "$(git hash-object benchmarks/v031_private_verified_snapshot_o24.py)" = a454ee5ab2920be28c56b3a7fcafd8b0ae99547d
          test "$(git hash-object benchmarks/v031_sealed_memfd_source_o26.py)" = 4f556a7d92577812625ea8de96f56d1128a2f6b6
          test "$(git hash-object benchmarks/v031_copytime_source_aba_o30.py)" = 10ad731e4ae9ab695f68330ac059299079ef1435
          python -m py_compile benchmarks/v031_copytime_source_aba_o30.py
          git hash-object benchmarks/v031_copytime_source_aba_o30.py src/cmpct/reader.py > benchmark-artifacts/blobs.txt
          printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/head.txt
      - name: Install inherited CMPCT source
        run: python -m pip install -e '.[test]'
      - name: Execute CRC-equal source ABA physical verification court
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_copytime_source_aba_o30.py \
            --out benchmark-artifacts/o30-result.json > benchmark-artifacts/stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("benchmark-artifacts/o30-result.json").read_text())
          assert result["status"] == "PASS"
          assert result["source_sha_before_after_equal"]
          assert result["source_inode_and_size_stable"]
          assert result["source_head_sha256"] == result["source_tail_sha256"]
          assert result["archive_a_sha256"] == result["source_head_sha256"]
          assert result["sealed_hybrid_archive_sha256"] not in (
              result["archive_a_sha256"], result["archive_b_sha256"])
          assert result["physical_crc32_collision"]["crc32_original_equals_mutant"] >= 0
          assert result["hybrid_crc_tier_read"] == "PASS_MUTANT_LOGICAL_BYTES"
          assert result["hybrid_verify"] == "REJECTED_EXACT_PHYSICAL_SHA"
          assert result["verified_extraction"] == "REJECTED_BEFORE_PUBLICATION"
          assert result["memfd_write_denied_errno"] in (1, 13)
          assert result["baseline_a"]["physical_verify"] == "PASS"
          assert result["baseline_b"]["physical_verify"] == "PASS"
          assert result["post_aba_source"]["physical_verify"] == "PASS"
          assert len(result["costs"]["writer_interleavings"]) == 2
          assert all(row["mode"] == "separate_subprocess"
                     for row in result["costs"]["writer_interleavings"])
          assert result["costs"]["copy_read_bytes"] == result["source_archive_bytes"]
          assert result["costs"]["copy_write_bytes"] == result["source_archive_bytes"]
          print("O30 ASSERTIONS PASS:", result["decision"])
          print("CRC", result["physical_crc32_collision"]["crc32_original_equals_mutant"],
                "COPY_BYTES", result["source_archive_bytes"])
          PY
      - name: Preserve raw scientific evidence and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-copytime-aba-o30-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
