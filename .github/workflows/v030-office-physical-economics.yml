name: CMPCT v0.30 Office physical economics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - benchmarks/v030_office_physical_economics_referee.py
      - benchmarks/v030_current15_stable_corpus.py
      - experiments/entropygraph_v030_federated_candidate.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v5.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v6.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py
      - experiments/entropygraph_v030_fs_implicit_v4.py
      - experiments/entropygraph_v030_product_fs.py
      - docs/V030_OFFICE_PHYSICAL_ECONOMICS_MISSION_LOCK_2026-09-13.md
      - .github/workflows/v030-office-physical-economics.yml

permissions:
  contents: read

jobs:
  office-physical-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen v0.29 comparator source
        uses: actions/checkout@v4
        with:
          ref: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d
          path: .frozen-v029
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact-head benchmark dependencies
        run: python -m pip install -e '.[test]'

      - name: Run causal Office attribution referee
        id: referee
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m benchmarks.v030_office_physical_economics_referee \
            --v029-checkout .frozen-v029 \
            --out evidence/office-physical-economics.json \
            > >(tee evidence/stdout.txt) \
            2> >(tee evidence/stderr.txt >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bind and classify receipt
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          out = Path(os.environ['GITHUB_OUTPUT'])
          receipt = Path('evidence/office-physical-economics.json')
          stderr = Path('evidence/stderr.txt')
          code = int('${{ steps.referee.outputs.exit_code || 1 }}')
          if receipt.exists():
              d=json.loads(receipt.read_text())
              d['candidate_sha']=os.environ['GITHUB_SHA']
              d['candidate_ref']=os.environ['GITHUB_REF_NAME']
              receipt.write_text(json.dumps(d,indent=2,sort_keys=True))
              verdict=str(d.get('verdict','UNKNOWN'))
              b=d.get('B_same_physical_explicit_control',{}).get('components',{}).get('archive_bytes','na')
              c=d.get('C_same_physical_implicit_v4',{}).get('components',{}).get('archive_bytes','na')
              v29=d.get('frozen_v029',{}).get('archive_bytes','na')
              delta=d.get('bc_control_only_total_delta_bytes','na')
              label=f"{verdict}-b{b}-c{c}-v29{v29}-delta{delta}"
          else:
              lines=[x.strip() for x in stderr.read_text(errors='replace').splitlines() if x.strip()] if stderr.exists() else []
              msg=lines[-1] if lines else 'no-receipt-no-stderr'
              msg=re.sub(r'[^A-Za-z0-9_.-]+','-',msg).strip('-')[:110]
              label=f"HARNESS_FAIL-{msg}"
          label=re.sub(r'[^A-Za-z0-9_.-]+','-',label)[:180]
          with out.open('a') as f:
              f.write(f"label={label}\n")
              f.write(f"exit_code={code}\n")
          PY

      - name: Upload exact-head referee evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-office-${{ steps.classify.outputs.label }}-${{ github.sha }}
          path: |
            evidence/office-physical-economics.json
            evidence/stdout.txt
            evidence/stderr.txt
          if-no-files-found: error

      - name: Enforce scientific referee exit
        if: always()
        shell: bash
        run: |
          test "${{ steps.classify.outputs.exit_code }}" = "0"
