name: ONE-G0.2 exact wire-size smoke

on:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/native/one_g02_exact_wire_size.c'
      - 'benchmarks/one/native/one_g02_shared_native_writer_ref_fused.c'
      - '.github/workflows/one-g02-exact-wire-size-smoke.yml'
  workflow_dispatch:

jobs:
  exact-wire-size-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build strict C objects
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -c benchmarks/one/native/one_g02_exact_wire_size.c -o /tmp/exact.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -c benchmarks/one/native/one_g02_shared_native_writer_ref_fused.c -o /tmp/writer.o
      - name: Build and run byte-count oracle smoke
        shell: bash
        run: |
          cat >/tmp/exact_smoke.c <<'EOF'
          #include <assert.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>

          typedef struct { uint32_t start; uint32_t length; uint8_t kind; } one_g02_segment;
          int one_g02_native_writer(const uint8_t*,size_t,const uint8_t*,size_t,
              const one_g02_segment*,size_t,const uint8_t[32],const uint8_t[32],int,
              uint8_t**,size_t*,size_t*,size_t*,size_t*,size_t*);
          void one_g02_native_writer_free(void*);
          int one_g02_exact_wire_size(size_t,size_t,const one_g02_segment*,size_t,int,
              size_t*,size_t*,size_t*,size_t*);

          static void check(const uint8_t *s,size_t sl,const uint8_t *t,size_t tl,
                            const one_g02_segment *seg,size_t n,int enabled) {
              uint8_t prev[32]={0}, cur[32]={0}, *wire=NULL;
              size_t wl=0,sb=0,cap=0,depth=0,nodes=0;
              size_t exact=0,esb=0,edepth=0,enodes=0;
              int wr=one_g02_native_writer(s,sl,t,tl,seg,n,prev,cur,enabled,
                                           &wire,&wl,&sb,&cap,&depth,&nodes);
              int er=one_g02_exact_wire_size(sl,tl,seg,n,enabled,&exact,&esb,&edepth,&enodes);
              assert(wr==0 && er==0);
              assert(wl==exact);
              assert(sb==esb && depth==edepth && nodes==enodes);
              assert(cap>=wl);
              one_g02_native_writer_free(wire);
          }

          int main(void) {
              static const uint8_t s[]="abcdefghijklmnop";
              static const uint8_t t[]="abcdZZZZijklmnop";
              one_g02_segment seg[]={{0,4,0},{4,4,1},{8,8,0}};
              check(s,16,t,16,seg,3,1);
              check(s,16,t,16,NULL,0,0);

              one_g02_segment all_surprise={{0}};
              all_surprise.start=0; all_surprise.length=16; all_surprise.kind=1;
              check(s,16,t,16,&all_surprise,1,1);

              one_g02_segment bad={{0}};
              bad.start=0; bad.length=16; bad.kind=9;
              size_t a,b,c,d; uint8_t prev[32]={0},cur[32]={0},*wire=NULL; size_t wl,sb,cap,depth,nodes;
              int wr=one_g02_native_writer(s,16,t,16,&bad,1,prev,cur,1,&wire,&wl,&sb,&cap,&depth,&nodes);
              int er=one_g02_exact_wire_size(16,16,&bad,1,1,&a,&b,&c,&d);
              assert(wr<0 && er<0);
              puts("exact wire-size smoke: PASS");
              return 0;
          }
          EOF
          cc -std=c11 -O2 -Wall -Wextra -Werror /tmp/exact_smoke.c /tmp/exact.o /tmp/writer.o -o /tmp/exact_smoke
          /tmp/exact_smoke
