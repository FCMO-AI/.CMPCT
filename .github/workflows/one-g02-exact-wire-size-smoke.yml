# Exact-source retrigger: 2026-09-06 15:08 -0600
name: ONE-G0.2 exact wire-size smoke

on:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/native/one_g02_exact_wire_size.c'
      - 'benchmarks/one/native/one_g02_shared_native_writer_ref_fused.c'
      - '.github/workflows/one-g02-exact-wire-size-smoke.yml'
  workflow_dispatch:

jobs:
  exact-wire-size-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build strict C objects
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -c benchmarks/one/native/one_g02_exact_wire_size.c -o /tmp/exact.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -c benchmarks/one/native/one_g02_shared_native_writer_ref_fused.c -o /tmp/writer.o
      - name: Build and run byte-count oracle parity
        shell: bash
        run: |
          cat >/tmp/exact_smoke.c <<'EOF'
          #include <assert.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>

          typedef struct { uint32_t start; uint32_t length; uint8_t kind; } one_g02_segment;
          int one_g02_native_writer(const uint8_t*,size_t,const uint8_t*,size_t,
              const one_g02_segment*,size_t,const uint8_t[32],const uint8_t[32],int,
              uint8_t**,size_t*,size_t*,size_t*,size_t*,size_t*);
          void one_g02_native_writer_free(void*);
          int one_g02_exact_wire_size(size_t,size_t,const one_g02_segment*,size_t,int,
              size_t*,size_t*,size_t*,size_t*);

          static size_t checks = 0;
          static void check(const uint8_t *s,size_t sl,const uint8_t *t,size_t tl,
                            const one_g02_segment *seg,size_t n,int enabled) {
              uint8_t prev[32]={0}, cur[32]={0}, *wire=NULL;
              size_t wl=0,sb=0,cap=0,depth=0,nodes=0;
              size_t exact=0,esb=0,edepth=0,enodes=0;
              int wr=one_g02_native_writer(s,sl,t,tl,seg,n,prev,cur,enabled,
                                           &wire,&wl,&sb,&cap,&depth,&nodes);
              int er=one_g02_exact_wire_size(sl,tl,seg,n,enabled,&exact,&esb,&edepth,&enodes);
              assert(wr==0 && er==0);
              assert(wl==exact);
              assert(sb==esb && depth==edepth && nodes==enodes);
              assert(cap>=wl);
              one_g02_native_writer_free(wire);
              ++checks;
          }

          static uint32_t rng_state=0x7a91d35bu;
          static uint32_t xr(void){
              uint32_t x=rng_state; x^=x<<13; x^=x>>17; x^=x<<5; return rng_state=x;
          }

          static void randomized(void) {
              uint8_t source[512], target[256];
              for (size_t i=0;i<sizeof(source);++i) source[i]=(uint8_t)(i*37u+11u);
              for (size_t i=0;i<sizeof(target);++i) target[i]=(uint8_t)(i*19u+3u);
              for (size_t trial=0; trial<1000; ++trial) {
                  size_t tl=1u+(xr()%sizeof(target));
                  size_t wanted=1u+(xr()%24u); if (wanted>tl) wanted=tl;
                  one_g02_segment seg[24]; size_t left=tl, off=0;
                  for (size_t i=0;i<wanted;++i) {
                      size_t remaining=wanted-i;
                      size_t maxlen=left-(remaining-1u);
                      size_t len=(i+1u==wanted)?left:(1u+(xr()%maxlen));
                      uint8_t kind=(uint8_t)(xr()&1u);
                      seg[i].length=(uint32_t)len; seg[i].kind=kind;
                      seg[i].start=kind ? (uint32_t)off : (uint32_t)(xr()%(sizeof(source)-len+1u));
                      off+=len; left-=len;
                  }
                  check(source,sizeof(source),target,tl,seg,wanted,1);
              }
          }

          static void hierarchy(void) {
              const size_t n=4097u;
              uint8_t *source=(uint8_t*)malloc(n), *target=(uint8_t*)malloc(n);
              one_g02_segment *seg=(one_g02_segment*)malloc(n*sizeof(*seg));
              assert(source && target && seg);
              for (size_t i=0;i<n;++i) {
                  source[i]=target[i]=(uint8_t)i;
                  seg[i].start=(uint32_t)i; seg[i].length=1u; seg[i].kind=0u;
              }
              check(source,n,target,n,seg,n,1);
              free(seg); free(target); free(source);
          }

          static void hostile(void) {
              static const uint8_t s[16]={0}, t[16]={0};
              one_g02_segment bad={0}; bad.start=0; bad.length=16; bad.kind=9;
              size_t a,b,c,d; uint8_t prev[32]={0},cur[32]={0},*wire=NULL;
              size_t wl=0,sb=0,cap=0,depth=0,nodes=0;
              int wr=one_g02_native_writer(s,16,t,16,&bad,1,prev,cur,1,&wire,&wl,&sb,&cap,&depth,&nodes);
              int er=one_g02_exact_wire_size(16,16,&bad,1,1,&a,&b,&c,&d);
              assert(wr<0 && er<0);

              one_g02_segment zero={0}; zero.length=0; zero.kind=0;
              wr=one_g02_native_writer(s,16,t,16,&zero,1,prev,cur,1,&wire,&wl,&sb,&cap,&depth,&nodes);
              er=one_g02_exact_wire_size(16,16,&zero,1,1,&a,&b,&c,&d);
              assert(wr<0 && er<0);

              one_g02_segment shortcov={0}; shortcov.length=15; shortcov.kind=0;
              wr=one_g02_native_writer(s,16,t,16,&shortcov,1,prev,cur,1,&wire,&wl,&sb,&cap,&depth,&nodes);
              er=one_g02_exact_wire_size(16,16,&shortcov,1,1,&a,&b,&c,&d);
              assert(wr<0 && er<0);

              /* Acceptance-domain parity: canonical wire would fit because the
               * target is a Ref, but the seed's conservative cap exceeds the
               * 128 MiB limit. Exact sizing must not silently accept it. No
               * payload is dereferenced because both paths reject pre-emission. */
              static const uint8_t dummy=0;
              one_g02_segment capdrift={0};
              capdrift.start=0u; capdrift.length=64u*1024u*1024u; capdrift.kind=0u;
              wr=one_g02_native_writer(&dummy,64u*1024u*1024u,&dummy,64u*1024u*1024u,
                                       &capdrift,1,prev,cur,1,&wire,&wl,&sb,&cap,&depth,&nodes);
              er=one_g02_exact_wire_size(64u*1024u*1024u,64u*1024u*1024u,
                                         &capdrift,1,1,&a,&b,&c,&d);
              assert(wr<0 && er<0);
          }

          int main(void) {
              static const uint8_t s[]="abcdefghijklmnop";
              static const uint8_t t[]="abcdZZZZijklmnop";
              one_g02_segment seg[]={{0,4,0},{4,4,1},{8,8,0}};
              check(s,16,t,16,seg,3,1);
              check(s,16,t,16,NULL,0,0);
              one_g02_segment all_surprise={0};
              all_surprise.start=0; all_surprise.length=16; all_surprise.kind=1;
              check(s,16,t,16,&all_surprise,1,1);
              randomized();
              hierarchy();
              hostile();
              printf("exact wire-size parity: PASS (%zu accepted plans + hostile rejection parity)\n",checks);
              return 0;
          }
          EOF
          cc -std=c11 -O2 -Wall -Wextra -Werror /tmp/exact_smoke.c /tmp/exact.o /tmp/writer.o -o /tmp/exact_smoke
          /tmp/exact_smoke
