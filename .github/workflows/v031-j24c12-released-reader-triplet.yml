# ci-lane: fast
# J24C12 triple installed source differential. A scientifically negative decision is a PASS.
name: CMPCT v031 J24C12 published strict native triplet
on:
  pull_request:
    paths:
      - 'research/j24c12_released_reader_*.py'
      - 'docs/v031-research/2026-10-28-j24c12-*'
      - '.github/workflows/v031-j24c12-released-reader-triplet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24c12-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-installed-triplet:
    name: J24C12 Ubuntu authentic wheels A/B/C
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: released
          ref: 80c358f8824ec1b20d349c92ed94c898090969b0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: strict
          ref: 0a128ff55c7ae0f14c6bdf019a81b40f0d894eff
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify source identity and instrument syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EVIDENCE_SHA"
          test "$(git -C released rev-parse HEAD)" = "80c358f8824ec1b20d349c92ed94c898090969b0"
          test "$(git -C strict rev-parse HEAD)" = "0a128ff55c7ae0f14c6bdf019a81b40f0d894eff"
          test "$(git -C released hash-object src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test "$(git -C strict hash-object src/cmpct/reader.py)" = "b37b786966ac1506a0439567d4a58eea472d85f8"
          test "$(git -C candidate hash-object src/cmpct/reader.py)" = "9bca5d1047f9c78984b945d7ca90e3149fe429ab"
          python -m py_compile candidate/research/j24c12_released_reader_triplet.py candidate/research/j24c12_released_reader_referee.py
          mkdir -p receipts
          printf '%s\n' "$EVIDENCE_SHA" > receipts/experimental-head.txt
      - name: Build and install three exact independent noneditable product wheels
        shell: bash
        run: |
          set -euo pipefail
          for arm in released strict candidate; do
            python -m venv "$RUNNER_TEMP/j24c12-$arm"
            py="$RUNNER_TEMP/j24c12-$arm/bin/python"
            "$py" -m pip install --upgrade pip wheel
            "$py" -m pip install "./$arm"
            "$py" -m pip freeze > "receipts/$arm-installed-dependencies.txt"
            "$py" -m pip show cmpct > "receipts/$arm-installed-metadata.txt"
          done
      - name: Execute immutable triple-source matched selective sessions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/j24c12-candidate/bin/python" \
            candidate/research/j24c12_released_reader_triplet.py \
            --released-python "$RUNNER_TEMP/j24c12-released/bin/python" \
            --strict-python "$RUNNER_TEMP/j24c12-strict/bin/python" \
            --native-python "$RUNNER_TEMP/j24c12-candidate/bin/python" \
            --output receipts/j24c12-original.json
          "$RUNNER_TEMP/j24c12-candidate/bin/python" \
            candidate/research/j24c12_released_reader_referee.py \
            --input receipts/j24c12-original.json \
            --output receipts/j24c12-verdict.json
          sha256sum receipts/j24c12-original.json receipts/j24c12-verdict.json > receipts/SHA256SUMS.txt
      - name: Preserve exact original receipts even if evidence contradicts hypothesis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24c12-authentic-released-strict-native-${{ env.EVIDENCE_SHA }}
          path: receipts/
          if-no-files-found: warn
