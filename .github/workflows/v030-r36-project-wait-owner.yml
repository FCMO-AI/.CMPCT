name: CMPCT v0.30 R36 project wait-owner attribution
# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
# Diagnostic only. R36 resolves R35's Condition.wait sink to a CMPCT-owned frame; no release credit.

on:
  pull_request:
  push:
    branches:
      - 'agent/v030-authoritative-integration'
    paths:
      - 'benchmarks/v030_r36_regenerable_deflate_project_wait_owner.py'
      - 'docs/v030-rnd/R36_REGENERABLE_DEFLATE_PROJECT_WAIT_OWNER_PREREG.md'
      - '.github/workflows/v030-r36-project-wait-owner.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify-latest-head:
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-r36-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_receipt: ${{ steps.scope.outputs.run_receipt }}
      run_r37: ${{ steps.scope.outputs.run_r37 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Classify exact latest-head commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(experiments/v030_r37_batched_encode_probe\.py|\.github/workflows/v030-r37-batched-encode-probe\.yml|\.github/workflows/v030-r36-project-wait-owner\.yml)$'; then
            echo 'run_r37=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_r37=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || printf '%s\n' "$changed" | grep -Eq '^(benchmarks/v030_r36_regenerable_deflate_project_wait_owner\.py|docs/v030-rnd/R36_REGENERABLE_DEFLATE_PROJECT_WAIT_OWNER_PREREG\.md)$'; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_receipt=false' >> "$GITHUB_OUTPUT"
          fi

  r36-attribution:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run frozen R36 project wait-owner attribution
        env:
          CMPCT_EVIDENCE_HEAD: ${{ env.EVIDENCE_HEAD }}
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r36_regenerable_deflate_project_wait_owner.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/r36-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/r36-project-wait-owner.json"
      - uses: actions/upload-artifact@v6
        with:
          name: v030-r36-project-wait-owner-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/r36-project-wait-owner.json
          if-no-files-found: error
          retention-days: 90

  r37-batched-encode:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_r37 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Build frozen R34/R36 source trees and run R37
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          from pathlib import Path
          from benchmarks import v030_r34_regenerable_deflate_same_run_phase_attribution as R34
          full,nested,identity=R34.build_sources(Path('benchmark-artifacts/r37-work'))
          Path('benchmark-artifacts/sources.txt').write_text(str(full.resolve())+'\n'+str(nested.resolve())+'\n'+identity+'\n')
          PY
          mapfile -t src < benchmark-artifacts/sources.txt
          python experiments/v030_r37_batched_encode_probe.py "${src[0]}" --workers 8 --repetitions 7 --output benchmark-artifacts/r37-full.json
          python experiments/v030_r37_batched_encode_probe.py "${src[1]}" --workers 8 --repetitions 7 --output benchmark-artifacts/r37-nested.json
      - name: Enforce identity and emit decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows={n:json.loads(Path(f'benchmark-artifacts/r37-{n}.json').read_text()) for n in ('full','nested')}
          assert all(r['identity'] for r in rows.values())
          decision='BATCHING_TRANSFERS' if all(r['median_seconds_saved']>0 for r in rows.values()) else 'BATCHING_DOES_NOT_TRANSFER'
          out={'schema':'cmpct-v030-r37-batched-encode-result-v1','decision':decision,'targets':rows}
          Path('benchmark-artifacts/r37-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v030-r37-batched-encode-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/r37-*.json
          if-no-files-found: error
          retention-days: 90
