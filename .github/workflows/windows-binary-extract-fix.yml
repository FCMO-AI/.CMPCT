name: CMPCT bounded Windows binary extraction repair
on:
  pull_request:
    paths: [".github/workflows/windows-binary-extract-fix.yml"]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact binary-mode repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/cmpct/reader.py'); s=p.read_text()
          old="os.O_WRONLY|os.O_CREAT|os.O_TRUNC,mode or 0o666"
          new="os.O_WRONLY|os.O_CREAT|os.O_TRUNC|getattr(os,'O_BINARY',0),mode or 0o666"
          assert s.count(old)==2,s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- src/cmpct/reader.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cmpct/reader.py
          git commit -m 'fix: force binary mode for Windows extraction writes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
