# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 ZIP-factor recovery memory FFI frontier

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_zipfactor_recovery_memory_ffi_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_native_ffi_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_oracle.py'
      - 'experiments/entropygraph_v030_zipfactor_eocd_parser.py'
      - 'experiments/entropygraph_v030_zipfactor_fused.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3_fused_finalize.py'
      - 'native/cmpct-zipfactor-v3-ffi/**'
      - 'native/cmpct-portable/src/bin/cmpct-zipfactor-v3-preparity.rs'
      - '.github/workflows/v030-zipfactor-recovery-memory-ffi-frontier.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_zipfactor_recovery_memory_ffi_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_native_ffi_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_oracle.py'
      - 'experiments/entropygraph_v030_zipfactor_eocd_parser.py'
      - 'experiments/entropygraph_v030_zipfactor_fused.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3_fused_finalize.py'
      - 'native/cmpct-zipfactor-v3-ffi/**'
      - 'native/cmpct-portable/src/bin/cmpct-zipfactor-v3-preparity.rs'
      - '.github/workflows/v030-zipfactor-recovery-memory-ffi-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-recovery-memory-ffi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_zipfactor_recovery_(memory|native)_ffi_frontier\.py|benchmarks/v030_zipfactor_recovery_oracle\.py|experiments/entropygraph_v030_zipfactor_(eocd_parser|fused|compact_v3|compact_v3_fused_finalize)\.py|native/cmpct-zipfactor-v3-ffi/|native/cmpct-portable/src/bin/cmpct-zipfactor-v3-preparity\.rs|\.github/workflows/v030-zipfactor-recovery-memory-ffi-frontier\.yml)' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect the recovery memory-FFI frontier.'
          fi

  recovery-memory-ffi-frontier:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact comparator dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile exact in-memory recovery frontier
        run: |
          python -m py_compile experiments/entropygraph_v030_zipfactor_eocd_parser.py
          python -m py_compile experiments/entropygraph_v030_zipfactor_fused.py
          python -m py_compile benchmarks/v030_zipfactor_recovery_memory_ffi_frontier.py
          cargo build --release --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml
          cargo fmt --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml -- --check
          cargo clippy --manifest-path native/cmpct-zipfactor-v3-ffi/Cargo.toml -- -D warnings
      - name: Run recovered candidate without scratch V3 publication
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_zipfactor_recovery_memory_ffi_frontier \
            --work-root "$RUNNER_TEMP/v030-zf-recovery-memory-ffi" \
            --native-library "$GITHUB_WORKSPACE/native/cmpct-zipfactor-v3-ffi/target/release/libcmpct_zipfactor_v3_ffi.so" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-recovery-memory-ffi.json"
      - name: Ratchet exact bytes, recovery and strict four-way boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('benchmark-artifacts/v030-zf-recovery-memory-ffi.json').read_text())
          assert e['schema']=='cmpct-v030-zipfactor-recovery-memory-ffi-frontier-v1'
          c=e['contract']
          assert c['rounds']==9 and c['ties_fail'] is True
          assert c['native_compile_inside_timing'] is False
          assert c['native_library_load_inside_timing'] is False
          assert c['native_ffi_call_inside_timing'] is True
          assert c['scratch_v3_publication_inside_timing'] is False
          assert c['native_archive_open_inside_timing'] is False
          assert c['native_byte_slice_ffi'] is True
          assert c['ffi_preparity_semantics_preserved'] is True
          assert c['ffi_streams_reconstructed_zip_sha256'] is True
          assert c['ffi_full_reconstructed_zip_allocation'] is False
          assert c['archive_bytes_changed'] is False and c['selector_change'] is False
          assert c['release_credit'] is False and e['release_credit'] is False
          assert e['experiment_valid'] is True
          assert e['legacy_recovery_byte_identical'] is True
          assert e['legacy_recovery_sha256'] == e['direct_probe_sha256']
          assert e['recovery_semantics_passed'] is True
          assert e['memory_ffi_corruption_rejected'] is True
          assert e['candidate']['archive_bytes'] == 14227
          assert e['candidate']['base_v3_bytes'] == 14033
          assert e['candidate']['recovery_overhead_bytes'] == 194
          assert e['candidate']['payload_body_copies'] == 1
          assert e['candidate']['control_copies'] == 2
          assert e['sizes']['cmpct'] < e['sizes']['zip']
          assert e['sizes']['cmpct'] < e['sizes']['zstd19']
          assert len(e['samples_s']['cmpct'])==len(e['samples_s']['zip'])==len(e['samples_s']['zstd19'])==9
          expected=(e['sizes']['cmpct'] < e['sizes']['zip'] and e['sizes']['cmpct'] < e['sizes']['zstd19']
                    and e['medians_s']['cmpct'] < e['medians_s']['zip'] and e['medians_s']['cmpct'] < e['medians_s']['zstd19'])
          assert e['strict_four_way_win'] is expected
          assert e['promotion_signal'] is expected
          Path('benchmark-artifacts/v030-zf-recovery-memory-ffi-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zipfactor-recovery-memory-ffi-frontier-${{ steps.candidate.outputs.sha || env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-zf-recovery-memory-ffi.json
            benchmark-artifacts/v030-zf-recovery-memory-ffi-candidate.txt
          if-no-files-found: warn
          retention-days: 90
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-recovery-memory-ffi-frontier.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

# Research-only but high-value: exact recovered ZIP-factor bytes can advance to portable/native productization. The
# old lane never reached timing because a formatting failure aborted compilation, and later pushes could cancel an
# exact receipt. This workflow repairs evidence execution only: archive bytes, recovery semantics, comparators,
# timing inclusion, selector policy and release credit remain unchanged.
