# ci-lane: fast
name: v031 Direct Deflate Mutable-Source O2 Court

on:
  push:
    branches:
      - agent/phased3-v031-deflate-export-mutable-source-o2-20261023

permissions:
  contents: read

concurrency:
  group: v031-deflate-mmap-mutation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  mutable-source-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Verify source commit identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Execute preregistered real revision-24 mutable mmap court
        run: python benchmarks/v031_deflate_mmap_mutation_o2_court.py --output deflate-mutation-evidence/result.json
      - name: Execute preregistered staged-output O3 under identical mutation
        run: python benchmarks/v031_deflate_staged_output_o3_court.py --output deflate-mutation-evidence/o3-result.json
      - name: Execute preregistered verifier-fed compressed wire identity O4
        run: python benchmarks/v031_deflate_wire_identity_o4_court.py --output deflate-mutation-evidence/o4-result.json
      - name: Record source SHA and file blob identities
        if: always()
        run: |
          mkdir -p deflate-mutation-evidence
          git rev-parse HEAD > deflate-mutation-evidence/source.sha
          git hash-object src/cmpct/reader.py > deflate-mutation-evidence/reader.blob
          git hash-object benchmarks/v031_deflate_mmap_mutation_o2_court.py > deflate-mutation-evidence/oracle.blob
          git hash-object benchmarks/v031_deflate_staged_output_o3_court.py > deflate-mutation-evidence/o3-oracle.blob
          git hash-object benchmarks/v031_deflate_wire_identity_o4_court.py > deflate-mutation-evidence/o4-oracle.blob
          git hash-object benchmarks/history/2026-10-23-v031-deflate-wire-identity-o4-prereg.md > deflate-mutation-evidence/o4-prereg.blob
          git hash-object benchmarks/history/2026-10-23-v031-deflate-staged-output-o3-prereg.md > deflate-mutation-evidence/o3-prereg.blob
          git hash-object benchmarks/history/2026-10-23-v031-direct-deflate-mutable-source-o2-prereg.md > deflate-mutation-evidence/prereg.blob
      - name: Upload primary evidence even when expectation is falsified
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-direct-deflate-mmap-o2-${{ github.sha }}
          path: deflate-mutation-evidence/
          if-no-files-found: error
