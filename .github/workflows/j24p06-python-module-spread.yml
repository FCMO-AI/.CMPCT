# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT J24P06 installed Python-module ownership court
on:
  pull_request:
    paths:
      - "tools/j24p06_python_module_spread_court.py"
      - "tools/j24p06_detached_referee.py"
      - "docs/v031-research/*j24p06*"
      - ".github/workflows/j24p06-python-module-spread.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24p06-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  latest-head-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_court: ${{ steps.scope.outputs.run_court }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind source and dispatch to current HEAD
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(tools/j24p06_python_module_spread_court\.py|tools/j24p06_detached_referee\.py|docs/v031-research/.*j24p06.*|\.github/workflows/j24p06-python-module-spread\.yml)$'; then
            echo 'run_court=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_court=false' >> "$GITHUB_OUTPUT"
          fi
  physical-source-court:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_court == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Execute inert physical ZIP and installed-byte court
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python tools/j24p06_python_module_spread_court.py --output-dir j24p06-results
      - name: Independent full RECORD and actual filesystem referee
        shell: bash
        run: |
          set -euo pipefail
          python tools/j24p06_detached_referee.py j24p06-results --output j24p06-detached-referee.json
      - name: Preserve original source and installed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24p06-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: |
            j24p06-results/court.json
            j24p06-detached-referee.json
            j24p06-results/wheels/*/*.whl
            j24p06-results/installed/*/cmpct/native_codec.py
            j24p06-results/installed/*/cmpct/cmpct_core.cpython-311-darwin.so
            j24p06-results/installed/*/cmpct-0.30.0.dist-info/RECORD
          if-no-files-found: warn
          retention-days: 30
