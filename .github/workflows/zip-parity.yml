name: CMPCT release performance gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMPCT_PARITY_REPS: "5"
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'

      - name: Correctness gate
        run: python -m pytest -q

      - name: Resolve direct comparison base
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$EVENT_BASE"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate: $(git rev-parse HEAD)"
          echo "Base:      $BASE_SHA"

      - name: Materialize base worktree
        run: git worktree add --detach /tmp/cmpct-performance-base "${{ steps.base.outputs.sha }}"

      - name: Capture shared-runner provenance
        run: |
          mkdir -p benchmark-artifacts
          {
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "base_commit=${{ steps.base.outputs.sha }}"
            echo "candidate_version=$(python -c 'import cmpct; print(cmpct.__version__)')"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "filesystem=$(df -T . | tail -1)"
            echo "cpu_count=$(nproc)"
            echo "cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            echo "mem=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "zstd=$(zstd --version | head -1)"
          } | tee benchmark-artifacts/environment.txt

      - name: Benchmark direct base
        working-directory: /tmp/cmpct-performance-base/benchmarks
        env:
          PYTHONPATH: /tmp/cmpct-performance-base/src
        run: |
          python zip_parity_bench.py > "$GITHUB_WORKSPACE/benchmark-artifacts/base.stdout.txt"
          cp _parity_work/out/zip-parity.json "$GITHUB_WORKSPACE/benchmark-artifacts/base.json"

      - name: Benchmark candidate
        working-directory: benchmarks
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python zip_parity_bench.py > ../benchmark-artifacts/candidate.stdout.txt
          cp _parity_work/out/zip-parity.json ../benchmark-artifacts/candidate.raw.json
          python - <<'PY'
          import json, os, subprocess
          from datetime import date
          from pathlib import Path
          import tomllib

          root = Path.cwd().parent
          src = root / 'benchmark-artifacts/candidate.raw.json'
          data = json.loads(src.read_text())
          with (root / 'pyproject.toml').open('rb') as fh:
              version = tomllib.load(fh)['project']['version']
          data['project_version'] = version
          data['source_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          data['date'] = date.today().isoformat()
          data['record_kind'] = 'release_candidate_regression_evidence'
          data['harness'] = 'benchmarks/zip_parity_bench.py'
          data['format_revision'] = 24
          data['comparison_base_commit'] = os.environ.get('BASE_SHA', '')
          (root / 'benchmark-artifacts/candidate.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Reject performance regressions
        run: |
          python tools/check_performance_regression.py \
            --base benchmark-artifacts/base.json \
            --candidate benchmark-artifacts/candidate.json \
            --timing-relative 0.05 \
            --timing-absolute-ms 3 \
            --summary benchmark-artifacts/PERFORMANCE_GATE.md

      - name: Publish performance summary
        if: always()
        run: |
          if [ -f benchmark-artifacts/PERFORMANCE_GATE.md ]; then
            cat benchmark-artifacts/PERFORMANCE_GATE.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-release-performance-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error

# Footnote: release timing is never compared across unrelated historical machines. Base and candidate
# run in the same job, with the same dependency set and repetition count. Archive size has zero
# tolerance; timing gets a small two-dimensional noise envelope so shared-runner jitter cannot be
# mistaken for a product regression. A slowdown outside that envelope blocks the update.
