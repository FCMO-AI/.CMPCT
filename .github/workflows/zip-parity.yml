name: CMPCT ZIP parity benchmark

on:
  pull_request:
    paths:
      - 'src/cmpct/builder.py'
      - 'src/cmpct/codec.py'
      - 'benchmarks/**'
      - '.github/workflows/zip-parity.yml'
  push:
    branches: [main]
    paths:
      - 'src/cmpct/builder.py'
      - 'src/cmpct/codec.py'
      - 'benchmarks/**'
      - '.github/workflows/zip-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CMPCT_PARITY_REPS: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'

      - name: Correctness gate
        run: python -m pytest -q

      - name: Capture provenance
        run: |
          mkdir -p benchmark-artifacts
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$(python -c 'import cmpct; print(cmpct.__version__)')"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "filesystem=$(df -T . | tail -1)"
            echo "cpu_count=$(nproc)"
            echo "cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            echo "mem=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "zstd=$(zstd --version | head -1)"
          } | tee benchmark-artifacts/environment.txt

      - name: Run fair ZIP parity benchmark
        working-directory: benchmarks
        run: |
          python zip_parity_bench.py | tee ../benchmark-artifacts/zip-parity.stdout.txt
          cp _parity_work/out/zip-parity.json ../benchmark-artifacts/zip-parity.json

      - name: Summarize parity gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('benchmark-artifacts/zip-parity.json').read_text())
          lines = [
              '# CMPCT vs ZIP parity',
              '',
              'Three-repetition median. Library and CLI timings are intentionally separate.',
              '',
          ]
          for layer in ('library', 'cli'):
              lines += [
                  f'## {layer}',
                  '',
                  '| corpus | size CMPCT/ZIP | create CMPCT/ZIP ms | extract CMPCT/ZIP ms |',
                  '|---|---:|---:|---:|',
              ]
              for name, row in data['corpora'].items():
                  c = row[layer]['cmpct']
                  z = row[layer]['zip']
                  lines.append(
                      f"| {name} | {c['bytes']}/{z['bytes']} | "
                      f"{c['create_s_median']*1000:.2f}/{z['create_s_median']*1000:.2f} | "
                      f"{c['extract_s_median']*1000:.2f}/{z['extract_s_median']*1000:.2f} |"
                  )
              lines.append('')
          Path('benchmark-artifacts/SUMMARY.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Upload parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-zip-parity
          path: benchmark-artifacts/
          if-no-files-found: error

# Footnote: shared hosted-runner timing is development evidence, not marketing. The important property
# here is semantic symmetry: both formats are measured at the same process boundary and repetitions
# are recorded, so a real ZIP advantage cannot hide behind benchmark orchestration overhead. The
# workflow is intentionally scoped to encoder/codec/corpus changes: compression claims should rerun
# when representation policy changes without taxing unrelated parser or platform-integration PRs.
