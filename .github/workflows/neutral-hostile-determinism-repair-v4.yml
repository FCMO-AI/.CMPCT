name: CMPCT neutral-hostile determinism repair v4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-neutral-hostile-determinism-repair-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned corpus dependencies including media producer
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install \
            pillow==12.3.0 \
            reportlab==5.0.0 \
            python-docx==1.2.0 \
            openpyxl==3.1.5 \
            python-pptx==1.0.2 \
            numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Prove two-path repair-v4 and measure exact v0.28 bytes
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/neutral_hostile_determinism_repair_v4_check.py \
            --work-root benchmark-artifacts/CMPCT_Neutral_Hostile_Determinism_Repair_v4 \
            --output benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.json \
            2>&1 | tee benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.stdout.txt

      - name: Enforce candidate repair-v4 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.json').read_text())
          assert r['schema'] == 'cmpct-neutral-hostile-v1-determinism-repair-manifest-v4'
          assert r['requirements']['repair_v3_composed_not_rewritten'] is True
          assert r['requirements']['historical_record_rewritten'] is False
          assert len(r['rows']) == 4, r
          assert r['accepted'] is True, r
          assert r['media']['deterministic'] is True, r['media']
          assert not r['media']['file_differences'], r['media']
          for row in r['rows']:
              assert row['deterministic'] is True, row
              assert row['tree_sha256'] == row['second_build_tree_sha256'], row
              assert not row['file_differences'], row
              assert row['v028_candidate_bytes'] and row['v028_candidate_bytes'] > 0, row
          print(json.dumps(r, indent=2))
          PY

      - name: Focused repair-v4 wrapper tests
        run: python -m pytest -q tests/test_neutral_media_determinism_repair_v4.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize repair-v4 candidate identity
        if: always()
        run: |
          if [ -f benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.json').read_text())
          print('## Neutral/hostile repair-v4 candidate')
          print(f"- accepted: **{r['accepted']}**")
          for row in r['rows']:
              print(f"- **{row['name']}**: deterministic={row['deterministic']}, v0.28={row.get('v028_candidate_bytes')}")
          print('- Historical and repair-v3 evidence remain immutable; v4 is a separate candidate identity.')
          PY
          fi

      - name: Upload repair-v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-neutral-hostile-determinism-repair-v4-${{ github.sha }}
          path: |
            benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.json
            benchmark-artifacts/neutral-hostile-v1-determinism-repair-v4.stdout.txt
          if-no-files-found: warn

# Footnote: this workflow cannot silently promote repair-v4.  It only proves a candidate identity and
# emits exact bytes; a later commit must preserve the evidence and explicitly move dependent benchmarks.
