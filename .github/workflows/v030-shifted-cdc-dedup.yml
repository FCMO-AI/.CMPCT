# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 Shifted CDC dedup capacity

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  cdc-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Static ratchet
        run: |
          python -m py_compile benchmarks/v030_shifted_cdc_dedup_oracle.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-cdc-dedup.yml
          python tools/check_public_surface.py
      - name: Run exact Shifted CDC dedup capacity oracle
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_shifted_cdc_dedup_oracle \
            --work-root "$RUNNER_TEMP/v030-shifted-cdc-dedup" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-cdc-dedup.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-shifted-cdc-dedup.json')
          d=json.loads(p.read_text())
          d['source_commit']=os.environ['EVIDENCE_HEAD']
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
      - name: Enforce exact capacity and claim boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-cdc-dedup.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-cdc-dedup-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['files'] > 2 and d['source_bytes'] > 0
          assert len(d['arms']) == d['search_arms'] == 4
          assert d['total_trial_compression_input_bytes'] > 0
          assert d['search_compression_work_amplification_vs_source'] > 0.0
          assert 0.0 < d['best_single_pass_compression_work_amplification_vs_source'] <= 1.0
          assert d['within_decode_unit'] is True and d['max_chunk_raw_bytes'] <= 8*1024*1024
          assert d['within_locality_amplification'] is True and d['max_decoded_context_amplification'] <= 8.0
          assert d['tree_sha256'] == d['verified_tree_sha256']
          assert d['best_archive_bytes'] > 0 and len(d['best_archive_sha256']) == 64
          assert d['zip_bytes'] > 0 and d['zstd19_bytes'] > 0
          assert d['release_credit'] is False and d['product_create_time_claim'] is False
          a=d['domination_audit']
          assert a['diagnosis']=='D4' and a['radicality']=='R4'
          assert set(['S2','S3','S4']).issubset(a['active_saturation'])
          assert a['research_priority_score'] >= 90
          assert a['measured_gap_change_bytes']==d['saving_vs_shipping_prefixgraph_bytes']
          PY
      - name: Upload exact structural evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-cdc-dedup-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-cdc-dedup.json
          if-no-files-found: error
          retention-days: 90

# Terminal negative is preserved in docs/V030_SHIFTED_CDC_DEDUP_NEGATIVE.md.
# The oracle remains manually replayable for audit/reopening evidence, but the retired
# global exact-CDC ownership family no longer consumes automatic PR/push runner capacity.