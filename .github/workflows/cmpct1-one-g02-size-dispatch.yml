# ci-lane: fast
name: CMPCT1 ONE-G0.2 8KiB selector dispatch

on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_minimizer_segmented_counter_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_kernel.c"
      - "benchmarks/one/one_g02_minimizer_size_dispatch_ab.py"
      - ".github/workflows/cmpct1-one-g02-size-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run preregistered end-to-end dispatcher A/B
        id: dispatch
        run: |
          mkdir -p one-dispatch-artifacts
          python -m benchmarks.one.one_g02_minimizer_size_dispatch_ab | tee one-dispatch-artifacts/one-g02-size-dispatch-ab.json
      - name: 8KiB dispatch promoted by frozen gate
        if: steps.dispatch.outputs.decision == 'promote_8k_size_dispatch'
        run: echo "8KiB opportunity gate preserves the small path and captures lower-state offset wins"
      - name: 8KiB dispatch rejected for elapsed debt
        if: steps.dispatch.outputs.decision == 'reject_8k_dispatch_for_elapsed_debt'
        run: echo "8KiB wrapper exports unacceptable elapsed debt"
      - name: 8KiB dispatch remains inconclusive
        if: steps.dispatch.outputs.decision == 'size_dispatch_inconclusive'
        run: echo "8KiB dispatch evidence is below promotion/rejection confidence"
      - name: Retain exact-head dispatcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-size-dispatch-${{ env.EVIDENCE_HEAD }}
          path: one-dispatch-artifacts/
          if-no-files-found: error

# Encoder-discovery opportunity gate only. It creates no reader, wire, stored-byte or comparator authority.
