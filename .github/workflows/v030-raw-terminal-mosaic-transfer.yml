name: v030 RAW terminal Mosaic transfer

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_raw_terminal_mosaic_transfer_referee.py'
      - 'docs/V030_RAW_TERMINAL_MOSAIC_TRANSFER_MISSION_LOCK_2026-09-13.md'
      - '.github/workflows/v030-raw-terminal-mosaic-transfer.yml'

permissions:
  contents: read

jobs:
  referee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zstd
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy reportlab python-docx openpyxl pillow python-pptx
      - name: Run H-EFFORT-5B second hostile court
        id: referee
        continue-on-error: true
        run: |
          mkdir -p evidence
          set +e
          PYTHONPATH=. python benchmarks/v030_raw_terminal_mosaic_transfer_referee.py --out evidence/raw-terminal-mosaic-transfer.json > evidence/raw-terminal-mosaic-transfer.stdout.txt 2> evidence/raw-terminal-mosaic-transfer.stderr.txt
          rc=$?
          echo "$rc" > evidence/raw-terminal-mosaic-transfer.exitcode.txt
          exit $rc
      - name: Surface diagnostics
        if: always()
        run: |
          cat evidence/raw-terminal-mosaic-transfer.exitcode.txt 2>/dev/null || true
          cat evidence/raw-terminal-mosaic-transfer.stderr.txt 2>/dev/null || true
          cat evidence/raw-terminal-mosaic-transfer.stdout.txt 2>/dev/null || true
      - name: Preserve exact-head metadata
        if: always()
        run: |
          git rev-parse HEAD > evidence/head.txt
          git status --short > evidence/git-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-raw-terminal-mosaic-transfer-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Enforce referee execution validity
        if: steps.referee.outcome != 'success'
        run: exit 1
