# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office derived structural admission
on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_derived_structural_admission.py'
      - '.github/workflows/v030-r4-office-derived-structural-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-office-derived-admission-${{ github.sha }}
  cancel-in-progress: false
jobs:
  office-derived-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r4_office_derived_structural_admission.py
      - name: Run frozen Office derived admission falsifier
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_derived_structural_admission.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-derived-admission-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-derived-admission.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-derived-admission.json'))
          assert d['schema']=='cmpct-v030-r4-office-derived-structural-admission-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit'] and c['same_frozen_8x_certificate']
          print(json.dumps({'derived_stream_count':d['derived_stream_count'],'accepted_stream_count':d['accepted_stream_count'],'max_certificate_amplification':d['max_certificate_amplification'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-derived-structural-admission.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-derived-structural-admission-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-derived-admission.json
          if-no-files-found: error
          retention-days: 90
# Green means the frozen experiment completed; inspect the hypothesis and certificate cost.
