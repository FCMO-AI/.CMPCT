# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: CMPCT J24G85 cooperative two-process Writer-state invalidation court

on:
  push:
    branches:
      - agent/phased1-v031-j24g85-lease-revalidation-court-20261030
    paths:
      - 'research/j24g85_*'
      - 'docs/v031-research/*j24g85*'
      - '.github/workflows/v031-j24g85-lease-revalidation.yml'
  pull_request:
    branches:
      - agent/phased1-v031-j24g83-fresh-reader-per-append-control-20261030
    paths:
      - 'research/j24g85_*'
      - 'docs/v031-research/*j24g85*'
      - '.github/workflows/v031-j24g85-lease-revalidation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g85-lease-revalidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-physical-cooperative-writers:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G85_EVIDENCE_DIR: evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and prereg custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor bcbb377dffdcc1ccae1c8510b3abb8bc89233098 HEAD
          git merge-base --is-ancestor 0ff99f93063b059e1b2d08d54a667b9125f641dc HEAD
          test "$(git rev-parse HEAD:src/cmpct/transactions.py)" = 71bbc8a989d1da79d0f0dbe44f7f5c39f3304854
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged candidate and syntax check independent instruments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22'
          python -m py_compile research/j24g85_lease_revalidation_court.py research/j24g85_wire_referee.py research/j24g80_wire_referee.py
          python -m pip freeze > evidence/pip-freeze.txt
      - name: Execute physical two-process A/B/B/A and preserve original receipts
        shell: bash
        run: |
          set -o pipefail
          python research/j24g85_lease_revalidation_court.py 2>&1 | tee evidence/j24g85-run.log
          test -s evidence/j24g85-result.json
      - name: Separate-process no-CMPCT r24 wire audit and adversarial manipulations
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g85_wire_referee.py evidence | tee evidence/j24g85-independent-wire.json
      - name: Persist exact-head raw science regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g85-cooperative-writer-state-full-physical-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
