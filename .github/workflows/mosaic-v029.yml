name: CMPCT mosaic next-frontier research gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-mosaic-v029-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mosaic-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Unit and hostile bounds
        run: |
          python -m pytest -q tests/test_mosaic.py tests/test_resemblance.py

      - name: Measure optimistic single-root floor versus mosaic
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/mosaic_v029_bench.py \
            --corpus-root benchmark-artifacts/CMPCT_Mosaic_Hostile_v1 \
            --output benchmark-artifacts/mosaic-v029.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029.stdout.txt

      - name: Enforce falsification gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('benchmark-artifacts/mosaic-v029.json').read_text())
          totals = data['totals']
          print(json.dumps(totals, indent=2))
          assert data['claim_boundary'].startswith('multi-root target representation only')
          assert totals['workloads_regressed'] == 0, totals
          assert totals['mosaic_selected'] >= 3, totals
          assert totals['workloads_improved'] >= 3, totals
          assert totals['smaller_than_floor_pct'] > 5.0, totals
          assert totals['max_read_amplification'] <= 8.0, totals
          # Footnote: the threshold is part of the pre-registered campaign document.  A red result is
          # evidence against the current mechanism; this workflow must not be edited downward merely
          # because the first implementation failed to earn a release-sized effect.
          PY

      - name: Existing regression suite
        run: python -m pytest -q

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize mosaic frontier
        if: always()
        run: |
          if [ -f benchmark-artifacts/mosaic-v029.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029.json').read_text())
          t=r['totals']
          print('## Multi-root mosaic primitive')
          print(f"- candidate target bytes: **{t['candidate_bytes']:,}**")
          print(f"- optimistic single-root/direct floor: **{t['v028_optimistic_floor_bytes']:,}**")
          print(f"- improvement: **{t['smaller_than_floor_pct']:.3f}%**")
          print(f"- mosaic-selected targets: **{t['mosaic_selected']}/{t['targets']}**")
          print(f"- improved workloads: **{t['workloads_improved']}**")
          print(f"- regressed workloads: **{t['workloads_regressed']}**")
          print(f"- maximum conservative read amplification: **{t['max_read_amplification']:.3f}x**")
          PY
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-mosaic-v029-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029.json
            benchmark-artifacts/mosaic-v029.stdout.txt
          if-no-files-found: warn

# Footnote: green here proves only that several independent roots can materially improve target-delta
# representation under hard bounds.  It does not bump pyproject.toml, does not modify canonical r24,
# and does not authorize a v0.29 release.  Full-artifact integration must earn that separately.
