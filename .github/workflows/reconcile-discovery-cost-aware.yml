name: Reconcile discovery state for cost-aware Deflate search
on:
  push:
    branches: [agent/v030-authoritative-integration]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
          fetch-depth: 0
      - name: Reconcile state and self-delete
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/discovery/STATE.json'); d=json.loads(p.read_text())
          d['active_product_bottleneck']['observation'] = "Current-upstream 35681729751 is product-red at 4/15 strict joint wins. Content-ZIP remains full-matrix supported research (#201). #203 productization exposed a new general-purpose hostile: pure level-6-first can make large level-0 streams far slower despite +1 attempt boundedness. The stronger cost-aware candidate preserves level 0 first and moves level 6 second; exact head 401abba1 contains canonical order (0,6,1,2,3,4,5,7,8,9) plus fail-closed tests. Fresh exact-head regression/performance evidence is pending."
          d['active_product_bottleneck']['next_discriminator'] = "Consume #203 cost-aware exact-head regression 35738603879 and unchanged r24 performance gate 35738603723 on 401abba1. Promote only if exactness, archive-size/timing gates and the new level-0 tail-cost safety survive; then productize hidden-ZIP information-yield admission separately under #204."
          d['primary_question']['status']='PRODUCTIZATION_COST_AWARE_CODEC_LANDED_EVIDENCE_PENDING'
          d['primary_question']['hypothesis']="A cost-aware exhaustive order that keeps level 0 first and moves common exact level 6 second can retain most supported Office search benefit without the large level-0 CPU tail regression discovered against pure 6-first."
          d['primary_question']['prediction']="(0,6,1,2,3,4,5,7,8,9) should preserve exact VZIP semantics and avoid the level-0 CPU cliff while retaining a large common-stream create-work reduction; hidden-ZIP admission remains a separate later seam."
          d['primary_question']['kill']="Any canonical exact-stream/VZIP regression, archive-byte regression, confirmed create regression, unacceptable tail-cost regression, per-arm RSS debt, or locality failure blocks promotion. Pure 6-first is retired as a product candidate after the 32 MiB level-0 hostile."
          ev=d['primary_question']['evidence']
          ev=[x for x in ev if not x.startswith('#203 exact head')]
          ev.append('#203 exact head 401abba1: canonical cost-aware order (0,6,1,2,3,4,5,7,8,9); local 32 MiB level-0 hostile narrowed pure 6-first (~3.18x zeros, ~19.7x incompressible random CPU vs canonical); fresh product gates pending')
          d['primary_question']['evidence']=ev
          for c in d['frontier_candidates']:
              if c['id']=='bounded-regret-deflate-productization':
                  c['status']='COST_AWARE_IMPLEMENTED_EVIDENCE_PENDING'; c['evidence']='#203 exact head 401abba1; cost-aware canonical codec mutation landed after pure 6-first tail-cost falsifier; regression/performance gates running'
          if not any(x['family']=='pure level-6-first Deflate product order' for x in d['saturated_families']):
              d['saturated_families'].append({'family':'pure level-6-first Deflate product order','reason':'32 MiB level-0 hostile showed attempt-count boundedness does not bound CPU: ~3.18x zeros and ~19.7x incompressible random vs canonical; superseded by 0-first/6-second control'})
          d['pending_jobs']=[
            {'provider':'github-actions','run':'35738603879','source_sha':'401abba1ba4a86c673db1c914033795c276afc6e','question':'#203 cost-aware exact-head full regression','expected_artifact':'test result/diagnostic','decision_unlocked':'whether cost-aware canonical search preserves full regression'},
            {'provider':'github-actions','run':'35738603723','source_sha':'401abba1ba4a86c673db1c914033795c276afc6e','question':'#203 cost-aware unchanged r24 performance gate','expected_artifact':'ABBA release benchmark evidence','decision_unlocked':'whether cost-aware canonical search earns product promotion'}]
          d['next_action']='Consume #203 exact-head runs 35738603879 and 35738603723. Do not promote obsolete pure 6-first evidence. If cost-aware exactness/product gates survive, advance #204 content-driven information-yield admission as the next separate causal slice. Keep #202 nonblocking until a workflow-authorized route can land canonical zip-parity wiring.'
          d['last_reconciled']='2026-09-22T14:12Z'
          p.write_text(json.dumps(d,indent=2,sort_keys=False)+'\n')
          PY
          rm .github/workflows/reconcile-discovery-cost-aware.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/discovery/STATE.json .github/workflows/reconcile-discovery-cost-aware.yml
          git commit -m 'docs: record cost-aware Deflate frontier'
          git push origin HEAD:agent/v030-authoritative-integration
