# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 hidden-ZIP product gain retention
on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_hidden_zip_product_gain_retention.py'
      - 'benchmarks/v030_hidden_zip_resource_gate.py'
      - 'benchmarks/v030_hidden_zip_speed_oracle.py'
      - 'src/cmpct/v030_hidden_zip_builder.py'
      - 'src/cmpct/builder_hidden_zip.py'
      - 'src/cmpct/hidden_zip*.py'
      - 'src/cmpct/reuse_ownership.py'
      - 'src/cmpct/vzip_transaction.py'
      - '.github/workflows/v030-hidden-zip-product-gain-retention.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: v030-hidden-zip-product-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs: {run_deep: '${{ steps.scope.outputs.run_deep }}'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD >/tmp/f
          if grep -Eq '^(benchmarks/v030_hidden_zip_(product_gain_retention|resource_gate|speed_oracle)\.py|src/cmpct/(v030_hidden_zip_builder|builder_hidden_zip|hidden_zip[^/]*|reuse_ownership|vzip_transaction)\.py|\.github/workflows/v030-hidden-zip-product-gain-retention\.yml)$' /tmp/f; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi
  evidence:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: v030-hidden-zip-product-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_hidden_zip_product_gain_retention.py benchmarks/v030_hidden_zip_resource_gate.py benchmarks/v030_hidden_zip_speed_oracle.py src/cmpct/v030_hidden_zip_builder.py
      - run: python benchmarks/v030_hidden_zip_product_gain_retention.py --output benchmark-artifacts/hidden-zip-product.json
      - id: resource_gate
        continue-on-error: true
        run: python benchmarks/v030_hidden_zip_resource_gate.py --output benchmark-artifacts/hidden-zip-resource.json
      - if: always()
        run: python benchmarks/v030_hidden_zip_speed_oracle.py --output benchmark-artifacts/hidden-zip-speed-oracle.json
      - if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-hidden-zip-product-gain-retention.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-hidden-zip-product-gain-retention-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/hidden-zip-product.json
            benchmark-artifacts/hidden-zip-resource.json
            benchmark-artifacts/hidden-zip-speed-oracle.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce resource gate outcome
        if: always()
        run: test "${{ steps.resource_gate.outcome }}" = success
