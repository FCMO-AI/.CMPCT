# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 hidden-ZIP product gain retention
on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_hidden_zip_product_gain_retention.py'
      - 'src/cmpct/v030_hidden_zip_builder.py'
      - 'src/cmpct/builder_hidden_zip.py'
      - 'src/cmpct/hidden_zip*.py'
      - 'src/cmpct/reuse_ownership.py'
      - 'src/cmpct/vzip_transaction.py'
      - '.github/workflows/v030-hidden-zip-product-gain-retention.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: v030-hidden-zip-product-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_hidden_zip_product_gain_retention.py src/cmpct/v030_hidden_zip_builder.py
      - run: python benchmarks/v030_hidden_zip_product_gain_retention.py --output benchmark-artifacts/hidden-zip-product.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-hidden-zip-product-gain-retention-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/hidden-zip-product.json
          if-no-files-found: error
          retention-days: 90
