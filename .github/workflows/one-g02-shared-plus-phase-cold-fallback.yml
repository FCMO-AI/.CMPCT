name: ONE-G0.2 shared plus phase cold fallback

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/one_g02_shared_plus_phase_cold_fallback_validation.py'
      - 'benchmarks/one/one_g02_bounded_shift_phase_certificate_validation.py'
      - 'benchmarks/one/one_g02_relation_shared_observer_validation.py'
      - 'benchmarks/one/one_g02_local_gear_certificate_validation.py'
      - 'benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_direct_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_restrict_kernel.c'
      - 'docs/one/evidence/ONE_G02_SHARED_PLUS_PHASE_COLD_FALLBACK_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-shared-plus-phase-cold-fallback.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen cold-fallback validation
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_shared_plus_phase_cold_fallback_validation | tee artifacts/one/shared_plus_phase_cold_fallback.json
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-shared-plus-phase-cold-fallback-${{ github.sha }}
          path: artifacts/one/shared_plus_phase_cold_fallback.json
          if-no-files-found: error
