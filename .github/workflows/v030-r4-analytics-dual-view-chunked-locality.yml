# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Analytics dual-view locality

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_analytics_dual_view_chunked_locality.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/mosaic_v029_generalization_bench.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product*.py'
      - 'src/cmpct/**'
      - '.github/workflows/v030-r4-analytics-dual-view-chunked-locality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_analytics_dual_view_chunked_locality.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'benchmarks/mosaic_v029_generalization_bench.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v030_release_product*.py'
      - 'src/cmpct/**'
      - '.github/workflows/v030-r4-analytics-dual-view-chunked-locality.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-analytics-dual-view-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_(analytics_dual_view_chunked_locality|analytics_dual_owner_oracle)\.py|benchmarks/mosaic_v029_generalization_bench\.py|benchmarks/(neutral_hostile_corpus_v1|neutral_hostile_determinism_repair_v[^/]*)\.py|experiments/entropygraph_v030_release_product[^/]*\.py|src/cmpct/.*|\.github/workflows/v030-r4-analytics-dual-view-chunked-locality\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  dual-view-locality:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile dual-view falsifier
        run: |
          python -m py_compile \
            benchmarks/v030_r4_analytics_dual_view_chunked_locality.py \
            benchmarks/v030_r4_analytics_dual_owner_oracle.py
      - name: Run exact dual-view locality falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_analytics_dual_view_chunked_locality.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-dual-view-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-dual-view.json"
      - name: Enforce evidence contract, not scientific promotion
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-dual-view.json').read_text())
          assert d['schema']=='cmpct-v030-r4-analytics-dual-view-chunked-locality-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit']
          assert not c['production_format_changed'] and not c['production_selector_changed']
          assert c['no_chunk_size_sweep'] and c['npy_chunk_size_derived_from_two_chunk_8x_law']
          assert c['npz_leaf_size_derived_from_two_leaf_4k_range'] and c['actual_file_backed_pread']
          assert c['all_duplicate_view_index_tree_root_bytes_charged'] and c['all_physical_boundaries_adversarially_probed']
          assert c['existing_dual_owner_auth_retained_conservatively']
          assert d['hypothesis']['exact_semantic_tree']
          assert d['npz_corruption_rejected'] and d['npy_corruption_rejected']
          print(json.dumps({
            'baseline_v030_bytes':d['baseline_v030_bytes'],
            'dual_owner_bytes_before_view':d['dual_owner_bytes_before_view'],
            'candidate_bytes':d['candidate_bytes'],
            'accepted_v029_bytes':d['accepted_v029_bytes'],
            'saving_vs_v030_bytes':d['saving_vs_v030_bytes'],
            'margin_vs_v029_bytes':d['margin_vs_v029_bytes'],
            'max_npz_physical_amplification':d['max_npz_physical_amplification'],
            'max_npy_physical_amplification':d['max_npy_physical_amplification'],
            'max_npy_reconstruction_amplification':d['max_npy_reconstruction_amplification'],
            'npz_probe_count':d['npz_probe_count'],
            'npy_probe_count':d['npy_probe_count'],
            'process_peak_rss_kib':d['process_peak_rss_kib'],
            'view':d['view'],
            'hypothesis':d['hypothesis']
          },sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-analytics-dual-view-chunked-locality.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-analytics-dual-view-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-dual-view.json
          if-no-files-found: error
          retention-days: 90

# Research-only representation-boundary falsifier. Green means receipt integrity, not promotion.
