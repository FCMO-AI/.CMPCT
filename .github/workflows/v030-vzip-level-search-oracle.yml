# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 VZIP level-search oracle
on:
  push:
    branches: [agent/v030-content-zip-admission-r1]
    paths:
      - 'benchmarks/v030_vzip_level_search_oracle.py'
      - '.github/workflows/v030-vzip-level-search-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v030-vzip-level-search-${{ github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.sha }}
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Measure exact level-search ownership
        run: |
          set -o pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_vzip_level_search_oracle.py --output benchmark-artifacts/vzip-level-search.json 2>&1 | tee benchmark-artifacts/run.log
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/vzip-level-search.json'))
          assert d['schema']=='cmpct-v030-vzip-level-search-oracle-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['rows'] and d['contract']['diagnostic_only'] and not d['contract']['product_code_changed']
          assert d['contract']['all_levels_exhausted_before_failure']
          assert d['contract']['exact_stream_equality_required']
          assert d['contract']['reproducibility_classification_must_match']
          assert d['contract']['equivalent_level_aliases_allowed']
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-vzip-level-search-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-vzip-level-search-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30
