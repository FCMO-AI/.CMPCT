# ci-lane: deep
name: CMPCT v0.30 federated compact-framing frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_release_admission.py'
      - 'benchmarks/v030_federated_embedded_fs_v7_effort_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v3.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v4.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v5.py'
      - 'tests/test_v030_federated_compact_framing_v8.py'
      - 'tests/test_v030_federated_fused_verify.py'
      - 'tests/test_v030_federated_direct_memory_v4.py'
      - 'tests/test_v030_prefixgraph_admission_rejection.py'
      - '.github/workflows/v030-federated-compact-framing-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-eg08-compact-framing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  compact-framing-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile compact framing and direct office evidence
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py \
            experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py \
            experiments/entropygraph_v030_release_admission.py \
            benchmarks/v030_federated_compact_framing_v8_oracle.py \
            benchmarks/v030_federated_compact_framing_v8_direct.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v3.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v4.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v5.py
      - name: Run bounded compact-framing, fused-verification, publication, recovery and locality-admission regressions
        run: |
          python -m pytest -q \
            tests/test_v030_federated_compact_framing_v8.py \
            tests/test_v030_federated_fused_verify.py \
            tests/test_v030_federated_direct_memory_v4.py \
            tests/test_v030_prefixgraph_admission_rejection.py
      - name: Run exact office compact-framing structural frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_compact_framing_v8_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-framing.json"
      - name: Independently enforce immutable office structural byte identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-framing.json').read_text())
          assert d['schema']=='cmpct-v030-federated-eg08-compact-framing-frontier-v1'
          assert d['measurement_gate']['passed'] is True
          c=d['candidate_identity']; f=d['framing']; o=d['office_decision']
          assert c['magic_ascii']=='C25EG08'
          assert c['payload_bytes_changed'] is False
          assert c['metadata_bytes_changed'] is False
          assert c['recovery_copy_count_changed'] is False
          assert c['integrity_digests_changed'] is False
          assert c['locality_semantics_changed'] is False
          assert o['accepted_v029_bytes']==5954026
          assert o['eg07_all_best_floor_bytes']==5954067
          assert f['fixed_saving_bytes']==20
          assert f['per_pack_saving_bytes']==8
          assert o['exact_compact_framing_saving_bytes']==f['fixed_saving_bytes']+o['physical_pack_count']*f['per_pack_saving_bytes']
          assert o['eg08_projected_all_best_floor_bytes']==o['eg07_all_best_floor_bytes']-o['exact_compact_framing_saving_bytes']
          assert o['strictly_beats_v029_at_same_payload_floor'] is True
          assert o['remaining_bytes_to_strict_v029_win']==0
          PY
      - name: Run RAM-backed exact office productization frontier
        run: |
          python benchmarks/v030_federated_compact_framing_v8_direct_v5.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-direct-v5-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-direct-v5.json"
      - name: Independently require exact bytes plus v0.29 ZIP and Zstd size/create wins
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-direct-v5.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-direct-office-v5'
          assert d['candidate']=='C25EG08'
          assert d['schedule']=='tmpfs-semantic-stage-plus-direct-exact-eg08-emission'
          b=d['single_pass_boundary']
          assert b['graph_search_changed'] is False
          assert b['probe_compression_changed'] is False
          assert b['final_pack_compressed_once'] is True
          assert b['exact_serial_archive_identity_required'] is True
          assert b['raw_final_graph_captured_in_memory'] is True
          assert b['raw_final_graph_capture_backend']=='linux-tmpfs-/dev/shm'
          assert b['semantic_staging_publications']==1
          assert b['disk_backed_intermediate_publications']==0
          assert b['intermediate_archive_publications']==1
          assert b['final_eg08_publications']==1
          assert b['historical_finalize_path_preserved'] is True
          assert d['accepted_v029_bytes']==5954026
          assert d['eg07_all_best_floor_bytes']==5954067
          assert d['framing_saving_bytes']==92
          assert d['measurement_gate']['passed'] is True
          m=d['measured_candidate']; s=m['strict']; c=d['comparators']; r=d['serial_reference']; dm=m['direct_memory']
          assert len(m['raw_verified_create_s'])==3
          assert len(c['zip']['raw_create_s'])==3
          assert len(c['zstd19']['raw_create_s'])==3
          assert dm['raw_final_eg07_disk_publication'] is False
          assert dm['raw_final_eg07_ram_staging_publications']==1
          assert dm['recompressed_eg07_disk_publication'] is False
          assert dm['separate_compaction_pass'] is False
          assert dm['final_eg08_publications']==1
          assert dm['semantic_finalization_path_preserved'] is True
          assert dm['ram_backend']=='/dev/shm'
          assert m['archive_bytes']==r['archive_bytes']
          assert m['archive_sha256']==r['archive_sha256']
          assert m['archive_bytes'] < d['accepted_v029_bytes']
          assert m['archive_bytes'] < c['zip']['archive_bytes']
          assert m['archive_bytes'] < c['zstd19']['archive_bytes']
          assert m['median_verified_create_s'] < c['zip']['median_create_s']
          assert m['median_verified_create_s'] < c['zstd19']['median_create_s']
          assert s['beats_accepted_v029_size'] is True
          assert s['beats_zip_size'] is True
          assert s['beats_zstd19_size'] is True
          assert s['verified_create_beats_zip'] is True
          assert s['verified_create_beats_zstd19'] is True
          assert s['within_release_locality_bounds'] is True
          assert s['byte_identical_to_serial_selected_policy'] is True
          assert s['passed'] is True
          assert d['measurement_gate']['parallel_exact_byte_identity'] is True
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-compact-framing-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-eg08-framing.json
            benchmark-artifacts/v030-eg08-direct-v5.json
          if-no-files-found: warn
          retention-days: 90

# C25EG08 is research-only. This lane requires both the structural framing proof and a direct repeated candidate
# win over immutable v0.29, ZIP and Zstd. The v5 timed boundary preserves the historical EG05/EG06/EG07 finalize
# contract through one RAM-backed /dev/shm staging publication: ordinary pathlib read/write and recovery semantics
# stay real while block-backed disk I/O is eliminated. Final packs are then compressed exactly once at the proved
# selected levels and final C25EG08 is published directly; no recompressed EG07 or separate compaction artifact is
# emitted. Timing receives credit only after exact byte/SHA identity with the ordinary serial selected-effort
# archive. Strong verification still authenticates every physical pack plus the inner and canonical trees. This
# lane cannot authorize selector/native/Android promotion or weaken any all-15 external, generalization, runtime,
# native, Android or final release gate.
