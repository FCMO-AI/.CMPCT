# ci-lane: deep
name: CMPCT v0.30 federated compact-framing frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_release_admission.py'
      - 'benchmarks/v030_federated_embedded_fs_v7_effort_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v3.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v4.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v5.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_exec_v6.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_exec_v7.py'
      - 'tests/test_v030_federated_compact_framing_v8.py'
      - 'tests/test_v030_federated_fused_verify.py'
      - 'tests/test_v030_federated_direct_memory_v4.py'
      - 'tests/test_v030_prefixgraph_admission_rejection.py'
      - '.github/workflows/v030-federated-compact-framing-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-eg08-compact-framing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  compact-framing-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile compact framing and direct office evidence
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py \
            experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py \
            experiments/entropygraph_v030_release_admission.py \
            benchmarks/v030_federated_compact_framing_v8_oracle.py \
            benchmarks/v030_federated_compact_framing_v8_direct.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v3.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v4.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v5.py \
            benchmarks/v030_federated_compact_framing_v8_policy_exec_v6.py \
            benchmarks/v030_federated_compact_framing_v8_policy_exec_v7.py
      - name: Run bounded compact-framing, fused-verification, publication, recovery and locality-admission regressions
        run: |
          python -m pytest -q \
            tests/test_v030_federated_compact_framing_v8.py \
            tests/test_v030_federated_fused_verify.py \
            tests/test_v030_federated_direct_memory_v4.py \
            tests/test_v030_prefixgraph_admission_rejection.py
      - name: Run exact office compact-framing structural frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_compact_framing_v8_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-framing.json"
      - name: Independently enforce immutable office structural byte identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-framing.json').read_text())
          assert d['schema']=='cmpct-v030-federated-eg08-compact-framing-frontier-v1'
          assert d['measurement_gate']['passed'] is True
          c=d['candidate_identity']; f=d['framing']; o=d['office_decision']
          assert c['magic_ascii']=='C25EG08'
          assert c['payload_bytes_changed'] is False
          assert c['metadata_bytes_changed'] is False
          assert c['recovery_copy_count_changed'] is False
          assert c['integrity_digests_changed'] is False
          assert c['locality_semantics_changed'] is False
          assert o['accepted_v029_bytes']==5954026
          assert o['eg07_all_best_floor_bytes']==5954067
          assert f['fixed_saving_bytes']==20
          assert f['per_pack_saving_bytes']==8
          assert o['exact_compact_framing_saving_bytes']==f['fixed_saving_bytes']+o['physical_pack_count']*f['per_pack_saving_bytes']
          assert o['eg08_projected_all_best_floor_bytes']==o['eg07_all_best_floor_bytes']-o['exact_compact_framing_saving_bytes']
          assert o['strictly_beats_v029_at_same_payload_floor'] is True
          assert o['remaining_bytes_to_strict_v029_win']==0
          PY
      - name: Run proof-boundary-corrected exact office productization frontier
        run: |
          python benchmarks/v030_federated_compact_framing_v8_policy_exec_v7.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v7-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v7.json"
      - name: Preserve exact office evidence; require strict four-way law for promotion only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-policy-v7.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-policy-exec-v7'
          assert d['experiment_valid'] is True
          assert d['release_credit'] is False
          change=d['execution_change']
          assert change['proof_source_tree_precomputed_outside_timed_boundary'] is True
          assert change['archive_strong_verification_still_timed'] is True
          assert change['comparator_timing_changed'] is False
          assert change['archive_bytes_changed'] is False
          assert change['selected_levels_changed'] is False
          s=d['strict']; m=d['measured_candidate']; c=d['comparators']
          assert s['beats_accepted_v029_size'] is True
          assert s['beats_zip_size'] is True
          assert s['beats_zstd19_size'] is True
          assert s['within_release_locality_bounds'] is True
          assert s['content_identity_not_policy_input'] is True
          assert s['exact_serial_archive_identity'] is True
          assert s['same_selected_level_vector'] is True
          assert m['archive_bytes'] < d['accepted_v029_bytes']
          assert m['archive_bytes'] < c['zip']['archive_bytes']
          assert m['archive_bytes'] < c['zstd19']['archive_bytes']
          expected_promotion = bool(
              s['verified_create_beats_zip']
              and s['verified_create_beats_zstd19']
              and s['passed']
              and m['median_verified_create_s'] < c['zip']['median_create_s']
              and m['median_verified_create_s'] < c['zstd19']['median_create_s']
          )
          assert d['promotion_signal'] is expected_promotion
          # A genuine ZIP-speed loss is valid negative evidence, never a silent pass or
          # release credit. If performance improves enough, the same unchanged strict
          # conditions turn promotion_signal on automatically.
          if not expected_promotion:
              assert not (s['verified_create_beats_zip'] and s['verified_create_beats_zstd19'] and s['passed'])
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-compact-framing-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-eg08-framing.json
            benchmark-artifacts/v030-eg08-policy-v7.json
          if-no-files-found: warn
          retention-days: 90

# C25EG08 is research-only. The structural framing proof remains immutable. The timed productization boundary now
# uses the exact v6 feature-pruned executor with only the normalized source-tree proof oracle moved outside timing;
# archive strong verification stays fully timed, and archive bytes, selected levels, recovery/locality semantics and
# ZIP/Zstd comparator timing are unchanged. Valid negative performance evidence may complete this research lane, but
# promotion_signal still requires the same strict four-way office win and release_credit remains false. This lane
# cannot authorize selector/native/Android promotion or weaken any all-15 external, generalization, runtime, native,
# Android or final release gate.
