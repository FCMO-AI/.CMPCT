# ci-lane: fast
name: CMPCT1 ONE-G0.2 fused cache traffic economics

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - experiments/one/cache_fused_observe.py
      - experiments/one/fused_cache_cost_ledger.py
      - benchmarks/one/one_g02_fused_cache_traffic_economics.py
      - .github/workflows/cmpct1-one-g02-fused-cache-traffic-economics.yml
  pull_request:
    paths:
      - experiments/one/cache_fused_observe.py
      - experiments/one/fused_cache_cost_ledger.py
      - benchmarks/one/one_g02_fused_cache_traffic_economics.py
      - .github/workflows/cmpct1-one-g02-fused-cache-traffic-economics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct1-one-g02-fused-cache-traffic-economics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  traffic-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EVIDENCE_HEAD }}"
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision repository test contract
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run fused-cache hostile tests
        run: python -m pytest -q tests/one/test_fused_cache_cost_ledger.py tests/one/test_cache_fused_observe.py
      - name: Run charged-traffic falsifier
        run: |
          set -o pipefail
          mkdir -p artifacts
          python benchmarks/one/one_g02_fused_cache_traffic_economics.py | tee artifacts/one_g02_fused_cache_traffic_economics.json
      - name: Upload charged-traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-fused-cache-traffic-economics-${{ env.EVIDENCE_HEAD }}
          path: artifacts/one_g02_fused_cache_traffic_economics.json
          if-no-files-found: warn
