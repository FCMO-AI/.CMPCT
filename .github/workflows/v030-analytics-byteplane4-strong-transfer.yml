# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics BytePlane4 strong transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_byteplane4_strong_transfer_referee.py'
      - '.github/workflows/v030-analytics-byteplane4-strong-transfer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_byteplane4_strong_transfer_referee.py'
      - '.github/workflows/v030-analytics-byteplane4-strong-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-analytics-bp4-strong-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_byteplane4_strong_transfer_referee\.py|\.github/workflows/v030-analytics-byteplane4-strong-transfer\.yml)$' /tmp/files; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  strong-byteplane4-transfer:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_analytics_byteplane4_strong_transfer_referee.py
      - name: Execute frozen strong-transfer referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_byteplane4_strong_transfer_referee.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-bp4-strong-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-bp4-strong.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-bp4-strong.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-byteplane4-strong-transfer-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['width']==4 and d['level']==19
          assert d['contract']['fixed_width_no_sweep'] is True
          assert d['contract']['path_extension_workload_identity_forbidden'] is True
          assert d['gate']['exact_reconstruction'] is True
          assert d['verdict'] in {'EARNED_MARGIN_FOR_ONE_SEARCH_ABLATION','RETIRE_BYTEPLANE4_AS_STRONG_MARGIN_SOURCE'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-byteplane4-strong-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-bp4-strong-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-bp4-strong.json
          if-no-files-found: error
          retention-days: 90

# Research-only representation-margin referee. Green means the receipt is valid, not that BP4 won.
