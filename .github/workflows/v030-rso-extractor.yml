name: CMPCT v0.30 Representation Superoptimizer child oracle

on:
  push:
    branches:
      - agent/v030-rso-extractor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-rso-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representation-superoptimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out RSO research head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run shared-cost extractor tests
        run: |
          pytest -q tests/test_v030_representation_superoptimizer.py

      - name: Run phase-ordering falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/representation_superoptimizer_v030_probe.py \
            --output benchmark-artifacts/rso-phase-ordering-v030.json

      - name: Enforce frozen optimizer semantics contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmark-artifacts/rso-phase-ordering-v030.json').read_text())
          totals = data['totals']
          contract = data['contract']
          assert data['schema'] == 'cmpct-v030-rso-phase-ordering-probe-v1'
          assert totals['cases'] == contract['expected_cases']
          assert totals['all_beam_match_exact'] is True
          assert totals['global_saving_vs_phase_ordered_local_bytes'] > 0
          assert totals['mechanism_gate'] is True
          print(json.dumps(totals, indent=2, sort_keys=True))
          PY

      - name: Upload optimizer evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-rso-extractor-child
          path: benchmark-artifacts/
          if-no-files-found: warn
