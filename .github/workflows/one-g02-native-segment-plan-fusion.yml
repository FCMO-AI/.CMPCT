name: ONE-G0.2 native segment-plan fusion

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_native_segment_plan_fusion.py'
      - 'benchmarks/one/one_g02_native_segment_plan_fusion_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py'
      - 'docs/one/evidence/ONE_G02_NATIVE_SEGMENT_PLAN_FUSION_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-native-segment-plan-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-segment-plan-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen native segment-plan fusion gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_native_segment_plan_fusion | tee one-g02-native-segment-plan-fusion.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-segment-plan-fusion-${{ github.sha }}
          path: one-g02-native-segment-plan-fusion.json
          if-no-files-found: error
