# ci-lane: fast
# O121: source-exact science; no Reader product change.
name: CMPCT v0.31 O121 Reader PACK VZIP FIFO court

on:
  push:
    branches: ['agent/phased2-v031-o121-reader-pack-vzip-fifo-20261025']
  pull_request:
    paths:
      - '.github/workflows/v031-o121-reader-pack-vzip-fifo.yml'
      - 'tests/test_v031_o121_reader_pack_vzip_fifo.py'
      - 'docs/v031-research/2026-10-25-o121-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o121-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-reader-pack-vzip:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source and locked prospective preregistration
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind source/Reader/Builder/prereg and install independently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git merge-base --is-ancestor 4545d7d5b2a0b712b4b00f5a9c291d4a3a9e169b HEAD
          git merge-base --is-ancestor 0c4f723b7e09be3d0b1c430f8cfb8497f93fe0d9 HEAD
          test "$(git hash-object src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test "$(git hash-object src/cmpct/builder.py)" = "663ef0922992b1fbb8f19e6eea88d55c10a56044"
          mkdir -p o121-evidence
          git rev-parse HEAD > o121-evidence/head.sha
          git hash-object src/cmpct/reader.py > o121-evidence/reader.blob
          git hash-object src/cmpct/builder.py > o121-evidence/builder.blob
          git hash-object tests/test_v031_o121_reader_pack_vzip_fifo.py > o121-evidence/test.blob
          python -m pip install --disable-pip-version-check . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.reader,cmpct.builder
          root=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip()).resolve()
          for mod in (cmpct.reader,cmpct.builder):
              path=Path(mod.__file__).resolve()
              assert not path.is_relative_to(root),(path,root)
              print("O121_INSTALLED_MODULE="+str(path),flush=True)
          PY
      - name: Execute eight genuine extraction cases in killable processes
        shell: bash
        run: |
          set -euo pipefail
          cp tests/test_v031_o121_reader_pack_vzip_fifo.py o121-evidence/
          python -m pytest -vv -s o121-evidence/test_v031_o121_reader_pack_vzip_fifo.py --junitxml=o121-evidence/junit.xml 2>&1 | tee o121-evidence/court.log
      - name: Independently audit complete non-skipped evidence matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          cases=list(ET.parse("o121-evidence/junit.xml").getroot().iter("testcase"))
          assert len(cases)==8,("expected all eight cases",len(cases))
          counts={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          assert counts=={"failure":0,"error":0,"skipped":0},counts
          logs=Path("o121-evidence/court.log").read_text()
          rows=[json.loads(line.split("O121_CASE=",1)[1]) for line in logs.splitlines() if "O121_CASE=" in line]
          assert len(rows)==8,("missing per-case observations",len(rows))
          expected={(mode,leaf) for mode in ("pack","vzip") for leaf in ("fresh","regular","fifo","symlink_fifo")}
          assert {(x["mode"],x["leaf"]) for x in rows}==expected,rows
          for mode in ("pack","vzip"):
              cohort=[x for x in rows if x["mode"]==mode]
              assert len({x["archive_sha"] for x in cohort})==1,mode
              assert len({x["source_sha"] for x in cohort})==1,mode
          for x in rows:
              neg=x["leaf"] in ("fifo","symlink_fifo")
              assert x["outcome"]==("direct_fifo_timeout" if neg else "exact_regular"),x
              assert x["child_kind"]==("timeout" if neg else "exit"),x
              assert x["deadline_seconds"]==8,x
          receipt={"head":Path("o121-evidence/head.sha").read_text().strip(),
                   "reader_blob":Path("o121-evidence/reader.blob").read_text().strip(),
                   "builder_blob":Path("o121-evidence/builder.blob").read_text().strip(),
                   "test_blob":Path("o121-evidence/test.blob").read_text().strip(),
                   "cases":8,"passed":8,"skipped":0,"failed":0,
                   "expected_observed_timeouts":4,
                   "scope":"real installed Reader scientific negative; no correction",
                   "observations":rows}
          Path("o121-evidence/result.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("O121_AUDIT="+json.dumps({k:v for k,v in receipt.items() if k!="observations"},sort_keys=True))
          PY
      - name: Preserve all positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-o121-${{ matrix.os }}-${{ env.SOURCE_HEAD }}
          path: o121-evidence/
          retention-days: 30
          if-no-files-found: warn
