# ci-lane: fast
name: CMPCT v0.31 indexed authenticated delta replay O1
on:
  pull_request:
    paths:
      - 'src/cmpct/validation.py'
      - 'tests/test_v031_delta_replay_indexed_o1.py'
      - 'benchmarks/v031_signed_delta_replay_o0.py'
      - '.github/workflows/v031-delta-replay-o1.yml'
      - 'docs/v031-research/2026-10-24-signed-delta-replay-o1-prereg.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-indexed-delta-o1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  signed-delta-replay-o1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Prove checked-out source and preceding source-bound O0 prediction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -s docs/v031-research/2026-10-24-signed-delta-replay-o1-prereg.md
          echo "EXACT_SOURCE_HEAD=$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CMPCT package
        run: python -m pip install -e ".[test]"
      - name: Preserve independent randomized and hostile operation reference court
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p indexed-delta-o1-artifacts
          python -m pytest --noconftest -q -rs tests/test_v031_delta_replay_indexed_o1.py 2>&1 | tee indexed-delta-o1-artifacts/reference-court.log
      - name: Rerun unchanged signed r24 O0 equivalence and real preflight costs
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_signed_delta_replay_o0.py --out indexed-delta-o1-artifacts --repeats 7 2>&1 | tee indexed-delta-o1-artifacts/product-court.log
          sha256sum indexed-delta-o1-artifacts/delta-o0-receipt.json | tee indexed-delta-o1-artifacts/product-receipt.sha256
      - name: Preserve product positive or negative logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-delta-replay-o1-${{ github.sha }}
          path: indexed-delta-o1-artifacts/
          if-no-files-found: warn
          retention-days: 30
