name: CMPCT v0.30 EG08 neutral10 transfer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - experiments/entropygraph_v030_federated_adaptive_effort_candidate_v8.py
      - benchmarks/v030_eg08_neutral10_transfer.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/v030_office_physical_economics_referee.py
      - experiments/entropygraph_v025.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v5.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v6.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py
      - docs/V030_EG08_NEUTRAL10_TRANSFER_LOCK_2026-09-13.md
      - .github/workflows/v030-eg08-neutral10-transfer.yml

permissions:
  contents: read

jobs:
  eg08-neutral10-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d
          path: .frozen-v029
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Syntax check
        run: python -m py_compile benchmarks/v030_eg08_neutral10_transfer.py
      - name: Run neutral10 transfer
        id: transfer
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m benchmarks.v030_eg08_neutral10_transfer \
            --v029-checkout .frozen-v029 \
            --out evidence/eg08-neutral10-transfer.json \
            > >(tee evidence/stdout.txt) \
            2> >(tee evidence/stderr.txt >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Bind receipt
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          receipt=Path('evidence/eg08-neutral10-transfer.json'); stderr=Path('evidence/stderr.txt'); code=int('${{ steps.transfer.outputs.exit_code || 1 }}')
          if receipt.exists():
              d=json.loads(receipt.read_text()); d['candidate_sha']=os.environ['GITHUB_SHA']; d['candidate_ref']=os.environ['GITHUB_REF_NAME']; receipt.write_text(json.dumps(d,indent=2,sort_keys=True))
              label=f"{d.get('verdict','UNKNOWN')}-save{d.get('aggregate_saved_bytes','na')}-cpu{d.get('worst_cpu_ratio','na')}-rss{d.get('max_positive_rss_delta_kib','na')}"
          else:
              lines=[x.strip() for x in stderr.read_text(errors='replace').splitlines() if x.strip()] if stderr.exists() else []
              label='HARNESS_FAIL-'+re.sub(r'[^A-Za-z0-9_.-]+','-',lines[-1] if lines else 'no-receipt')[:120]
          label=re.sub(r'[^A-Za-z0-9_.-]+','-',label)[:180]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"label={label}\nexit_code={code}\n")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-eg08-neutral10-${{ steps.classify.outputs.label }}-${{ github.sha }}
          path: |
            evidence/eg08-neutral10-transfer.json
            evidence/stdout.txt
            evidence/stderr.txt
          if-no-files-found: error
      - name: Enforce harness exit
        if: always()
        run: test "${{ steps.classify.outputs.exit_code }}" = "0"
