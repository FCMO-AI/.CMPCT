# ci-lane: fast
# ci-cancel-policy: cancel-obsolete-fast-pr-check
name: CMPCT duplicate-root map fail-closed product court

on:
  pull_request:
    paths:
      - "tests/native_duplicate_root_index_oracle.py"
      - "src/cmpct/reader.py"
      - "src/cmpct/validation.py"
      - "src/cmpct/msgpack_policy.py"
      - "native/cmpct-core/src/lib.rs"
      - "docs/v031-research/DUPLICATE_MAP_KEYS_O0_PREREG.md"
      - ".github/workflows/v031-duplicate-map-keys-o0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-duplicate-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python-rust-duplicate-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          mkdir -p duplicate-root-evidence
          {
            echo "source_sha=$EVIDENCE_HEAD"
            sha256sum tests/conformance/v24-direct-codecs.json
            sha256sum tests/native_duplicate_root_index_oracle.py
            sha256sum native/cmpct-core/src/lib.rs
            sha256sum src/cmpct/reader.py
          } | tee duplicate-root-evidence/source.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native and Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd libzstd1
          python -m pip install -e '.[test]'
      - name: Build unchanged Rust native ABI at source HEAD
        working-directory: native/cmpct-core
        run: cargo build --release --locked
      - name: Exact authenticated dual-Reader fail-closed court
        run: |
          set -o pipefail
          python tests/native_duplicate_root_index_oracle.py \
            2>&1 | tee duplicate-root-evidence/court.txt
      - name: Persist exact-head negative evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-duplicate-root-${{ env.EVIDENCE_HEAD }}
          path: duplicate-root-evidence/
          if-no-files-found: error
          retention-days: 90
