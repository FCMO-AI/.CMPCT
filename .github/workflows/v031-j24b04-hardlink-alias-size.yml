# ci-lane: fast
name: CMPCT v031 J24B04 hardlink alias size custody
on:
  pull_request:
    paths:
      - 'research/j24b04_hardlink_alias_size_court.py'
      - 'research/j24b04_hardlink_alias_referee.py'
      - 'docs/v031-research/2026-10-27-j24b04-hardlink-alias-size-prereg.md'
      - '.github/workflows/v031-j24b04-hardlink-alias-size.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  alias-court:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install authentic package and separate wire referee dependencies
        run: python -m pip install -e . "zstandard>=0.22"
      - name: Execute preregistered alias court and independent raw-wire referee
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p benchmark-artifacts
          git rev-parse HEAD > benchmark-artifacts/source-head.txt
          git hash-object src/cmpct/reader.py > benchmark-artifacts/reader-blob.txt
          git hash-object src/cmpct/validation.py > benchmark-artifacts/validation-blob.txt
          J24B04_RECEIPT=benchmark-artifacts/receipt.json python research/j24b04_hardlink_alias_size_court.py
          python research/j24b04_hardlink_alias_referee.py benchmark-artifacts/receipt.json | tee benchmark-artifacts/referee.json
      - name: Check workflow classification
        if: runner.os == 'Linux'
        run: python tools/check_ci_topology.py .github/workflows/v031-j24b04-hardlink-alias-size.yml
      - name: Preserve receipts even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b04-${{ matrix.os }}-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
