name: CMPCT RAW chunk streaming parity

on:
  push:
    branches:
      - perf/raw-chunk-streaming
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Apply extraction fast path
        run: python dev/apply_raw_chunk_streaming_patch.py
      - name: Regression suite
        run: python -m pytest -q
      - name: Commit validated source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cmpct/reader.py tests/test_streaming_extract.py
          git commit -m 'Stream RAW chunks zero-copy during verified extraction'
          git push origin HEAD:perf/raw-chunk-streaming
      - name: Run fair parity benchmark
        env:
          CMPCT_PARITY_REPS: '5'
        run: python benchmarks/zip_parity_bench.py
      - name: Preserve benchmark evidence
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          p=Path('benchmarks/_parity_work/out/zip-parity.json')
          data=json.loads(p.read_text())
          def cmd(*args):
              return subprocess.check_output(args,text=True).strip()
          data.update({
              'record_kind':'development_regression_evidence',
              'source_commit':cmd('git','rev-parse','HEAD'),
              'format_revision':24,
              'harness':'benchmarks/zip_parity_bench.py',
              'environment':{
                  'python':platform.python_version(),
                  'uname':platform.platform(),
                  'filesystem':cmd('df','-T','.').splitlines()[-1],
                  'cpu_count':os.cpu_count(),
                  'cpu_model':next((line.split(':',1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), 'unknown'),
                  'zstd':cmd('zstd','--version'),
              },
          })
          b=data['corpora']['binary']['library']
          c,z=b['cmpct']['extract_s_median'],b['zip']['extract_s_median']
          data['interpretation']={
              'binary_library_extract_cmpct_s':c,
              'binary_library_extract_zip_s':z,
              'cmpct_over_zip_ratio':c/z,
              'note':'Five-repetition shared-runner development evidence. Compare against the prior durable parity record; do not treat as a public performance guarantee.'
          }
          Path('benchmarks/history/2026-08-14-raw-chunk-streaming-parity.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data['interpretation'],indent=2))
          PY
      - name: Finalize branch and remove one-shot machinery
        run: |
          git rm dev/apply_raw_chunk_streaming_patch.py .github/workflows/raw-chunk-streaming.yml
          git add benchmarks/history/2026-08-14-raw-chunk-streaming-parity.json
          git commit -m 'Preserve RAW chunk extraction parity evidence'
          git push origin HEAD:perf/raw-chunk-streaming
