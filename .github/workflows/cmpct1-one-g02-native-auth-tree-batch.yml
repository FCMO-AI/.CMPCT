# ci-lane: fast
name: CMPCT1 ONE-G0.2 native auth-tree batch
on:
  push:
    branches: [research/cmpct1]
    paths:
      - "experiments/one/native_auth_tree.py"
      - "experiments/one/native_auth_tree_kernel.c"
      - "benchmarks/one/one_g02_native_auth_tree_batch.py"
      - "tests/one/test_native_auth_tree.py"
      - "tests/one/test_native_auth_tree_batch.py"
      - "docs/one/prereg/ONE_G02_NATIVE_AUTH_TREE_BATCH_PREREG_2026-09-08.md"
      - "docs/one/evidence/ONE_G02_NATIVE_AUTH_TREE_BATCH_HOSTILE_REVIEW_2026-09-08.md"
      - ".github/workflows/cmpct1-one-g02-native-auth-tree-batch.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-native-auth-tree-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-auth-tree-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact source and frozen contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f docs/one/prereg/ONE_G02_NATIVE_AUTH_TREE_BATCH_PREREG_2026-09-08.md
          test -f docs/one/evidence/ONE_G02_NATIVE_AUTH_TREE_BATCH_HOSTILE_REVIEW_2026-09-08.md
          python - <<'PY'
          from benchmarks.one.one_g02_native_auth_tree_batch import DECISION_SIZE, LEAVES, SIZES, run
          assert DECISION_SIZE == 256 << 10
          assert tuple(SIZES) == (64 << 10, 256 << 10)
          assert tuple(LEAVES) == (80, 96, 112, 192)
          assert callable(run)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Prove semantic parity and decision law
        run: python -m pytest -q tests/one/test_native_auth_tree.py tests/one/test_native_auth_tree_batch.py
      - name: Run frozen native auth-tree falsifier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/one
          python -m benchmarks.one.one_g02_native_auth_tree_batch \
            | tee .artifacts/one/one-g02-native-auth-tree-batch-${EVIDENCE_HEAD}.json
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-auth-tree-batch-${{ env.EVIDENCE_HEAD }}
          path: .artifacts/one/one-g02-native-auth-tree-batch-${{ env.EVIDENCE_HEAD }}.json
          if-no-files-found: warn
