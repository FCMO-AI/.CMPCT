# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office relationship inventory
on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_relationship_inventory.py'
      - '.github/workflows/v030-r4-office-relationship-inventory.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-office-inventory-${{ github.sha }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile inventory
        run: python -m py_compile benchmarks/v030_r4_office_relationship_inventory.py
      - name: Run exact Office relationship inventory
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_relationship_inventory.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-inventory-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-inventory.json"
      - name: Enforce receipt integrity only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-office-inventory.json').read_text())
          assert d['schema']=='cmpct-v030-r4-office-relationship-inventory-v1'
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit'] and c['cheap_exact_relationships_only'] and c['no_semantic_similarity_claim'] and c['no_locality_credit'] and c['no_threshold_sweep']
          print(json.dumps({k:d[k] for k in ('office_root_bytes','zip_member_count','mode2_reproducible_member_count','external_member_identity_group_count','external_member_identity_avoidable_raw_duplicate_bytes','exact_member_duplicate_group_count','exact_member_duplicate_avoidable_raw_bytes','exact_stream_duplicate_group_count','exact_stream_duplicate_avoidable_bytes')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-relationship-inventory-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-inventory.json
          if-no-files-found: error
          retention-days: 90
# Green means inventory integrity only, never product credit.
