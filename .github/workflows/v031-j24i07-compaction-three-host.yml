# ci-lane: fast
# ci-cancel-policy: cancel-obsolete-fast-pr-check
name: J24I10 inherited four-case J24I08 installed compaction portability

on:
  push:
    branches:
      - "agent/phased3-v031-j24i07-*"
    paths:
      - "tests/research/j24i07_compaction_three_host.py"
      - ".github/workflows/v031-j24i07-compaction-three-host.yml"
      - "docs/v031-research/2026-10-29-j24i07-*.md"
  pull_request:
    paths:
      - "tests/research/j24i07_compaction_three_host.py"
      - ".github/workflows/v031-j24i07-compaction-three-host.yml"
      - "docs/v031-research/2026-10-29-j24i07-*.md"
      - "src/cmpct/builder.py"
      - "src/cmpct/transactions.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24i07-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-portability:
    name: Installed exact-source compaction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24I07_CHECKOUT: ${{ github.workspace }}
      CMPCT_J24I07_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24I07_ARTIFACT_DIR: ${{ github.workspace }}/j24i07-evidence/archives
      CMPCT_J24I07_RECEIPT: ${{ github.workspace }}/j24i07-evidence/court.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source, preregistration and product isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor 52d51b9446dc8876319f7bd1e6ca2b7f54681de8 HEAD
          git merge-base --is-ancestor 90ca7794b36fffbadf7b1a43be4a1272dddf9bc0 HEAD
          # This child evaluates the exact J24I08 Win32 donor composition,
          # not the earlier J24I06 source; preserve the old court on #724.
          git merge-base --is-ancestor 96989c923ed8a01f6cd6a6ca8bf69002a2409685 HEAD
          # J24I11 is deliberately a Builder product fix; freeze all other
          # J24I08 sources and the exact one-file donor rather than treating
          # the previous research-only source identity as immutable.
          git diff --exit-code 96989c923ed8a01f6cd6a6ca8bf69002a2409685 HEAD -- src/cmpct/reader.py src/cmpct/transactions.py src/cmpct/codec.py src/cmpct/_win32_times.py native/ docs/FORMAT.md docs/PERFORMANCE_RELEASE_GATE.md benchmarks/
          test "$(git diff --name-only 96989c923ed8a01f6cd6a6ca8bf69002a2409685 HEAD -- src/)" = "src/cmpct/builder.py"
          test "$(git rev-parse HEAD:src/cmpct/builder.py)" = "45ddbb3d3558a3fb70b32431ed171c24508f8e01"
          python -c "import os,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent; p.mkdir(parents=True,exist_ok=True)"
          git rev-parse HEAD > j24i07-head.txt
          python -c "import os,shutil,pathlib; shutil.copy('j24i07-head.txt',pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent/'head.txt')"
          git rev-parse 'HEAD:src/cmpct/builder.py' > j24i07-builder-blob.txt
          git rev-parse 'HEAD:src/cmpct/transactions.py' > j24i07-transactions-blob.txt
          python -c "import os,shutil,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']).parent; shutil.copy('j24i07-builder-blob.txt',p/'builder-blob.txt'); shutil.copy('j24i07-transactions-blob.txt',p/'transactions-blob.txt')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install candidate as wheel and compile independent test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m py_compile tests/research/j24i07_compaction_three_host.py
      - name: Execute real portable filesystem and archive court
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/research/j24i07_compaction_three_host.py"
      - name: Validate receipt and preserve decisive host result
        if: always()
        shell: bash
        run: |
          python -c "import os,json,pathlib; p=pathlib.Path(os.environ['CMPCT_J24I07_RECEIPT']); print('RECEIPT_EXISTS',p.exists()); x=json.loads(p.read_text()) if p.exists() else {}; print('DECISION',x.get('decision')); print('CASES',len(x.get('cases',[]))); print('HOST',x.get('host'))"
      - name: Upload physical source/output archive witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24i07-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: j24i07-evidence/
          if-no-files-found: warn
          retention-days: 90
