# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics selective admission Builder

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_selective_admission_builder.py'
      - '.github/workflows/v030-analytics-selective-admission-builder.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_selective_admission_builder.py'
      - '.github/workflows/v030-analytics-selective-admission-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-selective-builder-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          cat /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_selective_admission_builder\.py|\.github/workflows/v030-analytics-selective-admission-builder\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-selective-builder:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_analytics_selective_admission_builder.py
      - name: Execute frozen selective writer
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_selective_admission_builder.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-selective-builder-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-selective-builder.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-selective-builder.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-selective-admission-builder-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['frozen_rule']['min_raw_bytes']==262144
          assert d['frozen_rule']['max_l15_ratio_ppm']==700000
          assert d['frozen_rule']['no_threshold_search'] is True
          assert d['gate']['same_canonical_user_tree'] is True
          assert d['gate']['same_raw_physical_pack_partition'] is True
          assert d['contract']['fresh_process_per_candidate_measurement'] is True
          assert d['contract']['reader_unchanged'] is True
          assert d['verdict'] in {'PROMOTE_TO_HOSTILE_TRANSFER','RETIRE_COARSE_ADMISSION_AS_COMPUTE_SELECTOR'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-selective-admission-builder.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-selective-builder-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-selective-builder.json
          if-no-files-found: error
          retention-days: 90

# Research-only Builder. Green means the receipt is structurally valid, not that the frozen rule won.
