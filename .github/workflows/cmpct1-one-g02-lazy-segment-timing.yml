name: CMPCT1 ONE-G0.2 lazy segment timing

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - benchmarks/one/one_g02_lazy_segment_timing.py
      - benchmarks/one/one_g02_end_to_end_direct_emitter_writer.py
      - benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py
      - experiments/one/bounded_surprise_pool.py
      - experiments/one/growable_wire.py
      - docs/one/evidence/ONE_G02_LAZY_SEGMENT_TIMING_PREREG_2026-09-08.md
      - .github/workflows/cmpct1-one-g02-lazy-segment-timing.yml
  workflow_dispatch:

jobs:
  lazy-segment-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind evidence and frozen falsifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f benchmarks/one/one_g02_lazy_segment_timing.py
          test -f docs/one/evidence/ONE_G02_LAZY_SEGMENT_TIMING_PREREG_2026-09-08.md
          grep -q '^SIZE = 1 << 20$' benchmarks/one/one_g02_lazy_segment_timing.py
          grep -q '^REPETITIONS = 21$' benchmarks/one/one_g02_lazy_segment_timing.py
          grep -q '^ADMITTED_RATIO_MAX = 1.05$' benchmarks/one/one_g02_lazy_segment_timing.py
          grep -q '^REJECTED_RATIO_MAX = 0.95$' benchmarks/one/one_g02_lazy_segment_timing.py
          grep -q 'value = None' benchmarks/one/one_g02_lazy_segment_timing.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Reachability and matrix contract
        run: |
          python - <<'PY'
          from benchmarks.one import one_g02_lazy_segment_timing as b
          assert b.SIZE == 1 << 20
          assert b.REPETITIONS == 21
          assert b.ADMITTED == ("shift_plus1", "shift_plus1_damage_quarter", "fragmented_every96")
          assert b.REJECTED == ("fragmented_every32", "independent_random")
          assert b.ADMITTED_RATIO_MAX == 1.05
          assert b.REJECTED_RATIO_MAX == 0.95
          assert callable(b.run)
          PY

      - name: Run frozen lazy segment timing falsifier
        shell: bash
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_lazy_segment_timing \
            | tee one_g02_lazy_segment_timing.json

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-lazy-segment-timing-${{ env.EVIDENCE_HEAD }}
          path: one_g02_lazy_segment_timing.json
          if-no-files-found: warn
