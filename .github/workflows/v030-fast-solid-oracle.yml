# ci-lane: research
name: CMPCT v0.30 fast solid candidate oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_fast_solid_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - '.github/workflows/v030-fast-solid-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-fast-solid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fast-solid-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile oracle
        run: python -m py_compile benchmarks/v030_fast_solid_oracle.py
      - name: Run exact-tree fast-solid sweep
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_fast_solid_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-fast-solid-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-fast-solid.json"
      - name: Enforce evidence honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-fast-solid.json').read_text())
          assert d['schema']=='cmpct-v030-fast-solid-oracle-v1'
          assert d['claim_boundary'].startswith('research-only')
          assert d['summary']['workloads']==15
          assert len(d['rows'])==15
          for row in d['rows']:
              assert len(row['candidates'])==len(d['levels'])
              assert all(c['tree_verified'] is True for c in row['candidates'])
              for c in row['candidates']:
                  expected = all(c[k] for k in ('beats_zip_size','beats_zstd19_size','beats_zip_create','beats_zstd19_create'))
                  assert c['viable'] is expected
          PY
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-fast-solid-${{ github.sha }}
          path: benchmark-artifacts/v030-fast-solid.json
          if-no-files-found: error
          retention-days: 90

# Research only. This workflow may discover a promising encoder architecture, but it cannot satisfy or weaken any
# v0.30 release receipt. Promotion requires a canonical r25 implementation plus the unchanged full release gates.
