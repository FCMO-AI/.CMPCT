# ci-lane: fast
name: CMPCT v0.31 native owner discovery O5

on:
  pull_request:
    paths:
      - 'native/cmpct-core/src/lib.rs'
      - 'native/cmpct-core/include/cmpct.h'
      - 'tests/native_pack_owner_discovery_o5.py'
      - 'tests/native_pack_batch_abi.py'
      - 'docs/v031-research/NATIVE_PACK_OWNER_DISCOVERY_O5_PREREG.md'
      - 'docs/NATIVE_CORE.md'
      - '.github/workflows/v031-native-pack-owner-o5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-native-owner-o5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-owner-o5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact-source physical and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch native/cmpct-core/Cargo.lock tests/conformance/v24-pack.json tests/native_pack_owner_discovery_o5.py docs/v031-research/NATIVE_PACK_OWNER_DISCOVERY_O5_PREREG.md
          sha256sum tests/conformance/v24-pack.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build source-exact native ABI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml -- --check
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
          printf '#include "native/cmpct-core/include/cmpct.h"\nint main(void) { int32_t (*query)(const CmpctArchive *, size_t, size_t *) = cmpct_entry_pack_owner; return query == 0; }\n' | cc -x c -std=c11 -Wall -Wextra -Werror -c -o /tmp/cmpct-pack-owner.o -
      - name: Original independent S_PACK court
        shell: bash
        run: python tests/native_pack_golden_abi.py
      - name: O5 independent and real Builder native-owner court
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-owner-o5"
          python tests/native_pack_owner_discovery_o5.py "$RUNNER_TEMP/cmpct-native-owner-o5/result.json" | tee "$RUNNER_TEMP/cmpct-native-owner-o5/log.txt"
          sha256sum "$RUNNER_TEMP/cmpct-native-owner-o5/result.json" > "$RUNNER_TEMP/cmpct-native-owner-o5/result.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-owner-o5-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-owner-o5/
          if-no-files-found: warn
          retention-days: 30
