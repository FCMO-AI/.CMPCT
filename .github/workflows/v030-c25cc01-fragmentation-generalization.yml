# ci-lane: deep
name: CMPCT v0.30 C25CC01 fragmentation generalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_c25cc01_fragmentation_admission_oracle.py'
      - 'benchmarks/v030_c25cc01_fragmentation_generalization.py'
      - 'benchmarks/v030_r24_compact_control_terminal_admission.py'
      - 'experiments/entropygraph_v030_r24_compact_control_profile.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-c25cc01-fragmentation-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-c25cc01-fragmentation-generalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fragmentation-generalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deterministic comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile fragmentation-generalization surface
        run: |
          python -m py_compile \
            benchmarks/v030_c25cc01_fragmentation_admission_oracle.py \
            benchmarks/v030_c25cc01_fragmentation_generalization.py

      - name: Run independent unseen fragmentation campaign
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_c25cc01_fragmentation_generalization.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-c25cc01-fragmentation-generalization-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-c25cc01-fragmentation-generalization.json"

      - name: Independently enforce identity-free experiment validity and no release credit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-c25cc01-fragmentation-generalization.json').read_text())
          assert d['schema']=='cmpct-v030-c25cc01-fragmentation-generalization-v2'
          c=d['contract']; g=d['gate']; rows=d['rows']
          assert c['base_predicate_inputs']==['logical_bytes','regular_files','r24_bytes','candidate_bytes']
          assert c['additional_candidate_inputs']==['physical_blob_records','non_pack_members']
          assert c['min_physical_blob_records']==40
          assert c['min_non_pack_members']==8
          assert c['minimum_independent_positive_admissions']==2
          assert c['selector_change'] is False
          assert c['release_credit'] is False
          assert set(c['forbidden_inputs'])=={'workload_name','path','filename','suffix','content_hash','archive_hash','pack_hash'}
          assert len(rows)==5
          assert g['experiment_valid'] is True
          assert g['release_credit'] is False
          assert g['passed'] is True
          assert isinstance(g['hypothesis_supported'], bool)
          assert g['promotion_signal'] is g['hypothesis_supported']
          assert all(row['payload_unchanged'] and row['two_control_copies'] for row in rows)
          # Counterexamples are durable negative evidence. They must never be hidden to manufacture promotion.
          if d['counterexamples']:
              assert g['hypothesis_supported'] is False
              assert g['promotion_signal'] is False
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-c25cc01-fragmentation-generalization.yml

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Upload fragmentation-generalization evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-c25cc01-fragmentation-generalization-${{ github.sha }}
          path: benchmark-artifacts/v030-c25cc01-fragmentation-generalization.json
          if-no-files-found: warn
          retention-days: 90

# Research-only evidence lane. A green job means the experiment was valid, not that the fragmentation hypothesis won.
# Promotion remains possible only when hypothesis_supported/promotion_signal is true; this lane never earns release credit.
