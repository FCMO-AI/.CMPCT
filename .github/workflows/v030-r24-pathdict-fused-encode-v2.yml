name: CMPCT v0.30 pathdict fused-encode rehabilitation v2

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_pathdict_fused_encode_referee.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v2.py
      - benchmarks/v030_r24_pathblind_dictionary_referee.py
      - benchmarks/v030_r24_micropack_same_grammar_attribution.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-pathdict-fused-encode-v2.yml

permissions:
  contents: read

jobs:
  fused-encode-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_r24_pathdict_fused_encode_referee.py benchmarks/v030_r24_pathdict_fused_encode_referee_v2.py
      - name: Execute fused-encode referee v2
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_pathdict_fused_encode_referee_v2 \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-pathdict-fused.json').read_text())
          assert d['schema']=='cmpct-v030-r24-pathdict-fused-encode-v1'
          assert d['release_credit'] is False and d['canonical_builder_changed'] is False and d['genesis_rescore'] is False
          assert d['verdict'] in {'FUSED_ENCODE_INVALID','FUSED_ENCODE_HELPS_BUT_CREATION_DEBT_REMAINS','FUSED_ENCODE_CLOSES_CREATION_DEBT'}
          short={'FUSED_ENCODE_INVALID':'invalid','FUSED_ENCODE_HELPS_BUT_CREATION_DEBT_REMAINS':'helps','FUSED_ENCODE_CLOSES_CREATION_DEBT':'closes'}[d['verdict']]
          a=d['aggregate']; outs={'short':short,'id':str(len(d['identity_failures'])),'cd':str(len(d['remaining_cpu_debts'])),'wd':str(len(d['remaining_wall_debts'])),'cp':f"{a['cpu_ratio_vs_clean_portfolio']:.3f}",'wp':f"{a['wall_ratio_vs_clean_portfolio']:.3f}",'cs':f"{a['cpu_ratio_vs_single_independent']:.3f}",'ws':f"{a['wall_ratio_vs_single_independent']:.3f}",'hit':str(int(a['cache_hits'])),'miss':str(int(a['cache_misses'])),'fp':d['corpus_fingerprint'][:10]}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
            for k,v in outs.items(): fh.write(f'{k}={v}\n')
          print(json.dumps({'verdict':d['verdict'],'identity_failures':d['identity_failures'],'remaining_cpu':d['remaining_cpu_debts'],'remaining_wall':d['remaining_wall_debts'],'aggregate':a,'rows':{k:{'cpu_port_ratio':v['cpu_ratio_vs_clean_portfolio'],'wall_port_ratio':v['wall_ratio_vs_clean_portfolio'],'cpu_single_ratio':v['cpu_ratio_vs_single_independent'],'wall_single_ratio':v['wall_ratio_vs_single_independent'],'hits':v['fused']['cache_hits'],'misses':v['fused']['cache_misses']} for k,v in d['rows'].items()}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-pathdict-fused-v2-${{ steps.receipt.outputs.short || 'nosummary' }}-id${{ steps.receipt.outputs.id }}-cd${{ steps.receipt.outputs.cd }}-wd${{ steps.receipt.outputs.wd }}-cp${{ steps.receipt.outputs.cp }}-wp${{ steps.receipt.outputs.wp }}-cs${{ steps.receipt.outputs.cs }}-ws${{ steps.receipt.outputs.ws }}-h${{ steps.receipt.outputs.hit }}-m${{ steps.receipt.outputs.miss }}-fp${{ steps.receipt.outputs.fp }}-${{ github.sha }}
          path: benchmark-artifacts/v030-pathdict-fused.json
          if-no-files-found: error
          retention-days: 90
