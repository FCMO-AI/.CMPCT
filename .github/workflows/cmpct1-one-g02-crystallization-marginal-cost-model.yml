name: CMPCT1 ONE-G0.2 Crystallization marginal cost model

on:
  push:
    branches: [research/cmpct1]
    paths:
      - experiments/one/general_law_archive.py
      - experiments/one/authenticated_archive_envelope.py
      - benchmarks/one/one_g02_crystallization_wire_economics_geometry.py
      - benchmarks/one/one_g02_crystallization_marginal_cost_model.py
      - benchmarks/one/one_g02_economic_writer_admission.py
      - benchmarks/one/one_g02_economic_writer_admission_worker.py
      - benchmarks/one/one_g02_economic_writer_admission_oracle.py
      - benchmarks/one/one_g02_economic_writer_selective_validation.py
      - benchmarks/one/one_g02_economic_writer_sampler_collision.py
      - benchmarks/one/one_g02_second_stage_relation_falsifier.py
      - tests/one/test_crystallization_marginal_cost_model.py
      - tests/one/test_economic_writer_admission.py
      - tests/one/test_economic_writer_sampler_collision.py
      - tests/one/test_second_stage_relation_falsifier.py
      - docs/one/prereg/ONE_G02_CRYSTALLIZATION_MARGINAL_COST_MODEL_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_CRYSTALLIZATION_ECONOMIC_ADMISSION_WRITER_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_ECONOMIC_WRITER_SAMPLER_COLLISION_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_SECOND_STAGE_RELATION_FALSIFIER_PREREG_2026-09-10.md
      - .github/workflows/cmpct1-one-g02-crystallization-marginal-cost-model.yml
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - experiments/one/general_law_archive.py
      - experiments/one/authenticated_archive_envelope.py
      - benchmarks/one/one_g02_crystallization_wire_economics_geometry.py
      - benchmarks/one/one_g02_crystallization_marginal_cost_model.py
      - benchmarks/one/one_g02_economic_writer_admission.py
      - benchmarks/one/one_g02_economic_writer_admission_worker.py
      - benchmarks/one/one_g02_economic_writer_admission_oracle.py
      - benchmarks/one/one_g02_economic_writer_selective_validation.py
      - benchmarks/one/one_g02_economic_writer_sampler_collision.py
      - benchmarks/one/one_g02_second_stage_relation_falsifier.py
      - tests/one/test_crystallization_marginal_cost_model.py
      - tests/one/test_economic_writer_admission.py
      - tests/one/test_economic_writer_sampler_collision.py
      - tests/one/test_second_stage_relation_falsifier.py
      - docs/one/prereg/ONE_G02_CRYSTALLIZATION_MARGINAL_COST_MODEL_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_CRYSTALLIZATION_ECONOMIC_ADMISSION_WRITER_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_ECONOMIC_WRITER_SAMPLER_COLLISION_PREREG_2026-09-10.md
      - docs/one/prereg/ONE_G02_SECOND_STAGE_RELATION_FALSIFIER_PREREG_2026-09-10.md
      - .github/workflows/cmpct1-one-g02-crystallization-marginal-cost-model.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g02-crystallization-marginal-cost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marginal-cost-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run marginal-cost falsifiers
        run: python -m pytest -q tests/one/test_crystallization_marginal_cost_model.py | tee one-g02-crystallization-marginal-cost-model-tests.txt
      - name: Run preregistered transfer marginal-cost model
        run: python -m benchmarks.one.one_g02_crystallization_marginal_cost_model | tee one-g02-crystallization-marginal-cost-model.txt
      - name: Assert claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('one-g02-crystallization-marginal-cost-model.json').read_text())
          assert p['schema'] == 'cmpct-one-g02-crystallization-marginal-cost-model-v2'
          assert p['decision'] in {
              'ADVANCE_MARGINAL_COST_ADMISSION_MODEL',
              'HOLD_MARGINAL_COST_ADMISSION_MODEL',
              'RETIRE_OR_REPAIR_MARGINAL_COST_ADMISSION_MODEL',
          }
          assert p['calibration_length'] == 23
          assert 23 not in p['lengths']
          assert len(p['rows']) == 4 * len(p['lengths'])
          for flag in ('genesis_inputs_executed', 'genesis_comparison_executed', 'genesis_scoring_executed', 'genesis_winner_selected'):
              assert p[flag] is False
          print('decision=' + p['decision'])
          print('k_bytes=', p['k_bytes'])
          print('false_admit_count=', p['false_admit_count'])
          print('false_reject_count=', p['false_reject_count'])
          print('sign_error_count=', p['sign_error_count'])
          print('boundary_false_admit_count=', p['boundary_false_admit_count'])
          print('boundary_false_reject_count=', p['boundary_false_reject_count'])
          print('max_abs_residual_by_family=', p['max_abs_residual_by_family'])
          PY
      - name: Retain exact-source marginal-cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-crystallization-marginal-cost-model-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            one-g02-crystallization-marginal-cost-model.json
            one-g02-crystallization-marginal-cost-model.txt
            one-g02-crystallization-marginal-cost-model-tests.txt
          if-no-files-found: warn
          retention-days: 30

  economic-writer-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run writer-admission falsifiers
        run: python -m pytest -q tests/one/test_economic_writer_admission.py | tee one-g02-economic-writer-admission-tests.txt
      - name: Run preregistered writer-admission transfer experiment
        run: python -m benchmarks.one.one_g02_economic_writer_admission | tee one-g02-economic-writer-admission.txt
      - name: Run independent admission oracle
        run: python -m benchmarks.one.one_g02_economic_writer_admission_oracle | tee one-g02-economic-writer-admission-oracle.txt
      - name: Run selective-access companion falsifier
        run: python -m benchmarks.one.one_g02_economic_writer_selective_validation | tee one-g02-economic-writer-selective-validation.txt
      - name: Run sampler-collision hostile falsifiers
        run: python -m pytest -q tests/one/test_economic_writer_sampler_collision.py | tee one-g02-economic-writer-sampler-collision-tests.txt
      - name: Run preregistered sampler-collision hostile experiment
        run: python -m benchmarks.one.one_g02_economic_writer_sampler_collision | tee one-g02-economic-writer-sampler-collision.txt
      - name: Run second-stage relation falsifiers
        run: python -m pytest -q tests/one/test_second_stage_relation_falsifier.py | tee one-g02-second-stage-relation-falsifier-tests.txt
      - name: Run preregistered second-stage relation oracle
        run: python -m benchmarks.one.one_g02_second_stage_relation_falsifier | tee one-g02-second-stage-relation-falsifier.txt
      - name: Assert writer-admission claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('one-g02-economic-writer-admission.json').read_text())
          o = json.loads(Path('one-g02-economic-writer-admission-oracle.json').read_text())
          s = json.loads(Path('one-g02-economic-writer-selective-validation.json').read_text())
          c = json.loads(Path('one-g02-economic-writer-sampler-collision.json').read_text())
          r = json.loads(Path('one-g02-second-stage-relation-falsifier.json').read_text())
          assert p['schema'] == 'cmpct-one-g02-economic-writer-admission-v1'
          assert p['frozen_model'] == {'exact_reuse': -3, 'fill': 1, 'add8': 11, 'xor': 11}
          assert p['timing_gate'] == {'relative': 0.05, 'absolute_seconds': 0.003}
          assert p['decision'] in {
              'ADVANCE_ECONOMIC_WRITER_ADMISSION',
              'HOLD_ECONOMIC_WRITER_ADMISSION',
              'RETIRE_OR_REPAIR_ECONOMIC_WRITER_ADMISSION',
          }
          assert o['schema'] == 'cmpct-one-g02-economic-writer-admission-oracle-v1'
          assert o['frozen_k'] == {'exact_reuse': -3, 'fill': 1, 'add8': 11, 'xor': 11}
          assert o['decision'] in {'ADVANCE_INDEPENDENT_ADMISSION_ORACLE', 'HOLD_INDEPENDENT_ADMISSION_ORACLE'}
          assert s['schema'] == 'cmpct-one-g02-economic-writer-selective-validation-v1'
          assert s['decision'] in {'ADVANCE_ECONOMIC_WRITER_SELECTIVE_ACCESS', 'HOLD_ECONOMIC_WRITER_SELECTIVE_ACCESS'}
          assert c['schema'] == 'cmpct-one-g02-economic-writer-sampler-collision-v1'
          assert c['writer_sample_points'] == 16
          assert c['frozen_oracle_sample_points'] == 16
          assert c['decision'] in {
              'ADVANCE_SAMPLER_COLLISION_SAFETY_ONLY',
              'HOLD_SAMPLER_COLLISION_SAFETY',
              'RETIRE_OR_REPAIR_SAMPLER_COLLISION_SAFETY',
          }
          assert r['schema'] == 'cmpct-one-g02-second-stage-relation-falsifier-v1'
          assert r['writer_sample_points'] == 16
          assert r['frozen_oracle_sample_points'] == 16
          assert r['relations'] == ['add8', 'xor']
          assert r['lengths'] == [32, 256, 4096, 16384]
          assert r['kinds'] == ['true', 'stage2_collision', 'dual_collision']
          assert r['decision'] in {
              'ADVANCE_SECOND_STAGE_FALSIFIER_ORACLE_ONLY',
              'HOLD_SECOND_STAGE_FALSIFIER',
              'RETIRE_OR_REPAIR_SECOND_STAGE_FALSIFIER',
          }
          for doc in (p, o, s, c, r):
              for flag in ('genesis_inputs_executed', 'genesis_comparison_executed', 'genesis_scoring_executed', 'genesis_winner_selected'):
                  assert doc[flag] is False
          print('decision=' + p['decision'])
          print('oracle_decision=' + o['decision'])
          print('oracle_mismatches=', o['mismatches'])
          print('selective_decision=' + s['decision'])
          print('sampler_collision_decision=' + c['decision'])
          print('sampler_collision_false_survivors=', c['false_survivors'])
          print('second_stage_decision=' + r['decision'])
          print('second_stage_hypotheses=', r['hypotheses'])
          print('second_stage_summary=', r['summary'])
          print('hypotheses=', p['hypotheses'])
          print('proof_work_reduction_bytes=', p['proof_work_reduction_bytes'])
          print('false_admits=', p['false_admits'])
          print('false_rejects=', p['false_rejects'])
          print('timing_regressions=', p['timing_regressions'])
          print('native_no_fallback=', s['native_no_fallback'])
          PY
      - name: Retain exact-source writer-admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-economic-writer-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            one-g02-economic-writer-admission.json
            one-g02-economic-writer-admission.txt
            one-g02-economic-writer-admission-tests.txt
            one-g02-economic-writer-admission-oracle.json
            one-g02-economic-writer-admission-oracle.txt
            one-g02-economic-writer-selective-validation.json
            one-g02-economic-writer-selective-validation.txt
            one-g02-economic-writer-sampler-collision.json
            one-g02-economic-writer-sampler-collision.txt
            one-g02-economic-writer-sampler-collision-tests.txt
            one-g02-second-stage-relation-falsifier.json
            one-g02-second-stage-relation-falsifier.txt
            one-g02-second-stage-relation-falsifier-tests.txt
          if-no-files-found: warn
          retention-days: 30
