name: Bootstrap native chunk-map implementation

on:
  push:
    branches:
      - feat/native-chunk-ranges
    paths:
      - dev/apply_native_chunk_patch.py
      - dev/normalize_chunk_manifest.py
      - .github/workflows/native-chunk-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply native chunk patch
        run: |
          python dev/apply_native_chunk_patch.py
          python dev/normalize_chunk_manifest.py
          # Rust's Digest::digest generic takes its input by value. Reborrow the mutable output slice
          # immutably so the full-file SHA gate does not consume the caller buffer before returning.
          sed -i 's/Sha256::digest(out)/Sha256::digest(\&*out)/' native/cmpct-core/src/lib.rs
      - name: Format and test native core
        working-directory: native/cmpct-core
        run: |
          cargo fmt
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/cmpct-core/src/lib.rs tests/conformance/v24-chunk-maps.json
          git diff --cached --check
          git commit -m "Native: read revision-24 chunk maps range-locally"
          git push origin HEAD:feat/native-chunk-ranges
