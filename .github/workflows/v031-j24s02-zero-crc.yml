# ci-lane: fast
name: v031 J24S02 exact zero-run CRC algebra research oracle
on:
  pull_request:
    paths:
      - 'research/j24s02_zero_crc_oracle.py'
      - '.github/workflows/v031-j24s02-zero-crc.yml'
      - 'docs/v031-research/2026-10-26-j24s02-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24s02-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gf2-zero-crc-court:
    name: Exact-HEAD GF2 CRC vs literal controls, independent raw inflate
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and preregistration, charged oracle
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git hash-object research/j24s02_zero_crc_oracle.py | tee "$RUNNER_TEMP/j24s02-source-blob.txt"
          git hash-object docs/v031-research/2026-10-26-j24s02-sparse-crc-prereg.md | tee "$RUNNER_TEMP/j24s02-prereg-blob.txt"
          python -m py_compile research/j24s02_zero_crc_oracle.py
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/j24s02_zero_crc_oracle.py" \
            --sparse-mib 256 --nonhole-mib 64 --repeats 3 --levels 1,6 \
            --families zero,mixed,nonhole \
            --output "$RUNNER_TEMP/j24s02-result.json"
      - name: Preserve original observations even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24s02-zero-crc-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/j24s02-result.json
            ${{ runner.temp }}/j24s02-source-blob.txt
            ${{ runner.temp }}/j24s02-prereg-blob.txt
          if-no-files-found: warn
