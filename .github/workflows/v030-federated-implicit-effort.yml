# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 federated implicit-path frontier

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_fs_implicit.py'
      - 'experiments/entropygraph_v030_federated_implicit_candidate.py'
      - 'experiments/entropygraph_v030_federated_candidate.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v025.py'
      - 'benchmarks/v030_federated_implicit_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle*.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'tests/test_v030_fs_implicit.py'
      - '.github/workflows/v030-federated-implicit-effort.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_fs_implicit.py'
      - 'experiments/entropygraph_v030_federated_implicit_candidate.py'
      - 'experiments/entropygraph_v030_federated_candidate.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v025.py'
      - 'benchmarks/v030_federated_implicit_effort_oracle.py'
      - 'benchmarks/v030_federated_selective_effort_oracle*.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'tests/test_v030_fs_implicit.py'
      - '.github/workflows/v030-federated-implicit-effort.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-federated-implicit-effort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_(v030_fs_implicit|v030_federated_implicit_candidate|v030_federated_candidate|v030_product_fs|v025)\.py|benchmarks/(v030_federated_implicit_effort_oracle\.py|v030_federated_selective_effort_oracle[^/]*\.py|neutral_hostile_corpus_v1\.py|neutral_hostile_determinism_repair_v[^/]*\.py)|tests/test_v030_fs_implicit\.py|\.github/workflows/v030-federated-implicit-effort\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  implicit-path-frontier:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact corpus and comparator dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile implicit profile and frontier
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_fs_implicit.py \
            experiments/entropygraph_v030_federated_implicit_candidate.py \
            benchmarks/v030_federated_implicit_effort_oracle.py

      - name: Prove implicit regular-path ownership semantics
        run: python -m pytest -q tests/test_v030_fs_implicit.py

      - name: Measure implicit ownership plus selective-effort frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_implicit_effort_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg03-implicit-effort-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg03-implicit-effort.json"

      - name: Independently enforce measurement and frozen boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg03-implicit-effort.json').read_text())
          assert d['schema']=='cmpct-v030-federated-eg03-implicit-effort-v1'
          assert d['targets']==['02_office_workspace','04_analytics_and_database']
          assert d['levels']==[1,3,6,9,12,15,19,20,21,22]
          assert d['baseline_rounds']==3
          assert len(d['rows'])==2
          assert d['measurement_gate']['passed'] is True
          identity=d['candidate_identity']
          assert identity['magic_ascii']=='C25EG03'
          assert identity['regular_path_and_content_identity_owner']=='authenticated federated content graph'
          assert identity['filesystem_control_owner']=='implicit regular-path filesystem manifest v3'
          assert identity['patched_candidate_restored'] is True
          assert identity['patched_prepare_restored'] is True
          adapter=d['accepted_v029_schema_adapter']
          assert adapter['source_field']=='accepted_v029_bytes'
          assert adapter['values_unchanged'] is True
          assert adapter['workloads']==15
          assert adapter['accepted_v029_aggregate_bytes']==137499525
          assert adapter['authoritative_loader_restored'] is True
          for row in d['rows']:
              ub=row['compression_effort_upper_bound']
              assert ub['all_best_archive_floor_bytes'] == row['baseline_level1']['archive_bytes']-ub['maximum_possible_saving_bytes']
              measured=row['measured_zip_budget_policy']
              assert measured['locality']['max_member_read_amplification'] <= 8.0
              assert measured['locality']['max_decode_unit_bytes'] <= 8*1024*1024
          PY

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-federated-implicit-effort.yml

      - name: Upload implicit ownership evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-federated-implicit-effort-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-eg03-implicit-effort.json
          if-no-files-found: warn
          retention-days: 90
