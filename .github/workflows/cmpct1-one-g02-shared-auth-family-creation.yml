# ci-lane: fast
name: CMPCT1 ONE-G0.2 shared auth family creation A/B
on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_shared_auth_family_creation_ab.py"
      - ".github/workflows/cmpct1-one-g02-shared-auth-family-creation.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-shared-auth-family-creation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  family-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run frozen family creation A/B
        run: |
          mkdir -p one-shared-auth-family-creation-artifacts
          python -m benchmarks.one.one_g02_shared_auth_family_creation_ab | tee one-shared-auth-family-creation-artifacts/one-g02-shared-auth-family-creation.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-shared-auth-family-creation-${{ env.EVIDENCE_HEAD }}
          path: one-shared-auth-family-creation-artifacts/
          if-no-files-found: error
