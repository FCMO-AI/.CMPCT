# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office exact-precompression headroom

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_exact_precompression_headroom.py'
      - '.github/workflows/v030-r4-office-exact-precompression-headroom.yml'
      - 'native/preflate-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-office-pflt-headroom-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_office_exact_precompression_headroom\.py|\.github/workflows/v030-r4-office-exact-precompression-headroom\.yml|native/preflate-bridge/)' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  precompression-referee:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact research dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - name: Build pinned exact-precompression bridge
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/preflate-bridge/Cargo.toml
          native/preflate-bridge/target/release/cmpct-preflate-bridge selftest
      - run: python -m py_compile benchmarks/v030_r4_office_exact_precompression_headroom.py
      - name: Run Office exact-precompression headroom referee
        env:
          CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_exact_precompression_headroom.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-pflt-headroom-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-pflt-headroom.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-pflt-headroom.json'))
          assert d['schema']=='cmpct-v030-r4-office-exact-precompression-headroom-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['hypothesis']['byte_exact_for_every_supported_transform']
          k=d['contract']; assert k['diagnostic_only'] and not k['release_credit'] and not k['locality_credit']
          assert k['same_existing_preflate_mechanism'] and k['exact_reconstruction_required'] and k['no_threshold_sweep']
          print(json.dumps({'summary':d['summary'],'hypothesis':d['hypothesis'],'top_files':d['files'][:12]},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-exact-precompression-headroom.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-pflt-headroom-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-pflt-headroom.json
          if-no-files-found: error
          retention-days: 90

# Green means the exact-precompression headroom diagnostic completed; it grants no locality/release credit.
