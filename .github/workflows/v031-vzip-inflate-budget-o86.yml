# ci-lane: fast
name: CMPCT v0.31 O86 Bounded VZIP Probe
on:
  pull_request:
    paths:
      - 'src/cmpct/codec.py'
      - 'src/cmpct/builder.py'
      - 'tests/test_v031_vzip_inflate_budget_o86.py'
      - 'docs/v031-research/2026-10-25-o86-vzip-speculative-inflate-prereg.md'
      - '.github/workflows/v031-vzip-inflate-budget-o86.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  genuine-builder-budget:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
      - name: Bind source and tests to immutable head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git rev-parse HEAD
          git hash-object src/cmpct/codec.py
          git hash-object src/cmpct/builder.py
          git hash-object tests/test_v031_vzip_inflate_budget_o86.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine CMPCT and pytest
        run: python -m pip install -e ".[test]"
      - name: Execute reproducible source/opaque/product controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o86-evidence
          python -m pytest --noconftest -q -s -rs --junitxml=o86-evidence/junit.xml tests/test_v031_vzip_inflate_budget_o86.py 2>&1 | tee o86-evidence/pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('o86-evidence/junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.iter('testsuite'))
          count=sum(int(s.attrib.get('tests',0)) for s in suites)
          fails=sum(int(s.attrib.get('failures',0))+int(s.attrib.get('errors',0)) for s in suites)
          skips=sum(int(s.attrib.get('skipped',0)) for s in suites)
          print(f'O86_JUNIT tests={count} fails={fails} skips={skips}')
          assert count>=9 and fails==0 and skips==0
          PY
      - name: Preserve exact-head real product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o86-budget-${{ matrix.os }}-${{ github.sha }}
          path: o86-evidence/
          if-no-files-found: warn
          retention-days: 30
