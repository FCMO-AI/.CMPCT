# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 candidate lifetime RSS oracle
on:
  push:
    branches: [agent/v030-candidate-lifetime-rss]
    paths: ['benchmarks/v030_candidate_lifetime_rss.py','.github/workflows/v030-candidate-lifetime-rss.yml']
  workflow_dispatch:
permissions: {contents: read}
env: {PYTHONPATH: '${{ github.workspace }}'}
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_candidate_lifetime_rss.py
      - name: Run ML candidate lifetime attribution
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_candidate_lifetime_rss.py --work-root "$RUNNER_TEMP/candidate-life" --output benchmark-artifacts/candidate-life.json | tee benchmark-artifacts/candidate-life.log
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: 'candidate-life-${{ github.sha }}', path: benchmark-artifacts/, if-no-files-found: error, retention-days: 90}
