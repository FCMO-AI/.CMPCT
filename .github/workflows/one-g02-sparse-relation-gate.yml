name: ONE-G0.2 sparse relation gate integration

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_g02_shift_relation_sparse_gate_kernel.c'
      - 'benchmarks/one/one_g02_shift_relation_sparse_gate_integration.py'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_direct_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_restrict_kernel.c'
      - 'benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py'
      - '.github/workflows/one-g02-sparse-relation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-relation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen sparse relation integration
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          python -m benchmarks.one.one_g02_shift_relation_sparse_gate_integration | tee one-g02-sparse-relation-gate.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-sparse-relation-gate-${{ github.sha }}
          path: one-g02-sparse-relation-gate.json
          if-no-files-found: error
