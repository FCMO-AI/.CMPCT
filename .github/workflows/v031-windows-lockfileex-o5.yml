# ci-lane: fast
# Standalone Windows kernel primitive research, not product Writer validation.
name: CMPCT v031 Windows LockFileEx O5 oracle
on:
  push:
    branches:
      - agent/phased2-v031-win-lockfileex-interop-o5-20261023
    paths:
      - 'tests/test_v031_windows_lockfileex_o5.py'
      - 'docs/v031-research/2026-10-23-windows-lockfileex-o5-prereg.md'
      - '.github/workflows/v031-windows-lockfileex-o5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v031-win-lockfileex-o5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-kernel-lock-oracle:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify product owner source and exact head
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "test-artifacts" | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "source HEAD mismatch" }
          $writer = (git hash-object src/cmpct/transactions.py).Trim()
          $reader = (git hash-object src/cmpct/reader.py).Trim()
          if ($writer -ne "fd8d922ae5a6e77ab7e01bf599da16a14aca1cff") { throw "Writer source drift" }
          if ($reader -ne "c548a2ae4d650e928eb46ed1c2431423e49765b5") { throw "Reader source drift" }
          @("head=$env:GITHUB_SHA", "writer_blob=$writer", "reader_blob=$reader") |
            Out-File -Encoding utf8 "test-artifacts/source.txt"
      - name: Install actual CMPCT package
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { throw "product install failed" }
      - name: Compare kernel waiter against real CRT holder
        shell: pwsh
        env:
          CMPCT_O5_ARTIFACT_DIR: test-artifacts
        run: |
          python -m pytest --noconftest -vv -s tests/test_v031_windows_lockfileex_o5.py 2>&1 |
            Tee-Object -FilePath "test-artifacts/pytest.txt"
          if ($LASTEXITCODE -ne 0) { throw "O5 oracle falsified or cannot execute" }
      - name: Preserve raw result and negative evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v031-windows-lockfileex-o5-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 90
