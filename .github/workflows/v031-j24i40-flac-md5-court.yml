# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: J24I40 FLAC STREAMINFO MD5 Custody Court
on:
  pull_request:
    paths:
      - 'research/j24i40/**'
      - 'docs/v031-research/*j24i40*'
      - '.github/workflows/v031-j24i40-flac-md5-court.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24i40-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-flac-md5-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require this commit to change the scoped research
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(research/j24i40/|docs/v031-research/.*j24i40|[.]github/workflows/v031-j24i40-flac-md5-court[.]yml)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
      - name: Pin exact unchanged product and prior research source
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee j24i40-head.txt
          test "$(git hash-object native/cmpct-core/src/lib.rs)" = "46fa87930a9229f42233594816330f35f0505e71"
          test "$(git hash-object native/cmpct-core/src/vzip_dispatch.rs)" = "27e4d7962ccfed6a822010383158d98e20d823dd"
          test "$(git hash-object native/cmpct-core/src/wavflac.rs)" = "8e5d22539d0afa89f5be3bc20f536376e44b7dd6"
          test "$(git hash-object src/cmpct/builder.py)" = "663ef0922992b1fbb8f19e6eea88d55c10a56044"
          test "$(git hash-object src/cmpct/codec.py)" = "29526db4203723d83523fc95d074c346b63d7587"
          test "$(git hash-object research/j24i39/native_file_flac_digest.rs)" = "dad8fe7b4c3f7e8c02be7d842fea6451da0c574f"
          test "$(git hash-object research/j24i39/extract_signed_wav_flac.py)" = "89572779c1154706d8f3ba5db873d2d35bb26cdc"
          test "$(git hash-object research/j24i38/generate_builder_wav.py)" = "967146feadaacf45321bbeaed11f6bff1ff6abfb"
          test "$(git hash-object research/j24i38/audit_builder_wav.py)" = "1d4c04ab1d534e10504d71794bd12492827fc49c"
          git diff --name-only 0047e45e92793ca58a50251847e3cf1adb9c6d90 HEAD | tee j24i40-changed.txt
          if grep -Eq '^(native/|src/cmpct/|tests/conformance/|benchmarks/|docs/discovery/)' j24i40-changed.txt; then
            echo 'Research court must not mutate product or scientific authority'; exit 1
          fi
      - name: Generate real Builder WAV and verify physical archive independently
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . numpy soundfile msgpack zstandard
          python research/j24i38/generate_builder_wav.py --output j24i40-cases
          python research/j24i38/audit_builder_wav.py --case-dir j24i40-cases
          python research/j24i39/extract_signed_wav_flac.py --case-dir j24i40-cases
          python research/j24i40/mutate_flac_streaminfo_md5.py --case-dir j24i40-cases
          if ! command -v flac >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq flac
          fi
          flac --version | tee j24i40-flac-version.txt
      - name: Compile unchanged Claxon iterator (research instrumentation only)
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/cmpct-core/src/bin
          cp research/j24i39/native_file_flac_digest.rs native/cmpct-core/src/bin/j24i39_perf.rs
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml --bin j24i39_perf
      - name: Compare actual Claxon decoded digest and reference FLAC metadata checks
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exe=native/cmpct-core/target/release/j24i39_perf
          archive="$PWD/j24i40-cases/builder-wav-8m.cmpct"
          meta="$PWD/j24i40-cases/oracle-8m.meta"
          manifest="$PWD/j24i40-cases/stream-manifest.json"
          : > j24i40-raw.txt
          for variant in valid md5_flip md5_zero; do
            mutant="$PWD/j24i40-cases/md5-${variant}.flac"
            set +e
            flac -t -s "$mutant" >"j24i40-${variant}-reference.log" 2>&1
            reference_rc=$?
            "$exe" "$archive" "$meta" "$mutant" "$manifest" 8 stream >"j24i40-${variant}-claxon.log" 2>&1
            claxon_rc=$?
            set -e
            echo "variant=$variant reference_exit=$reference_rc claxon_exit=$claxon_rc" | tee -a j24i40-raw.txt
          done
          python research/j24i40/summarize_flac_md5_court.py \
            --case-dir j24i40-cases --raw j24i40-raw.txt --output j24i40-result.json
      - name: Fail closed if physical specimens or logs are missing
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s j24i40-head.txt
          test -s j24i40-result.json
          test -s j24i40-raw.txt
          test -s j24i40-flac-version.txt
          test -s j24i40-cases/md5-manifest.json
          for variant in valid md5_flip md5_zero; do
            test -s "j24i40-cases/md5-${variant}.flac"
            test -f "j24i40-${variant}-claxon.log"
            test -f "j24i40-${variant}-reference.log"
          done
          tar -czf j24i40-flac-md5-evidence.tar.gz \
            j24i40-head.txt j24i40-changed.txt j24i40-flac-version.txt \
            j24i40-cases j24i40-raw.txt j24i40-result.json \
            j24i40-valid-claxon.log j24i40-md5_flip-claxon.log j24i40-md5_zero-claxon.log \
            j24i40-valid-reference.log j24i40-md5_flip-reference.log j24i40-md5_zero-reference.log
          test -s j24i40-flac-md5-evidence.tar.gz
          sha256sum j24i40-flac-md5-evidence.tar.gz | tee j24i40-artifact-sha256.txt
          for variant in valid md5_flip md5_zero; do
            echo "J24I40_REFERENCE_DETAIL_BEGIN ${variant}"
            sed -n '1,12p' "j24i40-${variant}-reference.log"
            echo "J24I40_REFERENCE_DETAIL_END ${variant}"
          done
      - name: Require physical GitHub artifact (not a warning)
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: j24i40-flac-md5-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: ./j24i40-flac-md5-evidence.tar.gz
