# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 PG-isolated r24-prebuild barrier RSS A/B

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'docs/v030-rnd/R25_PG_ISOLATED_R24_PREBUILD_BARRIER_RSS_PREREG.md'
      - 'benchmarks/v030_r25_pg_isolated_r24_prebuild_barrier_rss_worker.py'
      - 'benchmarks/v030_r25_pg_isolated_r24_prebuild_barrier_rss_oracle.py'
      - '.github/workflows/v030-r25-pg-isolated-r24-prebuild-barrier-rss.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r25-pg-isolated-r24-prebuild-barrier-rss-${{ github.sha }}
  cancel-in-progress: false

jobs:
  r24-prebuild-barrier-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Compile frozen barrier instrument
        run: |
          python -m py_compile \
            benchmarks/v030_r25_pg_isolated_r24_prebuild_barrier_rss_worker.py \
            benchmarks/v030_r25_pg_isolated_r24_prebuild_barrier_rss_oracle.py
      - name: Run exact changed-topology prebuild-overlap A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_pg_isolated_r24_prebuild_barrier_rss_oracle.py \
            --work-root benchmark-artifacts/v030-r25-pg-isolated-r24-prebuild-barrier-work \
            --output benchmark-artifacts/v030-r25-pg-isolated-r24-prebuild-barrier.json
      - name: Ratchet frozen identity and terminal decision
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r25-pg-isolated-r24-prebuild-barrier.json').read_text())
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['schema']=='cmpct-v030-r25-pg-isolated-r24-prebuild-barrier-rss-v1'
          assert d['experiment_valid'] is True
          assert d['release_credit'] is False
          assert d['worker_failures']==[]
          assert len(d['rows'])==6
          c=d['contract']
          assert c['whole_process_tree_rss_decisive'] is True
          assert c['prefixgraph_process_boundary_preserved'] is True
          assert c['g04_parent_execution_required'] is True
          assert c['exact_r24_prebuild_required'] is True
          assert c['same_prebuild_consumed_by_canonical_r24'] is True
          assert c['support_threshold']==0.20 and c['retire_threshold']==0.10
          assert c['exact_product_identity_required'] is True
          assert c['production_source_changed'] is False
          assert c['candidate_semantics_changed'] is False
          assert c['release_thresholds_changed'] is False
          assert d['decision'] in {'R24_PREBUILD_OVERLAP_SUPPORTED','R24_PREBUILD_OVERLAP_RETIRED','R24_PREBUILD_OVERLAP_AMBIGUOUS'}
          ids=set()
          for r in d['rows']:
              assert r['tree_samples']>=100
              assert r['tree_sampler_errors']==[]
              assert r['tree_sampler_interval_s']<=0.01
              assert r['prefixgraph_children']==1 and r['g04_children']==0
              assert r['r24_prebuild_reused_by_canonical_consumer'] is True
              assert r['bindings_restored'] is True
              if r['mode']=='overlap':
                  assert r['r24_prebuild_barrier_waits']==0
              else:
                  assert r['mode']=='r24-barrier'
                  assert r['r24_prebuild_barrier_waits']==1
                  assert r['r24_prebuild_future_done_after_wait'] is True
                  assert r['r24_prebuilt_artifact_exists_after_wait'] is True
              ids.add((r['archive_bytes'],r['archive_sha256'],r['tree_sha256'],r['selected'],r['format_revision'],r['r24_product_bytes'],r['r25_product_bytes']))
          assert len(ids)==1
          PY
      - name: CI topology custody self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-pg-isolated-r24-prebuild-barrier-rss.yml
      - uses: actions/upload-artifact@v6
        with:
          name: v030-r25-pg-isolated-r24-prebuild-barrier-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-pg-isolated-r24-prebuild-barrier.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. No production bytes/scheduling/thresholds change and no release credit.
