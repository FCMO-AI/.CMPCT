# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 sparse DEFLATE hostile generalization

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_deflate_sparse_hostile_generalization.py'
      - '.github/workflows/v030-r4-deflate-sparse-hostile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_deflate_sparse_hostile_generalization.py'
      - '.github/workflows/v030-r4-deflate-sparse-hostile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-sparse-hostile-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_deflate_sparse_hostile_generalization\.py|\.github/workflows/v030-r4-deflate-sparse-hostile\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  hostile-sparse:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy
      - run: python -m py_compile benchmarks/v030_r4_deflate_sparse_hostile_generalization.py
      - name: Run fixed held-out hostile NPY family
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_deflate_sparse_hostile_generalization.py --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-sparse-hostile.json"
      - name: Enforce evidence contract without requiring positive result
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-sparse-hostile.json'))
          assert d['schema']=='cmpct-v030-r4-deflate-sparse-hostile-generalization-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract'];assert c['diagnostic_only'] and not c['release_credit'] and c['held_out_from_genesis'] and c['no_threshold_sweep'] and c['exact_round_trip_required']
          assert len(d['cases'])==4
          print(json.dumps({'cases':d['cases'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-deflate-sparse-hostile.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-sparse-hostile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-sparse-hostile.json
          if-no-files-found: error
          retention-days: 90

# Held-out falsifier only. Green means receipt integrity regardless of hypothesis result.
