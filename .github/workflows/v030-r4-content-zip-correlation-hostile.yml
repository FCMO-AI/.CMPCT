# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 content ZIP correlation hostile

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_content_zip_correlation_hostile.py'
      - 'benchmarks/v030_r4_content_zip_correlation_gate.py'
      - 'experiments/v030_r4_content_zip_builder.py'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/codec.py'
      - '.github/workflows/v030-r4-content-zip-correlation-hostile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_content_zip_correlation_hostile.py'
      - 'benchmarks/v030_r4_content_zip_correlation_gate.py'
      - 'experiments/v030_r4_content_zip_builder.py'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/codec.py'
      - '.github/workflows/v030-r4-content-zip-correlation-hostile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-content-zip-correlation-hostile-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_content_zip_correlation_(hostile|gate)\.py|experiments/v030_r4_content_zip_builder\.py|src/cmpct/(builder|reader|codec)\.py|\.github/workflows/v030-r4-content-zip-correlation-hostile\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  hostile:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - run: python -m py_compile benchmarks/v030_r4_content_zip_correlation_hostile.py benchmarks/v030_r4_content_zip_correlation_gate.py
      - name: Run hostile correlation falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_content_zip_correlation_hostile.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-content-zip-correlation-hostile-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-content-zip-correlation-hostile.json"
      - name: Enforce receipt contract, not hypothesis truth
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-content-zip-correlation-hostile.json').read_text())
          assert d['schema']=='cmpct-v030-r4-content-zip-correlation-hostile-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert set(d['cases'])=={'trivial_empty_signature','correlated_pair_with_unrelated_passenger'}
          assert d['contract']['diagnostic_only'] and not d['contract']['release_credit']
          assert d['contract']['green_ci_means_receipt_integrity_not_scientific_success']
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-content-zip-correlation-hostile.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-content-zip-correlation-hostile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-content-zip-correlation-hostile.json
          if-no-files-found: error
          retention-days: 90

# Red scientific hypothesis is a valid result; CI gates receipt integrity only.
