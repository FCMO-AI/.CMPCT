name: CMPCT v0.30 one-shot land r25 implicit manifest seam

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - '.github/workflows/v030-one-shot-land-r25-implicit-seam.yml'

permissions:
  contents: write

concurrency:
  group: cmpct-v030-one-shot-land-r25-implicit-seam
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
          fetch-depth: 0
      - name: Bind exact triggering head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Apply the already-proven exact canonical seam
        run: |
          set -euo pipefail
          git apply --check benchmarks/patches/v030_r25_manifest_canonical_integration.patch
          git apply benchmarks/patches/v030_r25_manifest_canonical_integration.patch
          python -m py_compile experiments/entropygraph_v030_canonical_final_impl.py
      - name: Synchronize provisional r25 format and zero-history state
        run: |
          python - <<'PY'
          from pathlib import Path

          fmt = Path('docs/FORMAT.md')
          text = fmt.read_text(encoding='utf-8')
          marker = '## 16. Content/manifest consistency and tree identities\n'
          assert marker in text
          addition = '''### 15.1 Admitted compact filesystem control (implicit-v4)\n\nThe canonical r25 encoder may replace the explicit filesystem-v1 MessagePack map above with the bounded\n**implicit-v4** control only when all of the following are true: the source filesystem-v1 control is valid,\nimplicit-v4 expands back to exactly the same filesystem-v1 semantics, and its encoded bytes are strictly\nsmaller. Ties and any failed semantic proof retain filesystem-v1. Admission is structural/content-agnostic and\nmay not depend on workload names, benchmark hashes, source paths or equivalent identity.\n\nThe implicit-v4 wire value is one four-element MessagePack array:\n\n```text\n[4, default_metadata, regular_metadata_overrides, explicit_rows]\n```\n\n`default_metadata` is `[mode, mtime_ns, uid, gid, xattrs]`. Each regular-file metadata row is a bounded\nbitmask plus numeric deltas and/or xattr replacement relative to that default. Regular paths, sizes and SHA-256\nidentities are intentionally omitted from this control because the selected authenticated content graph already\nowns them. `explicit_rows` contains only directories, symlinks and hardlinks using prefix-delta paths, a compact\nkind code, metadata override and kind-specific payload. Hardlinks address an authenticated regular owner by its\ncanonical sorted regular-entry index.\n\nA reader must authenticate the compact control as an ordinary graph member, obtain regular path/size/SHA-256\nidentities from that same authenticated graph, reconstruct the full filesystem-v1 semantic entry set, and then\napply every ordinary path, metadata, hardlink, symlink, resource and content/manifest consistency rule. A count,\npath, identity or grammar mismatch fails closed; it never falls back to a different interpretation. The compact\ncontrol retains the existing 8 MiB bounded decode-unit ceiling.\n\nThe admission changes only filesystem-control encoding inside provisional revision 25. It does not alter the two\n`CMP25*` profile magics, user-tree semantics, genuine-r24 fallback rule, <=8x locality requirement or release\nlock. Native/Android/recovery implementations must consume this same dual-control grammar before r25 can ship.\n\n'''
          text = text.replace(marker, addition + marker, 1)
          fmt.write_text(text, encoding='utf-8')

          state = Path('docs/CURRENT_STATE.md')
          text = state.read_text(encoding='utf-8')
          marker = '## Design invariants\n'
          assert marker in text
          addition = '''## Provisional v0.30 r25 filesystem-control integration\n\nOn `agent/v030-authoritative-integration`, the canonical r25 writer/reader now admits the compact implicit-v4\nfilesystem control through the shared content-agnostic admission seam. The decisive exact-head A/B that\nauthorized landing reduced the developer-repository complete r25 artifact from **909,369 B to 844,116 B**\n(**65,253 B saved**) while preserving exact user-tree semantics, strong verification and **1.0x** control-read\namplification. The explicit filesystem-v1 encoding remains the mandatory fallback on ties or any failed semantic\nproof.\n\nThis is a D5 productization step, not release authority. Recovery/malformed-control parity, shared native parsing,\nAndroid/platform parity, genuine r24 product-floor selection, exact all-workload competitor authority and the\nstrict release lock still must pass on one exact candidate before v0.30 can ship.\n\n'''
          text = text.replace(marker, addition + marker, 1)
          state.write_text(text, encoding='utf-8')
          PY
      - name: Focused canonical regression gate
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q \
            tests/test_v030_r25_manifest_admission.py \
            tests/test_v030_fs_implicit_v4.py \
            tests/test_v030_canonical_final.py \
            tests/test_rnd_domination_contract.py
      - name: Persist seam only if branch did not move
        run: |
          set -euo pipefail
          git fetch origin agent/v030-authoritative-integration
          test "$(git rev-parse origin/agent/v030-authoritative-integration)" = "$GITHUB_SHA"
          git config user.name 'CMPCT v0.30 integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/entropygraph_v030_canonical_final_impl.py docs/FORMAT.md docs/CURRENT_STATE.md
          git commit -m 'feat(v0.30): land implicit r25 filesystem control seam'
          git push origin HEAD:agent/v030-authoritative-integration

# One-shot custody bridge: the exact source patch was already proven by the canonical A/B oracle before this file
# existed. This workflow exists only because the connected repository API cannot apply a three-hunk patch to a\n# large source blob safely. Delete this workflow immediately after the guarded commit lands.
