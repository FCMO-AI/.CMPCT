name: CMPCT v0.30 GIR build rehabilitation

on:
  push:
    branches:
      - agent/v030-gir-build-rehab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-gir-build-rehab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gir-build-rehab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out build-rehabilitation branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run hierarchy, GIR and byte-identity rehabilitation tests
        run: |
          python -m pytest -q \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_gir.py \
            tests/test_v030_gir_rehab.py \
            tests/test_v030_gir_parallel.py

      - name: Compile rehabilitation facades
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_hierarchical_geometry.py \
            experiments/entropygraph_v030_gir.py \
            experiments/entropygraph_v030_gir_rehab.py \
            experiments/entropygraph_v030_gir_parallel.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

# Footnote: this lane is deliberately not a compression-evidence workflow. Its authority is byte identity:
# (1) reuse the exact raw direct floor already paid by G0-G2, (2) schedule the independent accepted-v0.29
# and GIR complete builds concurrently, and (3) publish the exact winner by same-filesystem rename. None of
# those operations may change candidate bytes, fallback ties, hierarchy choices, or public release claims.
