# ci-lane: deep
name: CMPCT Zstd reader ownership A/B

on:
  pull_request:
    paths:
      - "native/cmpct-core/**"
      - "src/cmpct/reader.py"
      - "tests/zstd_reader_owner_ab.py"
      - ".github/workflows/zstd-reader-owner-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-zstd-reader-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader-owner-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact test surface
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Build package-owned core
        working-directory: native/cmpct-core
        run: cargo build --release --locked
      - name: Charged real-archive reader A/B
        run: |
          set -o pipefail
          python tests/zstd_reader_owner_ab.py | tee zstd-reader-owner-ab.json
      - name: Preserve measurement
        uses: actions/upload-artifact@v4
        with:
          name: zstd-reader-owner-ab-${{ github.event.pull_request.head.sha || github.sha }}
          path: zstd-reader-owner-ab.json
          if-no-files-found: error
          retention-days: 14
