name: ONE-G0.2 plan-direct V2 writer attribution

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_g02_plan_direct_v2_writer_attribution.py'
      - 'docs/one/evidence/ONE_G02_PLAN_DIRECT_V2_WRITER_ATTRIBUTION_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-plan-direct-v2-writer-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen plan-direct V2 attribution
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_plan_direct_v2_writer_attribution | tee one-g02-plan-direct-v2-writer-attribution.json
      - name: Preserve attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-plan-direct-v2-writer-attribution-${{ github.sha }}
          path: one-g02-plan-direct-v2-writer-attribution.json
          if-no-files-found: error
