# ci-lane: fast
name: v031 O211 mixed genuine ZIP64 inherited Deflate attribution
on:
  pull_request:
    branches:
      - agent/phased3-v031-o193-zip64-streamed-fallback-20261026
    paths:
      - 'research/o211_mixed_zip64_attribution.py'
      - '.github/workflows/v031-o211-mixed-zip64-attribution.yml'
      - 'docs/v031-research/2026-10-26-o211-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o211-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-zip64:
    name: Original installed CMPCT Builder + Reader full ZIP64 science
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source outside checkout
        run: python -m pip install .
      - name: Build actual 4GiB sparse + inherited Deflate source
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/research/o211_mixed_zip64_attribution.py" \
            --mode build --workdir "$RUNNER_TEMP/o211" \
            --out "$RUNNER_TEMP/o211-build.json"
      - name: Four complete exports and full independent SHA/CRC
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TZ: UTC
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/research/o211_mixed_zip64_attribution.py" \
            --mode consume --workdir "$RUNNER_TEMP/o211" \
            --out "$RUNNER_TEMP/o211-consume.json"
      - name: Preserve outcome and negative evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o211-science-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/o211-build.json
            ${{ runner.temp }}/o211-consume.json
            ${{ runner.temp }}/o211/manifest.json
          if-no-files-found: warn
          retention-days: 14
