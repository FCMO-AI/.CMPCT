name: CMPCT v0.30 Office adaptive effort Builder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - experiments/entropygraph_v030_federated_adaptive_effort_candidate_v8.py
      - benchmarks/v030_office_adaptive_effort_builder.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/v030_office_physical_economics_referee.py
      - experiments/entropygraph_v025.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v5.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v6.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py
      - docs/V030_OFFICE_ADAPTIVE_EFFORT_BUILDER_LOCK_2026-09-13.md
      - .github/workflows/v030-office-adaptive-effort-builder.yml

permissions:
  contents: read

jobs:
  office-adaptive-effort-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen v0.29 Genesis comparator
        uses: actions/checkout@v4
        with:
          ref: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d
          path: .frozen-v029
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current15 system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install exact-head dependencies
        run: python -m pip install -e '.[test]'
      - name: Syntax-check Builder surfaces
        run: |
          python -m py_compile experiments/entropygraph_v030_federated_adaptive_effort_candidate_v8.py
          python -m py_compile benchmarks/v030_office_adaptive_effort_builder.py
      - name: Run fresh-process Builder gate
        id: builder
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m benchmarks.v030_office_adaptive_effort_builder \
            --v029-checkout .frozen-v029 \
            --out evidence/office-adaptive-effort-builder.json \
            > >(tee evidence/stdout.txt) \
            2> >(tee evidence/stderr.txt >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Bind and classify receipt
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          receipt=Path('evidence/office-adaptive-effort-builder.json'); stderr=Path('evidence/stderr.txt')
          code=int('${{ steps.builder.outputs.exit_code || 1 }}'); out=Path(os.environ['GITHUB_OUTPUT'])
          if receipt.exists():
              d=json.loads(receipt.read_text()); d['candidate_sha']=os.environ['GITHUB_SHA']; d['candidate_ref']=os.environ['GITHUB_REF_NAME']
              receipt.write_text(json.dumps(d,indent=2,sort_keys=True))
              verdict=str(d.get('verdict','UNKNOWN')); e8=d.get('eg08',{}).get('archive_bytes','na'); v29=d.get('frozen_v029',{}).get('archive_bytes','na'); rec=d.get('actual_recovered_vs_eg07_bytes','na')
              label=f"{verdict}-eg8{e8}-v29{v29}-rec{rec}"
          else:
              lines=[x.strip() for x in stderr.read_text(errors='replace').splitlines() if x.strip()] if stderr.exists() else []
              msg=re.sub(r'[^A-Za-z0-9_.-]+','-',lines[-1] if lines else 'no-receipt')[:120]
              label=f"HARNESS_FAIL-{msg}"
          label=re.sub(r'[^A-Za-z0-9_.-]+','-',label)[:180]
          with out.open('a') as f: f.write(f"label={label}\nexit_code={code}\n")
          PY
      - name: Upload exact-head Builder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-office-eg08-${{ steps.classify.outputs.label }}-${{ github.sha }}
          path: |
            evidence/office-adaptive-effort-builder.json
            evidence/stdout.txt
            evidence/stderr.txt
          if-no-files-found: error
      - name: Enforce harness exit
        if: always()
        run: test "${{ steps.classify.outputs.exit_code }}" = "0"
