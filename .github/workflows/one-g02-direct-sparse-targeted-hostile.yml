name: ONE-G0.2 direct sparse targeted hostile

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/one_g02_direct_sparse_targeted_hostile.py'
      - 'benchmarks/one/one_g02_shift_relation_sparse_gate_kernel.c'
      - 'benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_direct_kernel.c'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_restrict_kernel.c'
      - 'benchmarks/one/one_g02_relation_shared_observer_validation.py'
      - 'docs/one/evidence/ONE_G02_DIRECT_SPARSE_TARGETED_HOSTILE_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-direct-sparse-targeted-hostile.yml'

permissions:
  contents: read

jobs:
  targeted-hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen targeted-hostile transfer
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_direct_sparse_targeted_hostile | tee artifacts/one/direct_sparse_targeted_hostile.json
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Publish evidence annotation
        if: always()
        run: |
          if [ -f artifacts/one/direct_sparse_targeted_hostile.json ]; then
            payload=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/one/direct_sparse_targeted_hostile.json")),separators=(",",":")))')
            echo "::notice title=ONE-G0.2 targeted hostile evidence::$payload"
          else
            echo '::error title=ONE-G0.2 targeted hostile evidence::result file missing'
          fi
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-direct-sparse-targeted-hostile-${{ github.sha }}
          path: artifacts/one/direct_sparse_targeted_hostile.json
          if-no-files-found: error
