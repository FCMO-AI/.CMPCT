# ci-lane: fast
name: CMPCT1 ONE-G0.2 selective descriptor auth transfer
on:
  pull_request:
    paths:
      - "experiments/one/auth_tree.py"
      - "benchmarks/one/one_g02_shared_graph_auth_pair.py"
      - "benchmarks/one/one_g02_shared_graph_auth_multiversion.py"
      - "benchmarks/one/one_g02_shared_graph_auth_descriptor_tree.py"
      - ".github/workflows/cmpct1-one-g02-shared-auth-descriptor-tree.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-shared-auth-descriptor-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  descriptor-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run frozen selective descriptor authentication transfer
        run: |
          mkdir -p one-shared-auth-descriptor-tree-artifacts
          python -m benchmarks.one.one_g02_shared_graph_auth_descriptor_tree | tee one-shared-auth-descriptor-tree-artifacts/one-g02-shared-auth-descriptor-tree.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-shared-auth-descriptor-tree-${{ env.EVIDENCE_HEAD }}
          path: one-shared-auth-descriptor-tree-artifacts/
          if-no-files-found: error
