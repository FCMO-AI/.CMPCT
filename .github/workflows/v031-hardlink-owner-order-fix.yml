# ci-lane: fast
name: CMPCT v031 hardlink-owner publication product court
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_hardlink_owner_order.py'
      - 'benchmarks/v031_hardlink_owner_order_court.py'
      - '.github/workflows/v031-hardlink-owner-order-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hardlink-owner-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real CMPCT package with native core
        run: python -m pip install -e '.[test]'
      - name: Verify exact source and complete filesystem semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p benchmark-artifacts
          python -m pytest -q tests/test_v031_hardlink_owner_order.py | tee benchmark-artifacts/hardlink-owner-tests.log
          python benchmarks/v031_hardlink_owner_order_court.py --expect-fixed | tee benchmark-artifacts/hardlink-owner-product.json
      - name: Verify CI topology
        run: python tools/check_ci_topology.py .github/workflows/v031-hardlink-owner-order-fix.yml
      - name: Preserve exact-head product receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-hardlink-owner-product-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
