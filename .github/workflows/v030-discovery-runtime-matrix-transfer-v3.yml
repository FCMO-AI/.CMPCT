# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 discovery-source runtime-matrix transfer v3

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_discovery_runtime_matrix_transfer_v2.py'
      - 'benchmarks/v030_discovery_runtime_matrix_transfer_v3.py'
      - 'benchmarks/v030_shifted_g04_discovery_audition_survival_v1.py'
      - 'docs/v030-rnd/R25_SHIFTED_DISCOVERY_RUNTIME_MATRIX_TRANSFER_V3_PREREG.md'
      - '.github/workflows/v030-discovery-runtime-matrix-transfer-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-discovery-runtime-matrix-transfer-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_discovery_runtime_matrix_transfer_v2\.py|benchmarks/v030_discovery_runtime_matrix_transfer_v3\.py|benchmarks/v030_shifted_g04_discovery_audition_survival_v1\.py|docs/v030-rnd/R25_SHIFTED_DISCOVERY_RUNTIME_MATRIX_TRANSFER_V3_PREREG\.md|\.github/workflows/v030-discovery-runtime-matrix-transfer-v3\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  transfer-ab:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact scientific head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen transfer instruments
        run: |
          python -m py_compile benchmarks/v030_shifted_g04_discovery_audition_survival_v1.py
          python -m py_compile benchmarks/v030_discovery_runtime_matrix_transfer_v2.py
          python -m py_compile benchmarks/v030_discovery_runtime_matrix_transfer_v3.py
      - name: Run two-pair applicability-aware runtime-matrix transfer A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_discovery_runtime_matrix_transfer_v3.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-discovery-runtime-matrix-transfer-v3-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-discovery-runtime-matrix-transfer-v3.json"
      - name: Enforce frozen transfer grammar and exact binding
        if: always()
        run: |
          test -f benchmark-artifacts/v030-discovery-runtime-matrix-transfer-v3.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-discovery-runtime-matrix-transfer-v3.json').read_text())
          assert d['schema']=='cmpct-v030-discovery-runtime-matrix-transfer-v3'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['repetitions']==2
          assert d['contract']['single_ablation']=='accepted.BASE.P._position_independent_candidates -> []'
          assert d['contract']['product_changed'] is False
          assert d['release_credit'] is False
          assert len(d['targets'])==3
          allowed={'DISCOVERY_SOURCE_RUNTIME_MATRIX_BYTE_DEAD','DISCOVERY_SOURCE_TRANSFER_MIXED','DISCOVERY_SOURCE_RUNTIME_MATRIX_ALTERNATE_SMALLER','INVALID'}
          assert d['decision'] in allowed
          if d['decision']!='INVALID': assert not d['invalid_reasons']
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-discovery-runtime-matrix-transfer-v3.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-discovery-runtime-matrix-transfer-v3-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-discovery-runtime-matrix-transfer-v3.json
          if-no-files-found: error
          retention-days: 90

# Transfer/disproof only. No target receives release credit from this experiment.
