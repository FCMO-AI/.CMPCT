name: CMPCT v0.30 native authority
# ci-lane: release
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-core/**'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'tests/test_v030_canonical_final.py'
      - 'tests/test_v030_profile_isolation.py'
      - 'tests/test_v030_r25_manifest_admission.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - 'tests/generate_v030_canonical_goldens.py'
      - 'tests/generate_v030_implicit_goldens.py'
      - 'tests/conformance/v030-r25-canonical.json'
      - 'tests/conformance/v030-r25-implicit-v4.json'
      - 'tests/native_v030_canonical.py'
      - 'tests/native_v030_implicit_manifest.py'
      - 'tests/native_v030_r24_verify_authority.py'
      - '.github/workflows/v030-native-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-native-authority-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(native/cmpct-(portable|core)/|experiments/entropygraph_v030_(canonical_final|canonical_final_impl|profile_isolation|release_product|r25_manifest_admission|fs_implicit_v4)\.py|tests/(test_v030_(canonical_final|profile_isolation|r25_manifest_admission|fs_implicit_v4)\.py|generate_v030_(canonical|implicit)_goldens\.py|conformance/v030-r25-(canonical|implicit-v4)\.json|native_v030_(canonical|implicit_manifest|r24_verify_authority)\.py)|\.github/workflows/v030-native-authority\.yml)' /tmp/latest-head-files.txt; then
            echo 'run_native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_native=false' >> "$GITHUB_OUTPUT"
          fi

  native-authority:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Python canonical boundary, admitted-manifest and profile-isolation tests
        run: |
          python -m pytest -q \
            tests/test_v030_canonical_final.py \
            tests/test_v030_r25_manifest_admission.py \
            tests/test_v030_fs_implicit_v4.py \
            tests/test_v030_profile_isolation.py
      - name: Reproduce independent canonical r25 filesystem-control goldens
        run: |
          python tests/generate_v030_canonical_goldens.py --check
          python tests/generate_v030_implicit_goldens.py --check
      - name: Rust format
        working-directory: native/cmpct-portable
        run: cargo fmt --check
      - name: Rust lint
        working-directory: native/cmpct-portable
        run: cargo clippy --all-targets --message-format=short -- -D warnings
      - name: Rust hostile/parser/native tests
        working-directory: native/cmpct-portable
        run: cargo test --all-targets
      - name: Rust release build
        working-directory: native/cmpct-portable
        run: cargo build --release
      - name: Canonical CMP25 CLI ABI recovery and filesystem-v1 acceptance
        run: python tests/native_v030_canonical.py
      - name: Canonical implicit-v4 independent golden and writer parity
        run: python tests/native_v030_implicit_manifest.py
      - name: Prove complete r24 RAW verification and truthful locality surface
        run: |
          python tests/native_v030_r24_verify_authority.py \
            --binary native/cmpct-portable/target/release/cmpct-portable
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-native-authority.yml

# Footnote: this release lane used to share one PR-wide cancellation group. On the long-lived v0.30 integration PR,
# any later commit could therefore destroy an otherwise useful 45-minute exact native receipt even when the later
# commit was unrelated. Exact-head concurrency plus newest-commit classification preserves already-running evidence
# while cheaply declining irrelevant heads. Builder-independent filesystem-v1 and implicit-v4 bytes independently
# pin both admitted filesystem-control dialects; writer parity separately proves the current canonical admission seam.
