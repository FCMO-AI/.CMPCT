name: CMPCT v0.30 native authority
# ci-lane: release
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-core/**'
      - 'src/cmpct/**'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_prefixgraph_parallel.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - 'experiments/entropygraph_v030_release_reader_policy.py'
      - 'experiments/entropygraph_v030_release_admission.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - 'experiments/entropygraph_v030_shared_portfolio.py'
      - 'experiments/entropygraph_v030_release_lock_strict.py'
      - 'tests/test_v030_canonical_final.py'
      - 'tests/test_v030_profile_isolation.py'
      - 'tests/test_v030_r25_manifest_admission.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - 'tests/test_v030_native_authority_custody.py'
      - 'tests/generate_v030_canonical_goldens.py'
      - 'tests/generate_v030_implicit_goldens.py'
      - 'tests/conformance/v030-r25-canonical.json'
      - 'tests/conformance/v030-r25-implicit-v4.json'
      - 'tests/native_v030_canonical.py'
      - 'tests/native_v030_implicit_manifest.py'
      - 'tests/native_v030_r24_verify_authority.py'
      - 'docs/FORMAT.md'
      - 'docs/HARDENING.md'
      - 'docs/NATIVE_CORE.md'
      - 'docs/PORTABILITY.md'
      - 'docs/v030-coordination/tasks/T01-native-portability.md'
      - 'tools/check_ci_topology.py'
      - 'pyproject.toml'
      - '.github/workflows/v030-native-authority.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-core/**'
      - 'src/cmpct/**'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_prefixgraph_parallel.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - 'experiments/entropygraph_v030_release_reader_policy.py'
      - 'experiments/entropygraph_v030_release_admission.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - 'experiments/entropygraph_v030_shared_portfolio.py'
      - 'experiments/entropygraph_v030_release_lock_strict.py'
      - 'tests/test_v030_canonical_final.py'
      - 'tests/test_v030_profile_isolation.py'
      - 'tests/test_v030_r25_manifest_admission.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - 'tests/test_v030_native_authority_custody.py'
      - 'tests/generate_v030_canonical_goldens.py'
      - 'tests/generate_v030_implicit_goldens.py'
      - 'tests/conformance/v030-r25-canonical.json'
      - 'tests/conformance/v030-r25-implicit-v4.json'
      - 'tests/native_v030_canonical.py'
      - 'tests/native_v030_implicit_manifest.py'
      - 'tests/native_v030_r24_verify_authority.py'
      - 'docs/FORMAT.md'
      - 'docs/HARDENING.md'
      - 'docs/NATIVE_CORE.md'
      - 'docs/PORTABILITY.md'
      - 'docs/v030-coordination/tasks/T01-native-portability.md'
      - 'tools/check_ci_topology.py'
      - 'pyproject.toml'
      - '.github/workflows/v030-native-authority.yml'

permissions:
  contents: read

jobs:
  native-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python package and native/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Python boundary + independent golden authority
        run: |
          python -m pytest -q tests/test_v030_canonical_final.py
          python -m pytest -q tests/test_v030_r25_manifest_admission.py
          python -m pytest -q tests/test_v030_fs_implicit_v4.py
          python -m pytest -q tests/test_v030_native_authority_custody.py
          python tests/native_v030_canonical.py tests/conformance/v030-r25-canonical.json
          python tests/native_v030_implicit_manifest.py tests/conformance/v030-r25-implicit-v4.json
          python tests/native_v030_r24_verify_authority.py

      - name: Rust formatting
        run: |
          cargo fmt --manifest-path native/cmpct-portable/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml --all -- --check

      - name: Rust lint
        run: |
          cargo clippy --manifest-path native/cmpct-portable/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: |
          cargo test --manifest-path native/cmpct-portable/Cargo.toml --all-features
          cargo test --manifest-path native/cmpct-core/Cargo.toml --all-features

      - name: Release build + CLI ABI smoke
        run: |
          cargo build --manifest-path native/cmpct-portable/Cargo.toml --release --bin cmpct-portable
          native/cmpct-portable/target/release/cmpct-portable --help

      - name: Portable format regression smoke
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tempfile
          from experiments import entropygraph_v030_canonical_final as v030
          from cmpct import native, r24_verify

          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td) / 'corpus'
              root.mkdir()
              (root / 'a.txt').write_text('hello native authority\n' * 128)
              (root / 'b.bin').write_bytes(bytes(range(256)) * 8)
              archive = pathlib.Path(td) / 'sample.cmpct'
              result = v030.create_archive(root, archive)
              archive_bytes = archive.read_bytes()
              entries = native.list_archive_bytes(archive_bytes)
              assert sorted(entry.path for entry in entries) == ['a.txt', 'b.bin']
              for path in ('a.txt', 'b.bin'):
                  assert native.read_archive_bytes(archive_bytes, path) == (root / path).read_bytes()
              assert r24_verify.verify_archive_file(archive)['status'] == 'ok'
          PY

      - name: Portable CLI filesystem materialization smoke
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tempfile
          from experiments import entropygraph_v030_canonical_final as v030
          from cmpct import native

          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td) / 'corpus'
              root.mkdir()
              nested = root / 'nested'
              nested.mkdir()
              payload = b'native filesystem materialization\n' * 64
              (nested / 'data.bin').write_bytes(payload)
              try:
                  os.symlink('data.bin', nested / 'link.bin')
                  symlink_supported = True
              except OSError:
                  symlink_supported = False
              archive = pathlib.Path(td) / 'sample.cmpct'
              v030.create_archive(root, archive)
              out = pathlib.Path(td) / 'out'
              native.extract_archive_file(archive, out, engine='rust', overwrite=True)
              assert (out / 'nested' / 'data.bin').read_bytes() == payload
              if symlink_supported:
                  link = out / 'nested' / 'link.bin'
                  assert link.is_symlink()
                  assert os.readlink(link) == 'data.bin'
          PY
