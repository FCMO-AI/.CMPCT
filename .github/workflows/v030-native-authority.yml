name: CMPCT v0.30 native authority
# ci-lane: release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-core/**'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'tests/test_v030_canonical_final.py'
      - '.github/workflows/v030-native-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-native-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Python canonical boundary tests
        run: python -m pytest -q tests/test_v030_canonical_final.py
      - name: Rust format
        working-directory: native/cmpct-portable
        run: cargo fmt --check
      - name: Rust lint
        working-directory: native/cmpct-portable
        run: cargo clippy --all-targets --message-format=short -- -D warnings
      - name: Rust hostile/parser/native tests
        working-directory: native/cmpct-portable
        run: cargo test --all-targets
      - name: Rust release build
        working-directory: native/cmpct-portable
        run: cargo build --release
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-native-authority.yml

# Footnote: this lane is release-scoped because it validates the shared native reader that can open every
# representation the v0.30 selector may publish. It is intentionally path-scoped and superseding so native
# authority is not confused with unrelated research or presentation work.
