name: CMPCT v0.30 native authority
# ci-lane: release
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-core/**'
      - 'cmpct/**'
      - 'experiments/entropygraph_v030_canonical_final.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_profile_isolation.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_prefixgraph_parallel.py'
      - 'experiments/entropygraph_v030_release_admission.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - 'experiments/entropygraph_v030_release_reader_policy.py'
      - 'experiments/entropygraph_v030_shared_portfolio.py'
      - 'experiments/entropygraph_v030_release_lock_strict.py'
      - 'tests/test_v030_canonical_final.py'
      - 'tests/test_v030_profile_isolation.py'
      - 'tests/test_v030_r25_manifest_admission.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - 'tests/generate_v030_canonical_goldens.py'
      - 'tests/generate_v030_implicit_goldens.py'
      - 'tests/conformance/v030-r25-canonical.json'
      - 'tests/conformance/v030-r25-implicit-v4.json'
      - 'tests/native_v030_canonical.py'
      - 'tests/native_v030_implicit_manifest.py'
      - 'tests/native_v030_r24_verify_authority.py'
      - 'docs/FORMAT.md'
      - 'docs/HARDENING.md'
      - 'docs/NATIVE_CORE.md'
      - 'docs/PORTABILITY.md'
      - 'tools/check_ci_topology.py'
      - 'pyproject.toml'
      - '.github/workflows/v030-native-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-native-authority-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          # Keep the newest-head classifier aligned with the full evidence-critical dependency closure. Native
          # authority executes canonical Python semantics and emits a strict release fingerprint, so changes to
          # those transitive inputs must not inherit an older green native receipt.
          if grep -Eq '^(native/cmpct-(portable|core)/|cmpct/.*|experiments/entropygraph_v030_(canonical_final|canonical_final_impl|profile_isolation|release_product|product_fs|r25_manifest_admission|fs_implicit_v4|geometry_overlay_g04|prefixgraph|prefixgraph_parallel|release_admission|release_candidate|release_reader_policy|shared_portfolio|release_lock_strict)\.py|tests/(test_v030_(canonical_final|profile_isolation|r25_manifest_admission|fs_implicit_v4)\.py|generate_v030_(canonical|implicit)_goldens\.py|conformance/v030-r25-(canonical|implicit-v4)\.json|native_v030_(canonical|implicit_manifest|r24_verify_authority)\.py)|docs/(FORMAT|HARDENING|NATIVE_CORE|PORTABILITY)\.md|tools/check_ci_topology\.py|pyproject\.toml|\.github/workflows/v030-native-authority\.yml)' /tmp/latest-head-files.txt; then
            echo 'run_native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_native=false' >> "$GITHUB_OUTPUT"
          fi

  native-authority:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Python canonical boundary, admitted-manifest and profile-isolation tests
        run: |
          python -m pytest -q \
            tests/test_v030_canonical_final.py \
            tests/test_v030_r25_manifest_admission.py \
            tests/test_v030_fs_implicit_v4.py \
            tests/test_v030_profile_isolation.py
      - name: Reproduce independent canonical r25 filesystem-control goldens
        run: |
          python tests/generate_v030_canonical_goldens.py --check
          python tests/generate_v030_implicit_goldens.py --check
      - name: Rust format
        working-directory: native/cmpct-portable
        run: cargo fmt --check
      - name: Rust lint
        working-directory: native/cmpct-portable
        run: cargo clippy --all-targets --message-format=short -- -D warnings
      - name: Rust hostile/parser/native tests
        working-directory: native/cmpct-portable
        run: cargo test --all-targets
      - name: Rust release build
        working-directory: native/cmpct-portable
        run: cargo build --release
      - name: Canonical CMP25 CLI ABI recovery and filesystem-v1 acceptance
        run: python tests/native_v030_canonical.py
      - name: Canonical implicit-v4 independent golden, recovery and writer parity
        run: python tests/native_v030_implicit_manifest.py
      - name: Prove complete r24 RAW verification and truthful locality surface
        run: |
          python tests/native_v030_r24_verify_authority.py \
            --binary native/cmpct-portable/target/release/cmpct-portable
      - name: Record exact-candidate native authority evidence
        run: |
          python -m experiments.entropygraph_v030_release_lock_strict --print-fingerprint \
            > "$RUNNER_TEMP/cmpct-v030-fingerprint.json"
          python - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          fingerprint = json.loads((temp / 'cmpct-v030-fingerprint.json').read_text())['candidate_fingerprint']
          candidate_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = {
              'schema': 'cmpct-v030-native-authority-evidence-v1',
              'candidate_sha': candidate_sha,
              'candidate_fingerprint': fingerprint,
              'workflow': 'v030-native-authority.yml',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'facts': {
                  'g04_native_parity': True,
                  'prefixgraph_native_parity': True,
                  'builder_independent_goldens': True,
                  'native_recovery_green': True,
                  'implicit_v4_native_parity': True,
                  'implicit_v4_recovery_green': True,
                  'r24_fallback_native_verify_green': True,
                  'shared_core_used': True,
              },
          }
          out = temp / 'cmpct-v030-native-authority-evidence.json'
          out.write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-native-authority.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cmpct-v030-native-authority-${{ env.EVIDENCE_HEAD }}
          path: ${{ runner.temp }}/cmpct-v030-native-authority-evidence.json
          if-no-files-found: warn
          retention-days: 30

# Footnote: this release lane used to share one PR-wide cancellation group. On the long-lived v0.30 integration PR,
# any later commit could therefore destroy an otherwise useful 45-minute exact native receipt even when the later
# commit was unrelated. Exact-head concurrency plus newest-commit classification preserves already-running evidence
# while cheaply declining irrelevant heads. Builder-independent filesystem-v1 and implicit-v4 bytes independently
# pin both admitted filesystem-control dialects; writer parity and the explicit recovery matrix separately prove the
# current canonical admission seam publishes recoverable bytes consumed by the shared native implementation. The
# structured artifact records only facts actually established by this lane; Logs-specific facts remain owned by their
# separate native/recovery evidence rather than being inferred here. The r25 format/hardening/native/portability
# contracts and filesystem semantic owner are trigger inputs too: changing a reader-visible or platform requirement
# without rerunning the native acceptance matrix would create green-looking repository state over stale proof.
