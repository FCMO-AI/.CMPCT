name: CMPCT1 ONE-G0.2 native mixed terminal plan
on:
  push:
    branches: [research/cmpct1]
    paths: &mixed_paths
      - 'experiments/one/native_mixed_terminal_plan.py'
      - 'experiments/one/native_mixed_terminal_plan_kernel.c'
      - 'benchmarks/one/one_g02_native_mixed_terminal_plan.py'
      - 'tests/one/test_native_mixed_terminal_plan.py'
      - 'docs/one/prereg/ONE_G02_NATIVE_MIXED_TERMINAL_PLAN_PREREG_2026-09-08.md'
      - 'docs/one/evidence/ONE_G02_NATIVE_MIXED_TERMINAL_PLAN_HOSTILE_REVIEW_2026-09-08.md'
      - '.github/workflows/cmpct1-one-g02-native-mixed-terminal-plan.yml'
  pull_request:
    paths: *mixed_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-mixed-terminal-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Exact source binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import benchmarks.one.one_g02_native_mixed_terminal_plan as b
          assert b.REPETITIONS == 21
          assert b.HOT_CONTROL_MAX == 1.05
          assert b.LONG_1M_OVER_PREPARED_MAX == 0.90
          assert b.STRUCTURED_1M_OVER_PREPARED_MAX == 0.95
          assert b.BREAK_EVEN_REPLAYS_MAX == 4.0
          PY
      - name: Semantic and decision-law tests
        run: python -m pytest -q tests/one/test_native_mixed_terminal_plan.py tests/one/test_prepared_terminal_plan.py
      - name: Run frozen falsifier
        run: |
          set +e
          python -m benchmarks.one.one_g02_native_mixed_terminal_plan > one_g02_native_mixed_terminal_plan.json
          rc=$?
          cat one_g02_native_mixed_terminal_plan.json
          exit $rc
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-mixed-terminal-plan-${{ env.EVIDENCE_HEAD }}
          path: one_g02_native_mixed_terminal_plan.json
          if-no-files-found: warn
