# ci-lane: fast
# O88 genuine two-engine product economics; not a core-release promotion gate.
name: CMPCT v0.31 O88 VZIP Budget Positive Economics
on:
  push:
    branches:
      - 'agent/phased1-v031-o88-vzip-budget-positive-economics-20261025'
  pull_request:
    paths:
      - 'benchmarks/v031_o88_vzip_budget_positive_economics.py'
      - '.github/workflows/v031-o88-vzip-budget-positive-economics.yml'
      - 'docs/v031-research/2026-10-25-o88-vzip-budget-positive-economics-prereg.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o88-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-source-exact-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      O63_BASE: 18e32cae012f5dca9fc47f10d194f8b81005c85c
      O86_CANDIDATE: 6225e30f3e21c0783aa56726b52a3a3583540f99
      O88_PREREG: f8a3f1f3b3597a42dae1246198ccc49a707e0434
    steps:
      - name: Checkout full provenance and actual code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm exact source, preregistration and research-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor "$O86_CANDIDATE" HEAD
          git merge-base --is-ancestor "$O88_PREREG" HEAD
          test "$(git hash-object src/cmpct/builder.py)" = e46c8670c11c386925f9ae228b25de44c8045f2e
          test "$(git hash-object src/cmpct/codec.py)" = 7d4c4a5a5f00c42561043611e5d4400dd8af38e6
          git diff --exit-code "$O86_CANDIDATE" HEAD -- src native tests pyproject.toml benchmarks/history docs/discovery/STATE.json
          python -m py_compile benchmarks/v031_o88_vzip_budget_positive_economics.py
          test -f docs/v031-research/2026-10-25-o88-vzip-budget-positive-economics-prereg.md
          git worktree add --detach "$RUNNER_TEMP/o88-o63-source" "$O63_BASE"
          test "$(git -C "$RUNNER_TEMP/o88-o63-source" rev-parse HEAD)" = "$O63_BASE"
          test "$(git -C "$RUNNER_TEMP/o88-o63-source" hash-object src/cmpct/builder.py)" = 382e60983bf1e8e7595ea7112f3a5553dc33dcc0
          test "$(git -C "$RUNNER_TEMP/o88-o63-source" hash-object src/cmpct/codec.py)" = dc3446b0eed82edfba9380e3885a20aa45577899
          echo "O88_ACTUAL_HISTORICAL_SOURCE=PASS"
      - name: Install independent original/candidate CMPCT source snapshots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m pip install --no-deps --target "$RUNNER_TEMP/o88-o63-install" "$RUNNER_TEMP/o88-o63-source"
          python -m pip install --no-deps --target "$RUNNER_TEMP/o88-o86-install" .
          test "$(git hash-object "$RUNNER_TEMP/o88-o63-install/cmpct/builder.py")" = 382e60983bf1e8e7595ea7112f3a5553dc33dcc0
          test "$(git hash-object "$RUNNER_TEMP/o88-o63-install/cmpct/codec.py")" = dc3446b0eed82edfba9380e3885a20aa45577899
          test "$(git hash-object "$RUNNER_TEMP/o88-o86-install/cmpct/builder.py")" = e46c8670c11c386925f9ae228b25de44c8045f2e
          test "$(git hash-object "$RUNNER_TEMP/o88-o86-install/cmpct/codec.py")" = 7d4c4a5a5f00c42561043611e5d4400dd8af38e6
          echo "O88_INSTALLED_SOURCE_CUSTODY=PASS"
      - name: Measure full archives and real Reader reconstruction on same source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o88-evidence
          python benchmarks/v031_o88_vzip_budget_positive_economics.py \
            --o63-package "$RUNNER_TEMP/o88-o63-install" \
            --o86-package "$RUNNER_TEMP/o88-o86-install" \
            --report o88-evidence/o88-raw.json 2>&1 | tee o88-evidence/court.log
          test "${PIPESTATUS[0]}" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('o88-evidence/o88-raw.json').read_text())
          assert r['experiment'] == 'O88' and len(r['cases']) == 3
          assert [x['name'] for x in r['cases']] == [
              'shared_low', 'shared_over', 'independent_over']
          assert sum(len(x['observations']) for x in r['cases']) == 18
          assert all(len([v for v in x['observations'] if v['arm']=='o63'])==3
                     and len([v for v in x['observations'] if v['arm']=='o86'])==3
                     for x in r['cases'])
          assert all(x['summary'] is not None for x in r['cases'])
          print('O88_GENUINE_SOURCE_EXACT_INSTALLED_PROCESSES=18')
          print('O88_DISCOVERY_RESULT='+r['scientific_decision'])
          PY
      - name: Preserve actual commit/source binding and partial negatives
        if: always()
        shell: bash
        run: |
          mkdir -p o88-evidence
          git rev-parse HEAD > o88-evidence/research-head.sha
          printf '%s\n' "$O63_BASE" > o88-evidence/o63-base.sha
          printf '%s\n' "$O86_CANDIDATE" > o88-evidence/o86-parent.sha
          git hash-object src/cmpct/builder.py > o88-evidence/o86-builder.blob
          git hash-object src/cmpct/codec.py > o88-evidence/o86-codec.blob
          git hash-object benchmarks/v031_o88_vzip_budget_positive_economics.py > o88-evidence/instrument.blob
          git diff --stat "$O86_CANDIDATE" HEAD > o88-evidence/research-diff.txt
      - name: Upload raw repetitions and scientific failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o88-source-exact-vzip-budget-${{ github.sha }}
          path: o88-evidence/
          if-no-files-found: warn
          retention-days: 30
