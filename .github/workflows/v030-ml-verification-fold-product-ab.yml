# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 ML verification fold product A/B

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Run balanced fresh-process product A/B
        run: python benchmarks/v030_ml_verification_fold_product_ab.py --pairs 4
      - name: Preserve exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-ml-verification-fold-product-ab-${{ github.sha }}
          path: benchmark-artifacts/v030-ml-verification-fold-product-ab.json
          if-no-files-found: error
