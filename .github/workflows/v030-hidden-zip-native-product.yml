# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 hidden-ZIP native product gate
on:
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: v030-hidden-zip-native-product-manual-${{ github.sha }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
          cargo build --manifest-path native/cmpct-hidden-zip-batch/Cargo.toml --release
      - run: python -m py_compile src/cmpct/native_hidden_zip_batch.py src/cmpct/vzip_transaction.py benchmarks/v030_hidden_zip_product_gain_retention.py benchmarks/v030_hidden_zip_resource_gate.py
      - run: python -m pytest -q tests/test_hidden_zip_finalize.py tests/test_hidden_zip_scan_integration.py tests/test_hidden_zip_stage.py tests/test_v030_vzip_transaction.py
      - run: python benchmarks/v030_hidden_zip_product_gain_retention.py --output benchmark-artifacts/hidden-zip-product.json
        env: {CMPCT_HIDDEN_ZIP_BATCH_LIB: '${{ github.workspace }}/native/cmpct-hidden-zip-batch/target/release/libcmpct_hidden_zip_batch.so'}
      - id: resource_gate
        continue-on-error: true
        run: python benchmarks/v030_hidden_zip_resource_gate.py --output benchmark-artifacts/hidden-zip-resource.json
        env: {CMPCT_HIDDEN_ZIP_BATCH_LIB: '${{ github.workspace }}/native/cmpct-hidden-zip-batch/target/release/libcmpct_hidden_zip_batch.so'}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-hidden-zip-native-product-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/hidden-zip-product.json
            benchmark-artifacts/hidden-zip-resource.json
          if-no-files-found: error
          retention-days: 90
      - if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-hidden-zip-native-product.yml
      - name: Enforce resource gate outcome
        if: always()
        run: test "${{ steps.resource_gate.outcome }}" = success
