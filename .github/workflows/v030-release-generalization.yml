# ci-lane: release
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 authoritative generalization

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  impact:
    runs-on: ubuntu-latest
    concurrency:
      group: cmpct-v030-authoritative-generalization-classifier-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.impact.outputs.should_run }}
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: impact
        name: Admit only a latest-head change that can affect generalization authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          # This is intentionally dependency-oriented, not benchmark-identity-oriented. Any shipping codec,
          # v0.30 product/reader/selector surface, frozen corpus/generalization authority, shared packaging/test
          # dependency, or this workflow itself must replay the full proof. Orthogonal research-only or docs/CI
          # commits cannot change the measured artifact and therefore skip the five-hour lane.
          if grep -Eq '^(src/cmpct/|experiments/entropygraph_v030_(geometry|hierarchical_geometry|geometry_overlay|geometry_overlay_g04|geometry_overlay_g04_publish|prefixgraph|prefixgraph_parallel|release|release_candidate|release_reader|release_reader_policy|release_product|release_product_base)([^/]*)\.py$|benchmarks/v030_release_(generalization|generalization_authoritative|performance).*\.py$|benchmarks/(neutral|resemblance)_hostile_corpus_v1\.py$|tests/test_v030_(geometry|hierarchical_geometry|geometry_overlay|geometry_overlay_prefallback|geometry_overlay_g04|g04_publish|prefixgraph|prefixgraph_parallel_release|release_reader|release_reader_policy|release_candidate|release_generalization_contract)\.py$|pyproject\.toml$|\.github/workflows/v030-release-generalization\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  release-generalization:
    needs: impact
    if: needs.impact.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: cmpct-v030-authoritative-generalization-receipt-${{ env.EVIDENCE_HEAD }}
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out exact authoritative candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact corpus and test dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Run integration, locality, reader and frozen-contract tests
        run: |
          python -m pytest -q \
            tests/test_v030_geometry.py \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_geometry_overlay.py \
            tests/test_v030_geometry_overlay_prefallback.py \
            tests/test_v030_geometry_overlay_g04.py \
            tests/test_v030_g04_publish.py \
            tests/test_v030_prefixgraph.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_release_candidate.py \
            tests/test_v030_release_generalization_contract.py

      - name: Compile authoritative v0.30 modules
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_geometry_overlay_g04.py \
            experiments/entropygraph_v030_geometry_overlay_g04_publish.py \
            experiments/entropygraph_v030_prefixgraph.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release.py \
            benchmarks/v030_release_generalization.py \
            benchmarks/v030_release_generalization_authoritative.py

      - name: Run exact repaired 15-workload v0.30 system gate
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_release_generalization_authoritative.py \
            --work-root benchmark-artifacts/v030-release-generalization-work \
            --output benchmark-artifacts/v030-release-generalization.json \
            2>&1 | tee benchmark-artifacts/v030-release-generalization.stdout.txt

      - name: Independently enforce frozen revision-worthiness contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/v030-release-generalization.json').read_text())
          contract=data['contract']; totals=data['totals']; gate=data['gate']
          assert data['schema']=='cmpct-v030-release-generalization-v1'
          assert data['engine']=='experiments/entropygraph_v030_release.py'
          assert data['release_facade']=='cmpct-v030-authoritative-integration-v1'
          assert contract['expected_v029_aggregate_bytes']==137499525
          assert contract['minimum_release_saving_bytes']==687783
          assert contract['inherited_absolute_revision_floor_bytes']==687783
          assert contract['minimum_release_saving_pct']==0.5
          assert contract['minimum_improved_rows']==3
          assert contract['maximum_member_read_amplification']==8.0
          assert contract['regression_tolerance_bytes']==0
          assert totals['workloads']==15
          assert totals['accepted_v029_bytes']==137499525
          assert totals['workloads_regressed']==0
          assert totals['workloads_improved']>=3
          assert totals['saving_vs_v029_bytes']>=687783
          assert totals['max_selected_member_read_amplification']<=8.0
          assert gate['passed'] is True
          print(json.dumps({'totals': totals, 'gate': gate}, indent=2))
          PY

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-release-generalization.yml

      - name: Upload authoritative v0.30 compression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-release-generalization-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-release-generalization.json
            benchmark-artifacts/v030-release-generalization.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# The five-hour authority remains mandatory whenever the newest exact head can affect its artifact or contract.
# Orthogonal research/workflow/docs commits now pay only the cheap impact classifier; no benchmark threshold,
# workload, locality rule, v0.29 floor, or release gate is changed by this scheduling optimization.
