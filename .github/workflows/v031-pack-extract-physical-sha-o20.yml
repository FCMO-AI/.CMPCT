# ci-lane: fast
name: CMPCT v0.31 physical PACK extraction identity O20

on:
  pull_request:
    paths:
      - 'benchmarks/v031_pack_extraction_sha_boundary_o20.py'
      - 'docs/v031-research/PACK_EXTRACT_PHYSICAL_SHA_O20_PREREG.md'
      - 'docs/v031-research/PACK_EXTRACT_PHYSICAL_SHA_O20_RESULT.md'
      - '.github/workflows/v031-pack-extract-physical-sha-o20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-pack-extract-o20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  physical-pack-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify source and immutable fixture custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 2cf7c3915cd618b9a72a5dc26bdd15a25cb75230 HEAD
          test "$(git hash-object benchmarks/v031_pack_physical_sha_court.py)" = 2383bf9a8f7ce8a9a01028ccf1072169897df3f1
          test "$(git hash-object src/cmpct/reader.py)" = "$(git rev-parse 2cf7c3915cd618b9a72a5dc26bdd15a25cb75230:src/cmpct/reader.py)"
          mkdir -p benchmark-artifacts
          printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/source-head.txt
          git hash-object src/cmpct/reader.py benchmarks/v031_pack_physical_sha_court.py benchmarks/v031_pack_extraction_sha_boundary_o20.py > benchmark-artifacts/source-blobs.txt
      - name: Install actual CMPCT package
        run: python -m pip install -e '.[test]'
      - name: Execute source-exact physical SHA extraction court
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_pack_physical_sha_court.py --expected-pack reject > benchmark-artifacts/inherited-verify.json
          python benchmarks/v031_pack_extraction_sha_boundary_o20.py --out benchmark-artifacts/o20-extract.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('benchmark-artifacts/o20-extract.json').read_text())
          assert result['status']=='PASS'
          assert result['decision']=='EXTRACT_CRC_TIER_CAN_PUBLISH_SHA_INCONSISTENT_BYTES'
          assert result['cases']['pack_crc_repaired']['strong_verify']=='REJECT'
          assert result['cases']['pack_crc_repaired']['ordinary_extractall']=='ACCEPT'
          print('O20 research negative precisely reproduced')
          PY
      - name: Preserve reproducible scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-pack-extract-o20-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
