# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics proof-directed admission

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_proof_directed_admission_oracle.py'
      - '.github/workflows/v030-analytics-proof-directed-admission.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_proof_directed_admission_oracle.py'
      - '.github/workflows/v030-analytics-proof-directed-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-proof-admission-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          cat /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_proof_directed_admission_oracle\.py|\.github/workflows/v030-analytics-proof-directed-admission\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-proof-admission:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_analytics_proof_directed_admission_oracle.py
      - name: Run path-blind admission oracle
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_proof_directed_admission_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-proof-admission-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-proof-admission.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-proof-admission.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-proof-directed-admission-oracle-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['fixed_levels']==[15,19]
          assert d['contract']['same_raw_pack_identity'] is True
          assert d['contract']['path_blind_features_only'] is True
          assert d['contract']['runtime_claim_requires_selective_builder'] is True
          assert d['next_decision'] in {'BUILD_FROZEN_SELECTIVE_ADMISSION','ESCALATE_TO_CHEAPER_PROOF_OR_NATIVE'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-proof-directed-admission.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-proof-admission-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-proof-admission.json
          if-no-files-found: error
          retention-days: 90

# Research-only causal oracle. Green means the receipt is structurally valid, not that the hypothesis won.
