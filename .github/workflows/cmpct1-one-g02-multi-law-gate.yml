# Exact-source research evidence lane; scientific thresholds are bound in the checkout.
name: CMPCT1 ONE-G0.2 multi-Law opportunity gate
on:
  push:
    branches: [research/cmpct1]
    paths: &paths
      - 'experiments/one/multi_law_gate.py'
      - 'tests/one/test_multi_law_gate.py'
      - 'benchmarks/one/one_g02_multi_law_gate.py'
      - 'docs/one/prereg/ONE_G02_MULTI_LAW_GATE_PREREG_2026-09-08.md'
      - 'docs/one/evidence/ONE_G02_MULTI_LAW_GATE_HOSTILE_REVIEW_2026-09-08.md'
      - '.github/workflows/cmpct1-one-g02-multi-law-gate.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-law-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Exact source binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import benchmarks.one.one_g02_multi_law_gate as b
          assert b.REPETITIONS == 9
          assert b.MAX_FALSE_NEGATIVES == 0
          assert b.MAX_NEGATIVE_NOMINATIONS == 1
          assert b.MAX_RETAINED_FRACTION == 0.15
          assert len(b.SIZES) * len(b.FAMILIES) == 24
          PY
      - name: Semantic and decision-law tests
        run: python -m pytest -q tests/one/test_multi_law_gate.py
      - name: Run frozen falsifier
        run: |
          set +e
          python -m benchmarks.one.one_g02_multi_law_gate > one_g02_multi_law_gate.json
          rc=$?
          cat one_g02_multi_law_gate.json
          exit $rc
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-multi-law-gate-${{ env.EVIDENCE_HEAD }}
          path: one_g02_multi_law_gate.json
          if-no-files-found: warn
