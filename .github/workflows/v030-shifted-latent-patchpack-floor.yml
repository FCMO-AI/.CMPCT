# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted latent patch-pack R4 floor

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_shifted_latent_patchpack_floor.py'
      - 'benchmarks/v030_shifted_latent_consensus_floor.py'
      - '.github/workflows/v030-shifted-latent-patchpack-floor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_shifted_latent_patchpack_floor.py'
      - 'benchmarks/v030_shifted_latent_consensus_floor.py'
      - '.github/workflows/v030-shifted-latent-patchpack-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shifted-latent-patchpack-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_shifted_latent_(patchpack|consensus)_floor\.py|\.github/workflows/v030-shifted-latent-patchpack-floor\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  latent-patchpack:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Validate decisive instrument
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/v030_shifted_latent_patchpack_floor.py
          python tools/check_ci_topology.py .github/workflows/v030-shifted-latent-patchpack-floor.yml
          python tools/check_public_surface.py
      - name: Run exact bounded patch-pack floor
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_shifted_latent_patchpack_floor.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-latent-patchpack-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-latent-patchpack.json"
      - name: Enforce exact decision boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-shifted-latent-patchpack.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-latent-patchpack.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-latent-patchpack-floor-v3'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['diagnosis']=='D4' and d['radicality']=='R4' and int(d['rps'])>=80
          assert set(['S1','S3','S4']).issubset(d['saturation_inherited'])
          c=d['contract']
          assert c['benchmark_identity_used_in_representation'] is False
          assert c['single_shared_patch_context'] is True
          assert c['max_chain_depth']==1
          assert c['candidate_create_excludes_counterfactual_control'] is True
          assert c['release_credit'] is False
          t=d['timing']
          assert all(float(t[k]) >= 0 for k in (
              'latent_derivation_s','latent_compress_s','delta_construction_s',
              'shared_patch_compress_s','candidate_create_s','independent_frame_control_compress_s'))
          x=d['candidate']
          assert abs(float(x['create_seconds'])-float(t['candidate_create_s'])) < 1e-12
          assert x['tree_verified'] is True
          assert int(x['max_decode_unit_bytes'])<=8*1024*1024
          assert float(x['max_member_read_amplification'])<=8.0
          assert int(x['payload_floor_bytes'])<=int(x['archive_bytes'])
          assert int(x['independent_patch_stored_bytes'])>=int(x['patch_stored_bytes'])
          assert int(x['patch_context_saved_bytes'])==int(x['independent_patch_stored_bytes'])-int(x['patch_stored_bytes'])
          assert 0.0 <= float(x['patch_context_saved_fraction']) <= 1.0
          assert len(x['artifact_sha256'])==64
          z=int(d['comparators']['tar_zstd19_solid']['bytes'])
          assert d['decision']['payload_floor_zstd_gap_bytes']==int(x['payload_floor_bytes'])-z
          assert d['decision']['archive_zstd_gap_bytes']==int(x['archive_bytes'])-z
          assert d['decision']['context_gain_bytes_vs_identical_independent_frames']==int(x['patch_context_saved_bytes'])
          assert d['hostile_reviewer']['context_gain_is_exactly_attributed'] is True
          assert d['hostile_reviewer']['counterfactual_control_excluded_from_candidate_timing'] is True
          strict_expected=(
              int(x['archive_bytes']) < int(d['comparators']['zip_deflate9']['bytes'])
              and int(x['archive_bytes']) < z
              and float(x['create_seconds']) < float(d['comparators']['zip_deflate9']['create_s'])
              and float(x['create_seconds']) < float(d['comparators']['tar_zstd19_solid']['create_s'])
          )
          assert d['decision']['strict_four_way_win'] is strict_expected
          assert d['decision']['terminal'] in ('PROMOTE_NEXT_PREREQUISITE','RETIRE_FAMILY')
          assert d['decision']['release_credit'] is False
          PY
      - name: Upload exact R4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-latent-patchpack-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-shifted-latent-patchpack.json
          if-no-files-found: error
          retention-days: 90

# R4 research only. The identical-frame control makes the size result causal, while its
# own compression time is explicitly excluded from candidate create time. If the shared
# context recovers the Zstd margin, runtime becomes the next prerequisite; if it does not,
# latent edit-program ownership is retired. Neither outcome is release credit.
