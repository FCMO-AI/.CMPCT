# ci-lane: deep
# ci-auto-policy: retired-manual-only
name: CMPCT v0.30 ZIP-factor parallel verification oracle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  parallel-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile exact A/B surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_zipfactor_compact_v3.py \
            benchmarks/v030_zipfactor_parallel_verify_oracle.py
      - name: Run repeated exact serial-vs-parallel verifier A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_zipfactor_parallel_verify_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-parallel-verify-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-parallel-verify.json" \
            --rounds 31
      - name: Independently enforce valid experiment and fail-closed promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-zf-parallel-verify.json').read_text())
          g=d['gate']
          assert d['schema']=='cmpct-v030-zipfactor-parallel-verify-oracle-v2'
          assert g['exact_manifest_and_logical_identities'] is True
          assert g['bounds_and_membership_valid'] is True
          assert g['experiment_valid'] is True
          assert d['verification_snapshot']['verified_user_files']==14
          assert d['verification_snapshot']['max_member_read_amplification']<=8.0
          assert d['verification_snapshot']['max_decode_unit_bytes']<=8*1024*1024
          assert g['release_credit'] is False
          assert g['promotion_signal'] is (g['parallel_strictly_faster'] and g['parallel_median_s'] < g['serial_median_s'])
          if not g['parallel_strictly_faster']:
              assert g['promotion_signal'] is False
              assert g['improvement_s'] <= 0.0
              assert g['improvement_pct'] <= 0.0
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/v030-zf-parallel-verify-candidate.txt
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-parallel-verify-oracle.yml
      - name: Upload exact A/B evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zf-parallel-verify-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-zf-parallel-verify.json
            benchmark-artifacts/v030-zf-parallel-verify-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Exact 62-sample evidence at the v0.30 integration frontier preserved manifest/logical identities and locality
# bounds but measured two-worker verification ~30.1% slower than serial (2.475 ms vs 1.902 ms median). This search
# family is terminal negative evidence for v0.30; keep it manually reproducible without automatic PR churn.
