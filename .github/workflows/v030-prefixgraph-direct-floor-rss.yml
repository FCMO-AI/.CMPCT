# ci-lane: deep
name: CMPCT v0.30 PrefixGraph direct-floor RSS ownership

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_prefixgraph_parallel.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_prefixgraph_direct_floor_rss_worker.py'
      - 'benchmarks/v030_prefixgraph_direct_floor_rss_oracle.py'
      - '.github/workflows/v030-prefixgraph-direct-floor-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-prefixgraph-direct-floor-rss-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  direct-floor-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen corpus dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact diagnostic and preserve PrefixGraph correctness
        run: |
          python -m py_compile benchmarks/v030_prefixgraph_direct_floor_rss_worker.py benchmarks/v030_prefixgraph_direct_floor_rss_oracle.py
          python -m pytest -q tests/test_v030_prefixgraph_parallel_release.py
      - name: Measure fresh-process direct floor versus complete shipping PrefixGraph
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_prefixgraph_direct_floor_rss_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-prefixgraph-direct-floor-rss-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-prefixgraph-direct-floor-rss.json"
      - name: Enforce exact diagnostic boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-prefixgraph-direct-floor-rss.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-prefixgraph-direct-floor-rss.json').read_text())
          assert d['schema']=='cmpct-v030-prefixgraph-direct-floor-rss-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='resemblance_hostile_v1/01_shifted_versions'
          assert d['rounds']==2 and len(d['repetitions'])==2
          assert d['experiment_valid'] is True and d['release_credit'] is False and d['selector_change'] is False
          c=d['contract']
          assert c['fresh_process_per_measurement'] is True
          assert c['same_source_tree'] is True
          assert c['rss_sample_captured_before_strong_verify'] is True
          assert c['strong_verify_after_measurement_is_mandatory'] is True
          assert c['verification_rss_excluded_from_build_peak'] is True
          assert c['direct_floor_uses_shipping_raws_and_direct_payload_floor'] is True
          assert c['direct_floor_uses_historical_all_direct_serializer'] is True
          assert c['full_uses_shipping_prefixgraph_builder'] is True
          for key in ('archive_bytes_changed_in_product','candidate_set_changed_in_product','selector_changed','grammar_changed','integrity_changed','locality_limit_changed','decode_unit_limit_changed','recovery_changed'):
              assert c[key] is False
          for rep in d['repetitions']:
              assert rep['direct-floor']['tree_sha256']==rep['full']['tree_sha256']==d['tree_sha256']
              for mode in ('direct-floor','full'):
                  assert rep[mode]['strong_verify_ok'] is True
                  assert rep[mode]['rss_measurement_boundary']=='build-before-strong-verify-v2'
                  assert rep[mode]['incremental_build_peak_rss_kib']==rep[mode]['incremental_peak_rss_kib']
                  assert rep[mode]['build_wall_s']==rep[mode]['wall_s']
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-prefixgraph-direct-floor-rss.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-prefixgraph-direct-floor-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-prefixgraph-direct-floor-rss.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only: the result locates the RSS owner. Verification remains mandatory but cannot contaminate the
# build high-water mark. No result can remove candidates, change bytes, alter the winner, or earn release credit.
