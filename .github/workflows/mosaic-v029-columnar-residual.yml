name: CMPCT v0.29 columnar residual ceiling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-columnar-residual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  columnar-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_columnar_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Measure reversible columnar recipe ceiling
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_columnar_residual_oracle.py \
            benchmark-artifacts/resemblance-hostile \
            benchmark-artifacts/attempt5-layout.cmpct \
            --json benchmark-artifacts/mosaic-v029-columnar-residual-oracle.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-columnar-residual-oracle.stdout.txt

      - name: Verify unchanged attempt-5 archive emitted by the oracle
        run: |
          python experiments/entropygraph_v029_residual_pack.py verify \
            benchmark-artifacts/attempt5-layout.cmpct \
            > benchmark-artifacts/mosaic-v029-columnar-residual-oracle.verify.json

      - name: Enforce oracle integrity without forcing a positive hypothesis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-columnar-residual-oracle.json').read_text())
          v=json.loads(Path('benchmark-artifacts/mosaic-v029-columnar-residual-oracle.verify.json').read_text())
          assert v.get('ok') is True, v
          assert r['all_roundtrips_exact'] is True, r
          assert r['max_selected_columnar_amp'] <= 2.0, r
          for row in r['groups']:
              assert row['roundtrip_exact'] is True, row
              if row['admissible']:
                  assert row['columnar_raw_bytes'] <= 256 * 1024, row
                  assert row['max_amp'] <= 2.0, row
          # Footnote: `research_gate_pass` is intentionally not asserted.  A correct REJECT is the
          # expected output if reversible column separation cannot buy >=128 KiB after transition charges.
          print(json.dumps(r, indent=2))
          PY

      - name: Focused columnar reversibility tests
        run: python -m pytest -q tests/test_v029_columnar_residual_oracle.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize columnar ceiling
        if: always()
        run: |
          if [ -f benchmark-artifacts/mosaic-v029-columnar-residual-oracle.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-columnar-residual-oracle.json').read_text())
          print('## CMPCT v0.29 — reversible columnar residual ceiling')
          print(f"- attempt-5 residual groups measured: **{r['baseline_eligible_groups']}**")
          print(f"- independently improved groups: **{r['columnar_improved_groups']}**")
          print(f"- net saving after transition charges: **{r['columnar_estimated_saving_bytes']:,} B**")
          print(f"- max selected materialization: **{r['max_selected_columnar_amp']:.4f}x**")
          print(f"- exact recipe round-trip: **{r['all_roundtrips_exact']}**")
          print(f"- frozen >=128 KiB / >=4-group gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          print('- The oracle emits the unchanged attempt-5 layout; a PASS only authorizes reader-design work, not a version claim.')
          PY
          fi

      - name: Upload columnar oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v029-columnar-residual-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-columnar-residual-oracle.json
            benchmark-artifacts/mosaic-v029-columnar-residual-oracle.stdout.txt
            benchmark-artifacts/mosaic-v029-columnar-residual-oracle.verify.json
          if-no-files-found: warn

# Footnote: this is a representation-ceiling oracle. It deliberately avoids running external competitors
# until the temporary reversible layout proves enough byte headroom to justify a reader-visible grammar.
