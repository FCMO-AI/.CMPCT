name: CMPCT v0.29 columnar residual ceiling (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-pointer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify preserved columnar residual rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/history/2026-08-17-mosaic-v029-columnar-residual-reject.json')
          r=json.loads(p.read_text())
          assert r['schema'] == 'cmpct-v029-columnar-residual-oracle-reject-v1'
          assert r['decision']['research_gate'] == 'REJECT'
          assert r['oracle']['columnar_improved_groups'] == 0
          assert r['oracle']['research_gate_pass'] is False
          assert r['baseline']['canonical_residual_physical_bytes'] == 30315
          print(json.dumps(r, indent=2))
          PY

# Footnote: the full reversible oracle produced 0/12 improved groups and proved the entire residual byte
# pool too small to close the structural gap. Automatic execution is retired; the original executable
# oracle remains in Git history and this workflow validates its durable evidence record on demand.
