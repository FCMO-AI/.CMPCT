# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 fused Analytics observation repair

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_dual_owner_streaming_observation_repair.py'
      - 'benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py'
      - '.github/workflows/v030-r4-dual-owner-streaming-observation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_dual_owner_streaming_observation_repair.py'
      - 'benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py'
      - '.github/workflows/v030-r4-dual-owner-streaming-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-stream-observation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_dual_owner_streaming_observation_repair(_v2)?\.py|\.github/workflows/v030-r4-dual-owner-streaming-observation\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  streaming-observation:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile benchmark
        run: |
          python -m py_compile benchmarks/v030_r4_dual_owner_streaming_observation_repair.py
          python -m py_compile benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py
      - name: Prepare frozen Analytics source outside measured workers
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py --prepare-only --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-stream-v2-work" | tee /tmp/prep.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.loads(open('/tmp/prep.json').read().strip().splitlines()[-1])
          print('source='+d['source']); print('tree='+d['tree_sha256'])
          PY
      - name: Run baseline, repaired candidate and isolated owner-equivalence control
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-stream-v2-work"; mkdir -p "$ROOT/workers"
          python benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py --worker baseline --source "${{ steps.prep.outputs.source }}" --archive "$ROOT/baseline-bundle" --worker-work "$ROOT/baseline-work" --worker-result "$ROOT/workers/baseline.json"
          python benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py --worker repaired --source "${{ steps.prep.outputs.source }}" --archive "$ROOT/repaired-bundle" --worker-work "$ROOT/repaired-work" --worker-result "$ROOT/workers/repaired.json"
          python benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py --reference-owner --source "${{ steps.prep.outputs.source }}" --worker-result "$ROOT/workers/reference.json"
      - name: Aggregate unchanged preregistered gate
        run: |
          python benchmarks/v030_r4_dual_owner_streaming_observation_repair_v2.py --aggregate --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-stream-v2-work" --expected-tree "${{ steps.prep.outputs.tree }}" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-stream-v2.json"
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-stream-v2.json'))
          assert d['schema']=='cmpct-v030-r4-dual-owner-streaming-observation-repair-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract'];assert c['diagnostic_only'] and not c['release_credit'] and c['unchanged_peak_target_kib']==324435 and c['no_threshold_sweep'] and c['reference_owner_isolated_from_measured_candidate_process']
          print(json.dumps({'comparison':d['comparison'],'hypothesis':d['hypothesis'],'baseline_peak':d['baseline']['peak_rss_kib'],'repaired_peak':d['repaired']['peak_rss_kib'],'baseline_bytes':d['baseline']['stored_bytes'],'repaired_bytes':d['repaired']['stored_bytes'],'owner_sha256':d['repaired']['owner_sha256']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-dual-owner-streaming-observation.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-stream-observation-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-stream-v2.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity only. The unchanged 20% RSS gate remains scientific authority.
