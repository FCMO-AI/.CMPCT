# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT1 ONE-G0.2 auth-tree SHA prefix-state clone A/B
on:
  pull_request:
    paths:
      - "experiments/one/auth_tree.py"
      - "benchmarks/one/native/one_g02_auth_tree_prefix_state_clone.c"
      - "tests/one/test_auth_tree.py"
      - "docs/one/prereg/ONE_G02_AUTH_TREE_PREFIX_STATE_CLONE_PREREG_2026-09-07.md"
      - ".github/workflows/cmpct1-one-g02-auth-tree-prefix-state-clone.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-auth-tree-prefix-state-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changed.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
          clean: true
      - name: Bind exact ONE head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Classify latest commit only
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-paths.txt
          cat /tmp/latest-head-paths.txt
          if grep -Eq '^(experiments/one/auth_tree\.py|benchmarks/one/native/one_g02_auth_tree_prefix_state_clone\.c|tests/one/test_auth_tree\.py|docs/one/prereg/ONE_G02_AUTH_TREE_PREFIX_STATE_CLONE_PREREG_2026-09-07\.md|\.github/workflows/cmpct1-one-g02-auth-tree-prefix-state-clone\.yml)$' /tmp/latest-head-paths.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
  prefix-state-ab:
    needs: classify
    if: needs.classify.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact ONE head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install semantic test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Compile native prefix-state A/B
        run: |
          mkdir -p one-auth-prefix-state-artifacts
          cc -O3 -std=c11 -Wall -Wextra -Wno-deprecated-declarations \
            benchmarks/one/native/one_g02_auth_tree_prefix_state_clone.c \
            -lcrypto -o /tmp/one-g02-auth-prefix-state
      - name: Run frozen A/B and preserve scientific reds
        shell: bash
        run: |
          set +e
          /tmp/one-g02-auth-prefix-state | tee one-auth-prefix-state-artifacts/one-g02-auth-tree-prefix-state-clone.json
          code=${PIPESTATUS[0]}
          echo "$code" > one-auth-prefix-state-artifacts/scientific-exit-code.txt
          printf '%s\n' "$EVIDENCE_HEAD" > one-auth-prefix-state-artifacts/source-head.txt
          exit 0
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-auth-tree-prefix-state-${{ env.EVIDENCE_HEAD }}
          path: one-auth-prefix-state-artifacts/
          if-no-files-found: error
      - name: Enforce preregistered scientific decision
        if: always()
        run: test "$(cat one-auth-prefix-state-artifacts/scientific-exit-code.txt)" = "0"
