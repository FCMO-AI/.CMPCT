# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 NPZ mode2 owner inversion

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_npz_mode2_owner_inversion.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'src/cmpct/codec.py'
      - '.github/workflows/v030-r4-npz-mode2-owner-inversion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-npz-mode2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mode2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile mode2 falsifier
        run: python -m py_compile benchmarks/v030_r4_npz_mode2_owner_inversion.py
      - name: Run existing-mode2 owner inversion falsifier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_npz_mode2_owner_inversion.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-mode2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-mode2.json"
      - name: Enforce receipt integrity only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-mode2.json').read_text())
          assert d['schema']=='cmpct-v030-r4-npz-mode2-owner-inversion-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit']
          assert c['existing_v24_mode2_semantics_only'] and c['same_semantic_tree_verified']
          assert c['no_locality_claim_for_reconstructed_npz'] and c['no_threshold_sweep']
          print(json.dumps({'baseline_v030_bytes':d['baseline_v030_bytes'],'candidate_bytes':d['candidate_bytes'],'accepted_v029_bytes':d['accepted_v029_bytes'],'saving_vs_v030_bytes':d['saving_vs_v030_bytes'],'margin_vs_v029_bytes':d['margin_vs_v029_bytes'],'hypothesis':d['hypothesis'],'components':d['candidate']['bundle']['component_bytes'],'mode2_level':d['candidate']['mode2_level']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-npz-mode2-owner-inversion-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-mode2.json
          if-no-files-found: error
          retention-days: 90

# Green means receipt integrity only. Product/native/portability/locality promotion remains separate.
