# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 PrefixGraph worker-count RSS frontier

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/entropygraph_v030_prefixgraph*.py'
      - 'benchmarks/v030_prefixgraph_worker_count_rss_*.py'
      - '.github/workflows/v030-prefixgraph-worker-count-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-prefixgraph-worker-count-rss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_prefixgraph[^/]*\.py|benchmarks/v030_prefixgraph_worker_count_rss_[^/]*\.py|\.github/workflows/v030-prefixgraph-worker-count-rss\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect the PrefixGraph worker-count RSS frontier; skipping replay.'
          fi

  worker-count-rss:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic Shifted dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile and bind exact evidence head
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile \
            benchmarks/v030_prefixgraph_worker_count_rss_worker.py \
            benchmarks/v030_prefixgraph_worker_count_rss_oracle.py \
            experiments/entropygraph_v030_prefixgraph.py \
            experiments/entropygraph_v030_prefixgraph_parallel.py
      - name: Measure 1/2/3/4-worker exact-byte frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_prefixgraph_worker_count_rss_oracle.py \
            --work-root benchmark-artifacts/v030-prefixgraph-worker-count-rss-work \
            --output benchmark-artifacts/v030-prefixgraph-worker-count-rss.json
      - name: Enforce diagnostic boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('benchmark-artifacts/v030-prefixgraph-worker-count-rss.json')
          assert path.is_file(), 'PrefixGraph worker-count RSS oracle did not publish evidence'
          data=json.loads(path.read_text())
          assert data['schema']=='cmpct-v030-prefixgraph-worker-count-rss-v1'
          assert data['source_commit']==os.environ['EVIDENCE_HEAD']
          assert data['experiment_valid'] is True
          assert data['exact_archive_identity_all_arms'] is True
          assert data['promotion_signal'] is False
          assert data['release_credit'] is False
          assert set(data['summary'])=={'1','2','3','4'}
          contract=data['contract']
          assert contract['fresh_process_per_measurement'] is True
          assert contract['strong_verification_preserved'] is True
          assert contract['production_worker_policy_changed'] is False
          for key in ('candidate_set_changed','serializer_changed','tie_law_changed','threshold_changed'):
              assert contract[key] is False
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-prefixgraph-worker-count-rss.yml
      - name: Upload exact-head worker-count evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-prefixgraph-worker-count-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-prefixgraph-worker-count-rss.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only: exact-byte worker-count evidence cannot change production scheduling
# without normal all-15, v0.29, runtime/RSS, locality/recovery and platform authorities.
