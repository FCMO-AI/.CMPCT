# ci-lane: deep
# exact-source result-bearing falsifier; summary is emitted even on a preregistered negative
name: ONE-G0.2 plan-carried current-root hash

on:
  push:
    branches: [ research/cmpct1 ]
    paths:
      - 'benchmarks/one/one_g02_plan_carried_current_root_hash.py'
      - 'benchmarks/one/native/one_g02_plan_carried_current_root_hash.c'
      - 'benchmarks/one/one_g02_native_segment_plan_fusion_kernel.c'
      - 'docs/one/prereg/ONE_G02_PLAN_CARRIED_CURRENT_ROOT_HASH_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-plan-carried-current-root-hash.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-g02-plan-carried-root-${{ github.sha }}
  cancel-in-progress: true

jobs:
  plan-carried-current-root-hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact evidence source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Build kernel strictly
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            benchmarks/one/one_g02_native_segment_plan_fusion_kernel.c \
            benchmarks/one/native/one_g02_plan_carried_current_root_hash.c \
            -lcrypto -o /tmp/one-g02-plan-root-hash-strict.so
      - name: Frozen plan-carried current-root hash falsifier
        id: falsifier
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_plan_carried_current_root_hash | tee one-g02-plan-carried-current-root-hash.json
      - name: Publish exact aggregate result
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('one-g02-plan-carried-current-root-hash.json')
          print('## ONE-G0.2 plan-carried current-root hash')
          if not p.exists():
              print('No JSON result was produced.')
              raise SystemExit(0)
          d = json.loads(p.read_text())
          for k in (
              'source_sha', 'decision', 'semantic_gates_pass', 'native_plan_oracle_pass',
              'mature_productive_median_ratio', 'mature_productive_worst_ratio',
              'fragmented_mature_median_ratio', 'control_mature_median_ratio'):
              print(f'- **{k}:** `{d.get(k)}`')
          print('\n### Mature rows')
          print('| size | case | segments | ratio |')
          print('|---:|---|---:|---:|')
          for r in d.get('rows', []):
              if r.get('relation_bytes', 0) >= 16384:
                  print(f"| {r['relation_bytes']} | {r['case']} | {r['segments']} | {r['candidate_over_baseline']:.6f}x |")
          PY
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-plan-carried-current-root-hash-${{ github.sha }}
          path: one-g02-plan-carried-current-root-hash.json
          if-no-files-found: warn
      - name: Enforce preregistered decision
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('one-g02-plan-carried-current-root-hash.json')
          if not p.exists():
              raise SystemExit('benchmark did not produce result JSON')
          d = json.loads(p.read_text())
          raise SystemExit(0 if d.get('decision') == 'advance_plan_carried_current_root_hash_to_writer' else 1)
          PY
