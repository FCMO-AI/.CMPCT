# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 dictionary skip admission oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_dictionary_skip_admission_oracle.py'
      - 'benchmarks/v030_r24_dictionary_training_cost_oracle.py'
      - 'tests/test_v030_r24_dictionary_skip_admission.py'
      - 'src/cmpct/builder.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_product_base.py'
      - '.github/workflows/v030-r24-dictionary-skip-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-dictionary-skip-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r24_dictionary_(skip_admission_oracle|training_cost_oracle)\.py|tests/test_v030_r24_dictionary_skip_admission\.py|src/cmpct/builder\.py|experiments/entropygraph_v030_release_product(_base)?\.py|\.github/workflows/v030-r24-dictionary-skip-admission\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect dictionary-skip admission.'
          fi

  dictionary-skip-admission:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile admission evidence
        run: |
          python -m py_compile benchmarks/v030_r24_dictionary_skip_admission_oracle.py
          python -m py_compile benchmarks/v030_r24_dictionary_training_cost_oracle.py
      - name: Prove release training-view ownership
        run: python -m pytest -q tests/test_v030_r24_dictionary_skip_admission.py
      - name: Search frozen-suite generic admission envelopes
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_dictionary_skip_admission_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-admission-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-dictionary-skip-admission.json"
      - name: Enforce fail-closed research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-dictionary-skip-admission.json').read_text())
          assert d['schema']=='cmpct-v030-r24-dictionary-skip-admission-v2'
          c=d['contract']
          assert c['workloads']==15
          assert c['production_change'] is False
          assert c['release_credit'] is False
          assert c['feature_owner']=='shipping cmpct.builder.TEXT_EXT under active v0.30 r24 policy'
          assert c['release_medium_binary_policy_active_during_feature_capture'] is True
          assert c['zero_nonexact_admissions_required'] is True
          assert c['positive_saved_time_required_for_every_admission'] is True
          assert c['material_exact_row_required'] is True
          assert c['future_promotion_requires_adversarial_generalization'] is True
          assert set(c['forbidden_policy_inputs'])=={'workload_name','benchmark_name','path','filename','content_hash','archive_hash'}
          assert d['summary']['exact_workload_count'] is True
          rows=d['rows']
          assert len(rows)==15
          by_feature={k for r in rows for k in r['pretraining_features']}
          assert by_feature==set(c['policy_inputs'])
          for solution in d['solutions']:
              assert solution['admitted_rows']>=1
              assert solution['material_rows']>=1
              assert solution['minimum_saved_s']>=0.005
              for rule in solution['rules']:
                  assert rule['feature'] in c['policy_inputs']
                  assert rule['feature'] not in c['forbidden_policy_inputs']
                  assert rule['op'] in {'>=','<='}
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/v030-r24-dictionary-skip-admission-candidate.txt
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-dictionary-skip-admission.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-dictionary-skip-admission-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-r24-dictionary-skip-admission.json
            benchmark-artifacts/v030-r24-dictionary-skip-admission-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Research-only. Frozen-suite envelopes remain subordinate to the independent positive-unseen/adversarial proof and
# ordinary product/release authority. Exact-head scoping prevents long-lived PR history from replaying this lane.
