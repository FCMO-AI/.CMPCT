name: CMPCT v0.30 Logs prefilter reuse ABBA

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - benchmarks/v030_logs_prefilter_reuse_abba.py
      - experiments/entropygraph_v030_release_product.py
      - experiments/entropygraph_v030_release_product_logs_candidate.py
      - benchmarks/v030_external_competitors.py
      - benchmarks/v030_release_generalization.py
      - .github/workflows/v030-logs-prefilter-reuse-abba.yml

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-prefilter-reuse-abba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logs-prefilter-reuse-abba:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Record exact fingerprint
        run: |
          mkdir -p benchmark-artifacts
          printf '%s\n' '${{ github.sha }}' > benchmark-artifacts/v030-logs-prefilter-reuse-fingerprint.txt
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
      - name: Run exact full-build ABBA
        run: |
          python benchmarks/v030_logs_prefilter_reuse_abba.py \
            --output benchmark-artifacts/v030-logs-prefilter-reuse.json
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-logs-prefilter-reuse-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-logs-prefilter-reuse.json
            benchmark-artifacts/v030-logs-prefilter-reuse-fingerprint.txt
          if-no-files-found: warn
