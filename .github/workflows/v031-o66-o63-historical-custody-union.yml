# ci-lane: fast
# O66: exact O59 historical parent source reused against O63 product (O60 x rollback), with strict JUnit and five hosted custody paths.
name: CMPCT v0.31 O66 O59 custody x O63 rollback composition

on:
  push:
    branches:
      - 'agent/phased3-v031-o63-o59-exact-parent-custody-o66-20261025'
  pull_request:
    paths:
      - 'tests/test_v031_builder_parent_parity_o50.py'
      - 'tests/fixtures/o50_o47_parent_builder.py'
      - '.github/workflows/v031-o66-o63-historical-custody-union.yml'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/codec.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o66-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-installed-o63-historical-custody:
    name: O66 installed ${{ matrix.os }} checkout-depth=${{ matrix.depth }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, depth: 1, custody: frozen-exact-blob, skips: 0 }
          - { os: ubuntu-24.04, depth: 0, custody: git-parent, skips: 0 }
          - { os: macos-14, depth: 1, custody: frozen-exact-blob, skips: 0 }
          - { os: windows-2025, depth: 1, custody: frozen-exact-blob, skips: 1 }
          - { os: windows-2025, depth: 0, custody: git-parent, skips: 1 }
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout actual source at selected depth
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: ${{ matrix.depth }}
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Execute original O59 parent, O60 mutations, and O63 rollback on the same installed product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object src/cmpct/builder.py)" = "382e60983bf1e8e7595ea7112f3a5553dc33dcc0"
          test "$(git hash-object src/cmpct/codec.py)" = "dc3446b0eed82edfba9380e3885a20aa45577899"
          test "$(git hash-object tests/fixtures/o50_o47_parent_builder.py)" = "6f60dfe63742ff4b777f959a15d6fb828ae29610"
          test "$(git hash-object tests/test_v031_builder_parent_parity_o50.py)" = "20faf26980693342439c7730f62bd0bab8daca0f"
          test "$(git hash-object tests/test_v031_one_buffer_vzip_product_o60.py)" = "95740053ac9a3dd3335c10b63362eb0484722382"
          test "$(git hash-object tests/test_v031_o63_vzip_rollback_union.py)" = "519c35ca60f952dea55b5160bba95dcc81f7c660"
          if [ "${{ matrix.depth }}" = "0" ]; then
            git cat-file -e '29d9688ae6bff6d1eccc27f019893866abe5b5c3^{commit}'
          else
            if git cat-file -e '29d9688ae6bff6d1eccc27f019893866abe5b5c3^{commit}' 2>/dev/null; then
              echo "Unexpected historical parent in shallow checkout" >&2
              exit 1
            fi
          fi
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import cmpct.builder,cmpct.codec,cmpct.reader
          import subprocess
          root=Path(subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip())
          for module in (cmpct.builder,cmpct.codec,cmpct.reader):
              p=Path(module.__file__).resolve()
              assert not p.is_relative_to(root), ('must be installed package',p)
              print('O66_INSTALLED',p)
          PY
          mkdir -p o66-isolated
          cp tests/test_v031_builder_parent_parity_o50.py o66-isolated/test_parent.py
          cp tests/test_v031_one_buffer_vzip_product_o60.py o66-isolated/test_vzip.py
          cp tests/test_v031_o63_vzip_rollback_union.py o66-isolated/test_rollback.py
          python -m pytest -vv -s o66-isolated/test_parent.py --junitxml=o66-parent.xml 2>&1 | tee o66-parent.log
          grep -q "O50_PARENT_SOURCE_CUSTODY ${{ matrix.custody }} 6f60dfe63742ff4b777f959a15d6fb828ae29610" o66-parent.log
          python -m pytest -vv -s o66-isolated/test_vzip.py --junitxml=o66-vzip.xml 2>&1 | tee o66-vzip.log
          python -m pytest -vv -s o66-isolated/test_rollback.py --junitxml=o66-rollback.xml 2>&1 | tee o66-rollback.log
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          for file,tests,skipped in [('o66-parent.xml',3,1 if os.name=='nt' else 0),('o66-vzip.xml',12,0),('o66-rollback.xml',7,0)]:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag=='testsuite' else root.findall('./testsuite')
              got={k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
              print('O66_JUNIT',file,got)
              assert got=={'tests':tests,'failures':0,'errors':0,'skipped':skipped},got
          PY
          echo "O66_THREE_COURT_CUSTODY_PASS"
      - name: Preserve raw logs and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o66-${{ matrix.os }}-depth-${{ matrix.depth }}
          path: |
            o66-parent.log
            o66-parent.xml
            o66-vzip.log
            o66-vzip.xml
            o66-rollback.log
            o66-rollback.xml
          if-no-files-found: warn
          retention-days: 30
