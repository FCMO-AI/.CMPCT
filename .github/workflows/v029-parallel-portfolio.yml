# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.29 byte-identical parallel portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v029_parallel_portfolio.py'
      - 'experiments/entropygraph_v029_residual_program_packing.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'tests/test_v029_parallel_portfolio.py'
      - 'native/preflate-bridge/**'
      - '.github/workflows/v029-parallel-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-parallel-portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - id: scope
        name: Classify only the newest exact HEAD commit
        shell: bash
        run: |
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              experiments/entropygraph_v029_parallel_portfolio.py|\
              experiments/entropygraph_v029_residual_program_packing.py|\
              benchmarks/resemblance_hostile_corpus_v1.py|\
              tests/test_v029_parallel_portfolio.py|\
              native/preflate-bridge/*|\
              .github/workflows/v029-parallel-portfolio.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "latest exact-head substrate change: $relevant"

  parallel-portfolio-oracle:
    needs: latest-head-scope
    if: github.event_name == 'workflow_dispatch' || needs.latest-head-scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_parallel_portfolio_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Focused scheduler identity test
        run: python -m pytest -q tests/test_v029_parallel_portfolio.py

      - name: Measure balanced sequential versus parallel portfolio
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_parallel_portfolio.py \
            benchmark-artifacts/resemblance-hostile \
            --work-root benchmark-artifacts/CMPCT_V029_Parallel_Portfolio \
            --output benchmark-artifacts/mosaic-v029-parallel-portfolio.json \
            --repetitions 4 \
            2>&1 | tee benchmark-artifacts/mosaic-v029-parallel-portfolio.stdout.txt

      - name: Enforce accepted-engine identity, byte identity, frozen speed gate, and repeatability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-parallel-portfolio.json').read_text())
          assert r['schema'] == 'cmpct-v029-parallel-portfolio-oracle-v3'
          assert r['accepted_engine'] == 'attempt5-residual-program-packing'
          p=r['policy']
          assert p['scheduling_only'] is True
          assert p['spawned_workers'] == 2
          assert p['parallel_scope'] == 'multi-file-only'
          assert p['single_file_policy'] == 'preserve-accepted-fast-reject-sequentially'
          assert p['exact_archive_identity_required'] is True
          assert p['minimum_wallclock_improvement_pct'] == 20.0
          assert p['minimum_absolute_improvement_s'] == 5.0
          assert p['repetitions'] == 4
          assert p['paired_order'] == ['sequential-first', 'parallel-first', 'parallel-first', 'sequential-first']
          assert p['every_pair_must_pass'] is True
          assert p['median_must_pass'] is True
          assert len(r['rows']) == 4
          assert [row['execution_order'] for row in r['rows']] == p['paired_order']
          assert all(row['accepted_engine'] == r['accepted_engine'] for row in r['rows'])
          assert all(row['scheduler_mode'] == 'parallel-independent-portfolio' for row in r['rows'])
          assert all(row['byte_identical'] for row in r['rows'])
          assert all(row['selected'] == 'mosaic' for row in r['rows'])
          assert all(row['archive_bytes'] < row['v028_bytes'] for row in r['rows'])
          assert all(row['pair_gate_pass'] for row in r['rows'])
          assert r['median_gate_pass'] is True
          assert r['research_gate_pass'] is True
          print(json.dumps(r, indent=2))
          PY

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v029-parallel-portfolio.yml

      - name: Summarize scheduler result
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-parallel-portfolio.json').read_text())
          first=r['rows'][0]
          print('## CMPCT v0.29 — accepted attempt-5 byte-identical parallel portfolio')
          print(f"- engine: **{r['accepted_engine']}**")
          print(f"- selected aggregate: **{first['archive_bytes']:,} B** vs v0.28 **{first['v028_bytes']:,} B**")
          print(f"- balanced order: **{' / '.join(row['execution_order'] for row in r['rows'])}**")
          print(f"- repetitions: **{len(r['rows'])}**")
          print(f"- sequential median: **{r['sequential_median_s']:.2f} s**")
          print(f"- parallel median: **{r['parallel_median_s']:.2f} s**")
          print(f"- median wall-clock saved: **{r['wallclock_saved_s']:.2f} s ({r['wallclock_improvement_pct']:.2f}%)**")
          print(f"- archive identity: **{'PASS' if all(row['byte_identical'] for row in r['rows']) else 'FAIL'}**")
          print(f"- every pair >=20% and >=5 s: **{'PASS' if all(row['pair_gate_pass'] for row in r['rows']) else 'FAIL'}**")
          print(f"- median frozen gate: **{'PASS' if r['median_gate_pass'] else 'REJECT'}**")
          print(f"- research gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          PY

      - name: Upload scheduler evidence
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v029-parallel-portfolio-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-parallel-portfolio.json
            benchmark-artifacts/mosaic-v029-parallel-portfolio.stdout.txt
          if-no-files-found: warn
          retention-days: 30

# Footnote: this scheduling oracle remains mandatory when its scheduler/accepted-engine substrate changes because
# v0.30 inherits the same zero-copy publication primitive. PR path filters are cumulative across this long-lived
# integration diff, so the lightweight exact-HEAD classifier above decides whether the expensive evidence job runs.
