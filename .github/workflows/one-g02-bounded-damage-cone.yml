name: ONE-G0.2 bounded damaged relation cone

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_bounded_damage_cone.py'
      - 'benchmarks/one/one_g02_damaged_relation_law_expression.py'
      - 'benchmarks/one/one_g02_temporal_adjacency_writer_integration.py'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py'
      - 'experiments/one/ir.py'
      - 'experiments/one/vm.py'
      - 'experiments/one/wire.py'
      - 'docs/one/evidence/ONE_G02_BOUNDED_DAMAGE_CONE_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-bounded-damage-cone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-damage-cone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen bounded damaged-relation cone
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_bounded_damage_cone | tee one-g02-bounded-damage-cone.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-bounded-damage-cone-${{ github.sha }}
          path: one-g02-bounded-damage-cone.json
          if-no-files-found: error
