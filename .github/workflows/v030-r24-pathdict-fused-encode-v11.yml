name: CMPCT v0.30 pathdict reusable CCtx v11
on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths: ['benchmarks/v030_r24_pathdict_fused_encode_referee_v11.py','benchmarks/v030_r24_pathdict_fused_encode_referee_v10.py','benchmarks/v030_r24_pathdict_fused_encode_referee.py','src/cmpct/**','.github/workflows/v030-r24-pathdict-fused-encode-v11.yml']
permissions: {contents: read}
jobs:
  referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1 && python -m pip install -e '.[audio,test]'
      - run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_pathdict_fused_encode_referee_v11 --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v11.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v030-pathdict-v11-${{ github.sha }}, path: benchmark-artifacts/v11.json, if-no-files-found: error, retention-days: 90}
