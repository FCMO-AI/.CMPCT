# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 anchor bulk-prefetch referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_anchor_bulk_prefetch_referee.py'
      - '.github/workflows/v030-r4-anchor-bulk-prefetch.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-anchor-bulk-prefetch-${{ github.sha }}
  cancel-in-progress: false
jobs:
  anchor-bulk-prefetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install zstandard
      - run: python -m py_compile benchmarks/v030_r4_anchor_bulk_prefetch_referee.py
      - name: Run anchor-range prerequisite
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_anchor_bulk_prefetch_referee.py --output benchmark-artifacts/v030-r4-anchor-bulk-prefetch.json
      - name: Assert receipt integrity, not verdict
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-anchor-bulk-prefetch.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['no_new_persisted_metadata']
          assert d['contract']['coldreader_unchanged']
          print(json.dumps({'input':d['input'],'failures':d['failures'],'summary':d['summary'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - name: Persist scientific receipt on integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/receipt.md
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-anchor-bulk-prefetch.json'));s=d['summary']
          print('### v0.30 anchor-derived bulk payload ranges — exact-head receipt')
          print()
          print(f"- head: `{os.environ['EVIDENCE_HEAD']}`")
          print(f"- hypothesis: **{'SUPPORTED' if d['hypothesis']['existing_anchors_predict_covering_bulk_payload_ranges'] else 'FALSE'}**")
          print(f"- raw/compressed/pages: `{d['input']['raw_bytes']}` / `{d['input']['compressed_bytes']}` / `{d['input']['pages']}`; failures `{d['failures']}`")
          print(f"- one predicted range/page; max/mean overfetch `{s['max_overfetch_bytes']}` / `{s['mean_overfetch_bytes']:.2f} B`; max predicted range `{s['max_predicted_bytes']} B`")
          print('- uses existing anchors/Huffman block state only; no new persisted metadata. Office 22 B slack is intentionally not assumed here.')
          PY
          gh pr comment 56 --repo FCMO-AI/.CMPCT --body-file /tmp/receipt.md
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-anchor-bulk-prefetch.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-anchor-bulk-prefetch-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-anchor-bulk-prefetch.json
          if-no-files-found: error
          retention-days: 90
# Green means receipt integrity; JSON owns scientific verdict.
