# ci-lane: fast
name: CMPCT v0.31 strong extraction policy economics O21

on:
  pull_request:
    paths:
      - 'docs/v031-research/2026-10-24-strong-extraction-economics-o21-prereg.md'
      - 'docs/v031-research/2026-10-24-strong-extraction-economics-o21-result.md'
      - 'benchmarks/v031_strong_extraction_economics_o21.py'
      - '.github/workflows/v031-strong-extraction-economics-o21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-strong-extract-o21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  strong-extraction-policy-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bind immutable product and fixed physical fixture owners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 2cf7c3915cd618b9a72a5dc26bdd15a25cb75230 HEAD
          test "$(git hash-object src/cmpct/reader.py)" = 60f52328467ca509bb410abe6a34810c50917cb5
          test "$(git hash-object benchmarks/v031_pack_physical_sha_court.py)" = 2383bf9a8f7ce8a9a01028ccf1072169897df3f1
          mkdir -p benchmark-artifacts
          printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/source-head.txt
          git hash-object src/cmpct/reader.py benchmarks/v031_pack_physical_sha_court.py benchmarks/v031_strong_extraction_economics_o21.py > benchmark-artifacts/source-blobs.txt
          python -m py_compile benchmarks/v031_strong_extraction_economics_o21.py
      - name: Install CMPCT product package unchanged
        run: python -m pip install -e '.[test]'
      - name: Execute strong extraction economy court
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_pack_physical_sha_court.py --expected-pack reject > benchmark-artifacts/inherited-physical-verify-control.json
          python benchmarks/v031_strong_extraction_economics_o21.py --out benchmark-artifacts/o21-observations.json > benchmark-artifacts/o21-summary-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-artifacts/o21-observations.json")
          r = json.loads(p.read_text())
          assert r["status"] == "PASS" and r["classification"] == "SCOPED_INSTALLED_PRODUCT_RUNTIME_DIAGNOSTIC"
          assert set(r["corpora"]) == {"structured_pack", "independent_direct_raw"}
          assert r["controls"]["samples_per_arm_per_corpus"] == 10
          for name, c in r["corpora"].items():
              assert c["archive"]["regular_entries"] == (256 if name == "structured_pack" else 1)
              assert c["archive"]["physical_owners"] == 1
              assert len(c["balanced_blocks"]) == 5
              assert len(c["raw_samples"]["extract"]) == 10
              assert len(c["raw_samples"]["verify_extract"]) == 10
              assert all(x["source_matches_sha256_manifest"] for arm in c["raw_samples"].values() for x in arm)
              print(name, "policy B/A wall ratio", c["ratio_verified_to_ordinary_wall"],
                    "CPU", c["ratio_verified_to_ordinary_cpu"],
                    "RSS", c["median_peak_rss_kib"])
          PY
      - name: Preserve raw exact-head diagnostic, including reds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-strong-extract-o21-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
