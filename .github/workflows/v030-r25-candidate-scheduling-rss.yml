# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 candidate scheduling RSS A/B

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss.yml'
  workflow_dispatch:

permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs: {should_run: '${{ steps.scope.outputs.should_run }}'}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_candidate_scheduling_rss_.*\.py$|docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_PREREG\.md$|\.github/workflows/v030-r25-candidate-scheduling-rss\.yml$)' /tmp/files; then echo "should_run=true" >> "$GITHUB_OUTPUT"; else echo "should_run=false" >> "$GITHUB_OUTPUT"; fi

  candidate-scheduling-rss:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install deterministic corpus dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen A/B
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile benchmarks/v030_r25_candidate_scheduling_rss_worker.py benchmarks/v030_r25_candidate_scheduling_rss_oracle.py
      - name: Run candidate scheduling RSS A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_candidate_scheduling_rss_oracle.py --work-root benchmark-artifacts/v030-r25-candidate-scheduling-rss-work --output benchmark-artifacts/v030-r25-candidate-scheduling-rss.json
      - name: Ratchet frozen identity and claim boundary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r25-candidate-scheduling-rss.json'); assert p.is_file()
          d=json.loads(p.read_text()); assert d['schema']=='cmpct-v030-r25-candidate-scheduling-rss-v1'; assert d['source_commit']==os.environ['EVIDENCE_HEAD']; assert d['release_credit'] is False
          c=d['contract']; assert c['exact_product_identity_required'] and c['fresh_process_per_measurement'] and c['total_peak_rss_is_causal_metric'] and c['baseline_subtracted_ru_maxrss_is_diagnostic_only']
          for k in ('production_source_changed','selector_changed','admission_changed','grammar_changed','integrity_changed','locality_changed','recovery_changed'): assert c[k] is False
          if not d['experiment_valid']: assert d['worker_failures']; raise SystemExit('invalid candidate scheduling evidence')
          for r in d['repetitions']:
              a,b=r['concurrent'],r['serialized']; assert a['archive_bytes']==b['archive_bytes']; assert a['archive_sha256']==b['archive_sha256']; assert a['tree_sha256']==b['tree_sha256']; assert a['selected']==b['selected']=='prefixgraph'; assert b['inline_executor_submissions']==2
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-candidate-scheduling-rss.yml
      - name: Upload exact A/B evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-candidate-scheduling-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-candidate-scheduling-rss.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic-only scheduling causality. Production concurrency is unchanged until this exact A/B earns a decision.
