# ci-lane: fast
# O93: descriptor-bound source/output custody, not an atomic release or snapshot.
name: CMPCT v0.31 O93 Builder descriptor-bound publication
on:
  push:
    branches:
      - 'agent/phased2-v031-o93-descriptor-bound-builder-output-20261025'
  pull_request:
    paths:
      - 'src/cmpct/builder.py'
      - 'tests/test_v031_o90_builder_output_kind.py'
      - 'tests/test_v031_o90_o84_archive_parity.py'
      - 'tests/test_v031_o93_builder_output_bound.py'
      - '.github/workflows/v031-o93-builder-output-bound.yml'
      - 'docs/v031-research/2026-10-25-o93-descriptor-output-prereg.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o93-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-archive-court:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Authenticate source and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 7efcc51154b64fd6394ddffaab599760659f6c91 HEAD
          git merge-base --is-ancestor c62a27d89c2618691dd0354c55558032ce1cccc1 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "7214a46b781bb10051e6782ba7731989ebf05edb"
          test "$(git hash-object tests/test_v031_o81_builder_output_source_alias.py)" = "f23cd936ace4019e654f5042f3cb476e3682f2a2"
          git diff --exit-code 7efcc51154b64fd6394ddffaab599760659f6c91 HEAD -- src/cmpct/reader.py src/cmpct/codec.py src/cmpct/transactions.py src/cmpct/ntfs_streams.py native/ benchmarks/ tools/check_performance_regression.py
          mkdir -p o93-evidence o93-isolated
          git rev-parse HEAD > o93-evidence/head.sha
          git hash-object src/cmpct/builder.py > o93-evidence/product.blob
          git hash-object tests/test_v031_o93_builder_output_bound.py > o93-evidence/instrument.blob
          python -m pip install --disable-pip-version-check . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder,cmpct.reader
          root=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip()).resolve()
          for mod in (cmpct.builder,cmpct.reader):
              path=Path(mod.__file__).resolve()
              assert not path.is_relative_to(root),("uninstalled-source import",path)
              print("O93_INSTALLED_MODULE="+str(path),flush=True)
          PY
      - name: Run original owner controls and O90 tests
        shell: bash
        run: |
          set -euo pipefail
          for name in             test_v031_win32_builder_hardlink_o47.py             test_v031_special_entries_o48.py             test_v031_builder_composition_o50.py             test_v031_builder_parent_parity_o50.py             test_v031_win32_ads_refusal_o57.py             test_v031_ntfs_empty_dir_guard_o61d2.py             test_v031_ntfs_directory_admission_o64.py             test_v031_o65_xattr_capture.py             test_v031_hardlinked_symlink_o67.py             test_v031_o80_builder_fidelity_composition.py             test_v031_o81_builder_output_source_alias.py             test_v031_o84_builder_output_fidelity_interaction.py             test_v031_o90_builder_output_kind.py \
            test_v031_o90_o84_archive_parity.py test_v031_o93_builder_output_bound.py; do
              cp "tests/$name" o93-isolated/
          done
          python -m pytest -vv -s o93-isolated/ --junitxml=o93-evidence/junit.xml 2>&1 | tee o93-evidence/court.log
      - name: Independent JUnit and negative-bound audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys,xml.etree.ElementTree as ET
          cases=list(ET.parse("o93-evidence/junit.xml").getroot().iter("testcase"))
          expected_total=65 if sys.platform.startswith("linux") else 66
          expected_skips=7 if sys.platform.startswith("linux") else 8 if sys.platform=="darwin" else 21
          counts={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          counts["total"]=len(cases)
          counts["passed"]=counts["total"]-sum(counts[k] for k in ("failure","error","skipped"))
          print("O93_JUNIT="+json.dumps(counts,sort_keys=True),flush=True)
          assert counts["total"]==expected_total,counts
          assert counts["skipped"]==expected_skips,counts
          assert counts["failure"]==counts["error"]==0,counts
          assert counts["passed"]==expected_total-expected_skips,counts
          names=[(c.get("classname","")+" "+c.get("name","")).lower() for c in cases]
          for tag in ("o64","o65","o67","o80","o81","o84","o90","o93"):
              assert any(tag in name for name in names),tag
          log=Path("o93-evidence/court.log").read_text()
          if sys.platform != "win32":
              assert "O90_REAL_PRODUCT_FIFO_REJECTION=PASS" in log
              assert "O90_REAL_PRODUCT_SYMLINK_FIFO_REJECTION=PASS" in log
          assert "O90_O84_COMPLETE_ARCHIVE_PARITY=" in log
          assert "O93_REGULAR_NEW_EXISTING_READER=PASS" in log
          assert "O93_REGULAR_REPLACEMENT_IDENTITY_REFUSED=PASS" in log
          assert "O93_EXCLUSIVE_CREATION_REGULAR_RACE_REFUSED=PASS" in log
          if sys.platform != "win32":
              for tag in ("O93_REAL_POSTSCAN_SOURCE_PIVOT_REFUSED=PASS", "O93_REAL_POSTSCAN_FIFO_NONBLOCK=PASS", "O93_ABSENT_PATH_EXCLUSIVE_CREATION=PASS", "O93_INPLACE_INODE_HARDLINK_XATTR=PASS", "O93_READONLY_OUTPUT_REFUSED=PASS"):
                  assert tag in log,tag
          result={"head":Path("o93-evidence/head.sha").read_text().strip(),
                  "product_blob":Path("o93-evidence/product.blob").read_text().strip(),
                  "instrument_blob":Path("o93-evidence/instrument.blob").read_text().strip(),
                  "counts":counts,
                  "scope":"installed O84+O90+O93 publication-fd custody, no release credit"}
          Path("o93-evidence/result.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          PY
      - name: Preserve raw results, including failure cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-o93-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: o93-evidence/
          if-no-files-found: warn
          retention-days: 30
