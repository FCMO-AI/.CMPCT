name: ONE-G0.2 relation witness proof deferral

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - "benchmarks/one/one_g02_relation_witness_proof_deferral.py"
      - "benchmarks/one/one_g02_relation_shared_observer_validation.py"
      - "benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c"
      - "docs/one/evidence/ONE_G02_RELATION_WITNESS_PROOF_DEFERRAL_PREREG_2026-09-06.md"
      - "docs/one/evidence/ONE_G02_RELATION_WITNESS_PROOF_DEFERRAL_HOSTILE_AMENDMENT_2026-09-06.md"
      - ".github/workflows/one-g02-relation-witness-proof-deferral.yml"
  pull_request:
    paths:
      - "benchmarks/one/one_g02_relation_witness_proof_deferral.py"
      - "benchmarks/one/one_g02_relation_shared_observer_validation.py"
      - "benchmarks/one/one_g02_shift_relation_safe_dispatch_kernel.c"
      - "docs/one/evidence/ONE_G02_RELATION_WITNESS_PROOF_DEFERRAL_PREREG_2026-09-06.md"
      - "docs/one/evidence/ONE_G02_RELATION_WITNESS_PROOF_DEFERRAL_HOSTILE_AMENDMENT_2026-09-06.md"
      - ".github/workflows/one-g02-relation-witness-proof-deferral.yml"

permissions:
  contents: read

jobs:
  witness-proof-deferral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Relation witness proof-deferral traffic gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_relation_witness_proof_deferral | tee artifacts/one/relation_witness_proof_deferral.json
          rc=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/one/relation_witness_proof_deferral.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload exact-source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-relation-witness-proof-deferral-${{ github.sha }}
          path: artifacts/one/relation_witness_proof_deferral.json
          if-no-files-found: error
