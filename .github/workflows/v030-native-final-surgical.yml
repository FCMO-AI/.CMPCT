name: v0.30 native final surgical patch

on:
  push:
    branches: [agent/v030-coop-native-portability]
    paths: ['tools/v030_native_final_patch.py']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-coop-native-portability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply assertion-guarded edits
        run: python tools/v030_native_final_patch.py
      - name: Format Rust
        run: cargo fmt --manifest-path native/cmpct-portable/Cargo.toml
      - name: Commit and remove one-shot machinery
        run: |
          rm -f tools/v030_native_final_patch.py .github/workflows/v030-native-final-surgical.yml
          git config user.name 'cmpct-v030-coordination'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'native: close final r25 portability surface gaps' -m 'Footnote: exact anchored edits preserve concurrent Android/UI work while widening the release guard to r24/r25, hardening opaque API linting, and restoring Unix filesystem metadata best-effort.'
          git push origin HEAD:agent/v030-coop-native-portability
