# ci-lane: fast
name: CMPCT v0.30 scoped ML bulk varint exact-parent A/B
on:
  push:
    branches: [agent/v030-ml-bulk-varint-table-product]
    paths:
      - 'experiments/entropygraph_v030_release_reader.py'
      - 'experiments/entropygraph_v030_release_reader_policy.py'
      - 'experiments/entropygraph_v030_verified_restore.py'
      - 'benchmarks/v030_ml_bulk_varint_scope_parent_ab.py'
      - '.github/workflows/v030-ml-bulk-varint-scope-parent-ab.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: '${{ github.workspace }}'
  EVIDENCE_HEAD: '${{ github.sha }}'
  CONTROL_HEAD: 'cab8e8dc21595b8bb342e0b39c18e06c91a16b7b'
concurrency:
  group: 'v030-ml-bulk-varint-scope-parent-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  parent-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ env.EVIDENCE_HEAD }}'
      - uses: actions/checkout@v6
        with:
          ref: '${{ env.CONTROL_HEAD }}'
          path: control
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc
          python -m pip install -e .
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_ml_bulk_varint_scope_parent_ab.py experiments/entropygraph_v030_verified_restore.py
      - run: python benchmarks/v030_ml_bulk_varint_scope_parent_ab.py --control-root control
      - uses: actions/upload-artifact@v6
        with:
          name: v030-ml-bulk-varint-scope-parent-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-ml-bulk-varint-scope-parent.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist evidence and remove temporary instrument
        run: |
          cp benchmark-artifacts/v030-ml-bulk-varint-scope-parent.json "benchmarks/history/v030_ml_bulk_varint_scope_parent_${EVIDENCE_HEAD:0:12}.json"
          rm benchmarks/v030_ml_bulk_varint_scope_parent_ab.py .github/workflows/v030-ml-bulk-varint-scope-parent-ab.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/history benchmarks/v030_ml_bulk_varint_scope_parent_ab.py .github/workflows/v030-ml-bulk-varint-scope-parent-ab.yml
          git diff --cached --check
          git commit -m 'evidence: preserve scoped ML extraction parent A/B'
          git push origin HEAD:agent/v030-ml-bulk-varint-table-product