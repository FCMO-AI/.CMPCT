# ci-lane: fast
name: CMPCT CI topology ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/AGENTS.md"
      - "docs/CI_ARCHITECTURE.md"
      - "tools/check_ci_topology.py"
      - "tests/test_ci_topology.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/AGENTS.md"
      - "docs/CI_ARCHITECTURE.md"
      - "tools/check_ci_topology.py"
      - "tests/test_ci_topology.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-ci-topology-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"

      - name: Select workflow files that this change actually touched
        id: changed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pull-request synchronize payloads expose the previous head as `before`; prefer that so a 1,600-commit
          # integration PR does not re-ratchet every historical workflow edit on each new commit. Initial/opened
          # events may not have a usable before SHA, in which case the PR base is the correct first-diff boundary.
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${PR_BASE:-}" ]; then
            base="$PR_BASE"
          else
            base="HEAD^"
          fi

          git diff --name-only "$base" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/changed-workflows.txt
          cat /tmp/changed-workflows.txt

      - name: Enforce CI topology on changed workflows
        run: |
          mapfile -t files < /tmp/changed-workflows.txt
          python tools/check_ci_topology.py "${files[@]}"

      - name: Ratchet topology checker policy
        run: python -m pytest -q tests/test_ci_topology.py

# This ratchet deliberately checks the latest synchronization/push delta. Existing workflow debt is not precedent,
# but it is also not reintroduced work: touching a workflow makes the current topology contract apply immediately.
