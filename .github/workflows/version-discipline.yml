name: CMPCT version discipline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  version-discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Enforce scarce core versions and surface revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_version_discipline.py --base-sha "$BASE_SHA"

# Footnote: numeric project versions are reserved for material archive/engine improvements. Site,
# documentation, workflow and repository-presentation milestones use SURFACE_REVISION (x.x.a, x.x.b,
# ...) and do not consume a core release number or demand a synthetic benchmark record.
