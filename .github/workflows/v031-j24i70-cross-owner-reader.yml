# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# J24I70 — no product change; source-exact physical A/B/C Reader ownership court.
name: CMPCT J24I70 cross-owner Reader checkpoint court

on:
  pull_request:
    branches:
      - agent/phased2-v031-j24g76-owned-replay-large-n-court-20261030
    paths:
      - 'research/j24i70_*'
      - 'docs/v031-research/*j24i70*'
      - '.github/workflows/v031-j24i70-cross-owner-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24i70-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  physical-cross-owner:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24I70_EVIDENCE: evidence/j24i70
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FCMO-AI/.CMPCT
          ref: 129edec976efe8bb604584517de39553487fec34
          path: _reference_j24g91
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source identity and independent original control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$J24I70_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 347a62b443bf7c880ed2b86af5d8be7159ee2480 HEAD
          git merge-base --is-ancestor 9b2cf6ab6d02eee9ead8e58ab1d733ee2aedb9d5 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git -C _reference_j24g91 rev-parse HEAD)" = 129edec976efe8bb604584517de39553487fec34
          test "$(git -C _reference_j24g91 rev-parse HEAD:src/cmpct/reader.py)" = e716233403dabd0966863c45635e18fa5ac6afb8
          git rev-parse HEAD > "$J24I70_EVIDENCE/checkout-head.txt"
          git -C _reference_j24g91 rev-parse HEAD > "$J24I70_EVIDENCE/reference-head.txt"
          git rev-parse HEAD:research/j24i70_cross_owner_reader.py > "$J24I70_EVIDENCE/instrument-blob.txt"
          git rev-parse HEAD:research/j24i70_detached_referee.py > "$J24I70_EVIDENCE/referee-blob.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current branch runtime; reference code is read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22' 'psutil>=5.9'
          python -m pip freeze > "$J24I70_EVIDENCE/pip-freeze.txt"
          python -m py_compile research/j24i70_cross_owner_reader.py research/j24i70_detached_referee.py
      - name: Generate real Writer A/B/C; four Reader semantic and timing court
        shell: bash
        run: |
          set -euo pipefail
          python research/j24i70_cross_owner_reader.py 2>&1 | tee "$J24I70_EVIDENCE/run.log"
          test -s "$J24I70_EVIDENCE/receipt.json"
      - name: Detached original physical/footer/median/forgery referee
        shell: bash
        run: |
          set -euo pipefail
          python research/j24i70_detached_referee.py "$J24I70_EVIDENCE" 2>&1 | tee "$J24I70_EVIDENCE/detached.log"
          test -s "$J24I70_EVIDENCE/detached-referee.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/j24i70')
          report=json.loads((root/'receipt.json').read_text())
          referee=json.loads((root/'detached-referee.json').read_text())
          assert report['status'] == referee['status'] == 'PASS'
          assert referee['product_credit'] == 0
          assert len(referee['adversarial_refusals']) == 13
          print('J24I70_OWNED_READER_RESULT', report['hypothesis'])
          print('J24I70_FORENSIC_RESULT', referee['physical'])
          PY
      - name: Retain real A/B/C files, all observations and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24i70-cross-owner-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/j24i70/
          if-no-files-found: warn
          retention-days: 30
