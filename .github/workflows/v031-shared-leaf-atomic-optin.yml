# ci-lane: fast
name: CMPCT v031 optional shared-leaf atomic publication court
on:
  push:
    branches:
      - agent/phased1-v031-shared-leaf-atomic-optin-20261023
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_atomic_shared_leaf_optin.py'
      - 'benchmarks/v031_atomic_shared_leaf_abba.py'
      - 'benchmarks/v031_atomic_shared_leaf_parent_pivot_negative.py'
      - 'benchmarks/v031_atomic_shared_leaf_metadata_oracle.py'
      - 'tests/test_v031_destination_hardlink_leaf_alias.py'
      - 'benchmarks/history/2026-10-23-v031-atomic-shared-leaf-optin-prereg.md'
      - '.github/workflows/v031-shared-leaf-atomic-optin.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  atomic-optin-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact candidate source and clean checkout
        run: |
          set -euo pipefail
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "READER_BLOB=$(git hash-object src/cmpct/reader.py)"
          test "$(git hash-object src/cmpct/reader.py)" = "562b6af136c252ddc8ff25f968c5c1d4d3760408"
          test -z "$(git status --porcelain)"
          python -c 'import os; assert os.name == "posix" and hasattr(os, "fchmod")'
      - name: Install genuine CMPCT package and native Rust component
        run: python -m pip install -e '.[test,audio]'
      - name: Immutable parent default/refusal and unsafe opt-out court
        run: python -m pytest -q tests/test_v031_destination_hardlink_leaf_alias.py
      - name: New independent atomic opt-in product court
        run: python -m pytest -q -s tests/test_v031_atomic_shared_leaf_optin.py
      - name: Genuine CMPCT three-arm same-archive ABBA research economics
        run: python benchmarks/v031_atomic_shared_leaf_abba.py
      - name: Preserve raw repeated research measurements
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-shared-leaf-abba-${{ github.sha }}
          path: |
            benchmark-artifacts/atomic_shared_leaf_abba.json
            benchmark-artifacts/atomic_shared_leaf_metadata.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive-vs-inherited destination xattr semantics on actual Reader
        run: python benchmarks/v031_atomic_shared_leaf_metadata_oracle.py
      - name: Negative security falsifier, real Reader parent-pivot after preflight
        run: python benchmarks/v031_atomic_shared_leaf_parent_pivot_negative.py
      - name: Explicit boundary and nonpromotion
        run: |
          echo 'REAL_READER_STATIC_OPTIN_COURT_PASS; DEFAULT_REJECTION_UNCHANGED'
          echo 'Not proof of TOCTOU, process durability, cross-platform portability or release performance'
