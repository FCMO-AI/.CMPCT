# ci-lane: fast
name: CMPCT v031 static destination + bounded Reader O27
on:
  push:
    branches:
      - agent/phased3-v031-static-dest-safety-o27-20261024
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_destination_static_symlink_preflight.py'
      - 'tests/test_v031_static_destination_o10r_union_o27.py'
      - '.github/workflows/v031-static-destination-o10r-union-o27.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  composition-court:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original owner test and composed Reader Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/cmpct/reader.py)" = "4ed4e0e20bc460d95bb101ee595041a051d05d31"
          test "$(git hash-object tests/test_v031_destination_static_symlink_preflight.py)" = "f55bd39b449a0d43af25658733ae14f8cd583ffa"
          git rev-parse HEAD
          python -c 'import os; assert os.name=="posix"'
      - name: Install authentic revision-24 package
        run: python -m pip install -e '.[test,audio]'
      - name: Run original static-pivot owner controls and new intersection falsifier
        run: python -m pytest -q tests/test_v031_destination_static_symlink_preflight.py tests/test_v031_static_destination_o10r_union_o27.py
      - name: Scope
        run: |
          echo "O27 POSIX static-containment court only: NOT race-safe, NOT release, NOT source-lifetime binding."
