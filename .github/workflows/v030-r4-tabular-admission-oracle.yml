# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 tabular admission oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_tabular_admission_oracle.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-r4-tabular-admission-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_tabular_admission_oracle.py'
      - 'benchmarks/v030_r4_tabular_owner_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-r4-tabular-admission-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v030-r4-tabular-admission-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_tabular_admission_oracle\.py|benchmarks/v030_r4_tabular_owner_oracle\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/resemblance_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|\.github/workflows/v030-r4-tabular-admission-oracle\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  tabular-admission-oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact sparse-admission oracle
        run: python -m py_compile benchmarks/v030_r4_tabular_admission_oracle.py
      - name: Run content-driven gate over all frozen workloads
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_tabular_admission_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-admission-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-tabular-admission.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-tabular-admission.json').read_text())
          assert d['schema']=='cmpct-v030-r4-tabular-admission-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['sniff_bytes_per_file_cap']==65536 and d['sample_rows']==16
          assert d['logical_bytes_total']>0 and d['observation_bytes_total']>0
          assert d['full_proof_bytes']>=0
          h=d['hypothesis']
          assert isinstance(h['analytics_relation_discovered_without_path_or_extension_dispatch'],bool)
          assert isinstance(h['zero_other_accepted_relations_on_frozen_15'],bool)
          assert isinstance(h['supported_as_sparse_opportunity_gate'],bool)
          c=d['contract']
          assert c['diagnostic_only'] and c['release_credit'] is False
          assert c['filename_extension_used_for_admission'] is False
          assert c['workload_identity_used_for_admission'] is False
          assert c['full_proof_only_after_schema_and_sample_match']
          assert c['exact_lexical_reconstruction_required']
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-tabular-admission-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-tabular-admission-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-tabular-admission.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. A positive gate says only that expensive proof can be opportunity-gated on the frozen matrix;
# it does not grant a new reader-visible representation or canonical selector.
