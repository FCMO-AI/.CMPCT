# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 prebuild process portability

on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - experiments/entropygraph_v030_r24_process_prebuild.py
      - experiments/entropygraph_v030_r24_process_shipping.py
      - tests/test_v030_r24_process_prebuild.py
      - tests/test_v030_r24_process_shipping.py
      - .github/workflows/v030-r24-process-prebuild-portability.yml
  push:
    branches: [agent/v030-r24-process-productization]
    paths:
      - experiments/entropygraph_v030_r24_process_prebuild.py
      - experiments/entropygraph_v030_r24_process_shipping.py
      - tests/test_v030_r24_process_prebuild.py
      - tests/test_v030_r24_process_shipping.py
      - .github/workflows/v030-r24-process-prebuild-portability.yml
  workflow_dispatch:

permissions: {contents: write}
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Admit only latest-head process-boundary changes
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(experiments/entropygraph_v030_r24_process_(prebuild|shipping)\.py|tests/test_v030_r24_process_(prebuild|shipping)\.py|\.github/workflows/v030-r24-process-prebuild-portability\.yml)$'; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  wire-shipping:
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-r24-process-wire-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-r24-process-productization
          fetch-depth: 2
      - name: Wire only if exact guarded anchors remain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experiments/entropygraph_v030_release_product.py')
          s = p.read_text()
          import_old = 'from experiments import entropygraph_v030_r24_media_terminal as _R24_MEDIA\n'
          import_new = import_old + 'from experiments import entropygraph_v030_r24_process_shipping as _R24_PROCESS_SHIPPING\n'
          bind_old = '_BASE_IMPL._locality_bounded_r24_build = _locality_bounded_r24_build\n'
          bind_new = bind_old + '_R24_PROCESS_REGISTRY = _R24_PROCESS_SHIPPING.install_into_release_base(_BASE_IMPL)\n'
          if import_new in s and bind_new in s:
              raise SystemExit(0)
          if import_new in s or bind_new in s or s.count(import_old) != 1 or s.count(bind_old) != 1:
              raise SystemExit('release front door changed; refusing ambiguous wiring')
          p.write_text(s.replace(import_old, import_new).replace(bind_old, bind_new))
          PY
          if git diff --quiet; then exit 0; fi
          git diff --check
          git config user.name 'cmpct-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/entropygraph_v030_release_product.py
          git commit -m 'productize: wire child-owned r24 prebuild seam'
          git push origin HEAD:agent/v030-r24-process-productization

  focused-portability:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Bind exact candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Expose zstd shared library on macOS
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          brew list zstd >/dev/null 2>&1 || brew install zstd
          ln -sf "$(brew --prefix zstd)/lib/libzstd.dylib" "$RUNNER_TEMP/libzstd.so"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile process boundary
        run: python -m py_compile experiments/entropygraph_v030_r24_process_prebuild.py experiments/entropygraph_v030_r24_process_shipping.py tests/test_v030_r24_process_prebuild.py tests/test_v030_r24_process_shipping.py
      - name: Run focused process-boundary tests
        run: python -m pytest -q tests/test_v030_r24_process_prebuild.py tests/test_v030_r24_process_shipping.py
