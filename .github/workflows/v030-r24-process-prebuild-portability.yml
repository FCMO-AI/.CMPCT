# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 prebuild process portability

on:
  push:
    branches: [agent/v030-r24-process-productization]
    paths:
      - experiments/entropygraph_v030_r24_process_prebuild.py
      - tests/test_v030_r24_process_prebuild.py
      - .github/workflows/v030-r24-process-prebuild-portability.yml
  workflow_dispatch:

permissions: {contents: read}
env: {PYTHONPATH: '${{ github.workspace }}'}

jobs:
  focused-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile process boundary
        run: python -m py_compile experiments/entropygraph_v030_r24_process_prebuild.py tests/test_v030_r24_process_prebuild.py
      - name: Run focused process-boundary tests
        run: python -m pytest -q tests/test_v030_r24_process_prebuild.py
