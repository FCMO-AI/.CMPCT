name: CMPCT one-shot public release scrub

on:
  push:
    branches: [agent/public-release-scrub]

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-release-scrub
          fetch-depth: 0

      - name: Remove private provenance and activate publication metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Footnote: these are prose-only provenance removals. They intentionally leave executable
          # codec/reader behavior untouched while generalizing the engineering reason for each policy.
          replacements = {
              'src/cmpct/codec.py': [
                  (
                      'Fast-profile Hermes stores its mirrored WAVs as reusable Deflate streams and pays zero import cost.',
                      'Fast profiles with reusable Deflate WAV streams pay zero heavy-module import cost.',
                  ),
                  (
                      'not used in the Hermes corpus.',
                      'not enabled by the current exact WAV-FLAC path.',
                  ),
              ],
              'src/cmpct/builder.py': [
                  (
                      "We require a cohort of 8+ so smaller sets (such as Hermes' provenance\n        # archives) can still use structural virtualization/deduplication, which is better there.",
                      'We require a cohort of 8+ so smaller sets can still use structural\n        # virtualization/deduplication when that representation is better.',
                  ),
              ],
              'src/cmpct/reader.py': [
                  (
                      'eliminating hundreds of redundant stat/mkdir calls on source trees such as Hermes.',
                      'eliminating hundreds of redundant stat/mkdir calls on large source trees.',
                  ),
              ],
              'site/build_site.py': [
                  ('"mode": "manual"', '"mode": "public"'),
                  ('"status": "validation-only until explicitly published"', '"status": "public website"'),
                  (
                      'Website publication is manual; ordinary repository pushes validate the site but do not publish it.',
                      'Website publication is active; canonical main updates publish only after validation gates pass.',
                  ),
              ],
              'site/src/index.html': [
                  (
                      'The website is continuously validated but deliberately unpublished until a manual release decision.',
                      'The website is published and continuously validated from the canonical build.',
                  ),
                  (
                      '<article><span class="feature-mark">^</span><h3>Manual publication</h3><p>Ordinary pushes build and test the website without deploying it. Publication requires an explicit manual workflow decision.</p></article>',
                      '<article><span class="feature-mark">^</span><h3>Published website</h3><p>Canonical main updates deploy only after disclosure, compatibility and Browser Lab gates pass.</p></article>',
                  ),
              ],
          }

          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected release-prep text not found in {rel}: {old[:80]!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          guard = '''#!/usr/bin/env python3
          from __future__ import annotations

          """Fail CI when any tracked CMPCT text file contains forbidden private provenance."""

          from pathlib import Path
          import subprocess
          import sys

          ROOT = Path(__file__).resolve().parents[1]

          # Footnote: tokens are assembled so the guard itself does not contain the forbidden literal
          # strings it is protecting against. The project-owner namespace is intentionally allowed;
          # this rule targets unrelated private operational provenance, not public ownership metadata.
          RESTRICTED = {
              "private project marker": "Her" + "mes",
              "private agent marker": "Jar" + "vis",
              "private person marker": "Jav" + "ier",
              "private person marker (ascii)": "Mat" + "ias",
              "private person marker (accented)": "Mat" + "ías",
              "private messaging-system marker": "Tele" + "gram",
              "private workspace marker": "Obsi" + "dian",
              "private analysis-system marker": "Levia" + "than",
              "private voice-system marker": "Voice" + "Script",
              "private vision-system marker": "Roz " + "Vision",
              "private model-plan marker": "Claude " + "Max",
              "private design-source provenance": "FCMO " + "identity",
              "container scratch/private upload path": "/mnt/" + "data/",
          }

          TEXT_SUFFIXES = {
              "", ".md", ".txt", ".json", ".py", ".rs", ".toml", ".lock", ".html", ".css",
              ".js", ".mjs", ".ts", ".yml", ".yaml", ".xml", ".sh", ".c", ".h", ".hpp",
          }

          def tracked_files():
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=ROOT)
              for item in raw.decode("utf-8").split("\\0"):
                  if not item:
                      continue
                  path = ROOT / item
                  if path.is_file() and path.suffix.lower() in TEXT_SUFFIXES:
                      yield path

          def main() -> int:
              findings: list[str] = []
              checked = 0
              for path in tracked_files():
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  checked += 1
                  folded = text.casefold()
                  for label, token in RESTRICTED.items():
                      if token.casefold() not in folded:
                          continue
                      rel = path.relative_to(ROOT)
                      for lineno, line in enumerate(text.splitlines(), 1):
                          if token.casefold() in line.casefold():
                              findings.append(f"{rel}:{lineno}: {label}: {line.strip()}")

              if findings:
                  print("CMPCT disclosure guard rejected private operational provenance:", file=sys.stderr)
                  for finding in findings:
                      print(f"  - {finding}", file=sys.stderr)
                  return 1

              print(f"CMPCT disclosure guard: clean ({checked} tracked text files checked)")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          # Strip the workflow heredoc's visual indentation without changing the generated Python.
          import textwrap
          (root / 'tools/check_public_surface.py').write_text(textwrap.dedent(guard), encoding='utf-8')

          pages = '''name: CMPCT website

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: cmpct-site-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              permissions:
                contents: read
                pages: read
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Python 3.11
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip

                - name: Set up Node for browser-writer gate
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"

                - name: Guard complete tracked project surface
                  run: python tools/check_public_surface.py

                - name: Install canonical CMPCT reader
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -e .

                - name: Build canonical site data
                  run: python site/build_site.py --out _site

                - name: Check browser JavaScript
                  run: |
                    node --check site/src/assets/app.js
                    node --check site/src/assets/cmpct-browser-writer.js

                - name: Gate browser-written archive through canonical reader
                  run: |
                    node site/tests/browser-writer-smoke.mjs /tmp/browser-writer-smoke.cmpct
                    python - <<'PY2'
                    from pathlib import Path
                    from cmpct.reader import CMPCT

                    path = Path('/tmp/browser-writer-smoke.cmpct')
                    with CMPCT(path) as archive:
                        assert archive.index['v'] == 24
                        assert [row[0] for row in archive.files] == ['copy/repeated.txt', 'docs/repeated.txt', 'unique.txt']
                        assert archive.read('copy/repeated.txt') == archive.read('docs/repeated.txt')
                        assert archive.read('unique.txt') == b'small independent file\\n'
                    PY2

                - name: Configure GitHub Pages
                  if: github.event_name != 'pull_request'
                  uses: actions/configure-pages@v5

                - name: Upload GitHub Pages artifact
                  if: github.event_name != 'pull_request'
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: _site

            deploy:
              if: github.event_name != 'pull_request'
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              needs: build
              permissions:
                pages: write
                id-token: write
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4

          # Footnote: canonical main now publishes automatically, but only after the full-tree disclosure
          # guard, static build, JavaScript checks and canonical-reader Browser Lab compatibility gate pass.
          '''
          (root / '.github/workflows/pages.yml').write_text(textwrap.dedent(pages), encoding='utf-8')

          # The one-shot workflow must not become part of the public project surface.
          (root / '.github/workflows/_public-release-scrub.yml').unlink()
          PY

      - name: Verify zero private markers before commit
        run: python tools/check_public_surface.py

      - name: Commit release-preparation changes
        shell: bash
        run: |
          git config user.name "CMPCT Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prepare CMPCT public release surface"
          git push origin HEAD:agent/public-release-scrub

# Footnote: this workflow exists only to make one atomic, reviewable scrub commit from a connected
# GitHub environment. It deletes itself before committing so the public project does not retain a
# privileged history-rewrite helper or release-specific private context.
