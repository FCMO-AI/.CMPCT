# ci-lane: fast
# O223: scientific-only, no Reader product changes.
name: CMPCT O223 authenticated Reader futures RSS court
on:
  push:
    branches:
      - agent/phased3-v031-o223-bounded-reader-futures-20261027
  pull_request:
    branches:
      - agent/phased2-v031-j24c02-fixed-geometry-fd-composition-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o223-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r24-futures-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact scientific source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify immutable prereg and Reader/fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD
          git merge-base --is-ancestor fc1b0347f06ef746d253614b516ead241e29ebed HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = dbd4ac576a05a47eae97e1e40de89cf1de440516
          test "$(git rev-parse HEAD:tests/test_o215_fixed_chunk_admission.py)" = a8efaebd9fff8b3203cfd55304d365c309ff394b
          test "$(git rev-parse HEAD:tests/test_o214_cdc_admission.py)" = ce5bb0c6da2f6d38dcf2b32956b6dfc08e05eaec
          mkdir -p o223-evidence
          git rev-parse HEAD > o223-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > o223-evidence/reader.blob
          git rev-parse HEAD:research/o223_read_futures_rss_court.py > o223-evidence/instrument.blob
          git diff --stat c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD > o223-evidence/diff-stat.txt
          python -m py_compile research/o223_read_futures_rss_court.py research/o223_independent_receipt_audit.py
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Reader independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import cmpct.reader as reader
          import hashlib,inspect,os
          original=Path(os.environ["GITHUB_WORKSPACE"])/"src/cmpct/reader.py"
          installed=Path(inspect.getfile(reader)).resolve()
          assert installed!=original.resolve()
          norm=lambda p:p.read_bytes().replace(b'\r\n',b'\n')
          assert norm(installed)==norm(original)
          print("READER_INSTALLED_SHA256="+hashlib.sha256(norm(installed)).hexdigest())
          PY
      - name: Full authenticated r24 read+open+RSS court
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o223_read_futures_rss_court.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/o223-evidence/results.json" --repeats 3 \
            2>&1 | tee "$GITHUB_WORKSPACE/o223-evidence/run.log"
      - name: Independently validate raw evidence and fixed decision
        shell: bash
        run: |
          set -euo pipefail
          python research/o223_independent_receipt_audit.py o223-evidence/results.json \
            | tee o223-evidence/audit.json
      - name: Preserve original evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o223-authenticated-reader-futures-${{ github.sha }}
          path: o223-evidence/
          if-no-files-found: warn
