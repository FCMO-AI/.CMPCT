# ci-lane: deep
name: CMPCT established external v0.30 anchor

on:
  workflow_dispatch:
  push:
    branches:
      - bench/established-corpora-v2
    paths:
      - benchmarks/established_corpora_v030_anchor.py
      - .github/workflows/established-corpora-v030-anchor.yml

permissions:
  contents: read

concurrency:
  group: cmpct-established-v030-anchor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: aggregate
            cell_timeout: 600
          - suite: enwik9
            cell_timeout: 600
          - suite: members
            cell_timeout: 120
    env:
      PYTHONUNBUFFERED: "1"
      CMPCT_V029_SHA: "291423c604642b21a4b84d2500a12eeaac7bd9e0"
      CMPCT_V030_SHA: "cf36fc2bc079b96887eb8fb5639902de5c3d56ac"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check benchmark/CI topology
        run: |
          python -m py_compile benchmarks/established_corpora_v030_anchor.py benchmarks/established_corpora_v2.py benchmarks/established_corpora_v3.py
          python tools/check_ci_topology.py .github/workflows/established-corpora-v030-anchor.yml

      - name: Materialize pinned CMPCT engines
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin "$CMPCT_V029_SHA" "$CMPCT_V030_SHA"
          git worktree add --detach "$RUNNER_TEMP/cmpct-v029" "$CMPCT_V029_SHA"
          git worktree add --detach "$RUNNER_TEMP/cmpct-v030" "$CMPCT_V030_SHA"
          python -m venv "$RUNNER_TEMP/venv29"
          python -m venv "$RUNNER_TEMP/venv30"
          "$RUNNER_TEMP/venv29/bin/pip" install -q -e "$RUNNER_TEMP/cmpct-v029"
          "$RUNNER_TEMP/venv30/bin/pip" install -q -e "$RUNNER_TEMP/cmpct-v030"
          echo "CMPCT_V029_PYTHON=$RUNNER_TEMP/venv29/bin/python" >> "$GITHUB_ENV"
          echo "CMPCT_V030_PYTHON=$RUNNER_TEMP/venv30/bin/python" >> "$GITHUB_ENV"
          echo "CMPCT_V030_REPO=$RUNNER_TEMP/cmpct-v030" >> "$GITHUB_ENV"

      - name: Fetch, validate and normalize canonical corpus bytes
        run: |
          set -euxo pipefail
          python benchmarks/fetch_established_corpora.py \
            --root "$RUNNER_TEMP/cmpct-established-${{ matrix.suite }}" \
            --suite "${{ matrix.suite }}" \
            --out "$RUNNER_TEMP/manifest-${{ matrix.suite }}.json"

      - name: Run paired shipping/v0.30 benchmark
        env:
          CMPCT_EXTERNAL_TIMEOUT: ${{ matrix.cell_timeout }}
        run: |
          set -euxo pipefail
          python benchmarks/established_corpora_v030_anchor.py \
            "$RUNNER_TEMP/manifest-${{ matrix.suite }}.json" \
            --out "$GITHUB_WORKSPACE/external-results-${{ matrix.suite }}"

      - name: Upload raw evidence handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-established-v030-anchor-${{ matrix.suite }}
          path: |
            external-results-${{ matrix.suite }}/external-corpora.json
            external-results-${{ matrix.suite }}/external-corpora.partial.json
          if-no-files-found: warn
          retention-days: 30
