name: CMPCT1 ONE-G0.2 lazy segment charged ingest

on:
  push:
    branches: [research/cmpct1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-segment-charged-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind exact source and frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f docs/one/prereg/ONE_G02_LAZY_SEGMENT_CHARGED_INGEST_PREREG_2026-09-08.md
          test -f benchmarks/one/one_g02_lazy_segment_charged_ingest.py
          test -f tests/one/test_lazy_segment_charged_ingest.py
          python - <<'PY'
          from benchmarks.one.one_g02_lazy_segment_charged_ingest import DECISION_SIZE, SIZES, run
          assert DECISION_SIZE == 1 << 20
          assert 64 << 10 in SIZES and 1 << 20 in SIZES
          assert callable(run)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Prove frozen decision law
        run: python -m pytest -q tests/one/test_lazy_segment_charged_ingest.py tests/one/test_lazy_segment_timing.py

      - name: Run frozen charged-ingest transfer falsifier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/one
          python -m benchmarks.one.one_g02_lazy_segment_charged_ingest \
            | tee .artifacts/one/one-g02-lazy-segment-charged-ingest-${EVIDENCE_HEAD}.json

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-lazy-segment-charged-ingest-${{ env.EVIDENCE_HEAD }}
          path: .artifacts/one/one-g02-lazy-segment-charged-ingest-${{ env.EVIDENCE_HEAD }}.json
          if-no-files-found: warn
