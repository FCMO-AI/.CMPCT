name: CMPCT1 ONE-G0.2 trusted prior chain lifecycle

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_g02_trusted_prior_chain_lifecycle.py'
      - 'benchmarks/one/one_g02_trusted_prior_root_reuse.py'
      - 'benchmarks/one/one_g02_lazy_segment_timing.py'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py'
      - 'benchmarks/one/one_g02_end_to_end_direct_emitter_writer.py'
      - 'experiments/one/**'
      - 'tests/one/test_trusted_prior_root_reuse.py'
      - 'tests/one/test_lazy_segment_timing.py'
      - 'docs/one/prereg/ONE_G02_TRUSTED_PRIOR_CHAIN_LIFECYCLE_PREREG_2026-09-10.md'
      - '.github/workflows/cmpct1-one-g02-trusted-prior-chain-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind exact source and frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f docs/one/prereg/ONE_G02_TRUSTED_PRIOR_CHAIN_LIFECYCLE_PREREG_2026-09-10.md
          test -f benchmarks/one/one_g02_trusted_prior_chain_lifecycle.py
          echo "EVIDENCE_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Prove inherited writer semantics
        run: |
          python -m pytest -q \
            tests/one/test_trusted_prior_root_reuse.py \
            tests/one/test_lazy_segment_timing.py

      - name: Run frozen chain lifecycle falsifier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/one
          python -m benchmarks.one.one_g02_trusted_prior_chain_lifecycle \
            | tee .artifacts/one/one-g02-trusted-prior-chain-lifecycle-${EVIDENCE_HEAD}.json

      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-trusted-prior-chain-lifecycle-${{ github.sha }}
          path: .artifacts/one/one-g02-trusted-prior-chain-lifecycle-${{ github.sha }}.json
          if-no-files-found: warn
          retention-days: 30
