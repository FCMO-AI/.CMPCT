# ci-lane: fast
name: CMPCT v0.31 O143 ZIP failure-atomicity falsifier

on:
  push:
    branches:
      - agent/phased2-v031-o143-zip-export-failure-atomicity-20261026
  pull_request:
    paths:
      - '.github/workflows/v031-o143-zip-export-failure-atomicity.yml'
      - 'tests/test_v031_o143_zip_export_failure_atomicity.py'
      - 'docs/v031-research/2026-10-26-o143-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o143-${{github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zip-failure-atomicity:
    runs-on: ${{matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      SOURCE_HEAD: ${{github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source-exact stacked O140 parent with immutable preregistration
        uses: actions/checkout@v4
        with:
          ref: ${{env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind source, original Reader and frozen independent vector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git merge-base --is-ancestor d8b69758dbcbb66fe28fa7cf59598916df160d2d HEAD
          git merge-base --is-ancestor d66f7b0883a56af03ff90f1de683ef64437b0125 HEAD
          test "$(git hash-object src/cmpct/reader.py)" = "e46e6121842d485cb209118576ebf3ba3719080d"
          test "$(git hash-object tests/conformance/v24-direct-codecs.json)" = "d10b7dab9126d39e819a74279c186363a163f2ef"
          mkdir -p o143-evidence
          git rev-parse HEAD > o143-evidence/head.sha
          git hash-object src/cmpct/reader.py > o143-evidence/reader.blob
          git hash-object tests/conformance/v24-direct-codecs.json > o143-evidence/vector.blob
          git hash-object tests/test_v031_o143_zip_export_failure_atomicity.py > o143-evidence/test.blob
          python -m pip install --disable-pip-version-check . pytest
      - name: Prove installed Reader outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os,pathlib
          import cmpct.reader
          source=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          module=pathlib.Path(cmpct.reader.__file__).resolve()
          assert not module.is_relative_to(source),(module,source)
          print("O143_INSTALLED_READER="+str(module),flush=True)
          PY
      - name: Run original negative hypothesis (scientific reproduction, not product gate)
        shell: bash
        env:
          CMPCT_FIXTURE_JSON: ${{github.workspace }}/tests/conformance/v24-direct-codecs.json
        run: |
          set -euo pipefail
          cp tests/test_v031_o143_zip_export_failure_atomicity.py o143-evidence/
          cd "$RUNNER_TEMP"
          python -m pytest -vv -s "$GITHUB_WORKSPACE/o143-evidence/test_v031_o143_zip_export_failure_atomicity.py" \
            --junitxml="$GITHUB_WORKSPACE/o143-evidence/junit.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/o143-evidence/court.log"
      - name: Independent audit of exactly two negative witnesses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          evidence=Path("o143-evidence")
          cases=list(ElementTree.parse(evidence/"junit.xml").getroot().iter("testcase"))
          assert len(cases)==2, len(cases)
          assert all(all(c.find(k) is None for k in ("failure","error","skipped")) for c in cases)
          rows=[json.loads(l.split("O143_CASE=",1)[1]) for l in (evidence/"court.log").read_text().splitlines() if "O143_CASE=" in l]
          assert len(rows)==2,rows
          assert {(x["case"],x["result"]) for x in rows} == {
              ("frozen_raw_crc","truncated_existing_regular_zip"),
              ("builder_late_payload","partial_invalid_zip_overwrote_existing_regular_zip"),
          }, rows
          assert all(x["target_before_sha"]!=x["target_after_sha"] and x["read_error"] and x["export_error"] for x in rows)
          manifest={k:(evidence/v).read_text().strip() for k,v in {
              "source_sha":"head.sha","reader_blob":"reader.blob",
              "vector_blob":"vector.blob","test_blob":"test.blob",
          }.items()}
          manifest.update({"scope":"installed original ZIP exporter; intentional negative", "cases":rows,
                           "pass":2,"fail":0,"skip":0})
          (evidence/"result.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("O143_AUDIT="+json.dumps({k:v for k,v in manifest.items() if k!="cases"},sort_keys=True))
          PY
      - name: Preserve original scientific evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-o143-${{matrix.os }}-${{env.SOURCE_HEAD }}
          path: o143-evidence/
          retention-days: 30
          if-no-files-found: warn
