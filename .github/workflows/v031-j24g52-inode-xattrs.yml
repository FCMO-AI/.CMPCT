# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: CMPCT J24G52 hardlink inode explicit xattr admission
on:
  push:
    branches:
      - agent/phased2-v031-j24g52-hardlink-xattr-inode-preflight-20261029
  pull_request:
    branches:
      - agent/phased2-v031-j24g50-zstd-fsmeta-integrity-compose-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24g52-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inode-xattr-admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G52_EVIDENCE_DIR: evidence/physical
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock source parent and prospective registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor 318ad1a608222a7de9c765eb556b5c64ae8a407b HEAD
          git merge-base --is-ancestor 47c9a4d61cd764aa4252cad741f4b22537106c60 HEAD
          test "$(git rev-parse HEAD:src/cmpct/transactions.py)" = 3eef7fdc3f6deca5ddd6d9edf1292c7e2c864f11
          test "$(git rev-parse HEAD:src/cmpct/native_codec.py)" = 1dd853c111410726e051adc48ee59392a4cbd5fb
          mkdir -p evidence/physical
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse HEAD:src/cmpct/validation.py > evidence/validation-blob.txt
          git rev-parse HEAD:src/cmpct/reader.py > evidence/reader-blob.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CMPCT package and independent referee
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'pytest>=8' 'zstandard>=0.22'
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import cmpct.reader as reader
          import cmpct.validation as validation
          import cmpct.builder as builder
          for source, module in [
              ("src/cmpct/reader.py", reader),
              ("src/cmpct/validation.py", validation),
              ("src/cmpct/builder.py", builder),
          ]:
              actual = Path(module.__file__).read_bytes().replace(b"\r\n", b"\n")
              expected = Path(source).read_bytes().replace(b"\r\n", b"\n")
              assert actual == expected, (source, module.__file__)
              print("SOURCE_EXACT", source, hashlib.sha256(actual).hexdigest())
          PY
      - name: Acceptance, hostile input, alias depth and source-exact physical cases
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -s --junitxml=evidence/test.xml tests/test_v031_j24g52_inode_xattr_preflight.py tests/test_v031_j24g52_journal_replay_discriminator.py 2>&1 | tee evidence/test.log
      - name: Independent r24 wire referee and auditor mutation controls
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/physical/compatible.cmpct
          test -s evidence/physical/contradictory.cmpct
          python research/j24g52/audit_wire.py evidence/physical 2>&1 | tee evidence/referee.log
          test -s evidence/physical/independent-referee.json
      - name: Retain immutable physical evidence and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g52-inode-xattrs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
