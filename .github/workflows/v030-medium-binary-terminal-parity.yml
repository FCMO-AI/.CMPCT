# ci-lane: deep
name: CMPCT v0.30 medium-binary terminal parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_release_product.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/v030_medium_binary_terminal_parity_oracle.py'
      - '.github/workflows/v030-medium-binary-terminal-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-medium-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CMPCT test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile parity oracle
        run: python -m py_compile benchmarks/v030_medium_binary_terminal_parity_oracle.py
      - name: Prove direct-r24 versus shipping-product archive identity
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_medium_binary_terminal_parity_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-medium-terminal-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-medium-terminal-parity.json"
      - name: Independently enforce the shipping regression boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-medium-terminal-parity.json').read_text())
          assert d['schema']=='cmpct-v030-medium-binary-terminal-parity-oracle-v1'
          g=d['gate']
          assert g['target_count'] is True
          assert g['all_exact_archive_identity'] is True
          assert g['all_exact_tree_identity'] is True
          assert g['all_full_product_selected_r24'] is True
          assert g['all_shipping_r24_v4'] is True
          assert g['frozen_row_terminal_parity_proven'] is True
          rows=d['rows']
          assert len(rows)==2
          assert all(r['source_shape']['all_regular_bin'] for r in rows)
          assert all(r['source_shape']['all_regular_at_most_256k'] for r in rows)
          assert all(r['source_shape']['all_regular_at_least_32k'] for r in rows)
          # The shipping invariant is semantic ownership: r25 must never be constructed. A few milliseconds of
          # classification/publication/verification overhead relative to a direct private r24 helper is not r25
          # work and must not be mislabeled as such by subtracting two independent wall clocks.
          assert all(r['full_release_product']['r25_attempted'] is False for r in rows)
          assert all(r['full_release_product']['r25_product_bytes'] is None for r in rows)
          PY
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-medium-terminal-parity-${{ github.sha }}
          path: benchmark-artifacts/v030-medium-terminal-parity.json
          if-no-files-found: warn
          retention-days: 90

# Shipping regression proof. The frozen rows must remain byte-identical to direct r24-v4 while the promoted
# product proves that the evidence-backed terminal path avoids r25 entirely. Wall-clock deltas between the public
# product and a private direct-r24 helper are diagnostic only; r25 ownership is proved by r25_attempted/bytes.
# This lane cannot widen admission.
