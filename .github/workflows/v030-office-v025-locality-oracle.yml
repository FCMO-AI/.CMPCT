name: CMPCT v0.30 Office compact-floor locality oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_office_v025_locality_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-office-v025-locality-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-v025-locality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check msgpack numpy pillow reportlab python-docx openpyxl python-pptx
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libzstd1
      - name: Run exact Office compact-floor locality falsifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_office_v025_locality_oracle.py | tee benchmark-artifacts/v030-office-v025-locality.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmark-artifacts/v030-office-v025-locality.json')
          if p.stat().st_size == 0:
              raise SystemExit('Office locality oracle emitted an empty receipt')
          data = json.loads(p.read_text())
          if data.get('schema') != 'cmpct-v030-office-v025-locality-oracle-v1':
              raise SystemExit(f"unexpected Office locality receipt schema: {data.get('schema')!r}")
          if data.get('locality_verdict') not in {'PASS', 'FAIL'}:
              raise SystemExit('Office locality receipt lacks a terminal PASS/FAIL verdict')
          PY
      - name: Upload oracle result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-office-v025-locality-${{ github.sha }}
          path: benchmark-artifacts/v030-office-v025-locality.json
          if-no-files-found: error
