# ci-lane: fast
name: v031 O191 forced ZIP64 fallback DOS-date parity court
on:
  pull_request:
    branches:
      - agent/phased3-v031-o190-zip-dos-signed-date-20261026
      - agent/v031-development
    paths:
      - 'src/cmpct/reader.py'
      - 'research/o191_zip64_fallback_calendar_court.py'
      - '.github/workflows/v031-o191-zip64-fallback-calendar.yml'
      - 'docs/v031-research/2026-10-26-o191-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-producer:
    name: Source-exact authentic small signed r24 inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Build three signed-date r24 archives from genuine Builder
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o191"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o190_zip_dos_repair_court.py" --role producer --directory "$RUNNER_TEMP/o191" --out "$RUNNER_TEMP/o191/producer.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o191-original-r24-signed-archives
          path: ${{ runner.temp }}/o191/
          if-no-files-found: error

  forced-fallback:
    name: Installed CMPCT forced-fallback (${{ matrix.os }})
    needs: linux-producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: o191-original-r24-signed-archives
          path: ${{ runner.temp }}/o191
      - name: Validate exact installed source and force ZIP64 dispatch, not 4GiB data
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o191_zip64_fallback_calendar_court.py" --directory "$RUNNER_TEMP/o191" --out "$RUNNER_TEMP/o191/o191-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o191-forced-fallback-${{ matrix.os }}
          path: ${{ runner.temp }}/o191/o191-result.json
          if-no-files-found: warn
