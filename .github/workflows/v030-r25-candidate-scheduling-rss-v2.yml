# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 candidate scheduling RSS A/B v2

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_v2_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V2_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_scheduling_rss_v2_*.py'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V2_PREREG.md'
      - '.github/workflows/v030-r25-candidate-scheduling-rss-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-v2-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_candidate_scheduling_rss_v2_.*\.py$|docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V2_PREREG\.md$|\.github/workflows/v030-r25-candidate-scheduling-rss-v2\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  candidate-scheduling-rss-v2:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-r25-candidate-scheduling-rss-v2-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile superseding frozen A/B
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile \
            benchmarks/v030_r25_candidate_scheduling_rss_v2_worker.py \
            benchmarks/v030_r25_candidate_scheduling_rss_v2_oracle.py \
            experiments/entropygraph_v030_profile_isolation.py \
            experiments/entropygraph_v030_canonical_final.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release_product.py
      - name: Run candidate scheduling RSS A/B v2
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_candidate_scheduling_rss_v2_oracle.py \
            --work-root benchmark-artifacts/v030-r25-candidate-scheduling-rss-v2-work \
            --output benchmark-artifacts/v030-r25-candidate-scheduling-rss-v2.json
      - name: Ratchet dual identity domains and frozen claim boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('benchmark-artifacts/v030-r25-candidate-scheduling-rss-v2.json')
          assert path.is_file(), 'scheduling RSS v2 did not publish evidence'
          data = json.loads(path.read_text())
          assert data['schema'] == 'cmpct-v030-r25-candidate-scheduling-rss-v2'
          assert data['source_commit'] == os.environ['EVIDENCE_HEAD']
          assert data['release_credit'] is False
          assert data['preregistration'] == 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V2_PREREG.md'
          supersedes = data['supersedes']
          assert supersedes['record'] == 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V1_INVALID_RESULT.md'
          assert supersedes['v1_source'] == '81b64517271baf4efa534ae1cadfa96d0b02c6d8'
          assert supersedes['v1_workflow_run'] == 33594786248
          assert supersedes['v1_artifact_id'] == 9833258503
          assert 'filesystem/user-tree' in supersedes['reason'] and 'research-content' in supersedes['reason']

          assert data['research_identity_domain'] == 'research-content-tree-v1'
          assert data['verification_identity_domain'] == 'canonical-filesystem-user-tree-v1'
          assert data['research_tree_sha256'] != data['expected_verification_tree_sha256'], 'v2 must preserve the distinct identity domains exposed by v1'

          contract = data['contract']
          assert contract['exact_product_identity_required'] is True
          assert contract['dual_identity_domains_explicit'] is True
          assert contract['fresh_process_per_measurement'] is True
          assert contract['total_peak_rss_is_causal_metric'] is True
          assert contract['baseline_subtracted_ru_maxrss_is_diagnostic_only'] is True
          assert contract['decision_thresholds_changed_from_v1'] is False
          for key in ('production_source_changed','selector_changed','admission_changed','grammar_changed','integrity_changed','locality_changed','recovery_changed'):
              assert contract[key] is False

          if data['experiment_valid'] is True:
              assert data['worker_failures'] == []
              for row in data['repetitions']:
                  concurrent = row['concurrent']
                  serialized = row['serialized']
                  for receipt in (concurrent, serialized):
                      assert receipt['research_tree_sha256'] == data['research_tree_sha256']
                      assert receipt['expected_verification_tree_sha256'] == data['expected_verification_tree_sha256']
                      assert receipt['verified_tree_sha256'] == data['expected_verification_tree_sha256']
                      assert receipt['tree_sha256'] == data['expected_verification_tree_sha256']
                      assert receipt['verification_identity_domain'] == 'canonical-filesystem-user-tree-v1'
                      assert receipt['research_identity_domain'] == 'research-content-tree-v1'
                      assert receipt['selected'] == 'prefixgraph'
                      owners = receipt['semantic_owners']
                      assert owners['identity_exact'] is True
                      assert owners['pg'] == 'experiments._v030_canonical_prefixgraph'
                      assert owners['g04'] == 'experiments._v030_canonical_shared_portfolio'
                      assert owners['reader'] == 'experiments._v030_canonical_release_reader_policy'
                  assert serialized['inline_executor_submissions'] == 2
                  assert concurrent['archive_bytes'] == serialized['archive_bytes']
                  assert concurrent['archive_sha256'] == serialized['archive_sha256']
                  assert concurrent['verified_tree_sha256'] == serialized['verified_tree_sha256']
              assert data['decision'] in {'supports-concurrency-lifetime-ownership','retires-concurrency-primary-explanation','ambiguous'}
          else:
              assert data['worker_failures'], 'invalid v2 evidence must preserve concrete failures'
              raise SystemExit('candidate scheduling RSS v2 is invalid; inspect worker_failures')
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-candidate-scheduling-rss-v2.yml
      - name: Upload exact A/B v2 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-candidate-scheduling-rss-v2-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-candidate-scheduling-rss-v2.json
          if-no-files-found: error
          retention-days: 90

# Superseding diagnostic only. V1 remains immutable invalid evidence. V2 repairs identity-domain proof and
# custody topology without changing the A/B question, thresholds, production scheduling, or release state.
