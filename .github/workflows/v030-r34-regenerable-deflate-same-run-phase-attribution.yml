name: CMPCT v0.30 R34 same-run residual phase attribution
# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
# Diagnostic only. R34 supersedes R33's failed cross-run identity premise without changing R32's causal question.

on:
  pull_request:
    paths:
      - 'benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution.py'
      - 'docs/v030-rnd/R33_REGENERABLE_DEFLATE_RESIDUAL_PHASE_ATTRIBUTION_RESULT.md'
      - 'docs/v030-rnd/R34_REGENERABLE_DEFLATE_SAME_RUN_PHASE_ATTRIBUTION_PREREG.md'
      - '.github/workflows/v030-r34-regenerable-deflate-same-run-phase-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify-latest-head:
    runs-on: ubuntu-24.04
    concurrency:
      group: cmpct-v030-r34-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_receipt: ${{ steps.scope.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        name: Classify exact latest-head commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution\.py|docs/v030-rnd/R33_REGENERABLE_DEFLATE_RESIDUAL_PHASE_ATTRIBUTION_RESULT\.md|docs/v030-rnd/R34_REGENERABLE_DEFLATE_SAME_RUN_PHASE_ATTRIBUTION_PREREG\.md|\.github/workflows/v030-r34-regenerable-deflate-same-run-phase-attribution\.yml)$'; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_receipt=false' >> "$GITHUB_OUTPUT"
          fi

  r34-attribution:
    needs: classify-latest-head
    if: needs.classify-latest-head.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: cmpct-v030-r34-attribution-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 96

      - name: Bind frozen R32 product/corpus and R34 scientific grammar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 0b1f3cd653f0e2489964b93cdd19fa8324adda2e HEAD
          for path in \
            src/cmpct/builder.py \
            src/cmpct/codec.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/neutral_hostile_corpus_v1.py \
            benchmarks/neutral_hostile_determinism_repair_v1.py \
            benchmarks/v030_release_ablation_canonical.py \
            benchmarks/v030_r32_regenerable_deflate_output_dead_zstd_elision.py; do
            test "$(git rev-parse 0b1f3cd653f0e2489964b93cdd19fa8324adda2e:$path)" = "$(git rev-parse HEAD:$path)" || { echo "R34 R32-substrate drift: $path" >&2; exit 1; }
          done
          for path in \
            benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution.py \
            docs/v030-rnd/R34_REGENERABLE_DEFLATE_SAME_RUN_PHASE_ATTRIBUTION_PREREG.md; do
            test "$(git rev-parse da24871f7cabcb5b47ccefc62cf2f36c14a4c1fa:$path)" = "$(git rev-parse HEAD:$path)" || { echo "Frozen R34 grammar drift: $path" >&2; exit 1; }
          done

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile frozen instrument
        run: python -m py_compile benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution.py

      - name: Run frozen same-run attribution
        env:
          CMPCT_EVIDENCE_HEAD: ${{ env.EVIDENCE_HEAD }}
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r34_regenerable_deflate_same_run_phase_attribution.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/r34-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/r34-phase-attribution.json"

      - name: Enforce frozen R34 completeness and decision law
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('benchmark-artifacts/r34-phase-attribution.json').read_text())
          assert d['schema'] == 'cmpct-v030-r34-regenerable-deflate-same-run-phase-attribution-v1'
          assert d['evidence_head'] == os.environ['EVIDENCE_HEAD']
          assert d['repetitions'] == 3
          assert set(d['targets']) == {'full-backups', 'nested-only'}
          assert d['decision'] in {
              'PHASE_OWNER_LOCALIZED',
              'RESIDUAL_DISTRIBUTED_OR_BELOW_ATTRIBUTION_FLOOR',
              'SUBSTRATE_OR_SAME_RUN_IDENTITY_FAILURE',
          }
          env = d['environment']
          assert env['python_version']
          assert env['python_implementation']
          assert env['platform']
          assert env['zlib_compile_version']
          assert env['zlib_runtime_version']
          assert env['zstandard_version']
          expected_arms = {'release-all-exact', 'full-search', 'no-ordinary-zstd'}
          for target in d['targets'].values():
              assert set(target['arms']) == expected_arms
              for arm in target['arms'].values():
                  assert len(arm['repetitions']) == 3
                  assert all(row['strong_verify_ok'] for row in arm['repetitions'])
                  if d['decision'] != 'SUBSTRATE_OR_SAME_RUN_IDENTITY_FAILURE':
                      assert arm['deterministic_within_run']
              if d['decision'] != 'SUBSTRATE_OR_SAME_RUN_IDENTITY_FAILURE':
                  assert target['full_search_no_zstd_byte_identity']
                  assert target['candidate_strictly_smaller_than_release']
          if d['decision'] == 'PHASE_OWNER_LOCALIZED':
              assert d['same_run_identity_ok']
              assert d['localized_owners']
              assert all(
                  x['nested_internal_delta_s'] >= 0.010 and x['full_internal_delta_s'] > 0
                  for x in d['localized_owners']
              )
          elif d['decision'] == 'RESIDUAL_DISTRIBUTED_OR_BELOW_ATTRIBUTION_FLOOR':
              assert d['same_run_identity_ok']
              assert not d['localized_owners']
          else:
              assert not d['same_run_identity_ok']
          PY

      - name: Upload immutable R34 evidence
        uses: actions/upload-artifact@v6
        with:
          name: v030-r34-same-run-phase-attribution-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/r34-phase-attribution.json
          if-no-files-found: error
          retention-days: 90
