# ci-lane: deep
name: CMPCT v0.30 ZIP-factor parallel build oracle

on:
  pull_request:
    paths:
      - 'experiments/entropygraph_v030_zipfactor_parallel_build.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'benchmarks/v030_zipfactor_parallel_build_oracle.py'
      - 'tests/test_v030_zipfactor_parallel_build.py'
      - '.github/workflows/v030-zipfactor-parallel-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v030-zf-parallel-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  zipfactor-parallel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile scheduling surface
        run: |
          python -m py_compile experiments/entropygraph_v030_zipfactor_parallel_build.py
          python -m py_compile benchmarks/v030_zipfactor_parallel_build_oracle.py
      - name: Ratchet exact byte and reader identity
        run: python -m pytest -q tests/test_v030_zipfactor_parallel_build.py tests/test_v030_zipfactor_compact_v3.py
      - name: Run repeated exact-byte creation frontier
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_zipfactor_parallel_build_oracle \
            --work-root benchmark-artifacts/v030-zf-parallel-work \
            --output benchmark-artifacts/v030-zf-parallel.json
      - name: Independently enforce exactness and promotion decision
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-zf-parallel.json')
          assert p.exists(), 'parallel ZIP-factor evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-zipfactor-parallel-build-oracle-v2'
          assert d['rounds']==9
          assert d['level']==3
          assert d['workers']==4
          assert d['claim_boundary'].startswith('research scheduling decision only')
          assert d['source_regular_identities'], 'independent source identity set missing'
          g=d['gate']; s=d['serial']; q=d['parallel']; decision=d['decision']
          assert g['serial_exact'] is True
          assert g['parallel_exact_to_serial'] is True
          assert g['verified_user_identities_match_independent_source'] is True
          assert s['archive_bytes']==q['archive_bytes']
          assert s['archive_sha256']==q['archive_sha256']
          perf = (
              g['parallel_strictly_faster_than_serial'] and
              g['parallel_strictly_smaller_than_zip'] and
              g['parallel_strictly_smaller_than_zstd19'] and
              g['parallel_strictly_faster_than_zip'] and
              g['parallel_strictly_faster_than_zstd19']
          )
          assert decision['research_evidence_valid'] is True
          assert decision['promotion_earned'] is perf
          assert decision['verdict']==('promote' if perf else 'reject')
          if decision['promotion_earned']:
              assert g['parallel_strictly_faster_than_serial'] is True
              assert g['parallel_strictly_smaller_than_zip'] is True
              assert g['parallel_strictly_smaller_than_zstd19'] is True
              assert g['parallel_strictly_faster_than_zip'] is True
              assert g['parallel_strictly_faster_than_zstd19'] is True
          else:
              assert not perf, 'rejected scheduling must have a measured performance miss'
          Path('benchmark-artifacts/v030-zf-parallel-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-parallel-build.yml
      - name: Upload scheduling evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zf-parallel-build-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-zf-parallel.json
            benchmark-artifacts/v030-zf-parallel-candidate.txt
          if-no-files-found: warn
          retention-days: 90
