# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 PrefixGraph optimistic structural floor

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_prefixgraph_optimistic_floor_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_prefixgraph.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - '.github/workflows/v030-prefixgraph-optimistic-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-prefixgraph-optimistic-floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_(prefixgraph_optimistic_floor_oracle|external_competitors|release_performance)\.py|experiments/entropygraph_v030_(prefixgraph|product_fs|canonical_final_impl)\.py|\.github/workflows/v030-prefixgraph-optimistic-floor\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect the PrefixGraph structural floor.'
          fi

  floor-oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Compile exact structural-floor instrument
        run: python -m py_compile benchmarks/v030_prefixgraph_optimistic_floor_oracle.py
      - name: Run impossible-best-case Shifted PrefixGraph floor
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_prefixgraph_optimistic_floor_oracle \
            --work-root "$RUNNER_TEMP/v030-prefixgraph-floor" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-prefixgraph-floor.json"
      - name: Enforce lower-bound interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-prefixgraph-floor.json').read_text())
          assert d['schema']=='cmpct-v030-prefixgraph-optimistic-structural-floor-v1'
          assert d['diagnosis']=='D4'
          assert d['instrument_radicality']=='R0'
          assert d['research_priority_score'] >= 80
          assert d['nominated_anchors'] > 0
          assert d['exact_prefix_trials'] > 0
          assert d['optimistic_metadata_bytes_charged'] == 0
          assert d['optimistic_allows_unrealizable_anchor_reuse'] is True
          assert d['optimistic_ignores_minimum_prefix_saving'] is True
          assert d['optimistic_fixed_framing_floor_bytes'] <= d['shipping_prefixgraph_bytes']
          assert d['zstd19_bytes'] > 0 and d['zip_bytes'] > 0
          assert d['tree_sha256'] == d['verified_tree_sha256']
          assert d['release_credit'] is False
          if d['optimistic_floor_strictly_beats_zstd19']:
              assert d['decision']=='ITERATE_SAME_FAMILY'
          else:
              assert d['decision']=='ESCALATE_RADICALITY'
              assert d['minimum_primary_radicality_if_floor_fails']=='R4'
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-prefixgraph-optimistic-floor.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact structural-floor evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-prefixgraph-optimistic-floor-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-prefixgraph-floor.json
          if-no-files-found: error
          retention-days: 90

# R0 structural disproof instrument. The impossible-best-case floor intentionally underprices every realizable
# PrefixGraph archive; therefore only a floor that still fails Zstd-19 is a proof. Headroom is hypothesis evidence,
# never release credit. A failed floor forces R4 representation invention rather than more scalar PrefixGraph tuning.
