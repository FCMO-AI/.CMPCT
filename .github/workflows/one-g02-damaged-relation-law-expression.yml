name: ONE-G0.2 damaged relation Law expression

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_damaged_relation_law_expression.py'
      - 'benchmarks/one/one_g02_temporal_adjacency_writer_integration.py'
      - 'benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py'
      - 'experiments/one/ir.py'
      - 'experiments/one/vm.py'
      - 'experiments/one/wire.py'
      - 'docs/one/evidence/ONE_G02_DAMAGED_RELATION_LAW_EXPRESSION_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-damaged-relation-law-expression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  damaged-relation-law-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen damaged relation Law-expression gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          python -m benchmarks.one.one_g02_damaged_relation_law_expression | tee one-g02-damaged-relation-law-expression.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-damaged-relation-law-expression-${{ github.sha }}
          path: one-g02-damaged-relation-law-expression.json
          if-no-files-found: error
