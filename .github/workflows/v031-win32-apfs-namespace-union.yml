# ci-lane: fast
# Cross-owner source composition: original Windows/APFS test files remain unchanged.
name: CMPCT v0.31 Win32 and APFS Namespace Union

on:
  pull_request:
    paths:
      - 'src/cmpct/path_policy.py'
      - 'src/cmpct/reader.py'
      - 'tests/test_v031_windows_member_namespace.py'
      - 'tests/test_v031_apfs_namespace.py'
      - 'tests/test_v031_win32_apfs_union.py'
      - '.github/workflows/v031-win32-apfs-namespace-union.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-win32-apfs-union-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-exact-namespace-union:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Reject stale source binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "EXACT_HEAD=$EVIDENCE_HEAD"
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real CMPCT and pytest
        run: python -m pip install -e ".[test]"
      - name: Unchanged original owner courts plus joint invariant test
        # --noconftest avoids unrelated historical Linux-only library imports on Windows.
        # No test assertions or original test modules are skipped by workflow selection;
        # platform-specific pytest.skipif markers remain visible in host results.
        run: python -m pytest -q -rs --noconftest tests/test_path_policy.py tests/test_v031_windows_member_namespace.py tests/test_v031_apfs_namespace.py tests/test_v031_win32_apfs_union.py
      - name: Preserve exact candidate and platform provenance
        if: always()
        shell: bash
        run: |
          echo "SOURCE=$(git rev-parse HEAD)"
          python -c "import os, platform, sys; print('HOST', os.name, platform.platform(), sys.version)"
