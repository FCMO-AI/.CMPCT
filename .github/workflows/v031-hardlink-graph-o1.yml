# ci-lane: fast
name: CMPCT v0.31 signed hardlink graph O1
on:
  pull_request:
    paths:
      - 'src/cmpct/validation.py'
      - 'tests/test_v031_hardlink_graph_budget.py'
      - 'experiments/v031_hardlink_chain_preflight_abba.py'
      - '.github/workflows/v031-hardlink-graph-o1.yml'
      - 'docs/v031-research/2026-10-24-hardlink-chain-preflight-o1-prereg.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-hardlink-preflight-o1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  signed-hardlink-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "EXACT_GRAPH_SOURCE=$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real CMPCT package
        run: python -m pip install -e ".[test]"
      - name: Execute source-bound real-wire signed graph court
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -rs tests/test_v031_hardlink_graph_budget.py tests/test_v031_signed_tree_preflight.py 2>&1 | tee hardlink-graph-o1.log
      - name: Same-runner source-exact signed-archive ABBA and allocation probe
        shell: bash
        run: |
          set -euo pipefail
          python -u experiments/v031_hardlink_chain_preflight_abba.py 2>&1 | tee hardlink-graph-o1-abba.log
      - name: Preserve source-bound logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardlink-graph-o1-${{ github.sha }}
          path: |
            hardlink-graph-o1.log
            hardlink-graph-o1-abba.log
            hardlink-graph-o1-abba.json
          if-no-files-found: warn
          retention-days: 30
