# ci-lane: fast
# J24B03-M2 upper-scale evidence instrument only. No change to historical H negative, product
# release gate, comparator semantics, or frozen threshold.
name: CMPCT v031 J24B03-M2 upper-scale direct session veto
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'src/cmpct/validation.py'
      - 'research/j24b03_m2_upper_scale_cost.py'
      - 'research/j24b03_m2_upper_scale_referee.py'
      - 'docs/v031-research/2026-10-27-j24b03-m2-upper-scale-prereg.md'
      - '.github/workflows/v031-j24b03-m2-upper-scale-economics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  direct-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FCMO-AI/.CMPCT
          ref: 80c358f8824ec1b20d349c92ed94c898090969b0
          path: frozen-baseline
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install both actual source trees and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e './frozen-baseline[test]'
          python -m pip install -e '.[test]'
      - name: Pin candidate and unchanged published source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C frozen-baseline rev-parse HEAD)" = 80c358f8824ec1b20d349c92ed94c898090969b0
          mkdir -p benchmark-artifacts
          git rev-parse HEAD > benchmark-artifacts/candidate-head.txt
          git hash-object src/cmpct/reader.py > benchmark-artifacts/candidate-reader-blob.txt
          git hash-object src/cmpct/validation.py > benchmark-artifacts/candidate-validator-blob.txt
          git -C frozen-baseline hash-object src/cmpct/reader.py > benchmark-artifacts/frozen-reader-blob.txt
          git -C frozen-baseline hash-object src/cmpct/validation.py > benchmark-artifacts/frozen-validator-blob.txt
      - name: Independently repeated same-wire full Reader session ABBA
        shell: bash
        run: |
          set -euo pipefail
          python research/j24b03_m2_upper_scale_cost.py --run
          python research/j24b03_m2_upper_scale_referee.py benchmark-artifacts/j24b03-m2-results.json --out benchmark-artifacts/j24b03-m2-referee.json
      - name: Topology discipline
        run: python tools/check_ci_topology.py .github/workflows/v031-j24b03-m2-upper-scale-economics.yml
      - name: Preserve original source-locked measurements regardless of conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b03-m2-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
