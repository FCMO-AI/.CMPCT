# ci-lane: deep
name: CMPCT v0.30 ZIP-factor native verification oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_zipfactor_native_verify_oracle.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'native/cmpct-portable/**'
      - '.github/workflows/v030-zipfactor-native-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  native-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile oracle and portable reader
        run: |
          python -m py_compile benchmarks/v030_zipfactor_native_verify_oracle.py
          cargo build --release --manifest-path native/cmpct-portable/Cargo.toml --bin cmpct-portable
      - name: Preserve ZIP-factor native correctness before timing
        run: |
          cargo fmt --manifest-path native/cmpct-portable/Cargo.toml -- --check
          cargo clippy --manifest-path native/cmpct-portable/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/cmpct-portable/Cargo.toml zipfactor -- --nocapture
      - name: Run exact Python-vs-native verification A/B
        run: |
          python -m benchmarks.v030_zipfactor_native_verify_oracle \
            --work-root "$RUNNER_TEMP/v030-zipfactor-native-verify" \
            --native-binary "$GITHUB_WORKSPACE/native/cmpct-portable/target/release/cmpct-portable" \
            --output "$RUNNER_TEMP/v030-zipfactor-native-verify.json"
      - name: Ratchet identity, hostile rejection and promotion boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v030-zipfactor-native-verify.json'
          e=json.loads(p.read_text())
          assert e['schema']=='cmpct-v030-zipfactor-native-verify-oracle-v1'
          c=e['contract']
          assert c['rounds']==5
          assert c['minimum_native_verify_speedup']==0.20
          assert c['native_compile_inside_timing'] is False
          assert c['native_process_startup_inside_timing'] is True
          assert c['archive_bytes_changed'] is False
          assert c['selector_change'] is False and c['release_credit'] is False
          assert e['candidate']['profile']=='zipfactor-binary-v3'
          assert e['candidate']['revision']=='25'
          assert float(e['candidate']['max_member_read_amplification']) <= 8.0
          assert int(e['candidate']['max_decode_unit_bytes']) <= 8*1024*1024
          assert len(e['python_verify_samples_s'])==5
          assert len(e['native_verify_samples_s'])==5
          assert e['native_rejects_corruption'] is True
          assert e['experiment_valid'] is True
          assert e['release_credit'] is False
          if e['promotion_signal']:
              assert float(e['native_verify_speedup']) >= 0.20
              assert float(e['native_verify_median_s']) < float(e['python_verify_median_s'])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-zipfactor-native-verify
          path: ${{ runner.temp }}/v030-zipfactor-native-verify.json
          if-no-files-found: warn
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-native-verify.yml

# Research-only A/B. A positive result identifies the native verification path to productize;
# it does not itself change selector behavior or earn release credit.
