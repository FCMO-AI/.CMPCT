# ci-lane: deep
# exact-source rerun after timing-boundary hostile review
name: ONE-G0.2 local Gear certificate native carrying cost

on:
  push:
    branches: [research/cmpct1]
    paths:
      - 'benchmarks/one/native/one_g02_local_gear_certificate_carrying_cost.c'
      - 'benchmarks/one/one_g02_local_gear_certificate_native_carrying_cost.py'
      - 'benchmarks/one/one_g02_gear_replacement_ab.py'
      - 'docs/one/prereg/ONE_G02_LOCAL_GEAR_CERTIFICATE_NATIVE_CARRYING_COST_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-local-gear-certificate-native-carrying-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-g02-local-gear-cert-cost-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native-carrying-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Strict native compile smoke
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            benchmarks/one/native/one_g02_local_gear_certificate_carrying_cost.c \
            -o /tmp/one-g02-cert-cost.so
      - name: Frozen native carrying-cost falsifier
        id: falsifier
        shell: bash
        run: |
          set +e
          python -m benchmarks.one.one_g02_local_gear_certificate_native_carrying_cost \
            | tee one-g02-local-gear-certificate-native-carrying-cost.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > one-g02-local-gear-certificate-native-carrying-cost.rc
          exit 0
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-local-gear-certificate-native-carrying-cost-${{ github.sha }}
          path: |
            one-g02-local-gear-certificate-native-carrying-cost.json
            one-g02-local-gear-certificate-native-carrying-cost.rc
          if-no-files-found: error
      - name: Enforce preregistered decision
        shell: bash
        run: |
          rc=$(cat one-g02-local-gear-certificate-native-carrying-cost.rc)
          if [ "$rc" -ne 0 ]; then
            echo 'Preregistered carrying-cost gate rejected the present certificate shape.' >&2
            exit "$rc"
          fi
