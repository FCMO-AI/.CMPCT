# ci-lane: fast
name: CMPCT v0.31 same-path micropack economics O8c

on:
  pull_request:
    paths:
      - 'tests/native_pack_samepath_o8c.py'
      - 'tests/native_pack_heldout_o8.py'
      - 'tests/native_pack_heldout_o8b.py'
      - 'tests/native_pack_consumer_o7.c'
      - 'docs/v031-research/NATIVE_PACK_HELDOUT_O8C_PREREG.md'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/codec.py'
      - '.github/workflows/v031-native-pack-samepath-o8c.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-native-pack-samepath-o8c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  samepath-native-c-consumer-o8c:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify prospectively frozen O8c and original product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch docs/v031-research/NATIVE_PACK_HELDOUT_O8C_PREREG.md tests/native_pack_samepath_o8c.py tests/native_pack_consumer_o7.c
          python -m py_compile tests/native_pack_samepath_o8c.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build immutable native core and public C11 client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml -- --check
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
          cc -std=c11 -O2 -Wall -Wextra -Werror -I. tests/native_pack_consumer_o7.c -Lnative/cmpct-core/target/release -lcmpct_core -Wl,-rpath,"$PWD/native/cmpct-core/target/release" -o /tmp/cmpct-native-c-consumer-o8c
      - name: Full same-path Builder ABBA and exact native C reconstruction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-pack-o8c"
          python tests/native_pack_samepath_o8c.py /tmp/cmpct-native-c-consumer-o8c "$RUNNER_TEMP/cmpct-native-pack-o8c/result.json" | tee "$RUNNER_TEMP/cmpct-native-pack-o8c/log.txt"
          sha256sum "$RUNNER_TEMP/cmpct-native-pack-o8c/result.json" > "$RUNNER_TEMP/cmpct-native-pack-o8c/result.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c-samepath-o8c-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-pack-o8c/
          if-no-files-found: warn
          retention-days: 30
