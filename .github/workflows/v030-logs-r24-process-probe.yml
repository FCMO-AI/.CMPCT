# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: v0.30 Logs r24 process ownership probe

on:
  push:
    branches:
      - agent/v030-r24-process-productization
    # Exact-receipt preservation is intentionally narrow: do not reserve an
    # expensive run for unrelated commits on this long-lived research branch.
    paths:
      - ".github/workflows/v030-logs-r24-process-probe.yml"
      - ".github/v030-logs-r24-process-probe.token"
      - "benchmarks/v030_logs_r24_process_probe.py"
      - "benchmarks/v030_logs_r24_process_worker_probe.py"
      - "experiments/entropygraph_v030_r24_process_prebuild.py"
      - "experiments/entropygraph_v030_r24_process_shipping.py"
      - "experiments/entropygraph_v030_release_product.py"
      - "src/cmpct/**"
  workflow_dispatch:

permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: v030-logs-r24-process-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project and frozen corpus dependencies
        run: |
          # Mirror the established neutral-hostile corpus environment as one
          # dependency surface instead of discovering imports one failure at a time.
          sudo apt-get update
          sudo apt-get install -y zstd gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install \
            pillow==12.3.0 \
            reportlab==5.0.0 \
            python-docx==1.2.0 \
            openpyxl==3.1.5 \
            python-pptx==1.0.2 \
            numpy==2.4.6
      - name: Build native core when available
        run: cargo build --manifest-path native/cmpct-core/Cargo.toml --release --locked
      - name: Run unchanged canonical-v2 thresholds with ownership probe
        run: |
          mkdir -p benchmark-artifacts
          set +e
          set -o pipefail
          # Execute from the repository root as a module so the benchmark package is
          # importable without adding an ad-hoc PYTHONPATH that could mask packaging bugs.
          python -m benchmarks.v030_logs_r24_process_probe \
            --work-root benchmark-artifacts/v030-logs-r24-process-probe-work \
            --output benchmark-artifacts/v030-logs-r24-process-probe.json \
            2>&1 | tee benchmark-artifacts/v030-logs-r24-process-probe.log
          rc=$?
          set -e
          if test -s benchmark-artifacts/v030-logs-r24-process-probe.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmark-artifacts/v030-logs-r24-process-probe.json')
          r = json.loads(p.read_text())
          assert r['probe']['product_credit'] is False
          assert r['probe']['thresholds_changed'] is False
          print(json.dumps({'gate': r['gate'], 'totals': r['totals']}, indent=2))
          PY
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-logs-r24-process-probe-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-logs-r24-process-probe.json
            benchmark-artifacts/v030-logs-r24-process-probe.log
          if-no-files-found: error
