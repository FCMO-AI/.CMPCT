# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Shifted serialized-metadata causal v2

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'docs/v030-rnd/R25_SHIFTED_SERIALIZED_METADATA_CAUSAL_V2_PREREG.md'
      - 'benchmarks/v030_shifted_serialized_metadata_causal_v2.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v030-shifted-serialized-metadata-causal-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/v030-rnd/R25_SHIFTED_SERIALIZED_METADATA_CAUSAL_V2_PREREG.md'
      - 'benchmarks/v030_shifted_serialized_metadata_causal_v2.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'src/cmpct/builder.py'
      - '.github/workflows/v030-shifted-serialized-metadata-causal-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-shifted-serialized-metadata-v2-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(docs/v030-rnd/R25_SHIFTED_SERIALIZED_METADATA_CAUSAL_V2_PREREG\.md|benchmarks/v030_shifted_serialized_metadata_causal_v2\.py|benchmarks/v030_release_performance\.py|benchmarks/v030_release_generalization\.py|benchmarks/resemblance_hostile_corpus_v1\.py|experiments/entropygraph_v030_release_product\.py|src/cmpct/builder\.py|\.github/workflows/v030-shifted-serialized-metadata-causal-v2\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  causal-check:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: cmpct-v030-shifted-serialized-metadata-v2-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen causal instrument
        run: python -m py_compile benchmarks/v030_shifted_serialized_metadata_causal_v2.py
      - name: Run fresh versus fixed-mtime serialized-metadata check
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_shifted_serialized_metadata_causal_v2 \
            --work-root "$RUNNER_TEMP/v030-shifted-serialized-metadata-causal-v2" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-shifted-serialized-metadata-causal-v2.json"
      - name: Ratchet frozen contract and decision vocabulary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-shifted-serialized-metadata-causal-v2.json').read_text())
          assert d['schema']=='cmpct-v030-shifted-serialized-metadata-causal-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']==['resemblance_hostile_v1','01_shifted_versions']
          assert d['repetitions_per_arm']==3
          assert d['fixed_mtime_ns']==1767225600000000000
          assert d['experiment_valid'] is True and d['failures']==[]
          assert d['decision'] in {'SHIFTED_MTIME_SERIALIZED_METADATA_CAUSAL_SUPPORTED','SHIFTED_MTIME_SERIALIZED_METADATA_NOT_SUFFICIENT'}
          assert d['contract']['historical_content_identity_must_not_change'] is True
          assert d['contract']['metadata_intervention']=='atime+mtime only'
          assert d['contract']['release_thresholds_changed'] is False
          assert d['release_credit'] is False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-shifted-serialized-metadata-causal-v2.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Record exact candidate fingerprint
        if: always()
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-shifted-serialized-metadata-causal-v2-candidate.txt
      - name: Upload exact causal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-shifted-serialized-metadata-causal-v2-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-shifted-serialized-metadata-causal-v2.json
            benchmark-artifacts/v030-shifted-serialized-metadata-causal-v2-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# D2/Custody only. This explains fixture identity drift or retires the mtime sufficiency claim; it grants zero release credit.
