# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT J24P07 portable wheel installed-target injectivity
on:
  pull_request:
    paths:
      - "tools/validate_wheel_target_injectivity.py"
      - "tests/test_wheel_target_injectivity.py"
      - "docs/v031-research/*j24p07*"
      - ".github/workflows/j24p07-wheel-target-injectivity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24p07-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  latest-head-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_court: ${{ steps.scope.outputs.run_court }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(tools/validate_wheel_target_injectivity\.py|tests/test_wheel_target_injectivity\.py|\.github/workflows/j24p07-wheel-target-injectivity\.yml|docs/v031-research/.*j24p07.*)$'; then
            echo 'run_court=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_court=false' >> "$GITHUB_OUTPUT"
          fi
  inert-installed-target-court:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_court == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Real pip spread and 22 portable wheel-byte controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m unittest discover -s tests -p test_wheel_target_injectivity.py -v 2>&1 | tee j24p07-test-log.txt
      - name: Record exact script/test/source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          paths = ['tools/validate_wheel_target_injectivity.py', 'tests/test_wheel_target_injectivity.py']
          receipt = {'source_sha': os.environ['EVIDENCE_HEAD'], 'platform': platform.platform(),
                     'python': sys.version, 'files_sha256': {
                     p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('j24p07-source-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True))
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve source-bound hosted log and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24p07-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: |
            j24p07-test-log.txt
            j24p07-source-receipt.json
          if-no-files-found: warn
          retention-days: 30
