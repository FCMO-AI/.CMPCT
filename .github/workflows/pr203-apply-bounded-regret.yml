name: PR203 apply bounded-regret search order

on:
  push:
    branches:
      - agent/v030-deflate-bounded-regret-productization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'openai[bot]' || github.actor == 'Magyarmex' || github.actor == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-deflate-bounded-regret-productization
          fetch-depth: 0
      - name: Apply exact bounded-regret mutation and self-delete
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/cmpct/codec.py')
          s = p.read_text()
          old = '    for level in range(10):\n'
          new = '    for level in (6,0,1,2,3,4,5,7,8,9):\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one canonical search loop, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/pr203-apply-bounded-regret.yml
          git diff --check
          git diff --exit-code -- src/cmpct/codec.py >/dev/null && { echo 'codec mutation missing' >&2; exit 1; } || true
          test ! -e .github/workflows/pr203-apply-bounded-regret.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cmpct/codec.py .github/workflows/pr203-apply-bounded-regret.yml
          git commit -m 'perf: try common exact Deflate level first'
          git push origin HEAD:agent/v030-deflate-bounded-regret-productization
