# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 outer product scheduling RSS A/B

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_outer_product_scheduling_rss_*.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'docs/v030-rnd/R25_OUTER_PRODUCT_SCHEDULING_RSS_PREREG.md'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_RESULT.md'
      - '.github/workflows/v030-r25-outer-product-scheduling-rss.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_outer_product_scheduling_rss_*.py'
      - 'benchmarks/v030_release_performance.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'docs/v030-rnd/R25_OUTER_PRODUCT_SCHEDULING_RSS_PREREG.md'
      - 'docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_RESULT.md'
      - '.github/workflows/v030-r25-outer-product-scheduling-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r25-outer-product-scheduling-rss-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_outer_product_scheduling_rss_.*\.py$|benchmarks/v030_release_(performance|generalization)\.py$|docs/v030-rnd/R25_OUTER_PRODUCT_SCHEDULING_RSS_PREREG\.md$|docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_RESULT\.md$|\.github/workflows/v030-r25-outer-product-scheduling-rss\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  outer-product-scheduling-rss:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-r25-outer-product-scheduling-rss-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen outer scheduling A/B
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile \
            benchmarks/v030_r25_outer_product_scheduling_rss_worker.py \
            benchmarks/v030_r25_outer_product_scheduling_rss_oracle.py \
            experiments/entropygraph_v030_canonical_final.py \
            experiments/entropygraph_v030_release_product.py
      - name: Run outer product scheduling RSS A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_outer_product_scheduling_rss_oracle.py \
            --work-root benchmark-artifacts/v030-r25-outer-product-scheduling-rss-work \
            --output benchmark-artifacts/v030-r25-outer-product-scheduling-rss.json
      - name: Ratchet frozen claim boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r25-outer-product-scheduling-rss.json')
          assert p.is_file(), 'outer scheduling RSS evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r25-outer-product-scheduling-rss-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['preregistration']=='docs/v030-rnd/R25_OUTER_PRODUCT_SCHEDULING_RSS_PREREG.md'
          assert d['causal_predecessor']=='docs/v030-rnd/R25_CANDIDATE_SCHEDULING_RSS_V3_RESULT.md'
          assert d['release_credit'] is False
          c=d['contract']
          assert c['outer_product_executor_only'] is True
          assert c['r24_prebuild_overlap_unchanged'] is True
          assert c['inner_r25_scheduling_unchanged'] is True
          assert c['exact_complete_product_identity_required'] is True
          assert c['fresh_process_per_measurement'] is True
          assert c['total_peak_rss_is_causal_metric'] is True
          assert c['decision_thresholds_changed'] is False
          assert c['production_source_changed'] is False
          assert d['experiment_valid'] is True, d.get('worker_failures')
          assert d['worker_failures']==[]
          for row in d['repetitions']:
            a,b=row['concurrent'],row['serialized']
            assert a['intercepted_product_executor_constructions']==0
            assert a['intercepted_product_submissions']==0
            assert b['intercepted_product_executor_constructions']==1
            assert b['intercepted_product_submissions']==2
            assert a['r24_prebuild_executor_patched'] is b['r24_prebuild_executor_patched'] is False
            assert a['inner_r25_executor_patched'] is b['inner_r25_executor_patched'] is False
            assert a['canonical_executor_restored'] is b['canonical_executor_restored'] is True
            for key in ('archive_bytes','archive_sha256','tree_sha256','selected','format_revision','r24_product_bytes','r25_product_bytes'):
              assert a[key]==b[key], (key,a.get(key),b.get(key))
            assert a['r25_attempted'] is not False and b['r25_attempted'] is not False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-outer-product-scheduling-rss.yml
      - name: Upload exact outer scheduling evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-outer-product-scheduling-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-outer-product-scheduling-rss.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. No release credit and no production scheduling change is authorized by this lane alone.
