# ci-lane: research-diagnostic
name: CMPCT1 ONE-G0.3 statistical Law opportunity

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - '.github/workflows/one-g03-statistical-law-opportunity.yml'
      - 'benchmarks/one/one_g03_statistical_law_opportunity.py'
      - 'tests/one/test_g03_statistical_law_opportunity.py'
      - 'docs/one/prereg/ONE_G03_STATISTICAL_LAW_OPPORTUNITY_PREREG_2026-09-11.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-g03-statistical-law-opportunity
  cancel-in-progress: false

jobs:
  statistical-law-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg
          python -m pip install -e '.[test]'

      - name: Run hostile unit tests
        run: python -m pytest -q tests/one/test_g03_statistical_law_opportunity.py

      - name: Run exact 15-workload statistical-Law opportunity diagnostic
        run: |
          mkdir -p "$RUNNER_TEMP/one-g03-statistical"
          python -m benchmarks.one.one_g03_statistical_law_opportunity \
            --work-root "$RUNNER_TEMP/one-g03-statistical/workloads" \
            --output "$RUNNER_TEMP/one-g03-statistical/result.json"

      - name: Validate claim boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['RUNNER_TEMP'])/'one-g03-statistical/result.json').read_text())
          assert p['schema'] == 'cmpct-one-g03-statistical-law-opportunity-v1'
          assert len(p['rows']) == 15
          assert p['genesis_scoring_executed'] is False
          assert p['winner_selected'] is False
          assert p['gate']['decision'] in {'ADVANCE_STATISTICAL_LAW_RESEARCH', 'HOLD_STATISTICAL_LAW_RESEARCH'}
          assert all(r['measurement']['observation_passes'] == 1 for r in p['rows'])
          assert all(r['measurement']['measured_bytes'] == r['logical_bytes'] for r in p['rows'])
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-one-g03-statistical-law-opportunity-${{ github.run_id }}
          path: ${{ runner.temp }}/one-g03-statistical/result.json
          if-no-files-found: warn
          retention-days: 90
