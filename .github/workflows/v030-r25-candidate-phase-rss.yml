# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r25 candidate phase RSS oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_candidate_phase_rss_*.py'
      - '.github/workflows/v030-r25-candidate-phase-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r25-candidate-phase-rss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_candidate_phase_rss_.*\.py$|\.github/workflows/v030-r25-candidate-phase-rss\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  candidate-phase-rss:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact candidate ownership surfaces
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile \
            benchmarks/v030_r25_candidate_phase_rss_worker.py \
            benchmarks/v030_r25_candidate_phase_rss_oracle.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release_product.py
      - name: Measure G0-G4 and PrefixGraph RSS ownership in fresh processes
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_candidate_phase_rss_oracle.py \
            --work-root benchmark-artifacts/v030-r25-candidate-phase-rss-work \
            --output benchmark-artifacts/v030-r25-candidate-phase-rss.json
      - name: Ratchet diagnostic-only evidence boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('benchmark-artifacts/v030-r25-candidate-phase-rss.json')
          assert path.is_file(), 'candidate-phase RSS oracle did not publish evidence'
          data=json.loads(path.read_text())
          assert data['schema']=='cmpct-v030-r25-candidate-phase-rss-v1'
          assert data['source_commit']==os.environ['EVIDENCE_HEAD']
          assert data['promotion_signal'] is False
          assert data['selector_change'] is False
          assert data['release_credit'] is False
          assert len(data['rows'])==2
          contract=data['contract']
          assert contract['fresh_process_per_measurement'] is True
          assert contract['worker_failure_output_is_durable'] is True
          assert contract['strong_verification_outside_pack_timer'] is True
          assert contract['candidate_bytes_are_not_combined_or_credited'] is True
          for key in ('selector_changed','admission_changed','scheduling_changed','grammar_changed','integrity_changed','locality_limit_changed','decode_unit_limit_changed','recovery_changed'):
              assert contract[key] is False
          if data['experiment_valid'] is True:
              assert data['worker_failures']==[]
              for row in data['rows']:
                  assert row['shipping_median_incremental_peak_rss_kib'] is not None
                  assert row['g04_median_incremental_peak_rss_kib'] is not None
                  assert len(row['repetitions'])==2
          else:
              assert data['worker_failures'], 'invalid evidence must preserve a concrete worker failure'
              raise SystemExit('candidate-phase RSS evidence is invalid; inspect preserved worker_failures')
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-candidate-phase-rss.yml
      - name: Upload candidate ownership evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-candidate-phase-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-candidate-phase-rss.json
          if-no-files-found: error
          retention-days: 90

# Ownership diagnostic only. Exact latest-head scope prevents a long-lived PR's historical experiment edits from
# repeatedly consuming 210-minute slots after the ownership question has already been measured.
