# ci-lane: fast
# Product-repair acceptance; a green workflow is not a full release/parity gate.
name: CMPCT J24G47 signed journal fsmeta identity repair
on:
  push:
    branches:
      - agent/phased2-v031-j24g47-positional-fsmeta-rekey-20261029
  pull_request:
    branches:
      - agent/phased2-v031-j24g46-native-xattr-compact-physical-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24g47-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physical-path-identity:
    name: installed r24 journal metadata identity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested candidate and independent oracle libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install . pytest zstandard
      - name: Match installed Reader, Writer and xattr provider to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code -- src/cmpct/reader.py src/cmpct/transactions.py src/cmpct/builder.py src/cmpct/_xattrs.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import cmpct.reader as reader, cmpct.transactions as transactions
          import cmpct.builder as builder, cmpct._xattrs as xattrs
          for path,module in (
              ("src/cmpct/reader.py",reader),
              ("src/cmpct/transactions.py",transactions),
              ("src/cmpct/builder.py",builder),
              ("src/cmpct/_xattrs.py",xattrs),
          ):
              source = Path(path).read_bytes()
              installed = Path(module.__file__).read_bytes()
              assert source == installed, f"installed package diverged: {path}"
              print(path, hashlib.sha256(source).hexdigest())
          PY
      # The repository-wide conftest imports historical Linux-only experimental libs;
      # isolate this bounded installed-product court without editing or relaxing it.
      - name: Run unchanged-control and additional journal/checkpoint acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pytest -q --noconftest tests/test_v031_j24g47_journal_fsmeta_identity.py 2>&1 | tee evidence/pytest.log
      - name: Record raw cost of path-lineage remapping at 1k/10k rows
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g47/measure_metadata_rekey_cost.py evidence/helper-cost.json 2>&1 | tee evidence/helper-cost.log
      - name: Execute original J24G46 physical negative-reproduction fixture as positive acceptance
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g46/probe_journal_xattr_identity.py evidence/physical.json 2>&1 | tee evidence/physical.log
      - name: Run independent r24 wire and physical artifact audits
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g46/audit_physical.py evidence/physical.json evidence/physical-audit.json 2>&1 | tee evidence/physical-audit.log
          python research/j24g47/audit_signed_rekey.py evidence/physical.json evidence/signed-rekey-audit.json 2>&1 | tee evidence/signed-rekey-audit.log
      - name: Falsify receipt tampering on independent referee
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, subprocess, sys
          from pathlib import Path
          original = json.loads(Path("evidence/physical.json").read_text())
          altered = []
          x = copy.deepcopy(original)
          x["artifact_manifest"]["shifted_archive"]["sha256"] = "00" * 32
          altered.append(x)
          x = copy.deepcopy(original)
          x["lexical_insert"]["names"] = ["z-owner.bin", "a-inserted.bin"]
          altered.append(x)
          x = copy.deepcopy(original)
          x["lexical_insert"]["xattrs_by_logical_name"] = {"a-inserted.bin": {"user.fake": "00"}}
          altered.append(x)
          for index, bad in enumerate(altered):
              fixture = Path(f"evidence/hostile-{index}.json")
              fixture.write_text(json.dumps(bad))
              cmd = [sys.executable, "research/j24g47/audit_signed_rekey.py",
                     str(fixture), f"evidence/hostile-{index}-audit.json"]
              result = subprocess.run(cmd, capture_output=True, text=True)
              assert result.returncode != 0, f"auditor admitted manipulated receipt {index}"
          print("independent auditor rejected all 3 manipulated receipts")
          PY
      - name: Retain complete physical archives, negative evidence and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g47-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
