# ci-lane: deep
name: CMPCT v0.30 EG08 graph hotpath oracle

on:
  pull_request:
    paths:
      - 'benchmarks/v030_eg08_graph_hotpath_oracle.py'
      - 'benchmarks/v030_eg08_zip_plain_prefilter_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct_v5.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - '.github/workflows/v030-eg08-graph-hotpath.yml'
  workflow_dispatch:

concurrency:
  group: v030-eg08-graph-hotpath-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile EG08 diagnostics
        run: |
          python -m py_compile benchmarks/v030_eg08_graph_hotpath_oracle.py
          python -m py_compile benchmarks/v030_eg08_zip_plain_prefilter_oracle.py
      - name: Profile exact EG08 graph stage
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_eg08_graph_hotpath_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-graph-hotpath-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-graph-hotpath.json"
      - name: Run byte-neutral ZIP plaintext prefilter A/B
        run: |
          python benchmarks/v030_eg08_zip_plain_prefilter_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-zip-prefilter-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-zip-prefilter.json"
      - name: Evidence-boundary check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-graph-hotpath.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-graph-hotpath-oracle-v1'
          assert d['contract']['release_credit'] is False
          assert d['contract']['production_change'] is False
          assert d['contract']['profiled_timing_receives_speed_credit'] is False
          assert d['unprofiled']['rounds']==7
          assert d['gate']['experiment_valid'] is True
          assert d['gate']['passed'] is True
          assert d['profiled']['top_by_cumulative_cpu']

          # The prefilter oracle is deliberately fail-closed: a byte-changing
          # candidate is useful negative evidence, not a broken measurement.
          # Require the current v2 receipt and only demand byte neutrality and
          # speed when the oracle itself says promotion is eligible.
          p=json.loads(Path('benchmark-artifacts/v030-eg08-zip-prefilter.json').read_text())
          assert p['schema']=='cmpct-v030-eg08-zip-plain-prefilter-oracle-v2'
          assert p['contract']['release_credit'] is False
          assert p['contract']['production_change'] is False
          assert p['contract']['required_byte_identity'] is True
          assert p['contract']['negative_evidence_is_successful_measurement_not_candidate_promotion'] is True
          assert p['office']['planned_rounds']==11
          assert p['office']['completed_pairs'] >= 1
          assert p['gate']['experiment_valid'] is True
          assert p['gate']['passed'] is True
          if p['gate']['promotion_eligible']:
              assert p['gate']['byte_neutral'] is True
              assert p['gate']['materially_faster'] is True
              assert p['office']['byte_identical_all_completed_pairs'] is True
          else:
              assert not (p['gate']['byte_neutral'] and p['gate']['materially_faster'])
              if not p['gate']['byte_neutral']:
                  assert p['office']['byte_identical_all_completed_pairs'] is False
                  assert p['office']['first_mismatch'] is not None
          PY
      - name: Record candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-eg08-candidate.txt
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-eg08-graph-hotpath.yml
      - name: Upload EG08 receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-graph-hotpath-${{ steps.candidate.outputs.sha }}
          path: |
            benchmark-artifacts/v030-eg08-graph-hotpath.json
            benchmark-artifacts/v030-eg08-zip-prefilter.json
            benchmark-artifacts/v030-eg08-candidate.txt
          if-no-files-found: warn
          retention-days: 90
