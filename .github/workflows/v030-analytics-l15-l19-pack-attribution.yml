# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics l15-l19 pack attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_l15_l19_pack_attribution.py'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-analytics-l15-l19-pack-attribution.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_l15_l19_pack_attribution.py'
      - '.github/workflows/v030-analytics-l15-l19-pack-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-effort-attribution-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_analytics_l15_l19_pack_attribution\.py|\.github/workflows/v030-analytics-l15-l19-pack-attribution\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-effort-attribution:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile attribution referee
        run: python -m py_compile benchmarks/v030_analytics_l15_l19_pack_attribution.py
      - name: Attribute the exhausted level15-to-level19 density gap
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_l15_l19_pack_attribution.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-effort-attribution-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-effort-attribution.json"
      - name: Enforce attribution integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-effort-attribution.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-l15-l19-pack-attribution-v1'
          assert d['levels']==[15,19]
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert all(d['invariants'].values())
          assert d['contract']['no_level_sweep'] is True
          assert d['contract']['no_representation_change'] is True
          assert d['next_decision']=='TARGET_TOP_BYTE_WEIGHT_PACK_MECHANISM'
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-analytics-l15-l19-pack-attribution.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-effort-attribution-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-effort-attribution.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. The goal is causal attribution of the already-adjudicated effort gap,
# not a new compression-level contest or release claim.
