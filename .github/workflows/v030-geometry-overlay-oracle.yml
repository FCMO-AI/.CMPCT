name: CMPCT v0.30 Geometry overlay oracle

on:
  push:
    branches:
      - agent/v030-geometry-overlay-oracle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-geometry-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-overlay-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out overlay oracle
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact public-ML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Run overlay primitive and locality tests
        run: python -m pytest -q tests/test_v030_geometry_overlay.py

      - name: Run exact historical ML composition oracle
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/geometry_overlay_v030_ml_oracle.py \
            --work-root benchmark-artifacts/geometry-overlay-v030-work \
            --output benchmark-artifacts/geometry-overlay-v030-ml.json \
            2>&1 | tee benchmark-artifacts/geometry-overlay-v030.stdout.txt

      - name: Enforce frozen composition contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/geometry-overlay-v030-ml.json').read_text())
          result=data['result']; gate=data['gate']; contract=data['contract']
          assert data['schema']=='cmpct-v030-geometry-overlay-ml-oracle-v1'
          assert result['logical_tree_sha256']==contract['tree_sha256']
          assert result['v029_bytes']==contract['accepted_v029_bytes']==13836439
          assert result['candidate_bytes'] <= result['v029_bytes']
          assert result['overlay_source_format'] in ('placement-v4','residual-pack-v5')
          assert result['selected']=='geometry-overlay'
          assert result['transformed_records'] > 0
          assert result['max_selected_member_read_amplification'] <= contract['maximum_selected_member_read_amplification'] <= 8.0
          assert result['saving_vs_v029_bytes'] >= contract['minimum_composition_saving_bytes'] >= 262144
          assert gate['passed'] is True
          print(json.dumps({'result': result, 'gate': gate}, indent=2))
          PY

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Upload Geometry-overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v030-geometry-overlay-${{ github.sha }}
          path: |
            benchmark-artifacts/geometry-overlay-v030-ml.json
            benchmark-artifacts/geometry-overlay-v030.stdout.txt
          if-no-files-found: warn

# Footnote: this workflow proves only whether Geometry survives composition inside the accepted v0.29 graph.
# It cannot authorize a version bump, canonical grammar change, or public benchmark claim by itself.
