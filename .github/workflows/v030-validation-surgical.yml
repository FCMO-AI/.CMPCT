name: CMPCT v0.30 surgical validation
# ci-lane: deep

on:
  pull_request:
    branches:
      - agent/v030-validation-base2
    paths:
      - '.github/workflows/v030-validation-surgical.yml'

permissions:
  contents: read

concurrency:
  group: cmpct-v030-surgical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-seed:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PR head replaces this seed with exact-candidate checks'

# Footnote: GitHub reads pull_request workflow definitions from the base branch. This seed exists only to make
# the narrow validation PR executable without changing the authoritative release candidate or waking main-wide CI.
