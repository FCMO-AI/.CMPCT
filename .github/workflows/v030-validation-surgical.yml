name: CMPCT v0.30 surgical validation
# ci-lane: deep

on:
  pull_request:
    branches:
      - agent/v030-validation-base2
    paths:
      - '.github/workflows/v030-validation-surgical.yml'

permissions:
  contents: read

concurrency:
  group: cmpct-v030-surgical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  product-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile promoted product and final evidence adapters
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_canonical_final.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/v030_perf_worker_canonical.py \
            benchmarks/v030_release_ablation_product.py \
            benchmarks/v030_release_performance_product.py \
            benchmarks/v030_release_selective_read_product.py \
            benchmarks/v030_external_competitors_canonical.py
      - name: Product and evidence contracts
        run: |
          python -m pytest -q \
            tests/test_v030_canonical_final.py \
            tests/test_v030_release_ablation_contract.py \
            tests/test_v030_release_selective_read_contract.py \
            tests/test_v030_release_generalization_contract.py

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Rust format and lint
        working-directory: native/cmpct-portable
        run: |
          cargo fmt --check
          cargo clippy --all-targets --message-format=short -- -D warnings
      - name: Rust tests and release build
        working-directory: native/cmpct-portable
        run: |
          cargo test --all-targets
          cargo build --release
      - name: Independent canonical r25 native acceptance
        run: python tests/native_v030_canonical.py
      - name: r24 complete verification adversary
        run: |
          python tests/native_v030_r24_verify_authority.py \
            --binary native/cmpct-portable/target/release/cmpct-portable

# Footnote: the base branch is a byte-for-byte snapshot of Agent-00 authority plus this dispatch seed. The only PR
# change is the expanded validation recipe, so checkout tests the current candidate without turning the 300-commit
# convergence history into a trigger for every obsolete research workflow. These results remain diagnostic only.
