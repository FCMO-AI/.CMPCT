# ci-lane: fast
name: CMPCT v0.31 physical PACK singleton O9

on:
  pull_request:
    paths:
      - 'tests/native_pack_physical_singleton_o9.py'
      - 'tests/native_pack_heldout_o8.py'
      - 'tests/native_pack_heldout_o8b.py'
      - 'docs/v031-research/NATIVE_PACK_PHYSICAL_SINGLETON_O9_PREREG.md'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/codec.py'
      - '.github/workflows/v031-native-pack-singleton-o9.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-native-singleton-o9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  physical-census-and-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind source identity and O9 prospective evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch docs/v031-research/NATIVE_PACK_PHYSICAL_SINGLETON_O9_PREREG.md tests/native_pack_physical_singleton_o9.py tests/native_pack_heldout_o8.py
          python -m py_compile tests/native_pack_physical_singleton_o9.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact package and its owned native codec
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
      - name: Physical revision-24 census and held-out oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-singleton-o9"
          python tests/native_pack_physical_singleton_o9.py "$RUNNER_TEMP/cmpct-native-singleton-o9/result.json" | tee "$RUNNER_TEMP/cmpct-native-singleton-o9/log.txt"
          sha256sum "$RUNNER_TEMP/cmpct-native-singleton-o9/result.json" > "$RUNNER_TEMP/cmpct-native-singleton-o9/result.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-physical-singleton-o9-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-singleton-o9/
          if-no-files-found: warn
          retention-days: 30
