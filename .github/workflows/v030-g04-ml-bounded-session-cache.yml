# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 G0-G4 ML bounded session cache

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_g04_ml_bounded_session_cache_oracle.py'
      - 'benchmarks/v030_g04_ml_cross_member_reuse_floor_oracle.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04*.py'
      - '.github/workflows/v030-g04-ml-bounded-session-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

# Building the frozen ML corpus is expensive. Preserve the running exact-head
# receipt; a later matching push may queue one successor but cannot cancel paid work.
concurrency:
  group: cmpct-v030-g04-ml-bounded-session-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  bounded-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic ML-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact bounded-policy oracle
        run: python -m py_compile benchmarks/v030_g04_ml_bounded_session_cache_oracle.py
      - name: Preserve G0-G4 reader/product correctness
        run: |
          python -m pytest -q \
            tests/test_v030_release_reader.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_g04_publish.py
      - name: Measure exact bounded session-cache headroom
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_g04_ml_bounded_session_cache_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-bounded-session-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-bounded-session-cache.json"
      - name: Enforce cache locality and claim boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-g04-ml-bounded-session-cache.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-g04-ml-bounded-session-cache.json').read_text())
          assert d['schema']=='cmpct-v030-g04-ml-bounded-session-cache-v1'
          assert d['candidate_head']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='neutral_hostile_v1/09_ml_artifacts'
          p=d['cache_policy']; g=d['gate']
          assert p['kind']=='insertion_only_no_eviction'
          assert p['record_limit_bytes']==64*1024*1024
          assert p['node_limit_bytes']==32*1024*1024
          assert p['budget_change_bytes']==0
          assert g['canonical_archive_verified'] is True
          assert g['tree_identity_preserved'] is True
          assert g['archive_bytes_changed'] is False
          assert g['memory_budget_changed'] is False
          assert g['exact_shipping_cache_limits_modeled'] is True
          assert g['locality_accounting_not_reduced_by_cache_hits'] is True
          assert g['max_member_locality_within_8x'] is True
          assert float(d['locality']['max_member_read_amplification'])<=8.0
          assert g['experiment_valid'] is True
          assert g['release_credit'] is False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-g04-ml-bounded-session-cache.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact structural evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-g04-ml-bounded-session-cache-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-g04-ml-bounded-session-cache.json
          if-no-files-found: error
          retention-days: 90

# Research-only bounded-policy decision evidence. Runtime/native/Android/final release authority remain separate.
