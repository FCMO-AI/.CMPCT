# ci-lane: fast
name: CMPCT v031 J24B03 signed direct-blob size custody
on:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'src/cmpct/validation.py'
      - 'research/j24b03_direct_blob_size_court.py'
      - 'research/j24b03_receipt_referee.py'
      - 'research/j24b03_direct_range_cost.py'
      - 'research/j24b03_direct_range_cost_referee.py'
      - 'research/j24b03_bhdr_hostile_court.py'
      - 'research/j24b03_bhdr_hostile_referee.py'
      - 'docs/v031-research/2026-10-27-j24b03-bhdr-hostile-prereg.md'
      - 'docs/v031-research/2026-10-27-j24b03-direct-range-cost-prereg.md'
      - 'docs/v031-research/2026-10-27-j24b03-direct-blob-size-guard-prereg.md'
      - '.github/workflows/v031-j24b03-direct-blob-size-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  direct-blob-size:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FCMO-AI/.CMPCT
          ref: 80c358f8824ec1b20d349c92ed94c898090969b0
          path: frozen-baseline
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build both exact source trees with package-owned native libraries
        shell: bash
        run: |
          set -euo pipefail
          # PYTHONPATH alone switches Python sources but cannot manufacture
          # the package-owned Rust cdylib required by native_codec.py.
          # Build each tree separately, then select sources explicitly.
          python -m pip install -e './frozen-baseline[test]'
          python -m pip install -e '.[test]'
      - name: Same exact signed-wire images on frozen baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C frozen-baseline rev-parse HEAD)" = '80c358f8824ec1b20d349c92ed94c898090969b0'
          mkdir -p benchmark-artifacts
          git rev-parse HEAD > benchmark-artifacts/candidate-head.txt
          git hash-object src/cmpct/reader.py > benchmark-artifacts/candidate-reader-blob.txt
          git -C frozen-baseline hash-object src/cmpct/reader.py > benchmark-artifacts/frozen-reader-blob.txt
          J24B03_RECEIPT=benchmark-artifacts/baseline.json PYTHONPATH=frozen-baseline/src python research/j24b03_direct_blob_size_court.py --expect vulnerable
          J24B03_RECEIPT=benchmark-artifacts/candidate.json PYTHONPATH=src python research/j24b03_direct_blob_size_court.py --expect repaired
          python research/j24b03_receipt_referee.py benchmark-artifacts/baseline.json benchmark-artifacts/candidate.json | tee benchmark-artifacts/referee.json
      - name: Separate preregistered RAW BHDR hostile-field controls
        shell: bash
        run: |
          set -euo pipefail
          J24B03_H_RECEIPT=benchmark-artifacts/bhdr-baseline.json \
            PYTHONPATH=frozen-baseline/src \
            python research/j24b03_bhdr_hostile_court.py --expect vulnerable
          J24B03_H_RECEIPT=benchmark-artifacts/bhdr-candidate.json \
            PYTHONPATH=src \
            python research/j24b03_bhdr_hostile_court.py --expect repaired
          python research/j24b03_bhdr_hostile_referee.py \
            benchmark-artifacts/bhdr-baseline.json \
            benchmark-artifacts/bhdr-candidate.json \
            | tee benchmark-artifacts/bhdr-referee.json
      - name: Prospective source-exact RAW range cost ABBA (science-only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The paired performance instrument runs distinct baseline/candidate
          # Python import paths in fresh subprocesses with same archived wire.
          # A cost signal is research debt; never a safety-gate waiver.
          python research/j24b03_direct_range_cost.py --run
          python research/j24b03_direct_range_cost_referee.py \
            benchmark-artifacts/j24b03-p-results.json \
            | tee benchmark-artifacts/j24b03-p-referee.json
      - name: Verify workflow topology
        if: runner.os == 'Linux'
        run: python tools/check_ci_topology.py .github/workflows/v031-j24b03-direct-blob-size-guard.yml
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b03-${{ matrix.os }}-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
