name: ONE-G0.2 direct generic-control streaming

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_direct_generic_control_stream.py'
      - 'benchmarks/one/one_g02_direct_control_stream_kernel.c'
      - 'docs/one/evidence/ONE_G02_DIRECT_GENERIC_CONTROL_STREAM_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-direct-generic-control-stream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-generic-control-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen direct generic-control streaming gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_direct_generic_control_stream | tee one-g02-direct-generic-control-stream.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-direct-generic-control-stream-${{ github.sha }}
          path: one-g02-direct-generic-control-stream.json
          if-no-files-found: error
