# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 ML common-prefix profile

on:
  push:
    branches: [agent/v030-ml-common-prefix-profile]
    paths:
      - 'benchmarks/v030_ml_common_prefix_profile.py'
      - '.github/workflows/v030-ml-common-prefix-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-ml-common-prefix-profile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile instrument
        run: python -m py_compile benchmarks/v030_ml_common_prefix_profile.py
      - name: Profile duplicated child work
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_ml_common_prefix_profile.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-ml-common-prefix-profile.json"
      - name: Validate research-only receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-ml-common-prefix-profile.json')
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-ml-common-prefix-profile-v1'
          assert d['release_credit'] is False
          assert d['v028']['wall_s'] > 0 and d['attempt5']['wall_s'] > 0
          assert d['v028']['archive_bytes'] > 0 and d['attempt5']['archive_bytes'] > 0
          assert d['shared_common_names']
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-ml-common-prefix-profile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-ml-common-prefix-profile.json
          if-no-files-found: error
          retention-days: 90

