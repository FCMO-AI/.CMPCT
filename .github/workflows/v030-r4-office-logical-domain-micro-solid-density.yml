# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office logical-domain micro-solid density

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_logical_domain_micro_solid_density.py'
      - '.github/workflows/v030-r4-office-logical-domain-micro-solid-density.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-office-ms3ld-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_office_logical_domain_micro_solid_density\.py|\.github/workflows/v030-r4-office-logical-domain-micro-solid-density\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  density-referee:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact research dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_office_logical_domain_micro_solid_density.py
      - name: Run logical-domain micro-solid density referee
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_logical_domain_micro_solid_density.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-ms3ld-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-ms3ld.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-ms3ld.json'))
          assert d['schema']=='cmpct-v030-r4-office-logical-domain-micro-solid-density-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['candidate']; assert c['page_bytes']==4096 and c['max_group_pages']==3 and c['zstd_level']==3
          k=d['contract']; assert k['diagnostic_only'] and not k['release_credit'] and not k['locality_credit']
          assert k['storage_representation_identical_to_ms3'] and k['only_causal_layer_changed_is_discovery_signal']
          assert k['logical_signature_bytes_not_stored_or_credited'] and k['all_group_frame_and_directory_bytes_charged']
          print(json.dumps({'compressed_domain_control':d['compressed_domain_control'],'logical_domain':d['logical_domain'],'stream_store':d['stream_store'],'economics':d['economics'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-logical-domain-micro-solid-density.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-ms3ld-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-ms3ld.json
          if-no-files-found: error
          retention-days: 90

# Green means the causal discovery-domain diagnostic completed; it grants no locality/release credit.
