name: CMPCT v0.30 physical effort attribution

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v030-authoritative-integration
    paths:
      - benchmarks/v030_physical_effort_attribution.py
      - benchmarks/v030_office_physical_economics_referee.py
      - benchmarks/v030_current15_stable_corpus.py
      - experiments/entropygraph_v030_federated_embedded_fs_candidate_v5.py
      - experiments/entropygraph_v025.py
      - docs/V030_PHYSICAL_EFFORT_ATTRIBUTION_MISSION_LOCK_2026-09-13.md
      - .github/workflows/v030-physical-effort-attribution.yml

permissions:
  contents: read

jobs:
  physical-effort-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen v0.29 comparator source
        uses: actions/checkout@v4
        with:
          ref: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d
          path: .frozen-v029
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install current15 system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install exact-head benchmark dependencies
        run: python -m pip install -e '.[test]'

      - name: Syntax check
        run: python -m py_compile benchmarks/v030_physical_effort_attribution.py

      - name: Run fixed-geometry effort oracle
        id: referee
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m benchmarks.v030_physical_effort_attribution \
            --v029-checkout .frozen-v029 \
            --out evidence/physical-effort-attribution.json \
            > >(tee evidence/stdout.txt) \
            2> >(tee evidence/stderr.txt >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bind and classify receipt
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          out=Path(os.environ['GITHUB_OUTPUT'])
          receipt=Path('evidence/physical-effort-attribution.json')
          stderr=Path('evidence/stderr.txt')
          code=int('${{ steps.referee.outputs.exit_code || 1 }}')
          if receipt.exists():
              d=json.loads(receipt.read_text())
              d['candidate_sha']=os.environ['GITHUB_SHA']
              d['candidate_ref']=os.environ['GITHUB_REF_NAME']
              receipt.write_text(json.dumps(d,indent=2,sort_keys=True))
              verdict=str(d.get('verdict','UNKNOWN'))
              parts=[]
              for row in d.get('rows',[]):
                  name=str(row.get('name','unknown')).replace('_','-')
                  rec=row.get('regret_recovered_bytes','na')
                  cls=row.get('classification','na')
                  parts.append(f"{name}-{cls}-rec{rec}")
              label=verdict+'-'+'-'.join(parts)
          else:
              lines=[x.strip() for x in stderr.read_text(errors='replace').splitlines() if x.strip()] if stderr.exists() else []
              msg=lines[-1] if lines else 'no-receipt-no-stderr'
              msg=re.sub(r'[^A-Za-z0-9_.-]+','-',msg).strip('-')[:110]
              label='HARNESS_FAIL-'+msg
          label=re.sub(r'[^A-Za-z0-9_.-]+','-',label)[:190]
          with out.open('a') as f:
              f.write(f"label={label}\n")
              f.write(f"exit_code={code}\n")
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-physical-effort-${{ steps.classify.outputs.label }}-${{ github.sha }}
          path: |
            evidence/physical-effort-attribution.json
            evidence/stdout.txt
            evidence/stderr.txt
          if-no-files-found: error

      - name: Enforce scientific referee exit
        if: always()
        shell: bash
        run: |
          test "${{ steps.classify.outputs.exit_code }}" = "0"
