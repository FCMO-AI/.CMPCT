# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 bounded-drift generic primitive

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_bounded_drift_v1.py'
      - 'experiments/entropygraph_v030_bounded_drift_container_v1.py'
      - 'experiments/entropygraph_v030_bounded_drift_admission.py'
      - 'tests/test_v030_bounded_drift_v1.py'
      - 'tests/test_v030_bounded_drift_container_v1.py'
      - 'tests/test_v030_bounded_drift_admission.py'
      - '.github/workflows/v030-bounded-drift-generic-primitive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-bounded-drift-generic-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  generic-primitive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Validate generic bounded-drift seam
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/entropygraph_v030_bounded_drift_v1.py \
            experiments/entropygraph_v030_bounded_drift_container_v1.py \
            experiments/entropygraph_v030_bounded_drift_admission.py \
            tests/test_v030_bounded_drift_v1.py \
            tests/test_v030_bounded_drift_container_v1.py \
            tests/test_v030_bounded_drift_admission.py
          python -m pytest -q \
            tests/test_v030_bounded_drift_v1.py \
            tests/test_v030_bounded_drift_container_v1.py \
            tests/test_v030_bounded_drift_admission.py
          python tools/check_ci_topology.py .github/workflows/v030-bounded-drift-generic-primitive.yml
          python tools/check_public_surface.py

# Productization prerequisite only. A green result establishes deterministic workload-blind
# encode/decode behavior, non-canonical family framing, selected-member reconstruction,
# fail-closed hostile/resource semantics, and a policy API that can admit the candidate only
# from already-priced physical/runtime/resource observations. It grants no canonical-r25,
# recovery, native, Android, external-benchmark, or release credit.
