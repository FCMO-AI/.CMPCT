name: CMPCT v0.30 content-economic current15

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_micropack_content_current15_transfer.py
      - benchmarks/v030_r24_micropack_content_economic_admission.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/v030_r24_locality_derived_micropack_referee.py
      - benchmarks/v030_r24_micropack_same_grammar_attribution.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-micropack-content-current15.yml

permissions:
  contents: read

jobs:
  content-current15:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_r24_micropack_content_current15_transfer.py
      - name: Execute exact content-economic current15 transfer
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_micropack_content_current15_transfer.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-current15-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-content-current15.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-content-current15.json')
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r24-micropack-content-current15-v1'
          assert d['release_credit'] is False
          assert d['canonical_builder_changed'] is False
          assert d['genesis_rescore'] is False
          assert d['path_signal_used'] is False
          assert len(d['identities']) == 15
          assert len(d['corpus_fingerprint']) == 64
          assert d['completed_workloads'] + len(d['execution_errors']) == 15
          assert d['verdict'] in {
              'CONTENT_CURRENT15_GENERALIZES',
              'CONTENT_CURRENT15_SAFE_WITH_EXTENSION_DEBT',
              'CONTENT_CURRENT15_NEEDS_REHABILITATION',
              'RETIRE_CONTENT_CURRENT15_TRANSFER',
              'CONTENT_CURRENT15_EXECUTION_BLOCKED',
          }
          a=d['aggregate']
          short={
              'CONTENT_CURRENT15_GENERALIZES':'generalizes',
              'CONTENT_CURRENT15_SAFE_WITH_EXTENSION_DEBT':'ext-debt',
              'CONTENT_CURRENT15_NEEDS_REHABILITATION':'rehab',
              'RETIRE_CONTENT_CURRENT15_TRANSFER':'retire',
              'CONTENT_CURRENT15_EXECUTION_BLOCKED':'blocked',
          }[d['verdict']]
          outs={
              'short':short,
              'done':str(d['completed_workloads']),
              'delta_i':str(a['delta_vs_independent_bytes']),
              'delta_e':str(a['delta_vs_extension_bytes']),
              'wins':str(a['strict_wins_vs_independent']),
              'ties':str(a['ties_vs_independent']),
              'loss_i':str(a['losses_vs_independent']),
              'loss_e':str(a['losses_vs_extension']),
              'decode':str(a['max_decode_unit_bytes']),
              'amp':f"{a['max_member_amplification']:.4f}",
              'fp':d['corpus_fingerprint'][:12],
          }
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              for k,v in outs.items(): fh.write(f'{k}={v}\n')
          print(json.dumps({'verdict':d['verdict'],'aggregate':a,'losses_vs_independent':d['losses_vs_independent'],'losses_vs_extension':d['losses_vs_extension']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-content15-${{ steps.receipt.outputs.short || 'no-summary' }}-done${{ steps.receipt.outputs.done }}-di${{ steps.receipt.outputs.delta_i }}-de${{ steps.receipt.outputs.delta_e }}-w${{ steps.receipt.outputs.wins }}-t${{ steps.receipt.outputs.ties }}-li${{ steps.receipt.outputs.loss_i }}-le${{ steps.receipt.outputs.loss_e }}-d${{ steps.receipt.outputs.decode }}-a${{ steps.receipt.outputs.amp }}-${{ steps.receipt.outputs.fp }}-${{ github.sha }}
          path: benchmark-artifacts/v030-content-current15.json
          if-no-files-found: error
          retention-days: 90

# Research-only. This current-fingerprint transfer never rewrites frozen Genesis.
