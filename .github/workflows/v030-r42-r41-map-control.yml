name: CMPCT v0.30 R42 R41 map control
# ci-lane: deep
on:
  push:
    branches: [agent/v030-r42-r41-map-control]
    paths: [.github/workflows/v030-r42-r41-map-control.yml]
permissions: {contents: read}
env: {PYTHONPATH: .}
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd
          python -m pip install -e '.[test]'
      - name: Build frozen ML with pre-R41 Executor.map semantics on current head
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import concurrent.futures,json,shutil,time
          from pathlib import Path
          from benchmarks import v030_release_generalization as GENERAL
          from experiments import entropygraph_v030_release_product as PRODUCT
          import cmpct.builder as BUILDER
          root=Path('benchmark-artifacts/r42-map-control'); shutil.rmtree(root,ignore_errors=True); root.mkdir(parents=True)
          neutral=GENERAL.V029._load(GENERAL.V029.ROOT/'benchmarks'/'neutral_hostile_corpus_v1.py','cmpct_r42_map_neutral')
          repair=GENERAL.V029._load(GENERAL.V029.REPAIR_PATH,'cmpct_r42_map_repair'); repair.install_generation_hooks(neutral)
          neutral.corpus_ml(root); repair.normalize_root(root); source=root/'09_ml_artifacts'
          expected=GENERAL._accepted_v029_rows()[('neutral_hostile_v1','09_ml_artifacts')]['tree_sha256']; observed=GENERAL._historical_treehash(source)
          if observed!=expected: raise SystemExit(f'frozen source drift: {observed} != {expected}')
          def pre_r41_map(fn,items,workers):
              if workers>1 and len(items)>1:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=workers,thread_name_prefix='cmpct-encode') as pool: return list(pool.map(fn,items))
              return [fn(item) for item in items]
          BUILDER.ordered_worker_pull=pre_r41_map
          archive=root/'shipping.cmpct'; started=time.perf_counter(); stats=PRODUCT.build(source,archive); wall=time.perf_counter()-started
          verify=PRODUCT.strong_verify(archive)
          if not verify.get('ok'): raise SystemExit('verify failed')
          out={'schema':'cmpct-v030-r42-r41-map-control-v1','source_head':'285ff0cf5efed1352260f8dc07a2ce9d665024b4','release_credit':False,'tree_sha256':observed,'archive_bytes':archive.stat().st_size,'build_wall_s':wall,'build_stats':stats,'control':'current-head with only cmpct.builder.ordered_worker_pull replaced by exact pre-R41 Executor.map semantics'}
          Path('benchmark-artifacts/r42-r41-map-control.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-r42-r41-map-control-${{ github.sha }}
          path: benchmark-artifacts/r42-r41-map-control.json
          if-no-files-found: error
