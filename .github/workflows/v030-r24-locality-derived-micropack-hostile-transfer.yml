# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 locality-derived micropack hostile transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py'
      - 'docs/V030_R24_LOCALITY_DERIVED_MICROPACK_HOSTILE_TRANSFER_2026-09-12.md'
      - '.github/workflows/v030-r24-locality-derived-micropack-hostile-transfer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py'
      - 'docs/V030_R24_LOCALITY_DERIVED_MICROPACK_HOSTILE_TRANSFER_2026-09-12.md'
      - '.github/workflows/v030-r24-locality-derived-micropack-hostile-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-locality-derived-micropack-hostile-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r24_locality_derived_micropack_hostile_transfer\.py|docs/V030_R24_LOCALITY_DERIVED_MICROPACK_HOSTILE_TRANSFER_2026-09-12\.md|\.github/workflows/v030-r24-locality-derived-micropack-hostile-transfer\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  hostile-transfer:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py
      - name: Execute hostile transfer referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_locality_derived_micropack_hostile_transfer.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-locality-derived-micropack-hostile-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-locality-derived-micropack-hostile.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r24-locality-derived-micropack-hostile.json')
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r24-locality-derived-micropack-hostile-transfer-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['canonical_builder_changed'] is False and d['locality_budget']==8.0
          assert set(d['families'])=={
              'balanced_structured_text','skewed_structured_text',
              'incompressible_text_labeled','duplicate_forest','singleton_buckets'
          }
          assert d['verdict'] in {
              'LOCALITY_DERIVED_MICROPACK_GENERALIZES',
              'LOCALITY_DERIVED_MICROPACK_NEEDS_ECONOMIC_ADMISSION',
              'RETIRE_LOCALITY_DERIVED_MICROPACK_TRANSFER',
          }
          PY
      - name: Expose hostile receipt summary
        id: receipt
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-locality-derived-micropack-hostile.json').read_text())
          short={
              'LOCALITY_DERIVED_MICROPACK_GENERALIZES':'generalizes',
              'LOCALITY_DERIVED_MICROPACK_NEEDS_ECONOMIC_ADMISSION':'needs-economic-admission',
              'RETIRE_LOCALITY_DERIVED_MICROPACK_TRANSFER':'retire',
          }[d['verdict']]
          parts=[]
          for name in ('balanced_structured_text','skewed_structured_text','incompressible_text_labeled','duplicate_forest','singleton_buckets'):
              key={'balanced_structured_text':'bal','skewed_structured_text':'skew','incompressible_text_labeled':'noise','duplicate_forest':'dup','singleton_buckets':'single'}[name]
              parts.append(f"{key}{d['families'][name]['candidate_delta_vs_independent_bytes']}")
          print('artifact_name=v030-hostile-'+short+'-'+'-'.join(parts))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r24-locality-derived-micropack-hostile-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ steps.receipt.outputs.artifact_name || 'v030-hostile-no-summary' }}-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-locality-derived-micropack-hostile.json
          if-no-files-found: error
          retention-days: 90

# Research-only. Green means receipt integrity, not scientific victory.
