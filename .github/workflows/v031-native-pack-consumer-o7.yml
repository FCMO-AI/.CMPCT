# ci-lane: fast
name: CMPCT v0.31 native public-C grouped consumer O7

on:
  pull_request:
    paths:
      - 'tests/native_pack_consumer_o7.c'
      - 'tests/native_pack_consumer_o7.py'
      - 'docs/v031-research/NATIVE_PACK_C_CONSUMER_O7_PREREG.md'
      - 'native/cmpct-core/src/lib.rs'
      - 'native/cmpct-core/include/cmpct.h'
      - '.github/workflows/v031-native-pack-consumer-o7.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-native-c-consumer-o7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  public-c-consumer-o7:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact source and frozen preregistration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git ls-files --error-unmatch tests/native_pack_consumer_o7.c tests/native_pack_consumer_o7.py docs/v031-research/NATIVE_PACK_C_CONSUMER_O7_PREREG.md tests/conformance/v24-pack.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build exact native shared core plus standalone public C consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml -- --check
          cargo build --release --locked --manifest-path native/cmpct-core/Cargo.toml
          cc -std=c11 -O2 -Wall -Wextra -Werror -I. tests/native_pack_consumer_o7.c -Lnative/cmpct-core/target/release -lcmpct_core -Wl,-rpath,"$PWD/native/cmpct-core/target/release" -o /tmp/cmpct-native-c-consumer-o7
      - name: Actual public-C extraction ABBA — identical source and independently verified trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmpct-native-c-consumer-o7"
          python tests/native_pack_consumer_o7.py /tmp/cmpct-native-c-consumer-o7 "$RUNNER_TEMP/cmpct-native-c-consumer-o7/result.json" | tee "$RUNNER_TEMP/cmpct-native-c-consumer-o7/log.txt"
          sha256sum "$RUNNER_TEMP/cmpct-native-c-consumer-o7/result.json" > "$RUNNER_TEMP/cmpct-native-c-consumer-o7/result.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c-consumer-o7-${{ github.run_id }}
          path: ${{ runner.temp }}/cmpct-native-c-consumer-o7/
          if-no-files-found: warn
          retention-days: 30
