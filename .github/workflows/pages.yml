name: CMPCT website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for browser-writer gate
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Guard complete tracked project surface
        run: python tools/check_public_surface.py

      - name: Install canonical CMPCT reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build canonical performance site
        run: |
          python site/build_site.py --out _site
          python site/enhance_site.py _site

      - name: Gate generated performance data
        run: |
          python - <<'PY'
          import json, math, re, tomllib
          from pathlib import Path

          data = json.loads(Path('_site/project-data.json').read_text())
          with Path('pyproject.toml').open('rb') as fh:
              version = tomllib.load(fh)['project']['version']
          surface = Path('SURFACE_REVISION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.[a-z]+', surface), surface
          assert data['project']['project_version'] == version
          assert data['project']['surface_revision'] == surface
          assert f'surface {surface}' in Path('_site/index.html').read_text()
          assert Path('_site/surface-revision.txt').read_text().strip() == surface
          assert data['frontier'], 'performance site requires a committed research-frontier record'
          assert data['frontier']['project_version'] == version, 'public frontier must follow the current core release'

          if version == '0.28.0':
              frontier = data['frontier']
              assert frontier.get('render_contract') == 'entropygraph-v028'
              assert frontier['regressions_primary'] == 0
              assert frontier['wins_primary'] >= 1
              assert frontier['primary_comparator']['short'] == 'EntropyGraph v0.25'

              overall = frontier['overall_comparison']
              release = frontier['release_delta']
              rows = overall['competitors']
              by_short = {row['short']: row for row in rows}
              candidate_rows = [row for row in rows if row.get('role') == 'candidate']
              assert len(candidate_rows) == 1
              assert overall['candidate_bytes'] == candidate_rows[0]['bytes']
              assert overall['headline_comparator_short'] in by_short
              assert overall['headline_comparator_short'] != release['baseline_short']
              assert 'ZIP / Deflate' in by_short
              assert '7z / LZMA2' in by_short
              assert 'tar / Zstd solid' in by_short
              assert all(row['short'] != release['baseline_short'] for row in rows)

              # Footnote: these two candidate totals intentionally represent different aggregation
              # contracts. Equality is not required; accidentally using one for both is the bug this
              # gate exists to catch.
              assert overall['candidate_bytes'] != release['candidate_bytes']
              assert release['baseline_bytes'] == frontier['primary_comparator']['bytes']
              expected_release = (release['baseline_bytes'] - release['candidate_bytes']) / release['baseline_bytes'] * 100.0
              assert math.isclose(release['lead_pct'], expected_release, rel_tol=0, abs_tol=1e-12)
              for row in rows:
                  if row.get('role') == 'candidate':
                      continue
                  expected = (row['bytes'] - overall['candidate_bytes']) / row['bytes'] * 100.0
                  assert math.isclose(row['lead_pct'], expected, rel_tol=0, abs_tol=1e-12), row['short']

              renderer = Path('site/src/assets/frontier-v028.js').read_text()
              assert 'overall_comparison' in renderer
              assert 'release_delta' in renderer
              assert 'v0.28 RELEASE DELTA' in renderer

          elif version == '0.29.0':
              frontier = data['frontier']
              assert frontier.get('render_contract') == 'mosaic-v029'
              assert frontier['regressions_primary'] == 0
              assert frontier['wins_primary'] >= 1
              assert frontier['primary_comparator']['short'] == 'CMPCT v0.28'
              assert frontier['candidate'].get('engine_identity') == 'attempt5-residual-program-packing'

              overall = frontier['overall_comparison']
              release = frontier['release_delta']
              scheduler = frontier['scheduler']
              rows = overall['competitors']
              by_short = {row['short']: row for row in rows}
              candidate_rows = [row for row in rows if row.get('role') == 'candidate']
              assert len(candidate_rows) == 1
              assert overall['candidate_bytes'] == candidate_rows[0]['bytes']
              assert overall['headline_comparator_short'] in by_short
              assert '7z / LZMA2' in by_short
              assert 'ZPAQ m5' in by_short
              assert 'tar / Zstd solid' in by_short
              assert all(row['short'] != release['baseline_short'] for row in rows)

              expected_release = (release['baseline_bytes'] - release['candidate_bytes']) / release['baseline_bytes'] * 100.0
              assert release['baseline_bytes'] == frontier['primary_comparator']['bytes']
              assert math.isclose(release['lead_pct'], expected_release, rel_tol=0, abs_tol=1e-12)
              assert release['saving_bytes'] > 0

              # Footnote: the original scheduler experiment was byte-identical but targeted obsolete
              # attempt #1. The public release must therefore prove both archive identity *and engine
              # identity*, and its hostile candidate must strictly beat embedded v0.28 on the same tree.
              assert scheduler['accepted_engine'] == 'attempt5-residual-program-packing'
              assert scheduler['byte_identical'] is True
              assert scheduler['research_gate_pass'] is True
              assert scheduler['every_pair_gate_pass'] is True
              assert scheduler['archive_bytes'] < scheduler['v028_bytes']
              assert scheduler['archive_bytes'] == overall['candidate_bytes']
              assert scheduler['wallclock_improvement_pct'] >= 20.0
              assert scheduler['wallclock_saved_s'] >= 5.0

              for row in rows:
                  if row.get('role') == 'candidate':
                      continue
                  expected = (row['bytes'] - overall['candidate_bytes']) / row['bytes'] * 100.0
                  assert math.isclose(row['lead_pct'], expected, rel_tol=0, abs_tol=1e-12), row['short']

              renderer = Path('site/src/assets/frontier-v029.js').read_text()
              assert 'mosaic-v029' in renderer
              assert 'v0.29 RELEASE DELTA' in renderer
              assert 'CREATE WALL TIME' in renderer

          assert len(data['frontier']['competitors']) >= 4
          assert data['frontier']['workloads'], 'frontier workload matrix must not be empty'
          assert data['parity_records'], 'canonical ZIP-parity evidence must remain visible'
          assert data['release_history'][0]['version'] == version, 'latest core release note must match project version'
          print(f'performance site data: coherent; surface={surface}')
          PY

      - name: Check browser JavaScript
        run: |
          node --check site/src/assets/app.js
          node --check site/src/assets/motion.js
          node --check site/src/assets/frontier-v028.js
          node --check site/src/assets/frontier-v029.js
          node --check site/src/assets/cmpct-browser-writer.js

      - name: Gate browser-written archive through canonical reader
        run: |
          node site/tests/browser-writer-smoke.mjs /tmp/browser-writer-smoke.cmpct
          python - <<'PY'
          from pathlib import Path
          from cmpct.reader import CMPCT

          path = Path('/tmp/browser-writer-smoke.cmpct')
          with CMPCT(path) as archive:
              assert archive.index['v'] == 24
              assert [row[0] for row in archive.files] == ['copy/repeated.txt', 'docs/repeated.txt', 'unique.txt']
              assert archive.read('copy/repeated.txt') == archive.read('docs/repeated.txt')
              assert archive.read('unique.txt') == b'small independent file\n'
          PY

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Footnote: main publishes automatically only after disclosure, generated benchmark-data coherence,
# presentation-revision coherence, JavaScript syntax, and canonical-reader Browser Lab compatibility
# gates pass. Each research release keeps its external-format arena separate from its direct-base delta;
# v0.29 additionally pins the scheduler to accepted attempt #5 so stale byte-identical experiments cannot
# be promoted by accident.
