name: CMPCT website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for browser-writer gate
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard complete tracked project surface
        run: python tools/check_public_surface.py

      - name: Install canonical CMPCT reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build canonical site data
        run: python site/build_site.py --out _site

      - name: Check browser JavaScript
        run: |
          node --check site/src/assets/app.js
          node --check site/src/assets/cmpct-browser-writer.js

      - name: Gate browser-written archive through canonical reader
        run: |
          node site/tests/browser-writer-smoke.mjs /tmp/browser-writer-smoke.cmpct
          python - <<'PY'
          from pathlib import Path
          from cmpct.reader import CMPCT

          path = Path('/tmp/browser-writer-smoke.cmpct')
          with CMPCT(path) as archive:
              assert archive.index['v'] == 24
              assert [row[0] for row in archive.files] == ['copy/repeated.txt', 'docs/repeated.txt', 'unique.txt']
              assert archive.read('copy/repeated.txt') == archive.read('docs/repeated.txt')
              assert archive.read('unique.txt') == b'small independent file\n'
          PY

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Footnote: canonical main publishes automatically, but only after the complete tracked-tree disclosure
# guard, static build, JavaScript checks and canonical-reader Browser Lab compatibility gate pass.
