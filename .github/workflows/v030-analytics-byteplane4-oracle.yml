# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics byte-plane4 R4 oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_byteplane4_oracle.py'
      - 'benchmarks/v030_v025_canonical_fs_level1_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-analytics-byteplane4-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_byteplane4_oracle.py'
      - '.github/workflows/v030-analytics-byteplane4-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-byteplane4-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_analytics_byteplane4_oracle\.py|\.github/workflows/v030-analytics-byteplane4-oracle\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-byteplane4:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus and comparator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile R4 byte-plane oracle
        run: python -m py_compile benchmarks/v030_analytics_byteplane4_oracle.py
      - name: Measure byte-plane candidate against direct level1, v0.29 and external controls
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_byteplane4_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-byteplane4-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-byteplane4.json"
      - name: Enforce receipt integrity, not scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-byteplane4.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-byteplane4-oracle-v1'
          assert d['target']=='neutral_hostile_v1/04_analytics_and_database'
          assert d['rounds']==3 and d['width']==4
          assert d['accepted_v029_bytes']==6_135_172
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert len(d['raw_complete_verified_create_s']['candidate'])==3
          assert len(d['raw_complete_verified_create_s']['baseline'])==3
          assert len(d['raw_complete_verified_create_s']['zip'])==3
          assert len(d['raw_complete_verified_create_s']['zstd19'])==3
          c=d['contract']
          assert c['fixed_transform_width']==4
          assert c['direct_level1_fallback_per_zstd_call'] is True
          assert c['transform_admission_is_exact_framed_byte_cost'] is True
          assert c['mandatory_strong_verify_inside_candidate_timing'] is True
          assert c['production_selector_changed'] is False
          assert c['canonical_format_changed'] is False
          assert d['next_decision'] in ('PRODUCTIZE_TRANSFORM','RETIRE_DIRECT_BYTEPLANE4')
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-analytics-byteplane4-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-byteplane4-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-byteplane4.json
          if-no-files-found: error
          retention-days: 90

# Research-only R4 falsifier. A green Actions run means the receipt is valid, not that the transform won.
# Scientific credit requires the JSON strict.oracle_passed field; a red oracle retires this exact width-4 mechanism.
