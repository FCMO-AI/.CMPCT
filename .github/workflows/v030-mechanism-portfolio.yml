name: CMPCT v0.30 mechanism portfolio

on:
  push:
    branches:
      - agent/v030-mechanism-portfolio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-mechanism-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  five-workload-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out exact portfolio line
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Record exact evidence runtime
        run: python benchmarks/evidence_runtime_fingerprint.py

      - name: Pin portfolio contract before expensive measurement
        run: |
          python -m pytest -q \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_gir.py \
            tests/test_v030_prefixgraph.py \
            tests/test_v030_mechanism_portfolio.py \
            tests/test_v030_evidence_runtime_fingerprint.py

      - name: Run exact five-workload complete-artifact portfolio
        run: |
          python benchmarks/v030_mechanism_portfolio.py \
            --work-root benchmark-artifacts/v030-mechanism-portfolio-work \
            --output benchmark-artifacts/v030-mechanism-portfolio.json

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload exact portfolio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-mechanism-portfolio-evidence
          path: benchmark-artifacts/v030-mechanism-portfolio.json
          if-no-files-found: warn
          retention-days: 90

# Footnote: this workflow intentionally builds complete independent archives instead of summing prior reports.
# Its 2,121,728-byte floor is exactly the inherited 2 MiB GIR floor plus the inherited 24 KiB PrefixGraph
# floor.  Passing authorizes true single-grammar composition work; it does not itself authorize v0.30 release.
