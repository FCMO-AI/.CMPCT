name: CMPCT v0.30 R39 dynamic-pull whole-build gate
# ci-lane: deep
# ci-auto-policy: manual-only
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
jobs:
  r39-whole-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile probe
        run: python -m py_compile experiments/v030_r39_dynamic_pull_whole_build_probe.py
      - name: Build frozen R34/R36 source trees
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks import v030_r34_regenerable_deflate_same_run_phase_attribution as R34
          full,nested,identity=R34.build_sources(Path('benchmark-artifacts/r39-work'))
          Path('benchmark-artifacts/sources.txt').write_text(str(full.resolve())+'\n'+str(nested.resolve())+'\n'+json.dumps(identity,sort_keys=True)+'\n')
          PY
      - name: Run complete-build A/B on both frozen targets
        run: |
          mapfile -t src < benchmark-artifacts/sources.txt
          python experiments/v030_r39_dynamic_pull_whole_build_probe.py "${src[0]}" --workers 8 --repetitions 9 --output benchmark-artifacts/r39-full.json
          python experiments/v030_r39_dynamic_pull_whole_build_probe.py "${src[1]}" --workers 8 --repetitions 9 --output benchmark-artifacts/r39-nested.json
      - name: Enforce frozen decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows={n:json.loads(Path(f'benchmark-artifacts/r39-{n}.json').read_text()) for n in ('full','nested')}
          assert all(r['archive_identity'] for r in rows.values())
          ok=all(r['median_seconds_saved']>=0.002 for r in rows.values())
          decision='WHOLE_BUILD_DYNAMIC_PULL_TRANSFERS' if ok else 'WHOLE_BUILD_DYNAMIC_PULL_DOES_NOT_TRANSFER'
          out={'schema':'cmpct-v030-r39-dynamic-pull-whole-build-result-v1','decision':decision,'targets':rows}
          Path('benchmark-artifacts/r39-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload immutable R39 evidence
        uses: actions/upload-artifact@v6
        with:
          name: v030-r39-dynamic-pull-whole-build-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/r39-*.json
          if-no-files-found: error
          retention-days: 90
