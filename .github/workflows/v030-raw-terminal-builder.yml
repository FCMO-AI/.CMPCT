name: v030 RAW terminal Builder

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_federated_adaptive_effort_candidate_v9.py'
      - 'benchmarks/v030_raw_terminal_builder_referee.py'
      - 'docs/V030_RAW_TERMINAL_BUILDER_MISSION_LOCK_2026-09-13.md'
      - '.github/workflows/v030-raw-terminal-builder.yml'

permissions:
  contents: read

jobs:
  builder-court:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zstd
      - name: Install package and corpus dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy reportlab python-docx openpyxl pillow python-pptx
      - name: Compile candidate and referee
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_federated_adaptive_effort_candidate_v9.py \
            benchmarks/v030_raw_terminal_builder_referee.py
      - name: Run H-EFFORT-6 Builder court
        id: court
        continue-on-error: true
        run: |
          mkdir -p evidence work
          set +e
          PYTHONPATH=. python benchmarks/v030_raw_terminal_builder_referee.py \
            --work-root "$GITHUB_WORKSPACE/work" \
            --out evidence/raw-terminal-builder.json \
            > evidence/raw-terminal-builder.stdout.txt \
            2> evidence/raw-terminal-builder.stderr.txt
          rc=$?
          echo "$rc" > evidence/raw-terminal-builder.exitcode.txt
          exit $rc
      - name: Surface diagnostics
        if: always()
        run: |
          cat evidence/raw-terminal-builder.exitcode.txt 2>/dev/null || true
          cat evidence/raw-terminal-builder.stderr.txt 2>/dev/null || true
          cat evidence/raw-terminal-builder.stdout.txt 2>/dev/null || true
      - name: Preserve exact-head metadata
        if: always()
        run: |
          git rev-parse HEAD > evidence/head.txt
          git status --short > evidence/git-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-raw-terminal-builder-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Enforce semantic validity
        if: steps.court.outcome != 'success'
        run: exit 1
