# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 content-ZIP fast-search generalization
on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths: ['benchmarks/v030_content_zip_fast_search_generalization.py','.github/workflows/v030-content-zip-fast-search-generalization.yml']
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: v030-fast-generalization-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs: {run_deep: '${{ steps.scope.outputs.run_deep }}'}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD >/tmp/f
          if grep -Eq '^(benchmarks/v030_content_zip_fast_search_generalization\.py|\.github/workflows/v030-content-zip-fast-search-generalization\.yml)$' /tmp/f; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi
  evidence:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    # The first exact-head run reached all 15 row-level byte/exactness checks and then hit the
    # 60-minute job cap during repeated timing/generalization work. Preserve the evaluator and give
    # the already-running final-form experiment enough wall-clock to emit its durable receipt.
    timeout-minutes: 90
    concurrency:
      group: v030-fast-generalization-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_content_zip_fast_search_generalization.py
      - run: python benchmarks/v030_content_zip_fast_search_generalization.py --output benchmark-artifacts/fast-search-generalization.json
      - run: python tools/check_ci_topology.py .github/workflows/v030-content-zip-fast-search-generalization.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-content-zip-fast-search-generalization-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/fast-search-generalization.json
          if-no-files-found: error
          retention-days: 90
