# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 compact locator RSS attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_compact_locator_rss_attribution.py'
      - '.github/workflows/v030-r4-compact-locator-rss-attribution.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-compact-locator-rss-attribution-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rss-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_compact_locator_rss_attribution.py
      - name: Run fresh-process RSS attribution
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_compact_locator_rss_attribution.py \
            --output benchmark-artifacts/v030-r4-locator-rss-attribution.json
      - name: Assert receipt integrity, not verdict
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-locator-rss-attribution.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['attribution']['same_input_and_cardinality']
          assert d['contract']['representation_unchanged']
          assert d['contract']['fresh_process_per_stage']
          assert d['contract']['direct_uvarint_rule']
          assert d['contract']['no_product_threshold_or_locality_change']
          print(json.dumps({'input':d['input'],'fresh_process_stages':d['fresh_process_stages'],'attribution':d['attribution'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-compact-locator-rss-attribution.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-compact-locator-rss-attribution-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-locator-rss-attribution.json
          if-no-files-found: error
          retention-days: 90
# Green means receipt integrity; JSON owns scientific verdict.
