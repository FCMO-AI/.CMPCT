# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 r24 materialization RSS
on:
  push:
    branches: [agent/v030-r24-streamed-materialization-rss-v2]
    paths:
      - 'src/cmpct/v030_release_materialization.py'
      - 'src/cmpct/__init__.py'
      - 'src/cmpct/_ordered_pull.py'
      - 'benchmarks/v030_r24_phase_rss_owner.py'
      - 'benchmarks/v030_r24_streamed_materialization_ab.py'
      - 'experiments/v030_r24_streamed_materialization.py'
      - 'tests/test_ordered_pull_iter.py'
      - 'tests/test_v030_r24_streamed_materialization.py'
      - '.github/workflows/v030-r24-phase-rss-owner.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: v030-r24-materialization-rss-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  materialization-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Full regression suite
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          pytest -q 2>&1 | tee benchmark-artifacts/full-tests.log
      - name: Prove materialization-specific contracts
        run: |
          set -euo pipefail
          pytest -q tests/test_ordered_pull_iter.py tests/test_v030_r24_streamed_materialization.py 2>&1 | tee benchmark-artifacts/materialization-tests.log
      - name: Run phase RSS falsifier
        run: |
          set -euo pipefail
          python benchmarks/v030_r24_phase_rss_owner.py --work-root "$RUNNER_TEMP/cmpct-r24-phase-rss" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-phase-rss-owner.json" 2>&1 | tee benchmark-artifacts/phase.log
      - name: Run exact-byte streamed A/B
        run: |
          set -euo pipefail
          python benchmarks/v030_r24_streamed_materialization_ab.py --work-root "$RUNNER_TEMP/cmpct-r24-stream-ab" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streamed-materialization-ab.json" 2>&1 | tee benchmark-artifacts/ab.log
      - name: CI topology self-check
        run: python tools/check_ci_topology.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-materialization-rss-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90

  whole-product-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Prove promoted worker binding
        run: python -m pytest -q tests/test_v030_perf_worker_product_binding.py
      - name: Run unchanged frozen whole-product runtime gate
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_performance_product.py \
            --work-root "$RUNNER_TEMP/cmpct-v030-product-runtime" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-release-performance.json" \
            2>&1 | tee benchmark-artifacts/v030-release-performance.stdout.txt
      - name: Independently enforce frozen thresholds and exact-head fingerprint
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments import entropygraph_v030_release_lock_strict as lock
          p=Path('benchmark-artifacts/v030-release-performance.json')
          assert p.is_file(), 'whole-product runtime evidence missing'
          data=json.loads(p.read_text())
          manifest=lock.load_manifest_strict()
          fingerprint,_=lock.CORE.fingerprint(manifest)
          assert data['candidate_fingerprint']==fingerprint
          contract=data['contract']; totals=data['totals']; gate=data['gate']
          assert contract['maximum_median_create_ratio']==1.10
          assert contract['maximum_workload_create_ratio']==1.25
          assert contract['maximum_median_extract_ratio']==1.10
          assert contract['maximum_workload_extract_ratio']==1.25
          assert contract['maximum_peak_rss_ratio']==1.25
          assert totals['median_create_ratio']<=1.10
          assert totals['max_workload_create_ratio']<=1.25
          assert totals['median_extract_ratio']<=1.10
          assert totals['max_workload_extract_ratio']<=1.25
          assert totals['max_peak_rss_ratio']<=1.25
          assert gate['passed'] is True
          print(json.dumps({'candidate_fingerprint': fingerprint, 'totals': totals, 'gate': gate}, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-materialization-whole-product-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-release-performance.json
            benchmark-artifacts/v030-release-performance.stdout.txt
          if-no-files-found: warn
          retention-days: 90
# The first job is diagnostic/component evidence only. The second job deliberately reuses the unchanged
# frozen whole-product runtime evaluator and thresholds on the exact branch head. It may close the existing
# runtime/RSS product gate, but grants no merge/tag/version/publish authority by itself.
