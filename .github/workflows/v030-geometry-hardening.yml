name: CMPCT v0.30 Geometry hardening

on:
  push:
    branches:
      - agent/v030-geometry-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-geometry-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run Geometry transform and hardening tests
        run: |
          python -m pytest -q \
            tests/test_v030_geometry.py \
            tests/test_v030_geometry_safe.py \
            tests/test_v030_geometry_guarded.py

      - name: Compile research modules
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_geometry.py \
            experiments/entropygraph_v030_geometry_safe.py \
            experiments/entropygraph_v030_geometry_guarded.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

# Footnote: this workflow is intentionally small and independent from the expensive 15-workload size gate.
# It can harden reader admission without cancelling or contaminating the exact-byte Geometry measurement.
