# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Logs fused-auth native seam v1

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'native/cmpct-logs-auth-oracle/**'
      - 'benchmarks/v030_logs_fused_auth_native_seam_v1.py'
      - 'docs/v030-rnd/R25_LOGS_FUSED_AUTH_NATIVE_SEAM_V1_PREREG.md'
      - '.github/workflows/v030-logs-fused-auth-native-seam-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-logs-fused-auth-native-seam-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify newest commit only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(native/cmpct-logs-auth-oracle/|benchmarks/v030_logs_fused_auth_native_seam_v1\.py|docs/v030-rnd/R25_LOGS_FUSED_AUTH_NATIVE_SEAM_V1_PREREG\.md|\.github/workflows/v030-logs-fused-auth-native-seam-v1\.yml)' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  fused-auth-ab:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact scientific head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
      - name: Install exact benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen instrument and research-only oracle
        run: |
          python -m py_compile benchmarks/v030_logs_fused_auth_native_seam_v1.py
          cargo build --release --manifest-path native/cmpct-logs-auth-oracle/Cargo.toml
          test -f native/cmpct-logs-auth-oracle/target/release/libcmpct_logs_auth_oracle.so
      - name: Run frozen complete-extraction paired A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_fused_auth_native_seam_v1.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-fused-auth-native-seam-v1-work" \
            --native-library "$GITHUB_WORKSPACE/native/cmpct-logs-auth-oracle/target/release/libcmpct_logs_auth_oracle.so" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-fused-auth-native-seam-v1.json"
      - name: Enforce frozen grammar and exact binding
        if: always()
        run: |
          test -f benchmark-artifacts/v030-logs-fused-auth-native-seam-v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-logs-fused-auth-native-seam-v1.json').read_text())
          assert d['schema']=='cmpct-v030-logs-fused-auth-native-seam-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='neutral_hostile_v1/05_logs_and_telemetry'
          assert d['selected']=='logs-inverse'
          assert d['rounds']==11
          assert d['release_credit'] is False
          assert d['production_source_changed'] is False
          assert d['crc32_disabled'] is False and d['sha256_disabled'] is False
          assert d['decision'] in {'FUSED_AUTH_NATIVE_SEAM_HEADROOM_SUPPORTED','FUSED_AUTH_NATIVE_SEAM_HEADROOM_NOT_SUPPORTED','INVALID_FUSED_AUTH_NATIVE_SEAM'}
          if d['decision']!='INVALID_FUSED_AUTH_NATIVE_SEAM': assert d['experiment_valid'] is True
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-fused-auth-native-seam-v1.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-logs-fused-auth-native-seam-v1-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-fused-auth-native-seam-v1.json
          if-no-files-found: error
          retention-days: 90

# Research-only narrow native seam. No product/release credit from this workflow.
