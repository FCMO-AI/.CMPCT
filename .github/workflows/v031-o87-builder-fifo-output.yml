# ci-lane: fast
# O87: bounded genuine-product POSIX FIFO destination negative, no release credit.
name: CMPCT v0.31 O87 genuine FIFO output availability court

on:
  push:
    branches:
      - 'agent/phased2-v031-o87-builder-fifo-output-falsifier-20261025'
  pull_request:
    paths:
      - 'tests/test_v031_o87_builder_fifo_output_court.py'
      - '.github/workflows/v031-o87-builder-fifo-output.yml'
      - 'docs/v031-research/2026-10-25-o87-builder-nonregular-output-prereg.md'
      - 'docs/v031-research/2026-10-25-o87-builder-nonregular-output-result.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o87-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-posix-negative:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact source/prereg/test and install real package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 7efcc51154b64fd6394ddffaab599760659f6c91 HEAD
          git merge-base --is-ancestor f5bd32b9bdcdc27735dc154a023d4ee800368637 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "64b0cd21ad54ce7c8e8c6f5847b3c613fff6511c"
          mkdir -p o87-evidence
          git rev-parse HEAD > o87-evidence/head.sha
          git hash-object src/cmpct/builder.py > o87-evidence/product.blob
          git hash-object tests/test_v031_o87_builder_fifo_output_court.py > o87-evidence/instrument.blob
          python -m pip install --disable-pip-version-check . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder
          root = Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip()).resolve()
          installed = Path(cmpct.builder.__file__).resolve()
          assert not installed.is_relative_to(root), (root,installed)
          print("O87_INSTALLED_PRODUCT="+str(installed),flush=True)
          PY
      - name: Execute bounded exact-source product court
        shell: bash
        run: |
          set -euo pipefail
          cp tests/test_v031_o87_builder_fifo_output_court.py o87-evidence/
          python -m pytest -vv -s o87-evidence/test_v031_o87_builder_fifo_output_court.py --junitxml=o87-evidence/junit.xml 2>&1 | tee o87-evidence/court.log
      - name: Audit all real tests and zero skips
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=list(ET.parse("o87-evidence/junit.xml").getroot().iter("testcase"))
          assert len(cases)==3, ("missing mandatory cases",len(cases))
          metrics={key:sum(c.find(key) is not None for c in cases) for key in ("failure","error","skipped")}
          assert metrics=={"failure":0,"error":0,"skipped":0},metrics
          assert all("o87" in (c.get("classname","").lower()+c.get("name","").lower()) for c in cases)
          log=Path("o87-evidence/court.log").read_text()
          assert "O87_REAL_PRODUCT_FIFO_TIMEOUT=CONFIRMED" in log, "genuine FIFO negative not observed"
          assert "O87_REAL_PRODUCT_SYMLINK_FIFO_TIMEOUT=CONFIRMED" in log, "symlink FIFO negative not observed"
          summary={"head":Path("o87-evidence/head.sha").read_text().strip(),
                   "product_blob":Path("o87-evidence/product.blob").read_text().strip(),
                   "instrument_blob":Path("o87-evidence/instrument.blob").read_text().strip(),
                   "executed":len(cases),"passing":3,"skipped":0,"failures":0,
                   "scope":"real installed POSIX product availability negative; no fix or release credit"}
          Path("o87-evidence/result.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("O87_AUDIT="+json.dumps(summary,sort_keys=True),flush=True)
          PY
      - name: Preserve source and all raw results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-o87-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: o87-evidence/
          if-no-files-found: warn
          retention-days: 30
