name: PR202 apply historical native ABBA wiring

on:
  push:
    branches:
      - agent/r24-native-abba-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r24-native-abba-convergence
          fetch-depth: 0
      - name: Apply exact workflow wiring and self-delete
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/zip-parity.yml')
          s = p.read_text()
          helper = '      - "tools/materialize_performance_base_native.py"\n'
          anchor = '      - "tools/aggregate_parity_runs.py"\n'
          if s.count(anchor) != 2:
              raise SystemExit(f'expected two event-filter anchors, found {s.count(anchor)}')
          s = s.replace(anchor, anchor + helper)
          old = "tools/(check_performance_regression|aggregate_parity_runs)\\.py|pyproject\\.toml|\\.github/workflows/zip-parity\\.yml)"
          new = "tools/(check_performance_regression|aggregate_parity_runs|materialize_performance_base_native)\\.py|pyproject\\.toml|\\.github/workflows/zip-parity\\.yml)"
          if s.count(old) != 1:
              raise SystemExit(f'expected one classifier regex, found {s.count(old)}')
          s = s.replace(old, new, 1)
          corpus_anchor = '      - name: Generate one immutable release corpus\n'
          insert = '''      - name: Materialize historical package-owned native engine\n        run: |\n          mkdir -p benchmark-artifacts\n          python tools/materialize_performance_base_native.py /tmp/cmpct-performance-base --receipt benchmark-artifacts/base-native.json\n          python - <<'PY2'\n          import json\n          from pathlib import Path\n          from cmpct import native_codec\n          receipt = json.loads(Path('benchmark-artifacts/base-native.json').read_text())\n          base = Path(receipt['native_path']).resolve()\n          candidate = native_codec._library_path().resolve()\n          if base == candidate:\n              raise SystemExit(f'base/candidate native ownership alias: {base}')\n          if Path('/tmp/cmpct-performance-base').resolve() not in base.parents:\n              raise SystemExit(f'base native escaped historical worktree: {base}')\n          Path('benchmark-artifacts/native-ownership.txt').write_text(\n              f'base_native={base}\\ncandidate_native={candidate}\\nphysical_distinct=true\\n'\n          )\n          PY2\n\n'''
          if s.count(corpus_anchor) != 1:
              raise SystemExit(f'expected one corpus step, found {s.count(corpus_anchor)}')
          base_i = s.index('      - name: Materialize base engine worktree\n')
          corpus_i = s.index(corpus_anchor)
          if not base_i < corpus_i:
              raise SystemExit('base worktree must precede corpus generation')
          s = s.replace(corpus_anchor, insert + corpus_anchor, 1)
          p.write_text(s)
          PY
          rm .github/workflows/pr202-apply-native-abba.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zip-parity.yml .github/workflows/pr202-apply-native-abba.yml
          git commit -m 'ci: materialize historical native engine before ABBA corpus'
          git push origin HEAD:agent/r24-native-abba-convergence
