# ci-lane: release
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 release reader

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-release-reader-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.impact.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: impact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(src/cmpct/|experiments/entropygraph_v030_(geometry|hierarchical_geometry|geometry_overlay|geometry_overlay_g04|geometry_overlay_g04_publish|prefixgraph|prefixgraph_parallel|release|release_reader|release_reader_policy|release_candidate|release_product|release_product_base|zipfactor_recovery_product_candidate)([^/]*)\.py$|tests/test_v030_(geometry|hierarchical_geometry|geometry_overlay|geometry_overlay_g04|g04_publish|prefixgraph|prefixgraph_parallel_release|release_reader|release_reader_policy|release_candidate|zipfactor_recovery_product_candidate)\.py$|tests/test_v029_parallel_portfolio\.py$|pyproject\.toml$|\.github/workflows/v030-release-reader\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  release-reader:
    needs: impact
    if: needs.impact.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind reader proof to exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reader/test dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile reader, policy and owning grammars
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_geometry_overlay_g04.py \
            experiments/entropygraph_v030_geometry_overlay_g04_publish.py \
            experiments/entropygraph_v030_prefixgraph.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release.py \
            experiments/entropygraph_v030_zipfactor_recovery_product_candidate.py

      - name: Run direct-reader, promotion-policy, recovery, locality and publication tests
        run: |
          python -m pytest -q \
            tests/test_v030_geometry.py \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_geometry_overlay.py \
            tests/test_v030_geometry_overlay_g04.py \
            tests/test_v030_g04_publish.py \
            tests/test_v030_prefixgraph.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_release_candidate.py \
            tests/test_v030_zipfactor_recovery_product_candidate.py \
            tests/test_v029_parallel_portfolio.py

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-release-reader.yml

# Direct Python reader/recovery/locality proof remains mandatory for any exact head that can affect its semantics.
# Orthogonal research-only commits now pay only the cheap impact classifier; all reader tests and gates are unchanged.
