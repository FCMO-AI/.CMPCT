# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# Scientific same-wire locality transfer on unchanged Reader owners; NOT release promotion.
name: CMPCT J24R03 sparse locality transfer ABBA
on:
  push:
    branches:
      - agent/phased2-v031-j24r03-sparse-locality-transfer-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24r03-locality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-locality:
    name: Authenticated r24 original/candidate locality ABBA (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact experimental HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen real code and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 70336307312b5b277f0885c0057d2cddab0aefc1 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = ca1763b9d69b385eab80d0ed67a914672dbe93fc
          test "$(git rev-parse c5e13bb3fbb4cdade8b64246658ce7c7818de41f:src/cmpct/reader.py)" = dbd4ac576a05a47eae97e1e40de89cf1de440516
          test "$(git rev-parse HEAD:tests/test_o212_sparse_admission.py)" = 10605b0a255c90c9ebe2473bf7aefdb14e9b4ea3
          test "$(git rev-parse HEAD:tests/test_j24r01_sparse_selective_index.py)" = 9193090264755d07b0ef3f2741608d0f341eebfe
          git merge-base --is-ancestor ed5551f710a70ed0c2b3319f36321e44a60c907b HEAD
          python -m py_compile research/j24r03_sparse_locality_court.py research/j24r03_locality_referee.py
          mkdir -p j24r03-evidence
          git rev-parse HEAD > j24r03-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > j24r03-evidence/candidate-reader.blob
          git rev-parse c5e13bb3fbb4cdade8b64246658ce7c7818de41f:src/cmpct/reader.py > j24r03-evidence/baseline-reader.blob
          git rev-parse HEAD:research/j24r03_sparse_locality_court.py > j24r03-evidence/producer.blob
          git rev-parse HEAD:research/j24r03_locality_referee.py > j24r03-evidence/referee.blob
      - name: Install both exact sources separately
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/j24r03-baseline-src" c5e13bb3fbb4cdade8b64246658ce7c7818de41f
          python -m pip install . pytest
          python -m pip install --no-deps --no-compile --target "$RUNNER_TEMP/j24r03-base-site" "$RUNNER_TEMP/j24r03-baseline-src"
          python -m pip install --no-deps --no-compile --target "$RUNNER_TEMP/j24r03-candidate-site" "$GITHUB_WORKSPACE"
          test -s "$RUNNER_TEMP/j24r03-base-site/cmpct/reader.py"
          test -s "$RUNNER_TEMP/j24r03-candidate-site/cmpct/reader.py"
      - name: Run unmodified inherited hostile geometry and sparse range semantics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib,os,subprocess
          from pathlib import Path
          import cmpct.reader
          ws=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          actual=Path(cmpct.reader.__file__).resolve()
          assert not actual.is_relative_to(ws),actual
          committed=subprocess.check_output(["git","show","HEAD:src/cmpct/reader.py"],cwd=ws)
          assert actual.read_bytes().replace(b"\r\n",b"\n")==committed.replace(b"\r\n",b"\n")
          print("J24R03_INSTALLED_SEMANTICS_SOURCE_SHA256="+hashlib.sha256(committed).hexdigest())
          PY
          python -m pytest -q "$GITHUB_WORKSPACE/tests/test_o212_sparse_admission.py" "$GITHUB_WORKSPACE/tests/test_j24r01_sparse_selective_index.py" 2>&1 | tee "$GITHUB_WORKSPACE/j24r03-evidence/inherited-semantics.log"
      - name: Execute preregistered real Reader source-exact ABBA on five locality regimes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/j24r03_sparse_locality_court.py" \
            --repo "$GITHUB_WORKSPACE" \
            --base-site "$RUNNER_TEMP/j24r03-base-site" \
            --candidate-site "$RUNNER_TEMP/j24r03-candidate-site" \
            --out "$GITHUB_WORKSPACE/j24r03-evidence/locality-results.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/j24r03-evidence/locality-run.log"
          test -s "$GITHUB_WORKSPACE/j24r03-evidence/locality-results.json"
          grep -q 'J24R03_ORIGINAL_OBSERVATIONS=240' "$GITHUB_WORKSPACE/j24r03-evidence/locality-run.log"
      - name: Independently audit original results and reject mutated evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/j24r03_locality_referee.py" \
            "$GITHUB_WORKSPACE/j24r03-evidence/locality-results.json" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/j24r03-base-site" \
            "$RUNNER_TEMP/j24r03-candidate-site" \
            "$GITHUB_WORKSPACE/j24r03-evidence/independent-audit.json" mutate-check \
            2>&1 | tee "$GITHUB_WORKSPACE/j24r03-evidence/independent-audit.log"
          grep -q 'J24R03_INDEPENDENT_AUDIT=PASS' "$GITHUB_WORKSPACE/j24r03-evidence/independent-audit.log"
      - name: Hash evidence payloads before upload
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("j24r03-evidence")
          root.mkdir(exist_ok=True)
          allfiles=[p for p in root.rglob("*") if p.is_file() and p.name!="evidence-sha256.json"]
          (root/"evidence-sha256.json").write_text(json.dumps({
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in allfiles},indent=2,sort_keys=True)+"\n")
          PY
      - name: Preserve success or failure, including incomplete ABBA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24r03-locality-${{ github.sha }}
          path: j24r03-evidence/
          retention-days: 30
          if-no-files-found: warn
