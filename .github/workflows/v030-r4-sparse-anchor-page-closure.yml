# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 sparse-anchor page closure

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_sparse_anchor_page_closure_oracle.py'
      - '.github/workflows/v030-r4-sparse-anchor-page-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-page-closure-${{ github.sha }}
  cancel-in-progress: false

jobs:
  page-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run page-closure oracle
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_sparse_anchor_page_closure_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-page-closure-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-page-closure.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-page-closure.json'))
          assert d['schema']=='cmpct-v030-r4-sparse-anchor-page-closure-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit'] and c['full_parent_graph_is_oracle_only']
          print(json.dumps({
            'parser':d['parser'],
            'page_closure':d['page_closure'],
            'hypothesis':d['hypothesis'],
            'interpretation':d['interpretation'],
          }, sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-sparse-anchor-page-closure.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-sparse-anchor-page-closure-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-page-closure.json
          if-no-files-found: error
          retention-days: 90
