# ci-lane: fast
name: CMPCT v0.30 ZIP-factor recovery product/native parity

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_zipfactor_recovery_product_native_parity.py'
      - 'experiments/entropygraph_v030_zipfactor_recovery_product_candidate.py'
      - 'experiments/entropygraph_v030_zipfactor_product_candidate.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'native/cmpct-portable/src/bin/cmpct-zipfactor-v4-recovery-preparity.rs'
      - '.github/workflows/v030-zipfactor-recovery-product-native-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-recovery-product-native-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  product-native-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile product/native parity surfaces
        run: |
          python -m py_compile benchmarks/v030_zipfactor_recovery_product_native_parity.py
          python -m py_compile experiments/entropygraph_v030_zipfactor_recovery_product_candidate.py
          cargo build --release --manifest-path native/cmpct-portable/Cargo.toml --bin cmpct-zipfactor-v4-recovery-preparity
          cargo clippy --manifest-path native/cmpct-portable/Cargo.toml --bin cmpct-zipfactor-v4-recovery-preparity -- -D warnings
      - name: Preserve canonical product candidate tests
        run: |
          python -m pytest -q \
            tests/test_v030_zipfactor_product_candidate.py \
            tests/test_v030_zipfactor_recovery_product_candidate.py \
            tests/test_v030_zipfactor_recovery_product_candidate_ratchet.py
      - name: Prove exact product bytes through portable native recovery reader
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_zipfactor_recovery_product_native_parity.py \
            --native-cli "$GITHUB_WORKSPACE/native/cmpct-portable/target/release/cmpct-zipfactor-v4-recovery-preparity" \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-product-native-parity-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zf-product-native-parity.json"
      - name: Ratchet promotion boundary
        if: always()
        run: |
          test -f benchmark-artifacts/v030-zf-product-native-parity.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-zf-product-native-parity.json').read_text())
          assert d['schema']=='cmpct-v030-zipfactor-recovery-product-native-parity-v1'
          assert d['candidate_head']==os.environ['EVIDENCE_HEAD']
          assert d['target']=='resemblance_hostile_v1/04_deflate_family'
          a=d['archive']; g=d['gate']
          assert a['payload_body_copies']==1 and a['control_copies']==2
          assert a['path_identity_used_for_admission'] is False
          assert float(a['max_member_read_amplification'])<=8.0
          assert int(a['max_decode_unit_bytes'])<=8*1024*1024
          assert g['canonical_product_constructor_used'] is True
          assert g['python_clean_verified'] is True
          assert g['native_clean_verified'] is True
          assert g['python_recovery_identity_preserved'] is True
          assert g['native_recovery_failover_matches_python'] is True
          assert g['python_double_control_damage_rejected'] is True
          assert g['native_double_control_damage_rejected'] is True
          assert g['selector_still_disabled'] is True
          assert g['passed'] is True
          assert g['release_credit'] is False and d['release_credit'] is False
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-recovery-product-native-parity.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: Upload exact parity receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zipfactor-recovery-product-native-parity-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-zf-product-native-parity.json
          if-no-files-found: error
          retention-days: 90

# Productization parity only; selector/native extraction/Android/final authority remain separate.
