# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Genesis child CPU attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_genesis_rss_attribution.py'
      - 'benchmarks/v030_genesis_child_cpu_attribution.py'
      - '.github/workflows/v030-genesis-child-cpu-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
  FROZEN_V030: f4b158a55a08b9b18b50e4e4abe4b9251048c772

concurrency:
  group: cmpct-v030-genesis-child-cpu-${{ github.sha }}
  cancel-in-progress: false

jobs:
  child-cpu-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact head and frozen comparator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git cat-file -e "$FROZEN_V030^{commit}"
          git worktree add --detach "$RUNNER_TEMP/cmpct-v030-frozen" "$FROZEN_V030"
          test "$(git -C "$RUNNER_TEMP/cmpct-v030-frozen" rev-parse HEAD)" = "$FROZEN_V030"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus and frozen-product dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile attribution probes
        run: |
          python -m py_compile \
            benchmarks/v030_genesis_rss_attribution.py \
            benchmarks/v030_genesis_child_cpu_attribution.py
      - name: Charge parent and child CPU on frozen v0.30
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_genesis_child_cpu_attribution.py \
            --repo "$GITHUB_WORKSPACE" \
            --checkout "$RUNNER_TEMP/cmpct-v030-frozen" \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-child-cpu-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-child-cpu.json"
      - name: Enforce attribution receipt integrity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-child-cpu.json').read_text())
          assert d['schema']=='cmpct-v030-genesis-child-cpu-attribution-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['frozen_v030_sha']==os.environ['FROZEN_V030']
          assert {r['workload'] for r in d['rows']}=={'analytics','deflate_family'}
          assert all(r['loaded_cmpct_modules'] for r in d['rows'])
          assert all(r['cpu']['total_process_tree_cpu_s'] >= r['cpu']['self_cpu_s'] >= 0 for r in d['rows'])
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit']
          assert c['frozen_source_sealed'] and c['self_and_reaped_child_cpu_charged'] and not c['timing_boundary_changed']
          print(json.dumps({r['workload']:{'wall_s':r['wall_s'],**r['cpu']} for r in d['rows']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-genesis-child-cpu-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-child-cpu.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. It corrects accounting interpretation; it does not alter the frozen contender or gate result.
