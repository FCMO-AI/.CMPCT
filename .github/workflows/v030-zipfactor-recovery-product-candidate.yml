# ci-lane: fast
name: CMPCT v0.30 ZIP-factor recovery product candidate

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_zipfactor_recovery_product_candidate.py'
      - 'experiments/entropygraph_v030_zipfactor_recovery_reader_candidate.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3_fused_finalize.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'tests/test_v030_zipfactor_recovery_product_candidate.py'
      - 'tests/test_v030_zipfactor_recovery_reader_candidate.py'
      - '.github/workflows/v030-zipfactor-recovery-product-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-recovery-product-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  product-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact reader/test contract
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile canonical candidate boundary
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_zipfactor_recovery_product_candidate.py \
            experiments/entropygraph_v030_zipfactor_recovery_reader_candidate.py \
            tests/test_v030_zipfactor_recovery_product_candidate.py \
            tests/test_v030_zipfactor_recovery_reader_candidate.py
      - name: Prove recovery, selective locality, transactional extraction and fail-closed budgets
        run: |
          python -m pytest -q \
            tests/test_v030_zipfactor_recovery_product_candidate.py \
            tests/test_v030_zipfactor_recovery_reader_candidate.py
      - name: Enforce candidates remain unpromoted
        run: |
          python - <<'PY'
          from experiments import entropygraph_v030_zipfactor_recovery_product_candidate as product
          from experiments import entropygraph_v030_zipfactor_recovery_reader_candidate as reader
          assert product.PROMOTION_STATE == 'canonical-reader-candidate-only'
          assert product.SELECTOR_ENABLED is False
          assert product.PUBLIC_EXTRACT_COMPLETE is True
          assert product.RELEASE_CREDIT is False
          assert reader.PROMOTION_STATE == 'canonical-selective-reader-candidate-only'
          assert reader.SELECTOR_ENABLED is False
          assert reader.RELEASE_CREDIT is False
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-recovery-product-candidate.yml
      - name: Public-surface guard
        run: python tools/check_public_surface.py

# Focused productization gate only. Passing proves the canonical CMP25Z4 Python build/recovery/extract owner plus a
# selective reader that does not full-verify unrelated groups. It does not enable the selector and does not replace
# native, Android, competitor, all-15 or strict final release authority.
