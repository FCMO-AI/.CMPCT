# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics prefix selector physical referee

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_prefix_probe_physical_referee.py'
      - '.github/workflows/v030-analytics-prefix-probe-physical.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_prefix_probe_physical_referee.py'
      - '.github/workflows/v030-analytics-prefix-probe-physical.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-analytics-prefix-physical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          cat /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_prefix_probe_physical_referee\.py|\.github/workflows/v030-analytics-prefix-probe-physical\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  analytics-prefix-physical:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx zstandard
      - run: python -m py_compile benchmarks/v030_analytics_prefix_probe_physical_referee.py
      - name: Run charged Analytics prefix selector referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_prefix_probe_physical_referee.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-prefix-physical-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-prefix-physical.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-prefix-physical.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-prefix-probe-physical-referee-v1'
          assert d['release_credit'] is False and d['product_credit'] is False
          assert d['rounds']==3
          assert d['frozen_rule']=={
              'min_size_bytes': 262144,
              'prefix_bytes': 4096,
              'prefix_codec': 'zstd-1',
              'max_prefix_zstd1_ratio_ppm': 700000,
          }
          assert d['predeclared_decision']['accepted_v029_bytes']==6135172
          assert d['predeclared_decision']['expected_oracle_bytes']==6134940
          assert d['predeclared_decision']['material_l19_speedup_fraction']==0.20
          assert d['gates']['sizes_deterministic'] is True
          assert d['gates']['selector_shape_stable'] is True
          assert d['verdict'] in {
              'ADVANCE_TO_HELDOUT_AND_COMPLETE_PRODUCT',
              'NARROW_TO_EXECUTION_SPEED_DEBT',
              'RETIRE_PREFIX_SELECTOR_AS_CURRENT_ECONOMIC_ROUTE',
          }
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-prefix-probe-physical.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-prefix-physical-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-prefix-physical.json
          if-no-files-found: error
          retention-days: 90

# Research-only physical referee. Green means receipt integrity, not scientific success or release credit.
