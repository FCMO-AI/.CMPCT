name: Agent native vzip identity fix

on:
  push:
    branches:
      - agent/mode0-streaming-auth

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mode0-streaming-auth
          fetch-depth: 0
      - name: Apply revision-24 virtual-ZIP identity rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('native/cmpct-core/src/lib.rs')
          text = path.read_text()
          marker = '''        if matches!(
              storage,
              Storage::Fixed(_) | Storage::VirtualZip(_) | Storage::Sparse(_) | Storage::Cdc(_)
          ) && logical_hash.is_none()
          '''
          # Match by semantic anchors rather than formatter-sensitive whitespace.
          anchor = 'Storage::Fixed(_) | Storage::VirtualZip(_) | Storage::Sparse(_) | Storage::Cdc(_)'
          anchor_pos = text.index(anchor)
          start = text.rfind('        if matches!(', 0, anchor_pos)
          end = text.index('        entries.push(', anchor_pos)
          if start < 0:
              raise SystemExit('logical-map hash guard not found')
          new = '''        if matches!(storage, Storage::Fixed(_) | Storage::Sparse(_) | Storage::Cdc(_))
              && logical_hash.is_none()
          {
              return Err(CmpctError::Schema(format!(
                  "file row {i} logical-map member is missing SHA-256"
              )));
          }
          if let Storage::VirtualZip(recipe) = &storage {
              // Footnote: revision 24 authenticates the reconstructed nested ZIP in the recipe itself.
              // A duplicate file-row SHA is optional for this representation; when present it is an
              // additional consistency check and must agree with the authoritative recipe identity.
              if let Some(file_hash) = logical_hash {
                  if file_hash != recipe.logical_sha256 {
                      return Err(CmpctError::Schema(format!(
                          "file row {i} virtual-ZIP recipe SHA-256 disagrees with file identity"
                      )));
                  }
              }
          }
          '''
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Format and validate native virtual-ZIP ABI
        run: |
          cargo fmt --manifest-path native/cmpct-core/Cargo.toml
          cargo clippy --manifest-path native/cmpct-core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/cmpct-core/Cargo.toml
          cargo build --manifest-path native/cmpct-core/Cargo.toml --release
          python -m pip install -e '.[test]'
          python tests/native_virtual_zip_abi.py
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/agent-fix-vzip-hash.yml
          git config user.name 'cmpct-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add native/cmpct-core/src/lib.rs
          git commit -m 'native: accept recipe-authenticated virtual ZIP identity'
          git push origin HEAD:agent/mode0-streaming-auth
