# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 EG08 fused verify locality

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_eg08_fused_verify_locality_oracle.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_exec_v6.py'
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - '.github/workflows/v030-eg08-fused-verify-locality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-eg08-fused-vl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_(eg08_fused_verify_locality_oracle|federated_compact_framing_v8_policy_exec_v6)\.py|experiments/entropygraph_v030_(federated_compact_framing_candidate_v8|federated_embedded_fs_candidate_v7)\.py|\.github/workflows/v030-eg08-fused-verify-locality\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect EG08 fused verify/locality.'
          fi

  fused-verify-locality:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile fusion oracle
        run: python -m py_compile benchmarks/v030_eg08_fused_verify_locality_oracle.py
      - name: Run exact-byte one-expansion proof
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_eg08_fused_verify_locality_oracle \
            --work-root benchmark-artifacts/v030-eg08-fused-vl-work \
            --output benchmark-artifacts/v030-eg08-fused-vl.json
      - name: Enforce experiment and strict promotion boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-fused-vl.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-fused-verify-locality-v1'
          x=d['execution_change']; m=d['measured_candidate']; s=d['strict']
          assert d['experiment_valid'] is True
          assert x['eg08_expansion_count_per_round']==1
          assert x['eg07_semantic_owners_unchanged'] is True
          assert x['archive_strong_verification_still_timed'] is True
          assert x['locality_still_timed'] is True
          assert x['comparator_timing_changed'] is False
          assert x['archive_bytes_changed'] is False
          assert x['selected_levels_changed'] is False
          assert m['exact_bytes_vs_serial_reference'] is True
          assert m['archive_bytes'] < d['accepted_v029_bytes']
          assert m['archive_bytes'] < d['comparators']['zip']['archive_bytes']
          assert m['archive_bytes'] < d['comparators']['zstd19']['archive_bytes']
          assert m['max_member_read_amplification'] <= 8.0
          assert m['max_decode_unit_bytes'] <= 8*1024*1024
          assert d['promotion_signal'] is s['passed']
          assert d['release_credit'] is False
          Path('benchmark-artifacts/v030-eg08-fused-vl-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-eg08-fused-verify-locality.yml
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-eg08-fused-vl-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-eg08-fused-vl.json
            benchmark-artifacts/v030-eg08-fused-vl-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Research-only. This lane removes one duplicate EG08 parse/expansion/materialization pass while keeping both mature
# EG07 semantic consumers timed. Only a complete strict ZIP/Zstd size+creation win can raise promotion_signal; no
# selector/native/Android/release credit is granted here. Exact-newest-head admission prevents unrelated commits in
# the long-lived integration PR from replaying this 90-minute experiment.
