name: CMPCT Android

on:
  pull_request:
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'

jobs:
  build-and-device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Enable KVM for Android emulator
        run: |
          # Footnote: GitHub Linux runners expose Android hardware acceleration, but /dev/kvm access
          # must be granted to the runner process. Without this, a headless emulator can stall before
          # adb ever sees a device and hide application-level failures behind CI infrastructure noise.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          cargo install cargo-ndk --locked

      - name: Install Android build and emulator packages
        run: |
          # Footnote: setup-android owns cmdline-tools discovery/PATH. Do not assume GitHub runner
          # images expose sdkmanager globally; that assumption caused the first Android gate to fail
          # before compilation even began. API 36 is deliberately stable rather than preview API 37.
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1' \
            'platform-tools' \
            'emulator' \
            'system-images;android-29;google_apis;x86_64'

      - name: Build debug APK for all declared ABIs
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          gradle --no-daemon :app:assembleDebug

      - name: Verify packaged JNI dependency is relocatable
        working-directory: integrations/android
        run: |
          # Footnote: the first real emulator run caught an absolute /home/runner DT_NEEDED entry.
          # Inspect the packaged ELF directly so that class of host-path leak fails before device boot.
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            lib/x86_64/libcmpct_android.so > "$RUNNER_TEMP/libcmpct_android.so"
          readelf -d "$RUNNER_TEMP/libcmpct_android.so" | tee "$RUNNER_TEMP/cmpct-elf-dynamic.txt"
          grep -Fq 'Shared library: [libcmpct_core.so]' "$RUNNER_TEMP/cmpct-elf-dynamic.txt"
          if grep -Fq '/home/' "$RUNNER_TEMP/cmpct-elf-dynamic.txt"; then
            echo 'host filesystem path leaked into Android DT_NEEDED' >&2
            exit 1
          fi

      - name: Create Android 10 emulator
        run: |
          # Footnote: Android documents ANDROID_AVD_HOME as the first directory searched by
          # `emulator -avd`. Pin both creation and launch to the same explicit CI directory instead
          # of relying on whichever HOME/SDK-home convention a particular command-line-tools build
          # happens to choose.
          AVD_HOME="$RUNNER_TEMP/cmpct-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name cmpct-api29 \
            --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2' \
            --path "$AVD_HOME/cmpct-api29.avd"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx cmpct-api29

      - name: Start emulator
        run: |
          # Footnote: sdkmanager installs the emulator under the SDK root, but setup-android does not
          # promise that directory will be added to PATH after a later package install. Use the exact
          # executable path so device acceptance cannot fail merely because command discovery drifted.
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd cmpct-api29 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/cmpct-emulator.log" 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            cat "$RUNNER_TEMP/cmpct-emulator.log" >&2
            exit 1
          fi
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb shell input keyevent 82 || true
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/cmpct-emulator.log" >&2
          exit 1

      - name: Run revision-24 Android archive UX and JNI conformance tests
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          gradle --no-daemon :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmpct-android-debug
          path: |
            integrations/android/app/build/outputs/apk/debug/app-debug.apk
            integrations/android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
