name: CMPCT Android

on:
  pull_request:
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'

jobs:
  build-and-device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          cargo install cargo-ndk --locked

      - name: Install Android build and emulator packages
        run: |
          # Footnote: setup-android owns cmdline-tools discovery/PATH. Do not assume GitHub runner
          # images expose sdkmanager globally; that assumption caused the first Android gate to fail
          # before compilation even began.
          sdkmanager \
            'platforms;android-37' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1' \
            'platform-tools' \
            'emulator' \
            'system-images;android-29;google_apis;x86_64'

      - name: Build debug APK for all declared ABIs
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          gradle --no-daemon :app:assembleDebug

      - name: Create Android 10 emulator
        run: |
          echo no | avdmanager create avd \
            --force \
            --name cmpct-api29 \
            --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2'

      - name: Start emulator
        run: |
          nohup emulator \
            -avd cmpct-api29 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/cmpct-emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/cmpct-emulator.log" >&2
          exit 1

      - name: Run revision-24 JNI conformance smoke tests
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          gradle --no-daemon :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmpct-android-debug
          path: |
            integrations/android/app/build/outputs/apk/debug/app-debug.apk
            integrations/android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
