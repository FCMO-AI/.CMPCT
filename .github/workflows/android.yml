name: CMPCT Android
# ci-lane: release

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'native/cmpct-portable/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-physical-arm64.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/android/**'
      - 'native/cmpct-core/**'
      - 'native/cmpct-portable/**'
      - 'tests/conformance/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-physical-arm64.yml'
  workflow_dispatch:

concurrency:
  group: cmpct-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # Footnote: PR workflow metadata points at GitHub's synthetic merge ref. Release evidence must instead
          # identify the exact candidate source tree whose fingerprint is frozen, so tests explicitly check out
          # the PR head while still benefiting from GitHub's ordinary PR trigger/branch-protection semantics.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Select Android emulator acceleration
        run: |
          # Footnote: /dev/kvm is an optional hosted-runner capability, not an Android product requirement.
          # When GitHub exposes it we grant the runner access and use hardware acceleration; when a runner
          # instance has no KVM device at all, the same x86_64 instrumentation gate continues under the emulator's
          # software engine instead of failing before Rust/Gradle compilation. Physical ARM64 acceptance remains
          # a separate v0.30 release-lock fact and is never inferred from this emulator job.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 0666 /dev/kvm || true
            test -r /dev/kvm
            test -w /dev/kvm
            echo 'CMPCT_ANDROID_EMULATOR_ACCEL=on' >> "$GITHUB_ENV"
            echo 'Android emulator acceleration: KVM'
          else
            echo 'CMPCT_ANDROID_EMULATOR_ACCEL=off' >> "$GITHUB_ENV"
            echo 'Android emulator acceleration: software (hosted runner has no /dev/kvm)'
          fi

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          cargo install cargo-ndk --locked

      - name: Install Android build and emulator packages
        run: |
          # Footnote: setup-android owns cmdline-tools discovery/PATH. Do not assume GitHub runner
          # images expose sdkmanager globally; that assumption caused the first Android gate to fail
          # before compilation even began. API 36 is deliberately stable rather than preview API 37.
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1' \
            'platform-tools' \
            'emulator' \
            'system-images;android-29;google_apis;x86_64'

      - name: Build debug APK for all declared ABIs
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          gradle --no-daemon :app:assembleDebug

      - name: Verify packaged JNI dependency is relocatable and portable
        working-directory: integrations/android
        run: |
          # Footnote: the first real emulator run caught an absolute /home/runner DT_NEEDED entry.
          # Inspect the packaged ELF directly so that class of host-path leak fails before device boot;
          # also require the shared portable dispatcher rather than the obsolete r24-only dependency.
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            lib/x86_64/libcmpct_android.so > "$RUNNER_TEMP/libcmpct_android.so"
          readelf -d "$RUNNER_TEMP/libcmpct_android.so" | tee "$RUNNER_TEMP/cmpct-elf-dynamic.txt"
          grep -Fq 'Shared library: [libcmpct_portable.so]' "$RUNNER_TEMP/cmpct-elf-dynamic.txt"
          if grep -Fq 'Shared library: [libcmpct_core.so]' "$RUNNER_TEMP/cmpct-elf-dynamic.txt"; then
            echo 'Android JNI still links the r24-only core directly' >&2
            exit 1
          fi
          if grep -Fq '/home/' "$RUNNER_TEMP/cmpct-elf-dynamic.txt"; then
            echo 'host filesystem path leaked into Android DT_NEEDED' >&2
            exit 1
          fi

      - name: Create Android 10 emulator
        run: |
          AVD_HOME="$RUNNER_TEMP/cmpct-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name cmpct-api29 \
            --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2' \
            --path "$AVD_HOME/cmpct-api29.avd"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx cmpct-api29

      - name: Start emulator
        run: |
          # Footnote: explicitly pass the acceleration mode chosen from the actual runner device state. The
          # software fallback is slower but exercises the identical APK/system image and prevents transient KVM
          # allocation from deciding whether Android code is tested at all.
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd cmpct-api29 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -accel "$CMPCT_ANDROID_EMULATOR_ACCEL" \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/cmpct-emulator.log" 2>&1 &
          if ! timeout 300 adb wait-for-device; then
            cat "$RUNNER_TEMP/cmpct-emulator.log" >&2
            exit 1
          fi
          for _ in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb shell input keyevent 82 || true
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/cmpct-emulator.log" >&2
          exit 1

      - name: Run Android archive UX and shared JNI conformance tests
        working-directory: integrations/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Record exact-candidate hosted Android evidence
        run: |
          # Footnote: the physical ARM64 workflow consumes this machine-readable artifact and independently
          # verifies its source SHA/fingerprint before it can claim the required Android platform matrix green.
          # Generating it only after connectedDebugAndroidTest succeeds prevents a failed emulator run from
          # leaving behind a superficially plausible positive receipt.
          python -m experiments.entropygraph_v030_release_lock_strict --print-fingerprint \
            > "$RUNNER_TEMP/cmpct-v030-fingerprint.json"
          python - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          fingerprint = json.loads((temp / 'cmpct-v030-fingerprint.json').read_text())['candidate_fingerprint']
          candidate_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = {
              'schema': 'cmpct-v030-hosted-android-evidence-v1',
              'candidate_sha': candidate_sha,
              'candidate_fingerprint': fingerprint,
              'workflow': 'android.yml',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'facts': {
                  'hosted_android_emulator_green': True,
                  'emulator_arch': 'x86_64',
                  'emulator_api': 29,
                  'all_declared_abis_built': True,
                  'portable_jni_dependency_verified': True,
              },
          }
          (temp / 'cmpct-hosted-android-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/android.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cmpct-android-debug-${{ github.sha }}
          path: |
            integrations/android/app/build/outputs/apk/debug/app-debug.apk
            integrations/android/app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/cmpct-emulator.log
            ${{ runner.temp }}/cmpct-elf-dynamic.txt
            ${{ runner.temp }}/cmpct-hosted-android-evidence.json
          if-no-files-found: warn
          retention-days: 30

# Footnote: Android consumes libcmpct_portable through a parser-free JNI shim. Canonical r25 and inherited r24
# therefore share one Rust admission/recovery/resource implementation; Android-specific parser drift is a release
# blocker, not a supported portability strategy. This hosted emulator gate is intentionally not the physical ARM64
# release receipt required by v0.30; it proves build/package/routing/JNI behavior while the physical device gate
# independently proves real arm64-v8a provider and lifecycle behavior.
