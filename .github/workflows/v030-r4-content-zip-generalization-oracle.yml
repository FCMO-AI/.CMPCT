# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 content ZIP generalization oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_content_zip_generalization_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/codec.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-content-zip-generalization-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_content_zip_generalization_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'src/cmpct/builder.py'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/codec.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r4-content-zip-generalization-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v030-r4-content-zip-generalization-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_content_zip_generalization_oracle\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/resemblance_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|src/cmpct/(builder|reader|codec)\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r4-content-zip-generalization-oracle\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  content-zip-generalization:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact generalization oracle
        run: python -m py_compile benchmarks/v030_r4_content_zip_generalization_oracle.py
      - name: Measure content-driven VZIP admission on all frozen workloads
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_content_zip_generalization_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-content-zip-generalization-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-content-zip-generalization.json"
      - name: Enforce diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-content-zip-generalization.json').read_text())
          assert d['schema']=='cmpct-v030-r4-content-zip-generalization-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert len(d['rows'])==15 and d['summary']['workloads']==15
          assert all(r['baseline']['tree_sha256']==r['tree_sha256'] for r in d['rows'])
          assert all(r['probe']['tree_sha256']==r['tree_sha256'] for r in d['rows'])
          h=d['hypothesis']; assert isinstance(h['office_content_zip_discovery_saves_at_least_8mb'],bool); assert isinstance(h['zero_byte_regressions_across_15'],bool); assert h['all_15_exact_product_tree']; assert isinstance(h['supported_for_research_builder_admission'],bool)
          c=d['contract']; assert c['diagnostic_only'] and c['release_credit'] is False; assert c['production_builder_changed'] is False; assert c['original_extension_used_for_candidate_validation'] is False; assert c['path_lengths_preserved_in_probe']; assert c['malformed_content_candidates_fail_closed_to_opaque_mirror']; assert c['exact_product_tree_required']
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-r4-content-zip-generalization-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-content-zip-generalization-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-content-zip-generalization.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. Positive matrix evidence authorizes a research Builder admission path, never suffix expansion or
# canonical release credit. Actual original-path publication, selective reads, recovery and native parity remain gates.
