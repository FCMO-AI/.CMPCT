# ci-lane: deep
# exact-head research falsifier; retrigger marker 2026-09-07 for exact-head execution
name: CMPCT1 ONE-G0.2 auth-tree packed one-shot A/B
on:
  push:
    branches: [research/cmpct1]
    paths:
      - "benchmarks/one/native/one_g02_auth_tree_packed_oneshot.c"
      - "benchmarks/one/one_g02_auth_tree_packed_oneshot.py"
      - "docs/one/prereg/ONE_G02_AUTH_TREE_PACKED_ONESHOT_PREREG_2026-09-07.md"
      - ".github/workflows/cmpct1-one-g02-auth-tree-packed-oneshot.yml"
  pull_request:
    paths:
      - "benchmarks/one/native/one_g02_auth_tree_packed_oneshot.c"
      - "benchmarks/one/one_g02_auth_tree_packed_oneshot.py"
      - "docs/one/prereg/ONE_G02_AUTH_TREE_PACKED_ONESHOT_PREREG_2026-09-07.md"
      - ".github/workflows/cmpct1-one-g02-auth-tree-packed-oneshot.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-auth-tree-packed-oneshot-${{ github.sha }}
  cancel-in-progress: true
jobs:
  packed-oneshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run frozen packed one-shot auth-tree A/B and preserve scientific reds
        shell: bash
        run: |
          mkdir -p one-auth-packed-oneshot-artifacts
          set +e
          python -m benchmarks.one.one_g02_auth_tree_packed_oneshot | tee one-auth-packed-oneshot-artifacts/one-g02-auth-tree-packed-oneshot.json
          code=${PIPESTATUS[0]}
          echo "$code" > one-auth-packed-oneshot-artifacts/scientific-exit-code.txt
          exit 0
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-auth-tree-packed-oneshot-${{ env.EVIDENCE_HEAD }}
          path: one-auth-packed-oneshot-artifacts/
          if-no-files-found: error
      - name: Enforce preregistered scientific decision
        if: always()
        shell: bash
        run: test "$(cat one-auth-packed-oneshot-artifacts/scientific-exit-code.txt)" = "0"
