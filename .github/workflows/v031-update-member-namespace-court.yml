# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.31 append_update namespace custody court
on:
  push:
    branches:
      - agent/phased2-v031-update-member-namespace-guard-20261023
    paths:
      - src/cmpct/transactions.py
      - tests/test_v031_update_member_namespace_failclosed.py
      - .github/workflows/v031-update-member-namespace-court.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-v031-update-namespace-${{ github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.sha }}
jobs:
  update-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real package
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y libsndfile1
          python -m pip install -e '.[audio,test]'
      - name: Verify exact source and preserved parent guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import pathlib, subprocess
          actual=subprocess.check_output(['git','hash-object','src/cmpct/transactions.py'],text=True).strip()
          assert actual=='40e2057382347f91af5d9f321d6c3c8bec797c3e',actual
          source=pathlib.Path('src/cmpct/transactions.py').read_text()
          for guard in ('_reject_hardlink_owner_mutation(ar.index,member,',
                        '_reject_hardlink_owner_mutation(ar.index,old,',
                        '_reject_nonempty_directory_mutation(ar.index,member,',
                        '_reject_nonempty_directory_mutation(ar.index,old,',
                        '_require_valid_update_member(ar.index, member)'):
              assert guard in source,guard
          print('EXACT_SOURCE_PARENT_GUARDS_AND_UPDATE_GUARD_PASS',actual)
          PY
      - name: Run installed package source-exact namespace and inherited safety regressions
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python -m pytest -q \
            tests/test_v031_update_member_namespace_failclosed.py \
            tests/test_directory_subtree_failclosed.py \
            tests/test_v031_hardlink_owner_mutation_guard.py \
            2>&1 | tee benchmark-artifacts/update-namespace-regressions.log
      - name: Retain evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-update-namespace-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
