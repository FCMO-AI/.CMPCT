# ci-lane: fast
name: J24G25 Deflate Read-Export Acceptance Court
on:
  pull_request:
    paths:
      - '.github/workflows/j24g25-deflate-read-export-compat.yml'
      - 'tests/research_j24g25_deflate_read_export_compat.py'
      - 'research/j24g25_physical_wire_referee.py'
      - 'docs/v031-research/2026-10-28-j24g25-*.md'
  workflow_dispatch:

concurrency:
  group: j24g25-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-exact-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - name: Checkout exact research HEAD, never PR synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object src/cmpct/reader.py)" = "b0c8eb5eddd5591524b3e9c9a640d9266ccbbbdb"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install zstandard
      - name: Run actual installed Reader read-vs-export signed wire court
        shell: bash
        env:
          J24G25_ARTIFACT_DIR: ${{ runner.temp }}/j24g25-evidence
        run: |
          python tests/research_j24g25_deflate_read_export_compat.py
      - name: Independently audit physical CMPCT indexes, Deflate records and ZIP bytes
        shell: bash
        env:
          J24G25_ARTIFACT_DIR: ${{ runner.temp }}/j24g25-evidence
        run: |
          python research/j24g25_physical_wire_referee.py "$J24G25_ARTIFACT_DIR"
      # The inherited suite's top-level tests/conftest.py imports unrelated historical
      # experimental profiles that dlopen Linux-only `libzstd.so`. On macOS it
      # fails at collection *after* the actual installed-Reader and detached-wire
      # courts pass; that is infrastructure, not a product-result failure. Keep
      # its assertions and collection untouched on Linux; the two independent
      # source-exact J24G25 courts still execute on every host.
      - name: Confirm inherited PR284 safety suite unchanged (Linux conftest)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pytest -q tests/test_v031_deflate_export_verified.py
      - name: Preserve physical archives and receipts on either outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g25-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/j24g25-evidence/
          if-no-files-found: warn
