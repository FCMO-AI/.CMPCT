# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 process lifetime RSS oracle
on:
  push:
    branches: [agent/v030-r24-process-lifetime-rss]
    paths: ['benchmarks/v030_r24_process_lifetime_ab.py','.github/workflows/v030-r24-process-lifetime-rss.yml']
  workflow_dispatch:
permissions: {contents: read}
env: {PYTHONPATH: '${{ github.workspace }}'}
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r24_process_lifetime_ab.py
      - name: Run frozen ML r24 lifetime A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_process_lifetime_ab.py --work-root "$RUNNER_TEMP/r24-life" --output benchmark-artifacts/r24-life.json | tee benchmark-artifacts/r24-life.log
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: 'r24-life-${{ github.sha }}', path: benchmark-artifacts/, if-no-files-found: error, retention-days: 90}
