# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 streaming-finalize RSS v3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-streaming-finalize-rss-v3-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    outputs:
      run_receipt: ${{ steps.classify.outputs.run_receipt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if grep -Eq '^(src/cmpct/(builder|__init__|v030_worker_policy_capture)\.py|experiments/entropygraph_v030_r24_streaming_finalize(_v3)?\.py|experiments/entropygraph_v030_release_product(_base)?\.py|benchmarks/v030_r24_streaming_finalize_rss(_v3)?_oracle\.py|benchmarks/v030_release_(performance|generalization)\.py|benchmarks/(neutral|resemblance)_hostile_corpus_v1\.py|tests/test_v030_r24_streaming_finalize(_v3)?\.py|docs/v030-rnd/R25_R24_STREAMING_FINALIZE_RSS_V3_PREREG\.md|\.github/workflows/v030-r24-streaming-finalize-rss-v3\.yml)$' <<<"$changed"; then
            echo 'run_receipt=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_receipt=false' >> "$GITHUB_OUTPUT"
          fi

  consumed-candidate-rss-v3:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_receipt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen runtime-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile and ratchet exact v3 ownership seam
        run: |
          python -m py_compile \
            benchmarks/v030_r24_streaming_finalize_rss_v3_oracle.py \
            experiments/entropygraph_v030_r24_streaming_finalize.py \
            experiments/entropygraph_v030_r24_streaming_finalize_v3.py
          python -m pytest -q \
            tests/test_v030_r24_streaming_finalize.py \
            tests/test_v030_r24_streaming_finalize_v3.py
          python - <<'PY'
          from experiments import entropygraph_v030_r24_streaming_finalize as v2
          from experiments import entropygraph_v030_r24_streaming_finalize_v3 as v3
          assert v3.CONTROL_CLASS is v2.StreamingFinalizeBuilder
          assert issubclass(v3.EVICT_CLASS, v2.StreamingFinalizeBuilder)
          assert v3.SPOOL_MEMORY_BYTES == 1024 * 1024
          assert v3.MAX_IN_FLIGHT_FACTOR == 1
          assert v3.PROMOTION_BOUNDARY['single_intervention'] == 'evict consumed Candidate shell from Builder.cands after encode completion'
          PY
      - name: Run frozen same-run shipping/control/evict RSS A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_streaming_finalize_rss_v3_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-v3-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-streaming-rss-v3.json"
      - name: Enforce frozen v3 contract
        if: always()
        run: |
          test -f benchmark-artifacts/v030-r24-streaming-rss-v3.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-streaming-rss-v3.json').read_text())
          assert d['schema']=='cmpct-v030-r24-streaming-finalize-rss-v3'
          assert d['experiment_valid'] is True
          assert d['selector_change'] is False and d['release_credit'] is False
          assert d['shell_decision'] in {
              'CANDIDATE_SHELL_RETENTION_SUPPORTED',
              'CANDIDATE_SHELL_RETENTION_RETIRED_AS_MATERIAL_OWNER',
              'AMBIGUOUS_SMALL_EFFECT',
              'CANDIDATE_SHELL_EVICTION_WALL_REGRESSION',
          }
          owner=d['semantic_owner']
          assert owner['spool_memory_bytes']==1048576 and owner['max_in_flight_factor']==1
          assert owner['single_intervention']=='evict consumed Candidate shell from Builder.cands after encode completion'
          c=d['contract']
          assert c['promotion_shifted_full_rss_max_ratio']==0.75
          assert c['promotion_shifted_r24_rss_max_ratio']==0.50
          assert c['maximum_full_wall_regression_ratio']==1.05
          assert c['shell_support_evict_to_control_max_ratio']==0.98
          assert c['shell_retire_evict_to_control_min_ratio']==0.99
          assert {r['target'] for r in d['rows']} == {
              'resemblance_hostile_v1/01_shifted_versions',
              'neutral_hostile_v1/09_ml_artifacts',
          }
          for row in d['rows']:
              assert len(row['repetitions'])==2
              for rep in row['repetitions']:
                  for op in ('r24','full'):
                      base=rep['shipping'][op]
                      for variant in ('control','evict'):
                          candidate=rep[variant][op]
                          assert base['archive_bytes']==candidate['archive_bytes']
                          assert base['archive_sha256']==candidate['archive_sha256']
                          assert base['tree_sha256']==candidate['tree_sha256']
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-streaming-finalize-rss-v3.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-streaming-finalize-rss-v3-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r24-streaming-rss-v3.json
          if-no-files-found: error
          retention-days: 90
