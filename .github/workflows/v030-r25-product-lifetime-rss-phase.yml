# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 product-lifetime RSS phase attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_product_lifetime_rss_phase_*.py'
      - 'docs/v030-rnd/R25_PRODUCT_LIFETIME_RSS_PHASE_PREREG.md'
      - '.github/workflows/v030-r25-product-lifetime-rss-phase.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'benchmarks/v030_r25_product_lifetime_rss_phase_*.py'
      - 'docs/v030-rnd/R25_PRODUCT_LIFETIME_RSS_PHASE_PREREG.md'
      - '.github/workflows/v030-r25-product-lifetime-rss-phase.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-r25-product-lifetime-rss-phase-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_.*\.py$|benchmarks/v030_r25_product_lifetime_rss_phase_.*\.py$|docs/v030-rnd/R25_PRODUCT_LIFETIME_RSS_PHASE_PREREG\.md$|\.github/workflows/v030-r25-product-lifetime-rss-phase\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  product-lifetime-rss-phase:
    needs: latest-head-scope
    if: needs.latest-head-scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-r25-product-lifetime-rss-phase-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen phase instrument
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile benchmarks/v030_r25_product_lifetime_rss_phase_worker.py benchmarks/v030_r25_product_lifetime_rss_phase_oracle.py
      - name: Run product-lifetime RSS phase attribution
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r25_product_lifetime_rss_phase_oracle.py --work-root benchmark-artifacts/v030-r25-product-lifetime-rss-phase-work --output benchmark-artifacts/v030-r25-product-lifetime-rss-phase.json
      - name: Ratchet frozen claim boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r25-product-lifetime-rss-phase.json')
          assert p.is_file(), 'phase-attribution evidence missing'
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-r25-product-lifetime-rss-phase-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['release_credit'] is False
          assert d['preregistration']=='docs/v030-rnd/R25_PRODUCT_LIFETIME_RSS_PHASE_PREREG.md'
          c=d['contract']
          assert c['live_vmrss_diagnostic_only'] is True
          assert c['ru_maxrss_retained'] is True
          assert c['sample_interval_ms']==10
          assert c['minimum_sampler_coverage']==0.90
          assert c['minimum_samples']==100
          assert c['exact_product_identity_required'] is True
          assert c['production_source_changed'] is False
          assert c['scheduling_changed'] is False
          assert c['release_thresholds_changed'] is False
          assert c['decision_thresholds']=={'support':0.20,'retire':0.10}
          if d['experiment_valid']:
            assert d['worker_failures']==[]
            assert len(d['repetitions'])==3
            identities=set()
            for row in d['repetitions']:
              assert row['sampler_errors']==[]
              assert row['sample_count']>=100
              assert row['sampled_to_ru_peak_coverage']>=0.90
              assert row['wrappers_restored'] is True
              assert row['retained_entry_fraction'] is not None
              assert row['prefixgraph_entry_vmrss_kib'] is not None
              assert row['g04_entry_vmrss_kib'] is not None
              identities.add((row['archive_bytes'],row['archive_sha256'],row['tree_sha256'],row['selected'],row['format_revision'],row['r24_product_bytes'],row['r25_product_bytes']))
            assert len(identities)==1
          else:
            assert d['worker_failures']
            raise SystemExit('product-lifetime RSS phase evidence invalid')
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-product-lifetime-rss-phase.yml
      - name: Upload exact phase evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-product-lifetime-rss-phase-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r25-product-lifetime-rss-phase.json
          if-no-files-found: error
          retention-days: 90

# Diagnostic only. No release credit; production bytes and scheduling remain unchanged.
