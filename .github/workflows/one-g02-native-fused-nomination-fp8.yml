name: ONE-G0.2 native fused nomination fp8 A-B

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_local_index_fingerprint_view_kernel.c"
      - "benchmarks/one/one_g02_native_fused_nomination_fp8_ab.py"
      - "benchmarks/one/one_g02_native_fused_nomination_fp8_hostile_audit.py"
      - "docs/one/evidence/ONE_G02_NATIVE_FUSED_NOMINATION_FP8_MIRRORED_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-native-fused-nomination-fp8.yml"
  pull_request:
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_local_index_fingerprint_view_kernel.c"
      - "benchmarks/one/one_g02_native_fused_nomination_fp8_ab.py"
      - "benchmarks/one/one_g02_native_fused_nomination_fp8_hostile_audit.py"
      - "docs/one/evidence/ONE_G02_NATIVE_FUSED_NOMINATION_FP8_MIRRORED_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-native-fused-nomination-fp8.yml"

permissions:
  contents: read

jobs:
  fused-fp8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Semantic and hostile ONE suite
        run: python -m pytest tests/one -q
      - name: Forced-collision / wrap semantic audit
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          python -m benchmarks.one.one_g02_native_fused_nomination_fp8_hostile_audit | tee artifacts/one/native_fused_nomination_fp8_hostile.json
      - name: Exact-source fused nomination fp8 native A-B
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_native_fused_nomination_fp8_ab | tee artifacts/one/native_fused_nomination_fp8.json
          rc=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/one/native_fused_nomination_fp8.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload exact-source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-native-fused-nomination-fp8-${{ github.sha }}
          path: |
            artifacts/one/native_fused_nomination_fp8.json
            artifacts/one/native_fused_nomination_fp8_hostile.json
          if-no-files-found: error
