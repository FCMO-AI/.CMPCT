name: ONE-G0.2 fused native nomination carrying cost

on:
  workflow_dispatch:
  push:
    branches:
      - research/cmpct1
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_carrying_cost.py"
      - "benchmarks/one/one_g02_fused_native_nomination_timing_wrapper.c"
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_native_nomination_event_consumer_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "docs/one/evidence/ONE_G02_FUSED_NATIVE_NOMINATION_CARRYING_COST_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-fused-native-nomination-carrying-cost.yml"
  pull_request:
    paths:
      - "benchmarks/one/one_g02_fused_native_nomination_carrying_cost.py"
      - "benchmarks/one/one_g02_fused_native_nomination_timing_wrapper.c"
      - "benchmarks/one/one_g02_fused_native_nomination_kernel.c"
      - "benchmarks/one/one_g02_native_nomination_event_consumer_kernel.c"
      - "benchmarks/one/one_g02_minimizer_offset_only_kernel.c"
      - "docs/one/evidence/ONE_G02_FUSED_NATIVE_NOMINATION_CARRYING_COST_PREREG_2026-09-06.md"
      - ".github/workflows/one-g02-fused-native-nomination-carrying-cost.yml"

permissions:
  contents: read

jobs:
  fused-native-nomination-carrying-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Semantic and hostile ONE suite
        run: python -m pytest tests/one -q
      - name: Paired native carrying-cost gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_fused_native_nomination_carrying_cost | tee artifacts/one/fused_native_nomination_carrying_cost.json
          rc=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/one/fused_native_nomination_carrying_cost.json >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload exact-source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-fused-native-nomination-carrying-cost-${{ github.sha }}
          path: artifacts/one/fused_native_nomination_carrying_cost.json
          if-no-files-found: error
