# ci-lane: release
name: CMPCT v0.30 shared portfolio rehabilitation

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-shared-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact workload and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile shared scheduler and owning G0-G4 implementations
        run: |
          python -m py_compile \
            experiments/entropygraph_v029_parallel_portfolio.py \
            experiments/entropygraph_v030_geometry_overlay_g04.py \
            experiments/entropygraph_v030_geometry_overlay_g04_publish.py \
            experiments/entropygraph_v030_shared_portfolio.py \
            experiments/entropygraph_v030_release.py \
            benchmarks/v030_shared_portfolio_rehab.py

      - name: Prove complete-byte identity on multi/single-file fixtures
        run: |
          python -m pytest -q \
            tests/test_v029_parallel_portfolio.py \
            tests/test_v030_g04_publish.py \
            tests/test_v030_shared_portfolio.py

      - name: Run balanced exact-ML shared-build timing gate
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_shared_portfolio_rehab.py \
            --work-root benchmark-artifacts/v030-shared-rehab-work \
            --output benchmark-artifacts/v030-shared-rehab.json \
            2>&1 | tee benchmark-artifacts/v030-shared-rehab.stdout.txt

      - name: Independently enforce frozen rehabilitation thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/v030-shared-rehab.json').read_text())
          contract=data['contract']; gate=data['gate']
          assert data['schema']=='cmpct-v030-shared-portfolio-rehab-v1'
          assert contract['minimum_wallclock_improvement_pct']==20.0
          assert contract['minimum_absolute_improvement_s']==5.0
          assert contract['attempt5_graph_build_count']==1
          assert contract['complete_archive_identity_required'] is True
          assert gate['all_byte_identical'] is True
          assert gate['all_single_attempt5_build'] is True
          assert gate['every_pair_pass'] is True
          assert gate['median_pass'] is True
          assert gate['passed'] is True
          print(json.dumps({'median_improvement_pct': data['median_wallclock_improvement_pct'], 'gate': gate}, indent=2))
          PY

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

      - name: Upload shared-portfolio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-shared-portfolio-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-shared-rehab.json
            benchmark-artifacts/v030-shared-rehab.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# Footnote: this gate proves a byte-neutral build-cost rehabilitation only. It cannot substitute for the
# integrated 15-workload compression gate or final v0.30-vs-v0.29 performance measurements.
