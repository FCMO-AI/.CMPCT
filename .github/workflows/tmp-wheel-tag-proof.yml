name: TEMP explicit CPython-minor wheel tag proof
on:
  push:
    branches: [agent/wheel-tag-proof]
    paths: ['.github/workflows/tmp-wheel-tag-proof.yml']
permissions:
  contents: read
jobs:
  same-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build sdist-first wheel once and retag explicit CPython minors/ABI-none
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --sdist
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/generic"
          python -m pip wheel --no-deps dist/*.tar.gz -w "$RUNNER_TEMP/original"
          cp "$RUNNER_TEMP"/original/cmpct-*.whl "$RUNNER_TEMP/generic/"
          cd "$RUNNER_TEMP/generic"
          ORIGINAL=$(echo cmpct-*.whl)
          python -m wheel tags --python-tag=cp310.cp311.cp312.cp313.cp314 --abi-tag=none --remove "$ORIGINAL" | tee retagged-name.txt
          GENERIC=$(cat retagged-name.txt)
          test -f "$GENERIC"
          sha256sum "$GENERIC" | tee generic-wheel.sha256
          unzip -p "$GENERIC" '*/WHEEL' | tee wheel-metadata.txt
          grep -q '^Tag: cp310-none-' wheel-metadata.txt
          grep -q '^Tag: cp314-none-' wheel-metadata.txt
          unzip -l "$GENERIC" | grep 'cmpct/cmpct_core'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install exact same explicit-minor artifact on Python 3.10 and run shipping smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/py310"
          PY="$RUNNER_TEMP/py310/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$RUNNER_TEMP"/generic/cmpct-*.whl
          (cd "$RUNNER_TEMP" && "$PY" "$GITHUB_WORKSPACE/tests/installed_native_package_smoke.py") | tee py310-smoke.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the identical artifact on Python 3.14 and run shipping smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/py314"
          PY="$RUNNER_TEMP/py314/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$RUNNER_TEMP"/generic/cmpct-*.whl
          (cd "$RUNNER_TEMP" && "$PY" "$GITHUB_WORKSPACE/tests/installed_native_package_smoke.py") | tee py314-smoke.json
          ORIGINAL_SHA=$(cut -d' ' -f1 "$RUNNER_TEMP/generic/generic-wheel.sha256")
          FINAL_SHA=$(sha256sum "$RUNNER_TEMP"/generic/cmpct-*.whl | cut -d' ' -f1)
          test "$ORIGINAL_SHA" = "$FINAL_SHA"
          printf '%s\n' "$FINAL_SHA" | tee final-wheel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: explicit-cpython-wheel-same-artifact-${{ github.sha }}
          path: |
            ${{ runner.temp }}/generic/cmpct-*.whl
            ${{ runner.temp }}/generic/generic-wheel.sha256
            ${{ runner.temp }}/generic/wheel-metadata.txt
            py310-smoke.json
            py314-smoke.json
            final-wheel.sha256
          if-no-files-found: error
          retention-days: 7
