name: ONE-G0.2 generic concat Law fusion

on:
  pull_request:
    paths:
      - 'benchmarks/one/one_g02_generic_concat_law_fusion.py'
      - 'benchmarks/one/one_g02_bounded_hierarchical_concat.py'
      - 'experiments/one/range_vm.py'
      - 'experiments/one/ir.py'
      - 'experiments/one/vm.py'
      - 'experiments/one/wire.py'
      - 'docs/one/evidence/ONE_G02_GENERIC_CONCAT_LAW_FUSION_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-generic-concat-law-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-concat-law-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen generic concat Law-fusion gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_generic_concat_law_fusion | tee one-g02-generic-concat-law-fusion.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-generic-concat-law-fusion-${{ github.sha }}
          path: one-g02-generic-concat-law-fusion.json
          if-no-files-found: error
