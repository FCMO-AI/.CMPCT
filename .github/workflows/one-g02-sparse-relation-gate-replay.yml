name: ONE-G0.2 sparse relation gate evidence replay

on:
  workflow_dispatch:
  push:
    branches: [research/cmpct1]
    paths:
      - 'docs/one/evidence/ONE_G02_SPARSE_RELATION_GATE_REPLAY_PREREG_2026-09-05.md'
      - '.github/workflows/one-g02-sparse-relation-gate-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Execute unchanged frozen sparse relation gate
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p artifacts/one
          set +e
          python -m benchmarks.one.one_g02_shift_relation_sparse_gate_integration | tee artifacts/one/sparse_relation_gate_replay.json
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Publish evidence annotation
        if: always()
        run: |
          if [ -f artifacts/one/sparse_relation_gate_replay.json ]; then
            payload=$(python -c 'import json; print(json.dumps(json.load(open("artifacts/one/sparse_relation_gate_replay.json")),separators=(",",":")))')
            echo "::notice title=ONE-G0.2 sparse relation gate replay::$payload"
          else
            echo '::error title=ONE-G0.2 sparse relation gate replay::result file missing'
          fi
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-sparse-relation-gate-replay-${{ github.sha }}
          path: artifacts/one/sparse_relation_gate_replay.json
          if-no-files-found: error
