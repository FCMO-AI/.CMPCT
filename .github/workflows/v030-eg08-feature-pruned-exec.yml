# ci-lane: deep
name: CMPCT v0.30 EG08 feature-pruned executor

on:
  pull_request:
    paths:
      - 'benchmarks/v030_federated_compact_framing_v8_policy_exec_v6.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_exec_v7.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill_v5.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill_v4.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill_v3.py'
      - 'benchmarks/v030_eg08_reused_zstd_context_oracle.py'
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - '.github/workflows/v030-eg08-feature-pruned-exec.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v030-eg08-feature-pruned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  feature-pruned-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact candidate head
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "exact_head=$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile feature-pruned execution surface
        run: |
          python -m py_compile \
            benchmarks/v030_federated_compact_framing_v8_policy_exec_v6.py \
            benchmarks/v030_federated_compact_framing_v8_policy_exec_v7.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill_v5.py \
            benchmarks/v030_eg08_reused_zstd_context_oracle.py
      - name: Run exact-byte feature-pruned office execution proof
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_federated_compact_framing_v8_policy_exec_v7 \
            --work-root benchmark-artifacts/v030-eg08-policy-v7-work \
            --output benchmark-artifacts/v030-eg08-policy-v7.json
      - name: Test reusable per-worker Zstd contexts
        run: |
          python -m benchmarks.v030_eg08_reused_zstd_context_oracle \
            --work-root benchmark-artifacts/v030-eg08-reused-zstd-context-work \
            --output benchmark-artifacts/v030-eg08-reused-zstd-context.json
      - name: Independently enforce execution and release invariants
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-eg08-policy-v7.json')
          assert p.exists(), 'feature-pruned evidence missing'
          d=json.loads(p.read_text())
          x=d['execution_change']; m=d['measured_candidate']; s=d['strict']
          assert d['schema']=='cmpct-v030-eg08-policy-exec-v7'
          assert d['experiment_valid'] is True
          assert d['promotion_signal'] is s['passed']
          assert x['unused_policy_features_not_evaluated'] is True
          assert x['final_high_effort_pack_compressed_once'] is True
          assert x['archive_identity_required'] is True
          assert x['proof_source_tree_precomputed_outside_timed_boundary'] is True
          assert x['archive_strong_verification_still_timed'] is True
          assert x['comparator_timing_changed'] is False
          assert x['archive_bytes_changed'] is False
          assert x['selected_levels_changed'] is False
          assert m['exact_bytes_vs_serial_reference'] is True
          assert s['content_identity_not_policy_input'] is True
          assert s['exact_serial_archive_identity'] is True
          assert s['same_selected_level_vector'] is True
          assert s['beats_accepted_v029_size'] is True
          assert s['beats_zip_size'] is True
          assert s['beats_zstd19_size'] is True
          assert s['within_release_locality_bounds'] is True
          # Performance may still falsify this research hypothesis honestly.

          q=Path('benchmark-artifacts/v030-eg08-reused-zstd-context.json')
          assert q.exists(), 'reused-Zstd-context evidence missing'
          z=json.loads(q.read_text())
          assert z['schema']=='cmpct-v030-eg08-reused-zstd-context-oracle-v1'
          assert z['contract']['release_credit'] is False
          assert z['contract']['production_change'] is False
          assert z['contract']['archive_bytes_changed'] is False
          assert z['contract']['selected_levels_changed'] is False
          assert z['contract']['timing_scope']=='final-pack-emission-only'
          assert z['candidate']['archive_bytes']==m['archive_bytes']
          assert z['candidate']['archive_sha256']==m['archive_sha256']
          assert z['candidate']['selected_levels']==m['selected_levels']
          assert z['gate']['experiment_valid'] is True
          assert z['gate']['passed'] is True
          # materially_faster is deliberately not asserted: a valid loss is durable negative evidence.
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-eg08-feature-pruned-exec.yml
      - name: Upload feature-pruned evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-feature-pruned-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-eg08-policy-v7.json
            benchmark-artifacts/v030-eg08-reused-zstd-context.json
          if-no-files-found: warn
          retention-days: 90
