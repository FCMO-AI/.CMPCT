# ci-lane: fast
name: CMPCT v0.31 O10R generation ceiling cold economics O16
on:
  pull_request:
    paths:
      - 'benchmarks/v031_o10r_generation_cold_economics_o16.py'
      - 'docs/v031-research/2026-10-24-o10r-resource-cold-economics-o16-prereg.md'
      - '.github/workflows/v031-o10r-generation-cold-economics-o16.yml'
      - 'src/cmpct/reader.py'
      - 'src/cmpct/resource_limits.py'
      - 'src/cmpct/validation.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-installed-reader-cold-o16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  installed-o10r-vs-source-o9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
      - name: Bind exact O9 source and O16 installed candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object src/cmpct/reader.py)" = "1141266c6f968e2941083d11c2ed5fdfdb725a4b"
          test "$(git rev-parse 54c998200b1908b696ade049fe94df71a736c284:src/cmpct/reader.py)" = "2402721258531a56cfa2a53dcbd81874fd6c1f76"
          test "$(git hash-object benchmarks/v031_signed_delta_replay_o0.py)" = "02c5f506c9294130db6b0eb9c36c0a61460c3b35"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine CMPCT source product
        run: python -m pip install ".[test]"
      - name: O16 installed / O10R source-exact fresh-process O16 economics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o16-evidence
          python -u benchmarks/v031_o10r_generation_cold_economics_o16.py --out o16-evidence --sizes 512 4096 --repeats 5 2>&1 | tee o16-evidence/experiment.log
          sha256sum o16-evidence/installed-reader-cold-economics-o16.json | tee o16-evidence/receipt.sha256
      - name: Preserve honest positive or negative O16 observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-reader-cold-economics-o16-${{ github.event.pull_request.head.sha || github.sha }}
          path: o16-evidence/
          if-no-files-found: warn
          retention-days: 30
