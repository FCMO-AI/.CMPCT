name: CMPCT v0.30 Agent-00 one-shot native formatter
# ci-lane: diagnostic

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths: ['.github/workflows/v030-agent00-maintenance-format.yml']

permissions:
  contents: write

jobs:
  format-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Apply canonical Rust formatting
        working-directory: native/cmpct-portable
        run: cargo fmt --all
      - name: Persist formatter-only changes
        shell: bash
        run: |
          if git diff --quiet -- native/cmpct-portable; then
            echo 'native Rust sources already rustfmt-clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/cmpct-portable
          git commit -m 'style(v0.30): canonicalize portable Rust formatting'
          git push origin HEAD:agent/v030-authoritative-integration

# Footnote: this is a one-shot Agent-00 maintenance lane, not a release-authority gate. It exists only because the
# current ChatGPT runtime cannot clone/push over Git directly; GitHub-hosted rustfmt rewrites the exact connected
# branch without weakening `cargo fmt --check`. Delete this workflow before freezing the v0.30 release fingerprint.
