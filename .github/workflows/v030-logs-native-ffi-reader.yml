# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 logs native in-process FFI reader oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/cmpct-portable/**'
      - 'native/cmpct-logs-ffi/**'
      - 'benchmarks/v030_logs_native_ffi_reader_oracle.py'
      - 'benchmarks/v030_release_performance.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile_v3.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-logs-native-ffi-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-native-ffi-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(native/cmpct-(portable|logs-ffi)/|benchmarks/v030_logs_native_ffi_reader_oracle\.py|benchmarks/v030_release_performance\.py|experiments/entropygraph_v030_logs_inverse_profile_v3\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-logs-native-ffi-reader\.yml)' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  logs-native-ffi-reader:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen corpus/runtime dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile exact in-process logs reader boundary
        run: |
          cargo fmt --manifest-path native/cmpct-logs-ffi/Cargo.toml --check
          cargo clippy --manifest-path native/cmpct-logs-ffi/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path native/cmpct-logs-ffi/Cargo.toml
          python -m py_compile benchmarks/v030_logs_native_ffi_reader_oracle.py
      - name: Measure Python versus in-process Rust logs reader
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_native_ffi_reader_oracle.py \
            --native-library "$GITHUB_WORKSPACE/native/cmpct-logs-ffi/target/release/libcmpct_logs_ffi.so" \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-native-ffi-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-native-ffi-reader.json"
      - name: Enforce research-only exact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-logs-native-ffi-reader.json')
          if not p.is_file():
              raise SystemExit('logs native FFI evidence missing')
          d=json.loads(p.read_text())
          assert d['schema']=='cmpct-v030-logs-native-ffi-reader-v1'
          assert d['rounds']==5
          assert d['contract']['archive_bytes_changed'] is False
          assert d['contract']['grammar_changed'] is False
          assert d['contract']['selector_changed'] is False
          assert d['contract']['caller_extract_budget_enforced_before_publication'] is True
          assert d['contract']['native_library_load_inside_timing'] is False
          assert d['contract']['native_ffi_call_and_archive_open_inside_timing'] is True
          assert d['native_corruption_rejected'] is True
          assert d['native_budget_rejected_before_publication'] is True
          assert d['selector_change'] is False
          assert d['release_credit'] is False
          for key in ('python_verify','native_verify','python_extract','native_extract'):
              assert len(d['samples_s'][key])==5
          # A valid negative result stays green. Only promotion_signal can authorize a separate shipping integration.
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-native-ffi-reader.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-logs-native-ffi-reader-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-native-ffi-reader.json
          if-no-files-found: error
          retention-days: 90

# Research-only. No selector/grammar/release claim changes here. A positive A/B is followed by an explicit
# shipping integration commit and complete reader/fuzz/native/Android/runtime authority regeneration.
