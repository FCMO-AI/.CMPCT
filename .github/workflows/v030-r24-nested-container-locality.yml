# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 r24 nested-container locality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cmpct/__init__.py'
      - 'src/cmpct/v030_release_locality.py'
      - 'tests/test_v030_r24_container_locality.py'
      - 'benchmarks/v030_r24_nested_container_locality_oracle.py'
      - 'benchmarks/resemblance_hostile_corpus_v1.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - '.github/workflows/v030-r24-nested-container-locality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r24-container-locality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(src/cmpct/__init__\.py|src/cmpct/v030_release_locality\.py|tests/test_v030_r24_container_locality\.py|benchmarks/v030_r24_nested_container_locality_oracle\.py|benchmarks/resemblance_hostile_corpus_v1\.py|experiments/entropygraph_v030_release_product\.py|\.github/workflows/v030-r24-nested-container-locality\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect the r24 locality proof.'
          fi

  locality:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile repair and evidence
        run: |
          python -m py_compile \
            src/cmpct/v030_release_locality.py \
            benchmarks/v030_r24_nested_container_locality_oracle.py \
            tests/test_v030_r24_container_locality.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_v030_r24_container_locality.py
      - name: Run frozen deflate-family causality and partition proof
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r24_nested_container_locality_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-container-locality-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r24-container-locality.json"
      - name: Independently enforce immutable locality law and search completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r24-container-locality.json').read_text())
          assert d['schema']=='cmpct-v030-r24-nested-container-locality-v2'
          assert d['claim_boundary'].startswith('shipping r24 encoder grouping only')
          g=d['gate']; p=d['partition_search']
          assert g['historical_reproduces_single_pack'] is True
          assert g['historical_reproduces_over_8x'] is True
          assert g['shipping_splits_pack'] is True
          assert g['shipping_all_members_le_8x'] is True
          assert g['shipping_strong_verify'] is True
          assert g['same_verified_file_count'] is True
          assert g['partition_search_exhaustive'] is True
          assert p['partitions_evaluated'] == 1716
          assert p['pack_count'] == 2
          assert p['max_amplification'] <= 8.0
          assert p['strong_verify']['ok'] is True
          assert g['best_partition_all_members_le_8x'] is True
          assert g['best_partition_strong_verify'] is True
          assert d['historical']['max_amplification'] > 8.0
          assert d['shipping']['max_amplification'] <= 8.0
          assert d['shipping']['strong_verify']['ok'] is True
          assert g['passed'] is True
          PY
      - name: Record exact candidate fingerprint
        run: printf '%s\n' '${{ steps.candidate.outputs.sha }}' > benchmark-artifacts/v030-r24-nested-container-locality-candidate.txt
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r24-nested-container-locality.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r24-nested-container-locality-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-r24-container-locality.json
            benchmark-artifacts/v030-r24-nested-container-locality-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# Exact evidence demonstrates why the shipping two-pack locality repair is necessary: the historical one-pack form
# reaches ~14.04x amplification, while shipping stays <=8x and strong-verifies. The latest-head classifier prevents
# this exhaustive 1716-partition proof from replaying merely because its paths exist elsewhere in the long-lived PR.
