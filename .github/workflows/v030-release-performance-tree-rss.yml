# ci-lane: research
name: CMPCT v0.30 whole-tree product RSS companion

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-release-performance-tree-rss-${{ github.ref }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  whole-tree-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0

      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact corpus and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile whole-process-tree measurement surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_product.py \
            experiments/entropygraph_v030_prefixgraph_process_executor.py \
            benchmarks/v030_release_performance.py \
            benchmarks/v030_release_performance_tree_rss.py \
            benchmarks/v030_perf_worker_tree_rss.py

      - name: Prove caller-relative PrefixGraph child path transport
        run: python -m pytest -q tests/test_v030_prefixgraph_process_executor_paths.py

      - name: Run frozen whole-process-tree RSS companion
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_release_performance_tree_rss.py \
            --work-root benchmark-artifacts/v030-release-performance-tree-rss-work \
            --output benchmark-artifacts/v030-release-performance-tree-rss.json \
            2>&1 | tee benchmark-artifacts/v030-release-performance-tree-rss.stdout.txt

      - name: Independently bind accounting and immutable thresholds
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmark-artifacts/v030-release-performance-tree-rss.json')
          assert p.is_file(), 'whole-tree RSS evidence missing'
          data = json.loads(p.read_text())
          assert data['schema'] == 'cmpct-v030-release-performance-tree-rss-v1'
          assert data['engine'] == 'experiments/entropygraph_v030_release_product.py'
          assert data['release_facade'] == 'cmpct-v030-release-product-v1'
          assert data['rss_accounting'] == 'whole-process-tree-vmrss-10ms-with-parent-rumaxrss-floor'
          contract = data['contract']
          assert contract['maximum_median_create_ratio'] == 1.10
          assert contract['maximum_workload_create_ratio'] == 1.25
          assert contract['maximum_median_extract_ratio'] == 1.10
          assert contract['maximum_workload_extract_ratio'] == 1.25
          assert contract['maximum_peak_rss_ratio'] == 1.25
          tree = data['tree_rss_contract']
          assert tree['child_memory_gifted'] is False
          assert tree['timing_boundary_changed'] is False
          assert tree['peak_rss_threshold_changed'] is False
          assert tree['release_credit'] is False
          assert data['tree_rss_receipts']
          for receipt in data['tree_rss_receipts']:
              assert receipt['decisive_peak_rss_kib'] >= receipt['parent_peak_rss_kib']
              assert receipt['decisive_peak_rss_kib'] >= receipt['sampled_tree_peak_rss_kib']
              assert receipt['tree_rss_samples'] >= 1
          print(json.dumps({'totals': data['totals'], 'gate': data['gate'], 'rss_accounting': data['rss_accounting'], 'release_credit': tree['release_credit']}, indent=2))
          PY

      - name: Upload whole-tree RSS evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-release-performance-tree-rss-${{ github.sha }}
          path: |
            benchmark-artifacts/v030-release-performance-tree-rss.json
            benchmark-artifacts/v030-release-performance-tree-rss.stdout.txt
          if-no-files-found: warn
          retention-days: 90

# This workflow does not supersede the frozen promoted-product release-performance receipt and grants zero release
# credit. It executes the repository's pre-existing stronger RSS companion so process-isolated writers cannot gift
# descendant memory. Its purpose is decision-changing D5 productization evidence: determine the real broad-product
# memory gap before deciding whether the supported PrefixGraph lifetime mechanism is sufficient or owes another
# independent RSS rehabilitation. Thresholds, target corpus, timing window, identities and product front door are
# inherited unchanged from the frozen runtime authority.
