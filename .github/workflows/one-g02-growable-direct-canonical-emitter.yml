# ci-lane: deep
# Historical isolated emitter lane superseded by broader relation-to-wire and
# root-hash-charged writer receipts. Keep manual reproduction available.
name: ONE-G0.2 growable direct canonical emitter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growable-direct-canonical-emitter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen growable direct emitter falsifier
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_growable_direct_canonical_emitter | tee one-g02-growable-direct-canonical-emitter.json
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-growable-direct-canonical-emitter-${{ github.sha }}
          path: one-g02-growable-direct-canonical-emitter.json
          if-no-files-found: error
