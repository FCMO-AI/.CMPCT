# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 compact locator checkpoint hostile transfer

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_compact_locator_checkpoint_hostile_transfer.py'
      - '.github/workflows/v030-r4-compact-locator-checkpoint-hostile-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-compact-locator-checkpoint-hostile-${{ github.sha }}
  cancel-in-progress: false
jobs:
  hostile-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack zstandard
      - run: python -m py_compile benchmarks/v030_r4_compact_locator_checkpoint_hostile_transfer.py
      - name: Run hostile-valid transfer
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_compact_locator_checkpoint_hostile_transfer.py \
            --output benchmark-artifacts/v030-r4-compact-locator-checkpoint-hostile-transfer.json
      - name: Assert receipt integrity, not verdict
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-compact-locator-checkpoint-hostile-transfer.json'))
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['candidate_unchanged']
          assert d['contract']['checkpoint_stride_records']==256
          assert d['contract']['representation_bytes_unchanged']
          print(json.dumps({'cases':d['cases'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - name: Persist scientific receipt on integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/receipt.md
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-compact-locator-checkpoint-hostile-transfer.json'))
          print('### v0.30 checkpoint hostile transfer — exact-head receipt')
          print()
          print(f"- head: `{os.environ['EVIDENCE_HEAD']}`")
          print(f"- hypothesis: **{'SUPPORTED' if d['hypothesis']['checkpoint_correctness_transfers_to_hostile_valid_locators'] else 'FALSE'}**")
          for c in d['cases']:
              print(f"- {c['name']}: `{c['records']}` records, `{c['raw_locator_bytes']}` B LOC1, `{c['targets']}` targets, `{c['checkpoint_bytes']}` B checkpoints, mismatches `{len(c['mismatches'])}`, wall `{c['query_wall_s']:.6f} s`")
          print('- candidate/stride/archive bytes/auth/locality unchanged; correctness transfer only; no release credit.')
          PY
          gh pr comment 56 --repo FCMO-AI/.CMPCT --body-file /tmp/receipt.md
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-compact-locator-checkpoint-hostile-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-compact-locator-checkpoint-hostile-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-compact-locator-checkpoint-hostile-transfer.json
          if-no-files-found: error
          retention-days: 90
# Green means receipt integrity; JSON owns scientific verdict.
