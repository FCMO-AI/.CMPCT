# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Analytics RSS attribution

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_analytics_rss_attribution.py'
      - 'benchmarks/v030_r4_analytics_dual_owner_oracle.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'benchmarks/mosaic_v029_generalization_bench.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - '.github/workflows/v030-r4-analytics-rss-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

concurrency:
  group: cmpct-v030-r4-analytics-rss-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 2}
      - id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_r4_analytics_rss_attribution\.py|\.github/workflows/v030-r4-analytics-rss-attribution\.yml)$' /tmp/files; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  rss-attribution:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ env.EVIDENCE_HEAD }}'}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r4_analytics_rss_attribution.py
      - name: Run fresh-process attribution
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_analytics_rss_attribution.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-rss-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-rss-attribution.json"
      - name: Enforce diagnostic provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-r4-rss-attribution.json').read_text())
          assert d['schema']=='cmpct-v030-r4-analytics-rss-attribution-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['contract']['diagnostic_only'] and not d['contract']['release_credit']
          assert d['contract']['fresh_process_per_operation'] and d['contract']['corpus_generation_outside_measured_workers']
          print(json.dumps({'fresh_process':d['fresh_process'],'max_fresh_product_operation_rss_kib':d['max_fresh_product_operation_rss_kib'],'max_fresh_to_monolithic_ratio':d['max_fresh_to_monolithic_ratio'],'interpretation':d['interpretation']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-analytics-rss-attribution.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-analytics-rss-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-rss-attribution.json
          if-no-files-found: error
          retention-days: 90

# Attribution diagnostic only. Green means receipt integrity, not a memory-budget pass.
