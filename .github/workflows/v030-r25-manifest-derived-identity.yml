# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 r25 manifest derived-identity oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r25_manifest_derived_identity_oracle.py'
      - 'benchmarks/v030_release_generalization.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_fs_implicit_v4.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_release_candidate.py'
      - 'tests/test_v030_fs_implicit_v4.py'
      - '.github/workflows/v030-r25-manifest-derived-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-r25-manifest-derived-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r25_manifest_derived_identity_oracle\.py|benchmarks/v030_release_generalization\.py|experiments/entropygraph_v030_(product_fs|fs_implicit_v4|canonical_final_impl|release_candidate)\.py|tests/test_v030_fs_implicit_v4\.py|\.github/workflows/v030-r25-manifest-derived-identity\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect r25 manifest derived-identity semantics.'
          fi

  manifest-derived-identity:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Compile research oracle and implicit filesystem grammar
        run: |
          python -m py_compile \
            benchmarks/v030_r25_manifest_derived_identity_oracle.py \
            experiments/entropygraph_v030_fs_implicit_v4.py \
            tests/test_v030_fs_implicit_v4.py
      - name: Ratchet implicit-v4 semantic and fail-closed boundary
        run: python -m pytest -q tests/test_v030_fs_implicit_v4.py
      - name: Run repaired developer-workload manifest A/B
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r25_manifest_derived_identity_oracle \
            --work-root "$RUNNER_TEMP/v030-r25-manifest-derived-identity" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r25-manifest-derived-identity.json"
      - name: Ratchet evidence boundary without granting release credit
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-r25-manifest-derived-identity.json')
          e=json.loads(p.read_text())
          assert e['schema']=='cmpct-v030-r25-manifest-derived-identity-oracle-v2'
          assert e['target']=='neutral_hostile_v1/01_developer_repository'
          i=e['implicit_v4']
          assert i['expands_to_exact_filesystem_v1_semantics'] is True
          assert i['existing_research_grammar'] is True
          assert i['regular_identity_count'] > 0
          assert i['duplicated_sha256_bytes_avoided'] == i['regular_identity_count'] * 32
          assert i['implicit_control_bytes'] < i['current_manifest_bytes']
          assert e['release_credit'] is False
          assert e['selector_change'] is False
          assert e['canonical_grammar_change'] is False
          Path('benchmark-artifacts/v030-r25-manifest-derived-identity-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-r25-manifest-derived-identity-${{ steps.candidate.outputs.sha || env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-r25-manifest-derived-identity.json
            benchmark-artifacts/v030-r25-manifest-derived-identity-candidate.txt
          if-no-files-found: warn
          retention-days: 90
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-r25-manifest-derived-identity.yml
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

# Research-only: the projected manifest uses the already-bounded implicit-v4 grammar but remains noncanonical.
# A positive result authorizes only the next productization prerequisite: canonical grammar/read/recovery/native/
# Android integration with exact all-15 proof. It grants no release or selector credit by itself.
