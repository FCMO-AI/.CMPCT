# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 Office v0.25 physical attribution v2

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_office_v025_physical_attribution_v2.py'
      - '.github/workflows/v030-r4-office-v025-physical-attribution-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
  FROZEN_V029_SHA: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d

concurrency:
  group: cmpct-v030-r4-office-v025-attribution-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_office_v025_physical_attribution_v2\.py|\.github/workflows/v030-r4-office-v025-physical-attribution-v2\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  office-v025-attribution-v2:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
      - name: Bind exact heads and frozen checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git cat-file -e "$FROZEN_V029_SHA^{commit}"
          rm -rf /tmp/cmpct-v029-frozen
          git worktree add --detach /tmp/cmpct-v029-frozen "$FROZEN_V029_SHA"
          test "$(git -C /tmp/cmpct-v029-frozen rev-parse HEAD)" = "$FROZEN_V029_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx msgpack
      - name: Compile referee
        run: python -m py_compile benchmarks/v030_r4_office_v025_physical_attribution.py benchmarks/v030_r4_office_v025_physical_attribution_v2.py
      - name: Run source-sealed attribution v2
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_office_v025_physical_attribution_v2.py \
            --frozen-checkout /tmp/cmpct-v029-frozen \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-v025-attribution-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-office-v025-attribution-v2.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-office-v025-attribution-v2.json'))
          assert d['schema']=='cmpct-v030-r4-office-v025-physical-attribution-v2'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          assert d['frozen_v025']['frozen_source_sha']==os.environ['FROZEN_V029_SHA']
          assert d['frozen_v025']['source_sealed']
          assert d['frozen_v025']['physical_bytes_sum']==d['frozen_v025']['archive_bytes']
          assert d['identity']['same_neutral_tree'] and d['comparison']['same_tree']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit']; assert not c['selector_changed'] and not c['format_changed'] and not c['thresholds_changed']
          print(json.dumps({'identity':d['identity'],'comparison':d['comparison'],'v025_roles':d['frozen_v025']['physical_bytes_by_role'],'sfv4_components':d['sfv4']['component_bytes'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-office-v025-physical-attribution-v2.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-office-v025-attribution-v2-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-office-v025-attribution-v2.json
          if-no-files-found: error
          retention-days: 90

# Green means the repaired source-sealed referee executed and accounted exactly; JSON owns the scientific verdict.
