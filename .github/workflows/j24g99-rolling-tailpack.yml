# ci-lane: deep
# ci-cancel-policy: cancel-obsolete
name: J24G99 rolling immutable tailpack O0 (research only)
on:
  pull_request:
    branches: [main]
    paths:
      - "research/j24g99_*"
      - "docs/v031-research/*j24g99*"
      - ".github/workflows/j24g99-rolling-tailpack.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: j24g99-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rolling-physical-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Source and independent preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 4e2c4fcebd2934cafa2972ba4e822303199960ac HEAD
          git diff --quiet 80c358f8824ec1b20d349c92ed94c898090969b0 HEAD -- src native
          git hash-object research/j24g99_rolling_tailpack_court.py research/j24g99_independent_referee.py
          mkdir -p evidence/source
      - name: Recover the four original source-exact provider ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for item in \
            small-ubuntu:13011822204 \
            small-windows:13012541254 \
            deep-ubuntu:13007508236 \
            deep-windows:13007244298; do
            key="$(printf '%s' "$item" | cut -d: -f1)"
            id="$(printf '%s' "$item" | cut -d: -f2)"
            curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/FCMO-AI/.CMPCT/actions/artifacts/$id/zip" \
              --output "evidence/source/$key.zip"
          done
          printf '%s\n' \
            'd4d96daf8e831bb923e0c2c2a4b52c6bef4d7ad4616aadea220f18c7b5fe594d  evidence/source/small-ubuntu.zip' \
            'f7fdc90fdc0d5ca67f3c520bc0d033dece602a2aa3d5ab6320ccb024f890186e  evidence/source/small-windows.zip' \
            '19e600a5c1f1798eb2ffeafffc3dd4fbaa81f09fc83090c4610d3d1f2ed42e0b  evidence/source/deep-ubuntu.zip' \
            'c697febe772527c0bb488d406325470837774b6df6c30aea191e4e383c61fcab  evidence/source/deep-windows.zip' \
            | sha256sum -c -
      - name: Materialize authentic prefixes and independently audit allocation/read costs
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g99_rolling_tailpack_court.py \
            --small-ubuntu evidence/source/small-ubuntu.zip \
            --small-windows evidence/source/small-windows.zip \
            --deep-ubuntu evidence/source/deep-ubuntu.zip \
            --deep-windows evidence/source/deep-windows.zip \
            --output evidence/j24g99_hosted.json | tee evidence/producer.log
          python research/j24g99_independent_referee.py \
            --small-ubuntu evidence/source/small-ubuntu.zip \
            --small-windows evidence/source/small-windows.zip \
            --deep-ubuntu evidence/source/deep-ubuntu.zip \
            --deep-windows evidence/source/deep-windows.zip \
            --result evidence/j24g99_hosted.json | tee evidence/referee.log
          python - <<'PY'
          import json
          r=json.load(open("evidence/j24g99_hosted.json"))
          assert r["decision"]=="O0_ROLLING_TAILPACK_LOCAL_SCREEN_PASS",r["decision"]
          assert len(r["cases"])==8
          assert all(v["last_append_bytes"]==97 for v in r["cases"].values())
          PY
          sha256sum evidence/source/*.zip evidence/j24g99_hosted.json \
            research/j24g99_rolling_tailpack_court.py \
            research/j24g99_independent_referee.py \
            > evidence/SHA256SUMS
      - name: Preserve raw science and original input receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g99-rolling-tailpack-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
