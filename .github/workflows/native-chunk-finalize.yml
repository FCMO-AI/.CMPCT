name: Finalize native chunk-map milestone

on:
  push:
    branches:
      - feat/native-chunk-ranges
    paths:
      - dev/finalize_native_chunk_docs.py
      - .github/workflows/native-chunk-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update durable handoff docs
        run: python dev/finalize_native_chunk_docs.py
      - name: Remove bootstrap-only machinery
        run: |
          rm -f dev/apply_native_chunk_patch.py
          rm -f dev/normalize_chunk_manifest.py
          rm -f dev/finalize_native_chunk_docs.py
          rm -f .github/workflows/native-chunk-bootstrap.yml
          rm -f .github/workflows/native-chunk-finalize.yml
      - name: Validate and commit clean milestone
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Document native chunk-map conformance milestone"
          git push origin HEAD:feat/native-chunk-ranges
