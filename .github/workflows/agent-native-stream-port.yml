name: Agent native stream ABI port

on:
  push:
    branches:
      - agent/native-stream-abi-v028
    paths:
      - .github/workflows/agent-native-stream-port.yml
      - tools/agent_port_stream.py

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python package
        run: python -m pip install -e .
      - name: Apply focused stream ABI port
        run: python tools/agent_port_stream.py
      - name: Format and lint native core
        working-directory: native/cmpct-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test and build native core
        working-directory: native/cmpct-core
        run: |
          cargo test
          cargo build --release
      - name: Exercise sequential stream C ABI
        run: python tests/native_stream_abi.py
      - name: Ensure focused mutation surface
        run: |
          git diff --name-only
          git diff --exit-code -- tests/native_stream_abi.py tools/agent_port_stream.py
      - name: Commit validated port
        run: |
          rm .github/workflows/agent-native-stream-port.yml tools/agent_port_stream.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/cmpct-core/src/lib.rs native/cmpct-core/include/cmpct.h .github/workflows/agent-native-stream-port.yml tools/agent_port_stream.py
          git diff --cached --check
          git commit -m 'native: expose authenticated sequential stream ABI'
          git push
