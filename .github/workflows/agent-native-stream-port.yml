      - name: Format and lint native core
        working-directory: native/cmpct-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test and build native core
        working-directory: native/cmpct-core
        run: |
          cargo test
          cargo build --release
      - name: Exercise sequential stream C ABI
        run: python tests/native_stream_abi.py
      - name: Ensure focused mutation surface
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "native/cmpct-core/include/cmpct.h
          native/cmpct-core/src/lib.rs"
      - name: Commit validated port and remove temporary workflow
        run: |
          rm .github/workflows/agent-native-stream-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/cmpct-core/src/lib.rs native/cmpct-core/include/cmpct.h .github/workflows/agent-native-stream-port.yml
          git diff --cached --check
          git commit -m 'native: expose authenticated sequential stream ABI'
          git push
