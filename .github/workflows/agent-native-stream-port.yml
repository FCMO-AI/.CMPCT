name: Agent native stream ABI port

on:
  push:
    branches: [agent/native-stream-abi-v028]
    paths:
      - '.github/workflows/agent-native-stream-port.yml'
      - 'tests/native_stream_abi.py'

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python package
        run: python -m pip install -e .
      - name: Apply focused stream ABI port
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('native/cmpct-core/src/lib.rs')
          text = lib.read_text()
          entry_anchor = '''#[repr(C)]
pub struct CmpctEntryInfo {'''
          stream_struct = '''#[repr(C)]
