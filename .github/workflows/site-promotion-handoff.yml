name: CMPCT Pages configuration diagnostic
# ci-lane: publisher

on:
  pull_request:
    paths:
      - ".github/workflows/site-promotion-handoff.yml"

permissions:
  contents: read
  pages: read

concurrency:
  group: cmpct-pages-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pages-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read canonical GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -o /tmp/pages.json
          echo '--- GitHub Pages API ---'
          python -m json.tool /tmp/pages.json

      - name: Probe GitHub-owned public URL candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pages.json').read_text())
          print('configured_html_url=' + str(data.get('html_url')))
          print('configured_status=' + str(data.get('status')))
          print('configured_build_type=' + str(data.get('build_type')))
          print('configured_source=' + json.dumps(data.get('source'), sort_keys=True))
          PY

          for url in \
            'https://fcmo-ai.github.io/.CMPCT/' \
            'https://fcmo-ai.github.io/.cmpct/' \
            'https://fcmo-ai.github.io/CMPCT/' \
            'https://fcmo-ai.github.io/'; do
            code="$(curl --silent --show-error --location --max-time 15 -o /tmp/probe.html -w '%{http_code}' "$url" || true)"
            printf '%s -> %s\n' "$url" "$code"
          done

      - name: Probe configured Pages URL and receipt
        run: |
          set -euo pipefail
          configured="$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/pages.json').read_text()).get('html_url') or ''
          print(value.rstrip('/'))
          PY
          )"
          test -n "$configured"
          echo "Configured Pages URL: $configured/"
          curl --silent --show-error --location --max-time 15 -D /tmp/root.headers \
            -o /tmp/root.body "$configured/" || true
          echo '--- configured root response ---'
          sed -n '1,25p' /tmp/root.headers
          curl --silent --show-error --location --max-time 15 -D /tmp/receipt.headers \
            -o /tmp/receipt.body "$configured/deployment.json" || true
          echo '--- configured receipt response ---'
          sed -n '1,25p' /tmp/receipt.headers
          echo '--- configured receipt/body prefix ---'
          head -c 1200 /tmp/receipt.body || true
          echo

# Footnote: this disposable workflow is a read-only control-plane diagnostic. It asks GitHub which Pages URL
# and source are actually configured, then probes those public endpoints. It never changes Pages settings,
# source files, main, or gh-pages and is never merged into the repository.
