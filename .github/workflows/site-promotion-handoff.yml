name: CMPCT exact-main static promotion handoff
# ci-lane: publisher

on:
  pull_request:
    paths:
      - ".github/workflows/site-promotion-handoff.yml"

permissions:
  contents: read

concurrency:
  group: cmpct-site-promotion-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-main-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable merged main source
        uses: actions/checkout@v6
        with:
          ref: 13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b
          fetch-depth: 0

      - name: Assert source authority
        run: |
          test "$(git rev-parse HEAD)" = "13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b"
          # Footnote: this disposable workflow exists only to expose the canonical main build as an artifact;
          # it never substitutes its own PR merge SHA for the source commit recorded by the static site.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install canonical CMPCT package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build exact canonical public surface
        run: |
          python tools/check_public_surface.py
          # Footnote: GITHUB_SHA belongs to the disposable pull-request event. Removing it makes build_site.py
          # derive provenance from the checked-out immutable main commit instead of stamping the handoff PR.
          env -u GITHUB_SHA python site/build_site.py --out _site
          python site/enhance_site.py _site

      - name: Validate release-independent proof contracts
        run: |
          python site/tests/proof_surface_contract.py _site
          python site/tests/release_evidence_contract.py
          node --check site/src/assets/app.js
          node --check site/src/assets/experience.js
          node --check site/src/assets/motion.js
          node --check site/src/assets/cinematic.js
          node --check site/src/assets/cmpct-browser-writer.js
          node site/tests/i18n-contract.mjs

      - name: Preserve Browser Lab canonical compatibility
        run: |
          node site/tests/browser-writer-smoke.mjs /tmp/browser-writer-smoke.cmpct
          python - <<'PY'
          from pathlib import Path
          from cmpct.reader import CMPCT

          path = Path('/tmp/browser-writer-smoke.cmpct')
          with CMPCT(path) as archive:
              assert archive.index['v'] == 24
              assert [row[0] for row in archive.files] == ['copy/repeated.txt', 'docs/repeated.txt', 'unique.txt']
              assert archive.read('copy/repeated.txt') == archive.read('docs/repeated.txt')
              assert archive.read('unique.txt') == b'small independent file\n'
          PY

      - name: Stamp exact publication receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('_site')
          payload = json.loads((out / 'project-data.json').read_text(encoding='utf-8'))
          project = payload['project']
          evidence = payload.get('public_evidence') or {}
          source_commit = '13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b'
          assert project['site_build_commit'] == source_commit
          receipt = {
              'schema': 'cmpct-static-pages-deployment-v1',
              'publishing_branch': 'gh-pages',
              'publishing_path': '/',
              'source_branch': 'main',
              'source_commit': source_commit,
              'project_version': project['project_version'],
              'surface_revision': project['surface_revision'],
              'canonical_format_revision': project['format_revision'],
              'evidence_schema': evidence.get('schema'),
              'jekyll': False,
              'static_only': True,
              'generated_from_committed_evidence': True,
              'validation': {
                  'localization_cases': 57,
                  'localization_failures': 0,
                  'cjk_glyph_coverage': True,
                  'final_pr_head': '71370bd5340cdce824481ec6de7a73beccf09337'
              },
              'policy': 'main owns source and validation; gh-pages owns generated serving artifacts only'
          }
          assert receipt['surface_revision'] == '0.29.k'
          assert receipt['canonical_format_revision'] == 24
          assert receipt['evidence_schema'] == 'cmpct-public-evidence-v1'
          (out / 'deployment.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload exact static promotion handoff
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-public-site-13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b
          path: _site/
          if-no-files-found: error
          retention-days: 1

# Footnote: this workflow is intentionally disposable and must never be merged. It only bridges an authenticated
# connector limitation by materializing the same deterministic build already prescribed by site-proof-contract.yml.
# Publication still occurs by one explicit fast-forward commit on gh-pages, followed by live receipt verification.
