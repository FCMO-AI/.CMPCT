name: CMPCT live Pages publication contract
# ci-lane: publisher

on:
  pull_request:
    paths:
      - ".github/workflows/site-promotion-handoff.yml"

permissions:
  contents: read
  pages: read

concurrency:
  group: cmpct-live-pages-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read GitHub Pages control-plane state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -o /tmp/pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          pages = json.loads(Path('/tmp/pages.json').read_text())
          assert pages['status'] == 'built', pages
          assert pages['build_type'] == 'legacy', pages
          assert pages['source'] == {'branch': 'gh-pages', 'path': '/'}, pages
          assert pages['html_url'] == 'https://fcmo-ai.github.io/.CMPCT/', pages
          assert pages['public'] is True, pages
          assert pages['https_enforced'] is True, pages
          print(json.dumps(pages, indent=2))
          PY

      - name: Fetch live publication and multilingual assets
        run: |
          set -euo pipefail
          root="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/pages.json').read_text())['html_url'].rstrip('/'))
          PY
          )"
          mkdir -p /tmp/live
          nonce="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fetch() {
            local relative="$1" output="$2"
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$root/$relative?audit=$nonce" -o "/tmp/live/$output"
          }
          fetch '' index.html
          fetch 'deployment.json' deployment.json
          fetch 'assets/i18n.js' i18n.js
          fetch 'assets/i18n/catalog.js' catalog.js
          fetch 'assets/i18n/locales/ja.js' ja.js
          fetch 'assets/i18n/locales/ko.js' ko.js
          fetch 'assets/i18n/locales/zh-hans.js' zh-hans.js
          fetch 'assets/i18n/locales/zh-hant.js' zh-hant.js

      - name: Assert exact live release identity and locale payloads
        env:
          EXPECTED_SOURCE: 13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b
          EXPECTED_PR_HEAD: 71370bd5340cdce824481ec6de7a73beccf09337
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('/tmp/live')
          receipt = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          index = (root / 'index.html').read_text(encoding='utf-8')
          runtime = (root / 'i18n.js').read_text(encoding='utf-8')
          catalog = (root / 'catalog.js').read_text(encoding='utf-8')
          ja = (root / 'ja.js').read_text(encoding='utf-8')
          ko = (root / 'ko.js').read_text(encoding='utf-8')
          zh_hans = (root / 'zh-hans.js').read_text(encoding='utf-8')
          zh_hant = (root / 'zh-hant.js').read_text(encoding='utf-8')

          assert receipt['source_commit'] == os.environ['EXPECTED_SOURCE'], receipt
          assert receipt['project_version'] == '0.29.0', receipt
          assert receipt['surface_revision'] == '0.29.k', receipt
          assert receipt['canonical_format_revision'] == 24, receipt
          assert receipt['evidence_schema'] == 'cmpct-public-evidence-v1', receipt
          assert receipt['jekyll'] is False and receipt['static_only'] is True, receipt
          validation = receipt['validation']
          assert validation == {
              'localization_cases': 57,
              'localization_failures': 0,
              'cjk_glyph_coverage': True,
              'final_pr_head': os.environ['EXPECTED_PR_HEAD'],
          }, validation

          # Footnote: the live HTML must expose the exact merged-source stamp and surface identity. This catches
          # a valid receipt accidentally paired with an older cached page or with a different generated tree.
          assert '13742e49d8a0' in index, 'live index lacks merged-source build stamp'
          assert '0.29.k' in index, 'live index lacks current surface revision'
          assert 'assets/experience.css' in index and 'assets/experience.js' in index, 'live index lacks canonical experience assembly'

          # Footnote: source selection is a public UX contract, so validate both the runtime grouping language
          # and the catalogue export used by the page rather than merely checking that a JavaScript file exists.
          assert 'Canonical source' in runtime and 'Curated translations' in runtime, 'live source-language selector contract missing'
          assert 'SUPPORTED_LOCALES' in runtime and 'SUPPORTED_LOCALES' in catalog, 'live locale catalogue wiring missing'

          for label, text in {
              'Japanese': ja,
              'Korean': ko,
              'Simplified Chinese': zh_hans,
              'Traditional Chinese': zh_hant,
          }.items():
              assert 'export const PHRASE_VALUES' in text, f'{label} locale module export missing'
              assert len(text) > 1000, f'{label} locale module unexpectedly truncated'

          assert re.search(r'[ぁ-ゟ゠-ヿ一-龯]', ja), 'Japanese-script payload missing'
          assert re.search(r'[가-힣]', ko), 'Hangul payload missing'
          assert re.search(r'[一-龯]', zh_hans), 'Simplified Chinese payload missing'
          assert re.search(r'[一-龯]', zh_hant), 'Traditional Chinese payload missing'
          assert zh_hans != zh_hant, 'Simplified and Traditional Chinese live packs unexpectedly identical'

          print(json.dumps(receipt, indent=2))
          print('Live multilingual Pages publication contract passed.')
          PY

      - name: Record verified public URL
        run: |
          {
            echo '## CMPCT public site is live'
            echo
            echo '- URL: `https://fcmo-ai.github.io/.CMPCT/`'
            echo '- Source: `13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b`'
            echo '- Surface: `0.29.k`'
            echo '- Format: `r24`'
            echo '- Locale render proof: `57/57`, CJK glyph coverage true'
            echo '- Live locale payloads: Japanese, Korean, Simplified Chinese, Traditional Chinese verified'
          } >> "$GITHUB_STEP_SUMMARY"

# Footnote: this disposable workflow has no publication authority and never modifies Pages. It independently
# reads GitHub's Pages control plane plus the public HTTPS artifact after promotion, then is discarded unmerged.
