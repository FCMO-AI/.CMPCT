name: CMPCT live Pages promotion audit
# ci-lane: publisher

on:
  pull_request:
    paths:
      - ".github/workflows/site-promotion-handoff.yml"

permissions:
  contents: read

concurrency:
  group: cmpct-live-pages-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public deployment receipt and promoted assets
        env:
          SITE_ROOT: https://fcmo-ai.github.io/.CMPCT
          EXPECTED_SOURCE: 13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b
          EXPECTED_SURFACE: 0.29.k
          EXPECTED_FORMAT: "24"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          success=0

          for attempt in $(seq 1 36); do
            # Footnote: Pages propagation is infrastructure state, not source state. The audit retries only the
            # public HTTPS reads; it never mutates the site and it accepts nothing until the live receipt names
            # the exact merged main source commit and the key multilingual assets are physically retrievable.
            if curl --fail --silent --show-error --location --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "$SITE_ROOT/deployment.json?audit=$GITHUB_RUN_ID-$attempt" \
                -o "$work/deployment.json" \
              && curl --fail --silent --show-error --location --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "$SITE_ROOT/?audit=$GITHUB_RUN_ID-$attempt" \
                -o "$work/index.html" \
              && curl --fail --silent --show-error --location --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "$SITE_ROOT/assets/i18n.js?audit=$GITHUB_RUN_ID-$attempt" \
                -o "$work/i18n.js" \
              && curl --fail --silent --show-error --location --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "$SITE_ROOT/assets/i18n/locales/ja.js?audit=$GITHUB_RUN_ID-$attempt" \
                -o "$work/ja.js"; then
              if python - "$work" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          receipt = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          index = (root / 'index.html').read_text(encoding='utf-8')
          i18n = (root / 'i18n.js').read_text(encoding='utf-8')
          ja = (root / 'ja.js').read_text(encoding='utf-8')

          assert receipt['source_commit'] == os.environ['EXPECTED_SOURCE'], receipt
          assert receipt['surface_revision'] == os.environ['EXPECTED_SURFACE'], receipt
          assert str(receipt['canonical_format_revision']) == os.environ['EXPECTED_FORMAT'], receipt
          assert receipt['evidence_schema'] == 'cmpct-public-evidence-v1', receipt
          assert receipt.get('validation', {}).get('localization_cases') == 57, receipt
          assert receipt.get('validation', {}).get('localization_failures') == 0, receipt
          assert receipt.get('validation', {}).get('cjk_glyph_coverage') is True, receipt
          assert '13742e49d8a0' in index, 'live index is not stamped from intended source'
          assert '0.29.k' in index, 'live index does not expose intended surface revision'
          assert 'SUPPORTED_LOCALES' in i18n and 'Canonical source' in i18n, 'live i18n runtime missing source selector'
          assert 'ja' in ja and any(ord(ch) > 0x3000 for ch in ja), 'live Japanese locale asset lacks Japanese-script content'
          print(json.dumps(receipt, indent=2))
          PY
              then
                success=1
                echo "Live Pages audit passed on attempt $attempt."
                break
              fi
            fi
            sleep 10
          done

          test "$success" = 1

      - name: Record live verification summary
        if: ${{ success() }}
        run: |
          {
            echo '## CMPCT live Pages promotion verified'
            echo
            echo '- Public URL: `https://fcmo-ai.github.io/.CMPCT/`'
            echo '- Source commit: `13742e49d8a0f5da32a9bdae6b57dd2de82d6c5b`'
            echo '- Surface: `0.29.k`'
            echo '- Canonical format: `r24`'
            echo '- Locale render evidence: `57/57`, CJK glyph coverage asserted'
          } >> "$GITHUB_STEP_SUMMARY"

# Footnote: this disposable workflow is an external read-only audit of the branch-backed Pages result. It is
# never merged into main and never publishes or edits gh-pages; its only authority is to prove what HTTPS serves.
