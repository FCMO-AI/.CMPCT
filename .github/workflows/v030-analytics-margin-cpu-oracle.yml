# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics margin CPU oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_analytics_margin_cpu_oracle.py'
      - 'docs/V030_ANALYTICS_MARGIN_CPU_ORACLE_MISSION_2026-09-12.md'
      - '.github/workflows/v030-analytics-margin-cpu-oracle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_analytics_margin_cpu_oracle.py'
      - 'docs/V030_ANALYTICS_MARGIN_CPU_ORACLE_MISSION_2026-09-12.md'
      - '.github/workflows/v030-analytics-margin-cpu-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-analytics-margin-cpu-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_margin_cpu_oracle\.py|docs/V030_ANALYTICS_MARGIN_CPU_ORACLE_MISSION_2026-09-12\.md|\.github/workflows/v030-analytics-margin-cpu-oracle\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  margin-cpu-oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_analytics_margin_cpu_oracle.py
      - name: Execute optimistic margin-for-compute oracle
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_margin_cpu_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-margin-cpu-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-margin-cpu.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-margin-cpu.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-margin-cpu-oracle-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['frozen_bytes']=={'accepted_v029':6135172,'byteplane4_strong':6063752,'spendable_margin':71420}
          assert d['cost_attribution']['fixture']['admitted_count']==45
          assert d['gate']['byte_giveback_within_margin'] is True
          assert d['contract']['oracle_identities_not_policy'] is True
          assert d['contract']['no_selector_threshold_sweep'] is True
          assert d['verdict'] in {'MARGIN_CAN_SUPPORT_SKIP_RESEARCH','MARGIN_INSUFFICIENT_RETIRE_SKIP_ONLY'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-margin-cpu-oracle.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-margin-cpu-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-margin-cpu.json
          if-no-files-found: error
          retention-days: 90

# Research-only impossibility/headroom oracle. Green means a valid receipt, not a positive hypothesis.
