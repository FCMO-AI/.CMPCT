# ci-lane: fast
# O84 opt-in strong VZIP full-read court, separate from release performance gates.
name: CMPCT v0.31 O84 VZIP SHA full-read
on:
  push:
    branches:
      - 'agent/phased1-v031-o84-vzip-strong-full-read-20261025'
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'benchmarks/v031_o84_vzip_strong_full_read.py'
      - '.github/workflows/v031-o84-vzip-strong-full-read.yml'
      - 'docs/v031-research/2026-10-25-o84-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o84-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-original-collision-control:
    name: O84 installed actual CMPCT / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact O84 source and original ancestor
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Source-lock all product components and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git show 4545d7d5b2a0b712b4b00f5a9c291d4a3a9e169b:src/cmpct/reader.py | git hash-object --stdin)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test "$(git hash-object src/cmpct/reader.py)" = "d1b8a8e02406b38cd37843d490fb828c23b61d2b"
          test "$(git hash-object src/cmpct/builder.py)" = "663ef0922992b1fbb8f19e6eea88d55c10a56044"
          test "$(git hash-object src/cmpct/codec.py)" = "29526db4203723d83523fc95d074c346b63d7587"
          test "$(git show c1c650acfbed5ef3f8b0adf08145cb6fb3fe5b3b:docs/v031-research/2026-10-25-o84-vzip-strong-full-read-prereg.md | git hash-object --stdin)" = "$(git hash-object docs/v031-research/2026-10-25-o84-vzip-strong-full-read-prereg.md)"
          python -m pip install .
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder,cmpct.reader,cmpct.codec
          root=Path(subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip()).resolve()
          for module in (cmpct.builder,cmpct.reader,cmpct.codec):
              physical=Path(module.__file__).resolve()
              assert not physical.is_relative_to(root),(module.__name__,physical)
              print("O84_INSTALLED_MODULE",module.__name__,physical)
          assert hasattr(cmpct.reader.CMPCT,'read_vzip_verified')
          PY
      - name: Actual original O81 physical CRC collision versus O84 opt-in SHA
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_o84_vzip_strong_full_read.py > o84-court.json 2> o84-error.log || { cat o84-error.log; exit 1; }
          cat o84-court.json
      - name: Durable exact-head court and negative evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmpct-o84-${{ matrix.os }}-${{ env.EXACT_HEAD }}
          path: |
            o84-court.json
            o84-error.log
          if-no-files-found: warn
          retention-days: 30
