# ci-lane: fast
name: CMPCT v031 canonical hardlink separator science O29
on:
  pull_request:
    paths:
      - 'tests/test_v031_hardlink_target_separator_o29.py'
      - '.github/workflows/v031-hardlink-target-separator-o29.yml'
      - 'docs/v031-research/2026-10-24-hardlink-target-separator-o29-prereg.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-reader-separator-o29-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  signed-target-negative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Bind exact unchanged product source and scientific test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object src/cmpct/reader.py)" = "c7850c08c7bb27563955c6e2294b8c17c140d0a2"
          test "$(git hash-object tests/test_v031_hardlink_target_separator_o29.py)" = "9501b98960f2767377d5b2fbae7a1612402b2521"
          git hash-object src/cmpct/path_policy.py src/cmpct/validation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the actual CMPCT package
        run: python -m pip install -e '.[test]'
      - name: Execute exact signed r24 positive and negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o29-evidence
          python -m pytest --noconftest -q -rs tests/test_v031_hardlink_target_separator_o29.py 2>&1 | tee o29-evidence/pytest.log
          exit "${PIPESTATUS[0]}"
      - name: Archive research-only original observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o29-separator-negative-${{ matrix.os }}-${{ github.sha }}
          path: o29-evidence/
          if-no-files-found: warn
          retention-days: 30
