# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 Office v0.25 ZIP-stream ablation

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_office_v025_zipstreams_ablation.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v6.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-office-v025-zipstreams-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-office-v025-zipstreams-ablation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          echo 'relevant=true' >> "$GITHUB_OUTPUT"

  ablation:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned corpus dependencies
        run: |
          python -m pip install --disable-pip-version-check msgpack pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libzstd1
      - name: Run full-charge ZIP-stream counterfactual
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_office_v025_zipstreams_ablation.py | tee benchmark-artifacts/v030-office-v025-zipstreams-ablation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-office-v025-zipstreams-ablation.json')
          data=json.loads(p.read_text())
          assert data['schema']=='cmpct-v030-office-v025-zipstreams-ablation-v1'
          assert data['release_credit'] is False
          assert data['control']['strong_verify']['ok'] is True
          assert data['no_zipstreams']['strong_verify']['ok'] is True
          assert data['control']['archive_bytes'] > 0 and data['no_zipstreams']['archive_bytes'] > 0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-office-v025-zipstreams-ablation-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-office-v025-zipstreams-ablation.json
          if-no-files-found: error
          retention-days: 90

# Research-only causal evidence. Green means receipt integrity, never release credit.