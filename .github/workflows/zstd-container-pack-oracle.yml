# ci-lane: research
# ci-cancel-policy: latest-head
# ci-pr-scope: latest-head-commit-gate
# discriminator: owned-1.5.7 blockSplitterLevel=1 pre-splitter control vs inherited ambient 1.5.5
name: CMPCT Zstd container-pack byte oracle

on:
  pull_request:
    paths:
      - ".github/workflows/zstd-container-pack-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zstd-container-pack-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Write exact nested-pack probe
        run: |
          cat > /tmp/probe.py <<'PY'
          import ctypes, ctypes.util, hashlib
          from pathlib import Path
          from benchmarks import universal_bench as ub
          ub.reset(); ub.make_corpora()
          pack=b"".join(p.read_bytes() for p in sorted((ub.CORP/"nested").glob("*.zip")))
          pack_sha=hashlib.sha256(pack).hexdigest()
          print("pack_bytes",len(pack),"pack_sha256",pack_sha)
          assert len(pack)==845291 and pack_sha=="50a40c85effa6c321703d339e3897213ee945086aa15268a6c5535946d0757e4"
          sz=ctypes.c_size_t
          system_name=ctypes.util.find_library("zstd") or "libzstd.so"; system=ctypes.CDLL(system_name)
          system.ZSTD_versionString.restype=ctypes.c_char_p
          system.ZSTD_compressBound.argtypes=[sz]; system.ZSTD_compressBound.restype=sz
          system.ZSTD_compress.argtypes=[ctypes.c_void_p,sz,ctypes.c_void_p,sz,ctypes.c_int]; system.ZSTD_compress.restype=sz
          system.ZSTD_isError.argtypes=[sz]; system.ZSTD_isError.restype=ctypes.c_uint
          inherited_version=system.ZSTD_versionString().decode()
          print("system_library",system_name,"inherited_zstd_version",inherited_version)
          assert inherited_version=="1.5.5", "oracle host changed; inherited comparator is no longer the proven 1.5.5 engine"
          core=ctypes.CDLL(str(Path("native/cmpct-core/target/release/libcmpct_core.so").resolve()))
          core.cmpct_codec_zstd_compress_bound.argtypes=[sz]; core.cmpct_codec_zstd_compress_bound.restype=sz
          core.cmpct_codec_zstd_compress.argtypes=[ctypes.c_void_p,sz,ctypes.c_int32,ctypes.c_void_p,sz,ctypes.POINTER(sz)]; core.cmpct_codec_zstd_compress.restype=ctypes.c_int32
          src=ctypes.create_string_buffer(pack); all_equal=True
          for level in (15,12,9):
              cap=int(system.ZSTD_compressBound(len(pack))); a=ctypes.create_string_buffer(cap)
              na=int(system.ZSTD_compress(a,cap,src,len(pack),level)); assert not system.ZSTD_isError(na); inherited=a.raw[:na]
              b=ctypes.create_string_buffer(cap); nb=sz(); status=int(core.cmpct_codec_zstd_compress(src,len(pack),level,b,cap,ctypes.byref(nb))); assert status==0; owned=b.raw[:nb.value]
              first=next((i for i,(x,y) in enumerate(zip(inherited,owned)) if x!=y),None)
              if first is None and len(inherited)!=len(owned): first=min(len(inherited),len(owned))
              equal=inherited==owned; all_equal &= equal
              print("level",level,"inherited_bytes",len(inherited),"owned_bytes",len(owned),"delta",len(owned)-len(inherited),"inherited_sha256",hashlib.sha256(inherited).hexdigest(),"owned_sha256",hashlib.sha256(owned).hexdigest(),"equal",equal,"first_diff",first)
          print("legacy_semantics_exact",all_equal)
          assert all_equal, "bounded pre-splitter control failed exact-byte inheritance"
          PY
      - name: Build owned 1.5.7 legacy-semantics candidate
        working-directory: native/cmpct-core
        run: cargo build --release --locked
      - name: Charge inherited-byte oracle
        run: PYTHONPATH=. python /tmp/probe.py
      - name: Charge frozen codec vectors
        working-directory: native/cmpct-core
        run: cargo test --test zstd_encode_equivalence
