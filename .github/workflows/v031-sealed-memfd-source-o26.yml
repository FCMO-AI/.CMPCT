# ci-lane: fast
name: CMPCT v0.31 sealed memfd source ownership O26

on:
  pull_request:
    paths:
      - 'benchmarks/v031_sealed_memfd_source_o26.py'
      - 'docs/v031-research/2026-10-24-sealed-memfd-source-o26-prereg.md'
      - 'docs/v031-research/2026-10-24-sealed-memfd-source-o26-result.md'
      - '.github/workflows/v031-sealed-memfd-source-o26.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-sealed-memfd-o26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  kernel-sealed-source-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Source-exact inherited custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 73120e0fd4ac4d01fc2526f3fb59b6ce30417d4e HEAD
          test "$(git hash-object src/cmpct/reader.py)" = 60f52328467ca509bb410abe6a34810c50917cb5
          test "$(git hash-object benchmarks/v031_pack_physical_sha_court.py)" = 2383bf9a8f7ce8a9a01028ccf1072169897df3f1
          test "$(git hash-object benchmarks/v031_verify_extract_source_lifetime_o23.py)" = 134085f99b92764a79899e4cbf5f6c5b3b7b01cf
          test "$(git hash-object benchmarks/v031_private_verified_snapshot_o24.py)" = a454ee5ab2920be28c56b3a7fcafd8b0ae99547d
          python -m py_compile benchmarks/v031_sealed_memfd_source_o26.py
          git log --format='%H %s' -5 > benchmark-artifacts/lineage.txt
          git hash-object src/cmpct/reader.py benchmarks/v031_private_verified_snapshot_o24.py benchmarks/v031_sealed_memfd_source_o26.py > benchmark-artifacts/source-blobs.txt
          printf '%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/head.txt
      - name: Install inherited source
        run: python -m pip install -e '.[test]'
      - name: Execute independent sealed source and cost falsifiers
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/v031_sealed_memfd_source_o26.py --out benchmark-artifacts/o26-original.json > benchmark-artifacts/stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("benchmark-artifacts/o26-original.json").read_text())
          assert r["status"] == "PASS"
          assert len(r["cases"]) == len(r["economics"]) == 4
          assert set(r["cases"]) == {"pack_128","raw_128","pack_4mib","raw_4mib"}
          for name, case in r["cases"].items():
              assert case["seal_bits"] & case["required_seal_bits"] == case["required_seal_bits"], name
              assert case["sealed_archive_sha"] == case["source_sha_original"], name
              assert case["output_sha"] == case["expected_original_output_sha"], name
              assert case["same_user_write_attempts_rejected"], name
              assert len(case["write_denials"]) == 4, name
              assert case["fresh_mutant_sha_rejected"], name
              assert case["late_sealed_clone_sha_rejected"], name
              cost = r["economics"][name]
              assert cost["samples"] == 15 == len(cost["raw"]), name
              assert {row["mode"] for row in cost["raw"]} == {"direct","disk","memfd"}, name
              assert all(row["output_sha"] == case["output_sha"] for row in cost["raw"]), name
              print(name, "bytes", case["archive_bytes"],
                    "memfd_pages", case["memfd_minimum_page_charge"],
                    "medians", cost["medians"])
          PY
      - name: Upload original source-bound raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-sealed-memfd-o26-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: warn
