# ci-lane: fast
name: v0.31 J24B07 nonnegative hardlink logical-budget falsifier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/j24b07_*'
      - '.github/workflows/v031-j24b07-zero-alias-budget.yml'
      - 'docs/v031-research/2026-10-28-j24b07-*'
      - 'src/cmpct/reader.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-wire-three-host-falsifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      J24B07_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24B07_OUT: ${{ runner.temp }}/j24b07-evidence
    steps:
      - name: Checkout exact preregistered candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source identity before any code execution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$J24B07_EXPECTED_HEAD"
          git rev-parse HEAD
          git status --short
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate wheel and independent referee dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel
          python -m pip install . zstandard
      - name: Execute real signed-index logical-quota counterexample
        shell: bash
        run: |
          mkdir -p "$J24B07_OUT"
          git rev-parse HEAD > "$J24B07_OUT/source-head.txt"
          python research/j24b07_hardlink_zero_quota_court.py --out "$J24B07_OUT"
      - name: Independently audit physical wire and reject forged receipts
        shell: bash
        run: |
          python research/j24b07_hardlink_zero_quota_referee.py --out "$J24B07_OUT"
      - name: Persist physical source, signed mutants and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b07-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ env.J24B07_OUT }}
          if-no-files-found: warn
          retention-days: 30
