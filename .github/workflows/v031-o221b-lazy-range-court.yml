# ci-lane: fast
# O221b separately preregistered; source-exact science only. NOT a release gate.
name: CMPCT O221b lazy checkpoint crossover
on:
  push:
    branches:
      - agent/phased3-v031-o221-chunk-range-stride-court-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o221b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-short-sessions:
    name: Installed Reader baseline-eager-lazy signed r24 trial
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin original science/Reader and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 748d0dc9ad36c3dad791a1f1fed5084904aad897 HEAD
          git merge-base --is-ancestor d5094e0297fcd91a822f272da52cd3ac29a6545b HEAD
          git merge-base --is-ancestor c5e13bb3fbb4cdade8b64246658ce7c7818de41f HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = dbd4ac576a05a47eae97e1e40de89cf1de440516
          test "$(git rev-parse HEAD:research/o221_chunk_range_strided_oracle.py)" = d5b97d8a75707243e49d79c4561ad9e40072939d
          mkdir -p o221b-evidence
          git rev-parse HEAD > o221b-evidence/head.sha
          git rev-parse HEAD:src/cmpct/reader.py > o221b-evidence/reader.blob
          git rev-parse HEAD:research/o221b_lazy_range_crossover.py > o221b-evidence/instrument.blob
      - name: Install Python and actual CMPCT Reader
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-installed Reader identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import cmpct.reader,inspect,hashlib,os
          from pathlib import Path
          installed=Path(inspect.getfile(cmpct.reader)).resolve()
          source=Path(os.environ["GITHUB_WORKSPACE"])/"src/cmpct/reader.py"
          assert installed!=source.resolve()
          assert installed.read_bytes().replace(b"\r\n",b"\n")==source.read_bytes().replace(b"\r\n",b"\n")
          print("INSTALLED_READER_SHA256",hashlib.sha256(installed.read_bytes()).hexdigest())
          PY
      - name: Genuine signed r24 Reader ABBA crossover
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o221b_lazy_range_crossover.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/o221b-evidence/results.json" \
            --repeats 3 2>&1 | tee "$GITHUB_WORKSPACE/o221b-evidence/run.log"
      - name: Independent audit of every raw observation
        shell: bash
        run: |
          set -euo pipefail
          python research/o221b_independent_receipt_audit.py o221b-evidence/results.json \
            2>&1 | tee o221b-evidence/audit.log
      - name: Preserve all science including non-wins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o221b-authenticated-short-session-${{ github.sha }}
          path: o221b-evidence/
          if-no-files-found: warn
