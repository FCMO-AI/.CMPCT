name: CMPCT v0.30 pathdict reusable Zstd context v8

on:
  workflow_dispatch:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - benchmarks/v030_r24_pathdict_fused_encode_referee.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v2.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v3.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v4.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v5.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v6.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v7.py
      - benchmarks/v030_r24_pathdict_fused_encode_referee_v8.py
      - benchmarks/v030_r24_pathblind_dictionary_referee.py
      - benchmarks/v030_r24_micropack_same_grammar_attribution.py
      - benchmarks/v030_r24_micropack_current15_transfer.py
      - benchmarks/v030_current15_stable_corpus.py
      - benchmarks/neutral_hostile_corpus_v1.py
      - benchmarks/resemblance_hostile_corpus_v1.py
      - src/cmpct/**
      - .github/workflows/v030-r24-pathdict-fused-encode-v8.yml

permissions:
  contents: read

jobs:
  reused-cctx-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
      - name: Compile referee
        run: |
          python -m py_compile \
            benchmarks/v030_r24_pathdict_fused_encode_referee.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v6.py \
            benchmarks/v030_r24_pathdict_fused_encode_referee_v8.py
      - name: Execute reusable-context referee
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_r24_pathdict_fused_encode_referee_v8 \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused-v8-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-pathdict-fused-v8.json"
      - name: Validate and expose receipt
        id: receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-pathdict-fused-v8.json').read_text())
          assert d['schema']=='cmpct-v030-r24-pathdict-fused-encode-v1'
          assert d['release_credit'] is False and d['canonical_builder_changed'] is False and d['genesis_rescore'] is False
          a=d['aggregate']; bad=d['identity_failures']
          calls=sum(v['fused']['reused_cctx_calls'] for v in d['rows'].values())
          native_cpu=sum(v['fused']['dictionary_native_encode_cpu_s'] for v in d['rows'].values())
          native_wall=sum(v['fused']['dictionary_native_encode_wall_s'] for v in d['rows'].values())
          print(json.dumps({'verdict':d['verdict'],'identity_failures':bad,'remaining_cpu':d['remaining_cpu_debts'],'remaining_wall':d['remaining_wall_debts'],'aggregate':a,'reused_calls':calls,'native_cpu_s':native_cpu,'native_wall_s':native_wall,'rows':{k:{'identity':v['identity'],'calls':v['fused']['reused_cctx_calls'],'native_cpu_s':v['fused']['dictionary_native_encode_cpu_s'],'native_wall_s':v['fused']['dictionary_native_encode_wall_s'],'cpu_single_ratio':v['cpu_ratio_vs_single_independent'],'wall_single_ratio':v['wall_ratio_vs_single_independent']} for k,v in d['rows'].items()}},sort_keys=True))
          short='invalid' if bad else ('closes' if d['verdict']=='FUSED_ENCODE_CLOSES_CREATION_DEBT' else 'helps')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
            for k,v in {'short':short,'id':len(bad),'cd':len(d['remaining_cpu_debts']),'wd':len(d['remaining_wall_debts']),'cp':f"{a['cpu_ratio_vs_clean_portfolio']:.3f}",'wp':f"{a['wall_ratio_vs_clean_portfolio']:.3f}",'cs':f"{a['cpu_ratio_vs_single_independent']:.3f}",'ws':f"{a['wall_ratio_vs_single_independent']:.3f}",'calls':calls,'ne':f'{native_cpu:.3f}','nw':f'{native_wall:.3f}','fp':d['corpus_fingerprint'][:10]}.items(): fh.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v030-pathdict-fused-v8-${{ steps.receipt.outputs.short || 'nosummary' }}-id${{ steps.receipt.outputs.id }}-cd${{ steps.receipt.outputs.cd }}-wd${{ steps.receipt.outputs.wd }}-cp${{ steps.receipt.outputs.cp }}-wp${{ steps.receipt.outputs.wp }}-cs${{ steps.receipt.outputs.cs }}-ws${{ steps.receipt.outputs.ws }}-calls${{ steps.receipt.outputs.calls }}-ne${{ steps.receipt.outputs.ne }}-nw${{ steps.receipt.outputs.nw }}-fp${{ steps.receipt.outputs.fp }}-${{ github.sha }}
          path: benchmark-artifacts/v030-pathdict-fused-v8.json
          if-no-files-found: error
          retention-days: 90

# Trigger-only edit after first registration of this workflow on the research branch.
