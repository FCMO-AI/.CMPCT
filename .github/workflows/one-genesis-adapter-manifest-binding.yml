# ci-lane: research
name: CMPCT1 ONE adapter manifest binding

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_genesis_adapter_manifest_builder.py'
      - 'benchmarks/one/one_genesis_contender_raw_adapter.py'
      - 'tests/one/test_genesis_adapter_manifest_builder.py'
      - 'docs/one/prereg/ONE_GENESIS_ADAPTER_MANIFEST_BINDING_v0.1_2026-09-10.md'
      - '.github/workflows/one-genesis-adapter-manifest-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  V029_SHA: 02b8b27cb2d97af7c6e0797984a898e8fa8a8e5d
  V030_SHA: f4b158a55a08b9b18b50e4e4abe4b9251048c772

jobs:
  adapter-manifest-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Checkout frozen v0.29
        uses: actions/checkout@v6
        with:
          ref: ${{ env.V029_SHA }}
          path: frozen-v029
      - name: Checkout frozen v0.30
        uses: actions/checkout@v6
        with:
          ref: ${{ env.V030_SHA }}
          path: frozen-v030
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Falsify manifest builder
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate
        run: |
          python -m pip install pytest
          python -m pytest -q candidate/tests/one/test_genesis_adapter_manifest_builder.py \
            | tee adapter-manifest-tests.txt
      - name: Build source-bound manifest without execution authority
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate
        run: |
          mkdir -p receipts
          python candidate/benchmarks/one/one_genesis_adapter_manifest_builder.py \
            --candidate-sha "$GITHUB_SHA" \
            --candidate-checkout candidate \
            --v029-checkout frozen-v029 \
            --v030-checkout frozen-v030 \
            --output receipts/adapters.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('receipts/adapters.json').read_text())
          assert row['schema']=='cmpct-one-genesis-adapters-v1'
          assert row['candidate_sha']==__import__('os').environ['GITHUB_SHA']
          assert row['frozen_comparators']['v0.29']==__import__('os').environ['V029_SHA']
          assert row['frozen_comparators']['v0.30']==__import__('os').environ['V030_SHA']
          assert set(row['adapters'])=={'cmpct1','v0.29','v0.30'}
          assert row['execution_authorized'] is False
          assert row['comparisons_executed'] is False
          assert row['scoring_executed'] is False
          assert row['winner_selected'] is False
          PY
      - name: Preserve source-binding receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: one-genesis-adapter-manifest-binding-${{ github.sha }}
          path: |
            receipts/adapters.json
            adapter-manifest-tests.txt
          if-no-files-found: warn
          retention-days: 90