# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 v0.25 strength recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_v025_strength_recovery_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-v025-strength-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-v025-strength-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_v025_strength_recovery_oracle\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v[^/]*\.py|experiments/entropygraph_v025\.py|\.github/workflows/v030-v025-strength-recovery\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit cannot affect v0.25 strength recovery.'
          fi

  v025-strength-recovery:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus and comparator dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile historical-strength oracle
        run: python -m py_compile benchmarks/v030_v025_strength_recovery_oracle.py experiments/entropygraph_v025.py
      - name: Measure verified v0.25 representation against current ZIP/Zstd
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_v025_strength_recovery_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-v025-strength-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-v025-strength.json"
      - name: Independently validate measurement integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-v025-strength.json').read_text())
          assert d['schema']=='cmpct-v030-v025-strength-recovery-v1'
          assert d['targets']==['02_office_workspace','04_analytics_and_database']
          assert d['rounds']==3
          assert len(d['rows'])==2
          assert all(len(row['raw_create_s']['cmpnx5'])==3 for row in d['rows'])
          assert all(len(row['raw_create_s']['zip'])==3 for row in d['rows'])
          assert all(len(row['raw_create_s']['zstd19'])==3 for row in d['rows'])
          assert all(row['archive_bytes']['cmpnx5'] < row['archive_bytes']['zip'] for row in d['rows'])
          assert all(row['archive_bytes']['cmpnx5'] < row['archive_bytes']['zstd19'] for row in d['rows'])
          assert d['measurement_gate']['passed'] is True
          PY
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-v025-strength-recovery.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-v025-strength-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-v025-strength.json
          if-no-files-found: warn
          retention-days: 90

# A four-way row here is a design signal, not a promotion. CMPNX5 remains non-canonical. The point is to identify
# whether office/analytics need new compression science or primarily bounded productization/performance engineering.
