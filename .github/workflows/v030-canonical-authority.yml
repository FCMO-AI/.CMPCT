# ci-lane: release
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 canonical r25 authority

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/cmpct/**'
      - 'experiments/entropygraph_v030_*.py'
      - 'tests/test_v030_*.py'
      - 'tests/conformance/v030-r25-canonical.json'
      - 'benchmarks/v030_*.py'
      - '.github/workflows/v030-canonical-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-v030-canonical-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_release: ${{ steps.scope.outputs.run_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify canonical release impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_release=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(src/cmpct/.*|experiments/entropygraph_v030_.*\.py|tests/test_v030_.*\.py|tests/conformance/v030-r25-canonical\.json|benchmarks/v030_(release_generalization_canonical|release_performance_product|perf_worker_canonical|external_competitors_canonical)\.py|\.github/workflows/v030-canonical-authority\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_release=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect canonical r25 authority.'
          fi

  canonical-fast:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_release == 'true'
    name: canonical-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cmpct-v030-canonical-fast-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Compile canonical product authority
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_admission.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_member_reader.py \
            experiments/entropygraph_v030_shared_portfolio.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_authoritative.py \
            experiments/entropygraph_v030_canonical.py \
            experiments/entropygraph_v030_release_product.py \
            benchmarks/v030_release_generalization_canonical.py \
            benchmarks/v030_perf_worker_canonical.py \
            benchmarks/v030_release_performance_product.py \
            benchmarks/v030_external_competitors_canonical.py
      - name: Run canonical correctness, recovery and hostile-input gates
        run: |
          python -m pytest -q \
            tests/test_v030_geometry.py \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_geometry_overlay_g04.py \
            tests/test_v030_g04_publish.py \
            tests/test_v030_shared_portfolio.py \
            tests/test_v030_prefixgraph.py \
            tests/test_v030_release_admission.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_release_fuzz.py \
            tests/test_v030_release_candidate.py \
            tests/test_v030_canonical.py \
            tests/test_v030_release_generalization_contract.py
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

  canonical-generalization:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_release == 'true'
    name: canonical-generalization
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: cmpct-v030-canonical-generalization-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Pin revision and compression contracts
        run: python -m pytest -q tests/test_v030_canonical.py tests/test_v030_release_generalization_contract.py tests/test_v030_release_admission.py
      - name: Run canonical 15-workload release gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_generalization_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-generalization-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-generalization.json"
      - name: Enforce immutable canonical release contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/canonical-generalization.json')
          assert path.is_file(), 'canonical generalization did not publish evidence'
          d=json.loads(path.read_text())
          c=d['contract']; t=d['totals']; g=d['gate']; f=d['canonical_format']
          assert d['engine']=='experiments/entropygraph_v030_release_product.py'
          assert d['release_facade']=='cmpct-v030-release-product-v1'
          assert c['expected_v029_aggregate_bytes']==137499525
          assert c['minimum_release_saving_bytes']==687783
          assert c['inherited_absolute_revision_floor_bytes']==687783
          assert c['minimum_improved_rows']==3
          assert c['maximum_member_read_amplification']==8.0
          assert t['workloads']==15
          assert t['workloads_regressed']==0
          assert t['workloads_improved']>=3
          assert t['saving_vs_v029_bytes']>=687783
          assert t['max_selected_member_read_amplification']<=8.0
          assert f['new_revision']==25
          assert f['fallback_revision']==24
          assert f['fallback_is_unwrapped'] is True
          assert g['passed'] is True
          assert all(len(row['archive_sha256'])==64 for row in d['rows'])
          PY
      - name: Upload canonical compression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-generalization-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/canonical-generalization.json
          if-no-files-found: error
          retention-days: 90

  canonical-runtime:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_release == 'true'
    name: canonical-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 420
    concurrency:
      group: cmpct-v030-canonical-runtime-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run canonical runtime prerequisites
        run: python -m pytest -q tests/test_v030_shared_portfolio.py tests/test_v030_release_admission.py tests/test_v030_member_reader.py tests/test_v030_canonical.py
      - name: Run fresh-process promoted-product runtime gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_performance_product.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-runtime-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-runtime.json"
      - name: Enforce frozen runtime policy
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/canonical-runtime.json')
          assert path.is_file(), 'canonical runtime did not publish evidence'
          d=json.loads(path.read_text())
          c=d['contract']; t=d['totals']; g=d['gate']
          assert d['engine']=='experiments/entropygraph_v030_release_product.py'
          assert d['release_facade']=='cmpct-v030-release-product-v1'
          assert c['maximum_median_create_ratio']==1.10
          assert c['maximum_workload_create_ratio']==1.25
          assert c['maximum_median_extract_ratio']==1.10
          assert c['maximum_workload_extract_ratio']==1.25
          assert c['maximum_peak_rss_ratio']==1.25
          assert t['median_create_ratio']<=1.10
          assert t['max_workload_create_ratio']<=1.25
          assert t['median_extract_ratio']<=1.10
          assert t['max_workload_extract_ratio']<=1.25
          assert t['max_peak_rss_ratio']<=1.25
          assert g['passed'] is True
          PY
      - name: Upload canonical runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-runtime-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/canonical-runtime.json
          if-no-files-found: error
          retention-days: 90

  canonical-external-frontier:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_release == 'true'
    name: canonical-external-frontier
    runs-on: ubuntu-latest
    timeout-minutes: 540
    concurrency:
      group: cmpct-v030-canonical-external-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind evidence to exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CMPCT, frozen-corpus media tools and external compressors from canonical Ubuntu feed
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd p7zip-full zpaq gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run canonical exact-tree external frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_external_competitors_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-external-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-external.json"
      - name: Enforce strict per-workload external frontier contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/canonical-external.json')
          assert path.is_file(), 'canonical external frontier did not publish evidence'
          d=json.loads(path.read_text())
          a=d['aggregates']; g=d['gate']
          assert d['engine']=='experiments/entropygraph_v030_release_product.py'
          assert d['release_facade']=='cmpct-v030-release-product-v1'
          assert a['all']['7z_lzma2_max_solid']['complete_for_suite'] is True
          assert a['all']['tar_zstd19_solid']['complete_for_suite'] is True
          assert a['all']['zpaq_method5']['complete_for_suite'] is True
          assert g['aggregate_beats_zip'] is True
          assert g['aggregate_beats_7z_when_available'] is True
          assert g['neutral_beats_solid_zstd19'] is True
          assert g['hostile_closes_solid_zstd19_frontier'] is True
          assert g['hostile_closes_zpaq5_frontier_when_available'] is True
          for key in (
              'all_workloads_strictly_beat_zip_size',
              'all_workloads_strictly_beat_zstd19_size',
              'all_workloads_strictly_beat_zip_create',
              'all_workloads_strictly_beat_zstd19_create',
              'strict_no_ties_size_or_create',
          ):
              assert g[key] is True
          rows=d['strict_per_workload_dominance']['rows']
          assert len(rows)==15
          assert all(r['strictly_beats_zip_size'] for r in rows)
          assert all(r['strictly_beats_zstd19_size'] for r in rows)
          assert all(r['strictly_beats_zip_create'] for r in rows)
          assert all(r['strictly_beats_zstd19_create'] for r in rows)
          assert g['passed'] is True
          PY
      - name: Upload canonical external evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-external-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/canonical-external.json
          if-no-files-found: error
          retention-days: 90

# Footnote: classifier routing is cancellable by PR/ref while every substantive canonical receipt has its own
# exact-SHA non-cancelling job group. This preserves already-started scientific/release evidence but prevents the
# accumulated long-lived PR diff from retaining one queued classifier workflow per commit. Every canonical release
# measurement remains bound to the promoted `entropygraph_v030_release_product` front door. Historical mechanism-
# causality remains separate evidence and cannot impersonate product runtime or external performance. No compression,
# locality, runtime, RSS or competitor threshold is weakened; strict 15/15 ZIP/Zstd size+create equality still fails.
