# ci-lane: release
name: CMPCT v0.30 canonical r25 authority

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/entropygraph_v030_*.py'
      - 'tests/test_v030_*.py'
      - 'benchmarks/v030_*.py'
      - '.github/workflows/v030-canonical-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  canonical-fast:
    name: canonical-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile canonical authority
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_admission.py \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_member_reader.py \
            experiments/entropygraph_v030_shared_portfolio.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_authoritative.py \
            experiments/entropygraph_v030_canonical.py \
            benchmarks/v030_release_generalization_canonical.py \
            benchmarks/v030_perf_worker_canonical.py \
            benchmarks/v030_release_performance_canonical.py \
            benchmarks/v030_external_competitors_canonical.py
      - name: Run canonical correctness, recovery and hostile-input gates
        run: |
          python -m pytest -q \
            tests/test_v030_geometry.py \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_geometry_overlay_g04.py \
            tests/test_v030_g04_publish.py \
            tests/test_v030_shared_portfolio.py \
            tests/test_v030_prefixgraph.py \
            tests/test_v030_release_admission.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_release_fuzz.py \
            tests/test_v030_release_candidate.py \
            tests/test_v030_canonical.py \
            tests/test_v030_release_generalization_contract.py
      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py

  canonical-generalization:
    name: canonical-generalization
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Pin revision and compression contracts
        run: python -m pytest -q tests/test_v030_canonical.py tests/test_v030_release_generalization_contract.py tests/test_v030_release_admission.py
      - name: Run canonical 15-workload release gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_generalization_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-generalization-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-generalization.json"
      - name: Enforce immutable canonical release contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/canonical-generalization.json').read_text())
          c=d['contract']; t=d['totals']; g=d['gate']; f=d['canonical_format']
          assert d['engine']=='experiments/entropygraph_v030_canonical.py'
          assert d['release_facade']=='cmpct-v030-r25-v1'
          assert c['expected_v029_aggregate_bytes']==137499525
          assert c['minimum_release_saving_bytes']==687783
          assert c['inherited_absolute_revision_floor_bytes']==687783
          assert c['minimum_improved_rows']==3
          assert c['maximum_member_read_amplification']==8.0
          assert t['workloads']==15
          assert t['workloads_regressed']==0
          assert t['workloads_improved']>=3
          assert t['saving_vs_v029_bytes']>=687783
          assert t['max_selected_member_read_amplification']<=8.0
          assert f['new_revision']==25
          assert f['fallback_revision']==24
          assert f['fallback_is_unwrapped'] is True
          assert g['passed'] is True
          assert all(len(row['archive_sha256'])==64 for row in d['rows'])
          PY
      - name: Upload canonical compression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-generalization-${{ github.sha }}
          path: benchmark-artifacts/canonical-generalization.json
          if-no-files-found: warn
          retention-days: 90

  canonical-runtime:
    name: canonical-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run canonical runtime prerequisites
        run: python -m pytest -q tests/test_v030_shared_portfolio.py tests/test_v030_release_admission.py tests/test_v030_member_reader.py tests/test_v030_canonical.py
      - name: Run fresh-process canonical runtime gate
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_release_performance_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-runtime-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-runtime.json"
      - name: Enforce frozen runtime policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/canonical-runtime.json').read_text())
          c=d['contract']; t=d['totals']; g=d['gate']
          assert d['engine']=='experiments/entropygraph_v030_canonical.py'
          assert d['release_facade']=='cmpct-v030-r25-v1'
          assert c['maximum_median_create_ratio']==1.10
          assert c['maximum_workload_create_ratio']==1.25
          assert c['maximum_median_extract_ratio']==1.10
          assert c['maximum_workload_extract_ratio']==1.25
          assert c['maximum_peak_rss_ratio']==1.25
          assert t['median_create_ratio']<=1.10
          assert t['max_workload_create_ratio']<=1.25
          assert t['median_extract_ratio']<=1.10
          assert t['max_workload_extract_ratio']<=1.25
          assert t['max_peak_rss_ratio']<=1.25
          assert g['passed'] is True
          PY
      - name: Upload canonical runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-runtime-${{ github.sha }}
          path: benchmark-artifacts/canonical-runtime.json
          if-no-files-found: warn
          retention-days: 90

  canonical-external-frontier:
    name: canonical-external-frontier
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CMPCT, frozen-corpus media tools and external compressors
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd p7zip-full zpaq gcc ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run canonical exact-tree external frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_external_competitors_canonical.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-external-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/canonical-external.json"
      - name: Enforce external frontier contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/canonical-external.json').read_text())
          a=d['aggregates']; g=d['gate']
          assert d['engine']=='experiments/entropygraph_v030_canonical.py'
          assert d['release_facade']=='cmpct-v030-r25-v1'
          assert a['all']['7z_lzma2_max_solid']['complete_for_suite'] is True
          assert a['all']['tar_zstd19_solid']['complete_for_suite'] is True
          assert a['all']['zpaq_method5']['complete_for_suite'] is True
          assert g['aggregate_beats_zip'] is True
          assert g['aggregate_beats_7z_when_available'] is True
          assert g['neutral_beats_solid_zstd19'] is True
          assert g['hostile_closes_solid_zstd19_frontier'] is True
          assert g['hostile_closes_zpaq5_frontier_when_available'] is True
          assert g['passed'] is True
          PY
      - name: Upload canonical external evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-canonical-external-${{ github.sha }}
          path: benchmark-artifacts/canonical-external.json
          if-no-files-found: warn
          retention-days: 90

# Footnote: only this workflow's canonical-r25 jobs are eligible to close compression/runtime/external release
# gates. The corpus-building jobs install `ffmpeg` because the frozen neutral-hostile media row invokes it before
# measurement; this is environment completion, not a compressor shortcut or policy change. Native/shared-reader
# and portability remain mandatory separate authority before #56 can merge.
