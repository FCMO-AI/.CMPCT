# ci-lane: deep
name: CMPCT v0.30 G0-G4 ML native reader oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/cmpct-portable/**'
      - 'experiments/entropygraph_v030_native_reader_bridge.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_geometry_overlay_g04*.py'
      - 'benchmarks/v030_release_performance*.py'
      - 'benchmarks/v030_g04_ml_native_reader_oracle.py'
      - 'tests/test_v030_native_reader_bridge.py'
      - '.github/workflows/v030-g04-ml-native-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-g04-ml-native-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ml-native-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deterministic ML-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile Python and native surfaces
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_native_reader_bridge.py \
            experiments/entropygraph_v030_release_reader.py \
            benchmarks/v030_release_performance.py \
            benchmarks/v030_g04_ml_native_reader_oracle.py
          cargo build --manifest-path native/cmpct-portable/Cargo.toml --release --bin cmpct-portable
      - name: Preserve native G0-G4 and bridge correctness before timing
        run: |
          cargo test --manifest-path native/cmpct-portable/Cargo.toml g04 --release
          python -m pytest -q \
            tests/test_v030_native_reader_bridge.py \
            tests/test_v030_release_reader.py \
            tests/test_v030_member_reader.py \
            tests/test_v030_release_fuzz.py
      - name: Run canonical ML Python-vs-native bridge A/B
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_g04_ml_native_reader_oracle.py \
            --native-cli "$GITHUB_WORKSPACE/native/cmpct-portable/target/release/cmpct-portable" \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-native-reader-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-native-reader.json"
      - name: Independently enforce identity, hostile rejection, caller budget and claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-g04-ml-native-reader.json').read_text())
          assert d['schema']=='cmpct-v030-g04-ml-native-reader-v2'
          assert d['target']=='neutral_hostile_v1/09_ml_artifacts'
          assert d['native_bridge']=='cmpct-portable-process-v1'
          assert d['native_extract_budget_preflight_timed'] is True
          assert int(d['rounds'])==5
          assert d['native_corruption_rejected'] is True
          assert d['native_caller_budget_preserved'] is True
          c=d['contract']; g=d['gate']
          assert c['archive_bytes_changed'] is False
          assert c['grammar_changed'] is False
          assert c['memory_budget_changed'] is False
          assert c['caller_extract_budget_enforced_before_publication'] is True
          assert float(c['locality_limit'])==8.0
          assert int(c['decode_unit_limit_bytes'])==8*1024*1024
          assert g['archive_bytes_unchanged'] is True
          assert g['canonical_tree_preserved'] is True
          assert g['native_corruption_rejected'] is True
          assert g['native_caller_budget_preserved'] is True
          assert d['release_credit'] is False
          assert len(d['samples_s']['python_verify'])==5
          assert len(d['samples_s']['native_verify'])==5
          assert len(d['samples_s']['python_extract'])==5
          assert len(d['samples_s']['native_extract'])==5
          # Promotion stays strict but a slower exact native path is valid negative evidence.
          expected=(
              float(d['verify_improvement_fraction'])>=float(c['minimum_verify_improvement_fraction'])
              and float(d['extract_improvement_fraction'])>=float(c['minimum_extract_improvement_fraction'])
          )
          assert d['promotion_signal'] is expected
          assert g['passed'] is expected
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-g04-ml-native-reader.yml
      - name: Upload native-reader evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-g04-ml-native-reader-${{ github.sha }}
          path: benchmark-artifacts/v030-g04-ml-native-reader.json
          if-no-files-found: warn
          retention-days: 90

# Research-only execution-path oracle. It may not change archive bytes, grammar, locality,
# decode-unit, integrity, caller output budget or memory law. A positive A/B is only permission
# to integrate the already-existing portable Rust G0-G4 reader and then re-earn ordinary release authority.
