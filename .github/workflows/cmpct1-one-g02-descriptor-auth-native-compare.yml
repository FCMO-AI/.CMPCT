# ci-lane: fast
name: CMPCT1 ONE-G0.2 native descriptor auth A/B
on:
  pull_request:
    paths:
      - "benchmarks/one/native/one_g02_descriptor_auth_compare_openssl.c"
      - "benchmarks/one/one_g02_descriptor_auth_native_compare.py"
      - ".github/workflows/cmpct1-one-g02-descriptor-auth-native-compare.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-descriptor-auth-native-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run frozen native descriptor authentication A/B
        run: |
          mkdir -p one-descriptor-auth-native-artifacts
          python -m benchmarks.one.one_g02_descriptor_auth_native_compare | tee one-descriptor-auth-native-artifacts/one-g02-descriptor-auth-native-compare.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-descriptor-auth-native-compare-${{ env.EVIDENCE_HEAD }}
          path: one-descriptor-auth-native-artifacts/
          if-no-files-found: error
