# ci-lane: deep
name: ONE-G0.2 hierarchy validation-span fusion diagnostic

on:
  push:
    branches: [ research/cmpct1 ]
    paths:
      - 'benchmarks/one/native/one_g02_hierarchy_validation_span_fusion.c'
      - 'benchmarks/one/native/one_g02_hierarchy_first_level_fusion.c'
      - 'benchmarks/one/native/one_g02_shared_native_writer_ref_fused.c'
      - 'docs/one/prereg/ONE_G02_HIERARCHY_VALIDATION_SPAN_FUSION_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-hierarchy-validation-span-fusion.yml'
  workflow_dispatch:

concurrency:
  group: one-g02-hierarchy-validation-span-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hierarchy-validation-span-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact evidence head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Build and run preregistered validation-span diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O3 -Wall -Wextra -Werror \
            -Ibenchmarks/one/native \
            benchmarks/one/native/one_g02_hierarchy_validation_span_fusion.c \
            -o /tmp/one_g02_hierarchy_validation_span_fusion
          /tmp/one_g02_hierarchy_validation_span_fusion | tee /tmp/hierarchy-validation-span.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/hierarchy-validation-span.txt').read_text()
          rows = [float(x) for x in re.findall(r'elapsed_ratio=([0-9.]+)', text)]
          if len(rows) != 4:
              raise SystemExit('missing frozen diagnostic rows')
          if 'hostile validation rejection parity: PASS' not in text:
              raise SystemExit('missing hostile rejection parity')
          if 'semantic parity PASS' not in text:
              raise SystemExit('missing semantic parity')
          if max(rows) > 0.95:
              raise SystemExit(f'FAIL: row regression max={max(rows):.6f}x > 0.95x')
          med = sorted(rows)[1:3]
          median = sum(med) / 2
          if median > 0.75:
              raise SystemExit(f'FAIL: median validation+emission {median:.6f}x > 0.75x gate')
          print(f'PASS: validation-span fusion median={median:.6f}x max={max(rows):.6f}x')
          PY
