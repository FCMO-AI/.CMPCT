name: ONE-G0.2 V2 segment phase attribution

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - 'benchmarks/one/one_g02_v2_segment_phase_attribution.py'
      - 'docs/one/evidence/ONE_G02_V2_SEGMENT_PHASE_ATTRIBUTION_PREREG_2026-09-06.md'
      - '.github/workflows/one-g02-v2-segment-phase-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-phase-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: ONE semantic and hostile tests
        run: python -m pytest -q tests/one
      - name: Frozen V2 segment phase attribution
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_v2_segment_phase_attribution | tee one-g02-v2-segment-phase-attribution.json
      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-v2-segment-phase-attribution-${{ github.sha }}
          path: one-g02-v2-segment-phase-attribution.json
          if-no-files-found: error
