# ci-lane: fast
# O80 exact installed-product composition; never substitute independent owner green.
name: CMPCT v0.31 O80 Builder three-family fidelity composition
on:
  push:
    branches:
      - 'agent/phased1-v031-o80-builder-source-fidelity-union-20261025'
  pull_request:
    paths:
      - 'src/cmpct/builder.py'
      - 'tests/test_v031_o80_builder_fidelity_composition.py'
      - 'tests/test_v031_o65_xattr_capture.py'
      - 'tests/test_v031_hardlinked_symlink_o67.py'
      - '.github/workflows/v031-builder-fidelity-union-o80.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-o80-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-builder-union:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_O67_VARIANT: candidate
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPython 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Source custody, installed candidate, genuine inherited and mixed tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          git merge-base --is-ancestor 9de342226bfbce3690ef1c8cabb1fdf229dbf003 HEAD
          test "$(git hash-object src/cmpct/builder.py)" = "37833f09dee4671b8ca6f3f3690a7fdebfbc4c70"
          test "$(git hash-object src/cmpct/ntfs_streams.py)" = "61d8cab1545c491da76b23ea89d4ca85d3030c5d"
          test "$(git hash-object tests/test_v031_o65_xattr_capture.py)" = "a1fea48b62b53f417afa19fbbba805fee090736e"
          test "$(git hash-object tests/test_v031_hardlinked_symlink_o67.py)" = "71f6013453b350b9c13e47138c57d0d977e16a25"
          test "$(git hash-object tests/test_v031_win32_builder_hardlink_o47.py)" = "6c00ae49eea075957453d6d7238d988add6eedee"
          test "$(git hash-object tests/test_v031_special_entries_o48.py)" = "d4a22da7d634a5dd6a1e1fb132ed1ceae2249ab6"
          test "$(git hash-object tests/test_v031_builder_composition_o50.py)" = "44f66dcf220231c1271d56bbff26da290d32d20c"
          test "$(git hash-object tests/test_v031_builder_parent_parity_o50.py)" = "5b7e2bc50971ca5801038b3598d2e2af36235074"
          test "$(git hash-object tests/test_v031_win32_ads_refusal_o57.py)" = "abd88c8c7394fac15d4d98a5f3cca0844bd8dff6"
          test "$(git hash-object tests/test_v031_ntfs_empty_dir_guard_o61d2.py)" = "abb81c6ab670d35b618c0759507594cc1303a463"
          test "$(git hash-object tests/test_v031_ntfs_directory_admission_o64.py)" = "31932cf79bed9930657fc0aba786eb7c0af59baa"
          git diff --exit-code 9de342226bfbce3690ef1c8cabb1fdf229dbf003 HEAD -- src/cmpct/reader.py src/cmpct/transactions.py src/cmpct/codec.py native benchmarks/universal_bench.py benchmarks/history tools/check_performance_regression.py
          echo "O80_HEAD=$(git rev-parse HEAD)"
          echo "O80_BUILDER_BLOB=$(git hash-object src/cmpct/builder.py)"
          python -m pip install . pytest
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cmpct.builder, cmpct.reader, cmpct.ntfs_streams
          root=Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip()).resolve()
          for m in (cmpct.builder, cmpct.reader, cmpct.ntfs_streams):
              p=Path(m.__file__).resolve()
              assert not p.is_relative_to(root), ("not an installed product module", p)
              print("O80_INSTALLED="+str(p),flush=True)
          PY
          mkdir -p o80-isolated
          cp tests/test_v031_win32_builder_hardlink_o47.py o80-isolated/
          cp tests/test_v031_special_entries_o48.py o80-isolated/
          cp tests/test_v031_builder_composition_o50.py o80-isolated/
          cp tests/test_v031_builder_parent_parity_o50.py o80-isolated/
          cp tests/test_v031_win32_ads_refusal_o57.py o80-isolated/
          cp tests/test_v031_ntfs_empty_dir_guard_o61d2.py o80-isolated/
          cp tests/test_v031_ntfs_directory_admission_o64.py o80-isolated/
          cp tests/test_v031_o65_xattr_capture.py o80-isolated/
          cp tests/test_v031_hardlinked_symlink_o67.py o80-isolated/
          cp tests/test_v031_o80_builder_fidelity_composition.py o80-isolated/
          python -m pytest -vv -s o80-isolated/ --junitxml=o80-results.xml 2>&1 | tee o80-results.log
          python - <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          # Linux aliases ENOTSUP/EOPNOTSUPP to one errno: O65 parametrization
          # therefore collects 10 rather than 11 tests. Other hosts collect 11.
          # Source-bound actual JUnit census is 36/37 without suppressing any case.
          expected_total = 36 if sys.platform.startswith("linux") else 37
          expected_skips = (7 if sys.platform.startswith("linux") else
                            8 if sys.platform == "darwin" else 11)
          cases=list(ET.parse("o80-results.xml").getroot().iter("testcase"))
          count={k:sum(c.find(k) is not None for c in cases) for k in ("failure","error","skipped")}
          count["tests"]=len(cases);count["passed"]=len(cases)-sum(count[k] for k in ("failure","error","skipped"))
          print("O80_JUNIT="+json.dumps(count,sort_keys=True),flush=True)
          assert count["tests"] == expected_total, ("O64/O65/O67/O80 actual platform collection",count)
          assert count["skipped"] == expected_skips, ("unexpected OS-specific skip delta",count)
          assert count["passed"] == expected_total-expected_skips, count
          assert count["failure"] == count["error"] == 0, count
          for tag in ("o64","o65","o67","o80"):
              assert any(tag in c.attrib.get("classname","").lower() or tag in c.attrib.get("name","").lower() for c in cases),tag
          print("O80_REAL_PASS="+str(count["passed"]),flush=True)
          PY
      - name: Preserve JUnit and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o80-installed-${{ matrix.os }}-${{ github.sha }}
          path: |
            o80-results.xml
            o80-results.log
          if-no-files-found: warn
          retention-days: 30
