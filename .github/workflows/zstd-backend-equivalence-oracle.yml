# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT zstd backend equivalence oracle

on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - experiments/zstd_backend_equivalence_oracle.py
      - experiments/zstd_full_archive_backend_oracle.py
      - experiments/zstd_python_backend_fingerprint.py
      - .github/workflows/zstd-backend-equivalence-oracle.yml
  push:
    branches: [agent/zstd-platform-loader]
    paths:
      - experiments/zstd_backend_equivalence_oracle.py
      - experiments/zstd_full_archive_backend_oracle.py
      - experiments/zstd_python_backend_fingerprint.py
      - .github/workflows/zstd-backend-equivalence-oracle.yml
  workflow_dispatch:
permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(experiments/zstd_backend_equivalence_oracle.py|experiments/zstd_full_archive_backend_oracle.py|experiments/zstd_python_backend_fingerprint.py|\.github/workflows/zstd-backend-equivalence-oracle.yml)$'; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  oracle:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}-linux-oracle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - run: python -m pip install -e .
      - name: Primitive equivalence, fail closed
        run: python experiments/zstd_backend_equivalence_oracle.py > zstd-backend-equivalence.json
      - name: Full archive identity, fail closed
        run: python experiments/zstd_full_archive_backend_oracle.py > zstd-full-archive-backend.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zstd-backend-equivalence-${{ env.EVIDENCE_HEAD }}
          path: |
            zstd-backend-equivalence.json
            zstd-full-archive-backend.json
          if-no-files-found: warn

  python-backend-platform-fingerprint:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install 'zstandard>=0.22'
      - shell: bash
        run: python experiments/zstd_python_backend_fingerprint.py > "fingerprint-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: zstd-python-fingerprint-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: fingerprint-${{ matrix.os }}.json
          if-no-files-found: error

  compare-platform-fingerprints:
    needs: [classify, python-backend-platform-fingerprint]
    if: needs.classify.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}-compare
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: zstd-python-fingerprint-*-${{ env.EVIDENCE_HEAD }}
          merge-multiple: true
      - run: |
          python - <<'PY'
          import json, pathlib
          paths=sorted(pathlib.Path('.').glob('fingerprint-*.json'))
          assert len(paths)==3, paths
          rows=[json.loads(p.read_text()) for p in paths]
          assert rows[0]==rows[1]==rows[2], [(p.name, r.get('zstd_version')) for p,r in zip(paths,rows)]
          print('cross-platform Python-zstandard fingerprints identical:', [p.name for p in paths])
          PY
