# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 G0-G4 ML extract cProfile

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_g04_ml_extract_cprofile.py'
      - 'benchmarks/v030_release_performance*.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_release_reader.py'
      - '.github/workflows/v030-g04-ml-extract-cprofile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-g04-ml-extract-cprofile-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deterministic ML-corpus dependencies
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
          cargo build --manifest-path native/preflate-bridge/Cargo.toml --release
      - name: Compile profiler
        run: python -m py_compile benchmarks/v030_g04_ml_extract_cprofile.py
      - name: Profile shipping ML extraction with bounded diagnostic budget
        id: profile
        continue-on-error: true
        run: |
          mkdir -p benchmark-artifacts
          # Earlier evidence showed the private revision-25 profiling context could stall during
          # construction and never reach extraction. The diagnostic now exercises the ordinary
          # shipping front door and keeps a bounded envelope plus durable checkpoints.
          timeout --signal=INT --kill-after=30s 52m \
            python benchmarks/v030_g04_ml_extract_cprofile.py \
              --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-extract-cprofile-work" \
              --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-g04-ml-extract-cprofile.json"
      - name: Validate profile result or non-credit progress checkpoint
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-g04-ml-extract-cprofile.json')
          if not p.exists():
              raise RuntimeError('profiler produced neither final result nor progress checkpoint')
          d=json.loads(p.read_text())
          completed = d.get('schema') == 'cmpct-v030-g04-ml-extract-cprofile-v3'
          if completed:
              assert d['target']=='neutral_hostile_v1/09_ml_artifacts'
              assert d['shipping_front_door_unwrapped'] is True
              assert d['release_credit'] is False
              assert d['top_by_self'] and d['top_by_cumulative']
              census=d['redundant_direct_hash_census']
              assert int(census['digest_equivalent_full_record_bytes']) <= int(census['full_record_direct_bytes']) <= int(census['direct_node_bytes'])
          else:
              assert d['schema']=='cmpct-v030-g04-ml-extract-cprofile-progress-v1'
              assert d['status']=='IN_PROGRESS'
              assert d['target']=='neutral_hostile_v1/09_ml_artifacts'
              assert d['release_credit'] is False
          receipt={
              'schema':'cmpct-v030-g04-ml-extract-cprofile-receipt-v4',
              'source_commit':os.environ['EVIDENCE_HEAD'],
              'scientific_data_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'completed':completed,
              'shipping_front_door_unwrapped':bool(d.get('shipping_front_door_unwrapped', False)) if completed else False,
              'profile_step_outcome':os.environ.get('PROFILE_OUTCOME','unknown'),
              'release_credit':False,
          }
          Path('benchmark-artifacts/v030-g04-ml-extract-cprofile-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
        env:
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-g04-ml-extract-cprofile.yml
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-g04-ml-extract-cprofile-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-g04-ml-extract-cprofile.json
            benchmark-artifacts/v030-g04-ml-extract-cprofile-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve diagnostic failure after evidence upload
        if: always() && steps.profile.outcome != 'success'
        run: |
          echo "Profiler did not complete successfully; checkpoint artifact was preserved for routing." >&2
          exit 1

# Diagnostic only. Profiled timings include profiler overhead and cannot satisfy release-performance gates.
