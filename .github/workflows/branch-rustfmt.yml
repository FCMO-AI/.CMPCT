name: Branch rustfmt repair

on:
  push:
    branches:
      - agent/mode0-streaming-auth

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mode0-streaming-auth
      - name: Apply cargo fmt
        working-directory: native/cmpct-core
        run: cargo fmt
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/cmpct-core
          git commit -m "Apply cargo fmt to native core"
          git push origin HEAD:agent/mode0-streaming-auth
