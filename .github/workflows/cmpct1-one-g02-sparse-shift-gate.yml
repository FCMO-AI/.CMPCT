# ci-lane: fast
name: CMPCT1 ONE-G0.2 sparse shift opportunity gate
on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_sparse_shift_gate_kernel.c"
      - "benchmarks/one/one_g02_sparse_shift_gate_ab.py"
      - ".github/workflows/cmpct1-one-g02-sparse-shift-gate.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-sparse-shift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantics
        run: python -m pytest -q tests/one
      - name: Run frozen sparse-gate falsifier
        run: |
          set -o pipefail
          mkdir -p one-sparse-shift-gate-artifacts
          python -m benchmarks.one.one_g02_sparse_shift_gate_ab \
            | tee one-sparse-shift-gate-artifacts/one-g02-sparse-shift-gate.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-sparse-shift-gate-${{ env.EVIDENCE_HEAD }}
          path: one-sparse-shift-gate-artifacts/
          if-no-files-found: error
