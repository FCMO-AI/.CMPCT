# ci-lane: fast
name: v031 J24F02 verified chunked extraction postcheck publication court

on:
  pull_request:
    paths:
      - 'research/j24f02_chunked_postcheck_publication.py'
      - '.github/workflows/v031-j24f02-chunk-stage-race.yml'
      - 'docs/v031-research/2026-10-26-j24f02-chunk-stage-postverify-prereg.md'
      - 'docs/v031-research/2026-10-26-j24f02-chunk-stage-postverify-result.md'
  workflow_dispatch:

concurrency:
  group: j24f02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j24f02-source-bound-court:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen Reader and archive-vector source custody
        shell: bash
        run: |
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test "$(git rev-parse HEAD:tests/conformance/v24-chunk-maps.json)" = "91141405bb10b2e1226b0652e3aa0a13ba41846c"
          git show -s --format='%H %s' HEAD
      - name: Install exact checkout as a genuine external Python package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Reproduce post-verification stage replacement on installed Reader
        shell: bash
        run: |
          python research/j24f02_chunked_postcheck_publication.py --output "${{ github.workspace }}/j24f02-${{ runner.os }}.json"
          test -s "${{ github.workspace }}/j24f02-${{ runner.os }}.json"
          mkdir -p evidence-artifacts
          cp "${{ github.workspace }}/j24f02-${{ runner.os }}.json" evidence-artifacts/j24f02.json
          test -s evidence-artifacts/j24f02.json
          ls -l evidence-artifacts/j24f02.json
      - name: Preserve exact observations, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24f02-${{ runner.os }}-${{ github.sha }}
          path: evidence-artifacts/j24f02.json
          if-no-files-found: error
          retention-days: 30
