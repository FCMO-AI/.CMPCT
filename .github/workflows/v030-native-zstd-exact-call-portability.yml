# ci-lane: deep
# ci-cancel-policy: split-classifier-preserve-receipts
# ci-pr-scope: latest-head-commit-gate
name: CMPCT exact Zstd usingDict portability oracle

on:
  pull_request:
    branches: [agent/v030-authoritative-integration]
    paths:
      - native/cmpct-core/tests/zstd_encode_equivalence.rs
      - .github/workflows/v030-native-zstd-exact-call-portability.yml
  push:
    branches: [agent/native-zstd-encode-equivalence-oracle]
    paths:
      - native/cmpct-core/tests/zstd_encode_equivalence.rs
      - .github/workflows/v030-native-zstd-exact-call-portability.yml
  workflow_dispatch:

permissions: {contents: read}
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(native/cmpct-core/tests/zstd_encode_equivalence\.rs|\.github/workflows/v030-native-zstd-exact-call-portability\.yml)$'; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  exact-usingdict:
    needs: classify
    if: needs.classify.outputs.run_deep == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-receipt-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 1
      - name: Bind exact candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Run frozen exact-call vectors
        shell: bash
        run: cargo test --manifest-path native/cmpct-core/Cargo.toml --test zstd_encode_equivalence -- --nocapture
