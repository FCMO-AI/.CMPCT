# ci-lane: fast
name: v031 O196 one authentic 4GiB CMPCT across Ubuntu macOS Windows
on:
  pull_request:
    branches:
      - agent/phased3-v031-o193-zip64-streamed-fallback-20261026
    paths:
      - 'research/o196_authentic_crosshost_zip64.py'
      - '.github/workflows/v031-o196-authentic-crosshost-zip64.yml'
      - 'docs/v031-research/2026-10-26-o196-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o196-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-once:
    name: One authenticated Linux 4GiB sparse Builder source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CMPCT source outside checkout
        run: python -m pip install .
      - name: Build one genuine 4GiB S_SPARSE r24 source
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o196-input"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o196_authentic_crosshost_zip64.py" --mode produce --artifact-dir "$RUNNER_TEMP/o196-input" --out "$RUNNER_TEMP/o196-producer-result.json"
      - name: Preserve exact archive and manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: o196-one-original-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/o196-input/authentic-r24.cmpct
            ${{ runner.temp }}/o196-input/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve producer success/failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o196-producer-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/o196-producer-result.json
          if-no-files-found: warn

  cross-host-consumers:
    name: Exact installed O193 Reader genuine ZIP64 (${{ matrix.os }})
    needs: source-once
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CMPCT source outside checkout
        run: python -m pip install .
      - name: Download identical Linux-built archive
        uses: actions/download-artifact@v4
        with:
          name: o196-one-original-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/o196-received
      - name: Full genuine 4GiB ZIP64 export and independent CRC/SHA readback
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TZ: UTC
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/research/o196_authentic_crosshost_zip64.py" --mode consume --artifact-dir "$RUNNER_TEMP/o196-received" --out "$RUNNER_TEMP/o196-result.json"
      - name: Persist full per-host scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o196-result-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/o196-result.json
          if-no-files-found: warn
