# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: CMPCT J24G79 owned hardlink physical court

on:
  push:
    branches:
      - agent/phased2-v031-j24g79-owned-hardlink-xattr-court-20261030
    paths:
      - 'research/j24g79_*'
      - 'docs/v031-research/*j24g79*'
      - '.github/workflows/v031-j24g79-owned-hardlink.yml'
  pull_request:
    branches:
      - agent/phased2-v031-j24g74-owned-decoder-replay-court-20261030
    paths:
      - 'research/j24g79_*'
      - 'docs/v031-research/*j24g79*'
      - '.github/workflows/v031-j24g79-owned-hardlink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-j24g79-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-hardlink:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G79_EVIDENCE_DIR: evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source custody before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor c15459f70001800f3781925efc7356409eb03ffe HEAD
          git merge-base --is-ancestor 0fb19489013836e6be87fd95e0b1faf06576e810 HEAD
          test "$(git rev-parse HEAD:src/cmpct/reader.py)" = 29a8be64f3acfb027750351c6a567fd82cf7dc97
          test "$(git rev-parse HEAD:research/j24g74_owned_decoder_court.py)" = 9af74e26e7585f6d88b1d59ead86514f41b0e373
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'msgpack>=1.0' 'zstandard>=0.22' 'psutil>=5.9'
          python -m py_compile research/j24g79_owned_hardlink_court.py
          python -m pip freeze > evidence/pip-freeze.txt
      - name: Exact Reader baseline versus hardlink xattr physical corpus
        shell: bash
        run: |
          set -o pipefail
          python research/j24g79_owned_hardlink_court.py 2>&1 | tee evidence/j24g79-raw.log
          test -s evidence/j24g79-result.json
      - name: Retain physical and raw evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g79-owned-hardlink-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
