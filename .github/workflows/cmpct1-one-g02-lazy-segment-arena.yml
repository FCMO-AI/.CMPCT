name: CMPCT1 ONE-G0.2 lazy segment arena

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - benchmarks/one/one_g02_lazy_segment_arena.py
      - benchmarks/one/one_g02_end_to_end_direct_emitter_writer.py
      - benchmarks/one/one_g02_shift_branch_bound_relation_transfer.py
      - docs/one/evidence/ONE_G02_LAZY_SEGMENT_ARENA_PREREG_2026-09-08.md
      - .github/workflows/cmpct1-one-g02-lazy-segment-arena.yml
  workflow_dispatch:

jobs:
  lazy-segment-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Bind evidence to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f benchmarks/one/one_g02_lazy_segment_arena.py
          test -f docs/one/evidence/ONE_G02_LAZY_SEGMENT_ARENA_PREREG_2026-09-08.md
          grep -q 'MIN_REJECTED_SAVING_KIB = 8 \* 1024' benchmarks/one/one_g02_lazy_segment_arena.py
          grep -q 'ADMITTED_PEAK_RATIO_MAX = 1.05' benchmarks/one/one_g02_lazy_segment_arena.py
          grep -q 'REPETITIONS = 7' benchmarks/one/one_g02_lazy_segment_arena.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        run: python -m pip install -e '.[test]'

      - name: Prove admitted lazy child reconstructs
        run: >-
          python -m benchmarks.one.one_g02_lazy_segment_arena
          --child lazy shift_plus1

      - name: Prove rejected lazy child reconstructs
        run: >-
          python -m benchmarks.one.one_g02_lazy_segment_arena
          --child lazy independent_random

      - name: Run frozen lazy segment arena falsifier
        shell: bash
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_lazy_segment_arena \
            | tee one_g02_lazy_segment_arena.json

      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-lazy-segment-arena-${{ env.EVIDENCE_HEAD }}
          path: one_g02_lazy_segment_arena.json
          if-no-files-found: warn
