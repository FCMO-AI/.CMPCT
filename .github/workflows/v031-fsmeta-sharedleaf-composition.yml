# ci-lane: fast
name: v031 fsmeta and atomic shared-leaf composition court
on:
  push:
    branches:
      - agent/phased1-v031-fsmeta-sharedleaf-integration-20261024
    paths:
      - 'src/cmpct/reader.py'
      - 'src/cmpct/validation.py'
      - 'tests/test_v031_fsmeta_sharedleaf_composition.py'
      - 'tests/test_v031_fsmeta_structural_preflight.py'
      - '.github/workflows/v031-fsmeta-sharedleaf-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fsmeta-sharedleaf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact source and immutable inherited test identity
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p fsmeta-sharedleaf-evidence
          git rev-parse HEAD > fsmeta-sharedleaf-evidence/source.sha
          git hash-object src/cmpct/reader.py > fsmeta-sharedleaf-evidence/reader.blob
          git hash-object src/cmpct/validation.py > fsmeta-sharedleaf-evidence/validation.blob
          git hash-object tests/test_v031_fsmeta_structural_preflight.py > fsmeta-sharedleaf-evidence/fsmeta-tests.blob
          git hash-object tests/test_v031_fsmeta_sharedleaf_composition.py > fsmeta-sharedleaf-evidence/composition-tests.blob
          git hash-object tests/test_v031_atomic_shared_leaf_optin.py > fsmeta-sharedleaf-evidence/atomic-tests.blob
          test "$(git hash-object tests/test_v031_fsmeta_structural_preflight.py)" = "91acd4efe6a9f0e63538107cb4973e93013521b6"
          test "$(git hash-object tests/test_v031_fsmeta_sharedleaf_composition.py)" = "8dccaf916d632033f5b03d6329662ab0eb7795f0"
          test "$(git hash-object tests/test_v031_atomic_shared_leaf_optin.py)" = "7a144568e8e5eec331ab6b80f93432aacc03c7af"
      - name: Install actual CMPCT Python and native package
        run: python -m pip install -e '.[test,audio]'
      - name: Cross-owner authenticated metadata and shared-leaf adversarial court
        run: |
          set -o pipefail
          python -m pytest -vv tests/test_v031_fsmeta_sharedleaf_composition.py 2>&1 | tee fsmeta-sharedleaf-evidence/composition-pytest.txt
      - name: Original owner regression suites unchanged
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_v031_fsmeta_structural_preflight.py \
            tests/test_v031_atomic_shared_leaf_optin.py \
            tests/test_v031_destination_hardlink_leaf_alias.py 2>&1 | tee fsmeta-sharedleaf-evidence/owner-pytest.txt
      - name: Preserve raw exact-head evidence even on negative court
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-fsmeta-sharedleaf-${{ github.sha }}
          path: fsmeta-sharedleaf-evidence/
          if-no-files-found: error
          retention-days: 90
