# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 Analytics BytePlane4 level17 transfer

on:
  push:
    branches:
      - 'agent/v030-*'
    paths:
      - 'benchmarks/v030_analytics_byteplane4_level17_transfer_referee.py'
      - 'docs/V030_ANALYTICS_BYTEPLANE4_LEVEL17_TRANSFER_MISSION_2026-09-12.md'
      - '.github/workflows/v030-analytics-byteplane4-level17-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cmpct-v030-analytics-bp4-l17-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/files
          if grep -Eq '^(benchmarks/v030_analytics_byteplane4_level17_transfer_referee\.py|docs/V030_ANALYTICS_BYTEPLANE4_LEVEL17_TRANSFER_MISSION_2026-09-12\.md|\.github/workflows/v030-analytics-byteplane4-level17-transfer\.yml)$' /tmp/files; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  byteplane4-level17-transfer:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen-corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_analytics_byteplane4_level17_transfer_referee.py
      - name: Execute fixed level17 structural crossover referee
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_analytics_byteplane4_level17_transfer_referee.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-bp4-l17-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-analytics-bp4-l17.json"
      - name: Enforce receipt integrity, not scientific victory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-analytics-bp4-l17.json').read_text())
          assert d['schema']=='cmpct-v030-analytics-byteplane4-level17-transfer-v1'
          assert d['experiment_valid'] is True and d['release_credit'] is False
          assert d['accepted_v029_bytes']==6135172
          assert set(d['modes'])=={'direct_l17','bp4_l17','direct_l19'}
          assert d['contract']['level17_predeclared_unique_non_dominated_lower_effort_point'] is True
          assert d['contract']['width4_frozen'] is True
          assert d['contract']['no_level_width_threshold_sweep'] is True
          assert d['gate']['canonical_tree_exact_all_modes'] is True
          assert d['verdict'] in {'LEVEL17_STRUCTURAL_CROSSOVER','RETIRE_LEVEL17_BYTEPLANE4_CROSSOVER'}
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-analytics-byteplane4-level17-transfer.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-analytics-bp4-l17-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-analytics-bp4-l17.json
          if-no-files-found: error
          retention-days: 90

# Research-only representation/cost crossover referee. Green means a valid receipt, not a positive hypothesis.
