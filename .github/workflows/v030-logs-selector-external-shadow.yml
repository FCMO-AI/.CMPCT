# ci-lane: deep
name: CMPCT v0.30 logs selector external shadow

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_release_product_logs_candidate.py'
      - 'experiments/entropygraph_v030_release_product.py'
      - 'experiments/entropygraph_v030_logs_inverse_profile*.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'benchmarks/v030_logs_selector_external_shadow.py'
      - 'benchmarks/v030_logs_prefilter_reuse_abba.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'benchmarks/v030_external_competitors_canonical.py'
      - 'tests/test_v030_logs_selector_candidate.py'
      - '.github/workflows/v030-logs-selector-external-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-logs-selector-external-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  logs-prefilter-reuse-abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Verify exact evidence head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install product and frozen-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Run exact full-build prefilter ownership ABBA
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_prefilter_reuse_abba.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-prefilter-reuse-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-prefilter-reuse.json"
      - name: Enforce claim boundary and exact identity
        if: always()
        run: |
          test -f benchmark-artifacts/v030-logs-prefilter-reuse.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-logs-prefilter-reuse.json').read_text())
          assert d['schema']=='cmpct-v030-logs-prefilter-reuse-abba-v1'
          assert d['promotion_gate']['exact_product_identity'] is True
          assert d['promotion_gate']['candidate_real_prefilter_scans_exactly_one'] is True
          assert d['claim_boundary'].startswith('A/B ownership oracle only')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-logs-prefilter-reuse-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-prefilter-reuse.json
          if-no-files-found: warn
          retention-days: 90

  logs-selector-external-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}

      - name: Verify exact evidence head
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install product, frozen corpus and external compressors
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd p7zip-full zpaq gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile and test candidate facade
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_product_logs_candidate.py \
            benchmarks/v030_logs_selector_external_shadow.py
          python -m pytest -q tests/test_v030_logs_selector_candidate.py

      - name: Run exact all-15 external selector shadow
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_logs_selector_external_shadow.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-selector-external-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-logs-selector-external.json"

      - name: Independently enforce material selector advance
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('benchmark-artifacts/v030-logs-selector-external.json')
          assert path.is_file(), 'logs selector external receipt missing'
          d=json.loads(path.read_text())
          p=d['candidate_promotion_gate']
          f=d['candidate_frontier']
          assert p['exact_workload_count'] is True
          assert p['all_cmpct_trees_verified'] is True
          assert p['only_logs_row_terminalized'] is True
          assert p['logs_is_strict_four_way_win'] is True
          assert p['zip_size_frontier_preserved'] is True
          assert p['zstd_size_frontier_materially_advances'] is True
          assert p['full_four_way_frontier_materially_advances'] is True
          assert f['zip_size_wins']==15
          assert f['zstd_size_wins']>=7
          assert f['full_four_way_wins']>=4
          assert f['terminal_logs_rows']==['neutral_hostile_v1/05_logs_and_telemetry']
          assert p['passed'] is True
          PY

      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-logs-selector-external-shadow.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-logs-selector-external-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-logs-selector-external.json
          if-no-files-found: error
          retention-days: 90

# This is promotion evidence, not a replacement release gate. The canonical external authority remains red until
# all 15 workloads strictly beat both ZIP and solid Zstd-19 in complete size and creation wall-clock. This shadow
# may only demonstrate that the measured, benchmark-name-independent logs selector advances that unchanged frontier.
