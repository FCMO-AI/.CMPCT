# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 capped token dependency certificate
on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_capped_token_dependency_certificate.py'
      - '.github/workflows/v030-r4-capped-token-certificate.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}
concurrency:
  group: cmpct-v030-r4-capped-token-certificate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  capped-token-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r4_capped_token_dependency_certificate.py
      - name: Run bounded token certificate referee
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_capped_token_dependency_certificate.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-capped-token-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-capped-token.json"
          python - <<'PY'
          import json, os
          d=json.load(open('benchmark-artifacts/v030-r4-capped-token.json'))
          assert d['schema']=='cmpct-v030-r4-capped-token-dependency-certificate-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD']
          c=d['contract']
          assert c['diagnostic_only'] and not c['release_credit'] and c['frozen_8x_limit']
          assert not c['candidate_retains_per_decoded_byte_parent_graph']
          assert c['exact_parent_graph_used_only_as_referee'] and not c['product_admission_authorized']
          print(json.dumps({'summary':d['summary'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-capped-token-certificate.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-capped-token-certificate-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-capped-token.json
          if-no-files-found: error
          retention-days: 90
# Green means the referee completed. Scientific PASS/FAIL lives in the artifact hypothesis.
