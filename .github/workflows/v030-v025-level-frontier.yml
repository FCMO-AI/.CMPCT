# ci-lane: deep
name: CMPCT v0.30 v0.25 level frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_v025_level_frontier_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v*.py'
      - 'experiments/entropygraph_v025.py'
      - '.github/workflows/v030-v025-level-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-v025-level-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  v025-level-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen-corpus and comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx

      - name: Compile exact level-frontier oracle
        run: python -m py_compile benchmarks/v030_v025_level_frontier_oracle.py experiments/entropygraph_v025.py

      - name: Measure verified CMPNX5 compression-effort frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_v025_level_frontier_oracle.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-v025-level-frontier-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-v025-level-frontier.json"

      - name: Independently validate measurement integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-v025-level-frontier.json').read_text())
          assert d['schema']=='cmpct-v030-v025-level-frontier-v1'
          assert d['targets']==['02_office_workspace','04_analytics_and_database']
          assert d['levels']==[1,3,6,9,12,15,19]
          assert d['rounds']==3
          assert len(d['rows'])==2
          for row in d['rows']:
              assert len(row['levels'])==7
              assert all(len(level['raw_verified_create_s'])==3 for level in row['levels'])
              assert len(row['comparators']['zip']['raw_create_s'])==3
              assert len(row['comparators']['zstd19']['raw_create_s'])==3
              # Level 19 must reproduce the historical strength lane's ratio direction.
              l19=next(level for level in row['levels'] if level['level_cap']==19)
              assert l19['strict']['smaller_than_zip'] is True
              assert l19['strict']['smaller_than_zstd19'] is True
          assert d['measurement_gate']['passed'] is True
          PY

      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-v025-level-frontier.yml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-v025-level-frontier-${{ github.sha }}
          path: benchmark-artifacts/v030-v025-level-frontier.json
          if-no-files-found: warn
          retention-days: 90

# This lane searches for a Pareto point; it cannot promote CMPNX5 or relax the v0.30 contract. A four-way result
# is only a productization target for a bounded canonical r25 representation with full portability/integrity parity.
