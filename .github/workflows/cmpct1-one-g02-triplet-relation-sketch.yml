name: CMPCT1 ONE-G0.2 triplet relation sketch
on:
  push:
    branches: [research/cmpct1]
    paths: &paths
      - 'benchmarks/one/one_g02_triplet_relation_sketch.py'
      - 'tests/one/test_triplet_relation_sketch.py'
      - 'docs/one/prereg/ONE_G02_TRIPLET_RELATION_SKETCH_PREREG_2026-09-08.md'
      - 'docs/one/evidence/ONE_G02_TRIPLET_RELATION_SKETCH_HOSTILE_REVIEW_2026-09-08.md'
      - '.github/workflows/cmpct1-one-g02-triplet-relation-sketch.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions: {contents: read}
jobs:
  triplet-relation-sketch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {EVIDENCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - name: Bind exact source and frozen law
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python - <<'PY'
          import benchmarks.one.one_g02_triplet_relation_sketch as b
          assert b.REPETITIONS==21 and b.PROBES==3
          assert (b.GLOBAL_NUM,b.GLOBAL_DEN)==(7,8)
          assert b.MAX_MEDIAN_OVERHEAD==1.20 and b.MAX_ROW_OVERHEAD==1.35
          assert b.MIN_1MIB_THROUGHPUT_MIB_S==250.0
          assert len(b.SIZES)*len(b.FAMILIES)==24
          PY
      - run: python -m pytest -q tests/one/test_triplet_relation_sketch.py
      - name: Run frozen 24-cell falsifier
        run: |
          set -o pipefail
          python -m benchmarks.one.one_g02_triplet_relation_sketch | tee one_g02_triplet_relation_sketch.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "one-g02-triplet-relation-sketch-${{ env.EVIDENCE_HEAD }}"
          path: one_g02_triplet_relation_sketch.json
          if-no-files-found: warn
