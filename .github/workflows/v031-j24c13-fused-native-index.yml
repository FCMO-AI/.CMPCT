# ci-lane: fast
# J24C13: source-exact installed ABI3 fusion, unchanged release gates.
name: CMPCT v031 J24C13 fused native range checkpoints
on:
  push:
    branches:
      - agent/phased3-v031-j24c13-fused-abi3-range-checkpoints-20261028
  pull_request:
    paths:
      - 'src/cmpct/_fastscan_abi3.c'
      - 'src/cmpct/_chunk_admission.py'
      - 'src/cmpct/reader.py'
      - 'tests/test_j24c13_fused_native_checkpoints.py'
      - 'research/j24c13_*'
      - '.github/workflows/v031-j24c13-fused-native-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j24c13-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-installed:
    name: Installed ABI3 fresh-process court - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24C08_EXPECT_NATIVE: '1'
      CMPCT_J24C13_EXPECT_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build actual noneditable wheel with stable ABI3
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel pytest
          python -m pip wheel --no-deps . -w dist
          python -m pip install dist/*.whl
          mkdir -p receipts
          python - <<'PY'
          import cmpct.reader, cmpct._chunk_admission as a
          from pathlib import Path
          p=Path(cmpct.reader.__file__).resolve()
          assert 'site-packages' in p.parts or 'dist-packages' in p.parts,p
          assert callable(a._scan_refs) and callable(a._scan_refs_index)
          print("J24C13_NATIVE_WHEEL_REAL_PACKAGE_PASS", p)
          PY
      - name: Exact signed archive tests with full native index and inherited security
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q tests/test_j24c13_fused_native_checkpoints.py tests/test_j24c08_optional_abi3.py tests/test_o215_fixed_chunk_admission.py tests/test_reader_unsupported_blob_bits.py tests/test_reader_deflate_export_custody.py 2>&1 | tee receipts/pytest-cp311.log
      - name: Fresh-process installed A/B on Python 3.11
        shell: bash
        run: |
          python research/j24c13_fused_installed_abba.py --output receipts/j24c13-cp311.json --repetitions 3
          python research/j24c13_independent_receipt_audit.py --input receipts/j24c13-cp311.json --output receipts/j24c13-audit-cp311.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reuse same cp311-abi3 wheel on Python 3.13
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python - <<'PY'
          import cmpct.reader, cmpct._chunk_admission as a
          from pathlib import Path
          p=Path(cmpct.reader.__file__).resolve()
          assert 'site-packages' in p.parts or 'dist-packages' in p.parts,p
          assert callable(a._scan_refs) and callable(a._scan_refs_index)
          print("J24C13_CP313_STABLE_ABI_WHEEL_PASS",p)
          PY
          set -o pipefail
          python -m pytest --noconftest -q tests/test_j24c13_fused_native_checkpoints.py tests/test_j24c08_optional_abi3.py tests/test_o215_fixed_chunk_admission.py 2>&1 | tee receipts/pytest-cp313.log
          python research/j24c13_fused_installed_abba.py --output receipts/j24c13-cp313.json --repetitions 3
          python research/j24c13_independent_receipt_audit.py --input receipts/j24c13-cp313.json --output receipts/j24c13-audit-cp313.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c13-fused-native-${{ matrix.os }}-${{ env.EVIDENCE_SHA }}
          path: |
            receipts/
            dist/
          if-no-files-found: warn

  strict-python310:
    name: Strict Python 3.10 fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CMPCT_J24C08_EXPECT_NATIVE: '0'
      CMPCT_J24C13_EXPECT_NATIVE: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build without ABI3; verify unchanged strict Python fallback
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel pytest
          python -m pip wheel --no-deps . -w dist
          python -m pip install dist/*.whl
          mkdir -p receipts
          python - <<'PY'
          import cmpct._chunk_admission as a
          assert a._scan_refs is None and a._scan_refs_index is None
          print("J24C13_STRICT_PYTHON310_FALLBACK")
          PY
          set -o pipefail
          python -m pytest --noconftest -q tests/test_j24c13_fused_native_checkpoints.py tests/test_j24c08_optional_abi3.py tests/test_o215_fixed_chunk_admission.py tests/test_reader_unsupported_blob_bits.py 2>&1 | tee receipts/pytest-cp310.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j24c13-python310-fallback-${{ env.EVIDENCE_SHA }}
          path: |
            receipts/
            dist/
          if-no-files-found: warn
