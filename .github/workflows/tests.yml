name: CMPCT tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true

      - name: Bind regression evidence to exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard public project surface
        run: python tools/check_public_surface.py

      - name: Install reference implementation and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'

      - name: Run regression suite
        run: |
          mkdir -p test-artifacts
          set -o pipefail
          python -m pytest -q 2>&1 | tee test-artifacts/pytest.txt

      - name: Retain regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ env.EVIDENCE_HEAD }}
          path: test-artifacts/pytest.txt
          if-no-files-found: error

      - name: Smoke-test CLI surface
        run: python -m cmpct --help

# Footnote: correctness and disclosure safety are both release prerequisites. Audio extras are
# installed here because codec-2 WAV/FLAC is part of revision 24 and its fixed conformance archive
# must be decoded in CI rather than silently skipped when optional runtime codecs are absent.
# This workflow does not turn shared-runner timing into marketing evidence; reproducible performance
# claims still require the benchmark provenance/semantic discipline documented under docs/BENCHMARKS.md.
# The retained pytest stream is diagnostic evidence only; `set -o pipefail` preserves the real pytest
# exit code so logging can never convert a red suite into a green one. Pull-request runs deliberately
# execute the exact PR head rather than GitHub's synthetic merge commit so a green artifact belongs to
# the same source fingerprint consumed by the v0.30 release authority.
