# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: J24P15 Research physical 7-Zip 26.03 vs 26.05 delta

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/j24p15-upstream-7zip-delta.yml'
      - 'research/j24p15_upstream_7zip_delta.py'
      - 'research/j24p15_upstream_referee.py'
      - 'docs/v031-research/2026-10-31-j24p15-7zip-2605-delta-prereg.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-24.04
    concurrency:
      group: j24p15-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Verify source and latest-HEAD impact
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/j24p15-upstream-7zip-delta\.yml|research/j24p15_upstream_7zip_delta\.py|research/j24p15_upstream_referee\.py|docs/v031-research/2026-10-31-j24p15-7zip-2605-delta-prereg\.md)$'; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
          fi

  comparator-delta-court:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: j24p15-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bind exact head and static syntax; no product benchmark modifications
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile research/j24p15_upstream_7zip_delta.py research/j24p15_upstream_referee.py
          python tools/check_ci_topology.py .github/workflows/j24p15-upstream-7zip-delta.yml

      - name: Acquire and authenticate both original upstream GitHub provider archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts/assets benchmark-artifacts/court /tmp/cmpct-upstream/26.03 /tmp/cmpct-upstream/26.05 /tmp/cmpct-upstream/bin
          curl -fL --retry 3 --retry-all-errors -o benchmark-artifacts/assets/7z2603-linux-x64.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz
          echo 'dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695  benchmark-artifacts/assets/7z2603-linux-x64.tar.xz' | sha256sum -c -
          curl -fL --retry 3 --retry-all-errors -o benchmark-artifacts/assets/7z2605-linux-x64.tar.xz https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
          echo '22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e  benchmark-artifacts/assets/7z2605-linux-x64.tar.xz' | sha256sum -c -
          tar -xJf benchmark-artifacts/assets/7z2603-linux-x64.tar.xz -C /tmp/cmpct-upstream/26.03
          tar -xJf benchmark-artifacts/assets/7z2605-linux-x64.tar.xz -C /tmp/cmpct-upstream/26.05
          P03="$(find /tmp/cmpct-upstream/26.03 -type f -name 7zz -print -quit)"
          P05="$(find /tmp/cmpct-upstream/26.05 -type f -name 7zz -print -quit)"
          test -n "$P03" && test -n "$P05"
          install -m 0755 "$P03" /tmp/cmpct-upstream/bin/7z-2603
          install -m 0755 "$P05" /tmp/cmpct-upstream/bin/7z-2605
          /tmp/cmpct-upstream/bin/7z-2603 i > benchmark-artifacts/assets/version-2603.txt
          /tmp/cmpct-upstream/bin/7z-2605 i > benchmark-artifacts/assets/version-2605.txt
          grep -Eq '7-Zip.*26\.03' benchmark-artifacts/assets/version-2603.txt
          grep -Eq '7-Zip.*26\.05' benchmark-artifacts/assets/version-2605.txt
          printf 'original source SHA=%s\n' "$EVIDENCE_HEAD" > benchmark-artifacts/assets/source-head.txt
          sha256sum /tmp/cmpct-upstream/bin/7z-2603 /tmp/cmpct-upstream/bin/7z-2605 > benchmark-artifacts/assets/executable-sha256.txt

      - name: Same-host, same-input source-bound ABBA physical experiment
        run: |
          set -euo pipefail
          python research/j24p15_upstream_7zip_delta.py \
            --old /tmp/cmpct-upstream/bin/7z-2603 \
            --new /tmp/cmpct-upstream/bin/7z-2605 \
            --source-head "$EVIDENCE_HEAD" \
            --work-root "$RUNNER_TEMP/j24p15-physical-court" \
            --out benchmark-artifacts/court/raw.json

      - name: Independent raw/physical referee and six forged-receipt rejections
        run: |
          set -euo pipefail
          python research/j24p15_upstream_referee.py \
            --receipt benchmark-artifacts/court/raw.json \
            --work-root "$RUNNER_TEMP/j24p15-physical-court" \
            --source-head "$EVIDENCE_HEAD" \
            --out benchmark-artifacts/court/independent-referee.json

      - name: Retain physical source trees, every original 7z archive and extraction for detached audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          if test -d "$RUNNER_TEMP/j24p15-physical-court"; then
            cp -a "$RUNNER_TEMP/j24p15-physical-court" benchmark-artifacts/physical-court
          fi

      - name: Preserve original upstream assets, SHA, raw results and referee
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: j24p15-original-26x-assets-and-physical-receipts-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/
          if-no-files-found: warn
          retention-days: 90
