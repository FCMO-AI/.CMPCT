# ci-lane: deep
name: CMPCT v0.30 C25CC01 co-located semantic floor

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_c25cc01_colocated_semantic_floor_oracle.py'
      - 'benchmarks/v030_c25cc01_distributed_file_table_oracle.py'
      - 'benchmarks/v030_c25cc01_locality_pack_strategy_oracle.py'
      - 'benchmarks/v030_c25cc01_locality_safe_pack_oracle.py'
      - 'benchmarks/v030_r24_compact_control_oracle.py'
      - 'experiments/entropygraph_v030_r24_compact_control_profile.py'
      - '.github/workflows/v030-c25cc01-colocated-semantic-floor.yml'
  workflow_dispatch:

concurrency:
  group: v030-c25cc01-colocated-semantic-floor-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  optimistic-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile optimistic floor oracle
        run: python -m py_compile benchmarks/v030_c25cc01_colocated_semantic_floor_oracle.py
      - name: Measure semantic and zero-blob-header floors
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_c25cc01_colocated_semantic_floor_oracle \
            --work-root benchmark-artifacts/v030-c25cc01-colocated-floor-work \
            --output benchmark-artifacts/v030-c25cc01-colocated-floor.json
      - name: Enforce exact lower-bound custody
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-c25cc01-colocated-floor.json').read_text())
          assert d['schema']=='cmpct-v030-c25cc01-colocated-semantic-floor-v2'
          assert d['candidate_head']==os.environ['EVIDENCE_HEAD']
          assert d['gate']['exact_baseline_accounting'] is True
          assert d['gate']['exact_file_semantic_reconstruction'] is True
          assert d['gate']['current_locality_within_8x'] is True
          assert d['gate']['experiment_valid'] is True
          assert d['gate']['release_credit'] is False
          f=d['optimistic_colocated_floor']
          assert f['moved_pack_rows'] > 0
          assert f['local_framing_bytes_charged'] == 0
          assert f['local_descriptor_bytes_charged'] == 0
          h=d['impossible_zero_blob_header_floor']
          assert d['baseline']['blob_header_bytes_each'] == 64
          assert d['baseline']['blob_record_count'] > 0
          assert h['blob_headers_charged_bytes'] == 0
          assert h['blob_header_bytes_removed'] == d['baseline']['blob_record_count'] * 64
          assert d['minimum_additional_physical_shrink_for_strict_zstd_win_bytes'] >= 0
          assert h['minimum_additional_payload_shrink_for_strict_zstd_win_bytes'] >= 0
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-c25cc01-colocated-semantic-floor.yml
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-c25cc01-colocated-semantic-floor-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-c25cc01-colocated-floor.json
          if-no-files-found: error
          retention-days: 90

# Research-only optimistic impossibility floors. No reader, selector, recovery or release credit.
