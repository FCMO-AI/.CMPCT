name: CMPCT v0.30 release policy decomposition
on:
  pull_request:
    paths:
      - 'experiments/v030_incremental_release_policy_decomposition.py'
      - '.github/workflows/v030-release-policy-decomposition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Execute decomposition
        run: |
          mkdir -p evidence-artifacts
          python -m experiments.v030_incremental_release_policy_decomposition | tee evidence-artifacts/decomposition.json
      - name: Default micro max reaches r24 floor
        id: micro
        continue-on-error: true
        run: python -c "import json; d=json.load(open('evidence-artifacts/decomposition.json')); r=next(x for x in d['rows'] if x['name']=='default_micro_max_only'); assert r['delta_vs_r24_bytes']<=0, r['delta_vs_r24_bytes']"
      - name: Disabling medium binary reaches r24 floor
        id: medium
        continue-on-error: true
        run: python -c "import json; d=json.load(open('evidence-artifacts/decomposition.json')); r=next(x for x in d['rows'] if x['name']=='disable_medium_binary_only'); assert r['delta_vs_r24_bytes']<=0, r['delta_vs_r24_bytes']"
      - name: Medium-binary-off preserves conservative 8x VZIP locality
        id: medium-locality
        continue-on-error: true
        run: python -c "import json; d=json.load(open('evidence-artifacts/decomposition.json')); r=next(x for x in d['rows'] if x['name']=='disable_medium_binary_only'); assert r['vzip_locality']['within_8x'], r['vzip_locality']['max_decoded_context_amplification']"
      - name: Mature micro max and medium defaults reach r24 floor
        id: both
        continue-on-error: true
        run: python -c "import json; d=json.load(open('evidence-artifacts/decomposition.json')); r=next(x for x in d['rows'] if x['name']=='mature_micro_and_medium_defaults'); assert r['delta_vs_r24_bytes']<=0, r['delta_vs_r24_bytes']"
      - name: All mature pack defaults reach r24 floor
        id: all
        continue-on-error: true
        run: python -c "import json; d=json.load(open('evidence-artifacts/decomposition.json')); r=next(x for x in d['rows'] if x['name']=='all_mature_pack_defaults'); assert r['delta_vs_r24_bytes']<=0, r['delta_vs_r24_bytes']"
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "v030-release-policy-decomposition-${{ github.event.pull_request.head.sha || github.sha }}", path: evidence-artifacts/decomposition.json, if-no-files-found: error}
      - name: Enforce default micro arm
        if: always()
        run: test '${{ steps.micro.outcome }}' = success
      - name: Enforce medium-binary-off arm
        if: always()
        run: test '${{ steps.medium.outcome }}' = success
      - name: Enforce medium-binary-off locality
        if: always()
        run: test '${{ steps.medium-locality.outcome }}' = success
      - name: Enforce both-defaults arm
        if: always()
        run: test '${{ steps.both.outcome }}' = success
      - name: Enforce all-mature-pack-defaults arm
        if: always()
        run: test '${{ steps.all.outcome }}' = success
