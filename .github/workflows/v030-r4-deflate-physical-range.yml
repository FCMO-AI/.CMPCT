# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: preserve-running-exact-receipt
name: CMPCT v0.30 R4 physical DEFLATE range oracle

on:
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_r4_deflate_physical_range_oracle.py'
      - '.github/workflows/v030-r4-deflate-physical-range.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_r4_deflate_physical_range_oracle.py'
      - '.github/workflows/v030-r4-deflate-physical-range.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: cmpct-v030-r4-deflate-physical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_r4_deflate_physical_range_oracle\.py|\.github/workflows/v030-r4-deflate-physical-range\.yml)$' /tmp/latest-head-files.txt; then echo 'run_deep=true' >> "$GITHUB_OUTPUT"; else echo 'run_deep=false' >> "$GITHUB_OUTPUT"; fi

  physical-range:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact corpus dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - run: python -m py_compile benchmarks/v030_r4_deflate_physical_range_oracle.py
      - name: Run physical compressed-range oracle
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r4_deflate_physical_range_oracle.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-physical-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-r4-physical.json"
      - name: Enforce lower-bound evidence contract
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('benchmark-artifacts/v030-r4-physical.json'))
          assert d['schema']=='cmpct-v030-r4-deflate-physical-range-oracle-v1'
          assert d['source_commit']==os.environ['EVIDENCE_HEAD'] and d['parser']['exact_raw_match']
          c=d['contract']; assert c['diagnostic_only'] and not c['release_credit'] and c['lower_bound_only'] and c['no_threshold_sweep'] and c['no_request_size_sweep']
          print(json.dumps({'member':d['member'],'parser':d['parser'],'physical_dependency':d['physical_dependency'],'economics':d['economics'],'hypothesis':d['hypothesis']},sort_keys=True))
          PY
      - run: python tools/check_ci_topology.py .github/workflows/v030-r4-deflate-physical-range.yml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-r4-deflate-physical-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-r4-physical.json
          if-no-files-found: error
          retention-days: 90

# Physical payload lower bound only. Green means receipt integrity, never product promotion.
