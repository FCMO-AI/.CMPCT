# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 EG08 policy distillation

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct*.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill*.py'
      - '.github/workflows/v030-federated-compact-framing-v8-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-eg08-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(experiments/entropygraph_v030_federated_(compact_framing_candidate_v8|embedded_fs_candidate_v7)\.py|benchmarks/v030_federated_compact_framing_v8_(direct[^/]*|policy_distill[^/]*)\.py|\.github/workflows/v030-federated-compact-framing-v8-policy\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect EG08 policy distillation; skipping the 3-hour replay.'
          fi

  policy-distillation:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile policy-distillation surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v4.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v5.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill_v2.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill_v3.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill_v4.py
      - name: Preserve compact-framing integrity and recovery regressions
        run: |
          python -m pytest -q \
            tests/test_v030_federated_compact_framing_v8.py \
            tests/test_v030_federated_fused_verify.py
      - name: Run parallel identity-free feature policy frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_compact_framing_v8_policy_distill_v4.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v4-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v4.json"
      - name: Independently enforce generic policy, exact bytes and strict promotion law
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-policy-v4.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-policy-distillation-v4'
          assert d['candidate']=='C25EG08'
          assert d['accepted_v029_bytes']==5954026
          assert d['experiment_valid'] is True
          assert d['release_credit'] is False
          assert d['policy_inputs']==['raw_bytes','level1_ratio','entropy_bits_per_byte','zero_fraction','printable_fraction']
          assert set(d['forbidden_policy_inputs'])=={'sha256','path','filename','workload_label','benchmark_name'}
          assert d['predecessor_v3_size_green_speed_red'] is True
          p=d['selected_policy']; assert set(p)=={'rules','overlap_resolution'}; assert p['overlap_resolution']=='max_level'
          assert 1 <= len(p['rules']) <= 4
          allowed_features=set(d['policy_inputs'])
          for rule in p['rules']:
              assert set(rule)=={'feature','operator','threshold','level'}
              assert rule['feature'] in allowed_features
              assert rule['operator'] in {'<=','>='}
              assert int(rule['level']) in {12,15,19,22}
          sf=d['search_family']; assert sf['max_rules']==4; assert sf['deduplicated_atomic_rules']>=1; assert sf['clearing_states']>=1
          schedule=d['schedule']; assert schedule['type']=='bounded-parallel-per-pack-policy-and-final-compression'
          assert int(schedule['max_workers'])==8
          assert schedule['level1_feature_compression_counted'] is True
          assert schedule['high_effort_compression_counted'] is True
          assert schedule['serial_reference_untimed'] is True
          assert schedule['archive_identity_required'] is True
          m=d['measured_candidate']; c=d['comparators']; s=d['strict']
          assert int(m['archive_bytes']) == int(m['projected_archive_bytes'])
          assert int(m['archive_bytes']) < 5954026
          assert int(m['archive_bytes']) < int(c['zip']['archive_bytes'])
          assert int(m['archive_bytes']) < int(c['zstd19']['archive_bytes'])
          assert 1 <= int(m['workers']) <= 8
          assert float(m['max_member_read_amplification']) <= 8.0
          assert int(m['max_decode_unit_bytes']) <= 8*1024*1024
          assert m['exact_bytes_vs_serial_reference'] is True
          for key in ('content_identity_not_policy_input','exact_size_projection','exact_serial_parallel_archive_identity','same_selected_level_vector','rule_count_within_bound'):
              assert s[key] is True
          expected_promotion = bool(
              s['passed']
              and s['verified_create_beats_zip']
              and s['verified_create_beats_zstd19']
              and float(m['median_verified_create_s']) < float(c['zip']['median_create_s'])
              and float(m['median_verified_create_s']) < float(c['zstd19']['median_create_s'])
          )
          assert d['promotion_signal'] is expected_promotion
          Path('benchmark-artifacts/v030-eg08-policy-v4-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-federated-compact-framing-v8-policy.yml
      - name: Upload exact policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-policy-v4-${{ env.EVIDENCE_HEAD }}
          path: |
            benchmark-artifacts/v030-eg08-policy-v4.json
            benchmark-artifacts/v030-eg08-policy-v4-candidate.txt
          if-no-files-found: warn
          retention-days: 90

# v1/v2 remain negative evidence. v3 found a genuine identity-free size policy but proved serial execution far too
# slow. v4 keeps that same bounded feature/rule family and changes scheduling only. Exactness, locality and the frozen
# size floors remain mandatory for a valid experiment; the unchanged strict four-way size+creation law alone turns
# promotion_signal on. Valid ZIP-speed losses are preserved as negative research evidence with release_credit=false,
# never as selector/native/Android/release authority.
