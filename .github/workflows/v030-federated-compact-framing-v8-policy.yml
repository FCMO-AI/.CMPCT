# ci-lane: deep
name: CMPCT v0.30 EG08 policy distillation

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py'
      - 'experiments/entropygraph_v030_federated_embedded_fs_candidate_v7.py'
      - 'benchmarks/v030_federated_compact_framing_v8_direct*.py'
      - 'benchmarks/v030_federated_compact_framing_v8_policy_distill*.py'
      - '.github/workflows/v030-federated-compact-framing-v8-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-eg08-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  policy-distillation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic corpus and competitor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile policy-distillation surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_federated_compact_framing_candidate_v8.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v4.py \
            benchmarks/v030_federated_compact_framing_v8_direct_v5.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill.py \
            benchmarks/v030_federated_compact_framing_v8_policy_distill_v2.py
      - name: Preserve compact-framing integrity and recovery regressions
        run: |
          python -m pytest -q \
            tests/test_v030_federated_compact_framing_v8.py \
            tests/test_v030_federated_fused_verify.py
      - name: Run two-region content-agnostic office effort policy frontier
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_federated_compact_framing_v8_policy_distill_v2.py \
            --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v2-work" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-eg08-policy-v2.json"
      - name: Independently enforce no frozen-identity policy and four-way win
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-eg08-policy-v2.json').read_text())
          assert d['schema']=='cmpct-v030-eg08-policy-distillation-v2'
          assert d['candidate']=='C25EG08'
          assert d['accepted_v029_bytes']==5954026
          assert d['policy_inputs']==['raw_bytes','level1_ratio']
          assert set(d['forbidden_policy_inputs'])=={'sha256','path','workload_label','benchmark_name'}
          assert d['predecessor_single_rule_family_falsified'] is True
          p=d['selected_policy']
          assert set(p)=={'rules','overlap_resolution'}
          assert p['overlap_resolution']=='max_level'
          assert 1 <= len(p['rules']) <= 2
          for rule in p['rules']:
              assert set(rule)=={'min_raw_bytes','max_raw_bytes_exclusive','max_level1_ratio','level'}
              assert int(rule['level']) in {12,15,19,22}
          sf=d['search_family']
          assert sf['max_rules']==2
          assert sf['candidate_policies_clearing_size_floors']>=1
          m=d['measured_candidate']; c=d['comparators']; s=d['strict']
          assert int(m['archive_bytes']) == int(m['projected_archive_bytes'])
          assert int(m['archive_bytes']) < 5954026
          assert int(m['archive_bytes']) < int(c['zip']['archive_bytes'])
          assert int(m['archive_bytes']) < int(c['zstd19']['archive_bytes'])
          assert float(m['median_verified_create_s']) < float(c['zip']['median_create_s'])
          assert float(m['median_verified_create_s']) < float(c['zstd19']['median_create_s'])
          assert float(m['max_member_read_amplification']) <= 8.0
          assert int(m['max_decode_unit_bytes']) <= 8*1024*1024
          assert s['content_hash_not_policy_input'] is True
          assert s['exact_size_projection'] is True
          assert s['passed'] is True
          PY
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-federated-compact-framing-v8-policy.yml
      - name: Upload exact policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-eg08-policy-v2-${{ github.sha }}
          path: benchmark-artifacts/v030-eg08-policy-v2.json
          if-no-files-found: warn
          retention-days: 90

# v1's single monotone threshold family is retained as negative evidence. v2 expands only to two generic regions
# over raw pack size and level-1 ratio; frozen pack hashes, paths and workload identity remain forbidden. This lane
# is still promotion-incomplete: all-15/adversarial generalization, production selector ownership, native/Android
# parity and strict release authority remain mandatory.
