# ci-lane: fast
name: v0.31 J24B06 extracted-budget fail-closed product candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/cmpct/reader.py'
      - 'tests/test_j24b06_signed_budget.py'
      - '.github/workflows/v031-j24b06-budget-guard.yml'
      - 'docs/v031-research/2026-10-28-j24b06-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-installed-regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      J24B06_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          git rev-parse HEAD | tee source-head.txt
          test "$(git rev-parse HEAD)" = "$J24B06_CANDIDATE_HEAD"
          git status --short
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual candidate wheel and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel
          python -m pip install . pytest
      - name: Execute signed symlink/hardlink guard and legitimate controls
        shell: bash
        run: |
          python -m pytest -q tests/test_j24b06_signed_budget.py
      - name: Persist source identity even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24b06-guard-${{ matrix.os }}-${{ github.run_id }}
          path: source-head.txt
          if-no-files-found: warn
          retention-days: 30
