# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
# ci-cancel-policy: split-classifier-preserve-receipts
name: CMPCT v0.30 Office v0.25 r25 framing oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_office_v025_r25_framing_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v6.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - '.github/workflows/v030-office-v025-r25-framing-oracle.yml'
  push:
    branches: [agent/v030-authoritative-integration]
    paths:
      - 'benchmarks/v030_office_v025_r25_framing_oracle.py'
      - 'benchmarks/neutral_hostile_corpus_v1.py'
      - 'benchmarks/neutral_hostile_determinism_repair_v6.py'
      - 'experiments/entropygraph_v025.py'
      - 'experiments/entropygraph_v030_canonical_final_impl.py'
      - 'experiments/entropygraph_v030_product_fs.py'
      - 'experiments/entropygraph_v030_r25_manifest_admission.py'
      - '.github/workflows/v030-office-v025-r25-framing-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # pull_request github.sha is GitHub's synthetic merge checkout, not the candidate source. Bind evidence to the
  # actual PR head; push/dispatch naturally fall back to github.sha.
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cmpct-office-v025-r25-framing-classifier-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_office_v025_r25_framing_oracle\.py|benchmarks/neutral_hostile_corpus_v1\.py|benchmarks/neutral_hostile_determinism_repair_v6\.py|experiments/entropygraph_v025\.py|experiments/entropygraph_v030_canonical_final_impl\.py|experiments/entropygraph_v030_product_fs\.py|experiments/entropygraph_v030_r25_manifest_admission\.py|\.github/workflows/v030-office-v025-r25-framing-oracle\.yml)$' /tmp/latest-head-files.txt; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  oracle:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: cmpct-office-v025-r25-framing-receipt-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exact product and pinned corpus dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pillow==12.3.0 reportlab==5.0.0 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 numpy==2.4.6
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libzstd1
      - name: Run full-charge framing oracle
        env:
          PYTHONPATH: .
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_office_v025_r25_framing_oracle.py | tee benchmark-artifacts/v030-office-v025-r25-framing-oracle.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/v030-office-v025-r25-framing-oracle.json').read_text())
          assert d['schema']=='cmpct-v030-office-v025-r25-framing-oracle-v1'
          assert d['release_credit'] is False
          assert d['control_v025']['strong_verify']['ok'] is True
          assert d['v025_on_r25_prepared_tree']['strong_verify']['ok'] is True
          assert d['control_v025']['archive_bytes'] > 0
          assert d['v025_on_r25_prepared_tree']['archive_bytes'] > 0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v030-office-v025-r25-framing-${{ env.EVIDENCE_HEAD }}
          path: benchmark-artifacts/v030-office-v025-r25-framing-oracle.json
          if-no-files-found: error
          retention-days: 90
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-office-v025-r25-framing-oracle.yml

# Research-only causal/oracle evidence. Green means receipt integrity, never release credit.
# The classifier is disposable routing work; once admitted, the exact-source causal receipt is preserved so
# unrelated integration commits cannot destroy the result before the framing hypothesis is decided.
