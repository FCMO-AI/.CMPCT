name: CMPCT v0.30 Agent-00 isolated native hygiene trigger
# ci-lane: deep

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

concurrency:
  group: cmpct-v030-agent00-native-hygiene-trigger
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 66
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v030-authoritative-integration
      - name: Apply exact one-shot source repair
        run: python tools/v030_agent00_native_hygiene_patch.py
      - name: Normalize and prove the repaired native crate
        working-directory: native/cmpct-portable
        run: |
          cargo fmt --all
          cargo clippy --all-targets --message-format=short -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Persist only verified Rust changes
        shell: bash
        run: |
          rm tools/v030_agent00_native_hygiene_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/cmpct-portable/src/lib.rs native/cmpct-portable/src/format.rs native/cmpct-portable/src/canonical.rs native/cmpct-portable/src/g04.rs native/cmpct-portable/src/prefix.rs tools/v030_agent00_native_hygiene_patch.py
          git commit -m 'fix(v0.30): harden portable Rust API and lint contracts'
          git push origin HEAD:agent/v030-authoritative-integration

# Footnote: editing PR #66 is only a harmless event source because GitHub App file writes do not recursively fire
# push workflows here. The job always checks out the sole v0.30 integration branch, refuses to commit unless Rust
# formatting/lint/tests/release build all pass, and removes its temporary patch script before persisting source.
