# ci-lane: release
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 hostile mutation gate

on:
  push:
    branches:
      - agent/v030-authoritative-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-release-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.sha }}

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.impact.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: impact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          if grep -Eq '^(src/cmpct/|experiments/entropygraph_v030_(geometry_overlay_g04|geometry_overlay_g04_publish|release|release_reader|release_reader_policy|release_candidate|release_product|release_product_base)([^/]*)\.py$|tests/test_v030_(release_reader|release_reader_policy|g04_metadata_reuse|release_fuzz)\.py$|pyproject\.toml$|\.github/workflows/v030-release-fuzz\.yml$)' /tmp/latest-head-files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  release-fuzz:
    needs: impact
    if: needs.impact.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind hostile-input proof to exact candidate
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fuzz/test dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd gcc
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile promoted Python reader surface
        run: |
          python -m py_compile \
            experiments/entropygraph_v030_release_reader.py \
            experiments/entropygraph_v030_release_reader_policy.py \
            experiments/entropygraph_v030_release_candidate.py \
            experiments/entropygraph_v030_release.py

      - name: Run deterministic hostile mutation and recovery corpus
        run: |
          python -m pytest -q \
            tests/test_v030_release_reader.py \
            tests/test_v030_release_reader_policy.py \
            tests/test_v030_g04_metadata_reuse.py \
            tests/test_v030_release_fuzz.py

      - name: Public-surface guard
        if: always()
        run: python tools/check_public_surface.py
      - name: CI topology self-check
        if: always()
        run: python tools/check_ci_topology.py .github/workflows/v030-release-fuzz.yml

# Hostile-input rejection remains mandatory whenever the newest exact candidate can change its parser/recovery
# surface. Orthogonal research-only commits now skip the 45-minute lane after a cheap exact-head classifier.
