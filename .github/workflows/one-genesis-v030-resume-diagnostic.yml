# ci-lane: gate-critical
name: CMPCT1 Genesis frozen v0.30 resume diagnostic

on:
  push:
    branches:
      - research/cmpct1
    paths:
      - '.github/workflows/one-genesis-v030-resume-diagnostic.yml'
      - 'benchmarks/one/one_genesis_v030_resume_diagnostic.py'
      - 'benchmarks/one/one_genesis_historical_product_worker.py'
  pull_request:
    paths:
      - '.github/workflows/one-genesis-v030-resume-diagnostic.yml'
      - 'benchmarks/one/one_genesis_v030_resume_diagnostic.py'
      - 'benchmarks/one/one_genesis_historical_product_worker.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-one-genesis-v030-resume-diagnostic
  cancel-in-progress: false

jobs:
  v030-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      V030_SHA: f4b158a55a08b9b18b50e4e4abe4b9251048c772
      CMPCT_GENESIS_REAL_GATE_AUTHORIZED: '1'
      CMPCT_GENESIS_SOURCE_SHA: f4b158a55a08b9b18b50e4e4abe4b9251048c772
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/cmpct1

      - name: Bind diagnostic harness source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install -e '.[test]'
          # Frozen v0.30 declares this as its audio extra. The media workload exercises
          # wav/flac coding, so the gate must provision the declared Python binding too.
          python -m pip install 'soundfile>=0.12'

      - name: Materialize frozen v0.30 checkout
        run: |
          git cat-file -e "$V030_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/cmpct-v030" "$V030_SHA"
          test "$(git -C "$RUNNER_TEMP/cmpct-v030" rev-parse HEAD)" = "$V030_SHA"
          test "$(git -C "$RUNNER_TEMP/cmpct-v030" status --porcelain=v1 --untracked-files=all)" = ""

      - name: Run exact 15-workload v0.30 resume diagnostic
        run: |
          mkdir -p "$RUNNER_TEMP/genesis-v030"
          python -m benchmarks.one.one_genesis_v030_resume_diagnostic \
            --checkout "$RUNNER_TEMP/cmpct-v030" \
            --work-root "$RUNNER_TEMP/genesis-v030/workloads" \
            --output "$RUNNER_TEMP/genesis-v030/v030-raw.json" \
            --progress "$RUNNER_TEMP/genesis-v030/progress.json"

      - name: Validate completed v0.30 raw shape
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'genesis-v030'
          p = json.loads((root/'v030-raw.json').read_text())
          assert p['schema'] == 'cmpct-one-genesis-contender-raw-v1'
          assert p['contender'] == 'v0.30'
          assert p['source_sha'] == 'f4b158a55a08b9b18b50e4e4abe4b9251048c772'
          assert p['synthetic'] is False and p['production_eligible'] is True
          assert len(p['rows']) == 15
          assert p['comparisons_executed'] is False
          assert p['scoring_executed'] is False
          assert p['winner_selected'] is False
          PY

      - name: Upload v0.30 resume evidence and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-one-genesis-v030-resume-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/genesis-v030/progress.json
            ${{ runner.temp }}/genesis-v030/v030-raw.json
          if-no-files-found: warn
          retention-days: 90
