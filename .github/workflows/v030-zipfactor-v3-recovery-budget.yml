# ci-lane: deep
# ci-pr-scope: latest-head-commit-gate
name: CMPCT v0.30 ZIP-factor V3 recovery budget

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_zipfactor_v3_recovery_budget_oracle.py'
      - 'benchmarks/v030_zipfactor_recovery_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - '.github/workflows/v030-zipfactor-v3-recovery-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zipfactor-v3-recovery-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  latest-head-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - name: Bind exact head and classify only its changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/latest-head-files.txt
          cat /tmp/latest-head-files.txt
          if grep -Eq '^(benchmarks/v030_zipfactor_v3_recovery_budget_oracle\.py|benchmarks/v030_zipfactor_recovery_oracle\.py|benchmarks/v030_external_competitors\.py|experiments/entropygraph_v030_zipfactor_compact_v3\.py|\.github/workflows/v030-zipfactor-v3-recovery-budget\.yml)$' /tmp/latest-head-files.txt; then
            echo 'run_deep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_deep=false' >> "$GITHUB_OUTPUT"
            echo 'Accumulated PR paths matched, but newest exact commit does not affect the frozen recovery-budget proof.'
          fi

  recovery-budget:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - name: Bind exact candidate head
        id: candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact comparator dependencies from Ubuntu only
        run: |
          set -euo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile exact recovery-budget oracle
        run: python -m py_compile benchmarks/v030_zipfactor_v3_recovery_budget_oracle.py
      - name: Run exact level-3 recovery budget
        run: |
          mkdir -p benchmark-artifacts
          python -m benchmarks.v030_zipfactor_v3_recovery_budget_oracle \
            --work-root "$RUNNER_TEMP/v030-zipfactor-v3-recovery-budget" \
            --output "$GITHUB_WORKSPACE/benchmark-artifacts/v030-zipfactor-v3-recovery-budget.json"
      - name: Ratchet recovery inside strict Zstd size margin
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('benchmark-artifacts/v030-zipfactor-v3-recovery-budget.json')
          e=json.loads(p.read_text())
          assert e['schema']=='cmpct-v030-zipfactor-v3-recovery-budget-v1'
          c=e['contract']
          assert c['candidate_profile']=='zip-framing-factor-binary-control-v3'
          assert c['level']==3 and c['group_size']==7
          assert c['payload_body_copies']==1 and c['control_copies']==2
          assert c['ties_fail'] is True
          assert c['selector_change'] is False and c['release_credit'] is False
          assert e['release_credit'] is False and e['promotion_signal'] is False
          assert e['experiment_valid'] is True
          g=e['gate']
          assert g['passed'] is True
          assert g['clean_verified'] is True
          assert g['primary_corruption_recovers_from_tail'] is True
          assert g['tail_corruption_recovers_from_primary'] is True
          assert g['double_control_corruption_fails_closed'] is True
          assert g['recovered_identity_exact'] is True
          assert g['locality_within_8x'] is True and g['decode_unit_within_8mib'] is True
          s=e['sizes']
          assert s['base_v3'] < s['zstd19']
          assert s['recovery'] < s['zstd19'] and s['recovery'] < s['zip']
          assert s['recovery_overhead'] < s['zstd_headroom_before_recovery']
          assert s['zstd_headroom_after_recovery'] > 0
          Path('benchmark-artifacts/v030-zipfactor-v3-recovery-budget-candidate.txt').write_text(os.environ['EVIDENCE_HEAD']+'\n')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zipfactor-v3-recovery-budget-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            benchmark-artifacts/v030-zipfactor-v3-recovery-budget.json
            benchmark-artifacts/v030-zipfactor-v3-recovery-budget-candidate.txt
          if-no-files-found: warn
          retention-days: 90
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-v3-recovery-budget.yml

# Research-only. This freezes whether recovery fits the exact speed-oriented V3 candidate's very small Zstd
# byte margin. It cannot itself authorize dispatch, selector changes, platform claims, or release credit.
