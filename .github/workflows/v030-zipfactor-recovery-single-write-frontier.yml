# ci-lane: deep
name: CMPCT v0.30 ZIP-factor recovery single-write frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/v030_zipfactor_recovery_single_write_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_inmemory_verify_frontier.py'
      - 'benchmarks/v030_zipfactor_recovery_oracle.py'
      - 'benchmarks/v030_external_competitors.py'
      - 'experiments/entropygraph_v030_zipfactor_compact_v3.py'
      - 'experiments/entropygraph_v030_zipfactor_fused.py'
      - 'experiments/entropygraph_v030_zipfactor_eocd_parser.py'
      - '.github/workflows/v030-zipfactor-recovery-single-write-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-zf-recovery-single-write-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  single-write-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact candidate head
        shell: bash
        run: |
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$ACTUAL" > "$RUNNER_TEMP/v030-zf-single-write-candidate-sha.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact comparator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile frontier
        run: python -m py_compile benchmarks/v030_zipfactor_recovery_single_write_frontier.py
      - name: Run exact single-write frontier
        run: |
          python -m benchmarks.v030_zipfactor_recovery_single_write_frontier \
            --work-root "$RUNNER_TEMP/v030-zf-recovery-single-write" \
            --output "$RUNNER_TEMP/v030-zf-recovery-single-write.json"
      - name: Bind evidence to exact candidate and ratchet boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          evidence=root/'v030-zf-recovery-single-write.json'
          e=json.loads(evidence.read_text())
          sha=(root/'v030-zf-single-write-candidate-sha.txt').read_text().strip()
          e['candidate_git_sha']=sha
          evidence.write_text(json.dumps(e, indent=2)+'\n')
          assert e['schema']=='cmpct-v030-zipfactor-recovery-single-write-frontier-v1'
          c=e['contract']
          assert c['rounds']==11 and c['level']==3 and c['group_size']==7
          assert c['archive_grammar_changed'] is False
          assert c['recovery_semantics_changed'] is False
          assert c['legacy_bytes_cross_checked_each_round'] is True
          assert c['mandatory_inmemory_verify_inside_cmpct_timing'] is True
          assert c['ties_fail'] is True
          assert c['selector_change'] is False and c['release_credit'] is False
          assert e['experiment_valid'] is True and e['release_credit'] is False
          assert e['sizes']['cmpct'] < e['sizes']['zip'] and e['sizes']['cmpct'] < e['sizes']['zstd19']
          assert e['promotion_signal'] is e['strict_four_way_win']
          if e['promotion_signal']:
              assert e['medians_s']['direct_cmpct'] < e['medians_s']['zip']
              assert e['medians_s']['direct_cmpct'] < e['medians_s']['zstd19']
          PY
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v030-zipfactor-recovery-single-write-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/v030-zf-recovery-single-write.json
            ${{ runner.temp }}/v030-zf-single-write-candidate-sha.txt
          if-no-files-found: error
          retention-days: 90
      - name: CI topology self-check
        run: python tools/check_ci_topology.py .github/workflows/v030-zipfactor-recovery-single-write-frontier.yml

# Research-only construction frontier. Exact byte identity against the legacy recovery builder is required every
# round; no selector/release credit is granted until the complete strict comparator boundary is actually crossed.
