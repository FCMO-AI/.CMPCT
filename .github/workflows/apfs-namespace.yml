# ci-lane: fast
name: CMPCT APFS Normalized Namespace Court

on:
  pull_request:
    paths:
      - src/cmpct/reader.py
      - src/cmpct/path_policy.py
      - tests/test_v031_apfs_namespace.py
      - .github/workflows/apfs-namespace.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-apfs-o0-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apfs-alias:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Reject unbound checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real CMPCT and pytest
        run: python -m pip install -e ".[test]"
      - name: Run preregistered POSIX/macOS filesystem identity court
        run: python -m pytest -q -s --noconftest tests/test_v031_apfs_namespace.py
      - name: Preserve exact source and host
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD
          python -c "import os, platform, sys; print('HOST', os.name, platform.platform(), sys.version)"
