# ci-lane: fast
name: CMPCT1 ONE-G0.2 late minimizer rescue A/B

on:
  pull_request:
    paths:
      - "benchmarks/one/one_g02_late_minimizer_rescue.py"
      - "benchmarks/one/one_g02_late_minimizer_rescue_ab.py"
      - ".github/workflows/cmpct1-one-g02-late-minimizer-rescue-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct1-one-g02-late-minimizer-rescue-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Re-run ONE semantic boundary
        run: python -m pytest -q tests/one
      - name: Run paired late-rescue A/B
        run: |
          mkdir -p one-late-rescue-ab-artifacts
          python -m benchmarks.one.one_g02_late_minimizer_rescue_ab | tee one-late-rescue-ab-artifacts/one-g02-late-minimizer-rescue-ab.json
      - name: Retain exact-head paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-late-minimizer-rescue-ab-${{ env.EVIDENCE_HEAD }}
          path: one-late-rescue-ab-artifacts/
          if-no-files-found: error
