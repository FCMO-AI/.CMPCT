name: CMPCT v0.30 canonical r25 full qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-canonical-r25-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out production candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic full-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow reportlab python-docx openpyxl python-pptx numpy

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Run production-candidate semantic/recovery regression suite
        run: |
          pytest -q \
            tests/test_v030_geometry_safe.py \
            tests/test_v030_hierarchical_geometry.py \
            tests/test_v030_g5_entropy_lanes.py \
            tests/test_v030_canonical_v25_geometry.py \
            tests/test_v030_canonical_v25_recovery.py

      - name: Run full 15-workload canonical qualification
        run: |
          mkdir -p benchmark-artifacts
          # Footnote: this workflow is manual until the three-workload canonical survival gate passes.  It is
          # preregistered now so production qualification cannot be softened after seeing focused results.
          set -o pipefail
          python benchmarks/canonical_v25_full_qualification.py \
            --work-root benchmark-artifacts/r25-full-work \
            --output benchmark-artifacts/canonical-r25-full-qualification.json \
            2>&1 | tee benchmark-artifacts/canonical-r25-full.stdout.txt

      - name: Re-enforce full promotion contract independently
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('benchmark-artifacts/canonical-r25-full-qualification.json').read_text())
          c=data['contract']; t=data['totals']; rows=data['rows']
          assert data['schema']=='cmpct-v030-canonical-r25-full-qualification-v1'
          assert len(rows)==c['expected_workloads']==15
          assert t['workloads_regressed']==0
          assert all(row['portfolio_bytes'] <= row['r24_bytes'] for row in rows)
          assert t['portfolio_saving_vs_r24_bytes'] >= c['minimum_aggregate_saving_bytes']
          assert t['workloads_improved'] >= c['minimum_improved_workloads']
          assert t['logical_graph_drift_rows']==0
          assert t['self_locating_tail_rows']==15
          assert t['mechanism_gate'] is True
          print(json.dumps(t, indent=2, sort_keys=True))
          PY

      - name: Upload full qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cmpct-v030-canonical-r25-full-qualification
          path: benchmark-artifacts/
          if-no-files-found: warn
