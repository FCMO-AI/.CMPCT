# ci-lane: fast
name: CMPCT v031 Windows sentinel append semantics O1
on:
  push:
    branches:
      - agent/phased2-v031-windows-lease-append-semantics-o1-20261023
    paths:
      - 'tools/research_windows_sentinel_append_o1.py'
      - 'docs/v031-research/2026-10-23-windows-sentinel-append-o1-prereg.md'
      - '.github/workflows/v031-windows-sentinel-append-o1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-append-o1:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind O0 and O1 exact original sources and preregistration
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'source head mismatch' }
          if ((git hash-object tools/research_windows_sentinel_append_o1.py) -ne 'f2dea4ec1cafa156a14076ea270d4a49665a9c92') { throw 'O1 oracle source changed' }
          if ((git hash-object tools/research_windows_byte_range_lock_oracle.py) -ne '642e22092fdf39dc45782d2fd388f880bbd6c644') { throw 'O0 control source changed' }
          if (-not (Test-Path 'docs/v031-research/2026-10-23-windows-sentinel-append-o1-prereg.md')) { throw 'missing O1 prereg' }
      - name: Execute fresh Windows descriptor-append falsifier
        shell: pwsh
        run: |
          python tools/research_windows_sentinel_append_o1.py --output "$env:RUNNER_TEMP/windows-sentinel-append-o1.json"
          if ($LASTEXITCODE -ne 0) { throw 'O1 falsified; inspect negative artifact' }
      - name: Retain positive or negative decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-windows-sentinel-append-o1
          path: ${{ runner.temp }}/windows-sentinel-append-o1.json
          if-no-files-found: warn
