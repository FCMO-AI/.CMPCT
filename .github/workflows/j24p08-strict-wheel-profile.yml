# ci-lane: deep
# ci-cancel-policy: preserve-running-exact-receipt
# ci-pr-scope: latest-head-commit-gate
name: CMPCT J24P08 strict wheel no-.data publishing profile
on:
  pull_request:
    paths:
      - "tools/validate_cmpct_wheel_profile.py"
      - "tests/test_cmpct_wheel_profile.py"
      - "docs/v031-research/*j24p08*"
      - ".github/workflows/j24p08-strict-wheel-profile.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24p08-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  latest-head-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_court: ${{ steps.scope.outputs.run_court }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 2
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(tools/validate_cmpct_wheel_profile\.py|tests/test_cmpct_wheel_profile\.py|\.github/workflows/j24p08-strict-wheel-profile\.yml|docs/v031-research/.*j24p08.*)$'; then
            echo 'run_court=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_court=false' >> "$GITHUB_OUTPUT"
          fi
  strict-cmpct-wheel:
    needs: latest-head-impact
    if: needs.latest-head-impact.outputs.run_court == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 25 strict wheel and real pip/venv .data scheme adversaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m unittest discover -s tests -p test_cmpct_wheel_profile.py -v 2>&1 | tee j24p08-test-log.txt
      - name: Source/process receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform,sys
          from pathlib import Path
          paths=['tools/validate_cmpct_wheel_profile.py','tests/test_cmpct_wheel_profile.py']
          r={'source_sha':os.environ['EVIDENCE_HEAD'],'platform':platform.platform(),
             'python':sys.version,'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('j24p08-source-receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2))
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Preserve original hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24p08-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: |
            j24p08-test-log.txt
            j24p08-source-receipt.json
          if-no-files-found: warn
          retention-days: 30
