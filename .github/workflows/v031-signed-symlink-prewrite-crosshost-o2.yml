# ci-lane: fast
# A Linux Builder signs the r24 corpus once; three real Readers exercise it.
name: CMPCT v0.31 Signed Symlink Prewrite Cross-Host O2

on:
  pull_request:
    paths:
      - "src/cmpct/reader.py"
      - "tests/test_v031_signed_symlink_prewrite_r275.py"
      - "tools/v031_signed_symlink_crosshost_o2.py"
      - ".github/workflows/v031-signed-symlink-prewrite-crosshost-o2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-signed-symlink-crosshost-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-real-signed-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Verify candidate source binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "BUILDER_HEAD=$EVIDENCE_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual Builder and Reader
        run: python -m pip install -e ".[test]"
      - name: Create and authenticate Linux-signed r24 fixtures
        shell: bash
        run: |
          set -euo pipefail
          python tools/v031_signed_symlink_crosshost_o2.py build --dir signed-fixtures --head "$EVIDENCE_HEAD"
      - name: Preserve immutable input bytes for all target hosts
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-signed-symlink-o2-${{ env.EVIDENCE_HEAD }}
          path: signed-fixtures/
          if-no-files-found: error
          retention-days: 21

  verify-on-three-real-hosts:
    needs: build-real-signed-fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          clean: true
      - name: Verify exact source binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          echo "READER_HEAD=$EVIDENCE_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual CMPCT Reader
        run: python -m pip install -e ".[test]"
      - name: Download the exact signed input corpus
        uses: actions/download-artifact@v4
        with:
          name: cmpct-v031-signed-symlink-o2-${{ env.EVIDENCE_HEAD }}
          path: signed-fixtures/
      - name: Reject signed unsafe targets before unrelated regular-file writes
        shell: bash
        run: |
          set -euo pipefail
          python tools/v031_signed_symlink_crosshost_o2.py verify --dir signed-fixtures --head "$EVIDENCE_HEAD"
      - name: Preserve host-specific negative/positive boundary and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-signed-symlink-o2-receipt-${{ matrix.os }}-${{ env.EVIDENCE_HEAD }}
          path: signed-fixtures/crosshost-receipt.json
          if-no-files-found: warn
          retention-days: 21
