name: CMPCT engineering evidence

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate material-PR evidence dossier
        run: |
          mkdir -p evidence-artifacts
          set -o pipefail
          python tools/check_pr_evidence.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --event "$GITHUB_EVENT_PATH" \
            2>&1 | tee evidence-artifacts/engineering-evidence.txt

      - name: Retain evidence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-${{ github.sha }}
          path: evidence-artifacts/engineering-evidence.txt
          if-no-files-found: warn

  # New research workflows can exist on a long-lived frontier before GitHub registers them from the
  # default branch. Route them through this already-established PR workflow; each called workflow owns
  # an exact-head classifier, so ordinary synchronizations pay only the cheap classifier and preserved
  # scientific receipts remain bound to the source SHA that admitted them.
  r36-project-wait-owner:
    uses: ./.github/workflows/v030-r36-project-wait-owner.yml

  shifted-parent-phase-rss:
    uses: ./.github/workflows/v030-shifted-parent-phase-rss.yml

# Footnote: this gate validates that material work exposes a falsifiable evidence surface. It does not
# assign a numeric “genius” score; benchmark, conformance, safety and expert review remain the actual
# arbiters of technical quality. The retained diagnostic makes a failed structural gate independently
# inspectable without weakening the failure exit code.
