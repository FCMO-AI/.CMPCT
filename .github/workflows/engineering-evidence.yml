name: CMPCT engineering evidence

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate material-PR evidence dossier
        run: |
          mkdir -p evidence-artifacts
          set -o pipefail
          python tools/check_pr_evidence.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --event "$GITHUB_EVENT_PATH" \
            2>&1 | tee evidence-artifacts/engineering-evidence.txt

      - name: Retain evidence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-${{ github.sha }}
          path: evidence-artifacts/engineering-evidence.txt
          if-no-files-found: warn

  # Execution-plane bridge for the already-frozen R3 Builder experiment. The dedicated
  # v030-discovery-r3-product-ab workflow was introduced on this PR and therefore cannot
  # be relied on as a pull_request trigger until it exists on the base branch. Hosting the
  # exact frozen instrument here changes only where GitHub executes it; it does not change
  # corpus, comparator, repetitions, thresholds, interpretation, or decision law.
  v030-discovery-r3-product-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install pillow reportlab python-docx openpyxl python-pptx numpy

      - name: Run isolated worker unit guards
        run: python -m pytest -q tests/test_v030_discovery_neutral_worker.py

      - name: Execute frozen 15-row product A/B and repeated runtime targets
        run: |
          mkdir -p benchmark-artifacts
          set -o pipefail
          python benchmarks/v030_discovery_r3_product_ab.py \
            --work-root benchmark-artifacts/work \
            --output benchmark-artifacts/v030-discovery-r3-product-ab.json \
            2>&1 | tee benchmark-artifacts/v030-discovery-r3-product-ab.stdout.txt

      - name: Enforce frozen Builder decision law
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("benchmark-artifacts/v030-discovery-r3-product-ab.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert record["schema"] == "cmpct-v030-discovery-r3-product-ab-v1"
          assert record["source_commit"] == head
          assert record["frozen_prereg"] == "docs/v030-rnd/R25_DISCOVERY_SOURCE_GENERIC_R3_BUILDER_PREREG.md"
          assert record["totals"]["workloads"] == 15
          assert record["totals"]["byte_identical_rows"] == 15
          assert record["totals"]["runtime_targets"] == 3
          assert record["totals"]["max_selected_member_read_amplification"] <= 8.0
          assert all(row["byte_identical"] for row in record["rows"])
          assert all(row["bytes"] == row.get("bytes") for row in record["rows"])
          assert all(len(row["sha256"]) == 64 and len(row["tree_sha256"]) == 64 for row in record["rows"])
          assert record["decision"] == "PROMOTE_R3_PRODUCT_NEUTRALIZATION"
          PY

      - name: Public-surface guard
        run: python tools/public_surface_guard.py

      - name: Upload exact Builder receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-discovery-r3-product-ab-${{ github.event.pull_request.head.sha }}
          path: |
            benchmark-artifacts/v030-discovery-r3-product-ab.json
            benchmark-artifacts/v030-discovery-r3-product-ab.stdout.txt
          if-no-files-found: warn

# Footnote: this gate validates that material work exposes a falsifiable evidence surface. It does not
# assign a numeric “genius” score; benchmark, conformance, safety and expert review remain the actual
# arbiters of technical quality. The retained diagnostic makes a failed structural gate independently
# inspectable without weakening the failure exit code.
