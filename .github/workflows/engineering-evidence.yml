# ci-lane: fast
name: CMPCT engineering evidence

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate material-PR evidence dossier
        run: |
          mkdir -p evidence-artifacts
          set -o pipefail
          python tools/check_pr_evidence.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --event "$GITHUB_EVENT_PATH" \
            2>&1 | tee evidence-artifacts/engineering-evidence.txt

      - name: Retain evidence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-${{ github.sha }}
          path: evidence-artifacts/engineering-evidence.txt
          if-no-files-found: warn

# Footnote: deep research workflows that were originally routed through this established PR workflow are now
# registered independently. Keeping this gate fast prevents dossier-only metadata edits from fanning out costly
# exact-head scientific receipts while preserving structural evidence validation on every relevant PR event.
# This gate validates that material work exposes a falsifiable evidence surface. It does not assign a numeric
# “genius” score; benchmark, conformance, safety and expert review remain the actual arbiters of technical quality.
