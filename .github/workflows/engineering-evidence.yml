name: CMPCT engineering evidence

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate material-PR evidence dossier
        run: |
          mkdir -p evidence-artifacts
          set -o pipefail
          python tools/check_pr_evidence.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --event "$GITHUB_EVENT_PATH" \
            2>&1 | tee evidence-artifacts/engineering-evidence.txt

      - name: Retain evidence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-${{ github.sha }}
          path: evidence-artifacts/engineering-evidence.txt
          if-no-files-found: warn

  # R36 was introduced on the convergence PR itself, so GitHub did not discover
  # its new standalone workflow as a runnable PR workflow. Bridge exactly the
  # immediately preceding R36 retrigger commit through this established workflow;
  # later commits classify false and do not repeatedly spend the deep-run budget.
  r36-route-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: scope
        name: Bind one-shot R36 route bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          parent_changed="$(git diff-tree --no-commit-id --name-only -r HEAD^ || true)"
          printf '%s\n' "$parent_changed"
          if printf '%s\n' "$parent_changed" | grep -qx '.github/workflows/v030-r36-project-wait-owner.yml'; then
            echo 'run_r36=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_r36=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Bind frozen R32 substrate and R36 grammar
        if: steps.scope.outputs.run_r36 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0b1f3cd653f0e2489964b93cdd19fa8324adda2e HEAD
          for path in src/cmpct/builder.py src/cmpct/codec.py experiments/entropygraph_v030_release_product.py benchmarks/neutral_hostile_corpus_v1.py benchmarks/neutral_hostile_determinism_repair_v1.py benchmarks/v030_release_ablation_canonical.py benchmarks/v030_r32_regenerable_deflate_output_dead_zstd_elision.py; do
            test "$(git rev-parse 0b1f3cd653f0e2489964b93cdd19fa8324adda2e:$path)" = "$(git rev-parse HEAD:$path)" || { echo "R36 R32-substrate drift: $path" >&2; exit 1; }
          done
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.run_r36 == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        if: steps.scope.outputs.run_r36 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd gcc ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
      - name: Compile frozen R36 instrument
        if: steps.scope.outputs.run_r36 == 'true'
        run: python -m py_compile benchmarks/v030_r36_regenerable_deflate_project_wait_owner.py
      - name: Run frozen R36 project wait-owner attribution
        if: steps.scope.outputs.run_r36 == 'true'
        env:
          CMPCT_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/v030_r36_regenerable_deflate_project_wait_owner.py --work-root "$GITHUB_WORKSPACE/benchmark-artifacts/r36-work" --output "$GITHUB_WORKSPACE/benchmark-artifacts/r36-project-wait-owner.json"
      - name: Enforce frozen R36 completeness and decision law
        if: steps.scope.outputs.run_r36 == 'true'
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('benchmark-artifacts/r36-project-wait-owner.json').read_text())
          assert d['schema']=='cmpct-v030-r36-regenerable-deflate-project-wait-owner-v1'
          assert d['evidence_head']==os.environ['EVIDENCE_HEAD']
          assert d['repetitions']==3
          assert set(d['targets'])=={'full-backups','nested-only'}
          assert d['decision'] in {'PROJECT_WAIT_OWNER_LOCALIZED','PROJECT_WAIT_OWNER_DISTRIBUTED_OR_BELOW_FLOOR','PROJECT_WAIT_OWNER_UNRESOLVED','WAIT_INSTRUMENTATION_UNRESOLVED','SUBSTRATE_OR_SAME_RUN_IDENTITY_FAILURE'}
          for target in d['targets'].values():
              assert set(target['arms'])=={'release-all-exact','full-search','no-ordinary-zstd'}
              for arm in target['arms'].values():
                  assert len(arm['repetitions'])==3
                  assert all(row['strong_verify_ok'] for row in arm['repetitions'])
          if d['decision'] != 'SUBSTRATE_OR_SAME_RUN_IDENTITY_FAILURE':
              assert d['same_run_identity_ok']
          if d['decision']=='PROJECT_WAIT_OWNER_LOCALIZED':
              assert d['wait_instrumentation_ok'] and d['localized_project_owners']
              assert all(x['nested_wait_time_delta_s']>=0.010 and x['full_wait_time_delta_s']>0 for x in d['localized_project_owners'])
          PY
      - name: Upload immutable R36 evidence
        if: steps.scope.outputs.run_r36 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: v030-r36-project-wait-owner-${{ github.event.pull_request.head.sha }}
          path: benchmark-artifacts/r36-project-wait-owner.json
          if-no-files-found: error
          retention-days: 90

# Footnote: this gate validates that material work exposes a falsifiable evidence surface. It does not
# assign a numeric “genius” score; benchmark, conformance, safety and expert review remain the actual
# arbiters of technical quality. The retained diagnostic makes a failed structural gate independently
# inspectable without weakening the failure exit code.
