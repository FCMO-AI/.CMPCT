# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
name: v031 J24K05 VZIP physical projection and bounded selective reads
on:
  pull_request:
    paths:
      - 'src/cmpct/validation.py'
      - 'src/cmpct/codec.py'
      - 'tests/test_j24k05_vzip_projection_contract.py'
      - 'docs/v031-research/2026-10-27-j24k05-*'
      - '.github/workflows/v031-j24k05-vzip-projection-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j24k05-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  projection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact source and historical evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
          git hash-object src/cmpct/reader.py > evidence/reader-blob.txt
          git hash-object src/cmpct/validation.py > evidence/validation-blob.txt
          git hash-object src/cmpct/codec.py > evidence/codec-blob.txt
          git hash-object tests/test_j24k04_vzip_signed_geometry.py > evidence/historical-j24k04-blob.txt
          git hash-object tests/test_j24k05_vzip_projection_contract.py > evidence/candidate-court-blob.txt
          git hash-object tests/conformance/v24-virtual-zip.json > evidence/golden-stored-blob.txt
          git hash-object tests/conformance/v24-virtual-zip-deflate-mode1.json > evidence/golden-deflate-blob.txt
          python -V > evidence/python-version.txt
      - name: Install exact candidate product
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Execute signed wire and selective contract
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile src/cmpct/validation.py src/cmpct/codec.py tests/test_j24k05_vzip_projection_contract.py
          python -m pytest --noconftest -q -s tests/test_j24k05_vzip_projection_contract.py 2>&1 | tee evidence/j24k05-court.txt
      - name: Preserve original observations, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24k05-${{ matrix.os }}-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: warn
