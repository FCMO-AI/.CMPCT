# ci-lane: fast
name: CMPCT v031 serialized stale-journal mutation court
on:
  push:
    branches:
      - agent/phased2-v031-serialized-stale-journal-falsifier-20261023
    paths:
      - 'benchmarks/v031_serialized_stale_journal_court.py'
      - '.github/workflows/v031-serialized-stale-journal-court.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  stale-journal-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind authentic current transaction implementation and preregistration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/cmpct/transactions.py)" = "964f4dcf8c25cdd5885b6c43bbf3d92d16dd252c"
          test "$(git hash-object src/cmpct/reader.py)" = "e716233403dabd0966863c45635e18fa5ac6afb8"
          test -f docs/v031-research/SERIALIZED_STALE_JOURNAL_O0_PREREG.md
          git rev-parse HEAD
          git hash-object benchmarks/v031_serialized_stale_journal_court.py
      - name: Install unchanged CMPCT package
        run: python -m pip install -e '.[test,audio]'
      - name: Run real append_rename APIs with serialized physical generations
        run: |
          set -euo pipefail
          python benchmarks/v031_serialized_stale_journal_court.py > "$RUNNER_TEMP/v031-serialized-stale-journal.json"
          cat "$RUNNER_TEMP/v031-serialized-stale-journal.json"
          python - "$RUNNER_TEMP/v031-serialized-stale-journal.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              receipt=json.load(f)
          assert receipt['decision']=='SILENT_LOST_UPDATE_WITH_SERIALIZED_GENERATIONS'
          assert len(receipt['commits'])==2
          assert receipt['successful_public_returns']==2
          assert len(receipt['missing_renames'])==1
          assert receipt['physical_append_interleaving_allowed'] is False
          print('SCIENTIFIC NEGATIVE: serialized whole-generation appends do not protect stale logical snapshots')
          PY
      - name: Preserve independent negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-serialized-journal-negative
          path: ${{ runner.temp }}/v031-serialized-stale-journal.json
          if-no-files-found: warn
