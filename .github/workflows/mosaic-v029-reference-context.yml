# ci-lane: deep
name: CMPCT v0.29 one-hop reference context ceiling

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v029-reference-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-context-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic hostile-corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy==2.4.6

      - name: Build pinned memory-safe Preflate bridge
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml

      - name: Generate one hostile aggregate
        run: |
          mkdir -p benchmark-artifacts
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path=Path('benchmarks/resemblance_hostile_corpus_v1.py')
          spec=importlib.util.spec_from_file_location('cmpct_reference_context_hostile', path)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.build(Path('benchmark-artifacts/resemblance-hostile'))
          PY

      - name: Measure one-hop reference-context ceiling
        run: |
          set -o pipefail
          python experiments/entropygraph_v029_reference_context_oracle.py \
            benchmark-artifacts/resemblance-hostile \
            --work-root benchmark-artifacts/CMPCT_V029_Reference_Context_Oracle \
            --output benchmark-artifacts/mosaic-v029-reference-context-oracle.json \
            2>&1 | tee benchmark-artifacts/mosaic-v029-reference-context-oracle.stdout.txt

      - name: Enforce frozen locality and integrity contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-reference-context-oracle.json').read_text())
          assert r['schema'] == 'cmpct-v029-reference-context-oracle-v1'
          assert r['source_archive']['bytes'] > 0, r
          assert r['policy']['max_lsh_candidates_per_target'] == 8, r
          assert r['policy']['max_context_slice_bytes'] == 128 * 1024, r
          assert r['policy']['all_pairs_fallback'] is False, r
          assert r['policy']['context_targets_may_be_logical_bases'] is False, r
          assert r['policy']['context_targets_may_be_context_anchors'] is False, r
          s=r['selected']
          assert s['chain_free'] is True, r
          assert s['logical_base_free'] is True, r
          assert s['max_total_read_amplification'] <= 8.0, r
          assert s['max_context_only_read_amplification'] <= 4.0, r
          for row in s['rows']:
              assert row['context_slice_bytes'] <= 128 * 1024, row
              assert row['net_saving_bytes'] > 0, row
              assert row['worst_total_read_amp'] <= 8.0, row
              assert row['worst_context_only_read_amp'] <= 4.0, row
          # A negative result is valid evidence. Never move the preregistered gate after seeing bytes.
          print(json.dumps({'selected': s, 'research_gate_pass': r['research_gate_pass']}, indent=2))
          PY

      - name: Focused reference-context tests
        run: python -m pytest -q tests/test_v029_reference_context_oracle.py

      - name: Public-surface guard
        run: python tools/check_public_surface.py

      - name: Summarize one-hop reference-context ceiling
        if: always()
        run: |
          if [ -f benchmark-artifacts/mosaic-v029-reference-context-oracle.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark-artifacts/mosaic-v029-reference-context-oracle.json').read_text())
          print('## CMPCT v0.29 — one-hop reference-context ceiling')
          d=r['discovery']; s=r['selected']
          print(f"- attempt-5 source archive: **{r['source_archive']['bytes']:,} B**")
          print(f"- bounded LSH edges / positive exact edges: **{d['lsh_edges']} / {d['positive_exact_edges']}**")
          print(f"- selected context-coded targets: **{s['targets']}**")
          print(f"- exact net saving after transition charges: **{s['net_saving_bytes']:,} B**")
          print(f"- max total/context-only cold amp: **{s['max_total_read_amplification']:.3f}x / {s['max_context_only_read_amplification']:.3f}x**")
          print(f"- frozen >=128 KiB / >=8-target gate: **{'PASS' if r['research_gate_pass'] else 'REJECT'}**")
          print('- The emitted archive remains exact attempt-5 bytes; PASS authorizes an implementation experiment only.')
          PY
          fi

      - name: Upload reference-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v029-reference-context-${{ github.sha }}
          path: |
            benchmark-artifacts/mosaic-v029-reference-context-oracle.json
            benchmark-artifacts/mosaic-v029-reference-context-oracle.stdout.txt
          if-no-files-found: warn

# Footnote: this workflow exists only because the simpler shared-dictionary oracle missed its frozen gate.
# It preserves one-hop physical dependencies, bounded discovery, cold-access locality accounting and exact
# attempt-5 output bytes. A negative result is expected to terminate zstd-context tuning rather than move
# thresholds or deepen dependency chains.
