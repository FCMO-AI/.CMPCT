name: CMPCT v0.30 parallel candidate oracle

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/entropygraph_v030_parallel_candidate_oracle.py'
      - '.github/workflows/v030-parallel-candidate-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v030-parallel-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parallel-candidate-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      CMPCT_PREFLATE_BRIDGE: ${{ github.workspace }}/native/preflate-bridge/target/release/cmpct-preflate-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg gcc libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,test]'
          python -m pip install numpy pillow reportlab python-docx openpyxl python-pptx
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --manifest-path native/preflate-bridge/Cargo.toml
      - name: Build deterministic resemblance corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('benchmark-artifacts/parallel-candidate-source')
          root.mkdir(parents=True, exist_ok=True)
          base = bytearray((i * 29 + (i >> 7) * 11) & 0xff for i in range(512 * 1024))
          for n in range(48):
              data = bytearray(base)
              shift = (n * 977) % 8192
              if shift:
                  data = data[shift:] + data[:shift]
              for j in range(0, len(data), 16384):
                  data[j] ^= (n * 17 + j // 16384) & 0xff
              header = f'cmpct-v030-parallel-oracle:{n:03d}\n'.encode()
              data[:len(header)] = header
              (root / f'record-{n:03d}.bin').write_bytes(data)
          PY
      - name: Run byte-identical parallel candidate oracle
        run: |
          set -o pipefail
          python experiments/entropygraph_v030_parallel_candidate_oracle.py \
            benchmark-artifacts/parallel-candidate-source \
            --work-root benchmark-artifacts/parallel-candidate-work \
            --output benchmark-artifacts/parallel-candidate-result.json \
            2>&1 | tee benchmark-artifacts/parallel-candidate.stdout.txt
      - name: Enforce evidence integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmark-artifacts/parallel-candidate-result.json').read_text())
          assert data['schema'] == 'cmpct-v030-parallel-candidate-oracle-v1'
          assert data['decision'] in {'PASS', 'REJECT'}
          if not str(data.get('reason') or '').startswith('prefixgraph-ineligible:'):
              assert data['byte_identity'] is True
              assert data['g04_bytes'] > 0
              assert data['prefixgraph_bytes'] > 0
              assert len(data['g04_sha256']) == 64
              assert len(data['prefixgraph_sha256']) == 64
              assert data['minimum_saved_ratio'] == 0.20
              assert data['minimum_saved_s'] == 5.0
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Public-surface guard
        run: python tools/check_public_surface.py
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v030-parallel-candidate-${{ github.sha }}
          path: |
            benchmark-artifacts/parallel-candidate-result.json
            benchmark-artifacts/parallel-candidate.stdout.txt
          if-no-files-found: warn

# This workflow is research-only. A PASS does not modify the release scheduler or authorize a v0.30
# claim; promotion requires balanced repeated timing on the authoritative workload matrix.
