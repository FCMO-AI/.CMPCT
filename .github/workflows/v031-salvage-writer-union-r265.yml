# ci-lane: fast
name: CMPCT v031 salvage x Writer cross-owner court

on:
  pull_request:
    paths:
      - 'src/cmpct/transactions.py'
      - 'src/cmpct/cli.py'
      - 'tests/test_v031_salvage_writer_union_r265.py'
      - 'tests/test_recover_blob_candidates.py'
      - '.github/workflows/v031-salvage-writer-union-r265.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpct-v031-salvage-writer-union-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux-union:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin merged and inherited owner source identities
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git hash-object src/cmpct/transactions.py)" = "a3b9c3375ed19f0b37d40ee47ead7b5d5b8905ee"
          test "$(git hash-object src/cmpct/cli.py)" = "94bcd91af4ec8fa8282e3b1900d3c1d07a7a3235"
          test "$(git hash-object src/cmpct/reader.py)" = "c548a2ae4d650e928eb46ed1c2431423e49765b5"
          test "$(git hash-object docs/HARDENING.md)" = "574e9eb1dfcf2d9724482b767088e325e2fb37ad"
          test "$(git hash-object docs/V031_CANDIDATE_FINGERPRINT.json)" = "f806d96dba4750dead6746e078e596e848e6f201"
          git diff --exit-code
          printf 'HEAD=%s\ntransactions=%s\nreader=%s\n' "$EVIDENCE_HEAD" "$(git hash-object src/cmpct/transactions.py)" "$(git hash-object src/cmpct/reader.py)" > test-artifacts/sources.txt
      - name: Install real CMPCT with tests
        run: python -m pip install -e '.[test]'
      - name: Exercise cross-owner Writer x salvage and inherited POSIX courts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v031_salvage_writer_union_r265.py tests/test_recover_blob_candidates.py tests/test_v031_posix_writer_lease.py tests/test_v031_writer_reader_snapshot_composition.py --junitxml=test-artifacts/linux-focused.xml 2>&1 | tee test-artifacts/linux-focused.log
      - name: Benchmark inherited candidate framing and resource costs without changed comparator
        run: |
          set -euo pipefail
          python benchmarks/v031_salvage_stream_product_court.py > test-artifacts/salvage-sparse.json
          python benchmarks/v031_salvage_dense_stream_court.py > test-artifacts/salvage-dense.json
          cat test-artifacts/salvage-sparse.json
          cat test-artifacts/salvage-dense.json
      - name: Persist exact-head receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-salvage-writer-linux-union
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14

  windows-union:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin merged and inherited owner source identities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "test-artifacts" | Out-Null
          if ((git rev-parse HEAD) -ne $env:EVIDENCE_HEAD) { throw 'exact-head mismatch' }
          if ((git hash-object src/cmpct/transactions.py) -ne 'a3b9c3375ed19f0b37d40ee47ead7b5d5b8905ee') { throw 'merged source drift' }
          if ((git hash-object src/cmpct/cli.py) -ne '94bcd91af4ec8fa8282e3b1900d3c1d07a7a3235') { throw 'salvage CLI drift' }
          if ((git hash-object src/cmpct/reader.py) -ne 'c548a2ae4d650e928eb46ed1c2431423e49765b5') { throw 'Reader source drift' }
          @("HEAD=$env:EVIDENCE_HEAD", "transactions=$(git hash-object src/cmpct/transactions.py)") | Out-File -Encoding utf8 "test-artifacts/sources.txt"
      - name: Install real Windows CMPCT package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { throw 'package install failed' }
      - name: Exercise cross-owner salvage plus independent Windows Writer court
        shell: pwsh
        run: |
          # Required to avoid unrelated historical Linux-only conftest dependencies.
          python -m pytest --noconftest -q tests/test_v031_salvage_writer_union_r265.py tests/test_recover_blob_candidates.py tests/test_v031_windows_writer_product_o3.py 2>&1 | Tee-Object -FilePath "test-artifacts/windows-focused.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows source union failed; preserve negative' }
      - name: Persist exact-head receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpct-v031-salvage-writer-windows-union
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
