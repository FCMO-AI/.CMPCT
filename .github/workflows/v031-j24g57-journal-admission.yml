# ci-lane: fast
# ci-cancel-policy: cancel-obsolete
# Green specialized evidence means physical candidate admission parity, not release.
name: CMPCT J24G57 signed journal fail-closed admission court
on:
  push:
    branches:
      - agent/phased2-v031-j24g57-failclosed-journal-footer-20261030
  pull_request:
    branches:
      - agent/phased2-v031-j24g55-shared-journal-preflight-replay-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmpct-j24g57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-journal-admission:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      J24G57_EVIDENCE_DIR: evidence/physical
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source ancestry and durable identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/physical
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 83e9f2eb277f023186b646f667cd443b7108f268 HEAD
          git merge-base --is-ancestor cc780c4c12525a5bce1c8d4fa8517ffefb61f1c4 HEAD
          printf '%s\n' "$EXPECTED_HEAD" > evidence/head.txt
          for path in src/cmpct/reader.py src/cmpct/validation.py src/cmpct/journal_replay.py src/cmpct/transactions.py; do
            git rev-parse "HEAD:$path" >> evidence/source-blobs.txt
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and detached format tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . 'pytest>=8' 'zstandard>=0.22' 'msgpack>=1.0'
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          from pathlib import Path
          import cmpct.reader as reader
          import cmpct.validation as validation
          import cmpct.journal_replay as replay
          import cmpct.transactions as transactions
          for p,mod in (
              ('src/cmpct/reader.py',reader),
              ('src/cmpct/validation.py',validation),
              ('src/cmpct/journal_replay.py',replay),
              ('src/cmpct/transactions.py',transactions),
          ):
              assert Path(p).read_bytes().replace(b'\r\n',b'\n') == Path(mod.__file__).read_bytes().replace(b'\r\n',b'\n'), p
              print('SOURCE_EXACT',p)
          assert reader._apply_journal_ops is replay._apply_journal_ops
          assert validation._apply_journal_ops is replay._apply_journal_ops
          PY
      - name: Candidate physical admission and inherited replay regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --noconftest -q -s --junitxml=evidence/pytest.xml \
            tests/test_v031_j24g57_signed_journal_admission.py \
            tests/test_v031_j24g55_shared_journal_replay.py \
            tests/test_v031_j24g55_committed_footer_recovery.py \
            2>&1 | tee evidence/pytest.log
      - name: Independent physical wire authentication and tamper controls
        shell: bash
        run: |
          set -euo pipefail
          python research/j24g57/independent_referee.py evidence/physical \
            2>&1 | tee evidence/referee.log
          test -s evidence/physical/independent_referee.json
      - name: Preserve SHA-source and physical evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j24g57-admission-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
