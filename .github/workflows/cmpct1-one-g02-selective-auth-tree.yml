# ci-lane: fast
name: CMPCT1 ONE-G0.2 authenticated range Pareto
on:
  pull_request:
    paths:
      - "experiments/one/auth_tree.py"
      - "tests/one/test_auth_tree.py"
      - "benchmarks/one/one_g02_selective_auth_tree_pareto.py"
      - ".github/workflows/cmpct1-one-g02-selective-auth-tree.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cmpct1-one-g02-auth-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  auth-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.EVIDENCE_HEAD }}", clean: true}
      - name: Bind exact head
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository test dependency surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,audio]'
      - name: Run ONE semantic and authenticated-range boundary
        run: python -m pytest -q tests/one
      - name: Run frozen authenticated range Pareto
        run: |
          mkdir -p one-auth-tree-artifacts
          python -m benchmarks.one.one_g02_selective_auth_tree_pareto | tee one-auth-tree-artifacts/one-g02-auth-tree-pareto.json
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-g02-auth-tree-${{ env.EVIDENCE_HEAD }}
          path: one-auth-tree-artifacts/
          if-no-files-found: error
