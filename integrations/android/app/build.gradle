plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.fcmo.cmpct'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'ai.fcmo.cmpct'
        minSdk 23
        targetSdk 37
        versionCode 24
        versionName '0.24-android-preview1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // Footnote: build-native.sh places the Rust cdylib into these ABI-specific directories;
            // Gradle then packages the same conformance-tested core used by desktop/native clients.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
