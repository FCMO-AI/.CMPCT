plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.fcmo.cmpct'
    // Footnote: API 36 is the current stable Android platform. CMPCT uses no preview-only API 37
    // surface, so pinning stable compile/target SDKs keeps CI and distribution reproducible.
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'ai.fcmo.cmpct'
        minSdk 23
        targetSdk 36
        versionCode 24
        versionName '0.24-android-preview1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // Footnote: build-native.sh places the Rust cdylib into these ABI-specific directories;
            // Gradle then packages the same conformance-tested core used by desktop/native clients.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        androidTest {
            // Reuse builder-independent revision-24 byte oracles instead of inventing Android-only
            // fixtures. One fixed archive must mean the same bytes to Python, Rust C ABI, and Android.
            assets.srcDirs = ['../../../tests/conformance']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Footnote: the legacy android.test instrumentation classes are no longer on the current SDK test
    // compile classpath. Use AndroidX Test's current stable runner/core plus its JUnit4 extension so
    // emulator/device assertions exercise the same supported instrumentation stack Android documents.
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// Footnote: Android packaging must never silently fall back to a stale checked-in native library.
// Rebuild the shared Rust core for all declared ABIs before CMake/JNI packaging on every app build.
tasks.register('buildCmpctRust', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('build-native.sh').absolutePath
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('buildCmpctRust')
}
