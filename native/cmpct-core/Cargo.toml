[package]
name = "cmpct-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Memory-safe read-only core for CMPCT revision 24"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cmpct-native-inspect"
path = "src/bin/inspect.rs"

[dependencies]
rmpv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
