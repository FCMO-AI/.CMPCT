[package]
name = "cmpct-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Memory-safe read-only core for CMPCT revision 24"
repository = "https://github.com/FCMO-AI/.CMPCT"
homepage = "https://fcmo-ai.github.io/.CMPCT/"

# Footnote: Cargo's package.authors field is deprecated. Keep stewardship in durable URLs and explicit
# package metadata instead of reviving deprecated registry fields or inserting credit into runtime output.
[package.metadata.fcmo]
project-credit = "CMPCT by FCMO AI"
group-credit = "From the FCMO group"
steward-url = "https://github.com/FCMO-AI"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cmpct-native-inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "cmpct-native"
path = "src/bin/cmpct.rs"

[[bin]]
name = "cmpct-wavflac-conformance"
path = "src/bin/wavflac_conformance.rs"

[dependencies]
claxon = "0.4.3"
rmpv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
