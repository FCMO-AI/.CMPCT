[package]
name = "cmpct-hidden-zip-batch"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
crc32fast = "1.4"
# Creator-side research boundary: zlib-rs is the current flate2 fast pure-Rust backend.
# Keep it isolated from canonical cmpct-core until product evidence earns the dependency/safety cost.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"
