[package]
name = "cmpct-portable"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Shared memory-safe CMPCT r24/r25 portable reader surface"

# Footnote: this crate is a portability/conformance component, not a release-number claim. It deliberately
# delegates revision 24 to the mature cmpct-core instead of copying that parser. Canonical CMP25 identities
# use the same bounded reconstruction grammar as their CMPNX research predecessors, with filesystem/product
# semantics layered above the graph reader rather than forked into Android, CLI, or ABI-specific parsers.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cmpct-portable"
path = "src/bin/cmpct-portable.rs"

# `cargo clippy --all-targets` compiles both the production library and its cfg(test) library target and, on the
# current Rust/Clippy toolchain, `duplicate_mod` reports the same source modules as duplicate loads across those
# target compilations. They are not declared twice inside either crate: the ordinary library build and
# `cargo test --lib` both compile cleanly, and the release authority separately runs the full Rust test suite.
# Keep every other Clippy warning denied by CI while narrowly neutralizing this cross-target bookkeeping lint.
[lints.clippy]
duplicate_mod = "allow"

[dependencies]
cmpct-core = { path = "../cmpct-core" }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
preflate-container = { git = "https://github.com/microsoft/preflate-rs", rev = "3bcd33441849a8a25d2b26077128f4e3a88d071b", package = "preflate-container", default-features = false }
rmpv = "1.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
