[package]
name = "cmpct-portable"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Shared memory-safe CMPCT r24/r25 portable reader surface"

# Footnote: this crate is a portability/conformance component, not a version claim. It deliberately
# depends on the mature revision-24 core instead of copying that parser, while the two v0.30 research
# grammars remain isolated behind one bounded dispatcher until slot-00 decides the final r25 profile.
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cmpct-portable"
path = "src/bin/cmpct-portable.rs"

[dependencies]
cmpct-core = { path = "../cmpct-core" }
crc32fast = "1"
preflate-container = { git = "https://github.com/microsoft/preflate-rs", rev = "3bcd33441849a8a25d2b26077128f4e3a88d071b", package = "preflate-container", default-features = false }
rmpv = "1.3"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
